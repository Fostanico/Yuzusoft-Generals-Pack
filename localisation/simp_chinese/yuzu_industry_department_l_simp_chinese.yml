 yzbonds_event.1.a: "继续债券发行"
 we_choice_to_contiune_yz_bonds: "我们选择了继续发行债券，\n我们获得£GFX_yz_money §Y3000§!的债券，£GFX_yz_money §Y1000§!的额外需偿还本金，以及0.05%额外周利息"
