 we_choice_to_replay_yz_bonds: "我们选择支付全部债务，一共：£GFX_yz_money [?bond_we_need_to_repay|.0+Y]柚子币。"
 yzbonds_event.1.c: "偿还本轮债券（仍可继续发行）"
