 yz_bond_help_title_text: "柚子经济部债券运营手册"
 yz_bond_help_left_text: "§Y一、债券不是免费的柚子币§!\n债券能让我们提前动用未来收入：资金立刻到账，债务则在今后的月结算中逐步偿还。同一时间只能维持一份合同。发行前先看清§Y到账、本金、最低月还本和预计月支出§!，不要让一时的繁荣掏空下个月的钱包。\n\n§Y二、决定我们要筹多少钱§!\n§Y目标发行量§!是希望卖出的规模，§Y承诺年利率§!决定市场愿意认购多少。认购率为40%加利率的十倍，最低60%、最高190%；2%/6%/10%/15%分别可卖出目标的60%/100%/140%/190%。实际认购额既是到账，也是新增本金。低利率便宜但筹资少，高利率来钱快，却会留下更大的本金和利息。\n\n§Y三、每个月怎样还钱§!\n§Y最低月还本§!是合同底线，不能调低；§Y计划月还本§!是我们希望主动偿还的额度。支付后还能守住现金缓冲时，经济部才按计划多还，否则退回最低额。承诺利率在签约时锁定；实际利率低于承诺会把差额滚入债务并损伤信用，高于承诺则能用额外利息换取信用。"
 yz_bond_help_middle_text: "§Y四、三种债券各有用途§!\n稳健债券提供§G8%§!稳定度与§G-5%§!生活消费品工厂，发展债券提供§G12%§!建造速度与§G8%§!民用工厂产出，战时债券提供§G10%§!战争支持度及§G12%§!军工、船坞产出。当前合同与临时政策的国家修正统一显示在§Y“柚子经济部”§!民族精神中；合同或政策结束，对应增益也会撤回。\n\n§Y五、让[YZ_bond_management_institution]替我们做多少§!\n§Y手动§!由玩家决定全部参数；§G自动偿债§!把还本、实际利率、现金缓冲、缓付、追加销售和到期选择交给[YZ_bond_management_institution]，但不会自行发行新合同；§C全自动§!则连发行时点、规模、承诺利率和券种一并托管。[YZ_bond_management_institution]每月检查基础现金流、三个月运营资金、债务收入比、信用、工厂增长、长期投资和战争。现金紧张时先守住运营，债务沉重时主动去杠杆，临近到期且现金允许时加快还本；只有全自动才会在确有资金缺口时发行。\n\n§Y六、授权风格不是死命令§!\n自适应允许[YZ_bond_management_institution]自行判断；保守更看重现金和降债；均衡兼顾发展与偿付；扩张会在经济健康时建立发展资金。无论选择哪一种，流动性危机和战争都拥有更高优先级。自动偿债与全自动都会接管还本、利率、缓冲、缓付、追加销售和到期处理；发行量、承诺利率和券种只在全自动期间才由机构决定。切回手动即可重新亲自调整。"
 yz_bond_help_right_text: "§Y七、资金吃紧时别急着掀桌§!\n§Y协商缓付§!跳过下一次还本，但利息会滚入债务且信用-2。§Y追加销售§!立刻取得预计认购额20%的资金，却会形成到账额110%的本金。四种政体各有一项非常手段：民主主义抽取市场结果；共产主义以消费压力组织产业偿债；中立主义牺牲信用强制置换；法西斯以120日胜利公债押注战果。准确概率与代价请看按钮提示。\n\n§Y八、到期之前别闭着眼睛§!\n到期时可以清偿、展期一次或重组。展期令债务+15%、月还本+50%、信用-15，且不能再次展期；重组会清空柚子币并带来一年危机。点图逐月记录48个月前至本月的剩余债务，最右侧始终是本月。点位持续抬头，就该缩减下一轮发行、加快还本或暂停新投资。\n\n§Y九、第一次发行怎么设§!\n不想拿计算器时，可先用§Y5000目标、6%承诺利率、1000现金缓冲§!，再开启自动偿债。信用达到50且准备扩产时，发展债券通常更合适。观察两次月结算：若柚子币持续减少、债务点位继续上扬，就先提高还本或缩小下一轮发行，再考虑全自动托管。"
