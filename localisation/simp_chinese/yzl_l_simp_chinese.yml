 yzl_history_brief: "§L2026.9.10§!\nRIDDLE JOKER 第二阶段\n§L2026.9.1§!\nRIDDLE JOKER 第一阶段\n§L2026.8.30§!\n亚托莉：婚约与伊甸"
 yzl_history_content: "§W历史更新§!\n§g按时间倒序 · 10 期§!\n\n§L2026.9.10§!\n§WRIDDLE JOKER 第二阶段§!\n\n• 新增特工 Levy 9 和 Levy 6；招募 Levy 9 后解锁意识形态宣传行动。\n• 取消核心圈重选的时间限制。\n• 新增彩蛋内容，修复多项问题。\n• 减少部分实时判定，改善运行性能。\n\n\n§L2026.9.1§!\n§WRIDDLE JOKER 第一阶段§!\n\n• 重制 RIDDLE JOKER 旧角色特质，调整羽月、绫濑与七海顾问属性，新增茉优理论家。\n• 为绫濑、羽月、七海与茉优新增将领技能，调整研究所的星幽能力强化特质。\n• 新增动态开场动画与动态决议背景。\n• 更新芳乃工业债券机制。\n• CIALLO 局新增吹喇叭功能。\n• 回滚自行火炮相关改动。\n• 补充文案和彩蛋，修复多项问题。\n\n\n§L2026.8.30§!\n§W亚托莉：婚约与伊甸§!\n\n• 新增亚托莉结婚决议与结婚事件。\n• 新增亚托莉的伊甸建设决议。\n\n\n§L2026.8.11§!\n§W三语本地化与逻辑优化§!\n\n• 修复式部茉优科学家生成错误。\n• 修复柚子角色防俘机制错误扩展到全部将领的问题。\n• 增加英文与日文本地化。\n• 减少磁盘占用，优化代码逻辑。\n\n\n§L2026.8.2§!\n§W天色幻想岛与军事改革§!\n\n• 重制天色幻想岛旧角色特质，调整部分过强将领，新增缇娅军事顾问。\n• 在柚子社军校中新增军事改革内容。\n• 新增工业企业“牙与爪的兽亭”。\n• 将领招募 UI 支持移动。\n• 更换天色幻想岛开场 BGM 与开幕图。\n• 优化代码逻辑与运行稳定性，修复多项问题。\n• 补充文案与彩蛋内容。\n\n\n§L2026.7.4§!\n§WDR 重制与千禧装备适配§!\n\n• 重制 DR 旧角色特质，新增“吸血鬼部队”陆军精神，为吸血鬼角色新增技能。\n• 新增美羽顾问、大房妃依里将领，以及 as:9nine 的如月结那彩蛋将领与军事顾问。\n• 调整彩蛋内容，从海军将领一键招募中移除群主角色。\n• 柚子制造商兼容千禧黎明的装备。\n• 更换 DR 开场 BGM 与开幕图，修复部分问题。\n\n\n§L2026.6.14§!\n§W千恋万花与角色专属决议§!\n\n• 重制千恋万花旧角色特质，调整丛雨、芳乃顾问及领导人数值，以及茉子、丛雨军事顾问数值。\n• 调整两个柚子陆军精神与丛雨吃芭菲决议。\n• 新增伴侣复仇决议：已结婚角色负伤后解锁。\n• 新增虎太郎与赤诚两个角色。\n• 补充管乐恋曲角色特质，新增虾的军事顾问。\n• 调整亚托莉数值。\n• 柚子社军校新增精通度获取决议。\n• 增加芳乃工业化资源开采决议的资源产量。\n• 新增喵都征收、春风“天意”与琉璃“动物朋友”决议；后者可获得象骑兵编制。\n• 更换千恋万花开场 BGM 与开幕图，补充文案、调整彩蛋并修复问题。\n\n\n§L2026.6.8§!\n§W佐奈生日与婚后互动§!\n\n• 加载图更换为佐奈生日贺图。\n• 新增婚后互动 UI，首批开放佐奈。\n• 新增佐奈自动生日决议与新技能。\n• 修复部分问题。\n\n\n§L2026.5.9§!\n§W魔宴重制与 BMI 改版§!\n\n• 重制魔宴旧角色特质；翻新 BMI 机制，移除一天冷却，允许同日多次使用。\n• 调整宁宁、美咕噜政府顾问和美咕噜、憧子军事顾问数值。\n• 新增“超自然研究所”工业企业与䌷的核心圈。\n• 调整宁宁、䌷的技能及宁宁领导人数值。\n• 调整起爆器支援连与车载起爆器数值。\n• 更换魔宴开场 BGM 与开幕图，调整彩蛋并修复问题。\n\n\n§L2026.4.29§!\n§W海军标准化与数值修正§!\n\n• 新增海军标准化决议。\n• 调整部分角色数值，修复角色数值错误。\n• 补齐缺失文案，新增彩蛋并修复问题。\n• 修正抽卡中超级佐奈出现概率异常的问题。"
