 yzl_update_content: "§Y柚子将领包 更新日志 2026.9.21§!\n\n1、修复了核心圈头像在政治点小于120时变成灰白的bug\n2、修复了错误地展示通用装备的bug\n3、修复了一些特质的问题\n\n§Y碎碎念§!\n自从24年8月份本mod创立至今已经度过了两年的时光了，我们经过各种努力，终于才有了今天的样子。我们十分感谢那些支持咱们mod的朋友，正是有了你们的关注和支持咱们才能坚持下去。今后我们还会更加努力地更新mod，为大家带来更好的游戏体验！\n\n目前创意工坊内我放了一个可以反馈bug和建议的文档链接，还请大家有什么奇思妙想都往里面加！\n- ps：多来点老柚子厨帮我们出老角色的特质和机制求求了\n\n作者的话：我们mod有一些功能属于未来科技（以及友商作品角色），所以数值可能有些超模（来自另一款gal的某位学姐：嘿嘿嘿），所以建议根据难度选择你要开的功能，获得较好的游戏体验，我们还在修改中，希望大家可以提出建议！\n\n欢迎加群讨论：967395223\n下方为本mod聊天群二维码！\n\n\n\n\n\n\n\n\n\n£start_ui_qun_code\n\n\n\n\n\n\n\n\n\n\n欢迎大家进群反馈游戏中遇到的任何问题或者就单纯来唠唠嗑喵\n\n也可以前往 GitHub 提交 Issue，反馈问题或提出建议：\nhttps://github.com/Fostanico/yuzumod"
 yzl_welcome_title: "欢迎回来，指挥官"
