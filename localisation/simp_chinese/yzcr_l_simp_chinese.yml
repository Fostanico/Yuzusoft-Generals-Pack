 yzcr_help_tt: "查看路线指南，再次点击收起。右键可关闭招募窗口。"
 yzcr_choice_sprite: "GFX_yzcr_senren_choices"
 yzcr_help_body: "芳乃：钓鱼 > 就是不行 > 安抚朝武。\n茉子：不好说 > 挖野菜。\n丛雨：单独行动 > 摸摸头。\n蕾娜：我觉得很可爱 > 钓鱼 > 既然你都这么说了……\n小春／芦花：先招募一名主线角色，再选择说实话与相信小春；避开其他已满足的主线，最后选择想看谁的笑容。\n只有选择钓鱼，才会出现委托廉太郎的选项。\n其他选项可以自由选择。\n每位新角色消耗10政治点；已有角色不重复招募或扣费。"
 yzcr_rj_choice_sprite: "GFX_yzcr_riddle_choices"
 yzcr_rj_background_sprite: "GFX_yzcr_riddle_backgrounds"
 yzcr_rj_help_body: "绫濑：先去学生会办公室 > 跟平时一样 > 茉优学姐。\n七海：向七海搭话 > 看七海的泳装 > 好好夸她两句 > 先去研究室；最后任选。\n羽月：看二条院同学的泳装 > 二条院同学。\n茉优：继续实验 > 先去研究室 > 茉优学姐。\n千咲：先招募一名本作主线角色，再选看七海的泳装 > 追问 > 壬生同学；避开七海路线即可。\n普通结局：同时迎来绫濑、茉优、羽月和千咲。\n只有本作主线招募成功后，才会出现「追问」。\n先去研究室会跳过用餐选择，按「偶尔换换口味」处理。\n每位新角色消耗10政治点；已有角色不重复招募或扣费。"
