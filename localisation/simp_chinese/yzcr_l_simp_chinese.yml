 yz_choice_recruit.1.t: "选择招募方式"
 yz_choice_recruit.1.desc: "要体验原作的选项路线吗？\n\n旧方式：直接点击SD小人招募。\n新方式：选择原作选项，走完路线后招募对应角色。\n\n选择本局不再询问后，千恋万花和RIDDLE JOKER共用这项偏好，存档会保留选择。招募费用与角色效果沿用正式版；小春和芦花的新路线直接招募本人。"
 yz_choice_recruit.1.a: "旧方式：点击SD小人招募"
 yz_choice_recruit.1.b: "新方式：体验选项路线"
 yz_choice_recruit.1.c: "旧方式，本局不再询问"
 yz_choice_recruit.1.d: "新方式，本局不再提示"
