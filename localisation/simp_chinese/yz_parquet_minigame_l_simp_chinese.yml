l_simp_chinese:
 yz_parquet_minigame: "PARQUET · 扫雷挑战"
 yz_parquet_minigame_desc: "沿着数字寻找线索，避开十颗雷。首次完成挑战后，梨乃与翼将一同加入，并迎来两个人的白天。"
 yz_parquet_open_table: "开始 / 继续扫雷挑战"
 yz_parquet_open_table_desc: "初级棋盘：9×9，10颗雷。首击及相邻格安全，翻开全部71个安全格即可获胜。\n\n每盘胜利奖励5政治点，次数不限。本局游戏中首次挑战通关，还将招募茨木梨乃与城门翼并播放双人超事件；招募与超事件只触发一次。\n\n收起棋盘会保留进度；与核心圈的自由游玩入口互相切换时，会开始新棋盘。"
 yz_parquet_debug_table: "测试：载入扫雷挑战棋盘"
 yz_parquet_debug_finish: "测试：完成扫雷挑战"
 yz_parquet_debug_finish_desc: "通过实际翻格流程完成挑战，检查首次通关招募与超事件。仅调试模式显示。"
 yz_minesweeper_freeplay_tt: "打开扫雷"
 yz_parquet_handover.0.t: "要玩一个小游戏吗"
 yz_parquet_handover.0.desc: "这次来一局经典扫雷吧：9×9的棋盘，十颗雷，第一步保证安全。\n\n选择游玩后，在决议面板的“PARQUET · 扫雷挑战”中开局。每盘胜利奖励5政治点；首次挑战通关还将招募梨乃与翼，迎来她们的双人好结局。\n\n也可以跳过小游戏，直接让两人加入。"
 yz_parquet_handover.0.a: "玩！去决议里开一局。"
 yz_parquet_handover.0.b: "这次跳过，直接迎接她们。"
