 sairi_event.11.t: "Magical Girl Kohibari, Transform!"
 sairi_event.11.d: "There have been quite a few oddly dressed people lately; you'd think a comic convention was being held at headquarters. But I think, little Kohibari, you don't need to follow the trend.\nThough she was flustered and noisy, looking embarrassed, the outfit suits her quite well no matter how you look at it... huh? What are those two things on her head — horns? This cosplay is pretty dedicated.\n(pat pat, squeeze squeeze) \"Aaaaaah it tickles so much, don't move!!\" Kurume's slap landed squarely on your right cheek, and your vision went black.\n\nSo it's not cosplay?.......\n\"Stop fooling around! I'll get really angry! Where's your morality? Your shame?!\""
 sairi_event.11.a: "One break — the Sleeping Dragon Emerges"
 sairi_event.11.b: "Just plain cosplay"
 sairi_event.12.t: "A Journey Heart to Heart"
 sairi_event.12.d: "Little Kohibari is a genius girl — everyone thinks so, and so do I. But there's one thing she's silly about: she fumbles all over herself putting on her expedition gear.\nKurume hurriedly tugged here and pulled there, as if she'd forgotten I was still beside her. Reaching out, I helped her get it sorted in a few quick motions, and at last she was ready to go.\nI'll head out first, then.\nHey — who's tugging my sleeve?\nLittle Kohibari hopped out from behind. \"Let's go together. That's not how you show you think I'm clumsy.\" She stretched herself out in a big lazy stretch. \"Another world is dangerous, you know. I wonder if I can protect you.\"\n\"Then don't get lost. If we get separated, it's over.\" \"Mm.\" Little Kohibari's face seemed to turn a bit red — probably my imagination.\n\"Let's never be apart from now on, okay? I don't want to lose you. If we got separated, I'd be sad.\""
 sairi_event.12.a: "Let's keep walking together in step!"

