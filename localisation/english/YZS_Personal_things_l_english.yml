###乃爱事件链
 noa_event.1.t: "An Angel Descends?"
 noa_event.1.d: "...Just as I was about to give up, light suddenly descended. Not the light of crimson flames — light like the sun, and I could see white feathers. Like dancing snow, pure white feathers drifted down. Where I looked up — there was an angel."
 noa_event.1.a: "A real angel?"
 noa_event.1.b: "I must be dreaming"
 noa_event.2.t: "Chips and Cola!"
 noa_event.2.d: "The angel munched on chips, sipped cola, and elegantly immersed herself in manga. She can even use chopsticks — probably taught by Amane. She really does seem to enjoy it. Yesterday she'd had a sacred air about her, truly like an \"angel\"... now she's suddenly become so worldly."
 noa_event.2.a: "What a gluttonous angel"

 noa_event.4.t: "Buy Clothes for Noa"
 noa_event.4.d: "To help everyone who came from another world adapt to life here, we decided to go to the mall to buy everyday clothes."
 noa_event.4.a: "Look at Noa"
 noa_event.4.b: "Rest a while"
 noa_event.101.t: "Fumika?"
 noa_event.101.d: "I never expected to run into Fumika here. In everyday clothes, she gives a completely different impression than in the classroom — very cute."
 noa_event.101.a: "Teacher, you smell nice"
 noa_event.5.t: "cancanneednewnew"
 noa_event.5.d: "\"But I have to say... I'm an angel, and I'm not familiar with human life.\"\n\"To be honest, I've never seen the real thing.\"\n\"So... I want to see it.\"\n\"Huh?\"\n\"The real thing. I want to see it!\"\n\"What?!\"\n\"Tsk, don't misunderstand! This is just my duty as an angel, and it's not an immoral thought! Absolutely not!\"\n\"...\"\n\"Why aren't you saying anything!\""
 noa_event.5.a: "Agreed"
 noa_event.5.b: "No way, brother-love!"
 noa_event.8.t: "The Beach!"
 noa_event.8.d: "...\n\"Don't overthink it. If anything, I feel like I've been a bother — I'm sorry, Noa.\"\n\"Not at all. I'm happy too. Not just coming to the beach — I get to learn so many things I didn't know.\"\n\"For me... this is the first time, playing like this... eating delicious food.\"\n\"Meeting you and experiencing all sorts of things with you — it's all been fun.\"\n\"I see. That's good, then.\"\n\"Mm-hm.\"\nThe smile Noa showed was more childlike than usual. Coming to the beach was truly wonderful."
 noa_event.8.a: "How lovely"
 noa_event.9.t: "Something Puzzling"
 noa_event.9.d: "We wiped our sweat in the shade of a tree and opened the ice cream we'd just bought.\nI pulled the ring and cut off the top.\n\"Mm — oh, surprisingly easy to cut off.\"\nAfter confirming my action, Noa also cut off the top and pressed her lips to it.\n\"Hmm? Hmm? This is harder to eat than I imagined.\"\n\"You have to squeeze and press it. By the way, I chew it too.\"\n\"Squeeze... like this? My hand's a bit cold... mm... mm!\"\n\"It came out! Crisp and refreshing!\"\nNoa's eyes lit up as she happily reported the news.\n······\n\"As Noa said, there is something on my mind.\"\n\"The dream story from this morning was just as I told you. It's just... I didn't tell Noa.\"\n\"The valkyrie I saw in the dream looks very much like Noa.\"\n\"Not parent and child, nor sisters — you could only think they were the same person, so alike are they.\"\n\"Mm.\"\n\"This can't be just a coincidence, can it?\"\n\"\"I'm surprised I could laugh at the end.\"\"\n\"That should be what the Demon King said at the end.\"\n······\n\"I was created through magical technology.\"\n\"—No. It was my past life. The valkyrie.\""
 noa_event.9.a: "Noa......"
 noa_event.11.t: "A Date"
 noa_event.11.d: "\"Look, Noa, point it this way.\"\nThe fireworks in Noa's hands lit up the night shore.\nNoa watched the shimmering light with joy.\n\"So these are fireworks?\"\n\"Fireworks are so beautiful. Even just watching them... mm, it makes me happy.\"\n\"Noa is even more beautiful.\"\n\"Haha... even coming from the one I love, that won't make me happy.\"\n\"Why not?!\"\n\"Because it sounds like you're just joking.\"\n\"Doesn't your heart race?\"\n\"Even I won't have my heart race from that line. If anything, I find it amusing.\"\n\"I see.\"\n\"Thank you. I had a lovely time on today's date, including the fireworks.\"\n\"I'm glad too.\"\n\"It looks prettier when you spin it like this.\"\n\"Me too, me too — watch this, watch this~\"\n\"Oh! Amazing, that move. I want to try it too.\"\n\"I hope time like this can last forever.\""
 noa_event.11.a: "\"So let's keep going — creating more happy times together, just the two of us.\""
 noa_event.12.t: "Noa Is Acting a Bit Strange"
 noa_event.12.d: "\"May I come in?\"\n\"You're here... hehe.\"\nSeeing Noa's smile, different from her usual one, I couldn't help my heart racing.\n\"About sleeping together...\"\n\"Tonight I'd be lonely alone, so... may I?\"\n\"Of course. No need to ask.\"\n\"It feels strange, Noa acting so clingy.\"\n\"Then... is it not okay?\"\n\"Of course it is.\"\n\"I'm glad.\"\nSmiling, Noa drew closer.\nStep by step, she approached me.\nAt the limit of closeness, Noa tightly embraced my body.\n\"Shall we do it?\""
 noa_event.12.a: "Noa, you're acting strange"
 noa_event.12.b: "Let's go all out and have a grand time!\n§RWe do not recommend anyone choose this§!"
 noa_event.10001.t: "Something's Wrong!!!"
 noa_event.10001.d: "...\n\"Child, my child\"\n\"The Demon King's child\"\n\"——!?\"\nThe excitement of a moment ago cooled in an instant.\nThis atmosphere, it feels like I've seen it somewhere...\nMiss Mikuni!?\nWait — does this mean the current Noa is...?\nI immediately tried to flee from Noa.\nBut my body could not move freely.\nSeeing me like this, Noa giggled.\n\"Well then, let's do it once more.\"\n\"Hehehe\""
 noa_event.10001.a: "§RBAD END§!"
 noa_event.13.t: "The Sudden Realization"
 noa_event.13.d: "I held her small body tight.\nAs usual... no, tighter, much tighter than before.\n\"Huh? That's too much strength; it hurts... a little.\"\n\"Calm down. I won't run away.\"\nEven though Noa felt pain, I would not relax my arms.\n\"It hurts... ah!\"\nI closed my eyes and focused my consciousness inward.\nIn the deep, vast, endless darkness, a faint crimson light flickered.\nPlease! Cleanse, give me strength! Return Noa to normal!\n\"What is this?! What on earth is this?!\"\n\"Please return to normal, Noa...\"\n\"Return to normal, what does that mean—\"\nBefore Noa could answer, something inside me burst.\nMy vision went white, and strange tinnitus shook my brain.\n\"Huh? Ah... why... am I...? Something like this...?\"\n\"Why...! Why would I want to host the Demon King inside my own body...!!\"\n\"Noa, have you recovered?!\"\n\"I think I've recovered. The command binding me has been blown away by magic power... I believe so.\"\n\"The voice in my head... has disappeared for now...\"\n......\n\"The one who manipulated me was... the one who created me.\"\n\"Th-that can't be—\"\n\"I believe it was the people who created the valkyrie.\""
 noa_event.13.a: "Damn, I was almost deceived again"
 noa_event.14.t: "Revenge"
 noa_event.14.d: "......\n\"Yes, I could call you my parents. It is because of your research that I was born.\"\n\"In cruel experiments, my body was forced to grow, I was brainwashed into an enemy of the demon race, I caused much harm, and I became a tool.\"\n\"In the end, even after death, I was continued to be used as a tool.\"\n\"Because of your research, I hold anger toward the demon race, but...\"\n\"Now, I am angrier at you than at the demon race. That is only natural, is it not?\"\n\"I will... bring you to this world of the dead with my own hands.\"\n\"So, what comes next is merely venting — just venting my frustration. So please, give up.\"\n\"If you must hate, hate the foolishness of those who created me and took part in the inhumane research.\"\n\"AAAAAAAHHHHHHH!!\"\nWith the scream, lightning flashed, the air split, the earth shook, and violent thunder roared.\nAfter receiving this blow, it is impossible to still be alive.\nOnly \"if one received this blow\" — that is all."
 noa_event.14.a: "Battle — awesome!!!"
 noa_event.15.t: "A New Life"
 noa_event.15.d: "\"I'm happy.\"\nNoa said joyfully, turning around to look back.\nJust like that voice, Noa's face broke into a full smile.\n\"Truly, I'm happy.\"\n\"To meet you, to be able to love someone, to obtain happiness.\"\n\"So, thank you.\"\n\"I am very happy right now, and I will not give up the happiness I obtained for the first time.\"\n\"So, I hope you too... absolutely never leave me.\"\n\"I love you... love you very much. I love everything about you.\"\n\"...It's strange, isn't it.\"\n\"Even though I've been told 'I love you' so many times, I never tire of it. Every time I hear it... my heart races.\"\n\"A little... the more time I spend with you, the more I feel I've fallen for you.\"\n\"Please take care of me from now on.\""
 noa_event.15.a: "Please take care of me!"
 noa_event.102.t: "Afterward"
 noa_event.102.d: "Whaaa?! I... I did something incredible!"
 noa_event.102.a: "Shy Angel"
 noa_event.103.t: "Ice Cream"
 noa_event.103.d: "Noa seems to really like ice cream. Should we buy her one?"
 noa_event.103.a: "Yay"
 noa_event.103.b: "We can't afford that"

