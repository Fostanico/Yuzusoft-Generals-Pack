# 凉音
 LY_event.101.t: "Potato-Mine Lady Ate It and Stormed Over to Blow Up"
 LY_event.101.d: "\"What's with this pancake? What's with this quality?\"\n\"The heat was too high — overcooked, and all the bubbles are gone. You didn't practice properly, did you.\"\n\"Why did you even serve this? It's all wasted!\"\n\"Too low a heat won't do, and too high won't do either. Also, they say you should wait for the bubbles to rise, but waiting too long dries out the batter and overcooks it. That's why yours turns out hard.\"\n\"And there's a burnt smell. What a waste of the flavor.\""
 LY_event.101.a: "Sigh... so... may I borrow the kitchen?"
 LY_event.102.t: "Potato-Mine Lady Wants to Take Disciples Here"
 LY_event.102.d: "In the eyes of a professional pastry chef, this pancake is absolutely not fit to be served. But eating it always gives Suzune a faint sense of familiarity. Suzune lay by the table thinking for a long time, and finally remembered.\n\nIt tastes exactly like the first pancake she ever made."
 LY_event.102.a: "Maybe if I teach these folks a thing or two, they can make better sweets than mine."
 LY_event.103.t: "Fruit Cake"
 LY_event.103.d: "Cake is an ancient Western pastry, usually made in an oven. Cake is made primarily from eggs, sugar, and wheat flour, with milk, fruit juice, milk powder, flavoring, salad oil, water, shortening, and baking powder as auxiliary ingredients. After mixing, blending, and baking, it becomes a sponge-like dessert.\n\nCake is a kind of flour-based food, usually sweet; a typical cake is made by baking. The main ingredients of cake include flour, sweetener (usually sucrose), binder (usually eggs; vegans can substitute gluten and starch), shortening (usually butter or margarine; low-fat cakes use concentrated fruit juice instead), liquid (milk, water, or fruit juice), flavoring, and leavening agents (such as yeast or baking powder)."
 LY_event.103.a: "Yay"
 LY_event.104.t: "Chocolate Doughnuts"
 LY_event.104.d: "Doughnuts, also called donuts, are a sweet food made by mixing flour, white sugar, cream, and eggs and then deep-frying. The two most common shapes are the hollow ring, and the closed type with cream, custard (egg liquid), or other sweet fillings wrapped inside the dough.\n\nIn Asia, doughnuts are mainly eaten as a snack, but in the United States many people eat doughnuts as a breakfast staple, and there is even a \"Doughnut Day.\""
 LY_event.104.a: "Yay"
 LY_event.105.t: "Cream Pudding"
 LY_event.105.d: "Pudding is a traditional English food. It evolved from the ancient \"puddings\" that referred to mixtures containing blood sausage; the pudding of today, made from eggs, flour, and milk, was taught by the Saxons. In medieval monasteries, a \"mixture of fruit and oatmeal\" was called \"pudding.\" This pudding formally appeared in the 16th century during the reign of Elizabeth I, prepared with gravy, fruit juice, dried fruit, and flour. Puddings in the 17th and 18th centuries were made from eggs, milk, and flour."
 LY_event.105.a: "Yay"
 LY_event.106.t: "Vanilla Pancakes"
 LY_event.106.d: "The substance produced by mixing flour with water has good extensibility and elasticity. Flour is the main ingredient in pancakes: when flour is mixed with water into a dough, the wet gluten formed produces steam when baked. The higher the baking humidity, the greater the steam pressure, and the greater the expansion force on the wet gluten. Layer after layer of dough heats up and expands until the water inside the gluten is completely baked dry. In this way, the product's volume expands to eight to ten times its original size.\n\nThe second factor of expansion is structural material that can produce layers — so-called layered structural material means that when preparing pancake dough, large amounts of regularly layered fat must be placed into the mixed dough. Layers of fat and layers of dough isolate each other, forming regular layers of dough and fat. When baked, they interact: first, the moisture in the wet gluten heats up and produces steam pressure; the steam pressure from the lower dough layer lifts the upper layer, and so on, layer by layer growing larger. Finally, the fat between layers melts from the heat and permeates into the gluten, replacing the original moisture, making each layer crisp and flaky — resulting in a delicious, fluffy pancake.\n\nPancakes are delicious."
 LY_event.106.a: "Yay"
 LY_event.107.t: "Mont Blanc Tart"
 LY_event.107.d: "Mont Blanc is a French pastry made with chestnut purée. A French pastry of delicate texture, fine craftsmanship, and premium ingredients.\n\nFrench: Mont-Blanc\n\nOrigin of the name: named after the majestic peak of the European Alps, \"Mont Blanc.\" The shape of Mont Blanc follows the form of Mont Blanc itself, because the peak is snow-capped year-round, turns brownish in autumn and winter when the trees wither, and an authentic French Mont Blanc has brown chestnut cream on the outside. Moreover, Mont Blanc was originally made with chestnuts, because chestnut season is autumn, and Mont Blanc also turns brown in autumn. The other flavors of Mont Blanc seen today are later extensions. In France, mont-blanc equals \"chestnut\" Mont Blanc; they do not add the French word for chestnut before mont-blanc.\n\nMethod: a genoise (a layered sponge cake filled with cream or jam) as the base, chestnut purée piped in strips around it, topped with a dollop of ice cream."
 LY_event.107.a: "Yay"
 LY_event.108.t: "Chocolate Tiramisu"
 LY_event.108.d: "Tiramisu is an Italian dessert with a coffee-liqueur flavor. Made primarily with mascarpone cheese, with ladyfingers replacing the sponge cake of traditional desserts, and adding coffee, cocoa powder, and other ingredients. It tastes fragrant, smooth, sweet, and rich, with textural variation in the softness — and the flavor is not one-dimensionally sweet.\n\nIn Italian, Tiramisu means \"pick me up right away.\" Legend has it that during World War II, an Italian soldier was about to head to the front, but there was nothing left at home. His loving wife, to prepare rations for him, baked all the biscuits and bread in the house into one pastry — and that pastry was called tiramisu. Whenever the soldier ate tiramisu on the battlefield, he would think of home and the one he loved there."
 LY_event.108.a: "Yay"
 LY_event.109.t: "Sister Suzune on Vacation"
 LY_event.109.d: "Sister Suzune has gone on vacation, so the cake shop is temporarily closed orz"
 LY_event.109.a: "Fate has run its course; human effort cannot prevail"
