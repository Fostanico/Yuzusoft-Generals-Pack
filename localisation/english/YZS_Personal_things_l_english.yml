 #魔宴
 ningning_corps_desc: "General introduction: Ayachi Nene is a second-year high school student, in the same class as the protagonist, Kaidou Hideaki, Kariya Wakana, and others. Because of her cute appearance, gentle personality, and social grace, she is very popular at Himematsu Academy.\nNene is actually a witch who collects fragments of hearts to fulfill her wish. Perhaps because of this secret, Nene has no close friends at the academy. When collecting heart fragments, Nene changes into witch attire. The witch outfit is extremely revealing and very lewd, which embarrasses Nene greatly. The price of signing the contract to become a witch is suddenly losing control and going into heat; once in heat, she cannot recover without masturbating — Nene herself is greatly troubled and ashamed by this.\nNene is the president of the Paranormal Research Club, but to keep her secret from being discovered, she rejected all other students' applications to join, which once brought the club to the brink of disbandment. In the story, before Hoshina Shuuji joined, the Paranormal Research Club had long consisted of only Nene. Though it is a paranormal research club, its usual activities have little to do with the paranormal — merely using tarot cards and other fortune-telling for visiting classmates, chatting with them, giving advice, and helping solve problems. Nene also uses this to find opportunities to collect heart fragments."
 Meguru_corps_desc: "General introduction: Inaba Meguru looks flashy on the surface, giving a frivolous impression — but the real reason she cultivates this impression is that this is her first time setting foot in Himematsu Academy, and she wanted to blend into the group with an image that seemed to chase trends. The effect, however, seems poor. She often uses her self-made \"ciallo\" as a greeting, claiming it is a combination of the Italian ciao and the English hello.\nThough Meguru is cheerful and frank, she immediately took a week off due to serious illness after the term began and could not easily blend in (while carrying an unshakable knot in her heart). To overcome this inability to fit in, she sought help from the Paranormal Research Club.\nIn truth, Meguru is a homebody who enjoys playing games alone — games that can be enjoyed solo, such as Monster Hunter, otome games, and DRACU-RIOT! (an easter egg at the end of the OP).\nMeguru wants to cling unreservedly to close people like Nene, and is also keen on trying to dress Tsumugi up to look more feminine. She is also a girl with a bit of a little-devil side. Yet she sometimes makes a \"puyaya\" face, radiating pure silliness."
 chou_corps_desc: "General introduction: Shiiba Tsumugi is a transfer student who entered the protagonist's class at the odd time of the second semester of her second year. Mismatched with her cute face and \"not-chicken-breast chest\" is a boy's high school uniform. The male outfit is not a hobby; like Nene's heat, it is the price she pays as a witch. If she wears women's clothing reaching a certain point value, it causes violent vomiting that affects her body. In this respect, Shiiba could actually wear women's clothing — the price is simply that she cannot wear women's underwear with a high point cost.\nIn childhood, to escape the hereditary \"curse\" of frail health in her family, her family made her wear boys' clothes for a long time. Because of this, Tsumugi's pursuit of women's clothing has reached a near-obsessive state. She is gentle and soft-spoken. In daily life and club activities, she tries her best to avoid conflict with others, and after conflicts she glosses over them by dodging and running away. She values her friends greatly — even when Akagi was mistaken by Nene, Souma Nanao, and others for the culprit who had once again drained others' heart holes, she set aside her soft nature and stepped forward to try to defend Akagi. Though no one believed her, of course."
 Toko_corps_desc: "General introduction: Togakushi Touko, as the student council president, enjoys high prestige; her appearance and full figure make her a top celebrity at the academy. If Ayachi Nene is the 2nd-year idol, she is the 3rd-year idol.\nAlways smiling, gentle to everyone, the ideal senpai — she is admired by most students, yet in truth she likes to bully people. As student council president, her skills are first-rate, and she is deeply trusted by the faculty."
 wakana_corps_desc: "General introduction: Kariya Wakana is Hoshina Shuuji's classmate and one of his few female friends. A small, cute girl with short blonde hair. She treats people without regard to gender and is a lively girl.\nShe works part-time at Souma Nanao's café, Schwarz Katze. An energetic girl who cares about those close to her, with a slightly sharp tongue. Even so, she also has a very shy side and is not good at performing in front of others. Influenced by her father, she has recently become obsessed with the guitar, but because she is not good at showing off, she refuses to play for others."
 #千恋万花
 Murasame_corps_desc: "General introduction: Murasame-chan is the keeper of the divine blade \"Murasame-maru.\" As a sacrifice, she became the keeper of the Murasame-maru, protecting the land of \"Hoori.\" She recognizes the protagonist, who drew the sword, as her master, and the protagonist calls her Murasame-chan or little Murasame. Amid the locals' chorus of \"Lady Murasame,\" she stands apart.\nShe has existed for centuries, with a ghost-like form, but denies being a ghost, and ordinary people cannot see or touch her. Those with Tomotake family blood (Yoshino and Mako) can see Murasame; Lena can also see her due to long contact with the fragments. She has both a childlike side and an adult side — though mostly the childlike side, being a spirited, cheerful girl in daily life.\nThough she has existed for over a hundred years, she is actually quite timid and very afraid of ghosts and monsters. When going with the protagonist to meet Tomotake Yoshino and Hitachi Mako, she once sang to bolster her courage. She has no body, cannot eat or bathe, but can sense spiritual power, so she finds comfort in wine offered to the gods and hot springs with spiritual power.\nHer way of speaking resembles Akagi from the previous work Sanoba Witch, with a strong archaic tone. On the character song album cover, the flower beside Murasame is the red spider lily (manjushage), whose flower language is \"endless love\" — perhaps hinting at Murasame's identity as a sword spirit."
 Mako_corps_desc: "General introduction: The Hitachi Mako family has served the Tomotake family for generations. (Living at the westernmost end of town, she considers traveling between the two households good exercise.) She is a girl raised to become the shrine maiden princess's guard.\nThough serious at work, her personality is, in contrast, not so steady. She loves jokes and pranks and is very mischievous. She also has a shy side — when praised as a girl, she does not know how to react. Though a ninja, she has been afraid of heights since childhood. She once climbed a tree with ease to return a fledgling to its nest, then was too scared to come down.\nOn the character song album cover, the flower beside Mako is the red camellia, whose flower language is \"ideal love.\""
 yoshino_corps_desc: "General introduction: Tomotake Yoshino is the shrine maiden princess of the Tatemi Shrine in Hoori. Because the protagonist broke the divine blade, and at her father's request, she is to enter a marriage engagement with the protagonist — which she resents. She is extremely skilled in the dedicatory dance, and her dance contains power that dispels the curses and defilement of the land. She particularly loves sweets, to the point of putting sugar even in tamagoyaki. She loves the confections of Tashin'ya.\nHer personality is somewhat composed, with a hint of coldness, but her original character was not so aloof — she has a childish side. She tries to appear calm and steady on the surface, but often shows small cracks and is surprisingly easy to read. (Yoshino elimination method: what Yoshino denies is the truth.) Yoshino's emotions are actually rich; her joys, angers, sorrows, and pleasures are distinct, and she is often like a spirited child.\nOn the character song album cover, the flower beside Yoshino is the pink cherry blossom (some say peach blossom), whose flower language is \"love and hope.\""
 Lena_corps_desc: "General introduction: Lena Liechtenauer is a female exchange student from abroad (identifiable as Finnish from her use of \"moi,\" her self-introduction of the \"land of the aurora,\" \"Lapland,\"(1) and the salmiakki she gives).\nCheerful, upright, and gentle, she is always energetic with a straightforward personality. She does not get discouraged by setbacks, always saying \"the more setbacks, the harder you must try!\" — very strong-willed. She has no particular dark side; she has been a pure child since childhood, growing that way to adulthood.\nOn the character song album cover, the flower beside Lena is the yellow crown daisy, whose flower language is \"abundance and versatility.\""
 Roka_corps_desc: "General introduction: Maniwa Roka is a childhood friend of the protagonist, Kurama Koharu, and Kurama Rentarou. Already graduated, she runs the family's Japanese-style sweet shop and is its owner. Being slightly older than the others, she often speaks with a big-sister gaze and tone (and is often teased for it), but she has no romantic experience."
 koharu_corps_desc: "General introduction: Kurama Koharu is a first-year at the only school in Hoori town, but she often runs over to Masaomi's class. She works part-time at the sweet shop \"Tashin'ya\" owned by Sister Roka's family, and is the protagonist's cousin. Gentle, considerate, and good at housework, she is a fully capable little sister. But she is quite cold toward her own brother Rentarou — perhaps because Rentarou often does foolish things chasing after girls in heat. She is especially enthusiastic toward the protagonist, calling him \"onii-chan,\" and has repeatedly expressed the wish that the protagonist were her real brother."
 #RJ
 Nanami_corps_desc: "General introduction: Arihara Nanami is the protagonist's sister. They are not blood-related. She is shy; speaking to someone she meets for the first time makes her stutter, but once familiar she becomes very close, and she has a slight chuunibyou streak.\nAs a member of a secret organization, she belongs to the special operations squad of the Intelligence Bureau, codename Levy9. Skilled in programming and hacking, she is mainly responsible for information support and logistics. According to her, chanting a spell before using her astral ability improves her focus (though it is useless). Her astral ability is healing, which works by enhancing the wounded person's self-healing ability to quickly recover their wounds.\nOn the character song album cover, Nanami holds the \"King of Hearts,\" and hearts represent \"love\" among the four suits. In the \"Joker of Hearts\" interlude illustration, the card holds a witch's flying broom."
 Ayase_corps_desc: "General introduction: Mitsukasa Ayase is the student council president of Kikka Academy. She often appears in school promotional videos and frequently gives interviews and appears on TV, making her quite famous. She is considered the most famous astral user.\nShe publicly claims to be an E cup. (Those who have played know her real size.) Her astral ability is the manipulation of attraction and repulsion within an area. (But you may have noticed that she is not on the list of astral ability enhancers in the 721 Research Institute in this mod.)\nHer personality is tsundere. She has polished her public persona and faces others as a perfect girl. She is not good at waking early. She has an unimaginable obsession with cats — merely seeing a cat on a screen sends her into pervert mode. When alone in the dorm, she lets herself go, becoming a homebody who loves playing RPGs.\nOn the character song album cover, Ayase holds the \"Ace of Spades,\" and spades represent \"power\" among the four suits. In the \"Joker of Spades\" interlude illustration, the card holds a scepter shaped like a black cat."
 hazuki_corps_desc: "General introduction: Nijouin Hazuki is the dorm manager of Kikka Academy. She is very diligent, with a strong sense of responsibility, an upright and serious personality, and is very proper. Because of this, she is sometimes seen as a bit scary and stiff. As dorm manager and by nature, she often supervises the students' daily conduct. But far from resenting her, everyone relies on her.\nHer astral ability is the refinement of water and the manipulation of water flow. According to her, holding an umbrella increases her concentration. Her ability is powerful, but she struggles to control it precisely. Her family is a police family; influenced by her father, she loves historical dramas. She even secretly performs one-person full-cast roleplay of entire plays, immersed in the performance. Much of her personality and thinking comes from these historical and period dramas. She loves Kurodai no Suke, considering him a symbol of loyalty, and has a room full of Kurodai no Suke merchandise.\nIn the personal route's ED, imagery such as an umbrella stand, love-letter paper, an astral-energy water chair, and love-letter envelopes appears, along with water droplets, umbrella blossoms, and astral-energy water turbulence in the scrolling images."
 Mayu_corps_desc: "General introduction: As the academy's scientist (in a sense), Shikibe Mayu is the protagonist's senpai. She has excellent grades, but for certain reasons deliberately avoids credits and has repeated a year 2 times without graduating. The academy tacitly allows this and has her handle AIMS data entry.\nHer astral ability fixes particles in the air, similar to creating a barrier out of nothing. She can create various shapes, such as hollow furniture shells and stairs. It can be fixed at a distance without direct contact, and can be activated even when blocked by objects.\nOn the surface she seems a mature big-sister type, but she also has a childlike side that acts spoiled. She has her own private laboratory, where she usually conducts research experiments on various abilities. As the academy's senpai, her alcohol tolerance is terrible — one can of beer gets her drunk.\nOn the character song album cover, Mayu holds the \"Queen of Diamonds,\" and diamonds represent \"wealth\" among the four suits. In the \"Joker of Diamonds\" interlude illustration, the card holds a death god's scythe."
 chisaki_corps_desc: "General introduction: Mibu Chisaki is a student at Kikka Academy and Arihara Nanami's classmate, as well as Nanami's best friend. A social butterfly with dazzling social radiance.\nAn only child and an ordinary person without abilities, but brimming with a sense of justice. A fashionista who loves advising people on outfit coordination, finding great satisfaction in dressing up the girls around her. She entered Kikka Academy because she realized she knew nothing about astral users and wanted to make more astral user friends.\nThe interlude illustration of her personal route uses the same hearts suit as Arihara Nanami. In the \"Joker of Hearts\" interlude illustration, the card holds a heart-painted flag and a trumpet."
 gongping_corps_desc: "General introduction: To be clear, Suou Kyouhei is male, but his appearance looks like a girl's. He has no abilities. He is often treated by Mibu Chisaki as a girl for comparing chest sizes and such. His appetite is enormous — he can eat two to three large servings in one meal and gets hungry extremely fast. But he has always carried the chairman's missions on his shoulders, executing secret tasks."
 kotori_corps_desc: "General introduction: Ise Kotori is the daughter of Kikka Academy's chairman, Ise Atsunori. She met Shikibe Mayu in middle school, and the two became friends. Her astral link value is extremely high, reaching 247 — the highest in history. Because her astral ability was artificially driven into a rampage, she was restrained in a sleep pod. But thanks to our efforts, her problem has now been resolved and she can serve us."
 #咖啡馆
 kanna_corps_desc: "General introduction: Akizuki Kanna is a death god girl who has lived for over a hundred years, acting alongside the cat demon Otetsu. She has no knowledge of 21st-century high-tech products, is not good with smart devices, and occasionally blurts out knowledge from the bubble-economy era. Her main work is guiding souls (butterflies) and dealing with weakened souls still wandering the mortal world. Though she has lived long, she has no elder's dignity. In conversation she sometimes teases people, letting out a \"nihehe\" laugh. But at times she also shows a worldly, weathered side.\nShe practiced hard at making omurice, and the omurice she made was praised by the protagonist as having \"a gentle taste\"; her coffee is also highly praised. She easily associates things with H matters and falls alone into intense H delusions — though she has no experience."
 zaozi_corps_desc: "General introduction: Shiki Natsume is the school beauty of the university. Very popular on campus, she has rejected many confessions and is called the \"heartless card-giver.\" She is not good at putting on a bright smile, and dislikes bitter foods such as coffee and green peppers.\nShe likes to quietly sip drinks at calm, orthodox bars, favoring sweet, low-alcohol cocktails. When drunk, her personality becomes somewhat outgoing, and she likes to joke and tease. Recalling it afterward embarrasses her. Natsume wears a maid outfit as a personal hobby, and considers running Cafe Stella well her most important mission, saying she will drop out of school if necessary. Because her Japanese name Natsume was once machine-translated as \"jujube,\" we can affectionately call her Sister Jujube."
 Nozomi_corps_desc: "General introduction: Sumizome Nozomi is the protagonist's childhood friend, lively and well-behaved. She works part-time as a shrine maiden at her family's Akaishi Shrine, and feels ashamed of the phrase \"shrine maiden cosplay.\" She does not want to inherit the shrine.\nShe has spiritual sensitivity — she can sense butterflies and feel a chill from them. She once naively believed that eating bitter coffee and sweet doughnuts together would cancel out the calories; faced with the temptation of food, she can only surrender. At the protagonist's invitation, she works part-time at Cafe Stella."
 Hiuchidani_corps_desc: "General introduction: Hiuchidani Mei is Shiki Natsume's kouhai and Sumizome Nozomi's former classmate. A cheerful, consistent, energetic girl. Sometimes she acts like a child and loves cute things like plushies. Sometimes she acts a bit spoiled, such as pushing housework onto her parents. She works part-time at Cafe Stella.\nShe was once a member of the swimming club. The tan from swimming has yet to fade, which troubles her a bit. Her periodic exam scores always barely pass, requiring frantic last-minute cramming. She is not used to romance-related topics — her face reddens or she gets excited just hearing them. Mei usually wears contact lenses; at home she wears red-framed glasses."
 suzune_corps_desc: "General introduction: Shioyama Suzune is a professional-level pastry chef; the sweets she makes receive very high praise. She loves making desserts and makes no compromises in her craft, regardless of cost or price. She has her own principles about baking and will never easily compromise — which seems to cause frequent disagreements with others.\nShe is very serious at work but extremely lazy at home. Her ideal boyfriend type is someone who can handle all the housework for her. In her rented apartment, she always lets the housework pile up, too lazy to deal with it."
 #Dr.
 Miu_corps_desc: "General introduction: Yarai Miu is a student of Tsukinaga Academy and a vampire girl belonging to the special district administration bureau (Onmyo Bureau) discipline squad, working in the organization responsible for maintaining public order. She has a strong sense of responsibility and is the type who teaches others well. She sometimes says embarrassing things to tease people — but because she herself is easily embarrassed and simple, it turns into blushing verbal attacks, a personality that makes people sweat.\nThough those around her think she is an S, she insists she is an M. When embarrassed, she blushes and says \"u-ru-sa-i\" (shut up) one syllable at a time. Her ability generates a psychic force field that can block fast-moving objects such as bullets, and can also directly act on targets and send them flying."
 azusa_corps_desc: "General introduction: Mera Azusa is a human girl in the same discipline squad as Miu, and the head of Tsukinaga Academy's Second Dormitory, insisting she must take responsibility as guardian of the boarders. Because of her childlike build she is often treated as a child by those around her, which she hates. When excited or flustered, she slurs her words. She has a slight complex about her loli figure, so she always stresses that she is an adult. Because she holds no prejudice, racial discrimination, or differential treatment toward vampires, she is well-liked by many vampires.\nWhenever the topic turns to H matters, she seriously steps in to stop it. When shaken, she speaks with a \"meow\" verbal tic, sometimes accompanied by blurting out her true feelings. As a member of the discipline squad, Azusa's marksmanship is No.1 in the squad, making her an important asset in the field."
 Rio_corps_desc: "General introduction: Inamura Rio is a vampire girl working at \"Arekusan.\" She has a gentle, simple personality with a healing aura, but also a stubborn side that, once decided, never changes. At the dorm, she handles all kinds of housework and can be said to be the pillar supporting dorm life. Though she has general common sense, she is severely lacking in sexual knowledge — more ignorant than innocent. Therefore, whenever H matters come up, she tilts her head and asks others about them.\nAmong vampires, she is an acquired-awakening type, relatively rare compared to innate vampires. Rio has some resistance to her own ability — super strength — and feels embarrassed to use it. Having studied aikido, combined with her super strength, her combat ability is by no means inferior even to the discipline squad's vampires."
 elina_corps_desc: "General introduction: Elina Olegovna Oven is a Russian exchange student working at a casino in the pleasure district. She is a vampire and a resident of Tsukinaga Academy's Second Dormitory. She sometimes speaks Russian, likes to wear her hair in a single/double ponytail, and her weaknesses are her ears and electromagnetic interference. With a vivid personality, she easily gets along with people; in ordinary conversation she often associates things with H topics, frequently leaving those around her dumbfounded. Elina has no intention of hiding her interest in lewd matters, claiming she is interested in such things from an academic perspective.\nShe calls herself a masochist and in fact enjoys all kinds of play. When in love-struck maiden mode, Elina is too excited to sleep and rolls around in bed all night. She possesses electromagnetic abilities and harbors an unutterable secret."
 Nicola_corps_desc: "General introduction: Nicola Cepheus is a vampire from Europe with chuunibyou, referring to herself as \"boku.\" A setting otaku, she likes adding all kinds of settings to herself and her surroundings, though her chuunibyou is not actually that strong. To get closer to her imagined vampire image, she wears a modified uniform with a cape and colored contact lenses in daily life. She speaks in terms others find hard to understand, but those around her have grown used to it. She works at the same casino as Elina and debuted as a croupier through her own efforts. Most people initially thought she was a boy."
 sayo_corps_desc: "General introduction: Aragami Sayo looks like a loli, with a childlike side to her personality, but she is actually a vampire over 200 years old (in fact over 400). She is a special existence even among vampires, advocating coexistence between vampires and humans and establishing Aqua Eden. The vampires living in the city are grateful for Sayo's contributions and respect her.\nAs the mayor of Aqua Eden, she often discusses the city's development with human government officials, but maintains a neutral stance — even when faced with choices unfavorable to vampires, her top priority is the continued existence of Aqua Eden. Her ability is super regeneration."
 #天使
 noa_corps_desc: "General introduction: Shirayuki Noa is an angel girl. She descended to the protagonist's side to protect him, the reincarnation of the Demon King. Though her appearance is youthful, her words and deeds are very mature. She is calm and composed in all matters — except certain topics. She takes her angelic duties seriously and treats those around her sincerely.\nNoa has lived an angel's life and has almost never been exposed to human civilization. She is full of curiosity about manga, anime, delicious food, and more, gradually coming to enjoy them. Being a holy angel, she is very resistant to indecent matters."
 Amane_corps_desc: "General introduction: Tanikaze Amane is the protagonist's biological younger sister. A bratty girl who constantly mocks her brother.\nShe has little interest in offline socializing and is a competitive gaming expert. Besides competitive games, she used to play lewd games on her computer, saying it was to lower the blood pressure caused by her PvP teammates. Her privately hoarded manga include not only shoujo manga common among JK, but even male-oriented \"Liu Bei,\" which she used as physiology teaching material for the angel. It's no wonder she has trouble getting out of bed.\nAmane's past life was a demon of another world."
 WeiZi_corps_desc: "General introduction: Viz is Tanikaze Amane's past-life form."
 Kurumi_corps_desc: "General introduction: Kohibari Kurume is a student of class 2-C at Zuika Academy. A top student who listens attentively in class, takes notes, and never needs last-minute cramming for exams, with outstanding comprehension. A gyaru — dyed hair, manicured nails, jacket tied at the waist. Well-versed in otaku culture. However, she is very bad with spicy food; she once burst into tears from a ramen that everyone else found mild.\nKurume's past life was a female demon named Slay under the Demon King Alyon."
 Kaguya_corps_desc: "General introduction: Hoshikawa Kaguya is a demon woman who came to Japan from another world pursuing the Demon King's magic power. She is the second princess of the Suneu Kingdom in the other world; her demon trait is the animal ears on her head. After coming to Japan, she lives in a luxury apartment in a skyscraper near the station with her personal attendant Orie Lewak. As her attendant, Orie constantly wishes Kaguya would maintain her princess image even in a different world, while Kaguya herself sees no need.\nKaguya loves hamburgers. She carries a mask capable of cognitive interference, allowing her to go out in her original attire unnoticed. Her animal ears are sensitive — she fears having them touched most of all. And she is extremely good at stirring up trouble."
 Fumika_corps_desc: "General introduction: Ozato Fumika aspired to become a teacher while still in high school. Currently the youngest faculty member at Zuika Academy, she teaches modern Japanese language and is the homeroom teacher of Riku's class 2-C. She is careful to maintain proper teacher-student distance — except with the protagonist, whom she even asks for help with private matters. In private life, she is rather clingy.\nFumika's past life was \"Faree,\" one \"involved with the Demon King.\" Faree was, in a sense, the Demon King's servant."
 Orie_corps_desc: "General introduction: Orie Lewak, like Hoshikawa Kaguya, is a girl from another world and Kaguya's attendant. Her personality is extremely rigid. Because she cannot adapt, she is sometimes a bit clumsy. She is not good with electrical appliances, which to her are merely \"tools of another world.\""
 Sairi_corps_desc: "General introduction: Mikuni Sairi is Tanikaze Amane's classmate, and the two get along especially well. She loves playing games and often plays online with Amane, who has commented that Sairi is very serious when gaming. She was once controlled by a research institute from another world."
 #幻想岛
 shirley_corps_desc: "General introduction: Shirley Warwick is a native human who has always lived on the floating island — not an elf (in truth, after being comforted, the protagonist mistakenly believed silly Shirley was a fairy who had come to save him, and the misunderstanding spread after translation). Her family members are representatives of the floating island's council, so she is commonly called Princess. Cheerful and frank, with excellent grades, a serious attitude, and no problems in her way of life. She is good at drawing and has been awarded in competitions.\nHer delusions are extremely severe — she often falls into rosy delusions she cannot escape, and when the delusions reach a certain intensity, she gets nosebleeds."
 amagiri_corps_desc: "General introduction: Amagiri Yune is a student who came from Japan to study at Lezelug. A polite Yamato nadeshiko-type girl. Because of her father's health, she has helped her mother with housework since childhood, making her extremely skilled at it. She has a strong desire to serve others and a powerful wish to become someone's servant.\nYune's cooking is highly praised; sometimes being complimented by Tooru makes her very shy. She sometimes shows a terrifying, meaningful smile; her assertive personality seems to come from her mother. Yune's body temperature is lower than normal, and she has a certain yandere trait."
 Masaki_corps_desc: "General introduction: Masaki Gaillard is a girl with short red hair, animal ears, and a tail (similar to a canine's), with the same red color as her hair. Big-breasted. A half-beastkin. Her father, Owen Gaillard, is a pure beastkin and the owner of the tavern \"Beast Den of Fangs and Claws.\" She runs the tavern with her father as a waitress and is treated as the tavern's poster girl. Her mother is Japanese and moved out when Masaki was little.\nMasaki is innocent, lively, and full of energy. But she sleeps in and is groggy after waking. She loves delicious food, especially doughnuts. As a beastkin, her sense of smell and hearing are far sharper than ordinary people's. She has a habit of adding \"wahu\" when speaking."
 Konoka_corps_desc: "General introduction: Hinomiya Konoka is a mysterious girl who suddenly appeared by the lake wearing nothing during a camping trip. After waking, she remembers only that her name is Hinomiya Konoka. Judged to be a wanderer, she became a resident of Lezelug under the deliberation and decision of Leonard and the council, with the innkeeper Owen Gaillard as her (formal) guardian. She speaks slowly and has a habit of appending her own feelings to the end of sentences, such as \"Konoka says this\" and \"Konoka thinks so.\" She is not good at cleaning her room, so before Tooru discovered it, her room was a mess. She sometimes deliberately states embarrassing things bluntly. Her bento boxes are either terrifying in appearance but delicious, or beautifully presented but average in taste. Having no memories from before arriving at Lezelug, she has no strong attachments or emotions toward the present, and finds the sensations of various emotions novel."
 Tia_corps_desc: "General introduction: Tia Hohenwerfen is the daughter of the ancient elf family Hohenwerfen on the main island of Lezelug; the elf race's aesthetic, however, judges Tia as \"not a beauty.\" She is upright in daily life and earnest in teaching, but also has a careless side: once faced with information her brain cannot process, she becomes extremely nervous and flustered, often feeling she has done something wrong and apologizing profusely afterward. At school she wears plain glasses and tries to project a reliable big-sister aura — a complete failure."
 Airi_corps_desc: "General introduction: Shiraga Airi is a girl with a fine ahoge on her head. She is the daughter of the protagonist's mother's younger sister, making her the protagonist's cousin, and one of the exchange students who came to the island. She has a verbal tic of ending sentences with \"...desu no\" and \"that...desu no,\" appearing in nearly every sentence, later gradually revealing a self-destructing tsundere trait.\nAiri is actually a very frank and cute child, but because she gets nervous easily, she struggles to convey her feelings. She has a childish side and wants very much to improve on this."
 #nw
 akari_corps_desc: "General introduction: Kanemoto Akari is the young lady of the Kanemoto Group. With a strong sense of responsibility, she generally appears dignified, but she is sensitive to praise and becomes extremely flustered by compliments.\nAkari is actually a tsundere and is very bad at waking early."
 Shizuru_corps_desc: "General introduction: Masamune Shizuru is the young lady of the Masamune family, a second-year at Rokuroku Academy. She places great importance on the Masamune family's reputation, holding herself to high standards of conduct and etiquette. She studied the long blade as a child and has reached a level where she could teach it.\nShe is interested in shogi tactic names, believing that the cooler a tactic's name sounds, the stronger it is in a match. However, she is very conscious of being flat-chested."
 Sena_corps_desc: "General introduction: Tsukiyama Sena is one of the two maids of the Kanemoto family, Akari's personal maid, and also studies in the attendant department of Rokuroku Academy, interning at the campus café. Her cooking skill is superb — even a first attempt turns out well. Takumi's impression of her cooking is \"ordinary deliciousness.\" Akari and Mao Ming rate Sena's cooking as \"able to make good flavor even with ordinary ingredients, but conversely, even with premium ingredients, it can only taste like that.\"\nBesides excellent household skills as a maid, she can drive, pick locks, and even defuse bombs. However, she is afraid of the dark and was once scared to tears by a sudden blackout in the house."
 Hinata_corps_desc: "General introduction: Kunihiro Hinata is a cheerful, frank (former) kouhai. Originally from a distinguished family, she was raised in an ordinary family due to family circumstances — an ultra-commoner girl. She once ate luxurious cuisine and had diarrhea for days, her body ill-suited to aristocratic life.\nIn some illustrations, the short hair at the back of her head is not tied up, forming an ahoge at the nape. Hinata is not good at studying and burns out quickly. Though she has transformed into a young lady, she keeps the word \"super cheap\" engraved in her mind."
 Maya_corps_desc: "General introduction: Nagamitsu Maya's family has a martial tradition, and she received chivalrous education from childhood, making her a girl with a strong sense of justice. She has excellent martial arts — enough to kick a robber flying. Her grades are first in class. Because she is very cool, she is adored by all kinds of girls. She originally attended a commoner's school, but transferred to Rokuroku Academy after a while. However, she is not good at socializing and gets nervous when talking to others. Like Ayase, she loves cats and dogs, and is happy when they get close to her."
 #天神
 sana_corps_desc: "General introduction: Chitose Sana is the protagonist's sister, a master of housework who loves cooking. She handles the family's meals and keeps the protagonist's allowance. Her birthday is June 8 — the day Sana came to the Chitose family; since her true birthday is unknown, everyone uses this as her birthday.\nSana is gentle and well-behaved, attentive, and always considerate of others — but she is also a master of snark. Sana has no resistance to ghost stories. However, she has a hidden identity. (Hint: in the full version, you can celebrate Sana's birthday on §tJune 8§! every year.)"
 sakuyahime_corps_desc: "General introduction: Unohana no Sakuya Hime's duty is to protect the land of Mahiba City and govern its earth. Her land-governing ability is truly unique, ensuring favorable weather for the land — she is a goddess who exists to protect Mahiba City. It is said she has lived for a very, very long time, yet she remains very naive. Because of her gorgeous appearance and haughty air, her classmates call her \"Princess.\"\nIn the modern world, she loves meddling in others' affairs, which always brings trouble. She also enjoys testing and teasing people, delighting in their flustered reactions. In truth, she is a devoted girl who gets jealous when someone she cares about is approached by other girls."
 Ruri_corps_desc: "General introduction: Rindou Ruri is the attendant of the protagonist, the goddess Unohana no Sakuya Hime; her true form is a cute little fox spirit. She loves cats and will rush in front of a cement truck without regard for her own safety to save one. She is also a tsundere."
 Aoi_corps_desc: "General introduction: Yamabuki Aoi is the protagonist's childhood friend. Uninhibited, frank, and dignified, she treats everyone equally and is popular among both boys and girls. However, she is quite dense about romance, which astonishes those around her. And she places great importance on promises."
 Mahiro_corps_desc: "General introduction: Tokiwa Mahiro is the student council president of Minagi Academy. Gentle and popular on campus. A literary girl who loves reading in the library, rereading her favorite works. She often handles matters alone and rarely asks those around her for help, seemingly afraid of causing trouble for others. As her term neared its end, she united the student council members and those who had come to help across different routes, changing the Minagi Academy culture festival from its former state of only displaying results into one where, like other academies, shops could open and talents could be performed."
 Yukari_corps_desc: "General introduction: Karasuba Yukari is one of the teachers at Minagi Academy, serving as the protagonist's homeroom teacher in the new semester when the story begins. She is quite young for Minagi Academy, so she gets along well with students. She was once scolded by Oidake for her attire. Sometimes she goes to the rooftop to relax with a cigarette. Outside teaching, she also has a very sadistic side."
 #管乐
 Tae_corps_desc: "General introduction: Nakanoshima Tae is the protagonist's childhood friend. As a child she was very shy, so after moving to their current home she rarely spoke. She is very good at cooking and her dishes taste great, but she possesses a spice tolerance far beyond anyone else's. She started on trumpet and later switched to trombone. Her personality is very simple; she sometimes believes jokes, and at times says terrifying things without realizing it."
 Noriko_corps_desc: "General introduction: Imamiya Noriko belongs to the Akagiyama Academy wind band. Her hobby is reading romance novels. She is terrible at cooking, always burning her dishes to the point people mistake them for squid-ink dishes. Severely nearsighted, without her glasses she cannot even tell whether what's in front of her is a person. She was frail in the past, but later took up wind instruments to improve her health and has continued ever since."
 Sumi_corps_desc: "General introduction: Mikage Sumi is a first-year at Maruyama Academy. She initially joined the Maruyama Academy wind band, and after quitting, was invited to join the Akagiyama Academy wind band. As a drummer, she has a great sense of rhythm. Her long-standing personality made her a frequent target of bullying in class; the bullying she suffered left her deeply insecure, so much so that she often blames herself unnecessarily. During a courage-testing activity, she said she was scared — yet, puzzlingly, her face showed no change in expression."
 Yuki_corps_desc: "General introduction: Hibarigaoka Yuki is a student of Maruyama Academy and serves as the conductor of the Maruyama Academy wind band. Highly accomplished in music, she is proficient in instruments such as violin and piano, and as a conductor can pick out subtle flaws in ensemble practice. She is also a textbook tsundere. She has long hoped to lead the Maruyama wind band against the Akagiyama wind band, and for this reason deeply detests any conduct that makes competitions unfair."
 minase_corps_desc: "General introduction: Ebihara Minase is a first-year at Maruyama Academy, affiliated with the Akagiyama Academy wind band. Her surname \"Ebihara\" contains \"ebi,\" which is pronounced the same as the Japanese word for shrimp (ebi), and shrimp are indeed a kind of ebi — so the protagonist gave Minase the nickname \"Shrimp-kun.\""
 #夏空
 Chihaya_corps_desc: "General introduction: Kamisaka Chihaya is a girl the protagonist met by chance at a café. Cheerful and seemingly carefree, she always wears a smile. She is not good at cooking and has never cooked before. Because of her poor health, she was cared for by her parents and recently moved with her family to the island. The island's fresh air has helped her health recover. Her dream is to become a doctor or nurse."
 sasara_corps_desc: "General introduction: Shichijou Sasara is a girl the protagonist met at a festival. The daughter of Tokazuru Shrine's chief priest, Shichijou Katsumi. She loves sweets. Naive and unworldly, she sometimes doesn't even know what she's thinking. Completely lacking in common sense, she has little basic knowledge of social interaction. Yet she can spout all kinds of unorthodox trivia and use it for banter and comebacks. She has no experience with housework either. Her mind is immature, a complete blank slate, very childlike. She has not seen her mother for many years. Previously, she obeyed her father and stayed in the hospital without going out."
 Yuiko_corps_desc: "General introduction: Miyoshi Yuiko is the protagonist's cousin and Futaba's older sister. Though she looks young, she is actually the same age as the protagonist. As if spoiled by her parents, she is very willful, competitive, and unwilling to lose. She is short — shorter than Futaba — and is often mocked for it by Futaba, which she resents greatly. A ringleader among children, she is an expert at all kinds of games; the queen of festival games, strong at darts, goldfish scooping, and shooting galleries — said to have been taught by Miyoshi Miho. She is a good cook, reaching nearly the same level as her mother Miho after only a few days of practice. She is also clever, but unwilling to study. When the protagonist checked, he found her winter homework untouched."
