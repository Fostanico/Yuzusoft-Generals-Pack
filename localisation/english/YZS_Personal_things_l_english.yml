#绫濑事件
 ayase_event.1.t: "If Only Life Were Like First Sight"
 ayase_event.1.d: "That afternoon, the sky was clear, the clouds languid, and the sunlight gentle and just right. Ayase's clear eyes were full of my reflection; at sweet sixteen, her smile bloomed like a flower.\nI recalled many things, from the moment I met her.\nThe first time I saw the girl named Mitsukasa Ayase was on a promotional video for Kikka Academy. An ad cut into the prime-time soap opera at eight in the evening — a girl with a bright smile on the television introduced a new academy from top to bottom, and ended with a self-introduction: \"I'm Mitsukasa Ayase. I hope everyone will consider our Kikka Academy.\"\nThe name Mitsukasa Ayase was quite famous on the internet. At first she was known as a genius girl, and the hot topics about her were mostly like \"What do you think of the genius girl Mitsukasa Ayase attending Kikka Academy.\" But later, the direction of online discussion grew stranger and stranger, eventually becoming \"How should we view the underdeveloped secondary sexual characteristics of the genius girl Mitsukasa Ayase.\" The internet soon forgot about that, though; the new hot topic was whether the shrine maiden heiress of the Tomotake family had studied at the Central Dance Academy, because she danced far too well.\nI never expected to see her here. Not paying it much mind, I turned off the TV and burrowed into my futon. But then my old man pushed open the door with a piece of news.\n\"Your dad's been transferred to Washizu City. This month we need to pack up and get ready to move.\"\nWashizu City isn't exactly remote — it was originally just a tech innovation center that has only developed gradually in recent years, for reasons roughly comparable to Silicon Valley. Kikka Academy sits right on Washizu's Second Ring Road. When I lugged my bags over to complete the transfer procedures, it was Mitsukasa Ayase who came out to receive me. Kikka Academy's campus is beautiful; the teaching and research buildings stand apart at one corner of the triangle-shaped grounds, and the remaining space is planted with lush trees and flowers, with winding paths threading through them. Light filtered through the canopy scattered into glittering specks on the ground.\nI think my heart began to flutter for Ayase from the day I enrolled.\nShe walked ahead, and I followed behind. The gentle breeze stirred the rustling shadows of the trees; falling petals drifted everywhere, making the beauty even more striking. She brushed the stray hair from her temple and turned back amid the swirling sea of blossoms, a sweet curve lifting the corner of her lips. \"It's really pretty here, you know. Studying in a scenic spot is a real treat.\"\nI think I had no reason not to fall for her."
 ayase_event.1.a: "Hello, little Ayase"
 ayase_event.1.b: "How many layers is that padding...? (choose this to skip the Ayase route and get the original Ayase)"
 ayase_event.2.t: "Seems Like I Saw Something Incredible"
 ayase_event.2.d: "But one night, I seemed to see Ayase's Side B.\nIt was the dead of night. I snuck out of the dorm, planning to reward my cafeteria-weary stomach with some street-side barbecue after finishing my task. But as I climbed onto the wall, I saw two figures tangled together in an alley outside campus. Curiosity made me creep closer.\nAyase deeply regretted sneaking out of the school gate tonight; she was probably about to have her life ended early over a street barbecue. Just as she was contentedly preparing to climb back over the wall, a drunk thug carrying a short knife staggered out of the darkness, intending to abduct her for ransom. The barbecue cart vanished at the speed of fleeing from a city inspector. As Ayase struggled, the drunk tripped and stumbled; the knife slashed through her clothes and plunged into her left chest.\nI picked up a brick-shaped sleeping pill from the corner and was about to administer it to the thug when something unexpected happened. The knife had sunk into the clothes over Ayase's left chest. Pale-faced, Ayase collapsed to the ground. The thug hadn't reacted yet — I administered the medicine to him first, and he fell peacefully asleep.\nI rushed to Ayase's side in a panic and examined the wound. Strangely, there was not a drop of blood at the knife wound; when I gently pulled, I could feel the knife lodged in some kind of hard material. Just as I was utterly puzzled, Ayase recovered her composure. I didn't hear relief at surviving — instead came an almost threatening demand: \"Had your fun yet?!\"\nThe knife came out, bringing something with it. Round silicone material... a chest pad? It was a chest pad!\nI stared at her for a long moment: \"So the internet saying you're a flat-chested princess wasn't slander after all.\"\n\"SCREW YOU!!!!!!\""
 ayase_event.2.a: "Wait, Miss Mitsukasa, please calm down first!"
 ayase_event.3.t: "Now I Understand"
 ayase_event.3.d: "Since then, watching Ayase go gaga over cats every noon became one of the essential pleasures of my life. But watching for a while, I grew curious — Ayase, why don't you just get a cat yourself?\nThe moment Ayase mentioned it, her face crumpled as if about to drip water: \"I do want to get close to cats, but they run away the moment they see me. Four little legs pumping away and gone in a flash — faster than fleeing from a ghost.\"\nBy the way, that was the first time I saw rapture and sorrow occupy one person's face at the same time.\nBut according to Ayase's description, this cat was no ordinary cat — it required a field investigation. That noon, Ayase dragged the puzzled me through the blazing sun to find the senior cat on campus.\nThen the senior cat ran away — without looking back, four little legs pumping away and gone in a flash, faster than fleeing from a ghost. On this point, our Miss Mitsukasa had not exaggerated at all.\nBut classmate, maybe you'd like a mirror to look at your own expression. Perhaps regional customs differ; around here, you don't need to put on a face scarier than a ghost before petting a cat. With that predator-on-the-hunt aura radiating from you, any cat that didn't run would have to be a depressed one that didn't want to live.\nAfter hearing my words, Ayase found them deeply reasonable — then beat me until I was drenched in sweat."
 ayase_event.3.a: "Did you order the Supreme Set from the University of Tokyo Hospital Affiliated Medical Department? Comiiiiing up!!"
 ayase_event.4.t: "The Unknown Side"
 ayase_event.4.d: "The next day, I was assigned by a teacher to deliver materials to the student council. At noon, taking advantage of the students swarming out to grab lunch, I carried dozens of files and, with the key I'd wheedled out of the teacher, managed to open the door.\nWith a soft \"click,\" I squeezed sideways through the door, set down the files, and was about to head out for instant noodles when I discovered a Mitsukasa Ayase. Our student council president, phone in hand, drool at the corner of her mouth, was staring blankly at a cyber cat on the screen, pink bubbles wafting around her whole body. I was caught between laughter and tears — back at enrollment she'd looked like an unapproachable goddess, and now she'd fallen to this state. It seemed a prank was called for, to match the atmosphere.\n\"Miss Mitsukasa, hand over your phone for inspection.\" A school leader's voice came from behind, startling Ayase so badly she nearly tipped over the table, launching out of her chair, spinning halfway around — to find a scoundrel barely holding in his laughter teasing her.\nI know that face. Wasn't it you mocking me last night too? Vengeance is not abandoned; the time just hadn't come!\nMitsukasa viciously inflicted negligible damage on my person while muttering indistinctly about \"flat chests being a scarce resource!!!\" and doing her utmost to punch and kick me, attempting to physically erase my memory. Before long, Ayase tired herself out, collapsed into a chair, and asked me: \"Hey, you won't tell anyone, right? Your mouth's a bit mean, but you're not that malicious, are you?\" \"Then in exchange, you have to tell me why you love cats so much.\"\nAyase looked helpless: \"Then let me ask you — are cats cute?\" \"They're cute.\" \"Then let me ask you — cute things deserve to be loved, right?\" \"Right.\" \"Then let me ask you — should I like cats?\" \"You should.\" \"Then let me ask you — why are you asking this question?\"\n\"Because few people turn into a helpless mess the moment they see a cat, drool still un-wiped at the corner of their mouth.\""
 ayase_event.4.a: "None———of———your———business!!!!!"
 ayase_event.5.t: "Dis iz a Kitten"
 ayase_event.5.d: "When she came out again, Ayase was wearing cat ears she'd procured from who knows where, and a fluffy cat tail had appeared at her lower back. Between her cheeks, flushed nearly to bursting with embarrassment, she squeezed out a faint, threadlike\n\"Meow... meow meow~\"\nI was stunned — anyone would lose the ability to think and act at this sight. Ayase fled back into the inner room, and after a long while pressed herself against the door to ask: \"A-am... am I... cute?\"\nAfter receiving an affirmative answer, Ayase let out a sigh of relief on the other side of the door, then began frantically explaining — something about \"to understand cats, one must first become a cat,\" full of hard-to-understand talk, making them both laugh, and the dormitory filled with cheerful air. After the laughter, Ayase made plans with me to try our luck at a cat café tomorrow."
 ayase_event.5.a: "\"Tomorrow I will definitely pet a cat!\""
 ayase_event.6.t: "This Is No Ordinary Horror Game Anymore"
 ayase_event.6.d: "Gradually the weather turned cool; autumn had come to Washizu. Ayase wasn't as rowdy as before, gradually confining her activity to the student council room and the dorm. On a rare weekend morning, Ayase called with a life-or-death chain of rings; the voice on the other end was full of fear: \"Xiao-kun... qu-quick, come over!!! Where are my teammates, where are my teammates? Someone save me!\"\nI rushed frantically to Ayase's dorm door. Before I could catch my breath, a bundle of blanket opened the door for me, sweeping me into the room with a swish.\nAyase, wrapped in her blanket, shrank behind me and timidly extended half a finger. I followed her direction — on the big computer screen was Resident Evil 4: Bug Edition. \"I don't dare play it. Play it for me, play it for me, play it for me...\" This time Ayase extended half an arm out of the blanket, tugging at my sleeve and pleading endlessly.\nI was happy enough to play a new game for free anyway; after a few pleasantries I sat down and started blasting. Ayase obediently stuck to my side wrapped in her blanket. Every time a thrilling scene appeared, violent trembling came from the blanket beside me. Midway through, a question occurred to me: \"Ayase, why did you buy a game you don't dare play?\" Ayase tilted the half of her head poking out: \"They said there's a cat in it. I thought it wouldn't be that scary. Oh, right — can you find that cat for me? Please, please, please...\"\nGirl, there may be a cat in it, and there really is a cat. But would you care to look at the game's title again? I figure this game has about as much to do with cats as... well.\nIn the end, for Ayase's wish, I battled all kinds of monsters big and small until dark, and finally added a pair of cat ears to the protagonist's head. I was about to drag my half-dead self back to sleep when Ayase stopped me, saying she wanted to show me a big treasure. Then she disappeared back into the inner room to fiddle around for a long while..."
 ayase_event.6.a: "What is she up to?"
 ayase_event.7.t: "I Have No Objections"
 ayase_event.7.d: "After a bout of goofing off at home, Ayase turned and scooped up a big fat orange tabby, a mischievous grin flashing across her face. To me, locked in a battle of wits with a calico, she shouted: \"Hey hey, close your eyes right now, hurry hurry, I want to cash in my chance to do whatever I want with you this instant! Hurry hurry hurry!\"\nFine — she was probably going to drop some cat on my head as a prank. I resigned myself and closed my eyes, feeling a fluffy presence gradually approach my left cheek. Suddenly, a somewhat damp, soft touch landed on my right cheek, vanishing with a soft \"muah.\"\nI opened my eyes. Ayase was hugging the cat in the corner, sneaking giggles this way. \"I say, Ayase, what do you mean by pressing a cat against my face? One cat pressed my left cheek, and another licked my right cheek.\" Ayase laughed even harder, a blush rising on her face: \"The nuzzling was all this big orange cat's doing — as for the other cat, I have no idea who that was.\"\nTsk, still not confessing. I decided to extend my visible hand toward Ayase's soft cheeks and knead them thoroughly. \"Confess now! Or worse tortures await!\" Well, Ayase seemed to be quite enjoying the torture — there was truly no dealing with her.\nAyase suddenly bounced over and whispered in my ear: \"Want me to tell you which cat licked your right cheek?\" \"Go on.\"\n\"The one who secretly kissed you was this kitty.\"\nThat night, the sky was clear, the clouds languid, and the moonlight gentle and just right. Ayase's clear eyes were full of my reflection; at sweet sixteen, her smile bloomed like a flower.\nI recalled many things, from the moment I met her. I suppose I've grown used to having this noisy two-faced girl by my side. To teachers and classmates she's the model student council president; she's the fool who agonized over not being able to pet cats; and in the end she transformed into a sneaky kissing cat. I think I could dig three feet down and still not find a reason to reject her.\n\"Next time you kiss me, no need to sneak. Hey, don't be so impatient, mm—\""
 ayase_event.7.a: "Got a problem? Keep it to yourself!"
 ayase_event.8.t: "A Day Like Twenty Years: Success in Cat-Petting Is at Hand"
 ayase_event.8.d: "At the cat café entrance the next day, I chanted at Ayase over and over: \"When you see a cat, take a deep breath first. Breathe deeply for ten seconds. In those ten seconds, control your facial expression. Don't make it too fierce, or you'll scare away both the cats and the owner...\" Ayase shot me a vicious glare, then pushed the door straight in.\nThe moment she saw the cats — a whole crowd of cats gathered together — Ayase's breathing visibly quickened. I had no choice but to pinch the soft flesh at her waist, successfully interrupting Ayase's dark transformation. Ayase glared at me again, but wait — why did her gaze look a little unnatural? Probably plotting another prank.\n\"Granny Ayase, hold it in, control yourself. I'll give you one chance to do whatever you want with me later, how about that?\" \"No way. Make it three.\" \"Any number is fine — just don't flip the entire shop over on them...\"\nSo did Miss Mitsukasa finally pet the cats she'd been longing for? Of course she did! As it turns out, the light fragrance on her body is quite popular with cats — by now she was already enjoying being pestered by groups of three and five.\nAnd so, surrounded by cats, we happily spent the whole afternoon. Unable to withstand Ayase's earnest pleading, the shopkeeper had to agree to let Ayase take two cats home for the night.\n\"Thank you so much! Thank you so m—\" Before she finished, all we saw was one girl and two cats vanishing like lightning. The shopkeeper and I looked at each other, and burst out laughing."
 ayase_event.8.a: "Every side of this girl is adorable"
 ayase_event.8.b: "Finally, the cats aren't scared of her anymore"
 ayase_event.8.c: "She did it"
 ayase_event.9.t: "A Vow"
 ayase_event.9.d: "Class, playing with my phone in the student council room, class, getting ready to sleep, spending weekends gaming together — the plain days flew by. On another boring Saturday afternoon, Ayase half-collapsed onto me and declared that Cosmic Super Robot was the most boring game in the world. I pinched Ayase's puffed-up cheek and asked her: \"Tell me — when we've gotten tired of every game in the world, will you still love me?\"\nAyase found a more comfortable position on me: \"How could that be? Come over here and swear to heaven with me that we'll love each other forever.\"\n\"No way — I'm not falling for your scheme.\" Ayase sprang up, grinning wickedly, and flipped me onto the floor: \"I'll make you fall for me so hard you'll be head over heels, and even when you're a shriveled old man you'll still be calling me 'my old lady' with hearts in your eyes!\" With that came a torrent of kisses, until Ayase tired herself out and lay on top of me."
 ayase_event.9.a: "To be honest, I think she'll have no problem at all achieving this little goal"
 ayase_event.10.t: "From Now On, Let It Stay This Way Forever"
 ayase_event.10.d: "At that moment, a spring breeze blew, bringing love and gratitude from afar, gently lifting her long hair. Soft, like a mother's hand caressing you. Even the blossoms dancing like paired butterflies could not ease the lingering hesitation in my heart. Hand in hand with Ayase, I strolled along the tree-shaded path we had walked countless times; though not the first time, my chest burned for reasons unknown.\nWhether it's the sweet first love or the noisy daily life, all of it shines too brilliantly to ever be devoured by time. Following that faint fragrance, my gaze was bound to the girl. Whether her gentle teasing or her sweet smile, both shattered the last bit of stubbornness in my heart — I love Ayase so much.\n\"Ah, if we don't hurry we'll be late for class!\" The spring breeze at my ear carried the echo of the one I adore. I struggled to keep my wits and ran toward that light — \"Coming!\" \"Hey, I'm telling you, you've been acting weird today. Could it be that at night, alone in your room, you secretly...\" Along with a mischievous grin, Ayase quietly leaned her head on my shoulder, adding fuel to my already feverish heart. \"Can't you put something normal in that head of yours—\" I raised my hand and flicked her forehead lightly, desperately trying to hide my fluster.\n\"Owie, that hurt!\" With that, Ayase repaid me in kind, swinging a vicious (in her own opinion) fist at my chest — we failed to penetrate the enemy's armor! \"Hey, why is your heart beating so fast? Are you playing Heart Internal Affairs with Starlin again?\" Ayase, teasing me, looked puzzled and stared blankly at me — boom! The near-bursting heat was reignited. Without thinking, I blurted out, \"Because you're too cute!\"\nFirst a blank stare, then suspicion: \"Huh? What did you say? Did I mishear?\" A blush spread across her cheeks, and the focus in her eyes gradually scattered — I could feel the trembling on my shoulder.\n\"I said, the PERFECT Miss Mitsukasa is the cuuuuutest!\" Summoning my courage, I boldly bared my heart. Even the senior cat lazily enjoying its feast on the lawn was startled. Only after saying it did I realize what an astonishing thing I had just declared.\n\"Huh? Mmm↑ mm↓— eek...\" As if her neural circuits had short-circuited, Ayase muttered brokenly, breathing rapidly — I could clearly feel the warmth in her hand — or rather, it might be better described as scalding. \"Id—i—ot! Saying something like that in a place like this is so embarrassing!\" Though she said that, I could clearly feel Ayase's joy. It might be a bit improper, but well, it was my true feeling, and hiding it would be disrespecting the \"liking\" we shared.\nWe walked in silence, hand in hand. \"Ayase.\" \"Mm?\" \"I really do love you — your stubbornness, your obstinacy, your little willfulness, everything about you. It's because it's you that I love you; that's the feeling I most want to cherish. My feeling of 'loving you most' will always be Only For You.\" \nA trace of sweetness and tenderness appeared on her face. She listened silently, memorized it silently; the girl said nothing, simply leaning against me.\n\"But I have one correction.\" \n\"It's me who loves you most.\" \n\"No, it's me who loves you more.\" \n\"Ahaha, you're joking again — clearly I love you more.\" \n\"Ayase's quite humorous too; obviously I love you more.\" \n\"It's me!\" \n\"Me!\"\n………"
 ayase_event.10.a: "Pinky swear, to declare my resolve."
