###芳乃事件链
 yoshino_event.1.t: "Spring Festival"
 yoshino_event.1.d: "Early spring sunlight fell on the trees by the shrine, then dropped to the ground, shattering into points of light, bright enough to sting the eyes. Chicks chirped softly on the eaves. Before the shrine gate, a wall of people several layers deep stood in utter silence. Everyone's gaze followed that figure in white.\nIn plain robes she dances, playing with shadows; sleeves flutter, drifting and spinning. Hoko bell in hand, rising and falling; its metal voice rings clear and bright.\nSuddenly forward, then drawing back. A glance back full of charm; a delicate smile, lovely and fair.\nTurning, a jade lotus opens; stepping, golden lotuses surge.\nWhen the dance ended, the crowd gradually dispersed, until only you remained before the shrine gate. Suddenly, someone poked your back. Turning around, it was the shrine maiden who had been dancing. \"Is there anything else this guest needs?\"\n\"Ah, no, nothing — I was just lost in watching and didn't react. I'll be going now.\"\n\"Um, there's still the sword-in-stone pulling event at the spring festival later. Would you like to take a look, sir?\"\nThat is how you ended up joining the international brigade here.\nTo the left is the most refined of ninjas, Lady Hitachi Mako. \"Hey hey, if you pull out the Murasame-maru, you can't be King Arthur, but you can be the Lewd King. Why aren't you answering? Embarrassed? Are you planning to stick it back in later?\" Refined — truly authentic refinement.\n\"Stop it, Mako. We're heading into the mountains soon.\" To the right is the shrine maiden from that day, Lady Tomotake Yoshino — she's the only one who can keep Mako in check."
 yoshino_event.1.a: "Maybe I should go take a look?"
 yoshino_event.1.b: "There are other things to do"
 yoshino_event.2.t: "First Battle with the Tatari-gami"
 yoshino_event.2.d: "As for why we went into the mountains — to fight tatari-gami. Lady Yoshino explained earlier that tatari-gami are black stray dogs that hit painfully hard, and can only be harmed with a specific weapon. That specific weapon is this Murasame-maru, along with the hoko bell in Lady Yoshino's hands. Tatari-gami make no sound when they appear, so the job of finding them falls to the sharp-eyed Mako. But today's tatari-gami very proactively came to us. No sooner had we entered the mountains than two black shadows burst from the grass, leaping at you and Yoshino's faces.\nAlright, let's take them to market!\nQi surged to my dantian, blade edge forward. Just as the tatari-gami were about to plaster themselves onto my face, I shifted my steps, dodged sideways, and with a raise and fall of the blade, the tatari-gami was neatly split in two, turning into two pools of black water on the ground, gone without a trace. Turning around, Yoshino had suffered from the hoko bell's short reach and, together with Mako, was barely holding off the tatari-gami's frantic attacks. Without hesitation, I turned and slashed — this tatari-gami followed its companion's fate. These agile dogs of the mountains aren't so impressive after all. Done; down the mountain; chalk these two up on the ledger.\nThe showing-off seemed quite successful — though why did Yoshino later come back wearing Mako's jacket?"
 yoshino_event.2.a: "Tatari-gami? Hmph! I'll make sure they never go back!"
 yoshino_event.4.t: "Fishing Together"
 yoshino_event.4.d: "Living in the mountains is genuinely not bad~ Today's a great day to rank up~ Lady Yoshino invites you to play a game: fishing. /nMako, Lena, and little Murasame are all here, and so is your grandpa! He's also in the mountains doing who knows what. A whole crowd bustled their way to the stream in the mountains. Yoshino got a fishing rod from somewhere, then quietly slipped over to your side: \"How do you fish?\" /nHuh? This shrine maiden has never even seen a fishing rod? Fine, leave this little problem to me. Great Emperor Heqiang, grant me the power of the angler!\nThough it was clumsy at first — Yoshino's hook snagged your clothes several times — as the attempts increased, Yoshino finally caught her first fish.\nYou helped Yoshino unhook the fish and tossed it into the bucket. Yoshino stared at the fishing rod for a while, then asked: \"Do you think fishing is fun?\" \"Of course it's fun.\" With the Great Emperor Heqiang's seal of approval, how could fishing not be fun?\n\"Then next time you have to come fishing with me.\" Yoshino began tidying the rod. \"Last time you cut my clothes and ran off without looking back. This is compensation — no refusing!\""
 yoshino_event.4.a: "Then let me coach Yoshino"
 yoshino_event.4.b: "Second option, text pending"
 yoshino_event.5.t: "Pudding, Parfait Ice Cream!"
 yoshino_event.5.d: "Sister Ashigara's sweet shop released a new pudding. Passing by, you grabbed one as a midnight snack and set the bag on the table before heading to your room to change.\nHey, where's the pudding I just put on the table? Yoshino? Yoshino, did you see my pudding?\nYoshino hid the little pudding container behind her back, saying she absolutely had not seen that delicious pudding with its amazing texture, sweet and tangy, loaded with mango chunks and strawberry bits, and that she absolutely had not eaten it out of craving.\nSigh. Yoshino truly cannot lie.\n\"You like it? If you do, I'll bring you a few more next time, okay?\" \"Yes yes yes!\" Stars practically burst from Yoshino's eyes as she sprang up from the ground. \"Where did you get this pudding?\"\n\"From Sister Ashigara's place. Want to go together next time?\"\n\"Deal! Don't you dare lie to me!\"\nThe days after passed in a leisurely rhythm. We went to school together during the day, went up the mountain to fight the agile dogs from time to time at night, and when the chance arose at dusk, we'd sneak to Sister Ashigara's sweet shop for all kinds of desserts.\nWolfing down the dango before me, I was just about to turn and call Yoshino to leave when a weight landed on my shoulder. \"Hey, Yoshino? Hey!\"\nCan't wake her... I'll carry her back."
 yoshino_event.5.a: "Pudding is supreme!"
 yoshino_event.8.d: "Night had just fallen, and the streets were already empty of passersby. Yoshino slept deeply, her face buried in your neck, strands of hair hanging down on both sides. The evening breeze was cool, carrying a faint sweetness that added a tipsy warmth to the pounding of your heart. When had I started falling for the girl on my back? Perhaps one morning walking to school with her, perhaps one evening watching her wolf down food, perhaps one weary night after a hard battle. Yoshino on my shoulder stirred slightly.\n\"Is that Mako?...\" Talking in her sleep — how adorable.\n\"Mako, tell me, why do I like that outsider so much?\"\n\"He looks so cool fighting the tatari-gami, and he's gentle in daily life — my little willful wishes have all come true one by one. And, the way he looks at me when I eat pudding is like an old father. So silly, so cute.\"\n\"But I don't dare say it. I'm afraid the curse on me will hurt him.\"\n\"The curse means my life is only a short twenty or thirty years. I don't want him to grieve over me later. Then all those times going out together, eating pudding together, all those little trifles would become blunt knives of memory, cutting him all over. I don't want him to trade the loneliness of his remaining years for my happiness — how selfish would that be.\"\nIt felt cold. Was Yoshino crying?\nI know all this too. Why do I still love her without hesitation? Every silhouette of her, every expression, every little gesture can be a reason to love her — because that doesn't matter. What matters is this feeling: it has to be her.\n\"Yoshino, stop pretending to sleep. I have something serious to tell you.\"\n\"I love you. I will use all my strength to break the curse on you. Since fate won't grant us a reunion ending, we'll demand one from it with our own hands. Our days together from now on won't be just twenty or thirty years — they'll be seventy or eighty, until the very end of our lives.\"\nWe reached Yoshino's house. Just as I was about to set her down, the weight on my back lightened — she slipped down on her own.\n\"Do you mean it?\"\n\"Would I lie to you?\"\nYoshino hugged me from behind: \"Th-then, please take care of me from now on.\""
 yoshino_event.8.t: "Confession"
 yoshino_event.8.b: "Let's Face All Difficulties Together!"
 yoshino_event.8.a: "Let's Face All Difficulties Together!"
 yoshino_event.9.t: "The Final Battle with the Tatari-gami and the Curse"
 yoshino_event.9.a: "The Final Battle!"
 yoshino_event.9.d: "A pitch-black blade cut through the air, stabbing toward your vital point. Was this the end?\nThe tatari-gami's host body needed only a few more fragments. Today was the final battle with it. Though everyone had returned from every battle unscathed, no one relaxed their vigilance in the slightest. The moment we entered the mountains, a restless unease began clinging to everyone, tightening the further in we went. Yoshino gently tugged at your hem, her fingers trembling slightly. This dread crystallized when everyone saw a dozen small tatari-gami stick together into a ferocious black wolf.\nYoshino pulled harder. \"How... how do we fight something like this...\"\nWhatever the case, draw the blade first. The Murasame-maru shimmering with faint spirit flame, slashed without hesitation at the giant wolf's head; the wolf immediately lowered its body. Mid-swing, the blade suddenly changed trajectory, following your forward-leaning body to cut at the wolf's feet. With a body that big, it surely couldn't match the smaller ones' agility. Unfortunately, this common sense did not apply to tatari-gami.\nThe giant wolf swiftly lashed out a claw, slamming hard against the blade. Since the claw came far faster than expected, my defensive stance couldn't absorb the force — my whole body was about to fall apart... But before I could even steady myself, the wolf's tail whipped around like a steel whip, striking my body hard. Being sent flying is no pleasant feeling. Struggling to turn back, I saw the tail had transformed into a dagger, ignoring the harassment of the other two, stabbing toward me.\nA pitch-black blade cut through the air, stabbing toward my vital point. But this was not the end — there was still a promise to fulfill.\nI remembered the day Murasame repaired the blade; she used divine power to directly levitate the sword in midair. If so, then if the blade shattered into pieces, all the pieces could also be controlled by divine power.\n\"Murasame, hold back a bit of your divine power and let his hand shatter the Murasame-maru.\"\nThe tatari-gami's attack shattered the Murasame-maru — that was its last strike. Before the tatari-gami could retract its tail, all the fragments slammed into it with overwhelming force. No matter how agile the tatari-gami was, it could not dodge this net cast to the heavens.\nThe host body fragment that dropped today was especially large."
 yoshino_event.11.t: "A Child and a New Life"
 yoshino_event.11.d: "After that, the group worked on the host body day and night, and finally disposed of the curse — disposed of it thoroughly.\nWhy are we so certain it was disposed of thoroughly?\nBecause today, when the nurse came out of the delivery room, she congratulated you on becoming the father of a son.\nIs Yoshino happy? The operating room still doesn't allow family inside; it's a shame we couldn't share the joy with her right away. But there are still decades ahead of us, countless days and nights of happiness waiting. We can confirm it slowly later. So...\nYoshino, can you perform that greeting once more?\nHuh?! ...Okay. Honey, Ciallo~!"
 yoshino_event.11.a: "In the days ahead... please take care of me"
 yoshino_love1: "What kind of monster is this?!"
 yoshino_alone: "Pudding!"
 yoshino_happy1: "Thank you for playing Yoshino's route!"
 yoshino_event.15.a: "Thank you for playing Yoshino's route!"
 yoshino_notice: "After choosing this, Yoshino's marriage decision will be unlocked when Yoshino's route concludes"
 yoshino_yes: "Choosing this grants a weaker Yoshino, who can be upgraded through decisions and events"

#彩里事件链
 sairi_event.2.t: "A Cute Girl Came to Find You"
 sairi_event.2.d: "S-senpai! Wait! Um! I have something... for you! Please, you must accept it! Then—I'm off! Anyway, please, promise me you'll open it later!\n\nUntil the girl left, you had no idea what was going on. Still, you accepted the letter the girl gave you.\n\nYou noticed that the letter seems to carry an unknown aura, as if it does not exist in this world."
 sairi_event.2.a: "Ignore these minor issues and accept it properly."
 sairi_event.1.t: "A Love Confession at First Sight?"
 sairi_event.1.d: "〖Tomorrow after school, please come to classroom 1-A at my school, senpai! Thank you in advance, senpai!〗\n\nThat's what the letter said. As someone who handles a myriad of affairs daily, you would normally never visit this girl. But perhaps it was her sincere yet naive attitude that piqued your curiosity, or perhaps you truly had taken a liking to her. It could also be that the letter carried some unknown magic controlling your subconscious. Either way, you squeezed some time out of your break, and at last you met that cute girl.\n\n〖Senpai, I... I like you. Please go out with me!〗\n\nJust like an ordinary romance novel or manga, she confessed to you. As for anything different — you noticed her strength was not that of a typical JK. Before you could even react, she had tackled you to the ground. You began to imagine that the girl must be forcing you to go back with her to be her sex slave!"
 sairi_event.1.a: "I got overpowered, but she's so cute!\n§RWe do not recommend this option§!"
 sairi_event.1.b: "Damn brain, why is your imagination so good?"
 sairi_event.1.c: "You notice that the letter seems to carry an unknown aura, as if it does not exist in this world."
 sairi_event.3.t: "One Second Before Being Overpowered"
 sairi_event.3.d: "You simply cannot imagine how terrifying the girl before you is.\n\nJust looking at her is more terrifying than a billion rasps waiting to file you down.\n\nYou can barely protect your own chastity, and nothing else can be done.\n\n\"Y-you... you... you c-can't... you can't do this! No!\"\n\n\"Senpai~ why do you say you can't? You've clearly been excited and at full mast for a while now~ Does senpai have a girl or boy they like? Won't you consider me?~ This is the confession I prepared for you — enjoy it well, senpai~\""
 sairi_event.3.a: "Whoever you are, hero, save me!"
 sairi_event.4.t: "The Beauty Rescues the Hero"
 sairi_event.4.d: "Suddenly a charming shout came from outside the door, and whatever walls of bronze and iron there were came crashing down into rubble.\n\nBravo, Kaguya! Look at the princess — a flying kick straight to the heart, which the Mikuni-possessed fiend barely dodged. The two exchanged magical arts in the classroom; tables scattered with a clatter, paper and pens flew everywhere.\n\nSee the princess form a spell seal, tracing through the air with both hands, summoning all the five-element arts. The fiend, though it had seized a moment of fortune, was no match for the princess's grace and brilliance. Watch as black aura rises from Mikuni, scattering in panic. Kaguya beckons with her hand, and with a strange cry, the fiend goes to meet the ox-head and horse-face of the underworld!\n\nAha! Who says women are inferior to men? What a beauty saving a hero!"
 sairi_event.4.a: "Thank you, Kaguya."
 sairi_event.5.t: "Careful Planning, Prepared for All Contingencies"
 sairi_event.5.d: "That night, we summoned all the beauties to identify the aura on the letter together. After deep deliberation, each offered their own opinion.\nNene & Tsumugi: I think there are fragments to collect.\nYoshino & Murasame & Mako: I think there's a tatari-gami to cut down.\nKanna: I think there are butterflies to slice.\nSana: I think that great god's hide is itchy again.\nNoa, who had no time to speak: Huh?"
 sairi_event.5.a: "In the end, the chattering crowd decided to see what this was all about together tomorrow."
 sairi_event.6.t: "Life Persists Even in Desperation; a Fight to the Death May Break the Enemy!"
 sairi_event.6.d: "A loud crash came from the other side of the classroom, and out of the corner of your eye you saw in horror that the door had snapped in two and was flying toward you.\nSairi dodged it with a flash, so the door fragments dealt you 100 points of blunt damage. Besides that, you thought you saw a crowd of figures charging this way? You weren't seeing things, were you?\nYou weren't — it was a crowd. In the dust they raised, there seemed to be flashes of danger.\n\"I've come to assist you!\"\nYou saw countless weapons hurled toward Sairi — but you were right next to Sairi!\nYour head hurts; that one seemed to be Tsumugi's hammer. Why does your butt hurt too — Yoshino, don't go stabbing around randomly! With a bang, half your face swelled up — Sana, why are your fists so hard... Fainting isn't always a bad thing, at least not now.\nKaguya, passing by the classroom, heard the commotion and saw the corner in chaos, and you, out cold. Passing by Sairi, she casually exorcised her, then asked Noa: \"What's all this? What bad thing did this unconscious guy do?\""
 sairi_event.6.a: "\"Noa: 'I dunno.'\""
 sairi_event.7.t: "The Girl's True Confession"
 sairi_event.7.d: "The same letter paper, the same contents — but this time without that strange aura. You didn't dare let those troublemakers follow this time, and came alone to classroom 1-A.\nThe setting sun poured a dreamlike orange-red over the girl by the window. With her back to the door, she gazed absently at pairs and trios of people crossing the street.\n\"Sairi? Nothing clinging to you this time?\"\nThe girl turned lightly, dark hair swaying, shimmering in the flowing light. \"Senpai's here?\" Her eyes held a hidden radiance, her smile breathtakingly beautiful. \"This time it's my own thoughts, senpai. Please, listen to me.\"\nThe sunset deepened, yet could not outshine the blush on her cheeks. \"Senpai, I... I like you. May I stay by your side from now on?\"\nThe mood was just right. You were about to accept when a strange noise came from the ceiling — with a crash and a cloud of dust, you were buried under a pile of beauties."
 sairi_event.7.a: "\"Yoshino, what are you twisting for...\" #￥!%...."
 sairi_warning: "§RSomething unexpected will happen§!\n§RWe do not recommend anyone click this§!, unless you want to try it. This decision will cause unpredictable consequences, and the §Rconsequences are extremely severe, including but not limited to: corrupted saves, game crashes, and locked national focuses§!"
### 天音 ###
 sairi_event.8.t: "Something's Off About My Little Sister at Home"
 sairi_event.8.d: "I was such a fool, truly. I only knew that her past life would appear in Amane's dreams and chat with her — I didn't know her past life would log into her account today. I got up early in the morning, opened the door, filled a small bowl with rice, and called my Amane to come eat. I called Amane — no answer. I went out and looked: the table was empty, and my Amane was gone. She always woke earlier than me; when I asked Noa, indeed she hadn't gotten up. I panicked and begged everyone to go call her. Until Mom went out, I waited and waited until seven o'clock, and then saw her come downstairs in a strange outfit. Everyone said she'd probably been account-jacked. On further questioning...\nAmane gave you a headbutt: \"Can you stop droning on, you trash big bro? I'm fine! It's just one more vampire living at home.\"\n\"Oh right, set an extra bowl and chopsticks at noon.\"\n...This place just got livelier"
 sairi_event.8.a: "Protect my foolish trash big brother well, you trash vampire who hijacked my body!"
 sairi_event.8.b: "Just a big dream"
 sairi_event.9.t: "The Vampire's Special Preparations"
 sairi_event.9.d: "Viz finished drawing the last part of the magic circle with her own blood — now only the activation ritual remained.\nThough this world does not belong to her, she wants peace and tranquility for it. The experience of her previous life taught her that humiliation and forbearance do not bring peace; only when the enemy's blood runs dry is peace possible. If one person's sacrifice can hasten the coming of peace, she does not mind giving everything.\nThis world holds her love — even if he is not him.\nViz activated the ritual.\n\n【A resolve made once before】"
 sairi_event.9.a: "\"Please, on my behalf, live well with him, my bratty little sister.\""
 sairi_event.10.t: "The Mysterious Resolve of You and Her"
 sairi_event.10.d: "Amane grieved for a long time, and in the end decided to become a source of support by your side.\nShe said she didn't want to lose another important person."
 sairi_event.10.a: "\"It's me who protects you, trash big bro~\""
 sairi_event.101.t: "The Dream of the Fetus"
 sairi_event.101.d: "Though being overpowered by a girl younger than you is deeply embarrassing, you understand it cannot be helped. Her strength is that of an ox, there is no one around, and you cannot even find anything to resist with.\n\nWith resistance confirmed impossible, the lower brain gradually took over from the upper brain — at this moment, your little brother was no longer your little brother, but your cell boss.\n\nThe outrage continued, and you felt your consciousness gradually sharpen under the oppression of the girl before you. You could clearly feel the girl's past, her feelings, her thoughts. Helplessly, you savored everything about her. Gradually you felt the ecstatic joy of returning to the womb, understanding this madness that cannot be understood. You felt your mind perceiving, every second, that you were not here — as if within the girl's \"spring heart.\" §RYou dreamed the【Dream of the Fetus】§!"
 sairi_event.101.a: "§R\"At this moment, are you still there, senpai?~\"§!"
