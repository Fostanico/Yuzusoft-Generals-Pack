 yzl_history_brief: "§L2026.9.10§!\nRIDDLE JOKER: phase two\n§L2026.9.1§!\nRIDDLE JOKER: phase one\n§L2026.8.30§!\nATRI: marriage and Eden"
 yzl_history_content: "§WHISTORY§!\n§gNewest first · 10 releases§!\n\n§L2026.9.10§!\n§WRIDDLE JOKER: phase two§!\n\n• Added operatives Levy 9 and Levy 6; recruiting Levy 9 unlocks ideological propaganda operations.\n• Removed the time limit on reselecting the core circle.\n• Added easter eggs and fixed multiple bugs.\n• Reduced continuous checks to improve performance.\n\n\n§L2026.9.1§!\n§WRIDDLE JOKER: phase one§!\n\n• Reworked older RIDDLE JOKER traits, rebalanced Hazuki, Ayase and Nanami as advisors, and added Mayu as a theorist.\n• Added commander abilities for Ayase, Hazuki, Nanami and Mayu, and adjusted the institute's Astral ability enhancement traits.\n• Added animated opening sequences and decision backgrounds.\n• Updated Yoshino's industrial bond mechanics.\n• Added the horn-blowing feature to the CIALLO Bureau.\n• Reverted changes affecting self-propelled artillery.\n• Added text and easter eggs, and fixed multiple bugs.\n\n\n§L2026.8.30§!\n§WATRI: marriage and Eden§!\n\n• Added ATRI's marriage decision and event.\n• Added ATRI's Eden development decisions.\n\n\n§L2026.8.11§!\n§WLocalisation and optimisation§!\n\n• Fixed incorrect creation of Shikibe Mayu as a scientist.\n• Fixed Yuzu characters' capture protection incorrectly applying to all commanders.\n• Added English and Japanese localisation.\n• Reduced disk usage and optimised code logic.\n\n\n§L2026.8.2§!\n§WAmairo and military reform§!\n\n• Reworked older Amairo Islenauts traits, rebalanced some overpowered commanders, and added Tia as a military advisor.\n• Added military reform content to the Yuzusoft military academy.\n• Added the Fang and Claw Inn industrial organisation.\n• Made the commander recruitment UI movable.\n• Replaced the Amairo Islenauts opening music and image.\n• Optimised code logic and stability, and fixed multiple bugs.\n• Added text and easter eggs.\n\n\n§L2026.7.4§!\n§WDR rework and MD equipment§!\n\n• Reworked older DR traits, added the Vampire Troops army spirit, and added abilities for vampire characters.\n• Added Miu as an advisor, Oofusa Hiyori as a commander, and as:9nine's Kisaragi Yuna as a hidden commander and military advisor.\n• Adjusted easter eggs and removed the group-owner character from mass naval commander recruitment.\n• Made Yuzu manufacturers compatible with Millennium Dawn equipment.\n• Replaced the DR opening music and image, and fixed bugs.\n\n\n§L2026.6.14§!\n§WSenren and character decisions§!\n\n• Reworked older Senren Banka traits; adjusted Murasame and Yoshino as advisors and leaders, and Mako and Murasame as military advisors.\n• Adjusted two Yuzu army spirits and Murasame's parfait decision.\n• Added a revenge decision unlocked when the player's spouse is wounded.\n• Added Kotarou and Akagi as characters.\n• Expanded Bra-Ban! character traits and added the shrimp military advisor.\n• Adjusted ATRI's stats.\n• Added mastery-gain decisions to the Yuzusoft military academy.\n• Increased resources from Yoshino's industrialisation extraction decisions.\n• Added Miyako's requisition, Haruka's Heaven's Will, and Ruri's Animal Friends decisions; the latter grants an elephant cavalry template.\n• Replaced the Senren Banka opening music and image; added text, adjusted easter eggs and fixed bugs.\n\n\n§L2026.6.8§!\n§WSana: birthday and married life§!\n\n• Replaced the loading image with Sana's birthday artwork.\n• Added a post-marriage interaction UI, initially available for Sana.\n• Added Sana's automatic birthday decision and new abilities.\n• Fixed bugs.\n\n\n§L2026.5.9§!\n§WSabbat rework and BMI changes§!\n\n• Reworked older Sabbat of the Witch traits and BMI mechanics; removed the one-day cooldown to allow multiple uses per day.\n• Adjusted Nene and Meguru as government advisors, and Meguru and Touko as military advisors.\n• Added the Supernatural Research Institute industrial organisation and Tsumugi's core circle.\n• Adjusted Nene and Tsumugi's abilities and Nene's leader stats.\n• Adjusted detonator support companies and vehicle-mounted detonators.\n• Replaced the Sabbat opening music and image, adjusted easter eggs and fixed bugs.\n\n\n§L2026.4.29§!\n§WNaval standardisation and fixes§!\n\n• Added naval standardisation decisions.\n• Rebalanced some characters and corrected erroneous stats.\n• Filled text gaps, added easter eggs and fixed bugs.\n• Fixed the incorrect Super Sana draw probability."
