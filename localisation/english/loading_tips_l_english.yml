l_english:
 LOADING_TIP_0: "I will absolutely never agree to marry you!\n— Yoshino Tomotake"
 LOADING_TIP_1: "Please behold my 0721!\n— Ayachi Nene"
 LOADING_TIP_2: "With the gentle breeze blowing, I brush my tail, and look for the gift you'll bring when you return."
 LOADING_TIP_3: "Ah, senpai! Ciallo~!\n— Inaba Meguru"
 LOADING_TIP_4: "Trash~ trash~ Onii-chan can't even manage basic defense?\n— Tanikaze Amane"
 LOADING_TIP_5: "Tomorrow and the day after tomorrow, it's only you I want to see.\nJust seeing your smile makes me feel refreshed."
 LOADING_TIP_6: "Yuzu fans are heartless creatures."
 LOADING_TIP_7: "Firm noodles, extra salt, double veggies, extra garlic, heavy oil\n— Ayachi Nene"
 LOADING_TIP_8: "Ouch, ouch, it's gonna get shaved off!\n— Arihara Satoru, while being Riddle Joker'd by Ayase"
 LOADING_TIP_9: "Flat chests are a scarce resource!\n— Mitsukasa Ayase"
 LOADING_TIP_10: "Arihara Nanami? How many detonators does she have!\n— Ayachi Nene"
 LOADING_TIP_11: "Moege is Yuzusoft's greatest hallmark."
 LOADING_TIP_12: "The one true power comes from the detonator.\n— Ayachi Nene"
 LOADING_TIP_13: "Goshujin-sama~\n— Murasame"
 LOADING_TIP_14: "This life's destiny, bound to yours, at that far-off homeland's shore"
 LOADING_TIP_15: "Rather than a 'past' changed by magic,\nI treasure the 'present' far more."
 LOADING_TIP_16: "Flushed cheeks can't hide my yearning —\nI look away, afraid you'll notice."
 LOADING_TIP_17: "Barefoot, I cast every lie into the sky.\nRed-eyed and tearful, I reached the dream-lake and first tasted love."
 LOADING_TIP_18: "The curse broke; one small wish arose —\na maiden's secret, never to be told."
 LOADING_TIP_19: "My one wish: to forge destiny, and carve out an infinite future."
 LOADING_TIP_20: "We've had our quarrels, to be sure — but looking back, only the beauty remains."
 LOADING_TIP_21: "Ah, Ayachi Nene is so young —\nThe youthful 0721 one marches forward!\n— Ode to Yuzu"
 LOADING_TIP_22: "Huh? What did you say?"
 LOADING_TIP_23: "Yuzu fans, leave the group chat."
 LOADING_TIP_24: "Yuzu fans, tone it down."
 LOADING_TIP_25: "One, two — pad by pad, a perfect girl emerges!"
 LOADING_TIP_26: "No one may learn my true bust size. If they do, call me Zero-bust, not Ayase.\n— Mitsukasa Zero-bust"
 LOADING_TIP_27: "Solving others' small worries, bearing destiny's weight on my shoulders"
 LOADING_TIP_28: "I hid my secret and kept everyone away.\nThen ordinary days began to shine — the view you gave me, my SWEET TREASURE."
 LOADING_TIP_29: "Please accept my shūji!\n— Yoshino Tomotake"
 LOADING_TIP_30: "That's not funny. I'll kick your ass to kingdom come.\n— Mitsukasa Ayase Everglades"
 LOADING_TIP_31: "Uh, thanks, but we're both dudes...And, just for the record, no, I'm not gay..\n——Suo Kyuohe"
 LOADING_TIP_32: "Me being your partner makes you a deviant, huh?\n——Aragami Sayo"
 LOADING_TIP_33: "You're just having a healthy breakfast of bananas and milk, aren't you?! Aren't you?!\n——Sumizomi Nozomi"
 LOADING_TIP_34: "You'd be much better off studying to take civil service examination\n——Sumizomi Nozomi"
 LOADING_TIP_35: "In a duel, the victor is whoever's detonator has one more bar of charge.\n— Ayachi Nene"
 LOADING_TIP_36: "I'd rather use the showerhead than a detonator.\n— Elwyn Kanna"
 LOADING_TIP_37: "Healing Wind~\n— Arihara Nanami"
 LOADING_TIP_38: "I think the worst balance design is Ilnoh\n— GPT-5.6sol, when Ilnoh asked about the balance design problems in the mod"
 LOADING_TIP_39: "No one may learn my true bust size. If they do, call me Zero-bust, not Ayase.\n— Mitsukasa Zero-bust"
 LOADING_TIP_40: "I know not World War III's weapons, but World War IV will be fought with Yuzu against Yuzu."
 LOADING_TIP_41: "My ministers play Senren＊Banka, my queen Sabbat of the Witch, and my people Riddle Joker.\n— Boris III"
 LOADING_TIP_42: "There are three kinds of lies: lies, damned lies, and 'I don't play Yuzusoft games.'\n— Mark Twain"
 LOADING_TIP_43: "We shall play galgames on beaches, in fields, and in streets. We shall never stop.\n— Winston Churchill"
 LOADING_TIP_44: "No assassin's bullet can halt the Yuzu fans' galgame cause.\n— Robert F. Kennedy"
 LOADING_TIP_45: "If revolution comes, only heaven knows its end. A constitution would end Russia — we need Yuzu fans!\n— Mikhail Tukhachevsky"
 LOADING_TIP_46: "Give me fifty yuan — I don't care if I miss Crazy Thursday.\n— Chiang Kai-shek, Senren＊Banka summer sale"
 LOADING_TIP_47: "Dev team output blazes forth — the Yuzu Marshal takes command!\n— Yuzu General Staff slogan"
 LOADING_TIP_48: "The Yuzu mod is paradise, Group Leader Lao-ba is the bridge.\n— Yuzu General Staff slogan"
 LOADING_TIP_49: "Can Yoshino Tomotake become the heart of Ohitoyo's Great Purification?"
 LOADING_TIP_50: "— This is Ohitoyo: As Told by Yoshino"
 LOADING_TIP_51: "Did the Washizu model bring development, stability, and freedom? Its imitators got political chaos, social unrest, and displaced Yuzu fans."
 LOADING_TIP_52: "What, did that exceed your comprehension?\n— Mitsukasa Ayase, on her bust"
 LOADING_TIP_53: "Nini~"
 LOADING_TIP_54: "May the Force be with you."
 LOADING_TIP_55: "Come on, folks — let's shoot the breeze."
 LOADING_TIP_56: "Now I am Death, destroyer of the Steam Workshop.\n— Ayachi Nene, inventor of the detonator"
 LOADING_TIP_57: "May the Force be with you."
 LOADING_TIP_58: "Don't worry — love knows no gender. I'll be rooting for you~ (evil grin)\n— Unohana Sakuya-hime"
 LOADING_TIP_59: "Shall we do this by the book, or do you want me to just give you two punches?"
