 tongyong_event.33.t: "Wedding with Lena"
 tongyong_event.33.d: "The golden-haired girl wears a pure white shiromuku, facing you in your black montsuki hakama. This is the first time you've seen Lena in such attire, and you're struck by a powerful impression — you inexplicably feel that this is even more beautiful than Lena in a wedding dress.\nYoshino interrupts your dazed staring at Lena, patting your back to snap you out of it.\nYoshino leads you, the new couple, into the venue, waving a haraigushi wand above your heads to purify you.\nYou hold Lena's hand and walk together down the wedding red carpet, toward the Shinto priest.\n\"Strange... why don't Japanese weddings need a priest in a church?\" Lena whispers very quietly.\nThe Shinto priest is Yoshino's father, Tomotake Yasuharu. Yasuharu reads the congratulatory address for the two of you.\nAfter the address, Yoshino brings you three cups filled with sake.\n\"Three sips per cup, nine sips in total.\" Yoshino reminds Lena.\nLena picks up the smallest cup, and her face already contorts at the first sip — Lena has never drunk sake before. The impact of sake on Lena is no less than the first time she ever ate wasabi sushi. Fortunately, sake is still relatively easy to swallow, and Lena forces herself through all three cups.\n\"The new couple, please read your vows.\" Yasuharu says to the two of you.\n\"From this day forward, no matter what happens — in sickness and in health, in poverty and in wealth, through however many trials — we will never abandon each other and will always support one another.\" You and Lena read the prepared wedding vows aloud.\nFor Lena, the Japanese wedding process is still too hard to understand. Fortunately, it's almost over — after the formal ceremony, you arrive at the reception.\n\"So complicated... so strange... why are Japanese wedding customs so odd?\" Lena looks at you, bewildered. This is when she truly experiences culture shock — Finns would never force the newlyweds to drink!\"\n\"But... this is also one of the reasons I like Japanese culture, you know — it's really novel.\" Lena says to you with a smile.\n\"So now... you're a Japanese person too. According to our tradition... you no longer bear the name Liechtenauer.\"\n\"Mm-hm... I know that. In Japanese tradition, a woman takes her husband's surname after marriage, right?\" Lena says.\n\"But, but! It's not over yet! I've already talked it over with my family — we're having another wedding in Finland!\" Lena looks at you very seriously.\n\"But didn't they already come here...\" You look at Lena's family at the banquet — all golden-haired and blue-eyed. Aside from Lena's parents, you really can't recognize anyone else.\n\"We still have to go back and hold another one. Besides... that way I can show you around my hometown.\" Lena smiles.\n\"Could you please not feed me any more of that candy that makes people see the aurora... I'm still a little... worried about your hometown.\" You recall the candy from Lena's hometown you tried once — both you and Yoshino saw the aurora. Do Finns normally see the aurora like this?\n\"Honestly... do I seem like that bad a person? That time was an accident. I'll definitely take you to see the real aurora.\" Lena pouts.\n\"Of course, of course. Lena has learned so much about Japan for my sake. If I, as her husband, don't make an equal effort to learn about Lena's homeland, that just wouldn't be fair, would it?\" You say with a smile.\nHearing you call yourself her husband, Lena's heart stirs: \"I see... then as your wife, I must also do my duty to take care of my husband.\"\n\"From now on... take me to see everything in your homeland, and tell me all about it.\" You take Lena's hands in yours. A smile spreads across Lena's face.\n\"Of course... this is... a wife's duty, after all...\""
 tongyong_event.33.a: "\"May a thousand years of love, one day, make ten thousand flowers bloom.\""
 tongyong_event.34.t: "I Swear to Spend My Life with You"
 tongyong_event.34.d: "\"Then, senpai, see you tomorrow.\" Chisaki's voice comes from the computer speakers, and on the screen she keeps waving goodbye to me.\n\"See you tomorrow, Chisaki.\" I don't know if my expression looks natural, but I still keep my tone calm and bid Chisaki a proper farewell.\n\"Hey, big brother, done with your phone date?\"\nNanami pokes her head in from outside the door.\n\"Sorry, Nanami. Chisaki's call was too sudden, so I had to leave the site selection and arrangements to you.\"\nFor some reason, I feel Nanami's smile is a bit forced. I guess doing so much alone must be tiring.\n\"Anyway... thanks, Nanami. I really don't know what I'd do without you.\"\n\"Alright, cut the pleasantries. I'll send you the site selection and arrangements — make your own edits if you have any opinions. I'm going to sleep.\"\nNanami says, yawning.\n\"Good night.\"\n\"Good night, big brother.\"\n...\n\"Somehow... you seemed full of energy the moment we met today.\"\nChisaki holds her milk tea, staring at me.\n\"Well... that's... probably your imagination...\" Even I can't convince myself with that tone...\nSure enough, the suspicion in Chisaki's eyes only grows thicker.\nFortunately, the waiter arrives in time to break the ice, setting a dish on the table.\nThe dishes arrive one after another, and I take the chance to pull out the ring box I prepared.\nFacing Chisaki, I kneel on one knee.\nUnder Chisaki's astonished gaze, I slowly open the ring box. Inside is the diamond ring she once casually mentioned she liked the design of.\n\"Chisaki, from the very first moment I saw you, I fell deeply, helplessly in love with you.\"\n\"Senpai...\"\n\"I'm drawn to your cheerful personality, the way you treat everyone equally, and the way you're willing to understand people who are different from the ordinary.\"\n\"Chisaki, will you say yes? This is a formal proposal.\"\nI take out the ring and hold it out toward Chisaki.\n\"I accept, senpai.\"\nAs the words fall, the ring glimmers on Chisaki's finger.\nThe next moment, thunderous applause erupts around us — passersby, shop staff, and the friends and family who helped me plan this.\n\"Chisaki, if big brother ever treats you badly, you tell me, okay?\"\nNanami takes Chisaki's hands.\n\"Please take care of big brother's happiness.\" Her expression is very serious.\n\"Mm.\" Chisaki's expression is very serious too.\n\"Alright, then...\"\n\"Kiss! Kiss!\" Nanami, Kyouhei, and everyone else are stirring up the crowd.\nI look at the blushing Chisaki, and Chisaki looks at me, my face already completely red.\nThe two of us slowly... slowly... lean together.\n...\n\"I love you, Chisaki.\"\n\"Senpai, I love you too.\""
 tongyong_event.34.a: "\"Now that I have seen my lord, how could I not rejoice?\""
 tongyong_event.35.t: "Wedding with Hibarigaoka Yuki"
