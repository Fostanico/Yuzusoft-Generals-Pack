###结婚事件
 get_married: "We're Getting Married!"
 tongyong_event.1.t: "Affinity System"
 tongyong_event.1.d: "You will have a global affinity system. When affinity is maxed out, wedding decisions with generals are unlocked, and after marriage that general receives comprehensive boosts. Different affinity levels also grant different national modifiers (national spirits), and the number of Yuzu fans also affects the strength of these modifiers. The planned personal event chains will provide additional modifiers as well."
 tongyong_event.1.a: "Hooray!"
 tongyong_event.2.t: "Wedding Preparations"
 tongyong_event.2.d: "Our wedding preparations feel like a beautiful dream. From the moment we chose the rings, this happiness has been firmly in our hands. The sparkle of the diamond, like our love, is radiant and eternal.\n\nWhile planning the ceremony, we listened to each other's wishes with all our hearts. One of us longed for a warm, intimate ritual, while the other dreamed of a romantic feast. So we blended the two perfectly into a wedding that is uniquely ours.\n\nThe days of buying wedding supplies were full of joy. We picked out exquisite tableware and soft cushions, adding warmth to our new home. Every item carries our hopes for the life ahead.\n\nThrough this busy yet wonderful preparation, we have come to cherish each other even more. This wedding will be the most unforgettable moment of our lives. We are ready to welcome the happiness to come."
 tongyong_event.2.a: "Hooray!"
 tongyong_event.3.t: "Wedding with Nene"
 tongyong_event.3.d: "Today is a special day. Nene, standing beside you, wears a pure white wedding dress with a smile on her face: \"Is Nene ready?\" \"Let's go.\" You take Nene's hand and walk to the front of the stage.\n\nThe audience is made up of the members of the Yuzu General Staff and the Guard Artillery Regiment. Nene's adjutant, barely holding back a laugh, hands her a gift. When Nene opens it, her face flushes bright red — a brand-new detonator. You quickly close the gift and send the box to the backstage.\n\nThe wedding ceremony begins. You once again express your love to Nene, and the people below offer their congratulations. You notice Nene is about to cry, but in the next moment a happy smile spreads across her face: \"Thank you, everyone!\"\n\nThree congratulatory cannons fire 7, 2, and 1 shots respectively. Amid the booming salute, Nene leans against you with a smile: \"Please take care of me from now on.\" \"Then... can you perform a 0721 for me later?\"\n\nHearing that, Nene pouts her lips"
 tongyong_event.3.a: "\"Thinking about that on the very first day of marriage... you're terrible.\""
 tongyong_event.4.t: "Wedding with Noa"
 tongyong_event.4.d: "There are still a dozen or so minutes before we need to enter the venue — why hasn't Noa come out yet?\n\nYou shove the door open, and there's Noa, still sitting in front of the fitting mirror, munching on potato chips and reading a shoujo manga. \"Hey, we're about to go in. Stop reading.\"\n\n\"Don't rush me, don't rush me,\" Noa dodges your reaching hand. \"The hero's about to confess to the heroine on the next page! I'll go as soon as I finish this, I promise~\"\n\nWhat kind of bride gets absorbed in a shoujo manga right before her own wedding!? Honestly, time for a little mischief~\n\nThe moment Noa turns the page, you pull her light body into your arms and lean close to her defenseless ear: \"Noa, I love you. Will you be the heroine of my life forever?\"\n\nThe result? Noa nearly tripped twice on the red carpet, her face staying red all the way to the very end of the wedding.\n\nSilly girl — you were the heroine all along. How could you not realize that?\n\nAh well, what can you do — she's my angel~"
 tongyong_event.4.a: "These black wings are the proof of the choice I made"
 tongyong_event.5.t: "Wedding with Meguru"
 tongyong_event.5.d: "Today is a special day. The mischievous, adorable girl of the past stands before you in a pure white wedding dress. You hold her little hand tightly and pour out your feelings, and a magical crystal heart appears in Meguru's hand. With tears in her eyes, she says it's the best gift she has ever received in her life.\n\nThe soldiers of the Inaba Meguru Armored Corps drive their tanks past in formation, enthusiastically offering congratulations to their leader, while the other members of the Yuzu General Staff record this wonderful moment with their cameras.\n\nRight now, the whole country is basking in the joyous atmosphere of the wedding."
 tongyong_event.5.a: "\"Our magic exists for the sake of love.\""
 tongyong_event.6.t: "Wedding with Aya"
 tongyong_event.6.d: "Behind the curtain of the stage, even though she has become human again and put on her wedding dress, Murasame still asks you with tears in her eyes: \"Can the mistakes of my past really be forgiven?\" She buries her head in your chest and cries. You soothe her: \"Everyone's still waiting outside. If you cry your makeup off, you won't look pretty.\" Murasame wipes away her tears, breaks into a smile, and pulls you onto the stage.\n\nOn stage she is as cheerful as ever, and bluntly accepts your vows. You slip the ring onto her finger yourself, and the crowd below erupts in cheers.\n\nAfter the wedding ends, the crowd disperses, leaving only the two of you. \"Going from an immortal body back to being human... Aya, do you regret it?\"\n\n\"No. I believe... these five hundred years of waiting were so that I could meet my master.\""
 tongyong_event.6.a: "\"Thank you for crossing five hundred years of time and space to meet me.\""
 tongyong_event.7.t: "Wedding with Tsumugi"
 tongyong_event.7.d: "The door creaks open, and there stands the figure you've been longing for. You've seen her plenty of times, yet your heart still skips a beat at the sight of that pure white figure. \"You've barely worn any dresses, and now you're in a wedding gown.\"\n\nShiiba smiles, both happy and shy. Remembering that witch's contract of hers that always made you laugh and cry, you can't help but chuckle and pat her head. She beams brightly and adjusts her veil a little: \"Hey, you have to carry me in later.\"\n\n\"Okay,\" Tsumugi is very light, her small body fitting perfectly in the crook of your arm, clinging to your chest like a feather, \"Why do you ask for that?\" \"When you were in that bear-like state, I carried you plenty of times. Now you have to carry me back.\" Tsumugi tilts her head and thinks for a moment, \"This is our unequal treaty — you have to carry me at least until the wedding is over. No refusing!\"\n\nEven though it was just signed, I'm going to amend it on my own. The compensation clause is now: my embrace belongs, for this lifetime, only to the cutest, gentlest, most heart-stirring Shiiba Tsumugi miss. This time, it's final."
 tongyong_event.7.a: "\"My princess, from now on I will always protect you.\""
 tongyong_event.8.t: "Wedding with Mako"
 tongyong_event.8.d: "Whispers lingered behind the door for a long while before Mako, shoved forward by Yoshino, came out shyly holding up her skirt. \"Hey, Mako, look at me.\" You gently cup Mako's face. \"Today, you're the star.\"\n\nShe is completely different from the Mako you usually see. In her wedding dress she has gained an air of sanctity and cuteness. A faint scent of lavender wafts from her, and her feet fidget awkwardly in her high heels — it's impossible to connect her with the lewd ninja who used to spend every day buried in housework.\n\n\"Mm,\" Mako answers in a small voice. \"I'm so nervous. I... I'm not used to being the center of attention for so many people.\" The comforting words reach your lips but you swallow them back — the more you say, the less she'll be able to take that first step. Usually she's the one playing pranks; why not let me be the bad guy for once? She's afraid of heights, isn't she? \"I have a way to quickly get rid of your nervousness.\" You can barely keep from grinning. \"Eek!\" Mako yelps as her feet suddenly leave the ground. Hoisting the white dress over your shoulder, you run down the red carpet.\n\nDon't be nervous, Miss Mako. Nervousness won't do. Not just today — from now on, you'll be the heroine of my life."
 tongyong_event.8.a: "\"From this day forward, you are the heroine of my life.\""
 tongyong_event.9.t: "Wedding with Yoshino"
 tongyong_event.9.d: "The sky is cloudless today. For me, this day is not only relaxing, but also...\n\n\"Are you ready? Cheer up, okay? Since you accepted my (), don't forget what you promised me yesterday...\"\n\nYoshino has long since changed into her white dress. There is a hint of shyness in her eyes and a trace of bashfulness in her voice.\n\n\"Mm, I haven't forgotten.\" The moment we exchange rings, I can't help but think of when we first met. There was some distance between us, and we quarreled, but we also came to understand each other and joke around... like that time we argued over whether the rolled omelet should have sugar. But looking back now... it was more like playful flirting, wasn't it?\n\nYoshino grips my hand tightly, her eyes full of love, and says softly: \"Please... take care of me from now on too...\" No matter what difficulties we face, we will overcome them together, and everyone present will be our witness."
 tongyong_event.9.a: "\"No matter what happens, we'll keep walking together, until forever.\""
 tongyong_event.10.t: "Wedding with Ayase"
 tongyong_event.10.d: "Today, the not-quite-perfect perfect girl complains for the seven hundred and twenty-first time that she isn't perfect. \"Stop staring at me! Stare again and I'll twist your head off!\" Ayase covers her chest with both hands, her whole face dark as thunder.\n\nYou're baffled. \"Is it really that important to have that?\" Honestly, there's not the slightest difference in how she looks. But Ayase cares about every single imperfection — cares very much. \"It is important!\" Ayase stops grinding her teeth and sighs. \"I want everyone to see that you have a perfect wife...\" \"You're still as silly as ever.\"\n\nAyase barely lifts her head before she's pulled into your embrace. \"In my heart, you've always been the finest adjutant and the most perfect girl. Ayase — in the past, in the present, and forever. This is our wedding. Don't worry about what others think.\" \"You're just saying that to cheer me up.\"\n\nAs she speaks, Ayase buries her face completely in the warmth before her. But you know — every day with you here is perfect. I'm so glad I've always had you, and I won't be able to do without you in the future either, the perfect girl thinks to herself. Today is the last time the not-quite-perfect perfect girl complains that she isn't perfect."
 tongyong_event.10.a: "\"There may be quarrels and cracks ahead, but the love between us will heal everything.\""
 tongyong_event.11.t: "Wedding with Nanami"
 tongyong_event.11.d: "The wedding has begun, but the bride Nanami is hiding backstage, too nervous to appear. With the encouragement of the other Yuzu General Staff members and you, you take Nanami's hand and slowly walk onto the stage. After you speak your vows to Nanami, she is at a loss for words for a moment, then says with a red face: 'It looks like I can only take care of big brother for the rest of my life...'\n\nMany people in the audience were once healed by Nanami's Astral ability — soldiers, workers, farmers, young children, and even soldiers of enemy nations. In their hearts, Nanami is their hero, and today they cheer for their hero's wedding day. The whole country is bathed in the joyful atmosphere of the wedding.\n\nAt night, you finish your day's work and return home. When Nanami sees you, she runs over and hugs you, whispering softly: \""
 tongyong_event.11.a: "\"Welcome home, big brother!\""
 tongyong_event.12.t: "Wedding with Kanna"
 tongyong_event.12.d: "In her new wedding dress, Kanna clatters down the stairs and bursts into the gentle afternoon sunlight. \"Hey hey, how's this one? Prettier than the last, right?\" She twirls lightly, letting the white dress bloom. The Duke lifts half an eyelid from his sunbath on the windowsill. \"This lewd little reaper girl of ours rarely takes anything this seriously. Running up and down — aren't you tired?\" For an entire afternoon, you and the Duke watched her. \"Don't talk nonsense — I've been serious for a long time now,\" Kanna turns her smiling eyes to you. \"What do you say, darling?\" You stretch lazily, your gaze lingering on the Duke: \"I'd rather be a cat.\"\n\n\"Why?\" Kanna feigns anger. \"Is married life already getting boring before it even starts?\" Your eyes return to Kanna. \"Cats have nine lives, you know. That way I can meet my grim reaper girl nine times.\"\n\nKanna's skirt blooms in your arms. \"I only need this once. Once in this lifetime is enough.\" Grim reapers laugh too. Grim reapers cry too. O traveler of life, do not fear the reaper. Sometimes, the reaper girl is very gentle. Really."
 tongyong_event.12.a: "\"Even a grim reaper is human, after all.\""
 tongyong_event.13.t: "You Idiot, Get Up Already!"
 tongyong_event.13.d: "Even though there's still some time before the schedule I'd planned, under Unohana's relentless assault I have no choice but to start getting ready early.\nThe little sister before me looks like I'm seeing her for the first time: a thin layer of peach blossom seems to tint her cheeks — not rouge, but a color she can't hide seeping up from beneath her skin, blending with the joy at the corners of her brows. Her lips are touched with fresh lipstick, pomegranate red, slightly pressed together. Seeing me arrive, she lowers her head again, as if unable to bear the too-abundant joy in her own eyes — yet she can't quite hide a girl's shyness.\n\"Don't be shy — today's little Sana is the prettiest!\" \"You too. Are you really going to just stand there and do nothing while your cute wife is right in front of you?\" Under everyone's encouragement (and threats), I barely manage to take Sana's little hand. First comes a faint tremble — then she finally lifts her eyes, carrying the same unease as mine, but with something more, as if she wants to turn this moment of touch into a promise. Sana's eyes suddenly grow a little warm; flustered, she lowers her head again — but she doesn't pull her hand away.\nIt really happened. See, I told you — big brother is just a nobody nobody wants, and since no one would want to marry a good-for-nothing like him, as the eldest child of the Chitose family I'd be in real trouble, so as his little sister I have no choice, and he's just my brother so please don't get carried away——\nHow many times has it been now? Whatever — as her big brother, I suppose I should give in to my little sister a little.\n\"You brat! Take good care of Sana from now on, you hear? My most beloved granddaughter is in your hands!\" Without answering, you gently cup Sana's cheek, doing the same thing you've done countless times before, and softly press your lips to hers. After a moment's hesitation, Sana quickly returns your affection.\n\"Please take care of me from now on too, big br...\"\n\"Ah, no — my dar-ling!\""
 tongyong_event.13.a: "Love in Full Bloom ☆ Let the Two of Us Shower in Love"
 tongyong_event.14.t: "Wedding with Big Sis Natsume"
 tongyong_event.14.d: "Big red lanterns, a bridal sedan carried by eight bearers, gongs and drums splitting the sky. The sedan chair stops before you amid the sound of firecrackers. Nozomi's mother helps the bride in her red veil down, and for a moment, through the thin red gauze, your eyes meet. Pitter-patter, light footsteps land before you.\n\n\"Does this qipao suit me?\" Natsume is dressed in full traditional Chinese style, her cloth shoes drawing shy little circles on the ground. \"Of course it looks great. How about wearing this to the café next time? Our customer traffic might even go up.\" Natsume shoots you a fierce glare, then hurriedly looks away. \"If I weren't marrying you, I'd never wear this embarrassing outfit.\" Grinning, you lift the veil, leaving Natsume no place to hide.\n\n\"Come on, let's go inside. Mom and Dad are waiting.\" \"Eek! Don't pull me so fast!\" When you bow to each other as husband and wife, Natsume softly calls out to you. \"I like you.\" She looks up, a little embarrassed. \"I've always liked you. So don't you dare change your heart.\" Her gaze turns fierce — perfect chance to tease her a little~ \"Only 'like'? After all these years, still just a bland, tasteless 'like'? How sad.\"\n\nNatsume freezes for a moment, her expression cycling between fierceness and embarrassment, until finally, as if she's made up her mind, she stares hard at you and lunges into your arms.\n\nA light breeze passes your ear: \"I love you.\"\n\nLove stands as firm as a mountain. I don't ask for a thousand years of stability — a lifetime of growing old together is enough.\n\n\"Natsume, I love you too.\""
 tongyong_event.14.a: "\"Hold your hand, and grow old together with you.\""
 tongyong_event.15.t: "Wedding with Kyouhei"
 tongyong_event.15.d: "As the curtain of salute cannons and flowers rises, Kyouhei stands with you at the wedding venue, a bond that has only grown stronger through the baptism of war.\n\nThere were quarrels, but also sweet moments. From the moment you met, the gears of fate began to turn, and the luster of love blessed you both, making you happy bride and groom. Holding the hand of Kyouhei in white, time seems to stand still, because you know there is now one more person in your life to protect.\n\nAfter the ceremony, you walk out of the hall hand in hand. The sun is so radiant. Looking at Kyouhei's slightly tipsy, entranced face, \"Please take care of me from now on\" — the two of you answer each other in unison."
 tongyong_event.15.a: "\"Never Alone Again\""
 tongyong_event.16.t: "Wedding with Chihaya"
 tongyong_event.16.d: "In a lifetime, you meet about 29.2 million people, and the odds of two people falling in love are 0.000049.\n\nLove may begin with coincidence, but its blossom and fruit are always one of a kind in this world.\n\nThink back — since that feeling first took root in our hearts, how many trials have we weathered together? But today, it all comes into bloom: we have officially decided to spend the rest of our lives with each other. The wedding is already being planned. Two people still clumsy at this sort of thing suddenly find themselves swept up in a whirlwind of invitations, venues, dates, menus, ceremonies... Some days we're so worn out we collapse into bed the moment we're home. But unlike the lonely struggles of the past, we will smile and bring that day down from our dreams, make it come early — and every moment after will be——"
 tongyong_event.16.a: "Never Alone Again"
 tongyong_event.17.t: "Wedding with Hazuki"
 tongyong_event.17.d: "The wedding with Hazuki arrives right on schedule. Hazuki, in her wedding dress, walks to the stage and stands shoulder to shoulder with you.\n\n\"Hazuki, from now on, are you willing to...\" Before you can finish, Hazuki is already nodding eagerly, and expresses her love in a passage of classical Chinese. The crowd below erupts in cheers.\n\nAfter the ceremony, everyone is at the banquet, when Hazuki receives a phone call. She immediately goes to the changing room, puts on her military uniform, and rushes out. You quickly follow.\n\n\"What's this? On a day like this, you won't stay with me a little longer?\" Hazuki's face shows her difficulty. \"I have my own mission. My duty is to guard everyone's happiness.\"\n\nYou grab her hand. \"From now on, your duty is my duty too. This is our shared mission.\"\n\nThe setting sun falls on the two of them — a scene of rare beauty."
 tongyong_event.17.a: "\"Let's go protect more people's happiness.\""
 tongyong_event.18.t: "Please Entrust Him to Me!"
 tongyong_event.18.d: "Fumika holds your hand tightly. You've never seen Fumika this adorable. You pat Fumika's head.\n\"Honestly... I'm not a kid. You don't need to comfort me like that.\" Fumika refuses to admit it, but she really is still nervous.\n\"It's just meeting the parents. You've met them before, so what are you nervous about?\" You ask with a smile.\n\"How is that the same... Before, I was the homeroom teacher... and the big sister... but now it's different...\" Fumika blushes; the rest of the words want to come out but won't.\n\"Now I'm what?\" You ask deliberately.\n\"You rascal, do you even need to ask...\" Fumika is a little annoyed that you're teasing her at a time like this, but she says it anyway: \"I'm your fiancée! Happy now?! You rascal!\" After saying it, she immediately pouts, and even tries to shake off your hand.\n\"Sis Fumika, you've been dawdling outside forever, so impatient... I'll give you a hand!\" Amane pops out of nowhere and shoves Fumika through the door.\n\"E-eh! Little Amane, slow down!\" Fumika is pushed through the door by Amane, and awkwardly looks at Yuzuki sitting on the sofa. \"Um... hello, Auntie...\" A thought flashes through Fumika's mind — should she call her Auntie or Mom? But shyness only lets Fumika get out \"Auntie.\"\n\"Oh my? Still calling me Auntie?\" Amane grins wickedly at Fumika. You also walk in from outside, and seeing the awkward atmosphere, try to chime in. \"My, my, it's rare for Fumika-chan to visit. What's going on? Did Amane invite you over to play?\" Yuzuki says to Fumika.\n\"Mom~ Fumika-nee wasn't invited by me today, you know. It was big brother who invited her.\" Amane is still stoking the fire. You turn around and glare at Amane, who slips back to her room with a completely innocent look.\n\"Mom, I have something very important to say.\" Seeing that Fumika probably can't get the words out herself, you decide to speak for her.\nFumika tugs your hand. You turn to look at her, and her expression is resolute — she wants to say it herself.\n\"Um... Auntie, your son and I have decided to get married... So... please entrust him to me!\" Fumika says firmly.\nEven though she's bringing her fiancée home, why does Fumika put it that way? You find it a bit odd, but don't ask on the spot.\n\"Really? Fumika? I'd heard from Amane before that this kid was dating someone, but I never imagined it was Fumika-chan. Then I can rest easy.\" Yuzuki laughs.\n\"Fumika-chan, sit down, sit down. Now that my daughter-in-law's here, I need to prepare a good dinner — and I'll tell his father the good news too.\" With that, Yuzuki heads to the kitchen.\n\"Auntie, let me help too...\" Fumika quickly says. \"How could I let my daughter-in-law work on her first visit? Amane! Get out here and work!\"\n\"Why did you say you wanted to take me? You're a girl, you know.\" When no one's around, you quietly ask Fumika.\n\"Of course! I'm the adult here, so of course I have to take responsibility for you.\" Fumika says it as if it's the most natural thing.\n\"Is that so? But you don't act like an adult at all usually.\" You say with a smile.\nFumika takes the chance to burrow into your arms, pouting: \"I only stop acting like an adult in front of you, you rascal.\"\n\"You've been a bit clingy in front of others lately too.\" You gently stroke Fumika's head.\n\"Of course. You've finally graduated, so I don't have to hide it anymore. Whenever I see you I want to cling to you... I don't care who's watching.\" Fumika mutters.\nYou suddenly feel Fumika is even cuter than usual. Fumika suddenly looks up again: \"So, as an adult, I need to take good care of this little one.\" Just as you're about to say something, Fumika stands up and heads for the kitchen. \"Mom, I'm coming to help too!\" Fumika says to Yuzuki.\nYou sit alone on the sofa, watching Fumika's retreating figure, and smile. Fumika has taken a new step in your relationship, and you know you can't stand still — at least, you have to keep up with her."
 tongyong_event.18.a: "\"Even adults need someone to lean on sometimes. From now on, I'll be the one taking care of you.\""
 tongyong_event.19.t: "Wedding with Nozomi"
 tongyong_event.19.d: "With a swoosh, my blanket is gone. Sleepiness presses my eyelids down hard, and through half-open eyes the world is dim. A figure in an apron stands by the bed like a guardian deity, one hand holding the blanket that was just on me, the other wielding a spatula that gleams coldly — a housewife's outfit worn with the presence of a feudal lord.\n\nOh, oh. Nozomi, can I sleep five more minutes...\n\n\"Big bro, if you don't get up you'll be late for work! And no curling up in bed trying to sneak in a second sleep! Get up, you...\"\n\nIn the end, under the tyranny of the spatula, and after correctly assessing my head's ability to regenerate, I choose to get up and save my life.\n\nNozomi — full name Sumizome Nozomi — is my childhood friend. She used to hold the position of my girlfriend, and a month ago was promoted to my wife. Right now she's chattering by the dining table about the daily grind of groceries and bills, her gentle tone a world apart from the spatula-wielding guardian of a moment ago. Well, I love every side of her anyway.\n\nThe morning sun is just right, light pouring in, the small room brimming with warmth. The photo on the table is dyed in today's sunlight — in it, Nozomi smiles with carefree sweetness. Because she knows that no matter how plain or ordinary the days ahead are, they will be memories unique to the two of us.\n\nYou reach out and ruffle Nozomi's hair, and her face flushes in an instant. Companionship is like rosemary — a romance that drifts through the decades, and my never-stopping confession to her, in every single moment."
 tongyong_event.19.a: "\"Love you, Nozomi. See you tonight.\""
 tongyong_event.21.t: "Wedding with Wakana"
 tongyong_event.21.d: "In the corner rests a guitar under a light layer of dust. Both she and I know this guitar well — in a sense, it's the key to our fate. Everyone's been busy these past days, no time to tend it, so only this morning did Wakana take it out and put it in the corner.\n\nI watch Wakana's back as she adjusts her veil: \"You'll be fine playing this in the wedding dress, right?\"\n\nWakana doesn't turn around, staring hard at herself in the mirror, afraid of missing any flaw in the dress: \"Don't worry about my guitar. Check your own bass playing first. Stop asking me everything — learn to solve problems yourself.\"\n\nI walk behind Wakana to help fix her dress: \"So, want to do that confession mid-performance again?\"\n\nWakana abandons the dress issue, turns around, and starts pounding on me, an extra dash of charming redness on her already adorable face: \"Haven't had enough of being brave man for half a year, have you?! Stop pulling stunts like that, my heart can't take it!\"\n\nCome on, you're the one who can't stop laughing. Besides, the piece we're about to play is called \"Only You,\" so you'll just have to let your poor little heart tough it out through the wedding~"
 tongyong_event.21.a: "\"There will be plenty of surprises ahead too, my Queen Wakana.\""
 tongyong_event.22.t: "Wedding with Touko"
 tongyong_event.22.d: "\"How do I look?\" Touko stands before you in a pure white wedding dress, facing you in your formal suit. Her face is full of happiness as she tilts her head up to ask.\n\"Beautiful. It suits you perfectly.\" You take both of Touko's hands.\n\"That's all you ever say.\" Touko seems a little disappointed that you can't come up with anything else.\n\"But... it's not like I haven't tried the dress on before... Why ask again now...\" You really want to complain — is there even room to change it if I said it didn't look good now?\n\"Because... I want you to see the best of me.\"\nTouko's sudden words interrupt your thoughts. Your gaze can't help but return to her face. Her words strike you right in the heart.\n\"This is the most important day of a lifetime with you... How could I not show you my best self?\" Touko smiles beautifully. You can't help but want to keep this Touko all to yourself, and you hold her tightly.\n\"My, my... honestly... we're about to get married, and you're still acting like a spoiled child to your big sister~\" Touko laughs in your arms, but returns your embrace, her arms circling your waist.\nYour embrace lasts for a while. Before you know how much time has passed, the hall doors suddenly open.\n\"Honestly... the wedding's about to start. Where are the bride and groom?\" Meguru runs out of the hall and looks around — and then sees the two of you embracing.\n\"Oh my, still being lovey-dovey at a time like this! Get into the venue now!\" Mama Tsumugi follows Meguru out, and the two of them barely manage to pry you apart, pushing you into the wedding venue.\n\"Next, please welcome the bride and groom.\"\nThe emcee's voice comes through. Meguru and Mama Tsumugi slip away, and from now on, the two of you are the stars.\nYou and Touko exchange a glance, and walk arm in arm toward the stage.\n\"Groom, are you willing to protect Miss Touko for life?\"\nYou kneel on one knee, holding Touko's right hand. The ring on her ring finger sparkles brilliantly.\n「I want to be with you forever — falling asleep together at night, waking up together in the morning, together in every moment. I want you to become a matter-of-course part of my life, and I want to become a matter-of-course part of yours. I don't want you to be lonely anymore. So — let's get married.」\nA faint blush rises on Touko's face, and she answers naturally.\n「Yes, I do.」"
 tongyong_event.22.a: "\"To live with the one I love most, never ever apart — and now, this is the moment that long-awaited future arrives.\""
 tongyong_event.23.t: "Wedding with Masaki"
 tongyong_event.23.d: "The Fang-and-Claw Beast Tavern tried expanding its business today.\n\nOrr's wolf tail is sticking straight up in the air as he carries stacks of chairs around the place, arranging them. The people helping set up point at the mock-up and discuss it, all while enduring Mr. Orr's repeated bragging: \"My daughter's getting married!\"\n\nThe white gauze should hang this way; the tables should be arranged like this; even the tablecloth patterns need care. Nene focuses on arranging the baby's breath in the big porcelain vase, when a wolf tail humming a tune approaches from behind: \"Tsk tsk, my Masaki's getting married!\" The wolf tail bobs away into the distance.\n\nThe reception team at the door is still registering guests when a commotion rises from behind the crowd — and at its center is a wolf tail. Ayase looks up from her pile of papers and pens to find a huge wolf face right in front of her: \"Tsk tsk, my Masaki's getting married!\" Ayase puts on her sunniest professional smile, then watches the wolf tail drift away through a sea of congratulations. Elina glances at Ayase's chest: \"Miss Mitsukasa, is it easier for more... endowed girls to find a good husband?\" Ayase nearly loses control of her expression.\n\nIn the kitchen, pots and pans are being tidied, and you and Masaki are leaning on the counter, watching the bubbling pot. Masaki seems to have fallen asleep, her two fluffy ears rising and falling gently with each breath. A large, solid hand grabs your shoulder: \"My—daughter—Masaki—is—getting—married!\" The hand pats your shoulder and walks off.\n\nAn island, a shop, a home, a lifetime. There will be thousands of days like this ahead — waking up to her every day, falling asleep beside her every night. Companionship, plain yet happy. \"I'm glad you're here with me.\" Her fluffy ears twitch: \"Wahoo? Confessing while I'm asleep, are you?\" Masaki pokes your chest. \"You're not allowed to do that again — don't you dare hide your love for me.\"\n\nStarting today, the Fang-and-Claw Beast Tavern also hosts weddings."
 tongyong_event.23.a: "\"Silly, but so adorable.\""
 tongyong_event.24.t: "Wedding with Miu"
 tongyong_event.24.d: "Hey, listen to this.\n\nOnce upon a time, deep in the mountains, there lived a bat. This bat absorbed the spiritual energy of heaven and earth and cultivated itself into a spirit. This bat spirit never harmed the living or ate people — its only indulgence was wild vegetables pickled in vinegar. As long as the hunters of the villages at the mountain's foot offered it a good bottle of vinegar, they were guaranteed a bountiful catch.\n\nLater, the bat spirit attained enlightenment and ascended to heaven to become an immortal. But before the immortal's seat had even warmed, it was caught stealing the Jade Emperor's offering vinegar, and was punished by being reincarnated in the mortal world. The person reincarnated ended up with a vampire constitution and a peculiar fondness for vinegar. If I weren't making all this up right now, people would think she was the vinegar-jar spirit reborn.\n\nMiu, how's my story?\n\nMiu said we'd finish the wedding first today — tonight she'd sew my big mouth shut with her sewing kit."
 tongyong_event.24.a: "\"Though she's the one smiling the happiest of all.\""
 tongyong_event.25.t: "Wedding with Mayu"
 tongyong_event.25.d: "The sun is just right today — a perfect day for a wedding.\n\nGreat figures have no private affairs. Even though the meaning of this wedding is no longer simply the announcement of happiness, in the gaps between the long lenses and flashing cameras, you two enjoy a moment of peace. At this moment, you need not worry about the hail of bullets beyond the hall.\n\nFrom the moment you met, the gears of fate began to turn silently. You have walked through countless days and nights together — laughter, tears, quarrels, and above all, deep love.\n\nEveryone genuinely acknowledges the contributions the two of you have made. This union has ignited unprecedented passion between the barracks and the people, and the two of you have become undisputed spiritual leaders.\n\nStanding on the wedding stage, watching her walk toward me in white, for that instant it seemed time itself stood still. I knew that from then on, there would be someone in my life to walk hand in hand with forever.\n\nThe sun is just right today. Walking out of the hall, you squint slightly — everything is bathed in sunlight, everything is bright. She grips your hand tightly. \"Tomorrow will be the same,\" she tilts her head slightly, and her smile topples cities."
 tongyong_event.25.a: "\"Aishiteru\""
 tongyong_event.26.t: "The \"Wedding\" with Amane"
 tongyong_event.26.d: "Moist sea breeze, lazy sound of the waves. Sunlight blankets the little boat. On this end of the boat, you're in your suit; on that end, she's in a white dress. A single skiff drifts aimlessly across the middle of the sea.\nAmane flashes her signature mischievous grin: \"Small-fry big bro~ you've gotten so fat~ look, the boat's tipping toward your side. Did you forget to exercise because you were too busy thinking about marrying the world's cutest little sister?~\" \"I did not!\" \"Then hurry up and come over here — I'll call you when the boat's level.\"\nYou know the boat won't capsize over a few dozen pounds. You know this is one of Amane's little pranks. And Amane knows her small-fry big bro will definitely take the bait.\nYou've already reached Amane. You smile wryly: \"One more step and I'll be jumping into the sea.\"\n\"Then I'll just fish my small-fry big bro back onto the boat.\" Little Amane leaps and throws her arms around your neck, her slender body giving off a fragrance different from the sunlight. You hold her tight — she's as warm as the sea, and you don't want to let go.\nScorching sea breeze, cheerful waves. The little boat is loaded with love."
 tongyong_event.26.a: "\"Big brother, I love you the most!\""
 tongyong_event.27.t: "Wedding with Suzune"
 tongyong_event.27.d: "Crystal clear, fragrant, refreshing — the cake fills the dignified hall with the air of happiness and festivity.\nThis is the cake Suzune-nee made with her own hands. Exquisite as a work of art, it rests peacefully on the display table, sleeping under a glass dome, gleaming under the lights. One glance tells you it is meant to be admired from afar, never touched.\nNo matter how everyone urged her otherwise, she insisted on crafting this one-of-a-kind cake with her own hands, no matter the effort or cost. After all, this is Suzune-nee — the hardworking Suzune-nee, the meticulous Suzune-nee, the Suzune-nee who is extremely strict with cakes and always strives for perfection — especially... with a cake of such significance. How precious I am in her heart needs no further words; the answer is already clear to all.\nShe must have been thinking just that, which is why she couldn't help smiling with quiet pride. Like the hands that have worked with pastries for years, her smile, too, seems dyed with the sweetness of cream and fruit — so sweet, so warm, as if it could melt all the world's troubles like cream, flowing away with the warmth inside, never to return.\nI savor this sweet, warm feeling, unaware that my hands, holding a gleaming ring, have been suspended in midair for quite a while.\n\"Ah~ so slow. Give it here!\"\nSuzune-nee complains impatiently, grabbing my hand. A soft, warm touch spreads through my hand, flows into my body, filling my very core.\nShe first slips a ring onto her own ring finger, then deftly slides the other ring from her hand onto mine. Keeping that final pose, she looks at my face with dissatisfaction, as if waiting for some response.\nThis scene is utterly adorable. How can I resist savoring those small, delicate lips?\nAmid a burst of cheers, we close our eyes and hold each other tight. With a kiss we accept everything about each other, pledging a vow called \"love,\" not parting for a long time — as if nothing else exists in the world but each other's warmth and desperately restrained breathing, exchanged with fervor.\nThe sensation on my lips is so full it leaves my mind blank, as if heaven is right at hand. My only thought: I want to scoop up her small body and kiss her even more passionately... but if I actually did, she would definitely get angry.\nA barely suppressed laugh interrupts this absurd thought, and the two of us reluctantly part our pressed lips, gazing at each other tenderly. Her eyes are so enchanting — as if they could hold the entire universe, captivating the soul.\n\"Alright, stop standing there like a fool. Come cut the cake.\"\nAt the end of the wedding, the finale is inevitably this cake. Without a doubt, it will be the last pearl adorning this grand feast.\nOur two hands, one large and one small, overlap, carrying the hearts bound tightly together, sinking the pastry knife deep into the soft cake, cutting it with great care.\nFrom now on, we will make many more cakes together like this. After all, this happiness belongs to us alone — but this sweetness——"
 tongyong_event.27.a: "We vow to share it with the whole world"
 tongyong_event.28.t: "Wedding with Shirley"
 tongyong_event.28.d: "In a lifetime, you meet about 29.2 million people, and the odds of two people falling in love are 0.000049.\n\nLove may begin with coincidence, but its blossom and fruit are always one of a kind in this world.\n\nThink back — since that feeling first took root in our hearts, how many trials have we weathered together? But today, it all comes into bloom: we have officially decided to spend the rest of our lives with each other. The wedding is already being planned. Two people still clumsy at this sort of thing suddenly find themselves swept up in a whirlwind of invitations, venues, dates, menus, ceremonies... Some days we're so worn out we collapse into bed the moment we're home. But unlike the lonely struggles of the past, we will smile and bring that day down from our dreams, make it come early — and every moment after will be——"
 tongyong_event.28.a: "Never Alone Again"
 tongyong_event.29.t: "Wedding with Kurume"
 tongyong_event.29.d: "The setting sun spills over Kurume's delicate cheeks, and her signature smile shines in your eyes.\n\"This beach... this sunset... they're just like back then. You picked this spot specially.\" You look at Kurume as you speak — except this time, Kurume is wearing a wedding dress.\n\"This place is beautiful enough, so I specially chose it for our wedding photos.\" Kurume says with a smile.\n\"You're beautiful as you are. With a backdrop like this, you're an angel.\" You praise Kurume.\n\"The angel is right here... and you're calling someone else an angel right in front of her.\" Noa descends from above your head and teases.\n\"After all, the only angel in my heart is Kurume.\" Your reply to Noa pleases Kurume greatly.\n\"Mwah.\" Kurume hugs your arm and plants a light kiss on your cheek.\n\"Saying such sweet things... you make me want to reward you a little.\" Kurume brushes her hair back, a faint blush rising on her cheeks.\n\"Hey! This shot feels great! We can take this one!\" Kinoshita suddenly calls out to you.\n\"Right, right — Kurume, hold that pose from just now, the moment of the light kiss.\" Shiraishi adds.\nKurume hugs your arm again — and of course, her curves press against your arm too. This time, it's not just Kurume whose face is red — yours is too.\nShiraishi checks the result with the photographer and laughs. Kinoshita sees Shiraishi laughing and comes over to look, and starts laughing too.\n\"What, what! What are you laughing at!\" Not knowing what they're laughing at, you take the camera and look at it yourself.\nThen you see it — because Kurume suddenly pressed up against you, your expression is visibly flustered, face red, eyes darting toward Kurume — and that exact moment was captured on camera.\nKurume links her arm through yours and comes over to see the photo too. She wears the same expression as her two best friends.\n\"This one's great — I'm keeping it! Give it to me, give it to me!\" Kurume says to the photographer.\n\"What's so great about it...\" You mutter quietly.\n\"This photo... I'm going to treasure it for a long, long time. My husband has his shy moments too — this is worth keeping.\" Kurume says with a smile. For some reason, looking at that smile, you find it hard to refuse her request. You'd wanted to delete the photo, but now — as long as she's happy, you can't bring yourself to object.\n\"At first... I only liked your cool side — risking your life to protect me. I liked your gentle personality, the way you treat everyone kindly... and now I also know that you blush and go red because of the things I do. That's enough. I can feel your love for me.\" Kurume looks into your eyes and hugs you.\n\"Wow, wow — showing off your love right in front of us.\" Shiraishi says.\n\"There'll be plenty more moments like this. You'll have to get used to it.\" Kurume fires back bluntly.\n\"Fine, fine... little Kurume doesn't even want her best friends anymore now that she has a husband.\" Kinoshita says in a pitiful tone.\n\"Okay, okay — pose again and we'll take two more shots.\" The photographer interrupts Kurume's joking with her friends.\nYou hold Kurume and switch poses for the wedding photos. The setting sun shines on both of you — just like when you first got together. Under that same sunset, you became a couple; and now, under the sunset once more, you bear witness to every step you'll take into the future together.\nYou walk side by side. No matter what difficulties you face, you'll cross them together — holding hands through the peaceful, ordinary days."
 tongyong_event.29.a: "The Heart Knows the Way"
 tongyong_event.30.t: "Wedding with Airi"
