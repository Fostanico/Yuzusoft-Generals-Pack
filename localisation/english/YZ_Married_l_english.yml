 tongyong_event.50183671.a: "Lolicon!!! Voltage rising!!!!"
 tongyong_event.50183671.t: "Wedding with Mera Azusa"
 tongyong_event.50183671.d: "\"Hey... I'm asking you — you're a lolicon, right?\" Naota looks at your marriage partner and says.\n\"I'm not a kid! I'm an adult!\" Azusa angrily jumps up and smacks Naota on the head.\n\"There, there~ ignore him. Don't let him ruin the mood of this wonderful day.\" You ruffle Azusa's head, saying with a smile.\n\"Mm-hmm... I don't want to be treated like a kid by you...\" Azusa pouts in defiance, but pouting is all she can do.\n\"Alright, alright — you're not a kid either, I know.\" You say gently.\n\"Aren't you a lolicon!? If I'm not a kid... what if you stop liking me!\" Azusa suddenly says the exact opposite of what she said a moment ago.\n\"Huh?\" You don't quite understand what Azusa is saying. She was just insisting she's an adult — why is she suddenly saying she's a kid?\n\"You... you said it yourself... you once said any girl past twelve is already an old hag... and you even admitted you're a lolicon...\" Azusa says nervously.\n\"That, that... I keep thinking — if I'm not a loli anymore... would you stop liking me...\" Azusa is a little incoherent, speaking whatever comes to mind.\n\"Silly, you're not a kid.\" You laugh. Azusa is still this adorable even right before the wedding.\n\"Then you don't like me!?\" Azusa bristles.\n\"That's not it, silly. I'm not a lolicon, and you're not a loli — you're a mature adult. What I love is the mature Mera Azusa as a person.\" You lift Azusa in a princess carry and head toward the wedding hall.\n\"Then... doesn't that make me a legal loli...\" Azusa mutters quietly.\n\"A legal loli... is still legal.\"\nAzusa angrily pounds your chest with her little fist, puffing her cheeks:"
