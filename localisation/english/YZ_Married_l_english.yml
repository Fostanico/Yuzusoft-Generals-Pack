 tongyong_event.73719911.t: "Vows with Atri"
 tongyong_event.73719911.d: "\"Uwaa... Master, are you really going to do this with me, an android...? Won't Minazuki laugh at us?\" Atri, dressed in her wedding gown, looked up at you and asked.\n\"It's just you and me here. How would Minazuki ever find out?\" you replied.\nIt had been a long time since the two of you came to this place. This world was only for you and Atri.\n\"But... I'm an android, you know! Master, are you really going after robots now?!\" \"Bong!\" You gave Atri a light knock on the head.\n\"Uwaa! Violence against androids is illegal! You can't do that!\" Atri puffed her cheeks in protest.\n\"The Three Laws also prohibit robots from having emotions, don't they? What about you? You've been violating that for a long time already.\" You pinched Atri's cheek as you spoke.\n\"Ugh... Master is so mean...\" Atri finally gave in. \"Alright, alright, you silly robo-girl. Today's a special day, let's make it a memorable one. Don't go leaving a bad impression.\" You patted Atri on the head.\n\"But, but... I heard that for humans, getting married means entrusting the rest of your life to someone else... A-and I'm an android, I don't have a lifespan long enough to stay with Master forever...\"\n\"Idiot, what are you talking about? Aren't we going to spend our whole lives together in this space? By the time your lifespan runs out, I'll be old too.\"\n\"Oh... So that's... 'growing old together'?\" Atri finally understood.\n\"Yeah.\"\n\"No, no, no! My hardware doesn't have an aging feature! My hair won't turn white!\" Atri once again broke the mood.\n\"You really are an idiot!\" Even though she had gained a heart, she was still a silly robo-girl. How could she be so dense? You thought to yourself with some frustration.\n\"But if that's the case... I can keep taking care of Master forever. Even when your body starts to decline... I can always be by your side.\" Atri said with a smile.\nYou were stunned. Hearing what she just said, all your complaints vanished in an instant.\n\"When you can't walk anymore and have to use a wheelchair, I'll push you outside. We can go to that cliff where we first met, and watch the sunset together.\" Atri spoke with great tenderness.\n\"All of that... you remember?\" You couldn't help but gently caress her cheek.\n\"I remember every moment I spent with you, Master. Even after sixty years, my memory hardware is still intact! I am high-performance, after all!\" Atri said with a grin.\nYou looked at the smile on Atri's face before you. It was a smile you had seen countless times, but now, seeing her in a wedding dress with that same smile, your mind flashed back decades ago. Every memory, every moment with Atri, came flooding back.\n\"Master...\" Atri's voice brought you back. \"I'll always, always be with you, you know. I can be your legs and take you anywhere you want to go.\" Atri said.\n\"You idiot... You don't even know what marriage really means... Saying things like that... it's just cheating.\" You held back your tears. Crying in front of this silly robo-girl would be way too embarrassing.\n\"I may not know what marriage is... but I have a heart. I can feel your emotions, Master. So... all I have to do is respond to your feelings with my heart, right?\" Atri's expression was slightly puzzled, as if it were the most natural thing in the world for her.\nYou pulled Atri into a tight embrace. At first, she looked surprised, but then a smile spread across her face, and she wrapped her arms around you too.\n\"Atri, I love you.\" You whispered to her in your arms.\n\"I know, Master. I've known for sixty years. Now let me repay all those sixty years I owe you. I love you too.\" Atri said with a smile.\nIn this world that belonged only to you and Atri, you held each other close. There was no need to think about goodbyes, no need to worry about the future. Right now, it was just you and Atri, together forever."
 tongyong_event.73719911.a: "\"Until the day this sea connects us once more.\""

#神秘标记点@@
 tongyong_event.99756858.t: "Wedding with Yamabuki Aoi"
 tongyong_event.99756858.d: "Half an hour before the ceremony, Yamabuki Aoi is not in the bride's room.\nYou find her at the side door of the hall. The white dress is already on; the ponytail is still the everyday one. She is crouched, setting a fallen flower basket upright for a guest, smiling as she always does. \"It's fine, I've got it.\"\n\"The bride is not allowed to work—\" Wataru hauls her up, dress and all, phone already raised. \"Aoi, today you just stand there and get photographed. Haruki, watch her. Don't let her run off to move chairs for the student council again.\"\nSomething stiff pokes from her sleeve. When you pinch it, her ears go red first.\n\"Another charm?\"\n\"The curse is gone already... but it's a habit.\" She tucks the little pouch back, as earnest as if she were keeping a promise. \"It won't hurt to keep it, will it? In case you trip over a chair today...\"\nYou don't call her on it. She once asked for a hundred of them, and not one stopped the bad luck from landing on you. She knows they do nothing. She still brought one.\nThe dressing-room mirror shows only one of her. You remember two identical faces on the rooftop: one that said she liked you outright, one that hid it in a joke. In the wind they recognized the same words, and became one Yamabuki Aoi again. This Aoi is trying to even her breathing. Her palm is hot.\n\"Let's go.\" She takes your hand, tighter than any promise she ever made. \"We said we'd carry it together. Today counts too.\"\nThe aisle is not long. For the first time, the smile she gives equally to everyone leans—toward you. In the seats are the clubs she helped, the regulars from Robin, the Chitose table. Shinichiro polishes his glasses. Sana claps her hands red. Honoka, in the back row, wrings a tissue into a ball.\nWhen the ring goes on, she whispers \"Haruki,\" then shakes her head.\n\"That's not it.\"\nShe bites her lip, as if finally letting out a line she has practiced for a long time. Her eyes are too bright for someone who was ever dense about love.\n\"From now on, we'll be calling each other something different.\"\nThat night she puts the charm in the back of a drawer. She leans on your shoulder, tries the new name, then hides her face in your sleeve, leaving only the heat of her ears.\nA promise is still a promise. From today, it no longer has to be said in hiding."
 tongyong_event.99756858.a: "From now on, we'll be calling each other something different!"
 tongyong_event.11304845.a: "Ebihara Minase, you are the most important person to me"
 tongyong_event.11304845.t: "Wedding with Ebihara Minase"
 tongyong_event.11304845.d: "Today is the wedding of you and Shrimp-chan. All your old classmates from back then have come, holding a special wedding for the two of you. Hibarigaoka Yuki elegantly waves her baton, and then the clarinet, trombone, and timpani sound the Wedding March flawlessly. You see a small, familiar figure in a wedding dress walking toward you. Under everyone's gaze, you make your vows and present the diamond ring. Just then, your music-sensitive ear notices the trombone's breath is a little unsteady — but even so, this is still the best Wedding March you've ever heard, because the beloved before you is now lip to lip with you."


