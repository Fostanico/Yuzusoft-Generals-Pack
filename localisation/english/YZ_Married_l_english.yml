 tongyong_event.31.t: "Everyday Life with Roka After Marriage"
 tongyong_event.31.d: "\"About Tashin-ya opening a branch in the city... sure, that's fine. Tashin-ya's desserts and drinks are both excellent, so we're willing to invest in a branch... Afterwards, we'll still need to have a meal or something to confirm the cooperation details and sign the contract.\" The big investor says to you.\nYou go to the dinner with Roka. But at the dinner, the big investor brings up drinking again. Even though you immediately realize how serious the problem is, Roka still drinks. After seeing the investor off, Roka suddenly collapses into your arms.\n\"Roka-nee? Are you okay?\" You hold Roka and ask anxiously.\n\"I'm fine~ fine~ hehe... I can still walk!\" Roka gets up from your arms and staggers along. It's as clear as day — Roka-nee is drunk again!\nYou quickly grab Roka's hand, afraid she'll fall, and hold her tight.\n\"What's the matter? It was just a little drink... I'm not drunk... don't make such a fuss~\" Roka says with a flushed face. The smell of alcohol is practically spilling off her, but you still hold her tight. \"Yes, yes... not drunk... just hold my hand tight while walking.\" You play along with Roka-nee as she leads you by the hand along the road back to Tashin-ya.\n\"Hey, hey, hey — after we open the branch, will you leave me?\" Even drunk, Roka looks at you seriously.\n\"How could I... I told you before I'd never leave Roka-nee.\" You say quickly.\n\"Huh? You're not going to the branch... staying with me... then who's going to watch the branch?\" Roka says, a little confused.\n\"Huh???\" You're stunned too — then it hits you: Roka was talking about the branch.\n\"Hehe... you're so cute...\" Roka laughs. Looking at her smile, you understand — she said it on purpose.\n\"It's Roka-nee who's the cute one, obviously...\" You fight back, refusing to lose.\nAs she walks, Roka suddenly tugs your hand and turns to look at your face: \"Hey, hey — does this count as... a mom-and-pop shop opening a branch?\"\n\"Mm... that's all thanks to Roka-nee's good management.\"\n\"Idiot, who told you to say that.\" Roka taps your head.\nYou'd even complimented Roka, and she still tapped you — you're completely baffled.\n\"I was emphasizing the mom-and-pop shop, you idiot.\" Roka says with a red face. Her face was already red from drinking, but now it's even redder.\nYou laugh. Roka is still this adorable, and you can't help but hug her. \"Of course — you're the one in charge at home, so whatever you say goes. Without you, how could Tashin-ya have come this far? And how could I have fallen for you like this?\" You whisper in Roka's ear.\n\"What does that second half have to do with the first...\" Roka is shy now. Though her face has been red the whole way, you know that if the light weren't so dim, you'd see her face completely flushed.\n\"It's because Roka-nee always works so hard — what I'm drawn to is the Roka-nee who never stops trying.\" You say with a smile.\nYou know better than anyone how much of Roka's heart and soul it took for Tashin-ya to grow from a small dessert shop in Hoori into a shop opening a branch in the city.\n\"Hey, Roka-nee.\" You suddenly call out.\n\"What?\" Roka asks, puzzled in your arms, trying to turn to look at you — but just as she's about to, you press a gentle kiss to her cheek.\n\"I'll always be by Roka-nee's side, supporting you... So, thank you for everything you've done for our little family.\" You hold Roka tightly. You can't see her expression, but you know she must be smiling.\n\"Honestly... when you say things like that... I have to work even harder. To see more of your smiles... I'll keep trying harder.\"\nAs long as you're with Roka-nee, you feel cheerful and at ease. You firmly believe that as long as Roka-nee is by your side... you can cross any obstacle. That's the confidence Roka gives you."
 tongyong_event.31.a: "\"To me, you are someone precious. To see you smile, I'll do my best.\""
 tongyong_event.32.t: "Wedding with Koharu"
 tongyong_event.32.d: "In a lifetime, you meet about 29.2 million people, and the odds of two people falling in love are 0.000049.\n\nLove may begin with coincidence, but its blossom and fruit are always one of a kind in this world.\n\nThink back — since that feeling first took root in our hearts, how many trials have we weathered together? But today, it all comes into bloom: we have officially decided to spend the rest of our lives with each other. The wedding is already being planned. Two people still clumsy at this sort of thing suddenly find themselves swept up in a whirlwind of invitations, venues, dates, menus, ceremonies... Some days we're so worn out we collapse into bed the moment we're home. But unlike the lonely struggles of the past, we will smile and bring that day down from our dreams, make it come early — and every moment after will be——"
