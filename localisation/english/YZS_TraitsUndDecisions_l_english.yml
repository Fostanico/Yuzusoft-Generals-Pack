 youzu_air_dynamic_modifier_desc: "For a modern military power, developing the air force is indispensable, but our fledgling air force is still very fragile. Yet we believe that the Yuzu Air Force, tempered in battle after battle and grown through the efforts of our scientists, will one day annihilate all invaders, dominate the skies, and become the guardian god of our heavens."
