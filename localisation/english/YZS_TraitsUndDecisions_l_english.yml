 YzOpreative_anti_enemy_operative_desc: "Our intelligence director Arihara Nanami has, through all kinds of intelligence, identified the spies the enemy planted in our country. Nanami has decided to launch a purge operation to take them all down at once. But many of these spies are key figures in our government or even the military; issuing such an operation will certainly cause panic at home. Yet there is no doubt it is worth it"
