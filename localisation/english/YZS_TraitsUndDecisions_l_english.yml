 YZ_MIO_1_get: "Establish the Yuzusoft Infantry Weapons Bureau"
 YZ_MIO_1_get_desc: "Though warfare changes with each passing day, infantry and artillery still hold their place. Therefore, powerful firepower and sturdy rifles are the keys to victory. Fortunately, these girls can help us establish such a manufacturer.\n\nUnlocks the Yuzusoft military-industrial organization"
 YZ_MIO_3_get: "Establish the Yuzusoft Navy Escort Vessel General Administration"
 YZ_MIO_3_get_desc: "To prevent the shameless sneak attacks of the underwater little guys and to let us sneak-attack the enemy, we cannot ignore these small vessels.\n\nUnlocks the Yuzusoft Navy escort vessel organization"
 YZ_MIO_5_get: "Establish the Yuzusoft Navy Capital Ship General Administration"
 YZ_MIO_5_get_desc: "Only with a strong navy and an advanced naval manufacturer can we have the confidence to contend with the great sea powers.\n\nUnlocks the Yuzusoft Navy capital ship organization"
 YZ_MIO_7_get: "Establish the Yuzusoft Air Force General Manufacturing Administration"
 YZ_MIO_7_get_desc: "We must protect our blue skies with an advanced air force, making us all-knowing and all-capable in war!\n\nUnlocks the Yuzusoft Air Force organization"
 YZ_MIO_9_get: "Establish the Yuzusoft Armor Production & Design Center"
 YZ_MIO_9_get_desc: "All signs indicate that the wars of the future will be mobile warfare relying on armored forces rather than trench warfare, and the steel flood will tear through enemy lines, becoming the spearhead of our breakthroughs.\n\nUnlocks the Yuzusoft tank organization"
