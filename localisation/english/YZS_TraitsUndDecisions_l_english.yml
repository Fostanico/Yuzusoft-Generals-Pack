 YZ_start_ui_update_content: "§YYuzusoft Leaders Pack Changelog 2026.8.11§!\n\n1. Fixed an error when generating Shikibe Mayu as a scientist\n2. Fixed an issue that made the anti-capture protection for Yuzusoft characters apply to every general\n3. Reduced the mod's disk footprint\n4. Added Japanese and English localisation. Since the translations were produced by DeepSeek and ChatGPT, some passages may be inaccurate; thank you for your understanding\n5. Extensively optimized the code\n6. Removed herobrine\n\n§YRamblings§!\nTwo years have passed since we first created this mod in August 2024. After a great deal of work, it has finally grown into what you see today. We are deeply grateful to everyone who has supported us. Your interest and encouragement are what have kept us going. We will continue working hard to update the mod and bring you an even better experience!\n\nWe have added a link on the Steam Workshop page to a document for bug reports and suggestions. If you have any wild ideas, please add them!\n- P.S. Veteran Yuzu fans, please help us design traits and mechanics for the older characters—we're begging you!\n\nFrom the authors: Some features in this mod involve futuristic technology (and characters from other studios' games), so their stats may be a little overpowered (a certain senpai from another visual novel: heh heh heh). We recommend choosing which features to enable according to the difficulty and the kind of experience you want. The mod is still being refined, so we welcome your suggestions!\n\nIf you do not use QQ, you can report bugs or submit suggestions by opening an issue on GitHub:\nhttps://github.com/Fostanico/yuzumod\n\nJoin our QQ group: 967395223\nThe QR code for the mod's chat group is shown below!\n\n\n\n\n\n\n\n\n\n£start_ui_qun_code\n\n\n\n\n\n\n\n\n\n\nWhether you want to report a problem you encountered in-game or simply chat, everyone is welcome to join us."
 YZ_start_ui_guide_content: "§YPlay Guide§!\n\nThe Yuzusoft General Pack is a general pack that layers onto your game and combines with other mods. You can treat it as a pure general expansion, or enable the full system to experience leaders, generals, advisors, military-industrial organizations, research institutes, economy, propaganda, military academy, affection, and character-specific events.\n\n§YStarting Choices§!\nThe Youth Version is closer to a pure general pack, suitable for players who want a light experience. The Full Version enables most mechanics and story content, with more power and the most content. The Multiplayer Weakened Version cuts some bloated features, better suited for multiplayer or high-difficulty environments.\n\n§YMain Content§!\nReplaceable leaders include Yoshino, Nene, Murasame, Hazuki, Miu, Sayo, Kyouhei, and the collective Yuzusoft leader, among others. The mod also provides a large number of army generals and admirals, political advisors, commanders-in-chief, ministers, and military-industrial organizations. The Yuzusoft MIO bonuses are quite strong; showing the establishment decisions usually requires the corresponding army, navy, and air experience.\n\n§YCharacter-Specific Gameplay§!\nMuch of the character content is integrated into the General Growth Decisions and character events. Characters such as Yoshino, Ayase, and Noa have event chains. Works including Senren * Banka, Sanoba Witch, RIDDLE JOKER, Cafe Stella, Tenshi☆Souzou, Amairo * Islenauts, Tenshin Ranman, and Bra-Ban! all have corresponding character mechanics, missions, or decisions. Some characters must complete their exclusive content before marriage-related decisions unlock.\n\n§YResources & Systems§!\nYuzu Coins are the core resource of many systems, used for the 721 Research Institute, military reform, industrialization, shop exchanges, and more. The Inner Circle manages leaders, character bonuses, the shop, industrialization, and some exclusive decisions. The Yuzu Cultural Department mainly handles subject conversion and integration, and related resources can advance subject specialization and integration.\n\n§Y721 Research Institute§!\nAfter recruiting Nene and establishing the institute, you can build research facilities, obtain breakthrough points, gain research bonuses, and strengthen astral-user characters. Characters such as Mayu, Hazuki, Meguru, and Nene are linked to scientists or research functions. The institute also includes the detonator, Atri-related equipment, special projects, and armor templates with extra bonuses.\n\n§YIndustrialization & Military Academy§!\nYoshino's plan favors civilian industry, while Meguru's plan specializes in military expansion. Both industrialization projects require Yuzu Coins; running both simultaneously may drain funds. Automated industrial upgrades are implemented — as long as resources are sufficient, choosing the initial decision will advance automatically.\n\nThe Yuzusoft Military Academy can add designated traits to generals, advance staged military reform, and unlock the Imperial Guard and more. At the end of the reform, you can lean toward infantry or armored forces; completing it grants powerful modifiers to your troops.\n\n§YEaster Eggs & Propaganda Department§!\nThe mod includes easter egg characters such as 86, Izumi Hiyori, Atri, the four heroines of 9nine, and several heroines of NOeSIS. 86 and Atri are mainly related to the 721 Research Institute; Hiyori is related to Tenshi☆Souzou character content; the 9nine heroines require recruiting all characters voiced by Natsumi Takamori to start Snow Color Snow Trail, then activate the Valhalla Society; the NOeSIS heroines must be recruited first to obtain.\n\nThe Propaganda Department can provide bonuses through posters, the Song & Dance Troupe, and tours. The Yuzu fan mechanic has been reset; you can increase national Yuzu fan numbers through the Propaganda Department and unlock more operations around Yuzu fan equipment, the Imperial Guard, military reform, and the intelligence agency.\n\n§YOperation Panel & Compatibility Notes§!\nAfter forming the Inner Circle, click Nanami hanging at the top to open the operation panel, where you can toggle each decision group on and off. Compatibility with large overhaul mods is limited; in environments such as Old World Blues and TNO, we recommend trying the Youth Version first. Most of TFR's functions work, but the 721 Research Institute may be unusable due to different research facility settings. §0This mod has good compatibility with Millennium Dawn, but only three leaders are available (all creator easter eggs)§!The Full Version is quite strong; for a steadier experience, choose the Youth Version or the Multiplayer Weakened Version."
 YZ_start_ui_credits_content: "§YCredits & Acknowledgements§!\n\n§YContributors (ranking may possibly be in no particular order):§!\nLaoba, Imukai Makoto, Iruno, VAN, Island Owner, Arihara Nanami (old-timer), huhu, o5j, Mufeng Xiyun Chu (Yoshino), Verniy, Caiyun Chixia, Natsume Is Not Sister Jujube (LLLJ UI and other author), Yuzu, Congling, Napoleon VI, Xiaofeng (Yuzu Music Station author), Statistics Planning Manager;\n\n§YSpecial thanks:§!\nOpenAI Codex (GPT-5.5, GPT-5.6sol, reasoning effort: medium/high/xhigh), Anysphere Cursor (Anthropic Claude Opus 5 Thinking, xAI Grok 4.6, reasoning effort: high), OpenAI ChatGPT (GPT-5.5 Thinking/GPT-5.6 Thinking), Google Gemini (Gemini 3.1 Pro Preview), DeepSeek Chat (DeepSeek V3.2 Pro, DeepSeek V4 Flash, DeepSeek V4 Pro), Banshan Yanyu Banshan Qing (emotional support for Iruno), SeaLandX (pure personal bias), Alice☆ (maid group author), Zilin (JCP Yuzu component author);\n\n§YFeedback (IDs per the feedback document; if any are missing, please add them):§!\nJianmo, LF_Eternity, Xinglu (emoji), Shazi, Luoyi XIV, Chun, Wuxing zhi Ye, and the creativity and support of all the group friends, B-station friends, and everyone supporting the development of the Yuzu mod."
