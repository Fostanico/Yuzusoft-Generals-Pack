 Miyako_steal_mechanized_equipment: "Steal a Bit of Mechanized Equipment"
 Miyako_steal_mechanized_equipment_desc: "Steal a bit of mechanized equipment from the target country for our use (What? You ask where I stole it from if the AI doesn't build mechanized? That must have been handed down by the Lord of Heaven)"
 Miyako_steal_fuel: "Steal a Bit of Oil"
 Miyako_steal_fuel_desc: "Steal a bit of oil from the target country for our use (we shouldn't worry about our oil growing mold)"
 Miyako_steal_tank_equipment: "Steal a Few Tanks"
 Miyako_steal_tank_equipment_desc: "Steal a few tanks from the target country for our use (You ask why the AI's tank designs are so bad, yet we can steal such good tanks? Heaven's will, it's all heaven's will)"
 Miyako_steal_fighter_equipment: "Steal a Few Fighters"
 Miyako_steal_fighter_equipment_desc: "Steal a few fighters from the target country for our use (Only fighters can be stolen; design your own CAS and such. Of course, fighters also need to be designed — you just don't need to produce them)"
 huhu_s_revenge: "huhu's Revenge"
 huhu_s_revenge_desc: "You dare to hurt Miko? This is no ordinary enemy — we must strike hard! Watch me send every one of you sky-high with my tanks!\nI don't care about anything else — hurt Miko and you prepare to fly, up you go! (Eagle Brother voice)"
 ruri_s_animal_friends: "Ruri's Animal Friends"
 ruri_s_animal_friends_desc: "In the mountains, I can hear all kinds of voices. Dis iz... an elephant?! Grandpa, I'm coming to give you a back massage!\nUnlocks the elephant cavalry template"
 anuo_s_revenge: "§RDivine Punishment§!"
 anuo_s_revenge_desc: "Hurt Ruri? No problem — Anuo won't do anything to you. It's just that the ones seeking forgiveness are you, the one granting forgiveness is God, and Anuo's job is to send you to meet God"
 revenge: "Take Revenge for the Wife"
 revenge_desc: "We can't worry about anything else now — the enemy actually wounded our wife. This is no small matter; we need the enemy to make a! re! sponse!"
 Miyako_steal_military_factory: "Steal Three Military Factories"
 Miyako_steal_dockyard: "Steal Three Dockyards"
 Miyako_steal_civilian_factory: "Steal Two Civilian Factories"
 Miyako_steal_civilian_factory_desc: "Civilian factories... even if left with the enemy, they wouldn't know how to use them. Better to let us use them"
 Miyako_steal_military_factory_desc: "Military factories? The AI won't build good things with them anyway. You don't know how to use them, so I will"
 Miyako_steal_dockyard_desc: "So you're the one whose dockyards build ships to attack my convoys? Hand them over!"
 Haruka_sky_mind_decision: "Senpai Haruka Understands the \"Will of Heaven\""
 Haruka_sky_mind_decision_desc: "Senpai Haruka's ability is Eden, which makes desired things happen. Does this mean she can invisibly communicate with our Lord of Heaven? We can let Haruka understand the Lord of Heaven's thoughts. \"Where heaven's will reaches, winning is unavoidable\" — Zhuge Nailong"
