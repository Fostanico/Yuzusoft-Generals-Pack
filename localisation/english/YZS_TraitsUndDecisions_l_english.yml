 YzOpreative_nanami_1: "Ideological Propaganda: Communism"
 YzOpreative_nanami_1_desc: "Nanami found two books at a flea market: one called Das Kapital, and one called The Communist Manifesto. Perhaps this is the road never imagined! Nanami couldn't stop herself and founded a bunch of Marxist study groups. Let the red flag spread across our country!"
 YzOpreative_nanami_2: "Ideological Propaganda: Democracy"
 YzOpreative_nanami_2_desc: "Nanami was sent by her old man for a spin around the beautiful country (USA). After coming back, Nanami felt the air could use a little more freedom. Then the newspapers on the streets began vigorously promoting Mr. Democracy, with most of each page taken up by the scent of democracy and freedom. Who wrote those articles? Of course Nanami half-wrote, half-copied them; and who did she copy from? It seems the Island Owner was dragged off to forced labor..."
 YzOpreative_nanami_3: "Ideological Propaganda: Fascism?"
 YzOpreative_nanami_3_desc: "Nanami somehow got her hands on a pile of all kinds of speeches and would hold them and read whenever she had time. Then fate showed her the man in the beer hall. Oh no! Nanami wants to struggle too! Dissatisfied with life? Strive for a hundred days, and if you can't make it, start a second world war!"
 YzOpreative_nanami_4: "Ideological Propaganda: Neutrality?"
 YzOpreative_nanami_4_desc: "Ew, where did all these doddering old men come from, and why should I, Arihara Nanami, do propaganda for them............"
