 yz_ac7_legendary_aces_program: "Form the Long-Range Strategic Strike Group"
 yz_ac7_legendary_aces_program_desc: "All three arsenal great bird blueprints are complete. The 721 Institute will invite three legendary pilots who rewrote the course of the Lighthouse War to join the air force, responsible respectively for the operational use of Justice, Liberty, and the Integrated Arsenal Great Bird."
 yz_ac7_legendary_aces_program_tt: "Obtain three ace pilots with unique abilities:\n\n§YTrigger§! (Justice, legendary ace)\nAir Attack/Air Defense: §G+10000%§!\nMax Speed/Operational Range: §G+1000%§!\nManeuver/Radar Advantage: §G+5000%§!\nGround/Naval/Strategic Bombing: §G+5000%§!\nNaval Attack Hit: §G+2500%§!\n\n§YCount§! (Liberty, Osea's second ace)\nAir Attack: §G+1000%§!  Air Defense: §G+800%§!\nMax Speed/Operational Range: §G+200%§!\nManeuver/Radar Advantage: §G+500%§!\nGround/Naval Attack: §G+500%§!\nStrategic Bombing/Naval Attack Hit: §G+300%§!\n\n§YWiseman§! (Integrated Arsenal Great Bird, veteran squadron leader)\nAir Attack/Air Defense: §G+500%§!\nMax Speed: §G+100%§!  Operational Range: §G+150%§!\nManeuver/Radar Advantage: §G+250%§!\nGround/Naval Attack: §G+300%§!\nStrategic Bombing/Naval Attack Hit: §G+200%§!\n\nAfter creation, please manually assign the aces to the corresponding arsenal great bird wings."
