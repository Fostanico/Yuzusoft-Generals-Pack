 yz_arsenal_bird_justice_plan: "Justice Plan"
 yz_arsenal_bird_justice_plan_desc: "With air superiority maintenance, drone swarm control, and key point defense as the primary goals, the 721 Institute will equip the arsenal great bird with high-density air-superiority drone swarms, universal missile bays, and multi-layer survival systems. Upon completion, gain the §YJustice§! arsenal great bird design.\n\n§7In the setting of Ace Combat 7, two arsenal birds are deployed around the International Space Elevator, forming a defense ring with a radius of about 1200 km. Justice is an enhanced mass-produced aerial unmanned carrier capable of commanding MQ-101 drone swarms and sealing off vast airspace with advanced protection systems, long-range missiles, and directed energy weapons.§!"
 yz_arsenal_bird_liberty_plan: "Liberty Plan"
 yz_arsenal_bird_liberty_plan_desc: "With long-range, all-domain strikes as the core, the 721 Institute will integrate bombing, anti-ship, air-superiority drones, and missile firepower into a single aerial platform. Upon completion, gain the §YLiberty§! arsenal great bird design.\n\n§7In the setting of Ace Combat 7, Liberty is the prototype of the arsenal bird. Powered by microwave energy provided by the International Space Elevator, it maintains extended flight as a giant unmanned aerial carrier deploying combat drones, and uses long-range weapons to prevent enemy aviation from approaching key strategic facilities.§!"
 yz_arsenal_bird_integrated_plan: "Integrated Arsenal Great Bird Plan"
 yz_arsenal_bird_integrated_plan_desc: "Striking a balance between air superiority, ground attack, anti-ship, and sustained combat capability, forming an integrated arsenal great bird capable of independently undertaking multiple types of aerial missions. Upon completion, gain the §YIntegrated Arsenal Great Bird§! design.\n\n§7This plan absorbs the design ideas of the Liberty prototype and the Justice enhanced model from Ace Combat 7, integrating ultra-long endurance, drone swarm command, area air defense, long-range strikes, and multi-layer survival systems into a single aerial strategic platform not dependent on any single mission environment.§!"
 yz_arsenal_bird_requires_modern_air_mio_tt: "Must have obtained the §YYuzusoft Air & Space Administration§! modern military-industrial organization"
