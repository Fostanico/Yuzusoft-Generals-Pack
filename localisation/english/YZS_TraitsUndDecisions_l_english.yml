 youzu_military_finished_dynamic_modifier_tt: "§Y$youzu_military_dynamic_modifier$§! Additional Effects:"
 youzu_army_1: "Form the Yuzusoft Officer Corps (Military Reform Begins)"
 youzu_army_1_desc: "Establishing the military academy and forming the officer corps is the first step. Mitsukasa Ayase proposes that we use the Yuzusoft Military Academy to cultivate our officer corps and inject fresh blood into our army, building a talent corps loyal to us within the military. Never mind whether the old-timers are willing — they will compromise sooner or later."
 youzu_army_2: "Cultivate Junior Officer Backbone (Military Reform Phase 1)"
 youzu_army_2_desc: "Having veteran generals who identify with us serve as instructors and cultivating junior officers is the second step. As the principal of our academy, Fumika has good relations with many of our country's veteran generals, so she can persuade some of them while implementing her education plan to cultivate backbone officers for us. This is both an opportunity to find great scholars to argue for us and to spread the new theory."
 youzu_army_3: "Command System Reform (Military Reform Phase 2)"
 youzu_army_3_desc: "A fundamental, systematic reform of the entire command chain is the third step. We can't command planes like iron birds and tanks like bronze horses, can we? Togakushi Touko believes military reform must start from the command chain, and thanks to her social nature, she has reduced a lot of resistance for us."
 youzu_army_4: "Train the Soldiers' Initiative (Military Reform Phase 3)"
 youzu_army_4_desc: "Raising the soldiers' initiative is the fourth step. Shiiba Tsumugi, a graduate of the infantry academy, has just returned from studying at a mysterious power in the distant East. What she brought back shocked us deeply, and our infantry curriculum has been completely overhauled."
 youzu_army_5: "Logistics System Strengthening (Military Reform Phase 4)"
 youzu_army_5_desc: "Reorganizing the logistics system and guaranteeing combat logistics is the fifth step. Troops and horses move only after fodder is ready — we can't expect our soldiers to eat grass every meal and still bayonet-charge the enemy. Shioyama Suzune is our chief of logistics, and her plan can gradually improve our once-chaotic logistics system."
 youzu_army_6: "Ninja Training Plan (Military Reform Phase 5)"
 youzu_army_6_desc: "Training a batch of elite soldiers to form a new special forces unit is the sixth step. Local superiority can often leverage the entire battle situation — everything depends on our sharp blade. As a ninja, Hitachi Mako is well-versed in special operations, so her special operations plan can effectively raise the tactical level of our entire army."
 youzu_army_7: "Inherit Glory (Final Plan Selection)"
 youzu_army_7_desc: "Caliber is justice; range is truth. Our soldiers will smash the enemy's futile resistance with bullets and bayonets on the scorched earth after the artillery barrage. Though we are a modern army, we cannot ignore our former traditions and glory. With iron blood and bayonets, we will terrify our enemies — let little Aya lead us!"
 youzu_army_8: "Embrace the Future (Final Plan Selection)"
 youzu_army_8_desc: "Speed is of the essence in war. The future battlefield will belong to steel beasts traveling at dozens of kilometers per hour — speed is the best defense of the flanks. Let the death god descend upon the enemy riding our steel flood. The wars of the future will surely be wars of movement — let's race with Meguru!"
