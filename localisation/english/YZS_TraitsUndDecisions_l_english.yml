 yuzu_infiltrate_japan: "Infiltrate Japanese Territory"
 yuzu_infiltrate_japan_desc: "Japan's long-standing militarism has poisoned our people. We need to unite the people through Yuzusoft games to resist Japanese militarism"
 yuzu_liberate_sea_city: "Liberate Aqua Eden"
 yuzu_liberate_sea_city_desc: "The evil Japanese government imprisoned the vampires on a lonely island out of fear of their power. We should make full use of the vampires' power to prepare for our resistance against Japanese militarism"
 yuzu_use_demon_power: "Use the Demon King's Power"
 yuzu_use_demon_power_desc: "Kaguya and Noa both know the Demon King's power well. We can appropriately use it to strengthen ourselves"
 yuzu_unite_astral: "Unite the Astral Users"
 yuzu_unite_astral_desc: "Washizu has many astral users with supernatural abilities. They are a great asset to us"
 yuzu_borrow_divine_power: "Borrow Divine Power"
 yuzu_borrow_divine_power_desc: "Among our generals are many, many gods: Unohana, Noa, Sana, Kanna, Ruri... They can gather great divine power to help us gain the gods' support, and with true divine power root out the rule of that emperor who practices tyranny in the gods' name, letting them know whose side the gods are on"
 yuzu_cross_tsushima: "Cross the Tsushima Strait"
 yuzu_cross_tsushima_desc: "The Chinese and Japanese peoples share a common enemy: Japanese militarism. The people of Korea and Northeast China are still suffering under militarist and fascist oppression. We should liberate the oppressed Korean and Chinese peoples as well"
 yuzu_stand_in_world: "The Nation of Yuzu Stands Tall in the World"
 yuzu_stand_in_world_desc: "We have eliminated militarism and destroyed the fascist remnants across Asia. Next, we should implement a series of consolidation measures at home"
 yuzu_overthrow_japan: "Overthrow Japanese Militarism"
 yuzu_overthrow_japan_desc: "We are ready for the final battle against Japanese militarism. We will inspire the whole nation, declare a nationwide general uprising, and rescue the Japanese people from militarism"
 yuzu_national_congress: "All-Yuzu Congress"
 yuzu_national_congress_desc: "After eliminating militarism, we need to decide our state system and set our direction. We should convene all the Yuzu girls to vote"
 Yuzu_land_reform: "Land Reform"
 Yuzu_land_reform_desc: "The Japanese people have suffered centuries of feudal oppression; the Meiji Restoration merely replaced the exploiters of the bottom peasants. To liberate productive forces and promote agricultural development, we must take aim at the landlord class"
 Yuzu_agriclutural_collectivization: "Agricultural Collectivization"
 Yuzu_agriclutural_collectivization_desc: "After the peasants received land, many still lacked means of production. We should establish collectivized farms that use public means of production, solving the shortage of production means in rural areas and raising rural productivity"
 Yuzu_land_contract: "Household Responsibility System"
 Yuzu_land_contract_desc: "Now that the peasants have land, we should stimulate their production enthusiasm. By adopting the household contract system, we let peasants maximize their gains, and they will spontaneously produce more grain"
 Yuzu_water_conservancy: "Expand Water Conservancy Projects"
 Yuzu_water_conservancy_desc: "National agricultural development depends not only on peasants but also on objective geographic factors. Through water conservancy construction, we can effectively improve the agricultural production environment and raise agricultural output"
 Yuzu_split_financial_conglomerates: "Break Up the Zaibatsu"
 Yuzu_split_financial_conglomerates_desc: "Mitsui, Mitsubishi, Sumitomo, Yasuda... Japan's zaibatsu have poisoned its development, monopolizing industry and keeping the economy chronically unhealthy. To develop industry, we must break up the zaibatsu and enact antitrust laws"
 Yuzu_encourage_enterprises: "Encourage Small and Medium Enterprises"
 Yuzu_encourage_enterprises_desc: "After the zaibatsu were ordered out of the market, small and medium enterprises sprang up like bamboo shoots after rain. We should guide their development to benefit the long-term stable growth of the national economy"
 Yuzu_strengthen_industry_unions: "Strengthen Industry Unions"
 Yuzu_strengthen_industry_unions_desc: "Many enterprises have developed rapidly under our policies. We must not focus only on business owners but also on workers' rights. We will establish unions in every industry to protect workers' rights"
 Yuzu_restore_production_order: "Restore Production Order"
 Yuzu_restore_production_order_desc: "The turmoil of the civil war has brought the domestic economy to the brink of collapse. We need to rapidly restore production and stabilize the domestic economy"
 Yuzu_eliminate_remnants: "Eliminate Domestic Militarist Remnants"
 Yuzu_eliminate_remnants_desc: "The criminals who started this war are still held in prisons. We must make them answer for the atrocities they committed! Let the people's voice judge them!"
 Yuzu_unity: "Unite the People"
 Yuzu_unity_desc: "With the fascists and militarists purged, we should end the turbulent domestic environment. To stabilize the country, we can slightly relax the purge standards. The true enemies are only the militarists and fascists; some of the moderates who were forced to obey them can be reformed and united"
 Yuzu_secend_congress: "Second All-Yuzu Congress"
 Yuzu_secend_congress_desc: "A series of postwar policies helped stabilize the domestic environment, and the nation of Yuzu has now embarked on a path of steady development. For this reason, it is necessary to hold another meeting to decide the nation's future direction\n§RIt is best not to use decisions to change leaders after choosing one; the leader line modifies traits based on the existing leader's traits. The consequences of changing leaders via decision include but are not limited to: stuck national focuses, disappearing buffs, and even bugs that crash the game\nMoreover, the leader traits in the leader line are different from the decision leader traits!!! Do not try to switch away and switch back — the same character is two different people in the focus code and the decision code!§!"
 Yuzu_ayase: "Mitsukasa Ayase"
 Yuzu_ayase_desc: "Rasp (struck through) Ayase has rich leadership experience. We should let Ayase lead the nation"
 Yuzu_noa: "Shirayuki Noa"
 Yuzu_noa_desc: "Noa may not be a very reliable leader, but she can greatly develop our air force. For the sake of the air force... perhaps we can trust Noa?"
 Yuzu_miu: "Yarai Miu"
 Yuzu_miu_desc: "Miu has rich management experience. Under Miu's governance, we can achieve long-term stable development"
 Yuzu_sana: "Chitose Sana"
 Yuzu_sana_desc: "Sana herself may have no leadership experience, but Sana's luck will surely play its part"
 Yuzu_ling: "Murasame"
 Yuzu_ling_desc: "Though that green-haired sword spirit may seem unreliable, at least she genuinely has the gods' support. Letting Murasame serve as leader may make the gods support us more"
 Yuzu_luli: "Rindou Ruri"
 Yuzu_luli_desc: "Ruri obviously doesn't know how to govern, but as a mascot... the people under her can perform better, right?"
 Yuzu_tallest_congress: "Yuzu Supreme Committee"
 Yuzu_tallest_congress_desc: "Individual leadership may ultimately have oversights, but a leadership collective reduces that possibility. We should form a supreme committee composed of all the Yuzusoft heroines to lead together"
 yuzu_zaozi: "Shiki Natsume"
 yuzu_zaozi_desc: "Sister Jujube has experience running a café. Letting her lead us may bring a new situation of development"
 yuzu_nene: "Ayachi Nene"
 yuzu_nene_desc: "As someone who could do 0721 at any time and place... (Nene's face darkens) Ah no — as someone with rich experience in hiding herself, Nene can surely protect our intelligence"
 yuzu_eco: "Economic Reconstruction"
 yuzu_eco_desc: "Since the Meiji Restoration, Japan's economic development has been severely unbalanced. We must break this unbalanced development model and build a new, healthy one"
 yuzu_civil_industry: "Develop Civilian Industry"
 yuzu_civil_industry_desc: "We must develop civilian industry to prepare for national construction"
 yuzu_technology: "Expand Research Investment"
 yuzu_technology_desc: "We need to expand investment in research to strengthen the research capability of the nation of Yuzu"
 yuzu_army_industry: "Develop Military Industry"
 yuzu_army_industry_desc: "We must develop military industry to prepare for future wars"
 yuzu_fast_road: "Expressways"
 yuzu_fast_road_desc: "Old Japan's road construction was severely deformed. For the national economy to develop, we must build a nationwide expressway network"
 yuzu_electric_company: "Expand the National Power Company"
 yuzu_electric_company_desc: "Old Japan's power grid left many regions without stable electricity, severely limiting nationwide industrial development. We will expand investment in the national power company to make the power supply more stable across the country"
 yuzu_rural_electrification: "Rural Electrification"
 yuzu_rural_electrification_desc: "With a stable power supply, we should bring electricity to the countryside as well — every corner of our country should be lit"
 yuzu_reconstrct: "National Reconstruction Plan"
 yuzu_reconstrct_desc: "The nation is back on track and the economy is booming. We should formulate a series of plans to chart the nation's development"
 yuzu_anti_bobo: "Large-Scale Urbanization"
 yuzu_anti_bobo_desc: "After nationwide electrification and highway construction, our construction plans should keep pace — expand urbanization across the country"
 yuzu_literacy_campaign: "Literacy Campaign"
 yuzu_literacy_campaign_desc: "After urbanization, the insufficient knowledge of our people has become apparent. We will set up night schools in rural areas and adult universities and technical schools in cities to solve the problem of insufficient worker knowledge"
