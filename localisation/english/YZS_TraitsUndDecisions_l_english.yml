 start_event.8.t: "Yuzusoft Changelog"
 start_event.8.d: "Yuzusoft General Pack Changelog 2026.6.14\n\n-Reset the traits of the older Senren * Banka characters to keep up with the current version\n-Adjusted the advisor values of Murasame and Yoshino\n-Adjusted the military advisor values of Mako and Murasame\n-Adjusted the values of both Yuzusoft army spirits\n-Adjusted the leader values of Yoshino and Murasame\n-Adjusted the values of the parfait decision for Murasame\n-Supplemented some text\n-Changed the opening BGM and title image of Senren * Banka\n-Adjusted some easter egg content\n-Added a revenge-for-the-wife feature: when a married character is wounded, a new decision unlocks to take revenge for her\n-Added two new characters: Torakichi and Akagi\n-Supplemented the trait effects of Bra-Ban! characters and added a shrimp military advisor\n-Modified Atri's values so that Atri now has the strength she deserves\n-Added a proficiency-gaining decision in the Yuzusoft Military Academy, making it easier to grind out max-level doctrines\n-Yoshino's industrialization resource decision now grants a small amount of resources\n-Added Miko's levy decision\n-Added Haruka's \"Will of Heaven\" decision\n-Added Ruri's animal friends decision, allowing elephant cavalry templates without having to play India\n-Fixed some bugs; whether new bugs were introduced is unknown\n-Removed herobrine"
 start_event.8.a: "Okay, got it"
 start_event.8.b: "Go to previous page"
 start_event.2.t: "Diary of a Soviet Worker"
 start_event.2.d: "\"My name is Ivan, and I work at Soviet OKMO. My friend Pyotr assembles tanks on the production line at Kirov Factory.\"\n\n\"One day, a group of Japanese suddenly came to the Soviet Union. Shouting something about 'Yuzusoft is number one in the world,' they entered the Kremlin under NKVD escort. The next day, Comrade Stalin suddenly announced the abolition of all military-industrial organizations in the country, including the OKMO and Kirov Factory where Pyotr and I worked. But we were not unemployed — instead, we were assigned to a civilian factory and began building a strange factory.\"\n\n\"The factory director told us this was a modern military-industrial complex personally ordered by Comrade Stalin to be built urgently. I didn't understand what a military-industrial complex was, but when I saw those brand-new lathes being brought in, I couldn't help but marvel: so beautiful.\"\n\n\"After 25 days of intense construction, a behemoth rose on the northwestern outskirts of Moscow, equipped with advanced machinery we had never seen before, and several Japanese women in strange outfits were negotiating with the factory director.\"\n\n\"But Pyotr and I couldn't care less — the moment we got on the production line, we were shocked by the efficiency of the new equipment: a 122mm howitzer could be assembled by various semi-automatic machines with minimal human involvement in just a few minutes; a BT-7 light tank could roll off the line after the workers simply fiddled with a few levers.\"\n\n\"I walked out of the factory gate and saw the sign hanging high above: 'Yuzusoft General Army Manufacturing Administration.' Admiration welled up inside me: those Yuzu fans are truly remarkable.\""
 start_event.2.a: "How great are the Yuzu fans"
 start_event.3.t: "The Generals' Departure"
 start_event.3.d: "Because the Yuzusoft generals' affection toward us was too low, some chose to leave."
 start_event.3.a: "On the brink of disaster"
 start_event.4.t: "The Yuzusoft Heroines No Longer Trust You"
 start_event.4.d: "Because the Yuzusoft generals' affection toward us was too low, they chose to leave."
 start_event.4.a: "The sky has fallen."

