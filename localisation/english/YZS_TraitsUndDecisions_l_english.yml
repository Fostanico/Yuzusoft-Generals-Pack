 type90_tank_chassis: "Yuzusoft YIWG-90 Main Battle Tank Chassis"
 type90_tank_chassis_short: "YIWG-90"
 type90_tank_chassis_desc: "Development of the Type 90 began under the Japan Defense Agency Technical Research and Development Institute in 1977. It was selected in 1989 and formally standardized on 6 August 1990, with Mitsubishi Heavy Industries and Japan Steel Works responsible for production. Public specifications list a combat weight of about 50 tonnes, a crew of three, a top speed of 70 km/h, and a 120 mm smoothbore main gun. The YIWG Type 90 preserves those technical baselines as the independent production model for this mod."
 type90_tank_chassis_1: "Yuzusoft YIWG-90 Main Battle Tank Chassis"
 type90_tank_chassis_1_short: "YIWG-90"
 type90_tank_chassis_1_desc: "Development of the Type 90 began under the Japan Defense Agency Technical Research and Development Institute in 1977. It was selected in 1989 and formally standardized on 6 August 1990, with Mitsubishi Heavy Industries and Japan Steel Works responsible for production. Public specifications list a combat weight of about 50 tonnes, a crew of three, a top speed of 70 km/h, and a 120 mm smoothbore main gun. The YIWG Type 90 preserves those technical baselines as the independent production model for this mod."
 type90_Rh_120_120mm_gun: "Rheinmetall Rh-120 120 mm L/44 Smoothbore Gun"
 type90_Rh_120_120mm_gun_desc: "The Type 90 carries a Rheinmetall-family 120 mm L/44 smoothbore gun. It works with the autoloader, gun stabilization, and digital fire-control system for night and on-the-move firing; measured barrel distortion is also fed into the ballistic solution."
 type90_tank_turret: "Two-Man Autoloading Turret"
 type90_tank_turret_desc: "The commander and gunner occupy the turret while the autoloader replaces a human loader, reducing the vehicle crew to three. Public JGSDF material confirms composite protection on the turret and hull, separation of stored ammunition and fuel from the crew, fire suppression, a laser-warning system, and individual filtered-air protection."
 type90_hydropneumatic_suspension: "Hybrid Hydropneumatic/Torsion-Bar Suspension"
 type90_hydropneumatic_suspension_desc: "The Type 90 combines hydropneumatic and torsion-bar suspension. The hybrid arrangement supports cross-country stability, hull attitude control, and high-speed mobility, allowing a vehicle of roughly 50 tonnes to reach the publicly stated 70 km/h top speed."
 type90_composite_armor: "Composite Armor and Crew Protection"
 type90_composite_armor_desc: "JGSDF sources confirm composite or new-material protection on the turret and hull, side skirts, laser warning, fire suppression, and separation of ammunition and fuel from the crew. The exact layer composition, thickness, and equivalent protection remain undisclosed, so this description does not present speculative ceramic layouts or protection figures as fact."
 type90_Mitsubishi_10ZG32WT_engine: "Mitsubishi 10ZG32WT 1,500 PS Diesel"
 type90_modern_electronic_equipment: "Laser-Rangefinding and Thermal-Sighting Suite"
 type90_machine_guns: "M2HB 12.7 mm and Type 74 7.62 mm Machine Guns"
 type90_fire_control_system: "Sensor-Fused Digital Fire-Control System"
 type90_auto_loader: "Turret-Bustle Autoloader"
 type90_Mitsubishi_10ZG32WT_engine_desc: "The Type 90 uses a water-cooled, two-stroke, ten-cylinder diesel rated at 1,500 PS at 2,400 rpm. It is paired with hydraulically controlled automatic transmission and steering equipment, supports neutral steering, and propels the 50-tonne vehicle to a stated 70 km/h."
 type90_modern_electronic_equipment_desc: "The sighting suite combines laser rangefinding, an auto-tracking thermal imager, and stabilized sights. It lets the crew detect, track, and range targets at night while continuously supplying target data to the digital fire-control computer."
 type90_machine_guns_desc: "Secondary armament consists of a 12.7 mm heavy machine gun and a Type 74 7.62 mm vehicle-mounted machine gun, providing suppression against low-flying, light, and close infantry targets."
 type90_fire_control_system_desc: "The digital fire-control system integrates laser ranging, thermal imaging, gun stabilization, and automatic tracking. Public JGSDF material identifies wind direction and speed, propellant temperature, trunnion-axis cant, and barrel distortion among its sensor inputs, enabling accurate night and on-the-move fire."
 type90_auto_loader_desc: "The autoloader selects and loads 120 mm ammunition, allowing the Type 90 to operate with a commander, gunner, and driver. Stored ammunition is isolated from the crew and protected by fire suppression, reducing crew requirements while improving survivability after penetration."

