 military_reform_info_decision: "Introduction to the New Yuzusoft Military Reform"
 military_reform_info_decision_desc: "This decision introduces the mechanics of the new military reform. You can click it to see the new changes, or explore on your own — both are fine\n(If you think I wrote too much, you don't have to click it T_T)"
 military_reform_event.3.d: "When a Millennium Dawn start is detected, the eight vanilla-oriented reform branches are hidden and replaced by four sequential modern reforms. Completing either old-reform endpoint, Inherit Glory or Embrace the Future, unlocks the first stage. The four stages must then be completed in order, with only one reform underway at a time.\nEach reform takes §Y30 days§! and costs §Y100 Political Power§!, §Y40 Command Power§!, §Y50 Army Experience§!, and §Y1,000 Yuzu Coins§!. Completion grants a hidden technology whose bonuses permanently apply to Millennium Dawn's modern units and equipment.\nThe categories and equipment archetypes are verified against the currently supported Millennium Dawn Beta. They must be checked again if an update changes internal tokens. Each decision's effect panel lists its exact bonuses."
 military_reform_event.4.d: "Stage one, Mount the New Armor, Strike Like Lightning, improves the firepower, protection, mobility, organization, and reliability of main battle tanks, infantry fighting vehicles, and armored personnel carriers.\nStage two, Thunder from the Rotors, Precision at Every Point, greatly improves attack helicopters and heliborne forces while reducing the supply consumption of air-assault units.\nStage three, Drone Data Links, War at the Keystroke, improves intel networks, counterintelligence, decryption, and reconnaissance while strengthening airborne and tactical drones, increasing their reliability, and reducing air-UAV production cost.\nStage four, Grenades, Marksmen, Long-Range Fires: Land, Sea, Air, Space, Cyber!, strengthens infantry and the wider army, improves air missions and naval combat, and raises the reliability of infantry weapons, long-range fires, vehicles, fixed-wing aircraft, and ship hulls.\nSee the four reform decisions' effect panels for the exact percentages."
 military_reform_event.1.d: "In response to the very, very many balance issues in vanilla (such as armored cars and rocket artillery being ignored by everyone), and since Paradox has recently demonstrated its incompetent balancing ability once again, for this reason, I (we?) attempt to rebalance most of the vanilla equipment. So what is the balancing method? It's making everything outrageous, achieving outrageous balance (after all, this is for everyone's PvE enjoyment; the numbers are indeed high, but they do come at a cost, and the startup is also slow). There are eight branches in total: Infantry Branch, Artillery Branch, Cavalry Branch, Light Armor Branch, Fire Support Branch, Mechanized Branch, Blitzkrieg Branch, and Air-Ground Integration Branch.\nThe new military reform builds on the old one; the final branch of the old reform, Inherit Glory and Embrace the Future, will determine your subsequent reform branches: §GThe Inherit Glory line (Murasame line) will gain the Infantry, Artillery, and Cavalry Branches;§!§OThe Embrace the Future line (Meguru line) will gain the Mechanized, Blitzkrieg, and Air-Ground Integration Branches;§!§BThe Fire Support and Light Armor Branches are common branches.§!\n§RNote: before finishing one branch to the end, you cannot choose other branches. Each branch has five phases, and each phase takes one month.§!\nNext, a brief introduction to the attributes of the eight branches:\nInfantry Branch: in this branch, not only do infantry get many bonuses, but artillery also gets -1 width; the most important thing for infantry is that after completing the final phase of infantry reform, 6-speed infantry can be unlocked\nArtillery Branch: in this branch, the rocket artillery that no one cares about is the focus of strengthening, and artillery, anti-tank guns, and anti-air guns are also greatly enhanced. In this branch, you can gain the artillery -2 width bonus, meaning that combined with the infantry branch, there will be 0-width artillery (Paradox inexplicably gave artillery such high width; whose artillery goes to the front line anyway). Of course, to keep up with infantry speed, artillery is also strengthened to 6 speed\nCavalry Branch: in this branch, cavalry gain a lot, a lot of bonuses. Of course, someone will ask: cavalry is so useless, why make a branch for it? Hey, didn't the last-last update add Ruri's animal friends decision? Now any country can play elephant CCB — that is, elephants can be combined with the cavalry branch bonuses to achieve absolutely outrageous CCB bonuses"
 military_reform_event.2.d: "Light Armor Branch: in this branch, the three ignored light-armor siblings are greatly strengthened: light tanks, motorized, and armored cars. After completing the third phase of light armor reform, armored car improvement is unlocked. After strengthening, these three siblings can fully stand as a unit on their own: light tanks for breakthrough, motorized for defense, armored cars for output. Combined, they form a unit with quite good stats (12 speed minimum, depending on light tank speed). Also, in the final phase of this line, the national spirit grants a very strong supply buff — even if you don't play these three, the supply bonus alone makes the branch worthwhile\nFire Support Branch: in this branch, the fire support bonuses of all three services are strengthened. Of course, what everyone should pay most attention to is that self-propelled artillery and tank destroyers gain bonuses in this line. Though the rest are minor bonuses, the SPG and TD bonuses (-0.5 width) are real\nMechanized Branch: in this branch, mechanized production costs are reduced, and many mechanized- and armor-related bonuses are added. Since this thing is already strong, there's not much need to strengthen it further (i.e., mechanized -0.5 width)\nBlitzkrieg Branch: in this branch, armor production costs are reduced (tank destroyers and self-propelled artillery also benefit), and armor reinforcement gets many buffs. Who knows whether armor, after benefiting from the buffs, can rival the TDs and SPGs next version after they're nerfed (of course, those two get bonuses in the Fire Support doctrine, so making tanks rival them may still be difficult). It grants a lot of armor attack and armor defense (I figure this is still just feeding the SPGs and TDs)\nAir-Ground Integration Branch: in this branch, aircraft production costs are reduced, and you gain absolutely horrifying air force buffs, absolutely horrifying\nOverall, that's roughly the situation of the branches. The Meguru line gives a lot of price cuts and bonuses, letting even small nations mass-produce tanks, planes, and mechanized units. The Murasame line gives the infantry and artillery equally outrageous bonuses. The two sides are roughly equal in strength, just different directions of fun. Play whatever you want\nFinally, I wish everyone a pleasant playthrough\n\n\n(Whispering: this content contains easter eggs; you can explore them yourself. The easter egg content has absolutely nothing to do with me. Nothing at all!)"
