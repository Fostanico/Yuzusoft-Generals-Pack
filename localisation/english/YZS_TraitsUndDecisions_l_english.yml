 start_event.23.t: "Yuzusoft Mod Basic Guide 1"
 start_event.23.d: "Ciallo, welcome to the Yuzusoft mod!\nThis mod is a general pack that layers onto your game and combines with other mods, providing leaders, generals, advisors, MIOs (military-industrial organizations), and a series of unique decisions and personal mechanics!\nIf you only want it as a pure general pack, you can choose \"Youth Version of the General Pack\" in the decision panel (the full version includes everything)\n☆Replaceable leaders: Yoshino, Zero-bust, Kyouhei, Nene, Murasame, Hazuki, Miu, Sayo, and the collective Yuzusoft leader (like a maid council)\n☆Generals are mostly implemented! Admirals include: Sana, Nene, Kanna, Nanami, Hazuki, Mako\nCurrently, characters from all works except ExE are complete (though many are still generals without defined traits; if you are willing, you can join us and provide design proposals for the characters you like)\n☆Current advisors & other cabinet:\n Advisors: Nene, Meguru, Murasame, Yoshino, Nanami, Zero-bust, Kyouhei, Rio, Airi, etc.\nMinisters: Ozato Fumika, Togakushi Touko, Hazuki (unlocked via decisions)\nCommanders-in-chief: Ayase, Natsume, Murasame, Meguru, Suzune, Mako, etc.\n☆Yuzusoft MIOs: fairly overpowered bonuses, may lower the game's difficulty; showing the establishment decisions requires 15 points of the corresponding experience\nArmy - Yuzusoft Infantry Weapons Bureau & Yuzusoft Armor Production & Design Center\nNavy: Yuzusoft Coastal Dumpling Bureau & Yuzusoft Oceanic Tangyuan Bureau\n Air Force: Yuzusoft Air Force General Manufacturing Administration\n☆Unique mechanics & extra content!\nThis mod adds a lot of extra content: character-specific (event chains, mission chains, etc.); a new point system — Yuzu Coins (gold yuan note); the Inner Circle; the 721 Research Institute; the Yuzu Cultural Department; industrialization decisions; the Yuzusoft Military Academy; affection (marriage)"
 start_event.23.a: "Next page"
 start_event.24.t: "Yuzusoft Mod Basic Guide 2"
 start_event.24.d: "*Character-specific content: most of this is integrated into the \"General Growth Decisions\"; characters with unique event chains and mission chains can only unlock marriage decisions after completing them\n -Event chains: Yoshino, Ayase, Noa\n -Unique content:\nTenshi☆Souzou: Amane, Kurume - mission chains; Kaguya - easter egg decision \"A Cute Girl Came to Find You\" (Sairi canon/if/be route) allows additional recruitment of Mikuni Sairi\nCafe Stella: \"Make a Pancake\" decision, can recruit Shioyama Suzune; Shioyama Suzune - make sweets decision, provides limited-time bonuses\nRIDDLE JOKER: Nanami - unlocks the Nanami Intelligence Bureau & Astral Field Hospital (if you want Nanami to serve as both commander-in-chief and political advisor, appoint the commander-in-chief first, then the advisor); Mayu - 721 Research Institute & \"Conduct Research on Astral Arts\" decision, repeating it unlocks Ise Kotori\nSenren * Banka: Murasame - feed little Murasame a parfait, unlocks advisor; Yoshino - Yoshino's Hoori Revitalization Plan\nSanoba Witch: Sabbath Tarot, can be redrawn every 15 days for a permanent modifier; Nene - 721 Research Institute; Meguru - Meguru's Equipment Manufacturing Upgrade Plan; Nene and Tsumugi have unique general skills\nAmairo * Islenauts: Masaki - Masaki's chain restaurants, letting you quickly build supply depots; Airi: mission chain, unlocks the unique Crystal Support Company\nDRACU-RIOT!: vampire tactical squad, Rio - \"Defy Fate\" decision, can upgrade the general and gain an advisor\nTenshin Ranman: Sana - the \"Celebrate Sana's Birthday\" decision; if you remember to celebrate Sana's birthday every year, you will get a very powerful Sana\nNatsuzora Kanata: Chihaya - unique decision (recreating the original work?)\nBra-Ban!: Ebihara Minase - unique general skill"
 start_event.24.a: "Click the lower part of the decision panel to browse other content"
 start_event.25.t: "Yuzusoft Mod Basic Guide 3"
 start_event.25.d: "*Yuzu Coins  Spend a bit of political power to print them in bulk — this is the gold yuan note (struck through)\nThe core of the Yuzu system; the 721 Research Institute, Yuzusoft military reform, two industrialization projects, and more all consume Yuzu Coins\nIn the \"Inner Circle\" decision tab, you can spend political power in the \"Yuzusoft Ministry of Economy\" to obtain Yuzu Coins; likewise, in the \"Yuzu Shop\" button in the \"Inner Circle,\" you can exchange Yuzu Coins for political power, command power, army/navy/air experience, and some fun little items\n*Yuzu Bonds\nOne contract is serviced automatically each month. Choose conservative, development, or wartime bonds; arrears increase debt and reduce credit, while maturity requires repayment, extension, or restructuring\n*Inner Circle\nYou can spend 120pp to reorganize the Inner Circle, choose specific characters (up to three) to enter the Inner Circle, and gain specific bonuses\nThe other functional decisions are also integrated here, including appointing leaders, forming the Hazuki Naval Department, Nanami's exclusive decisions, and Yoshino & Meguru industrialization\n*Yuzu Cultural Department\nA decision group for subjects: you can spend \"Yuzu Gold\" (not golden pp) (bought in the Inner Circle - Yuzu Shop) to convert subjects into specialized subject forms, or even obtain all their cores; \"Yuzu Cloud Super VIP\" (inspired by resentment toward cloud drive VIPs) can speed up the conversion of subjects and integration progress\n*721 Research Institute\nAfter recruiting Nene, establish the 721 Research Institute in the \"Inner Circle\" tab; after the \"721 Research Institute\" appears, choose to formally establish the institute, and appoint Mayu as research team leader to unlock all functions.\n The institute's functions include building research facilities, obtaining breakthrough points, getting bonus cards, and increasing research speed.\n \"Conduct Research on Astral Arts\" and \"Fund Astral Arts Research\" can increase research speed and strengthen astral user characters (Nanami, Hazuki, Mayu, Ayase, Kotori); repeating \"Fund Astral Arts Research\" recruits Ise Kotori\n Kotori can build the Air Force Department, providing bonuses to the air force\n Unique special project: the detonator (support company equipment, tank module) What? This isn't **, this is a detonator that blows the enemy sky-high at the press of a button!\nAfter recruiting Mayu, Hazuki, Meguru, and Nene, this mod generates corresponding scientists\nFree armor templates: after researching the corresponding technology, you can choose a decision to generate armor templates with extra bonuses. Not the best, but good enough for most situations\n *Two industrialization projects — Yoshino's Hoori Revitalization Plan and Meguru's Equipment Manufacturing Upgrade Plan\nThe core of the nation's industrial takeoff; whether a small or large nation, it cannot do without it! Like my Yuzu Coins for factories?\nYoshino's plan focuses on civilian industry expansion; Meguru's plan specializes in military industry expansion. If you run both plans at once, your Yuzu Coins may run out.\nAutomated industrial upgrades are implemented — you only need to ensure enough Yuzu Coins; after choosing the initial decision, industrialization will proceed automatically. Mom will never have to worry about me forgetting to click through the industrialization decisions again\n After completing industrialization, you will gain strong industrial bonuses; in vanilla terms, this is an economic miracle!\n*Yuzusoft Military Academy - general grinding, military reform, imperial guard\nGeneral grinding: spend experience and Yuzu Coins to give generals selected traits — no more worrying about having no wars to fight\nMilitary reform: five stages, each stage requiring the corresponding character to be recruited to unlock. At the end of the reform, you can choose to lean toward infantry or armored forces. After completing the reform, your troops will gain powerful modifiers\nImperial guard: you can recruit the Yuzu Fan Imperial Guard, though in limited numbers (\n☆This mod also includes easter egg characters: 86, Izumi Hiyori, Atri, Iruno;\nThe 86 event chain triggers when the 721 Research Institute is established; Hiyori is recruited through the \"Hold a Table-Side Chat\" decision unlocked after recruiting Kohibari Kurume (Tenshi☆Souzou) (thanks to Hiyori's wonderful performance in Tenshi☆Souzou, hiyohiyo~☆); Hiyori can switch portraits through general skills; Atri is unlocked at the 721 Research Institute; Iruno (the creator who spent a fortune gachaing the collection set and was made into the mod) is drawn from the Senren * Banka collection set in the \"Yuzu Shop\" (small pulls soothe the mood, big pulls hurt the wallet)\nAtri is unlocked at the 721 Research Institute and has unique templates and support companies; researching more advanced technology can develop cheaper improved models. If you want to challenge high-difficulty mods, be sure to consider equipping Atri support companies when production capacity is sufficient!"
 start_event.25.a: "Next page"
 start_event.26.t: "Yuzusoft Mod Basic Guide 4"
 start_event.26.d: "- Added the Yuzusoft Propaganda Department: you can gain various buffs by hanging posters, establishing the Yuzu Song & Dance Troupe, and touring; each tour can randomly add temporary regional modifiers to 8 states. The original Ayase concert decision has been split into \"Establish the Propaganda Department\" in the Inner Circle and \"Hold the Ayase Concert\" in the Propaganda Department; the former grants an advisor.\n- The Yuzu fan mechanic has been reset: you can now increase the number of national Yuzu fans through Propaganda Department decisions, and the various Yuzu fan decisions now require the new \"Yuzusoft Games\" equipment, which can be produced after obtaining the Propaganda Department. Yuzu fans are now proportionally counted as manpower for forming the Yuzu Imperial Guard, and Yuzu fans increase as the national population grows.\n- Each stage of the military reform decisions can now randomly add the \"Yuzu fan\" trait to one national non-Yuzu general; some military reform decisions unlock specific powerful Propaganda Department propaganda decisions.\n- The intelligence agency has gained \"Foreign Yuzu Fan Infiltration\": each click of the decision increases the \"Yuzu Fan Infiltration Level,\" and the higher the level, the greater the returns of the original sabotage operations! The intelligence agency also gained country-selection decisions, allowing you to select major countries, border countries, or non-major countries, and select multiple countries at once for spy operations; click \"Cancel Selection\" to clear the selection in one click. The restriction that all intelligence agency decisions could only be clicked during war has been removed.\nA new operation panel has been added: after forming the Inner Circle, click Nanami hanging at the top to open the panel, where you can toggle each decision group on and off; the original toggle decisions have been removed.\nNotes:\nThis mod has limited compatibility with mods such as Millennium Dawn and TNO; we recommend enabling the Youth Version for play; most of TFR's functions work, but the 0721 Institute is unusable because TFR has no research facilities (crash warning!)\nThe full version's power level has been sprinting down the road of power creep (lol). For a better experience, you can choose mods such as JCP Remake, IAR EXAI, various EXAI mods for a little heavenly war. Or you can just use the Youth Version — as long as you have your wives, that's enough.\nThis mod can be downloaded from GitHub for the latest version: https://github.com/Fostanico/yuzumod — past release versions may be recorded there in the future\n☆We have also obtained the consent of the Yuzu Radio Station author to integrate the Yuzu Radio Station into our mod. Since our mod may be somewhat overpowered, if you want to listen to Yuzusoft BGM without being overpowered, you can run their mod separately at https://steamcommunity.com/sharedfiles/filedetails/?id=3143387438&searchtext=%E6%9F%9A%E5%AD%90\n☆A small Yuzusoft + JCP component from group friends greatly inspired our mod (from design to code); it is not recommended to enable both https://steamcommunity.com/sharedfiles/filedetails/?id=3334303111&searchtext=%E6%9F%9A%E5%AD%90%E7%A4%BE\n☆For suggestions or bug reports, please leave a message at the link below or join the QQ discussion group, group number 967395223. Document https://docs.qq.com/doc/DZVpkdWRBQ2hITFV2 "
 start_event.26.a: "Oh, I can't wait to play the Yuzusoft mod!"
 start_event.27.t: "Multiplayer Weakened Yuzusoft"
 start_event.27.d: "If you are a veteran of mods like JCP Hope or IAR Purgatory, find the Youth Version too grindy, and the Full Version kicks the enemy to death too easily, then you can try this — the multiplayer weakened Yuzusoft\n The weakened version cannot use industrialization; most of the story, mechanics, and power are removed (except Yoshino and Noa), along with Atri, the Yuzu Imperial Guard, the Yuzusoft Ministry of Economy, the Cultural Department, replacement Yuzusoft leaders, and the detonator. However, most advisors, most of the 721 Research Institute's functions, and Nanami's Intelligence Bureau still work, making it more suitable for multiplayer than the full version — van 2025.5.24\n Note: this mode has no Cultural Bureau, and Yuzu Gold is useless — please do not buy it. The collection set cannot be drawn either; all collection-set content can only be drawn in the full version! "
 start_event.27.a: "Understood!"
