 youzu_md_military_reform_1: "Mount the New Armor, Strike Like Lightning"
 youzu_md_military_reform_1_desc: "Main battle tanks will rupture the front, infantry fighting vehicles will follow with concentrated fire, and armored personnel carriers will deliver infantry safely into the breach. A modern armored force is not merely a collection of vehicles, but an assault system sustained by speed, information, and coordination."
 yz_md_military_reform_1: "Yuzusoft Modern Combined Armor Reform"
 yz_md_military_reform_1_desc: "Strengthens main battle tanks, infantry fighting vehicles, and armored personnel carriers"
 yz_md_military_reform_1_effect_tt: "§YMain battle tanks§!: Soft and hard attack §G+25%§!, defense §G+15%§!, breakthrough §G+30%§!, speed §G+10%§!, organization §G+2§!, reliability §G+20%§!\n§YInfantry fighting vehicles§!: Soft attack §G+30%§!, hard attack, defense, and breakthrough §G+25%§!, speed §G+12%§!, organization §G+3§!, reliability §G+20%§!\n§YArmored personnel carriers§!: Soft attack, hard attack, and breakthrough §G+15%§!, defense §G+35%§!, speed §G+12%§!, organization §G+4§!, reliability §G+20%§!"
 youzu_md_military_reform_2: "Thunder from the Rotors, Precision at Every Point"
 youzu_md_military_reform_2_desc: "Attack helicopters will cross terrain barriers to strike armor and fire-support nodes, while transport helicopters deliver assault troops, supplies, and rescue teams wherever they are needed most. Rotary-wing aviation will become the ground force's blade into the enemy rear."
 yz_md_military_reform_2: "Yuzusoft Army Aviation Reform"
 yz_md_military_reform_2_desc: "Greatly strengthens attack helicopters and helicopter-borne forces"
 yz_md_military_reform_2_effect_tt: "§YAttack helicopters§!: Soft attack, hard attack, and breakthrough §G+50%§!, air attack §G+25%§!, defense §G+35%§!, speed §G+20%§!, organization §G+5§!, reliability §G+30%§!\n§YHeliborne forces§!: Soft attack, defense, and breakthrough §G+35%§!, hard attack §G+25%§!, speed §G+20%§!, organization §G+6§!, supply consumption §G-15%§!; transport helicopter reliability §G+30%§!"
 youzu_md_military_reform_3: "Drone Data Links, War at the Keystroke"
 youzu_md_military_reform_3_desc: "From airborne reconnaissance-strike platforms to tactical drones accompanying infantry, sensors, command nodes, and weapon platforms will share one data link. Enemy deployments will be harder to conceal, and agents attempting to penetrate our networks will face stronger countermeasures."
 yz_md_military_reform_3: "Yuzusoft Unmanned Systems and Data-Link Reform"
 yz_md_military_reform_3_desc: "Strengthens drones, intelligence networks, reconnaissance, and counterintelligence"
 yz_md_military_reform_3_effect_tt: "§YIntelligence system§!: Intel network gain §G+30%§!, agency defense §G+30%§!, enemy operative detection §G+25%§!, decryption §G+20%§!, reconnaissance §G+25%§!\n§YAir UAVs§!: Air attack, defense, and ground attack §G+40%§!, agility §G+30%§!, range §G+25%§!, production cost §G-20%§!, reliability §G+35%§!\n§YTactical drone companies§!: Reconnaissance, soft attack, hard attack, defense, and breakthrough §G+1§!, organization §G+3§!; land drone reliability §G+35%§!"
 youzu_md_military_reform_4: "Grenades, Marksmen, Long-Range Fires: Land, Sea, Air, Space, Cyber!"
 youzu_md_military_reform_4_desc: "From individual weapons, precision marksmen, and long-range fires to coordinated land, sea, and air power, every domain of modern war must enter one command chain. Every soldier will become a node in the system, and every service will act from the same operational picture."
 yz_md_military_reform_4: "Yuzusoft All-Domain Joint Operations Reform"
 yz_md_military_reform_4_desc: "Greatly strengthens infantry and improves joint land, naval, and air operations"
 yz_md_military_reform_4_effect_tt: "§YInfantry§!: Soft attack, hard attack, defense, and breakthrough §G+35%§!, speed §G+10%§!, organization §G+5§!\n§YArmy§!: Soft attack, hard attack, defense, and breakthrough §G+15%§!, initiative §G+10%§!, supply consumption §G-10%§!\n§YAir force§!: Mission efficiency, attack, and defense §G+20%§!, agility §G+15%§!\n§YNavy§!: Damage and defense §G+20%§!, speed §G+10%§!, organization §G+15%§!\nInfantry weapons, artillery, anti-tank, anti-air, utility vehicles, fixed-wing aircraft, and Millennium Dawn hull reliability §G+20%§!"
