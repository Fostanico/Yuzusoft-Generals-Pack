 start_event.201.t: "Yuzu Song & Dance Troupe: Wartime Life Chronicle"
 start_event.201.d: "[YuzuSongUndDanceTroupe_event_text]"
 start_event.201.a: "[YuzuSongUndDanceTroupe_event_option_text]"
 YuzuSongUndDanceTroupe_event_text_1: "NO.1 The Dawn Cantor\n\nEvery morning at dawn, Mitsukasa Ayase leads the troupe members onto the factory rooftop. Using the iron chimney as a natural megaphone, she wakes the sleeping streets with her clear voice. Housewives light their stoves and cook porridge to her \"Morning Mist Ballad,\" and students recite their lessons along with the melody. When the air-raid siren sounds, she hums a wordless tune, tapping a beat on the rusty railing with her fingers, as if even the howling bombers have become part of the harmony.\n\n\"Music doesn't need to defeat anything — it just needs to remind people what they should wake up for tomorrow.\" She often says this, drilling small holes into the shell casings she finds and turning them into wind chimes for the bakery on the corner."
 YuzuSongUndDanceTroupe_event_text_2: "NO.2 The Guitar and Starlight Classroom\n\nIn the backup power room deep in the air-raid shelter, the sound of a guitar always drifts, in snatches. Kariya Wakana wraps the strings in medical gauze and teaches the children to use tin can lids as picks. Her \"Star-Trail Lullaby,\" arranged for night-shift workers, is unbelievably gentle — the metal strings glow warmly in the dim lamplight, and even the drip of water seeping into the shelter becomes a natural metronome.\n\nOnce, when an air raid dragged on, she played for seven straight hours without stopping, until blood seeped from her fingertips. The next day, people found she had quietly converted her guitar case into a bookshelf, stuffed with music-theory notes pasted together from old maps."
 YuzuSongUndDanceTroupe_event_text_3: "NO.3 The Trombone and Sewing Class\n\nHer trombone always stands by the sewing machines at the community center. Nakanoshima Tae invented the \"knitting beat method\": one long note for every ten stitches, turning patch patterns into a visible staff. Housewives knit gloves to the rhythm of the \"Wool Waltz,\" and before they know it, even their stitches become as neat as piano keys.\n\nHer most popular class is \"Ghost-Dispelling Embroidery\" — really, it's just teaching everyone to embroider note patterns on handkerchiefs. \"Music can drive away all scary things!\" she says earnestly, while her ears quietly turn red. Once, when lightning flashed past the window frame, she was so startled that she stuffed her trombone into the yarn basket — and ended up playing the shakiest \"Scene in the Rain\" in history."
 YuzuSongUndDanceTroupe_event_text_4: "NO.4 The Trumpet and Rooftop Post Office\n\nBetween the clotheslines on the hospital rooftop, a lively trumpet tune always leaps. Ebihara Minase folds medical record sheets into paper planes, carrying the soldiers' letters home to distant places. She composes a unique melody for each letter: a light \"Song of the Lark\" for blessings to newborns, a deep \"Fog Bell Elegy\" for comrades who fell in battle.\n\nAfter the head nurse confiscated her snacks, she defiantly played the \"Hunger March\" all night — only to get the entire ward humming along. The next morning at breakfast, everyone silently spread their rationed jam on the back of her sheet music — even though it was covered in protest doodles reading \"No Calling Me Shrimp.\""
 YuzuSongUndDanceTroupe_event_text_5: "NO.5 The Clarinet and Lending Station\n\nHer \"Fortress of Discipline\" stands in the ruins of the library. Imamiya Noriko arranges shell casings into a book classification system, requiring every prewar novel to be registered in a lending ledger converted from blood-bank forms. For War and Peace, she notes the reading accompaniment as \"Contemplation in E-flat\"; for Little Women, she prescribes a strict three-beat page-turning rhythm.\n\nSomeone once caught her curled among the bookshelves late at night, silently copying the \"Moonlight Sonata\" in pencil onto the wall cracks. Those notes hide behind the spines of Infantry Drill Manuals, like a string of gentle secrets."
 YuzuSongUndDanceTroupe_event_text_6: "NO.6 The Moonlight Concert\n\nThe ruins of the bombed-out church became her carefully planned stage. Hibarigaoka Yuki pieces together fragments of colored glass into a starry projection, and requires every audience member to bring a homemade instrument — spoons and tin cans, combs and cellophane. Her \"Rubble Concerto\" requires precise coordination with the wind, and even the night owls flying over the ruins are listed as guest performers.\n\nAt the curtain call she always panics: \"I-It's not like I prepared this for you! There just happened to be moonlight!\" She clutches the scorched velvet curtain, her cheeks redder than the warning paint on an unexploded bomb."
 YuzuSongUndDanceTroupe_event_text_7: "NO.7 The Dandelion Choir\n\nBeside the old piano at the orphanage, Mikage Sumi teaches the children to make tuning forks from shell casings. She whittles a broom handle into a baton and leads them to find natural chords among the wildflowers: the rustle of drifting dandelion fluff is the soprano, and the buzz of beetle wings the bass accompaniment.\n\nA soldier once brought back a captured enemy accordion; she silently removed the keys and converted them into a literacy board. When the first child read out the word \"peace\" to the melody of the \"Ode to Joy,\" she bowed her head to wipe her glasses, saying it was just rain wetting her eyes."
 YuzuSongUndDanceTroupe_event_text_8: "NO.8 Kagura and the Tin Shrine\n\nOn the site of the destroyed Tatemi Shrine, Tomotake Yoshino ties a shimenawa from parachute cloth. She upturns a German steel helmet into a makeshift shrine, enshrining a miniature Murasame-maru carved from a shell casing. Every Friday at dawn, she performs a simplified kagura dance behind the broken wall — a rusty can lid serves as the kagura bell, bandages are dyed the color of hakama, and even the roar of bombers crossing the clouds becomes a substitute for the taiko drum.\n\nDeep in the air-raid shelter there is a \"temporary shrine\" built from ammunition boxes, hung with a 24-solar-terms chart painted by Yoshino. On festivals, she teaches the children to fold white doves from bullet casings and to set up shell-fuse candlesticks. A soldier once tucked his beloved's photo into the tin omamori she made; after the war, a small line was found written on the back of the photo: \"May every wait be worthy of the morning light.\"\n\nWhen Mitsukasa Ayase's morning song reaches its third verse, Yoshino can always be seen dancing silently in the shadow of the factory chimney. They have never spoken, but one day a yuzu leaf appeared in Ayase's score folder, and on the rubble of the shrine ruins lay a miniature microphone bent from copper wire."
 YuzuSongUndDanceTroupe_event_text_9: "Before the morning mist had lifted, Mitsukasa Ayase was already on the factory cooling tower, testing her voice. She used the searchlight reflector as a sound shell, and the chorus she hummed flowed down the steam pipes into the kitchen — where Kariya Wakana was carving a guitar bridge with a bayonet, converting compressed-biscuit bags into soundproofing. Nakanoshima Tae's trombone drifted over from the sewing class, mingling with the wind chimes strung from buttons by the housewives, startling Imamiya Noriko curled behind the library's ruined pillars, who hastily hid the bandage covered in musical notes inside an Infantry Drill Manual.\n\nHibarigaoka Yuki directed the children in pasting broken porcelain into a mosaic curtain wall, while Mikage Sumi stole half a can of paint and taught the orphans to draw a staff in the air-raid shelter. Ebihara Minase's trumpet suddenly leapt up from the hospital rooftop, and paper-dove record forms flew out of twenty-three windows at once, each wing stained with the omamori patterns Yoshino had painted in yuzu-peel juice.\n\nAs dusk fell, everyone gathered at the ruins of the railway bridge. Mitsukasa Ayase struck a tuning fork converted from a railroad track, and moonlight flowed down Kariya Wakana's guitar strings into an abandoned boxcar. When Yoshino shook the kagura bell strung from signal-flare casings, eight hundred candle holders lit up at once — arranged by Imamiya Noriko in musical scale order, each flame's height precise to the millimeter."
 YuzuSongUndDanceTroupe_event_option_text_1: "Shell casings cradle dawn songs; an iron throat brews the frost of years"
 YuzuSongUndDanceTroupe_event_option_text_2: "Broken strings rest upon starlight; lingering warmth hatches the long night"
 YuzuSongUndDanceTroupe_event_option_text_3: "Stitches suppress the ghosts; yarn binds the moon's tide"
 YuzuSongUndDanceTroupe_event_option_text_4: "Paper kites carry the twilight; rests feed the flocks of doves"
 YuzuSongUndDanceTroupe_event_option_text_5: "Shell casings imprison moonlight; the blood bank keeps the sound of the tide"
 YuzuSongUndDanceTroupe_event_option_text_6: "Shattered glass heartbeats; scorched silk binds the moon's orbit"
 YuzuSongUndDanceTroupe_event_option_text_7: "Dandelions learn to read; piano keys sow spring thunder"
 YuzuSongUndDanceTroupe_event_option_text_8: "Guitar strings mend the hours; kagura wakes the dawn"
 YuzuSongUndDanceTroupe_event_option_text_9: "A steel helmet's muted note stills the scorched earth; a remnant kagura bell embroiders the spring river"
