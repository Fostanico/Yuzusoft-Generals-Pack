l_english:
 ##Hachiroku Event Chain
 ASHC_event.1.t: "A Doll on the Railway?"
 ASHC_event.1.a: "Let's try waking her up."
 ASHC_event.1.d: "After the research institute was completed, Mayu and Nene discovered a railway doll while studying railway technology. The two brought this railway doll to your office, and you, driven by curiosity, decided to awaken this unusual automaton.\n(The 8620 Railway Company requires both Mayu and Nene to be recruited before it appears.)"
 ASHC_event.8: "Hachiroku after Awakening"
 ASHC_event.8.a: "So... what now?"
 ASHC_event.8.d: "After she awoke in my office, I immediately set down my documents and asked about her origins with great curiosity.\n'I am Hachiroku, a Railroader exclusively for the former Imperial Railways Type 8620 steam locomotive. Um... please take care of me, Master,' the girl replied calmly.\n'A Railroader, huh...' I gazed at the girl before me with some wonder — after all, I'd never seen such a perfect doll, one that could even shed tears. And most importantly, she was adorable! A truly special existence in this world.\nCollecting myself, I asked Hachiroku: 'Hachiroku, is there anything you'd like to do?'\nHachiroku looked at me with hopeful eyes and said, 'Well... Master, could you let 8620 run on the rails once more? Also, please give me some water to drink and some coal.'\n8620... that damaged train? It was hauled over from Ohitoyo some time ago. I was curious too — what makes this train so special that it came with a Railroader?\nI ordered my subordinates to bring some coal and water. She consumed them all, then handed me a blueprint for the 8620 steam locomotive.\n'Master, would you be willing to be my driver?'\n'Yeah, of course. I have a duty to take responsibility for you, don't I?' With that, I took her hand..."
 ASHC_event.8.t: "Come — let's go see 8620."
 ASHC_event.9.a: "I'm busy right now. Let's postpone this."
 ASHC_event.10.t: "The 8620 Restoration Plan"
 ASHC_event.10.d: "Arriving at the locomotive shed where 8620 was stored, I noticed Hachiroku's expression — a mix of anticipation and something more complicated. She even went inside before the door was fully open. I signaled my subordinates to wait outside.\nAlone, I saw Hachiroku standing motionless beside that massive steam locomotive... Wait — was she crying?! I hurried over to see what was wrong, my heart aching at the sight. But before I could speak, Hachiroku said through her tears:\n'8620... has been damaged to this extent, hasn't it...?' Yes... this train was, in a sense, herself. Who could imagine what this locomotive had endured from the day of its accident until being hauled here today? That thought crossed my mind, and then a resolve ignited within me.\nFirmly, I said to Hachiroku: 'Hachiroku! Pull yourself together! Crying won't solve anything! Didn't we come here precisely to bring 8620 back to life? Or... does Hachiroku want to kill it with her own hands...'\n'No!' At those words, Hachiroku's downcast expression vanished, and she answered me. Of course, I was glad to hear such a reply — but that was only the first step. I needed to see Hachiroku's willpower. Raising my voice just a bit, I continued:\n'Then start by standing up! This time, I won't help you. You have to get up on your own.'\n'I understand...' She tried to stand, but fell. She rose again, only to fall once more. I desperately wanted to rush over and lift her up, but I knew — willpower is something one must forge alone.\nAfter many such attempts, Hachiroku finally made her way, with difficulty, to stand before me. It was faster than I'd expected — it seemed she had managed to regulate her emotions somewhat. That alone was enough.\nI reached out and patted Hachiroku's little head, then signaled to the subordinates waiting outside.\nAt this moment, Hachiroku looked at me and asked, 'How long does Master plan to take?'"
 ASHC_event.10.a: "Devote everything to repairing the train!"
 ASHC_event.11.a: "We're short on resources, and there's other construction too. Let's take it slow."
 ASHC_event.12.t: "8620 Railway Repairs and Technical Bottlenecks"
 ASHC_event.12.d: "During the restoration work, Hachiroku told me: 'Master, just repairing 8620 isn't enough — the railway itself also needs repair...'\n'I understand,' I cut in, then ordered my men to recruit some track inspectors. At the same time, to get a more direct view of the repair sites, I brought Hachiroku out to the outskirts. Just then... word came from the shed that some of 8620's technical data was blank...\nBoth Hachiroku and I were taken aback, but Hachiroku was the first to react: 'Mm... my body's performance is currently limited... so I'm unable to provide 8620's detailed specifications... I'm sorry...'\n'Let's set that aside for now, Hachiroku. Let's head back first.' I took Hachiroku's hand and hurried back to the shed with her...\nBut Hachiroku ran even faster than I did — more anxious than I was. Back at the shed, with the workday already over, the words slipped out of me: 'All alone again...'\nBut Hachiroku, upon hearing this, grew even more agitated. She kept calling out to her other half:\n'Were you... here all this time... like this...?'\n8620 seemed to give no response, but Hachiroku, full of self-reproach, said: 'It's all my fault... that you've been so... alone all this time...' A tear traced down Hachiroku's face. I looked at her with aching concern, and then the tears fell like rain.\n'But I...' I silently moved behind Hachiroku, wrapping my arms around her petite body. Once she had gathered herself,\nI said gently: 'I am your Master. I promised you — I will definitely repair 8620. We will definitely reach the end of the line.' But now, having soothed Hachiroku, what should we do next? The technical hurdles, after all..."
 ASHC_event.12.a: "Transfer some scientists over from Nene and Mayu's team!"
 ASHC_event.13.a: "Let's forget about it..."
 ASHC_event.14.t: "Depart! 8620!"
 ASHC_event.14.d: "A few days later, Nene handed a repair plan to me. I ordered my subordinates to carry it out immediately, and as for Hachiroku — wherever she heard noises, she'd dash over to check, even offering hands-on guidance.\nI understood, though. After all, Hachiroku had been through so much. With countless helping hands, 8620... now only needed water. As long as we followed the guide, there shouldn't be any issues.\nAfter a while, when the external preparations were complete, Hachiroku and I headed to the cab. I eagerly picked up the coal scoop, but Hachiroku grabbed my hand and said: 'Not yet. First, the water and fuel.' I set down the scoop and took Hachiroku's driver unit from my bag. Once the control panel was swapped in, Hachiroku slowly opened her eyes and spoke to me in earnest: 'Thank you...'\n'Well... it's still too early for thanks,' I said gently. Hachiroku smiled too: 'Hehe... you're right...' But by now we were fully prepared, so I brought Hachiroku back to the cab.\nThen Hachiroku handed me a box of matches. I took one match and gazed at it for a moment — was there something sacred in the feeling?\nAs I was still pondering, Hachiroku told me: 'All procedures are normal. Please ignite 8620.' I struck the match at once, and in that moment my sense of purpose erupted. I tossed the match onto the oily rags on the grate, and they burst into flames at once. Taking up the coal scoop, I followed Hachiroku's instruction to start at one scoop every twenty seconds.\nWith a blast of the whistle — as if answering everyone's hopes — next came the instruments, drain cocks, and other checks. Once everything was verified... 'DEPART!' — that word rang out from both Hachiroku and me at the same instant.\nAmidst everyone's eager anticipation, 8620 slowly began to move. As the driving wheels turned, round after round, the long-dormant 8620 gradually came back to life. The route wasn't long — it was, after all, only a test run — but both the starting point and the destination bore welcoming banners, proclaiming the success of our restoration project. My heart swelled with joy.\nHachiroku's eyes glistened; she looked up at me. Before I could react, she threw her arms around me and buried her face in my chest, saying: 'This time, truly... thank you so much. Hehe, but... is there anything Master needs Hachiroku's help with?'\nAh, come to think of it, I'd been so focused on 8620 lately — domestic affairs had been managed by others all this while. The government wasn't short on hands, so..."
 ASHC_event.14.a: "Take Hachiroku to the General Staff in a few days?"
 ASHC_event.15.a: "Just having Hachiroku supporting me is more than enough!"
 ASHC_event.16.a: "Take Hachiroku to the Foreign Ministry in a few days?"
 ASHC_event.17.t: "Forward, toward the Future!"
 ASHC_event.17.d: "After deciding on Hachiroku's position, and with Nene and Mayu's support, she established her own railway company. But affairs of state were demanding... the time I could spend with Hachiroku grew much shorter...\nSeeing my furrowed brow, Hachiroku handed me a glass of water and spoke softly: 'Master, I've looked through these documents to some extent. Would you like me to help you with them?'\nI gave it serious thought. But Hachiroku didn't have experience with such matters, did she? So I brought her along to cabinet meetings as an observer.\nSome time later, inside the train cab, I reflected. After all, repairing 8620 was only the beginning. What comes next... is heading toward a bright future!\nSo, in response to Hachiroku's proposal, how about..."
 ASHC_event.17.a: "Become my right hand!"
 ASHC_event.18.a: "Let's keep things as they are for now. (This decision reappears after one year.)"
 ASHC_event.19.t: "Assuming Leadership"
 ASHC_event.19.d: "After 8620 was restored, Hachiroku's performance was greatly enhanced. You have done so much for Hachiroku — now, let her help you in return!"
 ASHC_event.20.a: "A battle-tested Communist Party member."
 ASHC_event.21.a: "A champion of liberal democracy."
 ASHC_event.22.a: "Why not strive for something greater?"
 ASHC_event.23.a: "Entrust everything to Hachiroku."
 ASHC_event.30.a: "Let's not."
