 baliu_hide11: "Do not allow Hachiroku to become a leader."
 ##Hachiroku Traits
 baliu_desc: "Never mind... Hachiroku is already here. Ohitoyo's mightiest Railroader, a train driver who has achieved the state of unity between human and machine. Her ideal physical condition means she needs only coal instead of meals~ Your Hachiroku, reporting for duty! But this time, Hachiroku has to handle far more than Mayor Paulette ever had to deal with. So as the deputy driver of this nation-locomotive, don't you dare hold back our great helmsman Hachiroku! One more thing — the giant Hachiroku is her driving form, not a Stand."
 baliu_1: "Hachiroku"
 tielurenou: "Railroader"
 tielurenou_desc: "The presence of a Railroader makes rail transport more coordinated; both supply efficiency and synergy are improved."
 yz_legacy_tielurenou1_trait: "The Spinning Future"
 yz_legacy_tielurenou1_trait_desc: "After agreeing to restore 8620, Hachiroku's trust in you deepened, and her performance has been gradually improving."
