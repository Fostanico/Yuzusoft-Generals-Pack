 yz_choice_recruit.1.t: "Choose a recruitment method"
 yz_choice_recruit.1.desc: "Would you like to experience the original choice routes?\n\nClassic: click an SD character to recruit.\nRoutes: choose the original answers and recruit when a route ends.\n\nRemembering a method applies to both Senren Banka and RIDDLE JOKER for this campaign and is saved with your game. Recruitment costs and effects follow the regular mod. Koharu and Roka join directly through their new routes."
 yz_choice_recruit.1.a: "Classic SD recruitment"
 yz_choice_recruit.1.b: "Recruit through choice routes"
