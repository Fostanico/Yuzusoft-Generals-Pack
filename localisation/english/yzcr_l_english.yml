 yzcr_help: "Route guide"
 yzcr_help_title: "Route guide"
 yzcr_help_tt: "Open or close the route guide. Right-click to close recruitment."
 yzcr_choice_sprite: "GFX_yzcr_senren_choices_en"
 yzcr_help_body: "Yoshino: Fishing > Definitely not > Reassure Tomotake-san.\nMako: I'm not so sure > Vegetable gathering.\nMurasame: Strike out on my own > Pat her head.\nLena: I think you look cute > Fishing > If you say so...\nKoharu / Roka: recruit a main heroine first, then choose\nTell her the truth + Believe in Koharu, avoid other main routes,\nand choose whose smile you want to see.\nThe Rentarou choice appears only after Fishing.\nOther answers can be chosen freely.\nEach new recruit costs 10 political power; owned characters are skipped."
 yzcr_rj_choice_sprite: "GFX_yzcr_riddle_choices_en"
 yzcr_rj_background_sprite: "GFX_yzcr_riddle_backgrounds"
 yzcr_rj_help_body: "Ayase: President's room > Usual dorm > Mayu.\nNanami: Talk to Nanami > Nanami's swimsuit > Compliment her > Lab. The final answer is unrestricted.\nHazuki: Hazuki's swimsuit > Hazuki.\nMayu: Continue the test > Lab > Mayu.\nChisaki: Recruit a main heroine from this game first, then\nNanami's swimsuit > Ask her > Chisaki. Avoid Nanami's route.\nNormal End recruits Ayase, Mayu, Hazuki and Chisaki together.\nAsk her appears only after recruiting a Riddle Joker main heroine.\nChoosing the lab skips lunch and counts as the other dorm.\nEach new recruit costs 10 political power; owned characters are skipped."
