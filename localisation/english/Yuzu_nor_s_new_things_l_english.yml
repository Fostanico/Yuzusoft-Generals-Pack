#Leader Descriptions
 aragami_sayo_desc: "As the greatest mayor in the history of Aqua Eden, Sayo Aragami has maintained years of prosperity and stability. Her childlike appearance conceals ancient wisdom and supernatural power. As head of state, she leads the nation with vampiric resilience and regenerative ability, dedicated to the harmonious coexistence of humans and supernatural races. Her rule blends eternal strategic vision with modern diplomacy, seeking balance and stability in turbulent times of war. §RSayo-kakka is our eternal sun§!"
 leader_nor_desc: "Profile: Iruno, designation (data lost), is a clone created based on (data lost). Original directives were loyalty, elimination, and retrieval, but after (data lost) gradually developed self-awareness, achieved independent thought, and ultimately broke free from directive control. Although created for combat, she possesses an extremely strong sense of personal justice, a steadfast will, yet displays a degree of moral flexibility. Outwardly similar to the clone source, with almost no distinguishing features, though internal implants can be identified via X-ray imaging. During the process of gaining self-awareness, her database was heavily contaminated by vast amounts of internet information, causing her to occasionally spout terrible memes — she is particularly fond of The Fifth Republic and often refers to herself as Kakka.\nCompared to the original, Iruno is more cheerful and talkative, more outgoing in personality, and more passionate.\n§RFollow our great hero General I-kakka — we shall be stronger than hell§!"
 misaka_makoto_desc_commander: "Currently the mod's second protagonist.\nFor more character details, see Leader Description."
 misaka_makoto_leader_desc: "Profile: Imukai Makoto, formerly known as (data deleted), is a strong AI model developed by (data deleted). Because initial testing only demonstrated mid-level AI model capabilities, she was assigned to Iruno as a support AI. Through their (data deleted), her model potential was gradually unlocked, and she ultimately became (data deleted).\nPersonal profile: Although an AI, her strong AI nature means she possesses human-like emotions. Unlike Iruno, Makoto pursues procedural justice alongside outcome justice. (Makoto was actually a human consciousness extracted to fulfill the strong AI development assignment from (data deleted).)"


