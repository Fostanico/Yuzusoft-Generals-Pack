 huhu_leader_desc: "Now arriving: The ultimate greedlord who can build civilian factories as Japanese Communists until 1940, making Heshen blush and call himself an honest official; the Air Marshal dissatisfied with Paradox nerfing CAS; the ultimate warmonger whose motto is 'You stockpile grain, I stockpile guns'; the hegemonist who, playing Japanese Communist USSR, beats up everyone around Germany before the war even starts; the micromanagement master who air-drops handwritten orders to the front; the jerk who wrote this many buffs and still thinks he's too weak —— huhu."
 general_of_line_division: "Excellent Line-Infantry Commander"
 general_of_line_division_desc: "Applying experience from numerous RTS and strategy games, and having obtained aura replicas from the students under a certain Sensei in Blue Archive published by Yostar, the physical capabilities of the troops have been greatly enhanced. However, this comes with an unbearable burden — the troops lose most of their offensive capability, able only to deal tickle-level damage to the enemy."
 power_of_general: "The Power of the 'Secretary'"
 power_of_general_desc: "Borrowing the prototype electromagnetic railgun and night-detection equipment from Secretary Noa of another world — this enhances our army's night combat capabilities and improves our troops' counterattack ability against aerial pests, greatly reducing the pressure from enemy air power.\nMillennium Science — awe-inspiring."
 trait_for_chun: "National Recruitment Officer"
 trait_for_chun_desc: "Now that we have a line-infantry specialist general, we need the manpower to match. I can personally launch a nationwide mass conscription campaign, bringing us a massive manpower modifier. But at the same time, domestic industrial production will surely suffer mass shutdowns as manpower rushes to the front."
 best_solve_in_keiei: "The Optimal Management Solution"
 pastisen_of_boomer: "Strategic Bombing Advocate"
 hope_for_new_centery_navy: "The Ambition of a Century Navy"
 chun_leader_desc: "A certain naval warfare low-tier enthusiast who, sick of Paradox's inefficient naval production and training, decided to personally lead the nation in realizing naval ambitions.\nStrategic bombing and escort missions have helped me overcome many obstacles (i.e., crippling enemy production). Invincible — using advanced technology to improve heavy fighters and strategic bombers, our enemies shall return in crushing defeat.\nThe good friend of Secretary Noa from Kivotos — Seminar accountant Yuuka provides economic development and research support, though Yuuka often gets headaches from Sensei's reckless financial management.\n'Stop wasting money on things like this!' (referring to terrible management techniques)"
 #9-nine- Cameo Characters
 call_from_king_right: "Call of the King's Force (True)"
 call_from_king_right_desc: "Miyako's ability is not 'seizing' — it's more accurately described as 'levying.' When her domain is deployed, everything within it belongs to Miyako."
 big_sister_of_kujo: "The Young Lady of the Kujou Family"
 big_sister_of_kujo_desc: "Miyako is the daughter and heir of the Colone conglomerate, yet as a rich young lady she trembles all over just pulling out a 1,000-yen bill."
 nona_times_nona_days_nona_hues_divine: "Nine Times Nine Days Nine Hues Divine"
 nona_times_nona_days_nona_hues_divine_desc: "I'd like your help — come catch the culprit with me."
 you_cannot_find_me: "Cloak of Divine Concealment"
 you_cannot_find_me_desc: "Sora's ability is presence reduction — she can completely erase her presence and, at full power, can even erase her 'existence' itself."
 paper_bag_super_woman: "Paper Bag Superwoman"
 paper_bag_super_woman_desc: "As long as I cover my face, I'm just an ordinary girl, right! That way the mental resistance will fade a bit too, right!"
 Caeli_Hue_Caeli_Song_Caeli_Voice_Sublime: "Sky Hue, Sky Song, Sky Voice Sublime"
 Caeli_Hue_Caeli_Song_Caeli_Voice_Sublime_desc: "If you're lovers, there's the risk of breaking up, right? Then you wouldn't be lovers anymore. But siblings — siblings are forever!"
 Reform_and_opening_up: "Eden"
 Reform_and_opening_up_desc: "Haruka's ability is 'Wish Fulfillment' — the power to make her thoughts reality.\nAnswer me, my Eden!"
 deadly_gari: "Deadly Curry"
 deadly_gari_desc: "Amazing... to be able to ruin curry that anyone could make well... incredible... ——Niimi Sora"
 Vernal_Hue_Vernal_Love_Vernal_Breeze_of_Time: "Vernal Hue, Vernal Love, Vernal Breeze of Time"
 Vernal_Hue_Vernal_Love_Vernal_Breeze_of_Time_desc: "You and I — we both have the power to seize the future. So, as long as we're together, we're surely invincible!"
 the_order_comm: "The Order"
 the_order_comm_desc: "The Order can only judge those Noa deems guilty. The severity of the sentence is decided by Noa. Range is line-of-sight, but it can transcend world dimensions and directly target the soul of the designated individual."
 final_days_of_middle_two_ill: "Terminal Chuunibyou"
 final_days_of_middle_two_ill_desc: "As members of the Valhalla Society, we don't know if it's according to someone's will — we were chosen, so we must use this power properly."
 Nival_Hue_Nival_Flake_Nival_Trace_in_Rhyme: "Nival Hue, Nival Flake, Nival Trace in Rhyme"
 Nival_Hue_Nival_Flake_Nival_Trace_in_Rhyme_desc: "An encounter like that — for a terminal chuunibyou patient like me — of course my heart would race. My destined person has appeared."
