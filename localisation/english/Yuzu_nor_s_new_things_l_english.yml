#Events
 aragami_sayo_event.1: "Sayo Takes Power"
 aragami_sayo_event.1.t: "The Arrival of Sayo"
 aragami_sayo_event.1.d: "Sayo's years of achievement in Aqua Eden have convinced us that she is an undeniable political talent. We now invite her to become our leader. We can entrust the nation to her — she will surely not let us down."
 aragami_sayo_event.1.a: "Sayo's Party — the power of the people!"
 aragami_sayo_event.1.b: "§2Make [ROOT.GetTag] great again!§!"
 aragami_sayo_event.1.c: "Führer Sayo, banzai!"
 aragami_sayo_event.1.e: "Without Sayo, there is no us!"
 aragami_sayo_event.2: "A Choice"
 aragami_sayo_event.2.t: "A Visit"
 aragami_sayo_event.2.d: "As you were working in your office as usual, two people entered. You look up and see that it is Sayo Aragami, whom you are about to appoint, and a general you drew from the lottery. Only now do you realize that they are almost identical except for their clothes. They seem to have come regarding the leadership appointment."
 aragami_sayo_event.2.a: "Appoint Sayo as leader according to the original plan"
 aragami_sayo_event.2.b: "Noa-chan should be an excellent choice"
 aragami_sayo_event.2.c: "Loyalty!"
 tongyong_event.118171139: "Wedding with Sayo"
 tongyong_event.118171139.t: "—Under the starry sky of Aqua Eden, forging a brilliant legend of the future together—"
 tongyong_event.118171139.d: "In Aqua Eden, floating upon the azure sea as a symbol of hope and peace, night falls and the stars shine brightly. Golden lights illuminate the architecture blending modernity and classical elegance — every brick, every tile tells a tale of ages and legends. Today, this place hosts a grand wedding that transcends the boundaries of time and race — the blessed union of Sayo Aragami and you.\n  As the solemn music begins to play, Sayo Aragami, dressed in elegant and resplendent kimono, her eyes shimmering with millennia of wisdom and tenderness; and you, in a tailored suit, radiating a vision of boundless future. You walk slowly down the flower-strewn path of vows, as if time itself has crystallized — where legends of old and hopes of tomorrow converge in perfection.\n  Accompanied by the soaring orchestra, you exchange tokens of eternal promise — an ancient yet brilliant ring, engraved inside with the inscription 'Coexistence — Co-prosperity,' as if proclaiming the perfect fusion of two worlds. From this moment on, Sayo Aragami and you are not only wedded as one, but have become the most radiant legend in Aqua Eden."
 tongyong_event.118171139.a: "The heart always, aims for the distant beyond"
 nuke_dropped.12097: "The Destruction of Ohitoyo"
 nuke_dropped.12097.t: "The Destruction of Ohitoyo"
 nuke_dropped.12097.d: "Today, an atomic bomb detonated precisely above Ohitoyo by barometric fuse. [?global.nukecountry.GetNameDef] showed not the slightest mercy toward Ohitoyo's history and culture.\n In the instant of detonation, the shockwave and radiation turned everything into a living hell. The ancient divine blessing that once protected this land paled before the power of the atom.\n When rescue workers entered after the radiation subsided, only Kensho Shrine and Murasame-maru embedded in stone remained to tell of its former glory. Almost no one survived other than a few great families such as the Tomotake and Kurama. According to survivors, in the moonlit ruins, they glimpsed a faint, ethereal figure — a green-haired girl weeping in sorrow. Today, this land that was once a treasure trove of wealth and culture is reduced to cinders and rubble, transformed into an eternal elegy. §RTagonashiya can never claim to be a 'century-old shop' again§!."
 nuke_dropped.12097.a: "I hope we can still play Senren＊Banka"
 nuke_dropped.12097.b: "How dare [?global.nukecountry.GetNameDef]!"
 nuke_dropped.7102: "The Destruction of Washizu"
 nuke_dropped.7102.t: "The Destruction of Washizu"
 nuke_dropped.7102.d: "Today, a nuclear weapon detonated on time above the city center of Washizu. The mushroom cloud swallowed this small town almost entirely. Washizu, by any measure, held no strategic value whatsoever, yet [?global.nukecountry.GetNameDef] used the unforgivable on this place.\n Now nothing remains but shattered walls and broken tiles. From the sky, one can hardly discern what once stood here — only a crater filled with pain and calamity remains.\n After the attack, rescue workers and surviving researchers discovered a new type of particle in the ruins, which they intend to name §0'Astral'§!"
 nuke_dropped.7102.a: "Can Tachibana Academy start the new term early?"
 nuke_dropped.7102.b: "This power might be usable against the enemy"
 tongyong_event.91718630: "Grow Old Together"
 tongyong_event.91718630.t: "Grow Old Together"
 tongyong_event.91718630.d: "Today she wears a pure white shiromuku, so small and petite, wrapped up in layers upon layers of fabric like a little glutinous rice dumpling.\nHer fox ears poke through the white veil, twitching nervously. Haruki looks at her and suddenly recalls their first meeting — she shot out of a cardboard box and bit him right on the arm. Back then her eyes were like a bristling little beast, filled with 'this grudge will never be settled.'\nLater he learned it wasn't that she hated him — she was just afraid. Afraid Lady Sakuyahime would be taken away, afraid of losing someone precious again, afraid that the 'home' she had finally found would once more become drifting.\nBefore the ceremony, she secretly slipped him an oil-paper packet. He opened it to find umaibō — her favorite snack, hoarded for ages.\n'For you,' she said, turning away, but her fox ears turned toward him with total honesty. 'Humans do that... sake-sharing thing, right? We don't have sake, so this will have to do.'\nShe picked one up, crossed arms with him, and took an earnest bite. Chewing, her eyes suddenly reddened.\n'Silly Ruri,' Haruki rubbed her ears. 'From now on, we can eat them together every day.'\nThe wedding was simple. No gods bore witness — only the Chitose family and those few most familiar faces. Lady Sakuyahime sat in the corner, fan half-hiding her face, yet tears glistened in her eyes. As Haruki placed the ring on Ruri's finger, she suddenly stood on tiptoe and gave him a gentle lick at the corner of his mouth — a fox's way of healing, her instinctive response.\n'From now on, if you get hurt, only I get to lick it,' she said seriously, then immediately realized the implications, fox ears shooting up. 'Not that kind of getting hurt! I mean... argh, you know what I mean!'\nEveryone burst out laughing. Wataru Yamabuki secretly snapped a photo, and Shinichirou Chitose dragged her off to post it on social media.\nAt night, the guests departed. Ruri curled up on Haruki's lap, transformed back into her fox form — a fluffy little ball. Moonlight streamed through the window. She spoke softly, voice gentle: 'Haruki.'\n'Hmm?'\n'Thank you... for rushing out to save me that day.' She buried her face in his palm. 'Even though I could've dodged it myself... but... being held like that... it was warm.'\nHe gently stroked her back, like petting a kitten. She squinted contentedly and burrowed deeper into his arms.\n'For generations and generations to come, I won't leave,' she whispered, as if making a wish. 'Here... is my home.'\nOutside the window the moonlight was perfect, the early summer insects humming softly. That little fox who had wandered for a hundred years had finally found a place she never needed to leave again."
 tongyong_event.91718630.a: "Where the heart finds peace, there is home"
 tongyong_event.46348368: "Wedding with Kaguya"
 tongyong_event.46348368.t: "Ascend the Throne Immediately"
 tongyong_event.46348368.d: "Her beast ears beneath the veil, today no longer concealed by perception-blocking magic, now only strain to catch every footstep drawing near. Kaguya Seiun, Second Princess of the Kingdom of Sneau, once crossed worlds in pursuit of the Demon Lord's power — yet now, in the morning light of another world, she waits quietly for a wedding.\nAs she walks toward him, white train trailing behind, it is as if a star chart of another world unfurls in her wake — the path she came from, and the territory of her future. When he crowns her with both the princess's tiara and the bride's veil, her crimson eyes reflect the light of two worlds merging into one.\n'I once came seeking the majesty of magic,' her voice rings clear through the silence, 'yet here, I have found a covenant more eternal than any throne.'\nThere are no excess vows. She simply unfurls her palm — a warm, gentle glimmer of her innate magic rests quietly beside a simple ring. Just like herself, merging boundless sorcery with the most ordinary of mortal bonds into one. As the ceremony concludes, she looks back at the doorway behind her — that magical gate which once led to her homeland, to duty, to infinite possibility — now slowly dissolving in the sunlight. She turns instead, tightening her grip on the hand beside her.\nFrom now on, the way home is the way forward. Princess and bride — she is both."
 tongyong_event.46348368.a: "'Where you are — that is my kingdom.'"
 tongyong_event.65015542: "Wedding with Suou"
 tongyong_event.65015542.t: "Forbidden Love"
 tongyong_event.65015542.d: "A person meets about 29.2 million people in a lifetime. The probability of two people falling in love is 0.000049.\n\nThe beginning of love may have its coincidences, but its blossoming and bearing fruit must be a unique masterpiece in this world.\n\nThinking back, from the first time these feelings were noticed, how many hardships have these two overcome? But today, all of it has blossomed and borne fruit: we have formally decided to be together, to spend the rest of our lives with each other. A wedding is already being planned. Two still-clumsy people are suddenly swept up once again in hurried days — invitations, venue, date, menu, ceremony... on some days they collapse into sleep from sheer exhaustion. But unlike the solitary struggles of the past, we will smile and let that day descend from our dreams, arrive ahead of time — and every moment thereafter shall be —"
 tongyong_event.65015542.a: "Getting to eat the best guobaorou"
 tongyong_event.29395306: "Tsubasa Kido's Wedding"
 tongyong_event.29395306.t: "A Wedding Destined by Fate"
 tongyong_event.29395306.d: "Today is the wedding with Tsubasa. The pure white wedding dress adorns Tsubasa's figure, the long train gradually approaching you. Tsubasa's golden hair has never been so dazzling under the sunlight.\n'What's this? Stunned?' Tsubasa's face breaks into a radiant smile as she speaks gently before you.\n'Yeah, after all, you've never been this dazzling before.'\n'Actually, I have — I was more dazzling during cremation,' Tsubasa cracks one of her dark jokes.\n'On an occasion like this, maybe skip the dark jokes,' you say sternly to Tsubasa. She adopts a thoughtful expression.\n'This is my first time doing something like this too, so of course I need to joke a little to ease the tension~'\n'Tsubasa-nee, at least read the room with your dark jokes,' Rino says, pouting as she tidies Tsubasa's veil.\n'Okay okay, I get it. Don't gang up on me, you two — think about my feelings too~' Tsubasa whines cutely.\n'You never thought about my feelings when you were eating that vegetable-loaded, extra-greasy, garlic-packed giant burger either,' Rino counters mercilessly.\n'At least from now on, you can eat whatever you want, Rino won't have to suffer anymore,' you say, caressing Tsubasa's cheek.\n'That's thanks to you too. This body of mine exists because of you. I don't even know how to repay you.'\n'It's simple,' you say with a smile.\n「Yesterday, today, tomorrow — we'll always be together.」"
 tongyong_event.29395306.a: "My heart only wishes yours were the same — I shall never betray this love"
 tongyong_event.21405364: "Rino Ibaraki's Wedding"
 tongyong_event.21405364.t: "Promise"
 tongyong_event.21405364.d: "Sunlight shines upon Rino's face. Holding the bouquet, Rino instinctively raises it to block the light.\n'The sun... so bright...' Rino furrows her brow slightly, a trace of dissatisfaction on her face.\n'What's this? Not used to going out during the day?' You hold Rino's hand, smiling.\n'Not at all used to it... I always work the night shift and sleep at home during the day,' Rino mumbles with pouted lips, but then her tone shifts. 'Still, I don't regret going out during the daytime today.'\n'After all, who holds weddings at night?'\n'I gave you the day off specially — count yourself lucky,' Aya says to Rino with a smile.\n'Work at night, wedding during the day — no conflict, right?' Rino takes a mile, joking with the manager.\n'I'm not the kind of black-hearted boss who makes employees work on their wedding day. Besides, you two have your evening to yourselves,' Aya says.\n'What did you wish for back then?' You gaze at Rino's side profile and ask.\nRino answers without hesitation: 'For Tsubasa-nee to recover, of course.'\n'Nothing else?' You smile.\n'Nothing else at all!' Rino blushes and lightly punches your chest twice.\n'Then I'll take that as you had nothing else. I guess I really am less important than Tsubasa.'\n'You — !' Rino's face goes completely red, her expression complicated. Her hands clutching the bouquet bob up and down, as if she doesn't know what to do.\nRino stands on tiptoe and plants a kiss on your cheek. After a moment, she says:\n「You are the most important person in my life. Never, ever leave me.」"
 tongyong_event.21405364.a: "My heart only wishes yours were the same — I shall never betray this love"
 tongyong_event.61709779: "Yuine Amagiri's Wedding"
 tongyong_event.61709779.t: "When the Mountain Flowers Bloom"
 tongyong_event.61709779.d: "Morning light filters through the shrine's torii, scattering flecks of gold upon the approach. Yuine wears once again that simple handmade wedding dress her friends crafted — the white gauze still bearing the crooked pearls Shuri sewed, the camellia Konoka pinned gently trembling. She takes a deep breath, puts on those familiar jumping shoes, and runs forward. One step, two steps, accelerating — wind rushes past her ears, as if she were back on the track at Leizelug. From behind comes Tohru's voice: 'Don't be afraid. I'm here.' She leaps. Sunlight pierces through the white veil. The world falls silent in an instant. No bar, no score — only the embrace she falls into upon landing, warm and steadfast. Tohru caught her, like catching a bird returning to the forest.\n'This time, I won't let you jump alone anymore,' he murmurs, fingertips brushing past the beauty mark at the corner of her eye."
 tongyong_event.61709779.a: "'Leap forward toward our shared future!'"
 tongyong_event.56658215: "Sakuyahime Unohana's Wedding"
 tongyong_event.56658215.t: "A God's Covenant"
 tongyong_event.56658215.d: "Centuries of time, for the first time, condensed into the dampness of her palm. That fan which once stirred the winds and clouds now rests quietly against her faintly trembling fingertips. In the morning light, she stands before the shrine, one pure white shiromuku rendering this ancient deity unexpectedly at a loss. As Haruki approaches, she tries to summon that familiar teasing smirk, but her lips only part into a soft, genuine tenderness.\n'Who would have thought,' she whispers, crimson eyes reflecting him, 'that the answer to my eternal trial... would be you.'\nAt the ceremony, as she recites the human vows, her vast divine consciousness settles into tranquility. In the moment they exchange rings, she seems to see the land she has guarded for a hundred years, the turning seasons — all dissolving into the warmth of his palm. During the banquet, the distance of a god fades entirely from her eyes, leaving only the radiant glow of a mortal bride. Only when Haruki is being pressured into drinking does she quietly flick her fan, making the hecklers forget their words — then winks at him, a tenderness meant for his eyes alone. Late at night, she leans by the window. Haruki wraps his arms around her from behind.\n'From now on, favorable weather is my household's business,' she leans back, the fan finally set aside.\n'Well then, please take care of me,' she gazes at the familiar moonlight in the courtyard, her voice light as a sigh."
 tongyong_event.56658215.a: "'My... eternity.'"
 tongyong_event.745607: "Akari Kanemoto's Wedding"
 tongyong_event.745607.t: "Our Happiness"
 tongyong_event.745607.d: "A person meets about 29.2 million people in a lifetime. The probability of two people falling in love is 0.000049.\n\nThe beginning of love may have its coincidences, but its blossoming and bearing fruit must be a unique masterpiece in this world.\n\nThinking back, from the first time these feelings were noticed, how many hardships have these two overcome? But today, all of it has blossomed and borne fruit: we have formally decided to be together, to spend the rest of our lives with each other. A wedding is already being planned. Two still-clumsy people are suddenly swept up once again in hurried days — invitations, venue, date, menu, ceremony... on some days they collapse into sleep from sheer exhaustion. But unlike the solitary struggles of the past, we will smile and let that day descend from our dreams, arrive ahead of time — and every moment thereafter shall be —"
 tongyong_event.745607.a: "No longer alone"
 tongyong_event.95202185: "Sena Tsukiyama's Wedding"
 tongyong_event.95202185.t: "An Ordinary Moment"
 tongyong_event.95202185.d: "In that familiar apartment, she specially made him breakfast this morning. The doneness of the fried eggs, the concentration of the miso — all precisely as always. That was her conceptual-god-level 'ordinary deliciousness.' That is, until Takumi gently wrapped his arms around her from behind.\nFrom the child rejected at her aunt's doorstep, to the cautious maid of the Kanemoto household, and finally to the girl who, before him, could finally dare to cry and laugh — she had spent her entire youth confirming that she deserved to be loved.\nThe wedding had no grand ceremony, for their classmates had been kept in the dark. It was simply two families gathered around one table. She wore a simple white dress. Takumi pinned that lost-and-found hair clip back into her hair — not a new one, but the very same one, trampled by classmates and later restored by his own hands. The cracks remained, yet they had been artfully filled with silver thread into floral patterns.\nAt night, Sena suddenly remembered that feverish night years ago, when she mistook his hand for her father's and held on tightly, refusing to let go. Now, holding that same hand, the warmth coming through her palm — she could no longer tell if it was dependence or love. And there was no need to tell them apart.\nShe looked up at him, moonlight spilling across her face, and smiled softly.\n'Starting today, not a maid, but a wife. Although...' she paused, a mischievous glint in her eyes, 'I'll still do the cooking. After all, yours really only qualifies as 'ordinary deliciousness.'"
 tongyong_event.95202185.a: "From now on, we will surely live extraordinary days"
 tongyong_event.12573334: "Shizuru Masamune's Wedding"
 tongyong_event.12573334.t: "The Peacock Flies Southeast"
 tongyong_event.12573334.d: "She removes her gloves, revealing palms slightly roughened from years of gripping a sword. Then she gently places her hand into Takumi's.\nThis gesture — she had practiced it countless times, more arduous than any shogi formation, more demanding than any longsword technique. Because this hand represents not 'the Young Lady of the Masamune Family,' not 'the Chairwoman's Granddaughter' — but simply herself.\nThe wedding was held in the Masamune family's annex. The cherry blossoms had yet to bloom, but all the guests agreed: Shizuru's smile today shone brighter than cherry blossoms in full bloom.\nShinkai sat in the front row, the corners of his eyes glistening, yet stubbornly refusing to let anyone see. After the reception, he patted Takumi on the shoulder: 'You brat — you broke her cage, so you'd better take responsibility for a lifetime.'\nBefore Takumi could answer, Shizuru stood on tiptoe and answered for him: 'Yes. Responsibility for a lifetime.'\nAt night, the two returned to their little apartment — that place which once made her exclaim in shock, 'Commoners' rooms are this small?' Now every inch was stuffed with traces of them: the shogi board in the corner, the wooden sword on the wall, the frozen dumplings in the fridge she learned to buy.\nLeaning against Takumi's shoulder, she suddenly remembered something and said in the faintest voice: 'There's one thing... I never told you.'\n'Hmm?'\n'That day in the Chairwoman's office, after you defeated Grandfather, when we were alone...' She paused, her face growing slightly warm. 'I didn't accept you because you pushed me down. Before that — before you even spoke — I had already decided. Whether you were Shuri or Takumi, I was going to go with you.'\nOutside the window the moonlight flowed like silk. In his arms, for the first time, she completely relaxed her spine.\nOnce, she was the 'Daughter of the Masamune Family' expected by all. Now, she is simply Shizuru. Flat-chested, with a childish face, occasionally mispronouncing certain syllables — yet she has someone willing to listen to all her 'imperfections.'"
 tongyong_event.12573334.a: "Fly toward the blue sky"
 tongyong_event.43718388: "Hinata Kunihiro's Wedding"
 tongyong_event.43718388.t: "Finally Together"
 tongyong_event.43718388.d: "A person meets about 29.2 million people in a lifetime. The probability of two people falling in love is 0.000049.\n\nThe beginning of love may have its coincidences, but its blossoming and bearing fruit must be a unique masterpiece in this world.\n\nThinking back, from the first time these feelings were noticed, how many hardships have these two overcome? But today, all of it has blossomed and borne fruit: we have formally decided to be together, to spend the rest of our lives with each other. A wedding is already being planned. Two still-clumsy people are suddenly swept up once again in hurried days — invitations, venue, date, menu, ceremony... on some days they collapse into sleep from sheer exhaustion. But unlike the solitary struggles of the past, we will smile and let that day descend from our dreams, arrive ahead of time — and every moment thereafter shall be —"
 tongyong_event.43718388.a: "No longer alone"
 tongyong_event.75554005: "Maya Nagamitsu's Wedding"
 tongyong_event.75554005.t: "Flying Wing to Wing"
 tongyong_event.75554005.d: "The ceremony was simple. No yakuza grandeur, no Nagamitsu-gumi insignia — just a modest hall, a few of the most familiar faces, and the exchange of vows.\nAs Takumi slipped the ring onto her finger, Maya suddenly recalled the first time she saw him: he was being surrounded by everyone as Shuri, while she stood outside the crowd, face cold, just as always.\nBack then she didn't know that this 'Shuri Kanemoto' would step into her world step by step, and see everything beneath her icy exterior — the ostracized childhood, the family background she dared not mention, the idol photos hidden behind her student ID, and that longsword she never released.\n'From now on, you don't have to grip the sword alone anymore,' Takumi whispered.\nShe didn't answer. She only held his hand tighter.\nKotetsu stood in the back row, cheering the loudest. After the ceremony, he squeezed over, voice brimming with excitement: 'Young Lady! Big Bro! You're the coolest ever today!'\nReturning to their little home at night, she changed into casual clothes and brewed Takumi a cup of tea — movements still crisp, yet softened with something homely. The kitten she once rescued had grown up, lazily curled at their feet.\nSuddenly she spoke: 'When I was little, ostracized, I always thought — if only I could leave this family someday. Later, when I met you, I realized — what I needed to leave wasn't home. It was loneliness.'\nTakumi pulled her close: 'And now?'\nShe turned her head, for the first time leaning fully into his embrace, and whispered:\n'Now, wherever I am — is home.'"
 tongyong_event.75554005.a: "Where the heart finds peace, there is home"
 tongyong_event.75774954: "Ena Hirami's Wedding"
 tongyong_event.75774954.t: "A Song for You Alone"
 tongyong_event.75774954.d: "'Check the equipment — make sure all the instruments are working properly,' Eiya says to a staff member.\n'Right away — drums, guitar, keyboard are all here, mics are connected too.' The staff member reports, though for some reason, among the delivered instruments, there's no bass.\n'But we still need a sound check — it's starting soon, hurry up,' Eiya says.\n'Got it.' The staff member runs off to test the instruments.\n'Eiya... you could do the sound check yourself, why send a staff member?' You look at Eiya, slightly puzzled.\n'You idiot — who lets the bride do her own sound check at her own wedding? You two are the finale act,' Eiya retorts.\nA few days before the wedding, after band practice wrapped up, Ena sought you out specially.\n'Um... I want to add a performance before the wedding starts... a Lemon Factory performance. Is that okay?' Ena asks nervously.\n'Eh? I haven't heard about this?' You're confused — how did you, as the bassist, not know the Lemon Factory was adding a last-minute performance?\n'No, not you. Just us,' Ririko also comes over to say.\n'What do you mean?' You're thoroughly confused.\n'Let Ena-chan explain herself,' Tsukimi says with a smile.\n'Well... since the engagement... I made up my mind to write a song for you. You've helped me so much, helped me realize my dream of music, helped me sing joyfully in the Lemon Factory... it's all thanks to you. So, so! I want to write a song for you. Just like before, when I wrote a song for my mother to express my feelings — I want to write a new song for you too... because you're special.' Ena pours out all the feelings accumulated over the time she spent writing this song.\n'...I understand. I believe in you, Ena.' You pat Ena on the head.\n...\nNow at the wedding venue, you watch as your Lemon Factory companions tune their instruments — and you sit in the audience. This is an experience you've never had. You've always been the one standing on stage, playing alongside your friends. Now, you sit in the audience watching them perform — and you are the most important audience member of this performance.\nEna, in her wedding dress, stands on stage holding a guitar. The sight feels slightly surreal — but it's also a special performance costume, just for you.\n'Hello everyone! You might think it's strange — a wedding that's staged like a band concert. And you'd be right. Today's wedding does feature a song performance — and this song is dedicated to the person I love most... that is, today's groom.'\n'Without your support... I would never have made it this far, and we could never have promised each other forever... entrusted our lives to one another. So... all I want to say is — I love you.' Ena speaks into the microphone, looking at you from the stage. You know Ena probably means every word from the heart — but saying all this into a microphone in front of everyone at the wedding still makes your face flush.\n'Well then... next... is the new song I wrote for you. Its title is: Love, Like a Gentle Breeze.'\nYou recall how the song Ena wrote for her mother before was called 'Like Warm Sunshine.' And today, the song she wrote for you is just like that one — Ena pouring her feelings into the music.\nWatching Ena perform on stage, listening to lyrics infused with all her emotions, you can no longer hold back.\nAfter the performance ends, you walk onto the stage and embrace Ena.\n'This song... will only be performed this once, right?' You hold Ena and ask.\nHearing this, Ena's face breaks into a smile as she says:\n'Of course... this is... a song that belongs only to you.'"
 tongyong_event.75774954.a: "My heart only wishes yours were the same — I shall never betray this love"
 tongyong_event.11722289: "Anju Kakure's Wedding"
 tongyong_event.11722289.d: "'What do I do, what do I do, I'm so nervous... Am I really going to do something this embarrassing in front of so many people?' Anju mutters to herself, then looks up at your face and asks.\n'What are you talking about? Wedding vows are perfectly normal, aren't they? How is that 'doing something embarrassing in front of people'?' You're somewhat puzzled by what Anju is nervous about.\n'Eh! But! Look — we have to swear in front of everyone that we'll be together forever, love each other forever... just thinking about it... so embarrassing!' Anju starts blushing just from the thought.\n'It's fine — think of it as a Lemon Factory show. We've performed together so many times. Are you really scared of this?' You soothe Anju's nervous heart.\n'That's... wait, that's not the same thing at all! A show is a show — but this is a wedding... once in a lifetime... of course I'd be nervous!' Anju looks at you with a bit of dissatisfaction. She caught your rhetorical sleight of hand.\n'Then... think about feelings beyond nervousness. Surely it's not only nervousness you feel, right Anju?'\n'Of course not. I'm also thrilled and excited. Being able to walk toward the altar together with the one I love — I'm truly so happy.' At this, Anju suddenly gets worked up, her earlier nervousness completely gone.\n'So — walk boldly forward. Just like that time at the concert when you threw away your pick and started an impromptu slap bass performance.' You extend your right hand to Anju.\nAnju looks at your outstretched hand, hesitates for a moment, then takes it.\n'As long as I'm with you... holding your hand... I won't be so nervous anymore.' A smile blooms on Anju's face.\n'Of course — I have no intention of letting go. I told Anju before — I want to hold concerts together with Kakure-san forever.' You bring up something you once said to Anju.\n'Ah, seriously... bringing up old words now...' Anju blushes slightly, but immediately adds: 'My answer will only be the same as before. I don't plan on leaving you either.'\n'Then those words from before — you'll keep that promise from now on, right?' You say with a smile.\n'Of course! From now on, always, always — we'll be together.' Anju laughs too.\nSmiling, you take Anju's hand and walk forward together. At the moment you step toward the ceremony hall, the two of you exchange a knowing smile. You know that no matter how long the road ahead, you will be by Anju's side, guarding her from the closest place, walking alongside her — because you are no longer just Anju's lover. Your relationship will enter a new phase starting today."
 tongyong_event.11722289.t: "May we be of one heart, never parted until our hair turns white"
 tongyong_event.11722289.a: "Angelica grows by the Yuan, thoroughwort by the Li — longing for you, my lord, I dare not speak"
 tongyong_event.36732743: "Tsukimi Shimakoshi's Wedding"
 tongyong_event.36732743.t: "Knowing the Heart Through Music"
 tongyong_event.36732743.d: "A blonde girl plays the piano gracefully on stage. Not many musicians can hold a solo recital — but the girl on stage is one of them.\nYou sit in the audience, listening to her performance. The woman beside you is also an acquaintance — in fact, she is the one who invited you to this concert.\n'Mother-in-law... does Tsukimi know I'm here?'\n'Ohoho... of course she doesn't. She's been touring Europe recently, and I was worried she might be tired, so I contacted you and brought you from Japan to Paris.' Tsukimi's mother says with a smile.\n'It's fine, Mother-in-law, you don't need to worry. She's not especially tired.' You reassure Tsukimi's mother. Tsukimi's condition isn't bad — there's no need for concern.\n'Oh? How do you know?' Tsukimi's mother is a bit puzzled.\n'It's in Tsukimi's timbre... she's still immersed in the performance, not yet drawn taut to the breaking point.' You listen to Tsukimi's piano piece and say.\n'That's good, then... But still... the two of you can understand each other just through music... When you told me before to entrust Tsukimi to you, I didn't quite understand... but now... hehe, you are quite reassuring. Tsukimi hasn't married beneath her at all.' Her mother says.\nBut just then, Tsukimi's performance ends. Thunderous applause erupts through the concert hall.\n'Alright — the performance is over. Tsukimi... must really want to see you. I'll go get the car started. Just bring Tsukimi along and get in.' Tsukimi's mother smiles, then departs — clearly leaving the two of you space on purpose.\n'Tsukimi.' After the performance, you walk to the front of the stage. You had planned to wait until she changed out of her costume backstage — but the moment Tsukimi sees you, she rushes down and throws herself into your arms.\n'Tsukimi! Be careful — what if you fell?' You catch Tsukimi. She buries her head against your chest.\n'Why didn't you tell me you were coming... you meanie.' Tsukimi nuzzles her head against your chest. You place your hand on the back of her head, gently stroking.\n'Your mother said she wanted to surprise you...'\n'Tch. Mom's a meanie, and so are you.' Tsukimi pouts cutely.\n'Well then... maybe I should've just not come.'\n'No! Do you know how much I missed you! Every time I arrive at a new tour stop and get off the train, I hope I'll see you there... even though I know it's impossible, I still hope...' Tsukimi says.\n'And now I've appeared,' you say with a smile.\n'Yeah... you really answered my wish... Tour... competitions... I don't care about any of it. I only wanted to see you.'\n'Alright, alright — go get changed. Your mother's waiting outside.'\n'Okay. But after I come out — you're not allowed to disappear.' Tsukimi lets go of you somewhat reluctantly.\n'I won't disappear. I'll be waiting for you the whole time.'\nA smile blooms on Tsukimi's face. She gives you a light kiss on the cheek, then scurries off to the backstage.\nAlthough in European culture a kiss on the cheek is perfectly normal, after Tsukimi runs off she suddenly realizes this — and scampers back to give you a light kiss on the lips, then runs off again.\nYou stand in place, watching Tsukimi's retreating figure, and can't help but marvel inwardly:\n「From now on, as long as I have Tsukimi by my side, that's enough.」\nThese were words Tsukimi once said — and now you fully agree."
 tongyong_event.36732743.a: "A single wrong note moves my heart — following you, ten thousand melodies send dust flying from the rafters"
 tongyong_event.9782093: "Ririko's Wedding"
 tongyong_event.9782093.t: "The Childhood Friend's Great Victory"
 tongyong_event.9782093.d: "This morning, you wake up early as usual. Next on the agenda — head to Ririko's house to wake her up, just like always. Your childhood friend can't even manage to get out of bed without you.\nThinking this, you shake your head and set off on the familiar path to Ririko's house.\nYou unlock Ririko's door with your key, about to head upstairs to wake her — when suddenly your eyes are drawn to a red figure seated at the dressing table.\n'Today you actually woke up without me calling you,' you say with a smile.\n'Just what do you take me for? What kind of person oversleeps on the morning of their own wedding?' Ririko says, very displeased.\n'Well, since you always need me to wake you up, I figured today would be the same.'\n'Honestly... if I'd known you'd be like this, I wouldn't have given you the key. Who picks up their bride like this? I should've locked you outside.' Ririko pouts, sounding a bit angry.\n'You didn't give me the key recently — you gave it to me ages ago.'\n'Tch. This is the problem with childhood friends. No — go back out and come in again properly, or I'll report you for unlawful entry.' Ririko is dissatisfied with your bride-fetching attitude.\n'Who gives up and goes back empty-handed when picking up their bride? You're right in front of me — there's no way I'm leaving.' You grin mischievously and step closer to Ririko.\nSuddenly you crouch down, wrap your arms around Ririko's back and legs, and lift her in a princess carry.\n'You will always be my princess. I won't let go of you,' you whisper into the ear of Ririko cradled in your arms. Ririko's cheeks flush slightly. She doesn't respond for a moment.\n'See, see? I told you — those two won't give us any chance to mess with them,' Eiya says from the doorway. The rest of the band is gathered there too.\n'What are you all doing here?'\n'Tsukimi said this is the moment when the bride's best friends need to be by her side to give the groom trouble... so we came,' Ena says.\n'Give me trouble — Tsukimi, what kind of weird stuff have you been reading?' You retort. The blonde girl just sticks out her tongue.\n'Wait! Put Ririko down first!' Anju suddenly says.\n'Huh? Why?'\n'Put her down,' Anju says.\nYou set Ririko on the ground, and suddenly — a flash. Tsukimi has captured the moment: you, down on one knee before Ririko.\n'Got it — a photo even more meaningful than wedding portraits,' Tsukimi says with a smile.\n'Well then!' Eiya clears his throat and pauses.\n'Congratulations on your marriage!' The four shout together.\nYes — starting today, Ririko is your wife. Realizing this, you can't help but take Ririko's hand.\n「From now on, forever... forever — please take care of me...!」"
 tongyong_event.9782093.a: "Hand in hand, growing old together"
 tongyong_event.47496112: "Miku Sekikawa's Wedding"
 tongyong_event.47496112.t: "Birds of a Feather"
 tongyong_event.47496112.d: "Standing at the entrance of the ceremony hall, your heart is filled with unease. The white-haired girl in her wedding dress gently takes your hand.\n'Don't be nervous — it's the first time for both of us,' Miku says with a smile.\n'Yeah, yeah — don't be nervous!' Jey slaps your left shoulder.\n'Right — what a happy day! You and Miku are finally getting married. How could we not be happy?' Yuma slaps your right shoulder.\n'You two are exactly why I'm uneasy! What on earth did you two arrange for this wedding?! Why do I have to perform with your band?!' You retort.\n'You're marrying into our family, so of course you've gotta join our band,' Yuma says.\n'I already have my own band! I'm in the Lemon Factory!'\n'Alright, alright — just kidding. If you perform with us once, that'll prove you're one of us,' Jey says.\n'But still...' You want to complain more, but Miku tugs your hand.\n'Come on — you're marrying me, not these two idiots. Why care so much about what they think?' Miku says with a smile.\n'Our little sister's already taking sides before she's even married off!' Yuma clutches his chest in an exaggerated show of heartache.\n'It's precisely because you two always bully him that I have to be on his side. Otherwise he'd get bullied by you every day,' Miku says to her two brothers.\n'Thank you, Miku...' You cup Miku's hand in both of yours.\n'Well... my two idiot brothers... are probably the ones who'll need you to look after them more in the future. Please bear with them,' Miku says with a smile.\n'Miku! That's how you see your brothers... we're heartbroken...' Jey says.\n'Tch, heartbroken? Today's main characters aren't you — nobody cares about you two.' Miku mercilessly roasts her brothers. Perhaps this is what real sibling interaction looks like.\n'Okay, ignore them. Let's go,' Miku pulls your hand and walks into the hall.\n'Miku...' You call her name.\n'What is it?' Miku turns to look at you.\nYou gaze at the wedding hall you're about to enter, glance back at the two goofy brothers-in-law, and then grip Miku's hand tight.\n'From now on... we'll always be together, right?' You say.\n'Yeah — always, always together. Why are you asking that?' Miku tilts her head, slightly puzzled.\n'So... our relationship has taken the next step. Then... the promises from before — they'll carry on into the future too, right?'\n「No matter what happens, my bond with Miku will never waver.」\n'Yeah... haha... from now on, please take care of me,' Miku beams brilliantly."
 tongyong_event.47496112.a: "Hardest is the parting moment — returning home, too weary to approach the dressing table"
 tongyong_event.73719949: "Nayuka Chaen's Wedding"
 tongyong_event.73719949.t: "Recharging (No Innuendo)"
 tongyong_event.73719949.d: "'So annoying, so annoying, so annoying, so annoying... why are there so many demands!' Nayuka curses at the computer screen.\n'What's wrong?' You walk over to Nayuka with concern.\n'Clients are the most detestable creatures in this world! The most detestable! I spent three days writing this track — thirty hours straight without sleep! I send it to the client, and they say it 'lacks a bit of Sayuta's feel'... What does 'lacking Sayuta's feel' even mean?! When Sayuta herself writes it, it still lacks Sayuta's feel?!' Nayuka vents about the client.\n'Ah... but haven't quite a few people already accepted your new style?' You ask.\n'Yeah... after I personally experienced falling in love, I was able to understand that feeling of wanting to express romantic emotions but still being a bit shy and green. A lot of my recent compositions have been that kind of lighter, more upbeat stuff.' Nayuka reflects on how she's changed recently, looking at you as she speaks.\n'That... is all because of you. You single-handedly changed my musical style. You have to take responsibility,' Nayuka says with a smile.\n'Hmm, so in your words, I've had a pretty big influence on your composing work?'\n'Of course. You... let me experience what love feels like, so I could understand romantic emotions. So... you need to take responsibility for all the listeners who aren't used to my new style yet.' Nayuka rises from her computer desk and walks toward you.\n'How do I take responsibility?' You look into Nayuka's eyes and ask.\n'The way, of course... is to let more people know just how sweet romantic love can be~ Just like right now~' Nayuka presses close, clinging tightly to you.\n'Hey, I just got disgusted by a client — you're not going to refuse me, right?' Nayuka seizes the chance to emotionally blackmail you.\nYou know this is Nayuka wanting to change her mood — and the only person who can do that is the one who understands her best. You gently stroke Nayuka's head, soothing her frustration with work.\n'That's right~ Those guys don't understand the beauty of love and hold prejudices against love songs, thinking they're too cliché... Thanks to you, my understanding of music has deepened, and I can write even better pieces now... Of course, the biggest gain is...'\nNayuka pauses mid-sentence.\n'Being able to always, always be by your side, to be spoiled in your arms. As long as I know I have you by my side, my heart can settle.' Nayuka's embrace suddenly tightens.\n'Thank you — for always being with me,' Nayuka says.\n'I will be, from now on too. No matter what troubles you face, I'll be by your side. After all... I said it before,' you gaze at Nayuka in your arms, unable to resist holding her tighter.\n「The person who stands beside Nayuka — I won't yield that place to anyone.」"
 tongyong_event.73719949.a: "In the courtyard, a jade-pure beauty emerges from her fresh bath and makeup"
 tongyong_event.65171977: "Luoyi's Wedding"
 tongyong_event.65171977.t: "Hoshizora no Memoria"
 tongyong_event.65171977.d: "In the night sky, the beautiful Summer Triangle hangs high above. Beneath the starlight, two figures nestle close together. Luoyi loves the night, loves the summer night sky, loves Orihime and Hikoboshi, and Deneb beside them. The seventh of July is a beautiful legend — two lovers crossing the obstacle of the Milky Way to reunite. The two beneath the starry sky are the same, crossing countless difficulties to finally pledge their vows, like the celestial lovers.\n'Falling for someone as troublesome as me... tonight, you really are being silly.'\nHow long did it take to reach this point? It feels long, yet also short. Beneath this very Milky Way where Orihime and Hikoboshi reunite, together with her, they forge a vow spanning a thousand light-years."
 tongyong_event.65171977.a: "Eternal Heart"
 kotori_event.1: "Kotori Awakens"
 kotori_event.1.t: "Kotori Awakens"
 kotori_event.1.d: "Through Mayu's repeated Astral ability experiments, the Yuzu Research Institute has entered a new phase of understanding regarding Astral powers.\nOur understanding of Astral abilities has now reached the point where we can control Astral users suffering from rampages.\nAyase and Mayu make preparations before the isolation chamber, faces solemn, awaiting the results of the experiment.\nThe purple-haired girl inside the isolation chamber slowly opens her eyes. Ayase and Mayu rush forward excitedly.\n'Big sister!'\n'Kotori!'\nThe newly awakened Kotori sees two people lunging at her and hasn't quite processed what's happening yet.\n'Eh? Ehh? Ayase... Mayu...? Eh? Ayase? How come... you seem bigger? Especially your chest... what's going on? How did they get so big? What happened here — am I... dreaming?' Kotori looks at the two of them in confusion, not understanding what's going on. But at the very least, the reality before her doesn't match her memories. Her first instinct is that this isn't real.\n'It's not a dream — it's not a dream! Don't fall asleep again!' Flatboard (strikethrough) Ayase says urgently.\n'Kotori... you're finally awake!' Mayu embraces Kotori.\n...\nKotori's ability is wind control. She once triggered a violent windstorm during a rampage, making her effective at blocking enemy air support.\nAfter awakening, Kotori quickly recovered her physical functions with Ayase and Mayu's help, and also joined the Yuzu General Staff."
 kotori_event.1.a: "「Welcome back, Kotori」"
