 #General Descriptions
 makoto_desc: "Shuri's classmate, studying at Rokurou Academy with the goal of becoming a fashion designer.\nBefore Takumi began making friends in class while posing as Shuri, Makoto was one of Shuri's few friends.\nThough she is the young lady of a famous company, she doesn't behave like a proper young lady at school and often enjoys telling dirty jokes.\nShe frequently designs and sells her own accessories, though usually not for the sake of profit.\nShe places great value on friendship and is very enthusiastic toward her friends."
 minamoto_desc: "Chiaki is a maid who can do almost anything — so what exactly can she do?\nInterrogation and questioning, in-depth target investigation, mind reading, covert bodyguard protection (in the Shizuru route, she also cooperates with Masamune family bodyguards to protect Takumi and Shizuru during outings), target surveillance, rotating people's heads a number of degrees (in-game depicted as the screen literally rotating), assisting Ikaruga with group affairs, longsword combat, martial arts, formal etiquette instruction, ballroom dancing, academic tutoring, firearms and weapons usage, exhibition setup and personnel/equipment coordination, detailed intelligence mastery of other conglomerates, managing the Kanemoto Annex, and so on...\nWhy does a maid possess so many skills? Because she is a first-class maid."
 miyako_desc: "Second-year student at Hakusen Academy. The young lady of a world-famous corporation, a refined and lovely beauty. Fundamentally a responsible person, though occasionally a bit absent-minded, she is popular with both boys and girls.\nThough she's what you'd call a rich young lady, her personal sense of money is overwhelmingly frugal and down-to-earth. She deeply trusts Kakeru, whose way of thinking differs from her honor-student self, and sometimes reveals a mischievous side when she's with him. She works part-time at her grandfather's café for life experience.\nUpon obtaining a mysterious artifact, she awakened to supernatural powers and, driven by her strong innate sense of justice, set out to resolve the incidents."
 yuuki_noa_desc: "Second-year student at Kugata Girls' Academy. A girl who loves parfaits and possesses a sense of justice stronger than anyone.\nShe is the leader of the organization 'Valhalla Society' founded by Noa, and Kakeru and the others have been unilaterally counted among its members."
 sora_desc: "First-year student at Hakusen Academy. Kakeru's innocent and cheerful little sister, sociable by nature and able to get along with anyone quickly. She freely lets herself into her brother's apartment where he lives alone, eating snacks and playing games as she pleases. She always seems energetic, but is actually bad with scary things.\nHaving obtained a mysterious artifact and thinking it seemed interesting, she decided to cooperate with her brother and Miyako."
 haruka_desc: "Third-year student at Hakusen Academy. Kakeru's senpai, possessing two personalities — a timid and quiet one, and a bold, fearless, queen-like one. She is always alone at school, but it's not that her classmates dislike her — she's recognized as a 'weird girl' who doesn't speak much.\nShe's actually quite an otaku, with tastes ranging widely from shoujo manga to seinen manga, and owns every manga that Kakeru has."
 honoka_desc: "The protagonist's classmate, a cheerful girl belonging to the newspaper club of Minarai Academy.\nShe gets along very well with Aoi and they're often together.\nAlways full of energy, but also the class troublemaker."
 wataru_desc: "Aoi Yamabuki's older sister, currently working as the manager of Robin, the café run by Shinichirou Chitose. When she's away, Aoi covers her shifts at Robin.\nShe often carries snacks on her person and gives them to children who come to the café with their parents. Over time, some children started coming to the café specifically to get snacks from Wataru. If Wataru had never given Ruri umaibō, Ruri would never have become so fanatical about it as to invent umaibō rice bowl, and Sana wouldn't have eaten it until she threw up. lol.\nShe and Haruki's homeroom teacher, Yukari Karasuba, have been classmates since middle school and both attended Minarai Academy together.\nShe is very sensitive about people directly or indirectly mentioning things related to her age.\nYukari revealed that Wataru seduced an associate professor during university to get exam questions — but Wataru's version is that the professor confessed to her and told her the questions on his own.\nShe's a gossip when it comes to romance, especially curious about Haruki and Aoi's relationship, constantly asking questions.\nShe knows about Yukari's past with her brother, so she sometimes worries about Yukari. When Yukari wants to smoke, she will stop her."
 nanao_desc: "The owner of the café where Wakana Kariya works part-time. Contrary to her appearance, she has a calm and composed disposition. Her true form is a female black cat, known as an 'Elp' (Marei) — she collects Heart Fragments by forming contracts with others and fulfilling their wishes, her goal being to become human."
 akagi_desc: "One of the Elps appearing in this work. Her true form is a crow, specifically a raven.\nShe has a verbal tic of appending 'noja' to the end of her sentences, which led Tohji to nickname her 'Noja Loli.'\nShe has held contracts with the witches Tsumugi Shiba and Chiho Kizuki — Akagi contracted with Chiho while still under contract with Tsumugi.\nBecause her true form is a crow, sitting in seiza when Tsumugi scolds her is genuinely painful.\nShe absolutely loves the chicken meatballs Tsumugi makes.\nElps engage in territorial disputes, so during her contract with Chiho, Akagi had some territorial run-ins with Nanao Souma in Chiho's vicinity.\nShe dislikes following Elp rules, so she sometimes does things that leave Nanao somewhat exasperated.\nThe official Chinese version initially translated her name as 'Akagi' but revised it to 'Akagi' in a subsequent patch."
 kotarou_desc: "The protagonist's childhood friend and the heir to the local shrine.\nThough they're in different classes at school, they've known each other a long time and are good friends.\nHis grades aren't bad, but he has a sharp tongue and a somewhat questionable lifestyle.\nAs a child he had strong spiritual sensitivity, and even now that his power has weakened, he can still sense the presence of otherworldly things."
 itsukishishishihimenomikoto_desc_commander: "A goddess who purifies impurity. Unlike Sakuyahime Unohana who governs the land, she gathers and purifies the impurities scattered across the land to prevent great calamities. She was awakened from a long slumber thanks to Haruki Chitose.\nShe has a lazy and reclusive personality but does her job thoroughly. She gets a bit excited by punishment and has a somewhat M side (she herself claims to be a total masochist).\nShe leaves all household chores to her attendant, Suou."


