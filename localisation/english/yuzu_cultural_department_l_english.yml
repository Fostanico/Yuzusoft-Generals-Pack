#开始决议
 yuzu_cultural_department_category: "Y.U.Z.U.S.O.F.T."
 yuzu_cultural_department_category_desc: " "
 yuzu_cultural_department_category_gui_desc: "§CYouth United Zone for Universal Synergy of Original Folklore & Traditions§!,\nour Global Youth Commune for Yuzu Cultural Innovation brings spirited young people together to dream up fresh ways to celebrate everything great about Yuzusoft!\nOur advanced culture can transform our §Rsubjects§! into §CLands of Yuzu Fans§!, filled with Yuzu fans. To spread this culture without breaking the bank, we can download the Four Great Yuzusoft Classics from a cloud drive—although a certain service may take a while, and §Ra Yuzu Cloud Super Membership will make it much faster§!.\nSpreading Yuzu culture also costs Yuzu Gold. We currently have [?Yuzu_fund|.0+Y] Yuzu Gold.\nOur Cultural Department can also apply suitable occupation laws in our colonial territories. Its staff will handle everything automatically, provided we pay them in Yuzu Gold."
 form_yuzu_fans_land: "Distribute Yuzusoft Games for Free in [FROM.GetName]"
 form_yuzu_fans_land_desc: "You are right, but Senren＊Banka is a bishōjo adventure game published by Yuzusoft. The game is set in a secluded paradise known as Hoori, where those chosen by the sword in the stone are granted Murasamemaru and channel the power of the ancient gods. You play a man named Arichi Masaomi, returning home to visit family. In town, you meet a cast of girls with distinct personalities and unique abilities, join them to defeat the tatarigami and recover the scattered crystal shards—and, along the way, uncover the truth behind the Tomotake family curse."
 yuzu_fans_land_ide: "The Finest Yuzu Fans"
 yuzu_fans_land_ide_desc: "People who have played Yuzusoft games for years have bright, focused eyes, boundless confidence, and ever-rising intelligence, until at last they become true geniuses. Playing Yuzusoft games reshapes the body and wards off every incurable disease. Anyone who starts playing them has already proven that their wisdom, character, and looks are all first-rate, and will carry themselves with distinction wherever they go. Yuzu fans possess an exceptionally strong sense of social justice, make an immense contribution to public order, and protect the lives of ordinary people."
 autonomy_yuzu_fans_land: "Land of Yuzu Fans"
 #autonomy_yuzu_fans_land_desc: ""
 unite_yuzu_fans_together: "Call on the People of [FROM.GetName] to Become the Finest Yuzu Fans"
 unite_yuzu_fans_together_desc: "Our great nation rejoices as one! Our shared love of Yuzusoft binds us ever more closely together! Friends in other nations, answer the glorious call to play Yuzusoft games!"
 show_yuzu_culture_department: "Show the Yuzu Cultural Department"
 hide_yuzu_culture_department: "Hide the Yuzu Cultural Department (you can reopen it from the Inner Circle decisions)"
 hide_yuzu_culture_department_desc: "This can be reopened from the Inner Circle"
 autonomy_no_more_close_economy_tt: "Subjects using Closed Economy or Limited Exports will switch to Export Focus"
 Yuzu_has_fund_available_tt: "We have Yuzu Gold available"
 Yuzu_fund_subtract_tt: "Spend one Yuzu Gold to spread Yuzu culture in [FROM.GetName]"
