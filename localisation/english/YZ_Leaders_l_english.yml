 # 朝武芳乃
 SZDWN: "Shrine Maiden of Hoori"
 SZRM: "The Great Shrine Maiden of Hoori's People"
 chaowufangnai_desc: "No time to mourn the old geezer who was just forced into retirement — charging onto the battlefield now is... your very own Suizong! Lady Yoshino of the Tomotake family! Huh? You say the neighbors have a Suizong too? No, no, no — that reincarnated corn cob can't hold a candle to our shrine maiden. Yoshino is called Suizong because she is the shrine maiden of Hoori, far superior to that corn spirit. Though handling every matter personally would keep Lady Yoshino too busy, becoming your right hand and lending you a hand is absolutely no problem. You ask how? Yoshino is great — no explanation needed. Anyone who objects will be dragged out and executed by 155mm howitzer for an hour. Please accept my buff! (bows)"
 cwfn_event.1: "The Arrival of Tomotake Yoshino"
 cwfn_event.1.t: "The Arrival of Tomotake Yoshino"
 cwfn_event.1.d: "After resolving the curse that plagued the Tomotake family for generations, Tomotake Yoshino now stands before us in a brand-new form. But what comes next..."
 cwfn_event.1.a: "A Bright Future for the People"
 cwfn_event.2.a: "Beacon of Freedom and Democracy"
 cwfn_event.3.a: "A Special Path?"
 cwfn_event.4.a: "With Yoshino at the Core"
