 # 零奶
 gtzr: "Man of Steel"
 lsly: "Commander Ayase, Ever Healthy"
 oppz: "Bust Obsession"
 linglai: "Mitsukasa Ayase"
 linglai_desc: "No time to mourn the old geezer who was just forced into retirement — charging onto the battlefield now is... the campus's popular idol, the little hero with astral ability, the natural enemy of cats, the master of bust-enhancement theory, Mitsukasa Zero-bust... I mean, Lady Ayase! ...Let's get a new announcer, meow — the last one was dragged off and executed by artillery. As student council president, Ayase already handles a myriad of affairs daily; this little extra workload is nothing to her. As an existence that causes supply shortages wherever she goes, enjoy the boundless enthusiasm of her rabid fans. Oh, and by the way, if you want to buy her off, a free cat-café coupon works — a seven-day one works wonders."
 linglai_event.1: "Mitsukasa Ayase's Visit"
 linglai_event.1.t: "Mitsukasa Ayase's Visit"
 linglai_event.1.d: "After a fierce showdown with Kakimoto Kaori, Ayase now stands before us in a brand-new form (with chest padding). But what comes next....."
 linglai_event.1.a: "Liberation, Sharing, Unity"
 linglai_event.2.a: "Liberty, Equality, Fraternity"
 linglai_event.3.a: "Labor, Fatherland, Family"
 linglai_event.4.a: "Order, Obedience, Efficiency"
 # 美羽
 MY: "Sword and Shield of the Onmyo Bureau"
 meiyu: "Yarai Miu"
 miu_desc: "In the silent pitch-black night, the moon sways and glimmers, its moonlight eerie and strange. Having taken up this scepter called power from her predecessor, she must protect order. In the past, she had many things to handle. Now, she has even more. But she will not look away — she will make her decisions coolly, like an adult. Waves crash against the shore; stars hang high in the sky, their dazzling light seeming to devour everything. New crises rush toward her one after another. She knows she must guard her own heart and protect everything around her.\n\nHer heartbeat will not settle, but this time is different — she wishes for her own well-being...\n\nThough she cannot be honest\n\nThough pain drives and tugs at her\n\nThough she doesn't know when she'll get used to it\n\nShe believes she can make her decisions calmly."
 miu_event.1: "Yarai Miu's Visit"
 miu_event.1.t: "Yarai Miu's Visit"
 miu_event.1.d: "After settling the complicated affairs of Aqua Eden, Miu began to think about leaving and seeing the world. And so she stepped across the shackles of systems and timelines\n\nto arrive here."
 miu_event.1.a: "Liberation, Sharing, Unity"
 miu_event.2.a: "Liberty, Equality, Fraternity"
 miu_event.3.a: "Labor, Fatherland, Family"
 miu_event.4.a: "Order, Obedience, Efficiency"
 #宁宁
 CZRYJZ: "Head of the Paranormal Research Club"
 zhifuningning: "Ayachi Nene"
 monvningning: "Ayachi Nene"
 ningning_desc: "No time to mourn the old geezer who was just forced into retirement — charging onto the battlefield now is — the one who wields the detonator, holds life-and-death power over the room, beautiful and gentle in equal measure, the embodiment of wisdom and kindness, Ayachi Nene! She even brought two sets of clothes — though one of them she really doesn't want to wear. You say bullying Nene is fun? Yes, my dear friend, I think so too — but then calming her down and getting her back to work becomes my job! You can't be so heartless, my friend! ...Oh no, her face has darkened again. I'll be back after I cheer her up. See you later."
 ningning_event.5.t: "Ayachi Nene's Visit"
 ningning_event.4.t: "Ayachi Nene's Visit"
 ningning_event.4.d: "Ayachi Nene has come from afar to assist your work, and her paranormal research has made new progress. So what comes next....."
 ningning_event.5.d: "Ayachi Nene has come from afar to assist your work, and her paranormal research has made new progress. So what comes next....."
 ningning_event.4.a: "Science is the Primary Productive Force!"
 ningning_event.2.a: "Free Exploration, Steady Development"
 ningning_event.3.a: "A Special Positive Philosophy"
 ningning_event.6.a: "Anyone who opposes Nene gets their head bashed in!"
 ningning_event.2.t: "A Change of Clothes?"
 ningning_event.2.d: "A Change of Clothes?"
 ningning_event.2.Z: "Witch-Outfit Nene"
 ningning_event.2.X: "Uniform Nene"
 ningning_event.5.a: "Science is the Primary Productive Force!"
 ningning_event.7.a: "Free Exploration, Steady Development"
 ningning_event.8.a: "A Special Positive Philosophy"
 ningning_event.9.a: "Anyone who opposes Nene gets their head bashed in!"
 #最高柚维埃
 JLYM: "Strict Discipline"
 RMZL: "Power of the People"
 yzrmwyh: "Supreme Yuzu Soviet"
 yzrmwyh_desc: "Firm in faith, red-hearted Yuzu\n\n\"To be more responsible for the people's future, everyone decided to use democratic centralism for decision-making — after all, matters of state cannot afford mistakes. Based on past experience, a personality cult is hardly a safe bet...\n\nTo truly realize communism and democratic centralism, and to thoroughly eradicate stubborn ills such as personality cults and factionalism, the Yuzu girls drew lessons from the history of socialist construction in various countries and from Stalin's unfinished party democratization, and established the Supreme Yuzu Soviet. We strive for the goal of realizing communism.\"\n\nThe thousand-year Yuzu shall bloom. Under the leadership of the Yuzu Soviet, we will surely keep to the path of struggle and revolution. Together with the proletarians of the world, we will raise a storm and carry the revolution through to the end! Let demons and vampires tremble before us! The proletarians have nothing to lose but their chains. They have a world to win. Comrade, revolution!"
 yzrmwyh_event.1.t: "Establish the Supreme Yuzu Soviet"
 yzrmwyh_event.1.d: "After a great debate, our country has unanimously decided to establish the Supreme Yuzu Soviet, using this form to exercise power on behalf of all the people."
 yzrmwyh_event.1.a: "History Will Be Written by the People!"
 #柚子国会
 KZB: "Science, Liberty, Fraternity"
 yzgh: "Yuzu Club"
 yzgh_desc: "Science, liberty, fraternity\n\n\"As we've said, every single Yuzu is outstanding — the cream of the crop. Standing among the masses, they tower above the crowd like cranes among chickens. As for democracy and freedom, we Yuzu will handle that for you.\"\n\nThe world is growing dangerous. The tyrants consumed by greed remain unsatisfied after concession after concession. Our home is threatened, and democratic principles are being trampled. To defend our freedom, the people must unite against the strong enemy. To that end, it is necessary to grant Yuzusoft's members emergency powers in wartime to form a cabinet, protecting the country from the threats of authoritarianism, extremism, and totalitarianism. Not only for our right to exist, but for the people living under the oppression of tyrants! Let our slogan of science, liberty, and fraternity no longer be an empty slogan!"
 yzgh_event.1.t: "Establish the Yuzu Club"
 yzgh_event.1.d: "After a vote by the parliamentarians, our country will establish the Yuzu Club from today."
 yzgh_event.1.a: "The Age of Democracy and Freedom Has Arrived!"
 #大柚子军政府
 JGYT: "Military-State Unity"
 yzjzf: "Grand Yuzu Military Government"
 yzjzf_desc: "\"Keep a close eye on market changes, study market trends, seize customer pain points, and develop and iterate new tactics. In plain words: tomorrow, go to the beer hall and give a speech about bread prices, watch the expressions of the people below, and if it feels right, make your move... Fine, fine, we know, we know.\"\n\nThis is a living ideology. It advances with our generation, and it will be renewed by the next. The black flame will not die out — it is eternal. It will not be replaced or denied by the future, because it is the future. It is the path that can truly guide the motherland toward its destiny! The leaders of the Yuzu Military Government built a grand committee capable of achieving national rejuvenation on D'Annunzio's theories, beginning their own great adventure!\n\nThe Black Sun has risen — let our enemies kneel at our feet!"
 yzjzf_event.1.t: "Establish the Grand Yuzu Military Government"
 yzjzf_event.1.d: "Let a wiser team become our mainstay"
 yzjzf_event.1.a: "Yuzu Fan Power Above All!"
 #柚子皇家议会
 ZXZS: "Order Above All"
 yzyh: "Yuzu Royal Council"
 yzyh_desc: "Elite Yuzu, graceful demeanor\n\nAUV, look at what you're saying — our Yuzu Royal Council has to be authentic first and foremost; if it's not authentic, can it even be called royal? Hey, as you say, which one of our Yuzu isn't the cream of the crop?\n\n(The clever P-snake puts everything into Neutral — we really have nothing left.)"
 yzyh_event.1.t: "Establish the Yuzu Royal Council"
 yzyh_event.1.d: "A council of elites is the perfect system!"
 yzyh_event.1.a: "Long Live the Motherland!"
 # 幼刀
 SZDDL: "Sword Spirit of Hoori"
 XFJC: "Little Airport"
 murasame: "Murasame (Aya)"
 murasame_desc: "No time to mourn the old geezer who was just forced into retirement — charging onto the battlefield now is... the ultra-popular green-haired loli, five hundred in nominal age, eighteen in reality; keeper of the sword in the stone, little sun of Hoori; heart full of love for her elders, chest as flat as a steel plate — little Aya! As the one whose kindness all of Hoori can never repay, little Aya has always wanted to live a normal life. Now the chance for change has come — let's kick her into an even more abnormal life together! Papers that never end, meetings that never end, arguments that never end, wars that never end — but how can you bear to let such a little airport handle all of this? Why not come right now and fish her out of the paperwork pile? Come, let's recite it once more: Aya's kindness can never be repaid! And... Loy! Alty!"
 murasame_event.1: "Little Murasame has regained her physical body, and everyone is pushing to make her our new leader!"
 murasame_event.1.t: "Push Little Aya to Be Leader"
 murasame_event.1.d: "Everyone hurriedly pushed the reluctant Murasame into the leader's seat. What comes next......."
 murasame_event.1.a: "The Red Sword Spirit Leads Us to Break Our Chains"
 murasame_event.2.a: "Our Democracy and Freedom Are Rock-Solid"
 murasame_event.3.a: "It's Time for Everyone to Follow Little Aya"
 murasame_event.4.a: "Little Aya, We Revere You!"
 #海军将领以及羽月相关
 YZHJ_event.1: "One-Click Naval Recruitment"
 YZHJ_event.1.t: "One-Click Yuzu Navy Recruitment"
 YZHJ_event.1.d: "As the Yuzu General Staff's army reforms proceed in full swing, naval requirements have gradually landed on the General Staff's desk. The girls have shone brilliantly in army command, but not everyone can command a navy.\nFortunately, a group of girls with naval command talent has truly emerged.\nFirst is Nijouin Hazuki, the most promising of them all. Hazuki's astral ability allows her to shape the waves to favor our fleet in naval combat, and the wave patterns let her pinpoint the enemy fleet's position, achieving a fleet-detection effect.\nThen there is Chitose Sana. As a spirit medium, Sana absorbed Haruki's misfortune, and she displays astonishing luck in naval battles as well, placing the entire fleet under fortune's protection.\nKanna, Nene, Nanami, and Mako all stood out as excellent naval commanders.\nAs a death god, Kanna can fly between fleets to strengthen their coordination, allowing them to take better positions in naval battles.\nNene has made her mark in submarine command — perhaps the experience of hiding detonators in daily life makes her highly capable of commanding fleets that must stay hidden.\nAs a top hacker, Nanami's electronic detection techniques allow her to locate enemy fleet movements more quickly.\nAlthough Mako is afraid of heights, precisely because of this, her fear of crashing makes her perform better when commanding carrier aircraft during carrier training. Moreover, her experience and skill as a ninja allow Mako to make bold on-the-spot decisions on the battlefield.\nThe Yuzu Naval Staff was also established under the girls' command, letting them exchange their experiences and strengthening the navy. (Hazuki: I'm not with them! Don't drag me into this! Ruri: I heard there's water to play in, so I came.)"
 YZHJ_event.1.a: "The Yuzu Naval Staff Is Established"
 yuyue_research: "Hazuki's Naval Department"
 yuyue_research_desc: "§4Gain the Naval Spirit§!"
 get_hazuki_advisor: "§4Gain Hazuki as Minister of the Navy§! (Effects:\nRaiding: §G+15%§!\nAmphibious preparation time: §G-15%§!\nMax amphibious invasions: §G+10§!\nNaval detection: §G+10%§!)\nDaily naval experience gain: §G+0.4§!\nNaval experience gain: §G+10%§!\nNaval max range factor: §G+25%§!"
 ertiaoyuanyuyue_desc: "No time to mourn the old geezer who was just forced into retirement — charging onto the battlefield now is... the master of water manipulation, the mad enthusiast of generals, the modern Yamato nadeshiko, the fighter for gender equality, outwardly full of righteousness and inwardly full of mischief — Nijouin Hazuki! As the dorm manager of Building 3, suddenly being put in charge of millions of buildings is a bit over her level, so she only handles water-related matters, including but not limited to water itself and things that run on water. Kids who love racing boats on the sea, you're in luck!"
 navy_Yamato_nadeshiko: "Yamato Nadeshiko of the Blue-Water Navy"
 renminzhihui: "Radiance of the People"
 country_leader_navy_Yamato_nadeshiko_decisions_conservatism: "Make Hazuki the Leader"
 yuyuan_event.1: "Choice: Make Hazuki the Leader"
 yuyuan_event.1.t: "Choice: Make Hazuki the Leader"
 yuyuan_event.1.d: "Don't make the navy suffer — let General Hazuki lead us into the deep sea! Make the world tremble with big guns and giant ships!"
 yuyuan_event.1.a: "Red Navy, Forward!"
 yuyuan_event.2.a: "The Democratic Beacon Shines Across the Four Seas"
 yuyuan_event.3.a: "I Came, I Saw, I Conquered!"
 yuyuan_event.4.a: "All Orders from General Hazuki!"

