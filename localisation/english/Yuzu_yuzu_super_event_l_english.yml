 we_nuke_hoori_close_buttom: "The bonds of love are the hardest to relinquish"
 we_nuke_washizu_close_buttom: "The sal blossoms fade: the proud must fall"
 scp_come_here_close_buttom: "Artillery is the god of war"
 huhu_come_here_close_buttom: "Miyako Is the Best in the World"
 we_have_fukai_omo_close_buttom: "Thus It Begins"
 #天神乱漫
 we_marry_with_sakuyahime_close_buttom: "A thousand years of azure; a lifetime in sunset red"
 we_marry_with_ruri_close_buttom: "Yuan angelica, Li orchids—I long for you, yet dare not speak"
 we_marry_with_sana_close_buttom: "With You!!"
 we_marry_with_aoi_close_buttom: "It bears it out even to the edge of doom"
 we_marry_with_suou_close_buttom: "Grass and trees have hearts; why seek the fair one's hand?"
 we_marry_with_mahiro_close_buttom: "If you will drink with the old neighbor too, I'll call him over the hedge to finish the cups"
 #Noble wokers
 we_marry_with_sena_close_buttom: "Do not wait for Qiang flutes crying from the western tower"
 we_marry_with_shizuru_close_buttom: "Long caged, at last I return to my true nature"
 we_marry_with_maya_close_buttom: "Before it, as before Qu Yuan, I dare not loosen cap or sash"
 we_marry_with_akari_close_buttom: "Until people asked me, “Are you in love?”"
 we_marry_with_hinata_close_buttom: "For thy sweet love remembered such wealth brings that I scorn to change my state with kings"
 #天色幻想岛
 we_marry_with_shaarii_close_buttom: "If our two loves be one, none can slacken, none can die"
 we_marry_with_airi_close_buttom: "Wild geese fly on; their light cannot cross"
 we_marry_with_masaki_close_buttom: "I find the green hills lovely; I daresay they see me the same"
 we_marry_with_yune_close_buttom: "May your vow hold like gold, not fade like silk"
 we_marry_with_tia_close_buttom: "Milky foam crowns the cup; spring shoots grace the plate"
 we_marry_with_konoka_close_buttom: "Others cross; I do not. I wait for my companion"
 #DRACU-RIOT!
 we_marry_with_miu_close_buttom: "May I find one true heart and never part till our hair turns white"
 we_marry_with_sayo_close_buttom: "The setting suns clothe the canals and the whole city in gold"
 #魔女的夜宴
 we_marry_with_nene_close_buttom: "After the sea, no water; apart from Mount Wu, no clouds"
 we_marry_with_meguru_close_buttom: "My whole heart bears this love; I fear you do not see"
 we_marry_with_touko_close_buttom: "When shall we trim the west-window candle together, and talk of that night rain in the Ba hills?"
 we_marry_with_tsumugi_close_buttom: "What worth is this gift? It tells how long we have been apart"
 we_marry_with_wakana_close_buttom: "One zither, one flask, one stream of cloud"
 we_marry_with_nanao_close_buttom: "Though millennia whiten our hair, I shall still toil for you"
 #千恋万花
 we_marry_with_yoshino_close_buttom: "Joined as husband and wife, in love we shall not doubt"
 we_marry_with_mako_close_buttom: "I know you love me; jeweled pendants shall answer you"
 we_marry_with_murasame_close_buttom: "A thousand pillow vows—till green mountains crumble"
 we_marry_with_rena_close_buttom: "No phoenix wings—yet one secret pulse joins heart to heart"
 we_marry_with_roka_close_buttom: "Ask the swallows of this love: why meet, year after year?"
 we_marry_with_koharu_close_buttom: "There is a beauty, clear-eyed and fair"
 #Riddle Joker
 we_marry_with_ayase_close_buttom: "Love me for love's sake, that evermore thou mayst love on"
 we_marry_with_nanami_close_buttom: "No repayment—only, be good to each other forever"
 we_marry_with_hazuki_close_buttom: "Till weights float on water and the Yellow River runs dry"
 we_marry_with_mayu_close_buttom: "Exchange my heart for yours, and know how deep my longing runs"
 we_marry_with_mibu_close_buttom: "Cherish not robes of golden thread; cherish the days of youth"
 #星光咖啡馆与死神之蝶
 we_marry_with_kanna_close_buttom: "Among all flowers I look back for none—half Way, half you"
 we_marry_with_natsume_close_buttom: "My longing, like the western river, flows east without rest"
 we_marry_with_nozomi_close_buttom: "I played with plums by the wall; you rode by the willows"
 we_marry_with_mei_close_buttom: "Butterflies fly east and west; the white-horsed youth returns"
