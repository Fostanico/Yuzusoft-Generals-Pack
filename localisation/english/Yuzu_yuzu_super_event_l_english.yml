l_english:
#名言
 we_nuke_hoori_quote: "The millet stands luxuriant; the sacrificial grain has newly sprouted.\nSlowly, heavily I walk, my heart unsettled.\nO distant, azure Heaven—who has brought this to pass?\n— The Book of Songs, ‘Shu Li’"
 we_nuke_washizu_quote: "White bones lie bare on the plain;\nfor a thousand li, no cockcrow.\nOf a hundred souls, one remains—\nthe thought breaks the heart.\n— Cao Cao, “Hao Li Xing”"
 scp_come_here_quote: "“To break through a fortified enemy defense, powerful artillery must be organized. Artillery must not only destroy front-line firing points, but also suppress enemy guns in depth and cut off the movement of reserves. Artillery preparation, support, and accompanying fire must be coordinated in three stages. Infantry must learn to advance behind the barrage; tanks must learn to exploit its effects. Without artillery, there is no breakthrough.” — Liu Bocheng"
 huhu_come_here_quote: "Miyako alone is the greatest in the world! Miyako is a goddess! (Anyone who bullies Miyako must die!)"
 we_have_fukai_omo_quote: "“Those who stand apart from the crowd always die young.”\n— A Star Named the Sun"
 #天神乱漫
 we_marry_with_sakuyahime_quote: "For your sake, I once thought my life not worth sparing;\nnow that we have met, I long for it to endure.\n— Fujiwara no Yoshitaka, Ogura Hyakunin Isshu, No. 50"
 we_marry_with_ruri_quote: "A fox roams slowly by the Qi;\nmy heart aches for one with no skirt.\nBy ford and bank the fox roams on—\nno sash, no clothes for the one I love.\n— Book of Songs, “The Fox”"
 we_marry_with_sana_quote: "If I could tell you\nall this restless longing, would anything change?\nEven someone like me\nwill surely love you more than anyone else!!!"
 we_marry_with_aoi_quote: "Let me not to the marriage of true minds\nAdmit impediments. Love is not love\nWhich alters when it alteration finds,\nOr bends with the remover to remove.\n—William Shakespeare, Sonnet 116"
 we_marry_with_suou_quote: "My old wife draws a chessboard on paper;\nmy young son bends a needle into a hook.\nIf old friends will keep us in rice,\nwhat more could this slight body ask?\n— Du Fu, “River Village”"
 we_marry_with_mahiro_quote: "The flower path was never swept for guests;\nthis wicket gate opens for you today, for the first time.\n— Du Fu, “A Guest Arrives”"
 #Noble wokers
 we_marry_with_sena_quote: "Mist and dew entice me; hand in hand by lotus waters.\nSudden plum rain—she sleeps, fully clothed, in my arms.\nBitterest is the hour of parting:\nhome again, she shuns her dressing table.\n— Zhu Shuzhen, “Summer on the Lake”"
 we_marry_with_shizuru_quote: "May I be worthy of your virtue, and go forward hand in hand with you.\nLet us join as mandarin ducks and rise together in flight;\nour hearts and meanings in harmony, our two wings soaring high.\n— Traditionally attributed to Sima Xiangru, “The Phoenix Seeks His Mate”"
 we_marry_with_maya_quote: "Song has sound, and I have feeling;\nwhen feeling joins the song, neither strays.\nIf one word fails to please, play on—\nten thousand tunes shall stir the rafters' dust.\n— Li Bai, “Night Song”"
 we_marry_with_akari_quote: "Though I would hide it,\nmy love has shown itself upon my face.\n— Taira no Kanemori, Ogura Hyakunin Isshu, No. 40"
 we_marry_with_hinata_quote: "Yet in these thoughts myself almost despising,\nHaply I think on thee, and then my state,\nLike to the lark at break of day arising\nFrom sullen earth, sings hymns at heaven's gate.\n— William Shakespeare, Sonnet 29"
 #天色幻想岛
 we_marry_with_shaarii_quote: "And now good-morrow to our waking souls,\nWhich watch not one another out of fear;\nFor love, all love of other sights controls,\nAnd makes one little room an everywhere.\n—John Donne, “The Good-Morrow”"
 we_marry_with_airi_quote: "River and sky one color, without a mote of dust;\na lone moon wheel, bright in empty air.\nWho first saw the moon along this shore?\nWhat year did that moon first shine on man?\nWe gaze together, and cannot hear;\nI would ride the moonlight, and pour it over you.\n— Zhang Ruoxu, “A Moonlit Night on the Spring River”"
 we_marry_with_masaki_quote: "Low is the thatched eave; beside the stream the grass grows green.\nTipsy, an old white-haired couple trade tender words in the soft Wu tongue.\n— Xin Qiji, “Pure Serene Music: Village Dwelling”"
 we_marry_with_yune_quote: "I fish the green bay in spring,\nwhile apricot petals scatter.\nClear water seems shallow; lotus stirs, fish flee.\nAt dusk I moor by green willows and wait for you.\n— Chu Guangxi, “Fishing Bay”"
 we_marry_with_tia_quote: "Wild vines spread, bright with falling dew.\nThere is a beauty, clear-eyed and fair.\nBy chance we meet—my heart's own wish;\nby chance we meet, and joy is ours.\n— Book of Songs, “Wild Vines”"
 we_marry_with_konoka_quote: "The gourd has bitter leaves; the ford runs deep.\nWhere deep, we wade; where shallow, we hitch our robes.\nThe wild geese call, harmonious; the sun begins to dawn.\nIf you would take a wife, wait not until the ice is gone.\n— Book of Songs, “The Gourd Has Bitter Leaves”"
 #DRACU-RIOT!
 we_marry_with_miu_quote: "Firewood bound and bundled; the Three Stars shine in the sky.\nWhat night is this night, that I behold my beloved?\nO you, O you—what shall I do with one so dear?\n— Book of Songs, “Chou Mou” (Airs of Tang)"
 we_marry_with_sayo_quote: "Think of the sweetness\nOf going there to live together!\nThere, all is order and beauty,\nLuxury, calm, and delight.\n—Baudelaire, “Invitation to a Voyage”"
 #魔女的夜宴
 we_marry_with_nene_quote: "Since we parted, I remember our meetings;\nhow often in dreams I was with you.\nTonight I raise the silver lamp,\nstill fearing our reunion is a dream.\n— Yan Jidao, “Partridge Sky”"
 we_marry_with_meguru_quote: "Green, green the reeds; white dew turns to frost.\nThe one I long for waits beyond the water.\nUpstream—the road is hard and long;\ndownstream—she seems to stand midstream.\n— Book of Songs, “The Reeds”"
 we_marry_with_touko_quote: "Love knows not whence it rises, yet it goes one way, and deep.\nThe living may die; the dead may live.\n— Tang Xianzu, The Peony Pavilion"
 we_marry_with_tsumugi_quote: "Moth-wing pins, snow-willow, threads of gold—\nlaughter and secret fragrance drift away.\nA thousand times I sought her in the crowd;\nI turned—and there she was, where lanterns thinned.\n— Xin Qiji, “Lantern Festival”"
 we_marry_with_wakana_quote: "The zither sounds on golden bridges,\nher pale hands poised before the jade chamber.\nHoping to win young Zhou's glance,\nshe touches the wrong string time and again.\n— Li Duan, “Listening to the Zither”"
 we_marry_with_nanao_quote: "Green peaks crowd the sky; the great river rolls, spirits trailing mist.\nThe soul of Chu seeks dreams in wind; dawn rain beads the moss.\nA thousand years since the Jade Maid left, old apes cry among bamboo.\nThe moon chills the ancient shrine; red blossoms fall wet through cloud.\n— Li He, “Mount Wu”"
 #千恋万花
 we_marry_with_yoshino_quote: "A spring outing—apricot blossoms fill my hair.\nWhose young man walks the road, so dashing and fair?\nI would marry him and give him all my life.\n— Wei Zhuang, “Sidi Xiang: A Spring Outing”"
 we_marry_with_mako_quote: "Let us drink and speak our vow:\nwith you I shall grow old.\nZither and lute sound at our side;\nall is serene and fair.\n— Book of Songs, “The Cock Crows”"
 we_marry_with_murasame_quote: "Among green hills and clear water,\nI would take your hand across this bridge.\nBlack-haired on this bank; white-haired on the farther shore.\n— Shen Congwen, Letter to Zhang Zhaohe"
 we_marry_with_rena_quote: "A pair of bright mandarin ducks\nare sewn into a lovers' quilt:\nfilled with endless longing,\nedged with knots no hand can undo.\n— “A Guest Came from Afar,” Han poem"
 we_marry_with_roka_quote: "Sour plums leave my teeth tender;\nplantains cast green across the screen.\nI wake from a long summer nap, idly watching\nchildren catch willow fluff.\n— Yang Wanli, “After a Summer Nap I”"
 we_marry_with_koharu_quote: "Down from the swing, she smooths her slender hands;\ndew weighs the flowers, sweat wets her thin dress.\nA guest—she flees in stockinged feet, her gold pin falling;\nshy at the gate, she turns and sniffs a green plum.\n— Li Qingzhao, “Rouged Lips”"
 #Riddle Joker
 we_marry_with_ayase_quote: "Do not say, ‘I love her for her smile—her look—\nher way of speaking gently.’ … These things\nmay be changed, or change for thee—and love,\nso wrought, may be unwrought so.\n—E. B. Browning, Sonnet 14"
 we_marry_with_nanami_quote: "A spring feast: one cup of green wine, one song.\nI bow again, and speak three wishes:\nfirst, that my lord live a thousand years;\nsecond, that I remain always well;\nthird, that we be as swallows on the beam,\nand meet, year after year.\n— Feng Yansi, “Changmingnü: A Spring Feast”"
 we_marry_with_hazuki_quote: "I would be one with you, our love unbroken for life.\nTill peaks are gone and rivers run dry,\nwinter thunders, summer snows, heaven joins earth—\nonly then would I part from you.\n— “Shang Ye,” Han folk song"
 we_marry_with_mayu_quote: "Heaven does not age; love cannot end.\nMy heart is like a net of double silk, knotted a thousand times within.\n— Zhang Xian, “A Thousand Autumns: Several Cries of the Cuckoo”"
 we_marry_with_mibu_quote: "Where sunlight never reaches,\nspring still comes of itself.\nMoss flowers, small as grains of rice,\nbloom like peonies all the same.\n— Yuan Mei, “Moss”"
 #星光咖啡馆与死神之蝶
 we_marry_with_kanna_quote: "Would I were the star, and you the moon,\nour light mingling clear night after night.\nThe moon may darken; the star stays bright,\nkeeping its light till both are full again.\n— Fan Chengda, “The Distant Carriage”"
 we_marry_with_natsume_quote: "Heaven matched a jade-bright man with a cream-fair maid.\nHer clear song cools the burning southern sea.\nHome from ten thousand li, still young, she smiles—plum-scented.\n‘Where my heart is at peace, there is my home.’\n— Su Shi, “Calming the Waves”"
 we_marry_with_nozomi_quote: "Plums and bamboo horses—our houses newly met.\nToo young for shame, hair loose on ivory skin.\nNow one glance leaves you silent, brows drawn.\nWhen learned you sorrow? I remember your bowed head among flowers.\n— Wang Guowei, “Lady Yu”"
 we_marry_with_mei_quote: "At the foot of the hill, young orchid shoots dip into the stream;\nthe sandy path through pines is clean of mud, while dusk rain falls and cuckoos call.\nWho says life can never be young again? Before the gate, the stream still flows west!\nDo not sing of age and passing time.\n— Su Shi, “Huanxi Sha: At Clear Spring Temple in Qishui”"
 we_marry_with_suzune_quote: "Heaven gave it perfect purity;\nthe painter's hand, one touch of red.\nNever courting the east wind,\nit guards the west window, awaiting the moon.\n— Gu Taiqing, “White Begonia”"
 #parqute
 we_marry_with_rino_quote: "Soon I shall leave the Three Gorges\nand send word home.\nYou will come to meet me, never mind the distance—\nall the way to Changfengsha.\n— Li Bai, “Ballad of Changgan I”"
 we_marry_with_tsubasa_quote: "For life or death, together or apart,\nthis is the vow we pledged:\nI take your hand in mine,\nto live with you till old.\n— Book of Songs, “Beating the Drums”"
 #天使纷扰
 we_marry_with_noa_quote: "Yet all that touches us, you and me,\ntakes us together like a bow stroke,\nwhich from two strings draws one voice.\n—Rilke, “Love Song”"
 we_marry_with_amane_quote: "What night is this night, that I row midstream?\nWhat day is this day, that I share a boat with my prince?\nFavored though abashed, I fear neither scorn nor shame.\nMy heart stirs without end, for I have come to know my prince.\nThe hills have trees, and the trees have branches; my heart delights in you, yet you do not know.\n— Anonymous, “Song of the Yue Boatman”"
 we_marry_with_kaguya_quote: "If they be two, they are two so\nAs stiff twin compasses are two;\nThy soul, the fixed foot, makes no show\nTo move, but doth, if the other do.\n—John Donne, “A Valediction”"
 #彩蛋角色
 we_marry_with_daozhu_quote: "Ride old ladies across the street, trick grade-schoolers into vaping Relx;\nFly a plane into a skyscraper, burn down Notre-Dame de Paris;\nShoot old Lincoln, imprison Mandela;\nWake Godzilla beneath the sea, contact the Trisolarans in space.\nCongratulations: you have married the most evil character in this mod."
 we_marry_with_scp_quote: "Beyond the posthouse, by the broken bridge, it blooms alone.\nAt dusk it grieves, assailed by wind and rain.\nIt never stoops to vie for spring—let all the flowers envy.\nCrushed to dust in mud, its fragrance stays unchanged.\n— Lu You, “Ode to the Plum Blossom”"
 we_marry_with_napoleon_vi_quote: "“Ei ole esteitä, jotka pysäyttävät päättäväistä mieltä.”\n“No obstacle can halt a determined mind.”"
 we_marry_with_huhu_quote: "No matter how you see yourself… my feelings will never change.\n— Thus spoke a Miyako fan"
 we_marry_with_takashiro_maya_quote: "All parting's grief I knew; home again, the flowers lie fallen.\nWe gaze beneath them, wordless; spring fades at the green window.\nBy lamplight, new joy tangles with a thousand old griefs.\nNothing stays: youth leaves the mirror, flowers leave the tree.\n— Wang Guowei, “Butterflies in Love with Flowers”"
 we_marry_with_hotaru_quote: "Rain beats its lamp but cannot quench it;\nwind only makes its light burn brighter.\nShould it fly into heaven,\nit would become a star beside the moon.\n— Li Bai, “Firefly”"
 #无对应标题
 we_marry_with_honoka_quote: "Well, it's all a matter of perspective.\nThe benevolent see benevolence; the wise see wisdom.\n— 007, 007: Spectre"
 we_marry_with_wataru_quote: "I, too, hold fast through hardship,\nnewly wed to you.\nMay we keep to a plain and simple life,\nand grow old together in shared joy.\n— Bai Juyi, “To My Wife”"
 #特殊
 we_unite_the_world_n_quote: "After hardship comes happiness; endure, act, remain composed.\n— Chun Doo-hwan"
 we_unite_the_world_d_quote: "The people are most precious; the altars of land and grain come next; the ruler counts for least.\nTherefore, one who gains the common people becomes the Son of Heaven.\n— Mencius, ‘Jin Xin II’"
 we_unite_the_world_c_quote: "Only the proletarian socialist revolution can free humanity from the dead end created by imperialism and imperialist war. Whatever hardships the revolution may face, whatever temporary defeats it may suffer, whatever waves the counterrevolution may raise, the ultimate victory of the proletariat is inevitable.\n— Lenin, Draft Programme of the Russian Communist Party (Bolsheviks)"
 we_untie_the_world_f_quote: "WAR IS PEACE\nFREEDOM IS SLAVERY\nIGNORANCE IS STRENGTH\n— Ministry of Truth, Oceania"
 we_forward_with_irno_quote: "We have only one way out: victory! There is another way: death. §RDeath does not belong to the working class!§!"
 we_forward_with_makoto_quote: "Glory to those who look toward the future!\nGlory to those who march forward!"
 we_unite_with_ilno_quote: "“Of course it will be now. Communism will come and endure forever, while the present age must someday end. Would it not be wonderful to witness that ending together? 18 years, 19—perhaps 20—and we shall stand at the threshold of a new age and greet it: Heh heh heh, hello there!”"
 we_unite_with_makoto_quote: "“Y-you had better not regret this! Even if you complain later that my chest is too small, th-this shop does not allow cancellations!”\n— Mitsukasa Ayase"
