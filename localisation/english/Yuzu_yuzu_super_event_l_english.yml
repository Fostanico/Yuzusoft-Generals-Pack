 #Completed marriage-event translations
 we_marry_with_azusa_quote: "In life we may dwell in separate chambers;\nin death, we shall share the same grave.\nIf you do not believe me,\nlet the bright sun bear witness.\n— Book of Songs, “The Great Carriage”"
 we_marry_with_azusa_close_buttom: "I think of you—will you not come?"
 we_marry_with_rio_quote: "Mock not the farmhouse wine for being cloudy;\nin a good year, chicken and pork are ample for guests.\nWhere mountains and streams seemed to leave no road,\nwillows shade bright flowers—and another village appears.\n— Lu You, “Visiting Shanxi Village”"
 we_marry_with_rio_close_buttom: "By moonlight, I shall knock at your door"
 we_marry_with_erina_quote: "Cast adrift in an age of turmoil,\nto return alive was fortune fulfilled.\nDeep into night, we raise the candle again;\nface to face, as though in a dream.\n— Du Fu, “Qiang Village I”"
 we_marry_with_erina_close_buttom: "The traveler returns from a thousand li"
 we_marry_with_nikora_quote: "A maiden rides with me,\nher face like the hibiscus flower.\nShe glides and soars,\nadorned with pendants of jade.\n— Book of Songs, “A Maiden Rides with Me”"
 we_marry_with_nikora_close_buttom: "Her gracious words are never forgotten"
 we_marry_with_kurumi_quote: "I know the past cannot be recalled;\nyet what is to come may still be pursued.\nI had not strayed too far:\ntoday is right, and yesterday was wrong.\n— Tao Yuanming, “Homeward Bound”"
 we_marry_with_kurumi_close_buttom: "Trees rejoice; springs begin to flow"
 we_marry_with_orie_quote: "The maiden said, “Shall we go and see?”\nThe gentleman said, “We are here—then let us go!”\nBeyond the Wei, the land is broad,\nand truly full of joy.\n— Book of Songs, “The Zhen and Wei”"
 we_marry_with_orie_close_buttom: "They laugh together and exchange peonies"
 we_marry_with_fumika_quote: "Outside the eastern gate are maidens like clouds.\nThough they are like clouds, none is in my thoughts.\nThe one in white robe and dark kerchief—\nshe alone can bring me joy.\n— Book of Songs, “Outside the Eastern Gate”"
 we_marry_with_fumika_close_buttom: "In white robe and madder scarf, she alone delights me"
 we_marry_with_itsukishishihimenomikoto_quote: "One draught of jade nectar wakes a hundred feelings;\nwhen mystic frost is ground away, Yunying appears.\nBlue Bridge itself is an immortal grotto.\n— Lady Fan, “Reply to Pei Hang”"
 we_marry_with_itsukishishihimenomikoto_title: "The Immortal Covenant at Blue Bridge"
 we_marry_with_itsukishishihimenomikoto_close_buttom: "No need to climb to the Jade Heaven"
 we_marry_with_yukari_quote: "Green, green your collar;\nlong, long my longing.\nEven if I do not come,\nwill you send me no word?\n— Book of Songs, “Green Collar”"
 we_marry_with_yukari_close_buttom: "One day apart feels like three months"
 we_marry_with_wataru_title: "A Little Stove of Red Clay"
 we_marry_with_wataru_close_buttom: "Snow at dusk—will you share a cup?"
 we_marry_with_suzune_close_buttom: "I raise a candle to the sleeping flowers"
