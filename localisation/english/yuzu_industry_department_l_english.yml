l_english:
#芳乃工业决议决议部分：
 yz_economy_department_category_close: "Close the economy decision group (you can reopen it in the Inner Circle decision group)"
 show_yuzu_economy_department: "Show the Yuzusoft Economy Bureau"
 Yoshino_industry_five_year_yes_by_loan: "Fund Yoshino's Hoori Plan with Development Bonds"
 Yoshino_industry_five_year_yes_by_loan_desc: "When the industrial base is insufficient, development Yuzu bonds can finance Yoshino's Hoori Revitalization Plan. Set a target issue of £GFX_yz_money §Y[?yz_bond_next_issue_amount|0]§!; at §Y[?yz_bond_next_promised_rate|.1]%§! promised APR, investors actually subscribe £GFX_yz_money §G[?yz_bond_next_issue_proceeds|0]§!, which is both the cash received and new principal. The Economy Bureau grants the development bond's construction and output bonuses; remaining debt settles after 300 days.\n§RThe debt must be repaid§!; existing long-term investments still unlock after industrialization."
 bond_we_issuing_tooltip: "Issue development Yuzu bonds"
 Yoshino_industry_540days_by_loan: "Yoshino's Hoori Revitalization Plan"
 Yoshino_industry_540days_by_loan_desc: "Although Yoshino's Hoori Revitalization Plan paints a bright prospect for our country's industrial development, the bond issuance and Yoshino's domestic approval rating are not high. Unless Lady Yoshino can deliver results within 2 years, she will find it hard to remain in the construction department.\n§RAt the same time, the bonds we have issued cannot be ignored§!"
 yuzu_auto_industrialization: "Automated Industrial Investment"
 yuzu_auto_industrialization_desc: "Comrade Yoshino has decided to launch an investment plan in the industrial sector. (If our Yuzu Coins are insufficient, the investment plan will stop automatically)"
 Yoshino_industry_five_year_industrial_complex_by_bonds_1: "Phase 1 Industrial Investment"
 Yoshino_industry_five_year_industrial_complex_by_bonds_1_desc: "Our country's industrial foundation is weak. Comrade Yoshino has decided to invest in several key sectors."
 Yoshino_industry_five_year_industrial_complex_by_bonds_2: "Phase 2 Industrial Investment"
 Yoshino_industry_five_year_industrial_complex_by_bonds_2_desc: "After investing in one key sector, Comrade Yoshino has decided to set her sights further afield."
 Yoshino_industry_five_year_industrial_complex_by_bonds_3: "Phase 3 Industrial Investment"
 Yoshino_industry_five_year_industrial_complex_by_bonds_3_desc: "We have now built a sufficient industrial foundation. Comrade Yoshino will put resources into every aspect of our country's industry."
 yuzu_auto_infrastructurlization: "Automated Infrastructure Investment"
 Yoshino_industry_five_year_infrastructure_by_bonds_1: "Phase 1 Infrastructure Investment"
 Yoshino_industry_five_year_infrastructure_by_bonds_1_desc: "Our infrastructure is as barren as Ayase's bust. Comrade Yoshino has decided to invest in infrastructure in several key regions."
 Yoshino_industry_five_year_infrastructure_by_bonds_2: "Phase 2 Infrastructure Investment"
 Yoshino_industry_five_year_infrastructure_by_bonds_2_desc: "After investing in the key regions, we must turn our attention to a wider area."
 Yoshino_industry_five_year_infrastructure_by_bonds_3: "Phase 3 Infrastructure Investment"
 Yoshino_industry_five_year_infrastructure_by_bonds_3_desc: "Our vision cannot be limited to the current regions — we must invest in more regions."
 yuzu_auto_state_category: "Automated Regional Construction Investment"
 yuzu_auto_state_category_desc: "Many regions of our country are still underdeveloped. We can invest in some regions to help them develop and serve as model regions"
 Yoshino_industry_five_year_state_category_by_bonds_1: "Phase 1 Regional Construction Investment"
 Yoshino_industry_five_year_state_category_by_bonds_1_desc: "Comrade Yoshino has selected the investment regions for Phase 1. We will build them into Yoshino demonstration zones."
 Yoshino_industry_five_year_state_category_by_bonds_2: "Phase 2 Regional Construction Investment"
 Yoshino_industry_five_year_state_category_by_bonds_2_desc: "After the Phase 1 investment, people across the country have recognized the correctness of Yoshino's investments, and we can push investment into more regions."
 Yoshino_industry_five_year_state_category_by_bonds_3: "Phase 3 Regional Construction Investment"
 Yoshino_industry_five_year_state_category_by_bonds_3_desc: "After two rounds of investment, living standards in many of our regions have improved greatly. We must bring such great progress to the rest of the people as well."
 yuzu_auto_others: "Automated Other Investments"
 yuzu_auto_others_desc: "Our country's fundamentals in other fields are also weak. Yoshino believes investment is needed there too"
 Yoshino_industry_five_year_3_by_bonds: "Invest in the Steel Industry"
 Yoshino_industry_five_year_3_by_bonds_desc: "Compared with other major powers, our steel industry can be practically ignored. Yoshino has decided to mine the rich ore deposits we have already surveyed, ultimately achieving our own \"catch up with Britain and surpass America.\""
 Yoshino_industry_five_year_4_by_bonds: "Industrial Development Investment"
 Yoshino_industry_five_year_4_by_bonds_desc: "Our production line technology is still underdeveloped. We must invest in these fields to achieve the coordinated development of our industry."
 Yoshino_industry_five_year_5_by_bonds: "Invest in Coordinated Industry-Agriculture Development"
 Yoshino_industry_five_year_5_by_bonds_desc: "The imbalance between our industry and agriculture still exists. The contradiction between the people's ever-growing needs for a better life and unbalanced, inadequate development has begun to intensify. Yoshino has decided to invest in key industry and agriculture sectors."
 Yoshino_industry_five_year_20_by_bonds: "Invest in Agricultural Mechanization"
 Yoshino_industry_five_year_20_by_bonds_desc: "After achieving rapid development in our agriculture, we need to invest in the mechanization of our agriculture to achieve high-quality development."
 #经济决议：
 yuzu_economy_department_category: "Yuzusoft Ministry of Economy"
 yuzu_economy_department_category_desc: " "
 we_dont_start_yz_invest: "We chose to launch our industrialization project through bond investment, and we now manage our country's bonds. If we operate them properly, the bonds will definitely work in our favor — §Rprovided we operate them properly§! \n\nOur current weekly interest rate is [?yz_interest_rate_we_can_see|.3+Y]§G%§!, and the Yuzu Coins we need to repay are £GFX_yz_money: [?bond_we_need_to_repay|.0+Y]"
 we_now_start_yoshino_industry_long_term_invest: "We chose to launch our industrialization project through bond investment, and we now manage our Yoshino Ciallo bonds. If we operate them properly, the bonds will definitely work in our favor, and Comrade Yoshino's investment plan will surely benefit the country and the people — §Rprovided we operate them properly§! \n\nOur current weekly interest rate is [?yz_interest_rate_we_can_see|.3+Y]§G%§!, and the Yuzu Coins we need to repay are £GFX_yz_money: [?bond_we_need_to_repay|.0+Y] \n\nWe are currently carrying out Yoshino's investment plan. Our additional monthly Yuzu Coin consumption is £GFX_yz_money [?basic_additional_yz_money_spend|.0+Y]"
 Yoshino_industry_debt_cycle: "Debt Cycle"
 Yoshino_industry_debt_cycle_desc: "We are issuing Yoshino Hoori bonds. Every week, our debt and weekly interest increase."
 we_need_to_make_choice_about_yz_bonds: "§RWe need to make a choice about our debt§!"
 Expanding_debt_issuance_first_time: "Initial Expansion of Bond Issuance"
 Expanding_debt_issuance_first_time_desc: "If our Yuzu Coins are insufficient to support our investments, we can expand bond issuance — but this will inevitably raise our bond interest rate."
 expend_debt_issuance_first: "We obtain £GFX_yz_money §Y3500§! in bonds"
 bond_we_need_to_repay_add_tooltip: "The amount we need to repay increases by £GFX_yz_money §R$RIGHT|R0$§!"
 add_interest_rate_tooltip: "Weekly interest rate increases by $RIGHT|R3$%"
 yz_debt_collapse: "Debt Collapse"
 Expanding_debt_issuance_second_time: "Second Expansion of Bond Issuance"
 Expanding_debt_issuance_second_time_desc: "If our Yuzu Coins are still insufficient to support our investments, we can further expand bond issuance — but our interest rate will rise by a larger margin."
 expend_debt_issuance_second: "We obtain £GFX_yz_money §Y3000§! in bonds"
 Expanding_debt_issuance_third_time: "Third Expansion of Bond Issuance"
 Expanding_debt_issuance_third_time_desc: "It seems two rounds of bond issuance still cannot satisfy our needs. We can issue bonds again, but our interest rate will rise significantly."
 expend_debt_issuance_third: "We obtain £GFX_yz_money §Y3000§! in bonds"
 Expanding_debt_issuance_after_third_time: "Additional Bond Issuance"
 Expanding_debt_issuance_after_third_time_desc: "After three rounds of bond issuance, we can continue to expand issuance, but each round will increase our interest rate"
 repay_the_bonds_when_have_no_yzmoney: "Repay the Bonds by Other Means"
 repay_the_bonds_when_have_no_yzmoney_desc: "Since our Yuzu Coins are insufficient to cover our bonds, we can choose other ways to pay them. The process may be painful, §Rbut it costs far less than forced repayment§!.\n§CAfter the bonds are fully repaid, no further bonds can be issued.§!"
 now_we_repay_the_bonds_without_yzmoney_tooltip: "We attempt to repay the bonds with other things."
 repay_the_bonds_by_yzmoney: "Repay the Bonds with Yuzu Coins"
 repay_the_bonds_by_yzmoney_desc: "We now have enough Yuzu Coins left to repay those bonds. After all, those creditors have made a certain contribution to our industrial development.\n§CAfter the bonds are fully repaid, no further bonds can be issued.§!"
 YM_can_repay: "£GFX_yz_money [?bond_we_need_to_repay|.0+Y]"
 partly_repay_the_bonds_by_yzmoney: "Partially Repay the Bonds"
 partly_repay_the_bonds_by_yzmoney_desc: "Although our Yuzu Coins are not enough to repay all the bonds, we can repay a portion first"
 YM_can_partly_repay: "£GFX_yz_money [?yz_money|.0+Y]"
 now_we_partly_repay_the_bonds_with_yzmoney_tooltip: "We have partially repaid the debt. Since we honored the debt agreement, our weekly interest rate will drop partially."
 now_we_repay_the_bonds_with_yzmoney_tooltip: "We have repaid the debt with Yuzu Coins"
 start_rob_the_yz_gold_of_the_land: "Start Forcing the People of the Occupied Regions to Buy and Play Yuzusoft Galgames"
 start_rob_the_yz_gold_of_the_land_desc: "The people in our occupied regions possess great wealth. We are civilized Yuzu fans and cannot rob them openly. We can make them buy Yuzusoft galgames — we believe they will be willing"
 close_rob_the_yz_gold: "Stop Forcing the People of the Occupied Regions to Buy and Play Yuzusoft Galgames"
 rob_the_yz_gold_of_the_land_we_occupied: "Force the People of [FROM.GetName] to Buy and Play Yuzusoft Galgames"
 rob_the_yz_gold_of_the_land_we_occupied_desc: "We can force the people in our occupied regions to buy Yuzusoft galgames and use the money to repay our bonds. §CAlthough this may cause the people of the occupied regions to become obsessed with Yuzusoft galgames.§!"
 we_force_people_to_buy_yuzu_game_tt: "By forcing the local people to buy Yuzusoft galgames, we have repaid £GFX_yz_money [FROM.GetAdjective]  / [?yuzu_rob_cont|.0+Y] / [?yuzu_rob_cont_to_show|.0+Y] / [?FROM.yuzu_rob_cont|.0+Y] / [?FROM.yuzu_rob_cont_to_show|.0+Y] / [?yuzu_rob_cont_to_show_out|.0+Y] / [?yuzu_rob_cont_to_show_out_1|.0+Y] / $LEFT$ / $RIGHT|R0$ "
 we_force_people_to_buy_yuzu_game_1_tt: "By forcing the local people to buy Yuzusoft galgames, we have repaid bonds totaling £GFX_yz_money §G$RIGHT|R0$§!. §CIf what we obtain from the bonds exceeds the total bonds we need to repay, our debt will be cleared directly, and the surplus will be added directly to our Yuzu Coin account. §CSince we honored our credit, our bond interest rate will reset.§!"
 #2025.3.21,21:46,伊尔诺——这里我搞不定，我也不知道为什么两个本地化会重合
 we_force_people_to_buy_yuzu_game_2_tt: "By forcing the local people to buy Yuzusoft galgames, we have repaid bonds totaling £GFX_yz_money §G$RIGHT|R0$§!. Our debt amounts to £GFX_yz_money [?bond_we_need_to_repay|.0+Y], which exceeds our total bond quota; the surplus will go directly into our Yuzu Coin account"
 we_get_the_rest: "We obtain a total surplus of £GFX_yz_money §R$RIGHT|R0$§!"
 obsessed_in_yuzu_galgame: "Obsessed with Yuzusoft Galgames"
 obsessed_in_yuzu_galgame_desc: "After we forced the local people to play Yuzusoft galgames, they all fell in love with them. Now the local people greet each other with: Ciallo~!"
 #test_yz_tooltip_1_tt: "[FROM.GetAdjective]  / [?yuzu_rob_cont|.0+Y] / [?yuzu_rob_cont_to_decti|.0+Y] / [?FROM.yuzu_rob_cont|.0+Y] / [?FROM.yuzu_rob_cont_to_decti|.0+Y] / [?yuzu_rob_cont_to_decti|.0+Y] / [?yuzu_rob_cont_to_decti|.0+Y]"
 #rob_the_yz_gold_description_1: "我们通过强迫当地人民购买柚子社gal为我们偿还了总额为£GFX_yz_money §G$RIGHT|R0$§!的债券"
 Yoshino_long_term_invest_start: "Launch Yoshino's Mid-to-Long-Term Investment"
 Yoshino_long_term_invest_start_desc: "After completing Yoshino's investment plan, we realized that Yoshino is a rare talent in this field. Yoshino has just submitted new investment plans to us, and these plans will surely benefit the country and the people."
 Yoshino_long_term_invest_in_construction: "Yoshino's Construction Investment"
 Yoshino_long_term_invest_in_construction_desc: "After Yoshino's industrial plan was completed, we realized our construction is still insufficient. Just in time, Comrade Yoshino proposed a great investment plan in the field of engineering and construction, which will surely promote our country's construction."
 Yoshino_long_term_invest_resource_extraction: "Yoshino's Resource Extraction Investment"
 Yoshino_long_term_invest_resource_extraction_desc: "Our resources are gradually unable to meet the needs of our industrial production. Comrade Yoshino has decided to launch a great investment plan to support our industry and mining sectors."
 Yoshino_long_term_invest_in_research: "Yoshino's Research Investment"
 Yoshino_long_term_invest_in_research_desc: "Compared with other major powers, our research strength is hardly worth mentioning — like a technical secondary school comparing annual high-level paper counts with Tsinghua and Peking University. Yoshino has decided to invest in several key universities and research institutes to boost our research strength."
 Yoshino_long_term_invest_in_industrialization: "Yoshino's Industrialization Investment"
 Yoshino_long_term_invest_in_industrialization_desc: "Our industrialization level is still insufficient, and Yoshino has decided to invest to address this problem. Under Yoshino's correct leadership, even Wen Zaifei is still too green to compete with us in production capacity."
 Yoshino_long_term_invest_in_political_field: "Yoshino's Favor Investment"
 Yoshino_long_term_invest_in_political_field_desc: "We uphold the leadership of General Secretary Yoshino, implement the directives Yoshino made at the Hoori Central Plenum, and unswervingly walk the path of the great rejuvenation of the Hoori nation pointed out by Comrade Yoshino. We recognize: Comrade Yoshino's will is our will, and the direction Comrade Yoshino points out is our direction of advance. To this end, we need to launch an investment so that everyone recognizes Yoshino's §Rkindness.§!"
 Yoshino_midterm_boost_construction: "Yoshino's Construction Plan"
 Yoshino_midterm_boost_construction_desc: "Yoshino's industrial plan has already delivered results, yet construction sites everywhere are still short of hands. Comrade Yoshino refuses to leave the leftover Yuzu Coins sitting in the ledger; she wants that money thrown straight onto the scaffolding, to push construction one more step."
 Yoshino_midterm_boost_output: "Yoshino's Production Increase Plan"
 Yoshino_midterm_boost_output_desc: "Quite a few factories have gone up, but the workshops still cannot fill their shifts. Yoshino has decided to spend the surplus straightening out the lines — overtime where it is needed, new dies where they are needed — and get real output moving."
 Yoshino_midterm_boost_resources: "Yoshino's Mining District Development Plan"
 Yoshino_midterm_boost_resources_desc: "The more factories we open, the tighter the ore gets. Yoshino has already picked out several mining districts; she wants the money put there, so the mine carts run a few more trips, and so everyone can see there are still good days left underground."
 Yoshino_midterm_build_civilian_factory: "Yoshino's Civilian Factory Expansion"
 Yoshino_midterm_build_civilian_factory_desc: "There still are not enough factories. Yoshino has already marked five key regions; once the Yuzu Coins are allocated, each of them can put up four more civilian factories.\n(15-day cooldown; can be taken again)"
 Yoshino_midterm_civ_batch_tt: "Five key regions will each gain §Y4§! civilian factories."
 Yoshino_midterm_build_infrastructure: "Yoshino's Infrastructure Work"
 Yoshino_midterm_build_infrastructure_desc: "A craftsman must first sharpen his tools. Yoshino wants four main roads widened a little further, so materials can get in and goods can get out.\n(10-day cooldown; can be taken again)"
 Yoshino_midterm_infra_batch_tt: "Four regions will each gain §Y2§! levels of infrastructure."
 Yoshino_midterm_build_industrial_park: "Yoshino's Industrial District Construction"
 Yoshino_midterm_build_industrial_park_desc: "Rather than scattering factories here and there, better to open concentrated industrial districts in five regions. Civilian and military plants go up together, and there will still be room for whatever comes next.\n(20-day cooldown; can be taken again)"
 Yoshino_midterm_park_batch_tt: "Five regions will each gain §Y2§! civilian factories and §Y1§! military factory."
 #yz_money_monly_tooltip_subtain: "我们每月额外消耗的柚子币增加了"
 decide_on_choice_about_long_effert_or_stop_it_tt: "We need to choose whether to convert the mid-term investment into a long-term investment"
 additional_yz_money_spend_raise: "Our additional monthly Yuzu Coin consumption increases by £GFX_yz_money §R$RIGHT|R0$§! \n§RIf our Yuzu Coins are insufficient, these investments will all be cancelled§!"


