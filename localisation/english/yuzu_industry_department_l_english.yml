 yz_bond_help_title_text: "Yuzu Economy Bureau Bond Handbook"
 yz_bond_help_left_text: "§Y1. Bonds are not free Yuzu Coins§!\nA bond spends tomorrow's income today: cash arrives immediately, while monthly settlements repay the debt over time. Only one contract may be active. Before issuing, inspect §Yproceeds, principal, minimum repayment, and expected monthly outflow§!. A healthy balance today can still empty next month's treasury.\n\n§Y2. Decide how much to raise§!\nThe §Yissue target§! is the amount offered; §Ypromised APR§! decides how much the market buys. Subscription is 40% plus ten times the APR, bounded from 60% to 190%. APRs of 2%/6%/10%/15% sell 60%/100%/140%/190% of the target. Actual subscription is both cash received and new principal. Cheap bonds raise less; generous coupons raise money quickly but leave more principal and interest behind.\n\n§Y3. How monthly repayment works§!\nThe contractual §Yminimum principal§! is the floor. §YPlanned principal§! is what you would like to repay. The Bureau follows the plan only if the chosen cash reserve remains afterward; otherwise it falls back to the minimum. Promised APR locks at signing. Paying below it capitalizes the shortfall and damages credit; paying above it trades extra interest for credit."
 yz_bond_help_middle_text: "§Y4. Three bonds, three purposes§!\nWelfare bonds grant §G+8%§! Stability and §G-5%§! Consumer Goods Factories. Development bonds grant §G+12%§! Construction Speed and §G+8%§! Civilian Factory Output. Wartime bonds grant §G+10%§! War Support and §G+12%§! Military Factory and Dockyard Output. Contract and temporary-policy modifiers remain consolidated in the §YYuzu Economy Bureau§! national spirit.\n\n§Y5. Choose how much the [YZ_bond_management_institution] controls§!\n§YManual§! leaves every parameter to you. §GAuto Repayment§! assigns principal, the actual rate, the cash reserve, deferral, additional sales, and maturity choices to the [YZ_bond_management_institution], but never opens a new contract. §CFull Auto§! also sets issuance timing and size, the promised rate, and the product. Each month the institution reviews cash flow, operating needs, leverage, credit, factory growth, long-term investment, and war. It defends liquidity first, deleverages when debt is heavy, and accelerates near maturity when cash allows. Only Full Auto issues when a genuine funding gap exists.\n\n§Y6. A mandate is not a blind order§!\nAdaptive permits institutional judgement. Conservative favours liquidity and lower debt. Balanced shares room between growth and repayment. Expansion raises development capital when the economy is sound. Liquidity crises and war always outrank routine policy. Auto Repayment and Full Auto both take over repayment controls; issue size, promised APR, and product remain player-owned until Full Auto. Return to Manual to regain every control."
 yz_bond_help_right_text: "§Y7. When the treasury runs dry§!\n§YDeferral§! skips the next principal payment, but capitalizes interest and costs 2 credit. §YAdditional Sale§! immediately raises 20% of estimated subscription while creating principal equal to 110% of the proceeds. Each government has one exceptional instrument: democracy draws a market outcome, communism organizes industrial repayment under consumer pressure, neutrality forces conversion at a political and credit cost, and fascism wagers on a 120-day Victory Bond campaign. Exact odds and costs appear in the button tooltips.\n\n§Y8. Do not sleep through maturity§!\nAt maturity, repay, extend once, or restructure. Extension adds 15% debt, raises monthly principal by 50%, and costs 15 credit; there is no second extension. Restructuring empties Yuzu Coin reserves and causes a one-year crisis. The plot follows remaining debt from 48 months ago to this month, one point per month, with the current month at the right edge. Persistently rising points mean it is time to issue less, repay faster, or postpone investment.\n\n§Y9. A sensible first issue§!\nIf you would rather not reach for a calculator, begin with a §Y5,000 target, 6% promised APR, and 1,000 cash reserve§!, then enable Auto Repayment. At 50 credit, Development bonds are a natural choice before expansion. Watch two monthly settlements: if Yuzu Coins keep falling and the debt points keep rising, increase repayment or reduce the next issue before handing everything to Full Auto."
