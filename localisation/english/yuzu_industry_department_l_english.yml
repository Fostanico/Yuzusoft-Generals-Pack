# 柚子债券 v2 与经济部 GUI
 yz_bond_migrate_legacy_ledger: "Establish or Migrate the Yuzu Bond Market"
 yz_bond_migrate_legacy_ledger_desc: "Convert an old weekly floating-interest contract to the new monthly servicing rules. Outstanding principal is preserved and no additional Yuzu Coins are issued; a zero balance only establishes the new bond market."
 yz_bond_maturity_cycle: "Yuzu Bond Maturity"
 yz_bond_maturity_cycle_desc: "Monthly instalments are automatic; the remaining balance is settled once at maturity."
 yz_bond_restructured_maturity_cycle: "Extended Bond Maturity"
 yz_bond_restructured_maturity_cycle_desc: "This bond has already been extended once and must now be repaid or restructured."
 yz_bond_war_bonds_mission: "War Bond Performance Window"
 yz_bond_war_bonds_mission_desc: "Force a belligerent to cease resistance within 120 days. Success removes 50% of outstanding debt and grants 5 credit; failure increases debt by 50% and costs 15 credit."
 yz_issue_steady_bond_decision: "Issue Conservative Yuzu Bonds"
 yz_issue_steady_bond_decision_desc: "Target issue: £GFX_yz_money §Y[?yz_bond_next_issue_amount|0]§!. At §Y[?yz_bond_next_promised_rate|.1]%§! promised APR, investors subscribe £GFX_yz_money §G[?yz_bond_next_issue_proceeds|0]§!; cash received and new principal are equal. The Economy Bureau grants §G+8%§! Stability and §G-5%§! Consumer Goods Factories. Minimum monthly principal is 3.5% of actual principal, at least 100. Requires 20 credit."
 yz_issue_development_bond_decision: "Issue Development Yuzu Bonds"
 yz_issue_development_bond_decision_desc: "Target issue: £GFX_yz_money §Y[?yz_bond_next_issue_amount|0]§!. At §Y[?yz_bond_next_promised_rate|.1]%§! promised APR, investors subscribe £GFX_yz_money §G[?yz_bond_next_issue_proceeds|0]§!; cash received and new principal are equal. The Economy Bureau grants §G+12%§! Construction Speed and §G+8%§! Civilian Factory Output. Minimum monthly principal is 3.5% of actual principal, at least 100. Requires 50 credit."
 yz_issue_emergency_bond_decision: "Issue Wartime Mobilization Bonds"
 yz_issue_emergency_bond_decision_desc: "War only. Target issue: £GFX_yz_money §Y[?yz_bond_next_issue_amount|0]§!. At §Y[?yz_bond_next_promised_rate|.1]%§! promised APR, investors subscribe £GFX_yz_money §G[?yz_bond_next_issue_proceeds|0]§!; cash received and new principal are equal. The Economy Bureau grants §G+10%§! War Support and §G+12%§! Military Factory and Dockyard Output. Minimum monthly principal is 3.5% of actual principal, at least 100. Requires 30 credit."
 yz_bond_partial_repayment: "Make an Early Partial Repayment"
 yz_bond_partial_repayment_desc: "Pay £GFX_yz_money §Y1,000§! to reduce debt by the same amount and slightly improve credit. Available every 30 days."
 yz_bond_full_repayment: "Repay the Bond in Full"
