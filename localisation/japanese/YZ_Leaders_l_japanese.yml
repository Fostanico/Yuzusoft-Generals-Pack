 # 朝武芳乃
 SZDWN: "穂織の神子"
 SZRM: "穂織人民の巫女様"
 chaowufangnai_desc: "前の強制引退した老いぼれを悼む暇はない。戦場に駆けつけたのは……あなたの穗宗！朝武家の芳乃お嬢様だ！あれ？隣にも穗宗がいるって？いやいや、あのトウモロコシの生まれ変わりは我々の巫女様には敵わない。芳乃が穗宗と呼ばれるのは、彼女が穂織の神子だからだ。あのトウモロコシ精よりずっと優れている。芳乃お嬢様が直接すべての事務を担当するのは大変かもしれないが、あなたの右腕となり、手を貸すのは絶対に問題ない。どうやってだって？芳乃は偉大だ、語る必要はない。異論がある者は外に引きずり出して155mm榴弾砲で1時間砲決だ。私のバフを受け取ってくれ！（上下に頭を下げる）"
 cwfn_event.1: "朝武芳乃の到来"
 cwfn_event.1.t: "朝武芳乃の到来"
 cwfn_event.1.d: "朝武家に代々続いた呪いを解いた後、朝武芳乃も新たな姿で我々の前に現れた。だが、次に来るのは……"
 cwfn_event.1.a: "人民の明るい未来"
 cwfn_event.2.a: "自由と民主の灯台"
 cwfn_event.3.a: "特殊な道？"
 cwfn_event.4.a: "芳乃を中心に"
 #周防恭平
 mhtm: "裏方の鉄のカーテン"
 GP_event.1: "周防恭平の来訪"
 GP_event.1.t: "周防恭平の来訪"
 GP_event.1.d: "恭平の助けで学園内部のスパイ問題を解決し、彼は新たな姿を見せてくれた。次の路線はどこへ向かうべきだろうか？"
 GP_event.1.a: "人民の明るい未来"
 GP_event.2.a: "自由と民主の灯台"
 GP_event.3.a: "特殊な道？"
 GP_event.4.a: "恭平を中心に"
 GP_event.5.t: "恭平の結婚決議を有効にしますか？"
 GP_event.5.d: ""
 GP_event.5.a: "はい"
 GP_event.5.b: "やめておく"
 # 零奶
 gtzr: "鋼鉄の男"
 lsly: "綾司令官、永遠に健康であれ"
 oppz: "おっぱい偏執"
 linglai: "三司あやせ"
 linglai_desc: "前の強制引退した老いぼれを悼む暇はない。戦場に駆けつけたのは……学園の人気アイドル、アストラル能力を持つ小さなヒーロー、猫の天敵、豊胸理論の達人、三司ゼロバスト……いや、あやせお嬢様だ！……解説者を交代しようニャ。前の奴は引きずり出されて砲決された。生徒会長としてあやせは元々多忙を極めているが、この程度の追加業務は彼女にとって取るに足らない。どこに行っても補給不足を引き起こす存在として、彼女の熱狂的なファンたちの無限の情熱を楽しんでほしい。そうそう、ついでに言うと、彼女を買収したいなら猫カフェの無料券が効く。7日間のは絶大な効果があるぞ。"
 linglai_event.1: "三司あやせの来訪"
 linglai_event.1.t: "三司あやせの来訪"
 linglai_event.1.d: "柿本香里との激しい対決の末、あやせは新たな姿（胸パッド）で我々の前に現れた。だが、次は……"
 linglai_event.1.a: "解放、共有、団結"
 linglai_event.2.a: "自由、平等、博愛"
 linglai_event.3.a: "労働、祖国、家庭"
 linglai_event.4.a: "秩序、服従、効率"
 # 美羽
 MY: "陰陽局の剣と盾"
 meiyu: "矢来美羽"
 miu_desc: "静まり返った漆黒の夜、揺らめき輝く月、邪悪で奇怪な月光。先人からこの権力という名の杖を受け継いだ以上、秩序を守り抜かねばならない。かつて彼女は多くのことを処理しなければならなかった。今、彼女はさらに多くのことを処理しなければならない。しかし彼女は決して目をそらさない。大人のように、格好よく決断を下すのだ。波は岸を打ち、星は空高く懸かり、まばゆい光はすべてを飲み込まんとしている。次々と押し寄せる新たな危機。彼女は自分の心を守り、身の回りのすべてを守らなければならないと知っている。\n\n鼓動は収まらない。しかし今回は違う。彼女は自分の無事を願っている……\n\n素直になれなくても\n\n苦しみが駆り立てても\n\nいつ慣れるのか分からなくても\n\n彼女は冷静に決断できると信じている。"
 miu_event.1: "矢来美羽の来訪"
 miu_event.1.t: "矢来美羽の来訪"
 miu_event.1.d: "アクア·エデンの煩雑な事務を片付けた後、美羽はここを離れて外の世界を見てみたいと思うようになった。そして彼女は制度と時間軸の枷を越えて\n\nここへとやって来た。"
 miu_event.1.a: "解放、共有、団結"
 miu_event.2.a: "自由、平等、博愛"
 miu_event.3.a: "労働、祖国、家庭"
 miu_event.4.a: "秩序、服従、効率"
 #宁宁
 CZRYJZ: "超自然研究部部長"
 zhifuningning: "綾地寧々"
 monvningning: "綾地寧々"
 ningning_desc: "前の強制引退した老いぼれを悼む暇はない。戦場に駆けつけたのは——起爆器を手に、部屋の生殺与奪を握り、美しさと優しさを兼ね備え、知恵と善良の化身、綾地寧々だ！彼女は服を二着持ってきていたが、そのうち一着はどうしても着たくないらしい。寧々をいじめるのが楽しいって？そうだね、親愛なる友よ、私もそう思う。でも、彼女をなだめて仕事に戻らせるのは私の仕事になるんだ！そんな無情なことをしないでくれ、友よ！……しまった、彼女の顔がまた黒くなった。彼女を機嫌直ししてから戻るよ。またな。"
 ningning_event.5.t: "綾地寧々の来訪"
 ningning_event.4.t: "綾地寧々の来訪"
 ningning_event.4.d: "綾地寧々は遠路はるばるあなたの仕事を助けに来た。そして彼女の超自然研究も新たな進展を見せている。だから次は……"
 ningning_event.5.d: "綾地寧々は遠路はるばるあなたの仕事を助けに来た。そして彼女の超自然研究も新たな進展を見せている。だから次は……"
 ningning_event.4.a: "科学は第一の生産力だ！"
 ningning_event.2.a: "自由な探求、安定した発展"
 ningning_event.3.a: "特殊な前向きな理念"
 ningning_event.6.a: "寧々に逆らう奴は頭をぶっ飛ばしてやる！"
 ningning_event.2.t: "着替え？"
 ningning_event.2.d: "着替え？"
 ningning_event.2.Z: "魔女服の寧々"
 ningning_event.2.X: "制服の寧々"
 ningning_event.5.a: "科学は第一の生産力だ！"
 ningning_event.7.a: "自由な探求、安定した発展"
 ningning_event.8.a: "特殊な前向きな理念"
 ningning_event.9.a: "寧々に逆らう奴は頭をぶっ飛ばしてやる！"
 #最高柚维埃
 JLYM: "規律厳正"
 RMZL: "人民の力"
 yzrmwyh: "最高ゆずソビエト"
 yzrmwyh_desc: "信仰は揺るがず、赤き心のゆず\n\n「人民の未来により責任を持つため、皆は民主集中制で決定を行うことにした。国家の大事に誤りは許されないからな。これまでの経験から言って、個人崇拝は安全な賭けではない……\n\n真の共産主義と民主集中制を実現し、個人崇拝や派閥主義などの根深い弊害を徹底的に根絶するため、ゆずの娘たちは各国の社会主義建設の歴史と、スターリンの未完の党内民主化から教訓を学び、最高ゆずソビエトを組織した。共産主義の実現という目標に向かって奮闘する。」\n\n千年のゆずは花を咲かせる。ゆずソビエトの指導のもと、我々は必ずや闘争と革命の路線を貫き、世界のプロレタリアと共に嵐を巻き起こし、革命を最後までやり遂げる！悪魔や吸血鬼どもを我々の前で震え上がらせてやろう！プロレタリアは鎖を失うほかは何も失うものがない。得るものは世界そのものである。同志よ、革命だ！"
 yzrmwyh_event.1.t: "最高ゆずソビエトを組織する"
 yzrmwyh_event.1.d: "大討論を経て、我が国は満場一致で最高ゆずソビエトの組織を決定した。この形式で全人民に代わって権力を行使するのだ。"
 yzrmwyh_event.1.a: "歴史は人民が書く！"
 #柚子国会
 KZB: "科学、自由、博愛"
 yzgh: "ゆずクラブ"
 yzgh_desc: "科学、自由、博愛\n\n「何度も言っているが、ゆずの子たちはみな傑出している。人中の龍鳳だ。普段人混みに立てば、鶏群の一鶴だ。民主と自由くらい、我々ゆずがやってあげる」\n\n今や世界は危険になりつつある。欲望にまみれた暴君たちは、我々の度重なる譲歩にも満足しない。我々の生存の基盤である故郷は脅かされ、民主主義の原則は踏みにじられている。自由を守るためには、人民が団結して強敵に立ち向かわなければならない。そのために、戦時にはゆずソフトの面々に緊急権限を与えて内閣を組織し、国を専制主義、過激主義、全体主義の脅威から守る必要がある。それは我々の生存権のためだけでなく、暴君の圧政に苦しむ人民のためでもある！我々の科学、自由、博愛のスローガンを、もはや空虚な掛け声にしてはならない！"
 yzgh_event.1.t: "ゆずクラブを組織する"
 yzgh_event.1.d: "議員たちの投票を経て、本日より我が国はゆずクラブを組織する。"
 yzgh_event.1.a: "民主と自由の時代が来た！"
 #大柚子军政府
 JGYT: "軍国一体"
 yzjzf: "大ゆず軍政府"
 yzjzf_desc: "「市場の変化を注視し、市場の動向を研究し、顧客の痛点を掴み、新たな戦術を開発・反復する。分かりやすく言えば、明日ビヤホールでパン価格について演説して、下の連中の表情を観察し、いけそうなら動く……はいはい、分かってる分かってる」\n\nこれは生きた思想だ。我々の世代とともに時代に合わせて進化し、次の世代によって新たに生まれ変わる。黒き炎は消えぬ。それは永遠だ。未来によって取って代わられも否定されもしない。なぜなら、それこそが未来だからだ。祖国をその天命へと導く、真に可能な道！ゆず軍政府の指導者たちはダンヌンツィオの理論に基づき、民族復興を実現する大委員会を組織し、彼女たち自身の大冒険を始めた！\n\n黒き日は既に昇った。敵どもを我々の足元に跪かせよ！"
 yzjzf_event.1.t: "大ゆず軍政府を組織する"
 yzjzf_event.1.d: "より賢明なチームを我々の大黒柱としよう"
 yzjzf_event.1.a: "柚子厨の権力こそ至上！"
 #柚子皇家议会
 ZXZS: "秩序至上"
 yzyh: "ゆず皇家議会"
 yzyh_desc: "エリート柚子、風度ゆず雅\n\nAUV、なにをおっしゃいますか。このゆず皇家議会はまず何より本場（ディダオ）でなくては。本場でなければ皇家なんて呼べますか？へへ、おっしゃる通り、我々ゆずの誰が人中の龍鳳じゃないって言うんですか？\n\n（賢いP蛇は何でも中立に入れるからな、もうネタがないよ）"
 yzyh_event.1.t: "ゆず皇家議会を組織する"
 yzyh_event.1.d: "エリートで構成された議会こそ完璧な制度だ！"
 yzyh_event.1.a: "祖国万歳！"
 # 幼刀
 SZDDL: "穂織の刀霊"
 XFJC: "小さな飛行場"
 murasame: "ムラサメ（アヤ）"
 murasame_desc: "前の強制引退した老いぼれを悼む暇はない。戦場に駆けつけたのは……超高人気の緑髪ロリ、数えで五百歳、実年齢十八歳。石中の刀の管理者、穂織の里の小さな太陽。胸に里の皆を抱き、胸元は鉄板の小さなアヤだ！穂織中の恩返しが終わらない存在として、アヤはいつも普通の生活を送りたいと思ってきた。今こそ変わるチャンスだ。一緒に彼女をもっと普通じゃない生活へ蹴り込もう！裁き切れない書類に終わらない会議、終わらない喧嘩に終わらない戦争——でも、こんな小さな飛行場にそんなに多くのことを任せるなんて、忍びないだろう？さあ、早く彼女を書類の山から引きずり出しに来い！さあ、一緒にもう一度唱えよう。アヤの恩は返し切れない！そして……忠！誠！"
 murasame_event.1: "小さなムラサメが肉体を取り戻し、皆が彼女を新たなリーダーに推している！"
 murasame_event.1.t: "アヤをリーダーに推す"
 murasame_event.1.d: "皆は嫌がるムラサメを急いでリーダーの座に押し上げた。次に来るのは……"
 murasame_event.1.a: "赤き刀霊が我々を導き鎖を断つ"
 murasame_event.2.a: "我々の民主と自由は鉄板のごとし"
 murasame_event.3.a: "皆がアヤに従う時だ"
 murasame_event.4.a: "アヤ、敬愛してるぞ！"
 #海军将领以及羽月相关
 YZHJ_event.1: "ワンクリックで海軍を募集"
 YZHJ_event.1.t: "ゆず海軍ワンクリック募集"
 YZHJ_event.1.d: "ゆず参謀本部による陸軍改革がたけなわとなるにつれ、海軍の需要も次第に参謀本部の机上に上がってきた。少女たちは陸軍の指揮で大いに輝いたが、海軍は誰にでも指揮できるものではない。\nしかし幸運なことに、少女たちの中から海軍指揮の才能を持つ将官が本当に次々と現れた。\nまずは最も潜在能力の高い二条院羽月だ。羽月の星幽能力は、海戦の際に波を味方艦隊に有利な形に整え、波の波形から敵艦隊の正確な位置を把握し、敵艦隊を探知する効果を発揮する。\n次に千歳佐奈。御霊使いとして佐奈は春樹の不幸を吸い取ってきたが、海戦でも驚異的な幸運を発揮し、艦隊全体を幸運の加護で包む。\n栞那、寧々、七海、茉子も傑出した海軍将官として頭角を現した。\n死神である栞那は、艦隊の間を飛び回ることで艦隊同士の連携を強め、海戦でより良い陣形を取れるようにする。\n寧々は潜水艦の指揮で頭角を現した。日頃から起爆器を隠し持つ経験が、隠密を要する艦隊の指揮に大いに役立っているのかもしれない。\nトップハッカーである七海の電子探知技術は、敵艦隊の動向をより早く特定することを可能にする。\n茉子は高所恐怖症だが、まさにそのため、空母の訓練で艦載機を指揮する際、墜落への恐怖からより良い働きを見せる。そして忍者の経験と能力により、茉子は戦場で即座に大胆な決断を下すことができる。\nゆず海軍参謀部も数人の少女たちの指揮のもとに設立され、彼女たちが互いの経験を交流できるようにし、海軍力を強化した。（羽月：私は彼女たちと一緒じゃない！巻き込まないでくれ！ルリ：水遊びができると聞いて来た）"
 YZHJ_event.1.a: "ゆず海軍参謀部が設立される"
 yuyue_research: "羽月海軍部"
 yuyue_research_desc: "§4海軍の精神を獲得§!"
 get_hazuki_advisor: "§4羽月を海軍大臣として獲得§!（効果：\n通商破壊：§G+15%§!\n強襲上陸準備期間：§G-15%§!\n強襲上陸キャパシティ：§G+10§!\n海軍探知：§G+10%§!）\n日毎の海軍経験値増加：§G+0.4§!\n海軍経験値増加：§G+10%§!\n海軍最大航続距離係数：§G+25%§!"
 ertiaoyuanyuyue_desc: "前の強制引退した老いぼれを悼む暇はない。戦場に駆けつけたのは……水分を操る能力者、将軍マニア、現代の大和撫子、男女平等の闘士、表は正義感に溢れ、中はやんちゃな二条院羽月さんだ！三号寮の寮母として、いきなり数百万棟の建物を任されるのは難易度が高すぎるので、彼女は水に関係することだけを担当する。水そのものや、水の上を走るものなど、枚挙に暇がない。海上で船をぶっ飛ばすのが好きな子たちは、幸運だぞ！"
 navy_Yamato_nadeshiko: "ブルーウォーター海軍の大和撫子"
 renminzhihui: "人民の輝き"
 country_leader_navy_Yamato_nadeshiko_decisions_conservatism: "羽月をリーダーに"
 yuyuan_event.1: "選択：羽月をリーダーに"
 yuyuan_event.1.t: "選択：羽月をリーダーに"
 yuyuan_event.1.d: "海軍を苦しめるのはやめよう。羽月将軍に我々を深海へ導かせよう！大砲と巨艦で世界を震え上がらせるのだ！"
 yuyuan_event.1.a: "赤い海軍よ、前進！"
 yuyuan_event.2.a: "民主の灯台、四海を照らす"
 yuyuan_event.3.a: "来た、見た、征服した！"
 yuyuan_event.4.a: "すべて羽月将軍の仰せのままに！"

