#イベント
 aragami_sayo_event.1: "小夜、政権を握る"
 aragami_sayo_event.1.t: "小夜の到来"
 aragami_sayo_event.1.d: "アクア·エデンでの長年の実績は、小夜が稀有な政治的人才であることを我々に確信させた。我々は彼女を指導者として招聘する。国家を彼女に託せば、決して失望させないだろう。"
 aragami_sayo_event.1.a: "小夜の党、人民の力！"
 aragami_sayo_event.1.b: "§2Make [ROOT.GetTag] great again!§!"
 aragami_sayo_event.1.c: "小夜総統、万歳！"
 aragami_sayo_event.1.e: "小夜なくして我々なし！"
 aragami_sayo_event.2: "選択"
 aragami_sayo_event.2.t: "来訪"
 aragami_sayo_event.2.d: "普段通り執務室で仕事をしていると、二人の人物が入ってきた。見ると、君が任命しようとしている荒神小夜と、ガチャで引いた将軍だった。今になってよく見ると、服装以外はほとんど瓜二つであることに気づく。二人はどうやら指導者任命の件で来たようだ。"
 aragami_sayo_event.2.a: "当初の計画通り小夜を指導者に任命"
 aragami_sayo_event.2.b: "ノアちゃんはなかなか良さそうだ"
 aragami_sayo_event.2.c: "忠誠！"
 tongyong_event.118171139: "小夜との結婚式"
 tongyong_event.118171139.t: "——アクア·エデンの星空の下、未来の輝かしき伝説を共に築く——"
 tongyong_event.118171139.d: "青き海に浮かぶ、希望と平和の象徴たるアクア·エデンにて、夜の帳が下り、星々が煌めく。金色の灯りが現代的建築と古典的美の融合した街並みを照らし、一磚一瓦が歳月と伝説を物語る。今日ここに、時空と種族の境界を越えた盛大なる結婚式が執り行われる——荒神小夜とあなたの幸福なる婚姻である。\n  荘厳な楽章が静かに流れ始める中、荒神小夜は典雅で華やかな和服を纏い、その瞳には千年の時を経た知恵と優しさが煌めいている。一方あなたは、仕立ての良い礼服に身を包み、限りない未来への憧憬に満ち溢れている。二人は花で埋め尽くされた誓いの道をゆっくりと歩む。まるで時が凝固したかのように、昔日の伝説と未来の希望が完璧に交錯する。\n  高らかな管弦楽に合わせて、永遠の誓いの証——古式ゆかしくも燦然と輝く指輪を交換する。指輪の内側には「共存・共栄」の銘が刻まれ、二つの世界の完全なる融合を宣言するかのようだ。これより、荒神小夜とあなたは夫婦として結ばれただけでなく、アクア·エデンで最も輝ける伝説となったのである。"
 tongyong_event.118171139.a: "心はいつも、彼方を目指す\n心はいつも、彼方を目指す"
 nuke_dropped.12097: "穂織の壊滅"
 nuke_dropped.12097.t: "穂織の壊滅"
 nuke_dropped.12097.d: "本日、一発の原子爆弾が穂織上空で気圧信管により正確に炸裂した。[?global.nukecountry.GetNameDef]は穂織の歴史と文化に一片の憐憫も示さなかった。\n 兵器炸裂の瞬間、衝撃波と放射線がすべてを生き地獄に変えた。かつてこの地を守っていた古の神の加護も、原子力の前には蒼白として無力に過ぎなかった。\n 放射線が収まった後、救助隊が入った時、そこには建実神社と石に刺さったムラサメ丸だけが、かつての栄華を物語っていた。朝武や鞍馬といった一部の大一族を除き、生存者はほぼ皆無だった。生存者たちの話によれば、彼らは月明かりに霞む廃墟の中に、幽かに見え隠れする緑髪の少女が悲しげに涙しているのを目撃したという。今や、かつて富と文化が集ったこの地は、焦土と瓦礫だけが残り、永遠の哀歌と化した。§R田心屋ももはや「百年老舗」とは名乗れまい§!。"
 nuke_dropped.12097.a: "まだ『千恋＊万花』をプレイできるといいのだが"
 nuke_dropped.12097.b: "[?global.nukecountry.GetNameDef]め、よくも！"
 nuke_dropped.7102: "鷲逗の壊滅"
 nuke_dropped.7102.t: "鷲逗の壊滅"
 nuke_dropped.7102.d: "本日、一発の核兵器が鷲逗市中心部上空で正確に炸裂し、キノコ雲がこの小さな街をほぼ完全に呑み込んだ。鷲逗はその地位からして戦略的攻撃の価値は全くないが、[?global.nukecountry.GetNameDef]はここに許されざるものを使ったのだ。\n 今ここにはただ残骸だけが残り、空からはかつての姿をほとんど窺い知ることはできず、苦痛と厄災に満ちたクレーターだけが残された。\n 襲撃後、救助隊と生き残った研究者たちは廃墟の中から新型粒子を発見し、それを§0「星幽」§!と名付けようとしている。"
 nuke_dropped.7102.a: "橘花学院は繰り上げ始業できますか"
 nuke_dropped.7102.b: "この力は敵に対して使えるかもしれない"
 tongyong_event.91718630: "共に白髪となるまで"
 tongyong_event.91718630.t: "共に白髪となるまで"
 tongyong_event.91718630.d: "彼女は今日、白無垢をまとい、小さくて、幾重にも重ねられた布にもち米団子のように包まれている。\n頭の狐耳が白紗の間から覗き、緊張で微かに震えている。春樹は彼女を見つめながら、ふと初めて出会った日のことを思い出す——彼女は段ボール箱から飛び出してきて、彼の腕に噛みついた。あの時の彼女の目は、逆毛を立てた小獣のように、「この恨みは決して忘れない」と書いてあった。\n後になって彼は知った。彼女は彼が嫌いだったのではなく、ただ怖がっていたのだと。卯花様を取られるのが怖くて、大切な人をまた失うのが怖くて、せっかく見つけた「家」がまた漂流に変わるのが怖かったのだと。\n式の前、彼女はこっそり彼に油紙の包みを差し出した。開けてみると、美味棒——彼女の大好きなお菓子で、長い間貯めていた在庫だった。\n「あげる」彼女は顔を背けたが、狐耳は正直に彼の方を向いている。「人間はあれでしょ……三々九度でしょ？お酒ないから、これで代用して。」\n彼女は一本取り出し、彼と腕を交差させ、真剣に一口かじった。噛みしめながら、目が急に赤くなった。\n「バカな琉璃」春樹は彼女の耳を揉んでやる。「これから毎日一緒に食べられるんだよ。」\n結婚式は簡素だった。神々の立ち会いはなく、千歳家と最も見知った顔ぶれだけが集まった。卯花様は隅に座り、扇子で半分顔を隠していたが、目には涙が光っていた。春樹が琉璃に指輪をはめた時、彼女は突然つま先立ちし、彼の口元を軽く舐めた——それは狐の癒し方であり、彼女の本能的な反応でもあった。\n「これから怪我しても、私だけが舐めてあげる」彼女は真剣に言ったが、すぐにその言葉の含みに気づき、狐耳がピンと立った。「そっちの怪我じゃない！ていうか……もう、なんでもない！」\n一同大笑。山吹渉はこっそりその光景をスマホで撮影し、千歳真一郎に引っ張られてSNSにアップされた。\n夜、客たちは去った。琉璃は春樹の膝の上に丸まり、狐の姿に戻って、ふわふわの一団になった。月明かりが窓から差し込む中、彼女はふと口を開いた。声は優しく、「春樹。」\n「うん？」\n「あの日、飛び出して助けてくれてありがとう」彼女は顔を彼の掌に埋めた。「本当は自分で避けられたけどね……でも、抱きとめられた感じ、暖かかった。」\n彼は彼女の背中を優しく撫でる。子猫をなでるように。彼女は気持ちよさそうに目を細め、また彼の腕の中にぐいぐいと潜り込んだ。\n「これから子々孫々、ずっと離れない」彼女は小さな声で、願いを込めて言った。「ここは……私の家。」\n窓の外の月明かりはちょうど良く、初夏の虫の音がかすかに響く。百年を彷徨ったあの小さな狐は、ついにもう離れなくていい帰る場所を見つけたのだった。"
 tongyong_event.91718630.a: "心安らぐ場所、ここが我が家"
 tongyong_event.46348368: "輝耶との結婚式"
 tongyong_event.46348368.t: "即刻即位"
 tongyong_event.46348368.d: "ヘッドドレスの下の獣耳は、今日は認識阻害の魔法で隠すことなく、彼の近づく足音を一歩一歩捉えるためだけに存在している。星河輝耶、スネウ王国の第二王女——かつて魔王の力を追って世界を渡り歩いた彼女が、今は異世界の朝日の中で、静かに結婚式を待っている。\n彼女が彼に向かって歩く時、白いトレーンが床を引きずる背後には、異世界の星図がゆっくりと広がっていくかのようだ——それは彼女の来た道であり、彼女の未来の領地でもある。彼が王女の冠と花嫁のヴェールを同時に彼女に冠すると、彼女の紅い瞳には二つの世界が融合する光が映し出された。\n「かつて私は魔力に謁見せんと来訪しました」彼女の声は澄んで、静寂を貫く。「けれどこの地で、玉座よりも永遠なる契りを見つけたのです。」\n余計な誓いはない。彼女はそっと掌を開く。彼女の根源魔力の温かな、一筋の微光と、素朴な指輪が静かに寄り添っている——まるで彼女自身のように、無限の魔法とこの世で最も平凡な絆を、最終的に一つに融合させた。式が終わると、彼女は背後を振り返る——かつて故国へ、責務へ、無限の可能性へと通じていた魔法の門が、陽光の中にゆっくりと消えていく。彼女は向き直り、隣の手をより強く握りしめる。\nこれより、帰路はすなわち行路。王女と花嫁——彼女はその両方なのだ。"
 tongyong_event.46348368.a: "「あなたのいる場所こそ、我が王国」"
 tongyong_event.65015542: "蘇芳との結婚式"
 tongyong_event.65015542.t: "禁忌の恋"
 tongyong_event.65015542.d: "人は生涯に約2920万人と出会い、二人が愛し合う確率は0.000049。\n\n恋の始まりには偶然もあるだろうが、その開花と結実は必ずや世に一つの孤品である。\n\n思い返せば、この胸の内の感情に初めて気づいてから、二人はどれだけの困難を乗り越えてきたのだろう？しかし今日、その全てが開花し結実した。我々は正式に共にあり、相手を生涯の伴侶とすることを決意した。結婚式の準備はすでに始まっている。相変わらず不器用な二人は、突然また慌ただしい日々に巻き込まれる——招待状、会場、日時、料理、式次第……ある日は疲れ果てて倒れ込むように眠ることさえある。ただ、これまでの一人だけの苦闘とは違い、我々は微笑みながら、その日が夢から降りてきて、予定より早く訪れるのを待ち——そしてこれからの一瞬一瞬が——"
 tongyong_event.65015542.a: "一番美味しい鍋包肉が食べられる"
 tongyong_event.29395306: "城門翼の結婚式"
 tongyong_event.29395306.t: "運命の結婚式"
 tongyong_event.29395306.d: "今日は翼との結婚式。純白のウェディングドレスを纏った翼の長いトレーンが徐々に近づいてくる。翼の金髪は陽の光の下でかつてないほど輝いている。\n「どうしたの？見とれちゃった？」翼の顔に眩しい笑顔が咲き、あなたの前で優しく言う。\n「ああ、だって今までこんなに輝いてなかったから」\n「実はあったよ、火葬の時はこれより輝いてた」翼はいつもの地獄のジョークを飛ばす。\n「こういう場では、地獄のジョークはやめておこう」あなたは真剣に翼に言う。翼は考え込むような顔をする。\n「私もこういうの初めてなんだから、ジョークで緊張をほぐしてもいいでしょ～？」\n「翼姉さん、地獄のジョークもTPOを弁えてよね」梨乃が翼のベールを整えながら頬を膨らませて言う。\n「わかったわかった、二人して私をいじめないでよ、私の気持ちも考えてよ」翼は甘えるように言う。\n「野菜たっぷり脂たっぷりニンニクたっぷりデカハンバーガーを食べてる時は、私の気持ちなんて考えてなかったでしょ」梨乃は容赦なく反撃する。\n「少なくともこれからは、梨乃は自分の食べたいものを食べられるし、もう被害に遭うこともないよ」あなたは翼の頬を撫でながら言う。\n「これもあなたのおかげだよ。この身体はあなたのおかげで手に入ったんだ。どうやって恩返しすればいいかわからないよ」\n「簡単だよ」あなたは笑いながら言う。\n「昨日、今日、明日、私たちはずっと一緒にいる」"
 tongyong_event.29395306.a: "君の心が我が心に似るを願う、定めてこの想いに背かじ"
 tongyong_event.21405364: "茨木梨乃の結婚式"
 tongyong_event.21405364.t: "約束"
 tongyong_event.21405364.d: "陽光が梨乃の顔に降り注ぎ、花束を抱えた梨乃は反射的にそれを掲げて陽射しを遮る。\n「陽射し……眩しい……」梨乃は眉をひそめ、少し不満げな表情を浮かべる。\n「どうした？昼間に外に出るのは慣れない？」あなたは梨乃の手を握り、笑いながら言う。\n「すごく慣れない……普段は夜勤だし、昼間は家で寝てるし」梨乃は頬を膨らませてぼやくが、すぐに言葉を変えて言う。「でもね、今日昼間に出てきたことは後悔してないよ」\n「だって、夜に結婚式やる人なんていないでしょ？」\n「わざわざ休みをあげたんだから、感謝しなさいよ」亜弥は笑いながら梨乃に言う。\n「仕事は夜、結婚式は昼、問題ないでしょ」梨乃は得した上にさらに甘え、店長に冗談を言う。\n「私は社員が結婚するのに出勤させるようなブラックな雇い主じゃないよ。それに、夜は二人の時間でしょ」亜弥は言う。\n「前に何を願ったんだっけ？」あなたは梨乃の横顔を見つめながら尋ねる。\n梨乃はためらわずに言う。「もちろん翼姉さんが回復することだよ」\n「他には何も？」あなたは笑いながら言う。\n「何もない！」梨乃は顔を赤らめ、小さな拳であなたの胸を二度叩く。\n「なら、何もなかったことにしておくよ。やっぱり僕は翼ほど大事じゃないのかもね」\n「あんた！」梨乃は真っ赤になって、複雑な表情で、花束を抱えた手も上下に行き来し、何をしていいかわからない様子だ。\n梨乃はつま先立ちして、あなたの頬にキスをした。しばらくしてから言った。\n「私にとってこの人生で一番大切な人はあなただよ。絶対に私のそばを離れないで」"
 tongyong_event.21405364.a: "君の心が我が心に似るを願う、定めてこの想いに背かじ"
 tongyong_event.61709779: "天霧夕音の結婚式"
 tongyong_event.61709779.t: "山花爛漫のとき"
 tongyong_event.61709779.d: "朝日が神社の鳥居をくぐり抜け、参道に金の欠片を撒き散らす。夕音は仲間たちの手作りした簡素なウェディングドレスを再び身にまとう——白紗の上にはシャーリーが縫い損ねた真珠や、木乃香が付けた椿が微かに揺れている。彼女は深呼吸し、あの履き慣れた跳躍靴に足を入れ、前方へと走り出す。一歩、二歩、加速——風が耳元を掠め、まるでライゼルグのグラウンドに戻ったかのようだ。背後から透の声が聞こえる。「怖がるな、俺がいる。」彼女は跳躍する。陽光が白紗を貫き、世界は一瞬の静寂に包まれる。バーも記録もなく、着地とともに飛び込んだ先にあったのは、暖かく揺るぎない抱擁だけだった。透は彼女を受け止めた。まるで森に帰る鳥を受け止めるかのように。\n「今度は、一人で跳ばせたりしないよ」彼は低くささやき、指先が彼女の目尻の泣きぼくろをそっと撫でる。"
 tongyong_event.61709779.a: "「私たちの共有する未来に向かって跳躍だ！」"
 tongyong_event.56658215: "卯花之佐久夜姫の結婚式"
 tongyong_event.56658215.t: "神の契約"
 tongyong_event.56658215.d: "数百年の歳月が、初めて掌の汗となって凝縮される。かつて風雲を動かしたあの扇子は、今はただ彼女の微かに震える指先に静かに寄り添っている。朝日の中、彼女は神社の前に立ち、白無垢の一着がこの古代の神を思いがけず戸惑わせていた。春樹が近づくと、彼女はいつものあのからかうような微笑みを浮かべようとしたが、口元にはただ一片の柔らかな本心だけが広がった。\n「思いも寄らなかったわ」彼女はそっと言い、紅い瞳に彼を映して。「妾の永遠の試練の答えが、あなただとは。」\n式の上で、彼女が人間の誓いの言葉を唱える時、広大無辺な神識が静寂に帰す。指輪を交換する刹那、彼女は百年の間守り続けた土地、巡る四季が、最終的に彼の温かな掌の中に溶けていくのを幻視する。宴席の間、彼女の目からは神としての距離感がすっかり消え、ただ人間の花嫁としての明るさだけが残る。ただ春樹が酒を注がれている時だけ、彼女はそっと扇子を動かし、囃し立てる者たちの言葉を忘れさせ——そして彼にウインクを送る。その瞳には、彼だけに見せる優しさがあった。夜も更け、彼女は窓辺に寄りかかる。春樹は背後から彼女を抱きしめる。\n「これからは、風調雨順は我が家のことよ」彼女は後ろにもたれかかり、扇子はついに脇に置かれた。\n「それでは、よろしくお願いしますね」彼女は庭先の見慣れた月明かりを眺め、声はため息のように軽く。"
 tongyong_event.56658215.a: "「私の、永遠。」"
 tongyong_event.745607: "兼元灯里の結婚式"
 tongyong_event.745607.t: "私たちの幸せ"
 tongyong_event.745607.d: "人は生涯に約2920万人と出会い、二人が愛し合う確率は0.000049。\n\n恋の始まりには偶然もあるだろうが、その開花と結実は必ずや世に一つの孤品である。\n\n思い返せば、この胸の内の感情に初めて気づいてから、二人はどれだけの困難を乗り越えてきたのだろう？しかし今日、その全てが開花し結実した。我々は正式に共にあり、相手を生涯の伴侶とすることを決意した。結婚式の準備はすでに始まっている。相変わらず不器用な二人は、突然また慌ただしい日々に巻き込まれる——招待状、会場、日時、料理、式次第……ある日は疲れ果てて倒れ込むように眠ることさえある。ただ、これまでの一人だけの苦闘とは違い、我々は微笑みながら、その日が夢から降りてきて、予定より早く訪れるのを待ち——そしてこれからの一瞬一瞬が——"
 tongyong_event.745607.a: "もう一人じゃない"
 tongyong_event.95202185: "月山瀬奈の結婚式"
 tongyong_event.95202185.t: "普通の瞬間"
 tongyong_event.95202185.d: "あの見慣れたアパートで、今朝彼女はわざわざ朝食を作ってあげた。卵焼きの火加減、味噌の濃さ、すべてが正確に昨日のまま——それが彼女の概念神級の「普通の美味しさ」だった。匠が背後からそっと彼女を抱きしめるまでは。\n叔母の家から門前払いされた子供から、兼元家での慎重なメイド、そして彼の前でやっと泣いたり笑ったりできる自分自身になるまで——彼女は青春の全てを費やして、自分が愛されるに値する人間だと確かめたのだ。\n結婚式に派手な演出はなかった。クラスメイトには内緒だったので、ただ両家が一つのテーブルを囲んだだけだった。彼女はシンプルな白いワンピースをまとい、匠は彼女のためにあの失くしてまた見つけた髪飾りをつけてあげた——新品ではなく、後に見つかり、クラスメイトに踏みつぶされた後、彼自身が修理したあれだ。傷跡は残っているが、銀の糸で精巧に花柄へと生まれ変わっている。\n夜、瀬奈はふと何年も前の発熱した夜を思い出す。彼女は彼の手を父親のものだと勘違いして、しっかり握って離さなかった。今、同じ手を握り、掌から伝わる温もりは、依存なのか愛なのか、もう区別がつかない——そして区別する必要もなかった。\n彼女は彼を見上げ、月明かりが顔にこぼれる中、そっと微笑んだ。\n「今日から、メイドじゃなくて、妻です。でも……」彼女は一呼吸置き、瞳にいたずらっぽい光が光る。「料理は私が作りますからね。だってあなたの料理、本当に『普通の美味しさ』止まりですから。」"
 tongyong_event.95202185.a: "私たち、これからきっと普通じゃない日々を過ごすんだ"
 tongyong_event.12573334: "正宗静流の結婚式"
 tongyong_event.12573334.t: "孔雀東南に飛ぶ"
 tongyong_event.12573334.d: "彼女は手袋を脱ぎ、長年の刀の鍛錬で少し荒れた掌を見せると、そっと匠の手に自分の手を置いた。\nこの動作を、彼女は何度も練習した——将棋の布陣よりも、長刀の技よりもずっと難しく。なぜならこの手は、「正宗家の令嬢」でもなく、「理事長の孫娘」でもなく、ただ彼女自身を表しているからだ。\n結婚式は正宗家の別邸で行われた。桜はまだ咲いていなかったが、参列者たちは口を揃えて言った——今日の静流さんの笑顔は、満開の桜よりも輝いている、と。\n晋海は最前列に座り、目尻に涙の光が浮かぶが、頑固に誰にも見せまいとしていた。披露宴の後、彼は匠の肩を叩いた。「この野郎、彼女の檻を壊したからには、一生責任を取れよ。」\n匠が答える前に、静流がつま先立ちして代わりに言った。「はい、一生責任を取ります。」\n夜、二人はあの小さなアパートに帰った——かつて彼女を「庶民の部屋はこんなに狭いの！？」と驚愕させた場所だ。今では隅々まで二人の痕跡が詰まっている。隅の将棋盤、壁の木刀、彼女が買うことを覚えた冷凍餃子。\n彼女は匠の肩にもたれかかり、突然何かを思い出し、極限まで抑えた声で言った。「一つだけ、ずっと言ってなかったことがあるの。」\n「うん？」\n「あの日理事長室で、あなたがお祖父様に勝って、二人きりになった時……」彼女は少し間を置き、顔がほんのり熱くなる。「私は押し倒されたから受け入れたんじゃない。あなたが口を開く前に、それよりも前に決めてたの——あなたが朱里でも匠でも、私はあなたについていくって。」\n窓の外の月明かりは白絹のように流れ、彼女は彼の腕の中で、初めて背筋を完全に緩めた。\nかつて彼女は、誰もが期待する「正宗家の娘」だった。今は、ただの静流だ。貧乳で、幼い顔立ちで、時々さ行の発音を間違えて——けれど、彼女の全ての「不完全」を聞いてくれる人がいる。"
 tongyong_event.12573334.a: "青空へ飛び立とう"
 tongyong_event.43718388: "国広日向の結婚式"
 tongyong_event.43718388.t: "終に契りを結ぶ"
 tongyong_event.43718388.d: "人は生涯に約2920万人と出会い、二人が愛し合う確率は0.000049。\n\n恋の始まりには偶然もあるだろうが、その開花と結実は必ずや世に一つの孤品である。\n\n思い返せば、この胸の内の感情に初めて気づいてから、二人はどれだけの困難を乗り越えてきたのだろう？しかし今日、その全てが開花し結実した。我々は正式に共にあり、相手を生涯の伴侶とすることを決意した。結婚式の準備はすでに始まっている。相変わらず不器用な二人は、突然また慌ただしい日々に巻き込まれる——招待状、会場、日時、料理、式次第……ある日は疲れ果てて倒れ込むように眠ることさえある。ただ、これまでの一人だけの苦闘とは違い、我々は微笑みながら、その日が夢から降りてきて、予定より早く訪れるのを待ち——そしてこれからの一瞬一瞬が——"
