 huhu_leader_desc: "今到来するは：日共日本で40年まで民生工場を建て続け、和珅が顔から火が出て自分は清廉潔白と言い出す究極の貪欲、CASナーフに不満な空軍司令官、隣人が糧を蓄え俺が銃を蓄える究極の戦狂、日共ソ連で開戦前にドイツ周辺を片っ端から殴り倒す覇権主義者、空輸手書き指令で前線微操する微操マスター、これだけバフを書き連ねてまだ自分が弱いと思ってる屑——huhu。"
 general_of_line_division: "優秀な填線部隊指揮官"
 general_of_line_division_desc: "多数のRTS・ストラテジーゲームの経験を応用し、またヨースター発売のブルーアーカイブの先生から得た各生徒のオーラコピーにより、部隊の肉体能力が大幅に向上。しかし同時に部隊が耐え難い負荷をもたらし、部隊は攻撃能力のほとんどを失い、敵に痒い程度のダメージしか与えられなくなった。"
 power_of_general: "「書記」の力"
 power_of_general_desc: "別世界の書記ノアから旧型電磁レールガンと夜間探知設備を借用——これにより我が軍の夜間戦闘能力が向上し、部隊の空中小人への反撃能力も向上したため、空軍によるプレッシャーを大幅に軽減できる。\nミレニアムの科学技術、心を震撼させる。"
 trait_for_chun: "国家徴募官"
 trait_for_chun_desc: "填線専門の将軍を得た以上、それに見合う人的資源が必要だ。私が自ら全国規模の大規模徴兵活動を行う。これにより膨大な人的資源修正をもたらすが、同時に大量の人員が前線に急行することで国内の工業生産力は大規模な欠員と生産停止に見舞われるだろう。"
