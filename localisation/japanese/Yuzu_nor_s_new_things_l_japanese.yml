 #将軍の説明
 makoto_desc: "朱里のクラスメイト。六麓学院でファッションデザイナーを目指して勉強している。\n匠が朱里の身代わりとしてクラスで他の学生と交友を始める前、真琴は朱里の数少ない友達の一人だった。\n有名な会社の令嬢だが、学校ではお嬢様らしく振る舞わず、よくエロいジョークを飛ばしている。\nよく自分でアクセサリーをデザインして販売しているが、通常は営利目的ではない。\n友情を非常に大切にし、友達に対しては情熱的。"
 minamoto_desc: "茅明はメイドとしてほとんど何でもできる——では、具体的に何ができるのか？\n拷問と審問、深層調査、読心、ボディガードとしての隠密護衛（静流ルートでは正宗家の護衛とも協力して匠と静流の外出を警護）、標的監視、人の首を何度も回転させる（ゲーム内での表現は画面が直接回転する）、伊角のグループ業務補佐、長刀対戦、格闘術、正規礼儀指導、舞踏会ダンス、校内学科指導、銃器と武器の使用、展示会設営と人員器材の手配、他グループの詳細情報の掌握、兼元別館の管理などなど……\nなぜメイドとしてこれほど多くのスキルを？一流のメイドだからだ。"
 miyako_desc: "白泉学園2年生。世界的に有名な企業のお嬢様かつ、清楚で可憐な美少女。性格は基本的にしっかり者だが、たまに抜けたところもあり男女とわず人気を集めている。\nいわゆるお金持ちのお嬢様であるが、本人の金銭感覚は超がつくほど庶民的。優等生的な自分とは違った考え方のできる翔のことをとても信頼していて、翔に対しては時にいたずらっぽい一面を覗かせることも。祖父の経営する喫茶店で社会勉強のためアルバイトをしている。\n不思議な装飾品「アーティファクト」を手にいれたことによって異能に目覚め、持ち前の強い正義感を発揮し事件の解決に乗り出す。"
 yuuki_noa_desc: "玖方女学院2年生。パフェが大好きで、誰よりも強い正義感を持つ少女。\n希亜が結成した組織『ヴァルハラ・ソサイエティ』のリーダーであり、翔たちもメンバーの数に勝手に含まれている。"
 sora_desc: "白泉学園1年生。社交的な性格で誰ともすぐに仲良くできる、天真爛漫な翔の妹。一人暮らしをしている兄の家に勝手に上がり込んでは、お菓子を食べたりゲームで遊んだりと自由気ままな振る舞いをしている。いつも元気に見えるが実は怖いものが苦手。\n不思議な装飾品「アーティファクト」を手に入れ、面白そうだからという理由で兄と都に協力する。"
 haruka_desc: "白泉学園３年生。気が小さくて大人しい人格と、大胆不敵な女王の様な人格、２つの面を持っている翔の先輩。学園では常に一人だが、クラスメイトに嫌われている訳ではなく、言葉数が少ない「変な子」として認識されている。\n実はかなりのオタク趣味。少女漫画から青年漫画まで幅広く網羅していて、翔が持っている漫画は全部持っている。"
 honoka_desc: "主人公の同級生で、水薙学園の新聞部所属の明るい性格の女の子。\n葵ととても仲が良く、よく一緒にいる。\n普段はいつもやる気満々だが、クラス内の問題製造機でもある。"
 wataru_desc: "山吹葵の姉で、現在千歳真一郎が経営する喫茶店Robinの店長を務めている。彼女が不在の時は葵がRobinの代役をすることもある。\nよくお菓子を持ち歩いていて、親と一緒にカフェに来た子供たちに配っている。そのうち、わざわざ渉からお菓子をもらうためにカフェに来る子供も出てきた。もし渉が琉璃に美味棒をあげなければ、琉璃は美味棒に異常な執着を見せて美味棒丼を開発することもなかったし、佐奈がそれを食べて吐き下しになることもなかった。笑\n春樹の担任の烏羽紫とは中学以来の同級生で、二人は水薙学園にも一緒に通っていた。\n他人が直接的・間接的に自分の年齢に関わることを言及するのを非常に気にしている。\n紫から大学時代に准教授を誘惑して試験問題を聞き出したことを暴露されたが、渉自身の話ではその教授の方から告白してきて勝手に問題を教えたという。\n恋愛話にはとてもゴシップ好きで、特に春樹と葵のことについては興味津々で聞きまくる。\n紫とその兄の過去を知っているため、時には紫のことを心配することもある。紫が煙草を吸おうとすると止めに入ることもある。"
 nanao_desc: "仮屋和奏がアルバイトする喫茶店のオーナー。見た目とは裏腹に、落ち着いた気質の女性。本体は雌の黒猫で「魔霊」（エルプ）と呼ばれ、他者と契約し契約者の願いを叶えることで心の欠片を集めており、集める目的は人間になること。"
 akagi_desc: "本作に登場する魔霊の一匹で、本体はカラス、種族はワタリガラス。\n語尾に「のじゃ」をつける口癖があり、柊史から「のじゃロリ」とあだ名されている。\n契約した魔女は椎葉紬と木月千穂子で、赤城は紬との契約中に千穂子と契約した。\n原型がカラスであるため、人間形態の時に紬に説教されて正座しなければならない時は非常に苦痛を感じる。\n紬の作る鶏つくねが大好物。\n魔霊同士は縄張り争いがあるため、千穂子の契約期間中、赤城は千穂子のいる場所で相馬七緒と縄張り問題で少々因縁がある。\n魔霊の掟に従うのが好きではないため、時に七緒が呆れるようなことをしたりもする。\n公式中国語版の最初のリリースでは「赤木」と翻訳されていたが、その後の修正パッチで「赤城」に修正された。"
 kotarou_desc: "主人公の幼馴染で、地元の神社の跡取り息子。\n学園でのクラスは別々だが、主人公との付き合いは長く仲が良い。\n成績は悪くないのだが、毒舌で生活態度にも多少難あり。\n幼い頃は強い霊感を持っていて、力が弱まった今もこの世ならざるものの存在を感じる事が出来る。"
 itsukishishishihimenomikoto_desc_commander: "穢れ祓いの神様。土地を治める卯花之佐久夜姫と違い、土地に散らばる穢れを集めて祓うことで、大きな災難を防いでいる。千歳春樹が切っ掛けで永い休眠から目覚めてしまう。\n性格は面倒くさがりで引きこもりがちだが、自分の仕事はしっかりこなしている。お仕置きにドキドキしてしまったりと、ちょっとMっぽい部分がある（本人はドMであると言っている）。\n家事全般は従者の蘇芳に任せている。"


