 tongyong_event.75554005: "長光麻夜の結婚式"
 tongyong_event.75554005.t: "比翼双飛"
 tongyong_event.75554005.d: "式は簡素だった。極道の派手さはなく、長光組の印もなく、ただ簡素なホールで、最も親しい顔ぶれを前に、誓いが交わされた。\n匠が彼女に指輪をはめる時、麻夜はふと初めて彼に会った日のことを思い出した。彼は朱里として皆に囲まれていて、自分は人ごみの外で、いつものように冷たい顔で立っていた。\nあの時は知らなかった。この「兼元朱里」が一歩一歩彼女の世界に踏み入り、彼女の氷の下の全て——疎外された幼少期、口に出せない家柄、学生証の後ろに隠したアイドルの写真、そして決して離さず握りしめていたあの長刀——を見ることになるとは。\n「これからは、一人で刀を握らなくていい」匠は低くささやいた。\n彼女は答えなかった。ただ彼の手をより強く握っただけだった。\n虎鉄は最後列に立ち、一番大きな声で叫んでいた。式が終わると、彼は割り込んできて、興奮気味に言った。「お嬢！兄貴！今日一番かっこいいっすよ！」\n夜、小さな我が家に戻ると、彼女は私服に着替え、匠のためにお茶を淹れた——動作は相変わらずきびきびとしているが、どこか家庭的な柔らかさが増していた。かつて彼女が助けたあの子猫はすっかり大きくなり、二人の足元で気だるそうに丸まっている。\n彼女はふと口を開いた。「子供の頃、疎外されてて、いつかこの家を離れられるならって、ずっと思ってた。後にあなたに出会って、私が離れたかったのは家じゃなくて、孤独だったんだってわかった。」\n匠は彼女の肩を抱き寄せた。「今は？」\n彼女は首をかしげ、初めて完全に彼の胸に寄りかかり、そっと言った。\n「今は、どこにいても、家なんだ。」"
 tongyong_event.75554005.a: "心安らぐ場所、ここが我が家"
 tongyong_event.75774954: "陽見恵凪の結婚式"
 tongyong_event.75774954.t: "あなただけの歌"
 tongyong_event.75774954.d: "「機材をチェックして、楽器が全部ちゃんと鳴るか確認してくれ。」衛哉がスタッフに言う。\n「はいはい、ドラム、ギター、キーボードは搬入済み、マイクも接続済みです。」スタッフが衛哉に報告する。しかしどういうわけか、届いた楽器の中にベースだけがなかった。\n「でもまだサウンドチェックが必要です。すぐに始まるので、急いでください。」衛哉が言う。\n「わかりました。」スタッフは楽器のサウンドチェックに走っていく。\n「衛哉……自分でサウンドチェックできるのに、なんでスタッフに行かせるの？」あなたは少し疑問に思って衛哉を見つめる。\n「バカだな。自分の結婚式で新婦自身にサウンドチェックさせるわけないだろ。君たちはトリなんだから。」衛哉はツッコミを入れる。\n結婚式の数日前、バンド練習終わりに、恵凪がわざわざあなたを訪ねてきた。\n「あの……結婚式の前に一曲パフォーマンスを入れたいんです……レモン工場のパフォーマンス、いいですか？」恵凪は緊張して言う。\n「え？聞いてないよ？」あなたは困惑する。レモン工場が急遽パフォーマンスを追加するというのに、ベーシストの自分が知らないとは？\n「いえ、あなたは入ってないんです。私たちだけで。」莉莉子もやってきて言う。\n「どういう意味？」ますますわからなくなる。\n「恵凪ちゃんから話させてあげて。」月望が笑いながら言う。\n「あの……婚約した時から……あなたのために曲を書こうって決めてたんです。あなたは私をこんなに助けてくれて、音楽の夢を叶えてくれて、レモン工場で楽しく歌えるようになったのも……全部あなたのおかげで。だからだから！あなたに曲を書きたいんです。前に母に気持ちを伝えるために曲を書いたように、あなたにも新しい曲を書きたいんです……あなたは特別だから。」恵凪は曲を書いてきたこの期間の感情を一気に吐き出した。\n「……わかった。信じてるよ、恵凪。」あなたは恵凪の頭を撫でる。\n……\n結婚式の会場で、あなたはレモン工場の仲間たちが楽器を調整するのを見つめている。しかしあなたは客席に座っている。これはかつてない体験だ。いつもならステージに立って仲間と一緒に演奏していたのに、今は客席に座って仲間たちの演奏を見つめている。そしてあなたこそが、この演奏の最も大切な観客なのだ。\nウェディングドレスを着た恵凪がステージの上でギターを抱えている。この光景は少し違和感があるが、これもまたあなた専用の衣装なのだ。\n「みなさんこんにちは！変だと思われるかもしれませんが、結婚式なのにバンドのライブみたいで。間違いではありません。今日の結婚式には、本当に一曲の演奏があって、この曲は、私の一番愛する人……つまり、今日の新郎に捧げるためのものです。」\n「あなたの支えがなかったら……私はここまで来られなかったし、生涯を誓い合うこと……後半生をあなたに託すこともできなかった。だから……伝えたいのは、愛してる、それだけです。」恵凪はステージでマイクを持ち、あなたを見つめながら言う。恵凪の言葉は本心だとわかっていても、結婚式でマイクを使ってこの場の全員にこんなことを言われると、さすがに顔が赤くなる。\n「では……次は……あなたのために作った新曲です……曲名は：恋は清風の如く。」\nかつて恵凪が母親のために作った曲が「暖かな陽射しの如く」という名前だったことを思い出す。そして今日彼女があなたのために書いた曲も、あの時と同じように、恵凪が自分の気持ちを書き綴ったものだ。\nすべての感情を込めた歌詞を、ステージで歌う恵凪を見つめながら、あなたはもう耐えられなくなった。\n歌が終わると、あなたはステージに上がり、恵凪を抱きしめた。\n「この曲……一度しか歌わないんだよね？」あなたは恵凪を抱きしめながら尋ねる。\nそれを聞いた恵凪は、顔に笑顔を浮かべて言った。\n「もちろん……これは……あなただけの歌だから。」"
 tongyong_event.75774954.a: "君の心が我が心に似るを願う、定めてこの想いに背かじ"
 tongyong_event.11722289: "隠杏珠の結婚式"
 tongyong_event.11722289.d: "「どうしようどうしよう緊張する……本当にこれからあんなにたくさんの人の前でこんな恥ずかしいことするの？」杏珠が独り言をつぶやき、顔を上げてあなたの顔を見ながら尋ねる。\n「何言ってるの？結婚の誓いって普通でしょ？なんで大勢の前で恥ずかしいことするってことになるの？」あなたは杏珠が何に緊張しているのか少し理解できない。\n「えっ！でも！見てよ、私たち、みんなの前で永遠に一緒にいて永遠に愛し合うって誓うんだよ……考えただけで……恥ずかしいよ！」杏珠は考えただけで既に顔が赤くなっている。\n「大丈夫、レモン工場のライブだと思えばいいよ。あんなに何度も一緒にパフォーマンスしたんだから、これくらい怖がらないでしょ？」あなたは杏珠の緊張をなだめる。\n「そうかも……違う！それと同じ理屈でいいの！？ライブはライブ、でもこれは結婚だよ……一生に一度の……緊張して当然でしょ！」杏珠はちょっと不満そうにあなたを見つめる。あなたのすり替えが杏珠に見破られた。\n「じゃあ……緊張以外の気持ちも考えてみよう。杏珠だって緊張だけじゃないでしょ？」\n「もちろん。興奮もしてるし、感激もしてる。愛する人と一緒に結婚の殿堂に歩いていけるなんて、本当に嬉しい。」杏珠はここで急に興奮し出し、さっきの緊張した様子が嘘のようになくなった。\n「だから、大胆に歩いて行こう。前のライブで即興でピックを放り投げてスラップ始めた時みたいに。」あなたは杏珠に右手を差し出す。\n杏珠はあなたの差し出した手を見つめ、少し迷ってから、あなたの手を握った。\n「あなたと一緒にいられれば……あなたの手を握っていれば……そんなに緊張しなくなるんだ。」杏珠の顔に笑みが浮かぶ。\n「もちろん、離すつもりなんてないよ。前に杏珠に言ったでしょ、ずっと隠さんと一緒にコンサートをしたいって。」あなたはかつて杏珠に言った言葉を持ち出す。\n「ああもう……今、前の話を持ち出すなんて……」杏珠は少し顔が赤くなるが、すぐに言い返す。「私の答えも前と同じだよ。私もあなたから離れるつもりはない。」\n「じゃあ前の言葉、これからも約束を守ってくれる？」あなたは笑って言う。\n「もちろん！私たち、これからずっとずっと、一緒にいるよ」杏珠も笑顔になる。\nあなたは笑顔で杏珠の手を握り、一緒に前に歩いていく。式場に向かうその瞬間、二人は顔を見合わせて微笑む。あなたはわかっている。これからどんなに時間が経っても、あなたは杏珠の傍らにいて、一番近い場所で杏珠を守り、杏珠と並んで歩いていくことを——ただもうあなたは、杏珠の恋人ではなくなったから。二人の関係は今日を境に新しい段階に入る。"
 tongyong_event.11722289.t: "一心の人の得るを願う、白頭にして離れざらん"
 tongyong_event.11722289.a: "沅に芷あり澧に蘭あり、公子を思うも未だ敢えて言わず"
 tongyong_event.36732743: "島越月望の結婚式"
 tongyong_event.36732743.t: "音を知る心"
 tongyong_event.36732743.d: "金髪の少女がステージで優雅にピアノを奏でている。ソロリサイタルを開ける音楽家は多くないが、ステージ上の少女はその一人だ。\nあなたは客席で少女の演奏に耳を傾ける。あなたの隣の女性も知り合いだ。というより、このリサイタルは彼女があなたを招待したのだ。\n「お義母さん……月望は私が来てるって知ってますか？」\n「おほほ……もちろん知らないわ。最近ヨーロッパツアーで疲れてるんじゃないかと心配で、あなたを日本からパリに呼んだのよ。」月望の母は笑いながら言う。\n「大丈夫ですよお義母さん。心配いりません。彼女は特に疲れてません。」あなたは月望の母をなだめる。月望の調子は悪くない、心配には及ばない。\n「あら？どうしてわかるの？」月望の母は少し理解できないように尋ねる。\n「月望の音色に表れてます……まだ演奏に没頭していて、弦が張り詰めたような感じはありません。」あなたは月望のピアノ曲を聴きながら言う。\n「そう……それならいいんだけど……でも……あなたたち、音楽だけでお互いを理解できるのね……前に月望をあなたに託すって言われた時はよくわからなかったけど……今なら……ふふ、あなたもなかなか頼りになるわね。月望も損な結婚じゃなさそう。」月望の母は言う。\nしかしその時、月望の演奏が終わり、ホールが割れんばかりの拍手に包まれた。\n「さて、演奏は終わったわ。月望……きっとあなたに会いたがってる。私、車を出してくるから、月望を連れて乗ってきて。」月望の母は微笑みを残して去っていった。明らかに二人の時間を作るためだ。\n「月望。」あなたは月望の演奏終了後、ステージ前に歩いていった。本当は彼女が舞台裏で着替え終わるのを待ってから会うつもりだった。しかし、月望はあなたを見た瞬間、飛び降りてあなたの胸に飛び込んできた。\n「月望！気をつけて、転んだらどうするんだ。」あなたは月望を受け止める。月望は頭をあなたの胸に埋める。\n「来るなら来るって言ってよ……いじわる。」月望は頭をあなたの胸にこすりつける。あなたは月望の後頭部に手を置いて優しく撫でる。\n「お義母さんがサプライズにしたいって……」\n「ちぇっ、ママはいじわる、あなたもいじわる。」月望は甘えるように言う。\n「じゃあ……来なければよかったかな。」\n「ダメ！私がどれだけ会いたかったか知ってる？ツアー先に着いて、電車を降りるたびに、あなたがいるかもって期待しちゃうんだ……ありえないってわかってても、でも思っちゃう……」月望が言う。\n「だから今、現れたんだよ。」あなたは笑いながら言う。\n「うん……本当に願いに応えてくれたんだね……ツアーも……コンテストも……どうでもいい。ただあなたに会いたかった。」月望が言う。\n「はいはい、早く着替えて。お母さんが外で待ってるよ。」あなたが言う。\n「はーい。でも、出てきたら、消えちゃダメだからね。」月望が少し名残惜しそうにあなたから離れる。\n「消えないよ。ずっと待ってる。」\n月望の顔に笑顔が浮かび、あなたの頬にそっとキスをしてから、小走りで舞台裏へ駆けていった。\nヨーロッパ文化では頬へのキスはごく普通の行為だが、走り去った後に突然それに気づいた月望は、小走りで戻ってきて、今度はあなたの唇に軽くキスをして、また走り去っていった。\nあなたはその場に立ち、月望の後ろ姿を見つめながら、心の中で思わず感嘆する。\n「これから僕のそばには、月望さえいればそれで十分だ。」\nこれは月望がかつて言った言葉だったが、今あなたは完全にそれに同意している。"
 tongyong_event.36732743.a: "一語にして意に入らずんば、君に従いて万曲、梁塵を飛ばさん"
 tongyong_event.9782093: "莉莉子の結婚式"
 tongyong_event.9782093.t: "幼なじみの大勝利"
 tongyong_event.9782093.d: "今朝、あなたはいつも通り早起きした。次にやることもいつも通り、莉莉子の家に彼女を起こしに行くことだ。あなたのこの幼なじみは、あなたがいなければ起きることさえままならない。\nそう思いながら、あなたは首を振り、莉莉子の家に向かう道を歩き出した。\n鍵で莉莉子の家のドアを開け、二階に上がって莉莉子を起こそうとしたその時、突然あなたの目は、鏡台の前に座る赤い姿に引き寄せられた。\n「今日は僕が呼ばなくても起きてたんだな。」あなたは笑いながら言う。\n「いったい私のことどう見てるのよ。結婚式当日の朝に寝坊する人なんているわけないでしょ？」莉莉子はとても不満そうに言う。\n「だって、いつも僕が起こさないと起きられないから、今日も同じかと思って。」\n「まったく……こうなるってわかってたら鍵なんて渡さなかった。こんなお迎えの仕方ある？外に閉め出せばよかった。」莉莉子は口を尖らせ、少し怒っている。\n「鍵をもらったのも最近のことじゃないだろ。ずっと前に僕にくれたじゃないか。」\n「ちぇっ、これが幼なじみの悪いところ。ダメ、もう一回外に出てやり直して。さもないと不法侵入で訴えるから。」莉莉子はあなたのお迎え態度に満足していない。\n「そんな手ぶらで帰るお迎えがあるか？君はもう目の前にいるんだ、素直に帰るわけないだろ。」あなたはニヤリと笑い、莉莉子のそばに近づく。\nあなたは突然しゃがみ込み、莉莉子の背中とふくらはぎに手を回し、お姫様抱っこで抱き上げた。\n「君はこれからずっと僕のお姫様だ。離したりしないよ。」あなたは腕の中の莉莉子の耳元でそっとささやく。莉莉子の頬がほんのり赤くなり、しばらく何も言い返せなかった。\n「ほらほら、言ったでしょ。あの二人は絶対俺たちにちょっかい出す隙なんてくれないって。」衛哉が入り口で言う。バンドの他のメンバーもそこに集まっている。\n「お前ら、なんでいるんだ？」\n「月望が、こういう時は花嫁の親友たちがそばにいて新郎を邪魔するんだって……それで来た。」恵凪が言う。\n「邪魔って、月望、一体何を読んだんだ？」あなたはツッコミを入れる。あの金髪の少女はただ舌を出しただけだった。\n「ちょっと待って！先に莉莉子を下ろして！」杏珠が突然言う。\n「え？なんで？」\n「先に下ろして。」杏珠が言う。\nあなたは莉莉子を地面に下ろした。すると突然、フラッシュが光る。月望があなたが莉莉子の前に片膝をついた瞬間を写真に収めたのだった。\n「撮れた。ウェディングフォトよりずっと意味のある一枚だね。」月望は笑いながら言う。\n「それでは！」衛哉は咳払いし、一拍置く。\n「新婚おめでとう！」四人が声を揃えて叫ぶ。\nそうだ、今日から莉莉子は君の奥さんなんだ。そう思うと、あなたは思わず莉莉子の手を握った。\n「これからも、永遠に……永遠によろしくね……！」"
 tongyong_event.9782093.a: "手を携え、共に白髪となるまで"
 tongyong_event.47496112: "碩川美玖の結婚式"
 tongyong_event.47496112.t: "類は友を呼ぶ"
 tongyong_event.47496112.d: "式場の入り口に立ち、あなたの心は不安でいっぱいだった。白髪の少女がウェディングドレスをまとい、そっとあなたの手を握る。\n「緊張しないで、私たち、どっちも初めてなんだから。」美玖は笑いながら言う。\n「そうそう、緊張するなって！」杰があなたの左肩を叩く。\n「そうだよ、なんて嬉しい日だ！お前と美玖がやっと結婚するんだ、嬉しくないわけないだろ。」雄真があなたの右肩を叩く。\n「お前ら二人がいるから不安なんだよ！結婚式に何を企んでるんだ！なんで俺がお前らと一緒に演奏しなきゃいけないんだ！」あなたはツッコミを入れる。\n「俺たちの家に婿入りしたんだから、バンドにも入ってもらわなきゃな。」雄真が言う。\n「俺には自分のバンドがあるんだ！レモン工場のメンバーなんだぞ！」\n「まあまあ、冗談だよ。一回一緒に演奏してくれれば、お前が身内だって示せるだろ。」杰が言う。\n「でも……」まだ何か言いたかったが、美玖があなたの手を引いた。\n「もう、あなたは私と結婚するんでしょ、このバカ二人とじゃないんだよ。あいつらのことなんて気にしなくていいから。」美玖が笑いながら言う。\n「妹はまだ嫁いでもいないのにもう他人の味方だ！」雄真が大げさに心を痛めるポーズをとる。\n「あんたたち二人がいつも彼をいじめるから、私が彼の味方になってあげないと。じゃないと毎日いじめられるんだから。」美玖は二人の兄に言う。\n「ありがとう美玖……」あなたは両手で美玖の手を包み込む。\n「まあ……私のバカ兄貴たちの方が……これからあんたに面倒見てもらわなきゃいけないかもね。よろしくお願いね。」美玖は笑いながら言う。\n「美玖！兄貴をそんな目で……悲しいよ……」杰が言う。\n「ちぇっ、悲しければ悲しいでいいよ。今日の主役はあんたたちじゃないんだから。誰も気にしないよ。」美玖は容赦なく二人の兄をディスる。これが本当の兄弟げんかというものだろうか。\n「はい、あいつらは無視して、行こう。」美玖はあなたの手を引いて式場へ入っていく。\n「美玖……」あなたは美玖の名を呼ぶ。\n「なに？」美玖は振り向いてあなたを見つめる。\nあなたはこれから踏み入ろうとしている結婚式場を見つめ、振り返って二人のおバカな義兄たちを見て、そして美玖の手をぎゅっと握りしめた。\n「これから……ずっと一緒にいるんだよね。」あなたは言う。\n「うん、ずっとずっと一緒だよ。なんでそんなこと聞くの？」美玖は少し不思議そうに首をかしげる。\n「だから、俺たちの関係はもっと先に進んだんだ。じゃあ……前の約束も、これからも続くよね？」\n「何があっても、俺と美玖の絆は揺るがない」\n「うん……はは……これからも、よろしくね」美玖は眩しい笑顔で笑う。"
 tongyong_event.47496112.a: "別れ際こそ最も辛き時、帰り来たりて懶くも粧台に寄らず"
 tongyong_event.73719949: "茶園那優花の結婚式"
 tongyong_event.73719949.t: "充電（暗示なし）"
 tongyong_event.73719949.d: "「ムカつくムカつくムカつくムカつく……なんでこんなに要求が多いのよ！」那優花はパソコンの画面に向かって罵倒している。\n「どうしたの？」あなたは心配して那優花のそばに歩み寄る。\n「クライアントって世界で一番憎たらしい生物！一番憎たらしい！私が三日かけて書いた曲、30時間連続で寝てないんだよ！クライアントに送ったら『紗優太っぽさが足りない』だって……紗優太っぽさが足りないって何よ！紗優太本人が書いても紗優太っぽさが足りないのか！」那優花はクライアントを痛烈に批判する。\n「ああ……でも結構な人数がもう君の新曲風を受け入れてるんじゃない？」あなたは尋ねる。\n「そうなんだよね……前に実際に恋愛してから、恋愛の気持ちを伝えたいけどまだ青くて恥ずかしいっていう感覚がわかるようになったんだ。その後の曲は結構そういう軽やかなのが多いんだよね。」那優花はここ最近の変化を思い返しながら、あなたを見つめて言う。\n「これ……全部あなたのおかげだよ。あんた一人で私の曲風を変えちゃったんだから、責任取ってよね。」那優花は笑いながら言う。\n「うーん、君の言い方だと、僕は君の作曲にかなり影響を与えたってことかな？」\n「もちろん。あなた……私に恋愛の気持ちを体験させてくれたから、私も恋愛感情がわかるようになったんだ。だから……私の今の曲風に慣れないリスナーに対して責任取ってよね。」那優花はパソコンデスクから立ち上がり、あなたに近づいてくる。\n「どう責任取ればいい？」あなたは那優花の目を見つめて尋ねる。\n「もちろん……もっと多くの人に、恋愛感情ってこんなに甘いんだよって知ってもらうことだよ～今みたいにね～」那優花はぴったりとくっついてくる。\n「ねえ、クライアントにムカつかされた私を、満足させてくれるよね？」那優花はすかさず道徳的脅迫に出る。\nあなたはこれが那優花が気分転換したいだけだと知っている。そしてそれをできるのは、彼女を一番理解しているあなただけだ。あなたは那優花の頭を優しく撫で、仕事で荒んだ気持ちをなだめる。\n「そうだよね～あいつらは恋の良さもわかんなくて、ラブソングに偏見があって、俗っぽいって思ってるんだ……あなたのおかげで、音楽への理解が深まったし、もっといい曲が書けるようになったんだ……もちろん、一番の収穫は……」\n那優花は一旦言葉を切る。\n「ずっとずっとあなたのそばにいて、あなたの腕の中で甘えられること。私のそばにあなたがいるってわかってるだけで、心が落ち着く。」那優花の抱きしめる力が急に強くなる。\n「ありがとう、ずっとそばにいてくれて。」那優花が言う。\n「これからもだよ。どんな悩み事に出会っても、僕はそばにいる。だって……前に言ったでしょ」あなたは腕の中の那優花を見つめ、ぎゅっと抱きしめたくなる。\n「那優花の隣に立つ人間を、僕は誰にも譲らない」"
 tongyong_event.73719949.a: "庭際に当たりて、玉人浴して新たに粧い出ずるが如し"
 tongyong_event.65171977: "洛易の結婚式"
 tongyong_event.65171977.t: "Hoshizora no Memoria"
 tongyong_event.65171977.d: "夜空には美しい夏の大三角が高くかかり、星明かりの下で二つの人影が寄り添っている。洛易は夜が好きで、夏の夜空が好きで、織姫と彦星、そして二人の傍らにあるデネブが好きだ。七月七日は美しい伝説——愛し合う二人が天の川の隔たりを越えて出会う。星空の下の二人も同じだ。様々な困難を乗り越え、ついに織姫と彦星のように誓いを結ぶ。\n「私みたいな面倒な人を好きになるなんて、今夜の君は本当にバカだね。」\nここまで来るのに、どれだけの時間がかかったのだろう？長かったようにも思えるし、短かったようにも思える。織姫と彦星が逢うこの天の川の下で、彼女と共に千光年の誓いを結ぶ。"
 tongyong_event.65171977.a: "Eternal Heart"
 kotori_event.1: "琴里の目覚め"
 kotori_event.1.t: "琴里の目覚め"
 kotori_event.1.d: "茉優の度重なる星幽能力の実験により、柚子研究所の星幽能力への理解は新たな段階に入った。\n我々の星幽能力への理解はついに、星幽能力暴走状態の星幽使いを制御できる域に達した。\nあやせと茉優は隔離室の前で準備作業を進め、二人とも顔色は厳しく、実験の成果を待っている。\n隔離室の中の紫髪の少女がゆっくりと目を開けると、あやせと茉優は興奮して飛びついた。\n「お姉ちゃん！」\n「琴里！」\n目覚めたばかりの琴里は、二人が飛びついてくるのを見て、まだ状況がよく飲み込めていない。\n「え？ええ？あやせ……茉優……？え？あやせ？なんていうか……大きくなった？特にお胸が……何この状況？なんでこんなに大きくなってるの？これどういうこと、まさか……夢？」琴里は茫然と二人を見つめ、何が起こったのか理解していない。しかし少なくとも、目の前の現実は記憶の中の光景とずれがある。琴里の第一反応は、これは現実ではない、だった。\n「夢じゃない、夢じゃないよ！寝ちゃダメ！」鋸（取り消し線）あやせは焦って言う。\n「琴里……やっと目が覚めたのね！」茉優は琴里を抱きしめた。\n……\n琴里の能力は風を操ることだ。かつて暴走によって激しい暴風を引き起こしたことがあり、敵の航空支援を効果的に阻止できる。\n目覚めた後の琴里は、あやせと茉優の助けで急速に身体機能を回復し、柚子参謀本部にも加わった。"
 kotori_event.1.a: "「おかえり、琴里」"
