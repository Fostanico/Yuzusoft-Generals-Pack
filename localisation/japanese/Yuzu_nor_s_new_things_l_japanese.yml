 pastisen_of_boomer: "戦略爆撃推進者"
 hope_for_new_centery_navy: "世紀の海軍への野望"
 chun_leader_desc: "海戦好きの下手くそ。Paradoxの海軍の非効率的な生産と訓練に我慢できず、自ら国家を率いて海軍の夢を実現することを決意。\n戦略爆撃と護衛は、多くの難関を克服するのに私の力となった（すなわち敵の生産力を麻痺させる）。戦無不勝、先進技術で改良した重戦闘機と戦略爆撃機は必ずや敵を大敗させて帰還させる。\nキヴォトスの書記ノアの良き親友、セミナー会計ユウカの経済建設と科学研究支援——ただしユウカはよく先生のめちゃくちゃな資金管理で頭を悩ませている。\n「こんなところで無駄遣いしないでください！」（つまり酷い運営手法のこと）"
