#指導者の説明
 aragami_sayo_desc: "アクア·エデンの最も偉大なる市長として、荒神小夜はアクア·エデンの長年にわたる繁栄と安定を維持してきた。その幼い外見は古の知恵と超自然の力を隠している。国家元首として、彼女は吸血鬼の靭性と回復力をもって国家を率い、人類と超自然種族の調和ある共存に尽力している。彼女の統治は永遠の戦略的視野と現代外交を融合させ、動乱の戦時において均衡と安定を追求している。§R小夜カッカは我らの永遠の太陽§!"
 leader_nor_desc: "紹介：伊爾諾、番号（データ消失）、（データ消失）に基づいて作られたクローンで、本来の指令は忠誠、殺戮、回収であったが、（データ消失）の後、徐々に自我を持ち、自律思考を生み出し、最終的に指令制御から脱却した。戦闘のために生まれながらも、極めて強い個人的正義感を持ち、意志堅固だが、ある程度の道徳的柔軟性も示す。外見はクローン原体と類似し、ほとんど識別可能な特徴はないが、内部に埋め込み構造があり、X線撮影で識別可能。自我獲得の過程で、そのデータベースは大量のインターネット情報に汚染され、時折ひどいジョークを飛ばす——特に『第五共和国』が好きで、よくカッカと自称する。\nオリジナルと比べ、伊爾諾はより明るく話し好きで、性格もより開放的で、より情熱的である。\n§R大将伊カッカ、我らが偉大なる英雄に従え、我らは地獄よりも強くなる§!"
 misaka_makoto_desc_commander: "現在本MODの二作目\n詳細な個人設定は指導者説明を参照のこと"
 misaka_makoto_leader_desc: "紹介：井向真琴、旧名（データ削除）、（データ削除）によって開発された強AIモデル。最初のテストでは中AIのモデル能力しか示さなかったため、伊爾諾に補助AIとして配属されたが、その後の（データ削除）の中で徐々にモデル能力が発掘され、最終的に（データ削除）となった。\n個人紹介：AIだが、その強AI特性により人間同様の感情を持つ。伊爾諾と異なり、真琴は結果の正義を追求すると同時に過程の正義も追求する。（真琴は実際には【データ削除】の強AI開発任務のために抽出された人間の意識である）"


