l_japanese:
 # Millennium Dawn 专用柚子军工组织本地化
 YZ_MD_MIO_6_get: "ゆず小飛棍有限会社を設立"
 YZ_MD_MIO_6_get_desc: "誘導電子、推進システム、弾体構造、通常・核弾頭、精密最終組立の各部門を統合し、ゆず小飛棍有限会社を設立する。本企業は現代の防空ミサイル、巡航・極超音速巡航ミサイル、通常・核中距離弾道ミサイル、および大陸間弾道ミサイルの研究開発と生産を担当する。"
