l_japanese:
 yz_parquet_minigame: "PARQUET・マインスイーパ"
 yz_parquet_minigame_desc: "数字を手がかりに、10個の地雷を避けよう。初めてクリアするとリノとツバサが加入し、二人の昼を迎えます。"
 yz_parquet_open_table: "マインスイーパに挑戦 / 再開"
 yz_parquet_open_table_desc: "初級：9×9、地雷10個。最初のマスと周囲は安全です。安全な71マスをすべて開くとクリア。\n\nクリアごとに政治力5を獲得し、回数制限はありません。このキャンペーンで初めて挑戦をクリアすると、リノとツバサが加入し、二人のスーパーイベントが流れます。加入とスーパーイベントは一度だけです。\n\n閉じても進行状況は残ります。中核サークルのフリープレイと切り替えると、新しい盤面になります。"
 yz_parquet_debug_table: "テスト：固定の挑戦盤面を開く"
 yz_parquet_debug_finish: "テスト：マインスイーパをクリア"
 yz_parquet_debug_finish_desc: "通常のマスを開く処理でクリアし、初回の加入とスーパーイベントを確認します。デバッグ専用。"
 yz_minesweeper_freeplay_tt: "マインスイーパを開く"
 yz_parquet_handover.0.t: "ミニゲームで遊ぶ？"
 yz_parquet_handover.0.desc: "定番のマインスイーパで遊んでみませんか？9×9の盤面に地雷が10個。最初の一手は安全です。\n\n遊ぶ場合は、ディシジョンの「PARQUET・マインスイーパ」から始めてください。クリアごとに政治力5を獲得します。初めて挑戦をクリアするとリノとツバサが加入し、二人のハッピーエンドを迎えます。\n\nゲームをスキップして、二人を直接迎えることもできます。"
 yz_parquet_handover.0.a: "遊ぶ！ディシジョンから始めよう。"
 yz_parquet_handover.0.b: "今回はスキップして、二人を迎えよう。"
