 yzl_history_brief: "§L2026.9.10§!\nRIDDLE JOKER 第2段階\n§L2026.9.1§!\nRIDDLE JOKER 第1段階\n§L2026.8.30§!\nアトリ：結婚とエデン"
 yzl_history_content: "§W更新履歴§!\n§g新しい順 · 10 件§!\n\n§L2026.9.10§!\n§WRIDDLE JOKER 第2段階§!\n\n• 諜報員Levy 9とLevy 6を追加。Levy 9の採用後にイデオロギー宣伝作戦が解禁。\n• 核心圏の再選択にかかる時間制限を撤廃。\n• 隠し要素を追加し、複数の不具合を修正。\n• 一部の常時判定を減らし、動作性能を改善。\n\n\n§L2026.9.1§!\n§WRIDDLE JOKER 第1段階§!\n\n• RIDDLE JOKERの既存キャラ特性を刷新。羽月・あやせ・七海の顧問能力を調整し、茉優を理論家として追加。\n• あやせ・羽月・七海・茉優に将軍スキルを追加し、研究所の星幽能力強化特性を調整。\n• 動的な開幕演出とディシジョン背景を追加。\n• 芳乃の工業債券システムを更新。\n• CIALLO局にラッパを吹く機能を追加。\n• 自走砲に関する変更を差し戻し。\n• テキストと隠し要素を追加し、複数の不具合を修正。\n\n\n§L2026.8.30§!\n§Wアトリ：結婚とエデン§!\n\n• アトリの結婚ディシジョンと結婚イベントを追加。\n• アトリのエデン開発ディシジョンを追加。\n\n\n§L2026.8.11§!\n§W多言語化と処理の最適化§!\n\n• 式部茉優が科学者として正しく生成されない問題を修正。\n• 柚子キャラの捕虜化防止機能が全将軍に適用されていた不具合を修正。\n• 英語・日本語のローカライズを追加。\n• ディスク使用量を削減し、コードの処理を最適化。\n\n\n§L2026.8.2§!\n§W天色＊アイルノーツと軍事改革§!\n\n• 天色＊アイルノーツの既存特性を刷新。一部の強すぎる将軍を調整し、ティアを軍事顧問として追加。\n• 柚子社軍校に軍事改革コンテンツを追加。\n• 工業企業「牙と爪の獣亭」を追加。\n• 将軍募集UIを移動可能に変更。\n• 天色＊アイルノーツの開幕BGMと画像を変更。\n• コードの処理と動作安定性を改善し、複数の不具合を修正。\n• テキストと隠し要素を追加。\n\n\n§L2026.7.4§!\n§WDR刷新とMD装備への対応§!\n\n• DRの既存特性を刷新。「吸血鬼部隊」の陸軍精神と吸血鬼キャラのスキルを追加。\n• 美羽を顧問、大房ひよりを将軍として追加。as:9nineの如月結那を隠し将軍・軍事顧問として追加。\n• 隠し要素を調整し、海軍将軍の一括募集からグループ管理者キャラを除外。\n• 柚子の製造会社がMillennium Dawnの装備に対応。\n• DRの開幕BGMと画像を変更し、不具合を修正。\n\n\n§L2026.6.14§!\n§W千恋＊万花とキャラ専用決議§!\n\n• 千恋＊万花の既存特性を刷新。ムラサメ・芳乃の顧問と指導者能力、茉子・ムラサメの軍事顧問能力を調整。\n• 柚子の陸軍精神2種とムラサメのパフェディシジョンを調整。\n• 結婚相手が負傷した際に解禁される復讐ディシジョンを追加。\n• 虎太郎と赤城の2キャラクターを追加。\n• ぶらばん！のキャラ特性を補完し、エビを軍事顧問として追加。\n• アトリの能力値を調整。\n• 柚子社軍校に習熟度を獲得するディシジョンを追加。\n• 芳乃の工業化における資源採掘ディシジョンの産出量を増加。\n• ミヤコの徴収、春風の「天意」、ルリの「動物の友達」ディシジョンを追加。最後のものは象騎兵の編制を獲得可能。\n• 千恋＊万花の開幕BGMと画像を変更。テキストを補完し、隠し要素を調整、不具合を修正。\n\n\n§L2026.6.8§!\n§W佐奈の誕生日と結婚後の交流§!\n\n• ロード画面を佐奈の誕生日イラストに変更。\n• 結婚後の交流UIを追加。最初の対象は佐奈。\n• 佐奈の自動誕生日ディシジョンと新スキルを追加。\n• 不具合を修正。\n\n\n§L2026.5.9§!\n§WサノバウィッチとBMIの刷新§!\n\n• サノバウィッチの既存特性とBMIを刷新。1日の待機時間を撤廃し、同日中に複数回使用可能に。\n• 寧々・めぐるの政府顧問能力、めぐる・憧子の軍事顧問能力を調整。\n• 工業企業「超自然研究所」と紬の核心圏を追加。\n• 寧々・紬のスキルと寧々の指導者能力を調整。\n• 起爆装置支援中隊と車載起爆装置の能力値を調整。\n• サノバウィッチの開幕BGMと画像を変更。隠し要素を調整し、不具合を修正。\n\n\n§L2026.4.29§!\n§W海軍標準化と数値修正§!\n\n• 海軍標準化ディシジョンを追加。\n• 一部キャラの能力値を調整し、数値の誤りを修正。\n• 不足していたテキストを補完し、隠し要素を追加、不具合を修正。\n• ガチャでのスーパー佐奈の出現確率の異常を修正。"
