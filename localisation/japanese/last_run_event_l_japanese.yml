l_japanese:
 ##ハチロクイベントチェーン
 ASHC_event.1.t: "線路の上の人形？"
 ASHC_event.1.a: "起こしてみよう"
 ASHC_event.1.d: "研究所の建設が完了した後、茉優と寧々は鉄道技術の研究中に一体の鉄道人形（レイルロオド）を発見した。二人はこの鉄道人形をあなたの執務室に運び込んだ。好奇心旺盛なあなたは、この特別な人形を目覚めさせることにした。\n（8620鉄道会社の表示には茉優と寧々の両方をリクルートする必要がある）"
 ASHC_event.8: "目覚めた八六"
 ASHC_event.8.a: "さて……何をしようか"
 ASHC_event.8.d: "その後、彼女が私の執務室で目覚めた。私はすぐに手にしていた書類を置き、好奇心に駆られて彼女の素性を尋ねた。\n「私はハチロク、旧帝国鉄道8620形蒸気機関車専用の鉄道人形（レイルロオド）です。あの……よろしくお願いします、マスター」少女は落ち着いた声で答えた。\n「鉄道人形か……」私は目の前の少女を少し驚きをもって見つめた。これほど完璧で、涙さえ流せる人形を今まで見たことがなかったからだ。そして何より、可愛い！この世界では本当に特別な存在だ。\n気持ちを整えて、私はハチロクに尋ねた。「ハチロク、何かやりたいことはあるか？」\nハチロクは期待に満ちた目で私を見つめて言った。「それでは……マスターは8620を再び線路の上で走らせてくれますか？それから、飲み水と石炭をください」\n8620……あの壊れた機関車のことか？御一夜から運んできてしばらく経つ。鉄道人形まで付いてくるこの機関車が、いったい何が特別なのか、私も興味があった。\n私は部下に石炭と水を持ってこさせた。彼女はそれらをすべて口にし、それから私に8620蒸気機関車の青写真を手渡してくれた。\n「マスター、私の機関士になってくれますか？」\n「ああ、もちろん。ハチロクに責任を持つのは俺の義務だからな」そう言って、私は彼女の手を引いた……"
 ASHC_event.8.t: "行こう、8620に会いに"
 ASHC_event.9.a: "今は忙しい、後回しにしよう"
 ASHC_event.10.t: "8620の修復計画"
 ASHC_event.10.d: "8620が保管されている機関車庫に着くと、ハチロクの期待と複雑さが入り混じった表情に気づいた。彼女は扉が半開きのうちから中に入っていった。私は部下たちに、まだ庫内に入らないよう合図した。\n一人でいると、ハチロクが巨大な蒸気機関車の横でぼんやりと立っているのが見えた……えっ？ハチロクが泣いている？！私は急いで近づいて様子を見た。胸が痛む思いでハチロクを見つめていると、しかし私が口を開く前に、ハチロクは涙声で言った。\n「8620……もう、こんなに壊れてしまっているんだね……」ああ……この機関車は、彼女自身でもあるんだ……事故の日から今日ここに運ばれてくるまで、この機関車が何を経験してきたのか、想像もできない。心の中でそう思いながら、ある決意が私の中で燃え上がった。\n私はハチロクに力強く言った。「ハチロク！しっかりしろ！泣いても何も解決しない！俺たちは8620を蘇らせるためにここに来たんじゃないのか？それとも……ハチロクは自分の手で殺してしまいたいのか……」\n「いや！」私がそう言うと、ハチロクは沈んでいた表情を引っ込め、私に応えた。もちろん、その答えは嬉しかった。だが、それはまだ第一歩にすぎない。私はハチロクの意志を見なければならなかった。少し声を張り上げて、私は続けた。\n「ならば、まず立ち上がることから始めよう！今度は助けない。一人で立ち上がるんだ」\n「わかった……」彼女は立ち上がろうとしたが、また倒れた。再び立ち上がったが、また倒れた。私は駆け寄って抱き起こしたくてたまらなかったが、意志の力は自分で鍛えるものだと分かっていた。\n何度も試みた後、ハチロクはようやく、苦労しながらも私の前に立った。思っていたより早かった。どうやら感情をうまく整理できたようだ……それだけで十分だ。\n私は手を伸ばしてハチロクの小さな頭を撫で、それから外で待っている部下たちに合図を送った。\nその時、ハチロクは私を見て尋ねた。「マスターはどれくらいの時間をかけるつもりですか？」"
 ASHC_event.10.a: "全力で機関車修理に専念！"
 ASHC_event.11.a: "手元の資源が少ないし、他の建設もあるし、ゆっくりやろう"
 ASHC_event.12.t: "8620の鉄道修繕と技術的難題"
 ASHC_event.12.d: "修復作業の途中で、ハチロクは私に言った。「マスター、8620を直すだけでは足りません。鉄道の修復も必要です……」「わかってる」私は遮り、部下に巡回員を何人か募集するよう命じた。また、修繕箇所をより直感的に把握するために、私はハチロクを郊外に連れて行った。その時……車庫から人が来て、8620のデータの一部が空白だと知らせてきた……\nハチロクも私も驚いたが、ハチロクが先に反応した。「うーん……私の体の性能はまだ限られていて……8620の詳細データを提供できません……ごめんなさい……」\n「それは後にして、ハチロク、先に戻ろう」私はハチロクの手を取って、急いで車庫へと引き返した……\nしかしハチロクは私よりもずっと速く走り、私よりも焦っていた。車庫に戻ると、ちょうど退勤時間で、私は思わず口にした。「また一人ぼっちになっちゃってるね……」しかしハチロクはそれを聞いてさらに感情が高ぶり、自分のもう半分に向かって絶えず呼びかけた。\n「ずっと……こんなふうに……ここにいたの……？」\n8620は応えないようだったが、ハチロクは自責の念に駆られて言った。「全部私のせいで……お前をずっと……独りぼっちにさせてしまった……」一筋の涙がハチロクの頬を伝った。私は痛ましい思いでハチロクを見つめ、そして彼女の涙は雨のように溢れ出した。\n「でも私は……」私は静かにハチロクの後ろに回り、彼女の小さな体を抱きしめた。彼女が気持ちを落ち着けると、\n私は優しく言った。「俺はお前のマスターだ。8620を必ず直すと約束しただろう。必ず終点にたどり着こう」しかしハチロクをなだめることはできたが、さて、次は何をすべきか？何しろ科学技術のほうは……"
 ASHC_event.12.a: "寧々と茉優のところから科学者を何人か呼び寄せよう！"
 ASHC_event.13.a: "やっぱりやめておこう……"
 ASHC_event.14.t: "出発！8620！"
 ASHC_event.14.d: "数日後、寧々が一通の修理計画書を私に手渡した。私は部下にすぐに計画通り作業を進めるよう命じた。ハチロクはどこかで物音がするたびに駆けつけて見に行き、自ら指導もしていた。\nまあ、それも理解できる。何しろハチロクは多くのことを経験してきたのだ。数え切れないほどの手によって、8620は……あとは水を入れるだけになった。ガイド通りに操作すれば、問題はないはずだ。\nしばらくして、外部の準備作業が完了すると、ハチロクと私は運転台に向かった。私も待ちきれずに投炭用のスコップを手に取ったが、ハチロクが私の手を引いて言った。「まだダメですよ。まずは重油と水です」私はスコップを置き、鞄からハチロクの運転体（ドライバーユニット）を取り出した。操作盤を交換し終えると、ハチロクはゆっくりと目を開き、真摯な眼差しで私に言った。「ありがとう……」「まあ……お礼を言うにはまだ早いさ」私は優しくハチロクに言った。ハチロクも笑った。「えへへ……それもそうだね……」しかし万全の準備が整った今、私はハチロクを連れて運転台に戻った。\nそれからハチロクは私にマッチ箱を一箱手渡した。私は一本のマッチを取り出し、しばらく見つめた。何か神聖な感覚があったのだろうか？\nまだ考え込んでいるうちに、ハチロクが私に言った。「全工程正常です。8620に点火してください」私はすぐにマッチを擦り、その瞬間、使命感が突如として爆発した。マッチを火格子上のぼろ布に投げ入れると、すぐに燃え上がった。スコップを手に取り、ハチロクの説明によれば、最初の頻度は20秒に一掬いとのことだった。\n汽笛が鳴り響き、皆の期待に応えるかのように——計器盤、排水コックなどの設備を点検し、問題がないことを確認してから……「出発！」この出発の言葉は、私とハチロクが同時に発した。\n皆の期待の中、8620はゆっくりと動き出した。動輪が何回転も何回転もすると、永く眠っていた8620がゆっくりと蘇った。走行距離は長くなかった——何せまだ試験段階だからだ——しかし起点にも終点にも歓迎の横断幕が掲げられ、我々の修復計画の成功が宣言された。私の心は喜びでいっぱいだった。\nハチロクの目は潤み、彼女は顔を上げて私を見つめた。私が反応する前に、ハチロクは私を抱きしめ、顔を私の胸に埋めて言った。「今回は本当にありがとう……えへへ、でも、マスターに何かハチロクがお手伝いできることはありますか？」\nそう言えば、最近はずっと8620に集中していて、内政は他の人に任せっきりだった。政府の人手は足りないわけではない、そこで……"
 ASHC_event.14.a: "数日後、ハチロクを参謀本部に連れて行こうか？"
 ASHC_event.15.a: "ハチロクがそばにいてくれるだけで十分だ！"
 ASHC_event.16.a: "数日後、ハチロクを外務省に連れて行こうか？"
 ASHC_event.17.t: "未来へ進め！"
 ASHC_event.17.d: "ハチロクの担当する職位を決めた後、寧々と茉優の支援のもとで彼女は自分の鉄道会社を設立した。しかし国務が多忙を極め……ハチロクと過ごす時間もずいぶん少なくなってしまった……\nハチロクは私が眉をひそめているのを見て、コップ一杯の水を差し出し、それから優しく私に言った。「マスター、これらの書類は私もある程度目を通しています。一緒に処理しましょうか？」\n私はよく考えたが、ハチロクにそのような経験はなかったはずだ。そこでハチロクを内閣に連れて行き、会議のたびに彼女に傍聴させた。\nしばらくして、機関車の運転台の中で、私は考えた。何しろ8620を直したのは始まりにすぎない。これからは……美しい未来に向かって走り出すのだ！\nだから、ハチロクの提案に対して、こうしようか……"
 ASHC_event.17.a: "私の右腕になってくれ！"
 ASHC_event.18.a: "現状維持でいい（一年後、再びこの決議が表示される）"
 ASHC_event.19.t: "指導者に就任"
 ASHC_event.19.d: "8620の修復後、ハチロクの性能はさらに向上した。あなたはハチロクのために多くのことをしてきた。今度は、ハチロクにあなたを助けてもらう番だ！"
 ASHC_event.20.a: "久しく試練を受けた共産党員"
 ASHC_event.21.a: "自由民主主義の擁護者"
 ASHC_event.22.a: "いっそ奮闘してみるか？"
 ASHC_event.23.a: "すべてをハチロクに委ねる"
 ASHC_event.30.a: "やっぱりやめておこう"
 baliu_hide: "8620修復を中心としたハチロクルートを開始。後に指導者になることも可能。"
