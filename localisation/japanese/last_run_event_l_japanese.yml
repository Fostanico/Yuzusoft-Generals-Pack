 ##ハチロク特性
 baliu_desc: "まあいいや……ハチロクはもう到着している。御一夜最強のレイルロオド、人車一体の境地に達した機関士、食事の代わりに石炭だけで大丈夫という最高の身体条件〜お前のハチロク、推して参る！ただし今回ハチロクが処理すべきことは、かつての市長ポーレットさんが処理していたよりもずっと多い。だからこの国家という機関車の副機関士として、偉大なる操舵手ハチロクの足を引っ張らないようにね。あと一つ——巨大ハチロクは彼女の運転形態であって、スタンド使いではないからな。"
