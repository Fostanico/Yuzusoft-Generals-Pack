 yzcr_help_tt: "ルートガイドを開く／閉じる。右クリックで加入画面を閉じる。"
 yzcr_choice_sprite: "GFX_yzcr_senren_choices_ja"
 yzcr_help_body: "芳乃：釣り > やっぱダメ > 朝武さんを安心させる。\n茉子：どうだろ？ > 山菜。\nムラサメ：単独行動 > 頭を撫でてあげる。\nレナ：可愛いと思う > 釣り > そういうことなら……\n小春／芦花：先にメインヒロインを迎え、正直に言う＋小春の言葉を信じる。他の成立したルートを避け、最後に笑顔を選ぶ。\n廉太郎への選択肢は「釣り」のときだけ。\n他の選択は自由。\n新規加入は1人につき政治力10。加入済みなら消費なし。"
 yzcr_rj_choice_sprite: "GFX_yzcr_riddle_choices_ja"
 yzcr_rj_background_sprite: "GFX_yzcr_riddle_backgrounds"
 yzcr_rj_help_body: "あやせ：学生会室 > いつも通りに > 茉優先輩。\n七海：七海にも声をかける > 七海の水着 > ちゃんと言い直す > 研究室。最後は自由。\n羽月：二条院さんの水着 > 二条院さん。\n茉優：検証を続ける > 研究室 > 茉優先輩。\n千咲：本作のメインヒロインを迎えた後、七海の水着 > 話題に切り込む > 壬生さん。七海ルートを避ける。\nノーマルEND：あやせ・茉優・羽月・千咲を迎える。\n「コンプレックス？」は本作のメインヒロイン加入後のみ。\n研究室を選ぶと食事の選択を省略し、「たまには別の寮に」として扱う。\n新規加入は1人につき政治力10。加入済みなら消費なし。"
