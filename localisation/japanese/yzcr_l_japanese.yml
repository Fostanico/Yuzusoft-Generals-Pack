 yz_choice_recruit.1.t: "加入方法を選ぶ"
 yz_choice_recruit.1.desc: "原作の選択肢ルートを体験しますか？\n\n従来の方法：SDキャラをクリックして加入。\n新しい方法：原作の選択肢を進み、ルート完了後に加入。\n\n今ゲームで記憶する設定は千恋＊万花とRIDDLE JOKERに共通で、セーブにも残ります。加入費用と効果は従来通り。小春と芦花の新ルートでは本人が直接加入します。"
 yz_choice_recruit.1.a: "従来のSDクリックで加入"
 yz_choice_recruit.1.b: "新しい選択肢ルートで加入"
 yz_choice_recruit.1.c: "従来の方法を今ゲームで記憶"
 yz_choice_recruit.1.d: "新しい方法を今ゲームで記憶"
