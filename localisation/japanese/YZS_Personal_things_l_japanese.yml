#绫濑事件
 ayase_event.1.t: "人生、ただ初めての出会いの如く"
 ayase_event.1.d: "その日の午後は、空は澄み、雲はのどかで、陽射しはちょうどよく優しかった。あやせの澄んだ瞳には私の姿が映り込み、桃李の年頃の彼女は花のように微笑んでいた。\n私はたくさんのことを思い出した。彼女と出会ったときから。\n三司あやせという女の子を初めて見たのは、橘花学院の宣伝映像だった。夜八時のゴールデンタイムの昼ドラの合間に流れる広告——テレビの中で、はっきりと笑う女の子が新しい学院の隅々まで紹介し、最後に自己紹介をした。「三司あやせです。橘花学院をどうぞよろしくお願いします」\n三司あやせという名前はインターネットでも有名だった。最初は天才少女として名を馳せ、彼女についてのネットの話題は「天才少女・三司あやせが橘花学院に通うことをどう思うか」が多かった。しかし後になって、ネット民の議論の方向はどんどんおかしくなり、最後には「天才少女・三司あやせの第二次性徴の発育不良をどう見るか」になった。しかしネットはすぐにこの話を忘れ、次のホットトピックは、朝武家の巫女の後継者が中央舞踊学院で学んだことがあるかどうかだった——彼女の踊りがあまりに上手すぎたからだ。\nまさかここで彼女に会うとは思わなかった。あまり気にせず、テレビを消して布団に潜り込んだ。するとその時、親父がドアを開けて、ひとつの知らせを持ってきた。\n「お前の父ちゃん、鷲逗市に転勤になった。今月中に荷物をまとめて引っ越す準備をしろ」\n鷲逗市は辺鄙な場所ではない。元々はただの科学技術イノベーションの中心地で、ここ数年でようやく発展してきた——理由はおおよそシリコンバレーを参照すればいい。橘花学院は鷲逗市の二環路のそばにあった。大きな荷物を抱えて転入手続きに行くと、出迎えてくれたのは三司あやせだった。橘花学院の環境はとても美しく、校舎と研究棟はキャンパスの三角形の一角に独立し、残りの土地には緑の木々と色とりどりの花が植えられ、小道が曲がりくねってその間を縫っていた。木漏れ日はふるいにかけられたようにキラキラと地面に落ちた。\nあやせにときめいたのは、絶対に入学式の日からだと思う。\nあの時、彼女が前を歩き、私は後ろをついていった。微風が物憂げに吹き、木陰がさらさらと揺れ、花びらがひらひらと舞い、佳人を一層際立たせた。彼女は耳元の髪をそっと払い、舞い散る花の海の中で振り返り、口元に甘い弧を描いた。「ここ、とても綺麗なの。景勝地の中で学ぶのは、ひとつの楽しみよ」\n私はときめかない理由などないと思った。"
 ayase_event.1.a: "アヤちゃん、こんにちは"
 ayase_event.1.b: "これ、何層重ねてるの...（この選択肢であやせ線をスキップして原版あやせを獲得）"
 ayase_event.2.t: "とんでもないものを見てしまったようだ"
 ayase_event.2.d: "だが、ある夜、私はあやせのSide Bを見てしまったようだ。\nそれは真夜中のこと。私は寮の門を抜け出し、任務終了後に校外の屋台焼き鳥で、学食に飽き飽きした胃袋を思い切り慰めようとしていた。ところが塀に登ったとき、校外の路地で二つの人影が絡み合っているのが見えた。好奇心が私をゆっくりと近づかせた。\nあやせは、今夜なぜ校門を抜け出したのかを深く後悔していた。今まさに、屋台焼き鳥ひとつのせいで人生が早期終了しそうになっている。満足して再び塀を越えて学校に戻ろうとしたまさにその時、酒臭いチンピラが短いナイフを持って闇の中からふらふらと飛び出し、あやせを縛って金を要求しようとした。焼き鳥の屋台は、取締りから逃げる速度で一瞬のうちに消えた。あやせがもがいている間、酔っ払いは足を取られてよろめき、ナイフが服を裂いて、あやせの左胸に突き刺さった。\n私は隅からレンガ型の睡眠薬を拾い上げ、そのチンピラに服用させようとしたその時、思いがけないことが起こった。ナイフはあやせの左胸の服にめり込んでいた。顔色を青くしたあやせは、その場に崩れ落ちた。チンピラはまだ反応できずにいた——私は先に彼に薬を服用させ、彼は安らかに眠りに落ちた。\n私は慌ててあやせのそばに駆け寄り、傷口を調べた。不思議なことに、傷口からは一滴の血も出ていない。そっと抜こうとすると、ナイフが何か硬い素材に突き刺さっているのを感じた。首をかしげていると、あやせが息を吹き返した。私は九死に一生を得た安堵の言葉ではなく、脅しにも近い問い詰めを聞いた。「もう遊び足りた？！」\nナイフが何かを引き連れて抜けた。丸いシリコン素材……胸パッド？胸パッドだ！\n私はしばらく彼女と見つめ合った。「ネットでお前がぺったんこ姫って言われてたの、デマじゃなかったんだな」\n「うっさい！！！！！！」"
 ayase_event.2.a: "ちょっと待って三司さん、まず落ち着いてくださいってば！"
 ayase_event.3.t: "これでわかった"
 ayase_event.3.d: "それ以来、毎日昼にあやせが猫に発電している様子を見に行くのが、私の生活に欠かせない楽しみの一つになった。しかし長く見ているうちに不思議に思った。あやせ、お前はどうして自分で猫を飼わないんだ？\nあやせはこの話題になると、顔を泣きそうなほどに曇らせた。「私も猫と近くで触れ合いたいの。でも猫は私を見るだけで逃げちゃうのよ。四本の小さな脚をばたばたさせてあっという間に消えちゃうの。幽霊を見た時より速いのよ」\nちなみに、これは私が初めて、陶酔と悲しみが同時に一人の顔を占めるのを見た瞬間だった。\nしかしあやせの話によれば、この猫はただの猫ではない。実地調査が必要だ。その日の昼、あやせは炎天下の中、疑問でいっぱいの私を連れて、学校の猫先輩を探しに行った。\nそして猫先輩は逃げた。振り返りもせずに。四本の小さな脚をばたばたさせてあっという間に消えた。幽霊を見た時より速く。この点に関して、我らの三司は誇張していなかった。\nしかし同級生よ、鏡を見て自分の表情を確認してみないか。もしかしたら地域の風習が違うのかもしれないが、こっちでは猫を撫でる前に、幽霊より恐ろしい形相を披露する必要はないんだ。全身から放たれるその殺戮の瞬間の気配を猫が見たら、逃げない方がむしろおかしい——うつ病で生きる気をなくしてる猫だけだ。\nあやせは私の言葉を聞いて、深く納得し、そして汗だくになるまで私を殴った。"
 ayase_event.3.a: "ご注文は東京大学医学部附属病院の至尊套餐でよろしかったですか？はい———承りました！！！"
 ayase_event.4.t: "知られざるもう一つの顔"
 ayase_event.4.d: "翌日、私は先生に言いつけられて生徒会に資料を届けに行った。昼時、学生たちがこぞって飯を奪いに行く隙に、私は数十冊の書類を抱え、先生から無理やり借りた鍵で苦労してドアを開けた。\n「カチッ」という軽い音とともに、私は体を横にしてドアをくぐり、書類を置き、手を叩いてカップ麺を買いに行こうとした——そこで三司あやせを一匹発見した。我らの生徒会長・三司さんはスマホを抱え、口の端からよだれを垂らし、ぼんやりと画面の中のサイバー猫に見入り、全身からピンク色の泡をふわふわと漂わせていた。私は笑うべきか泣くべきか分からなかった。入学したばかりの頃は、手の届かない女神に見えたのに、どうして今こんな姿に成り下がったのか。どうやら、この雰囲気に応えるためには悪戯を仕掛けるしかないようだ。\n「三司さん、スマホをこちらに見せなさい」校幹部の声が背後から響き、あやせは体をびくっと震わせ、ガタンとテーブルを倒しそうになり、椅子から弾けるように飛び上がり、半回転して背後を向いた——そこにいたのは、笑いをこらえきれない悪党が一人、彼女をからかっていた。\nこの顔は見覚えがある。昨夜もお前に笑われたんじゃなかったか？復讐はしないのではない、時が来ていないだけだ！\n三司は私の体に無視できる程度のダメージを必死に与えながら、「貧乳は希少資源！！！おっぱいは正義！！！」などと口の中でよく分からないことを呟きつつ、全力で拳打脚踢を繰り出し、物理的に私の記憶を消去しようとしていた。しばらくして、あやせは疲れて椅子にぐったりと倒れ込み、私に聞いた。「ねえ、絶対に言いふらさないでよね？口は悪いけど、あなた、そんなに趣味悪くないでしょ？」「じゃあ、交換条件として、なぜそんなに猫が好きなのか教えろ」\n「はぁ…」あやせは困り果てた様子で言った。「じゃあ聞くけど、猫は可愛い？」「可愛いね」「じゃあ聞くけど、可愛いものは愛されるべきでしょ？」「そうだね」「じゃあ聞くけど、私は猫を好きになるべき？」「そうだね」「じゃあ聞くけど、なんでそんなこと聞くの？」\n「だって、猫を見ただけで生活不能な奴みたいになって、口の端のよだれを今も拭かない人なんて、滅多にいないからな」"
 ayase_event.4.a: "お————ま————え————に————は————関————係————な————い！！！！！"
 ayase_event.5.t: "これわ子猫"
 ayase_event.5.d: "再び出てきたとき、あやせはどこから調達したのか分からない猫耳をつけ、腰の後ろにはふわふわの猫しっぽが生えていた。今にも爆発しそうなほど真っ赤な両頬の間から、消え入りそうな声が絞り出された。\n「にゃ…にゃんにゃん～」\n私は呆然とした。誰が見ても、この光景の前では思考も行動も停止する。あやせは逃げるように奥の部屋へ戻り、しばらくしてからドアに張り付いて聞いてきた。「か…か…可愛い…？」\n肯定の答えを得たあやせは、ドアの向こうでほっと息をつき、そしてまた慌てて説明を始めた。「猫を理解するには、まず猫になるべき」とか、訳の分からないことばかり言うものだから、二人とも笑い出し、寮の中は愉快な空気で満ちた。笑い終わると、あやせは明日一緒に猫カフェに運試しに行こうと約束してきた。"
 ayase_event.5.a: "「明日こそ猫に触ってやる！」"
 ayase_event.6.t: "これはもはやただのホラーゲームではない"
 ayase_event.6.d: "次第に空気が冷えてきて、鷲逗に秋が来た。あやせも以前ほど騒がしくなくなり、活動範囲は次第に生徒会室と寮に固定されていった。ある貴重な週末の早朝、あやせから死に物狂いの着信の連打が来た。電波の向こうの声は恐怖に満ちていた。「暁くん……は、は、早く来て！！！味方は？味方はどこ？助けて！」\n私は息せき切ってあやせの寮の扉の前に駆けつけた。息を整える間もなく、一団の布団が先に私にドアを開け、しゅばっと私を部屋の中へ巻き込んだ。\nあやせは布団にくるまって私の背中に縮こまり、震える指を半本差し出した。彼女の指す方を見ると、大きなパソコンの画面には『バイオハザード4 蟲版』が映っていた。「怖くてできないの。やってよ、やってよ、やってよ……」あやせは今回は布団から半本の腕を伸ばし、私の服の裾を掴んでひたすら懇願した。\nまあ、新しいゲームをタダで遊べるのはこちらとしても嬉しい。適当に挨拶を交わしてどっかり座り、バリバリと撃ち始めた。あやせはおとなしく布団にくるまったままそばに張り付いていた。刺激的な場面が出るたび、隣の布団からは激しい震えが伝わってきた。途中で、一つ疑問が浮かんだ。「あやせ、なんで怖くてできないゲームを買ったんだ？」あやせは布団から出した半個の頭を傾げた。「猫が出るって言うから、そんなに怖くないと思ったの。あ、そうだ、その猫を見つけてくれない？お願い、お願い、お願い…」\nおい姐さん、猫が出るのは確かに猫が出るさ。でも、このゲームのタイトルをもう一度見てみないか？俺の考えでは、このゲームと猫の関係は……まあ、ほど遠いと思うんだが。\n結局、あやせの願いのため、私は大小様々なモンスターと日が暮れるまで死闘を繰り広げ、ようやく主人公の頭に猫耳を一対付けてやった。半死半生の自分を引きずって帰ろうとしたその時、あやせが私を引き止め、すごいものを見せてやると言った。そしてまた奥の部屋に引っ込んで、しばらくごそごそして……"
 ayase_event.6.a: "彼女は何を企んでいるんだ？"
 ayase_event.7.t: "異存なし"
 ayase_event.7.d: "家に帰ってひとしきり騒いだ後、あやせは振り返って太った大きなオレンジ猫を抱き上げ、顔に悪戯っぽい笑みを浮かべ、三毛猫と知恵比べをしている私に向かって叫んだ。「ねえねえ、早く目をつぶって、早く早く、私があなたに何をしてもいい権利を、今すぐ使うから！早く早く早く！」\nまあいいだろう。おそらくどの猫かを私の頭の上に載せる悪戯だろう。観念して目を閉じると、もふもふとした気配がゆっくりと左頬に近づいてくるのを感じた。突然、右頬に少し湿った柔らかい感触が訪れ、軽い「ちゅっ」という音とともに跡形もなく消えた。\n目を開けると、あやせが猫を抱いて隅っこに隠れ、こっちを見てこそこそ笑っていた。「なああやせ、猫を私の顔に貼り付けるってどういう意味だ？一匹は左頬に貼り付けて、もう一匹は右頬を舐めたぞ」あやせはますます嬉しそうに笑い、顔にも赤みが増した。「ぺたぺたしたのは全部この大きなオレンジ猫の仕業よ。もう一匹の猫が誰かなんて、私、知らないわね」\nちっ、まだ白状しないのか。私はあやせの柔らかい頬に「有形の大手」を伸ばし、思い切りこねくり回してやった。「早く白状しろ！さもないとさらに酷い刑が待ってるぞ！」まあ、あやせはこの刑を結構楽しんでいるようだった。本当に手の施しようがない。\nあやせが突然私の耳元に飛びついて囁いた。「あなたの右頬を舐めたのがどの猫か、教えてあげようか？」「言え」\n「あなたにこっそりキスしたのは、このニャンコよ」\nその夜は、空は澄み、雲はのどかで、月光はちょうどよく優しかった。あやせの澄んだ瞳には私の姿が映り込み、桃李の年頃の彼女は花のように微笑んでいた。\n私はたくさんのことを思い出した。彼女と出会ったときから。どうやら私は、こんなに騒がしい二面性のある奴がそばにいるのに慣れてしまったらしい。彼女は先生や同級生の目には模範的な生徒会長であり、猫に触れなくて半日悩むバカであり、最後にはこっそりキスをする猫に変身した。私は地面を三尺掘っても、彼女を拒否する理由は見つからないだろう。\n「次からは、こっそりしなくていいぞ。って、そんなに焦るなって、んん——」"
 ayase_event.7.a: "文句ある？文句あっても飲み込め！"
 ayase_event.8.t: "一日は二十年に等しい、猫を撫でる成功は目の前"
 ayase_event.8.d: "翌日の猫カフェの入り口で、私はあやせに何度も繰り返し言い聞かせた。「猫を見たら、まず深呼吸。深呼吸を十秒。十秒の間に顔の表情をコントロール。表情をあまり凶悪にしないこと。さもないと猫も店長も一緒に逃げちゃうから……」あやせは私をギロリと睨みつけ、そのまま直接ドアを押し開けた。\n猫を見た瞬間——しかも猫が群れで集まっている——あやせの呼吸は目に見えて荒くなった。私は仕方なく、彼女の腰の柔らかい肉をひとつまみし、あやせの黒化プロセスを見事に中断させた。あやせはまた私を睨んだが、どうも目つきが不自然だ？おそらくまた悪戯を企んでいるのだろう。\n「綾バアちゃん、我慢して、抑えて。後で私に何をしてもいい権利を一回やるから、どうだ？」「ダメ。三回に増やして」「何回でもいいけど、店ごとひっくり返すのだけはやめてくれ…」\nでは、三司さんは念願の猫に触れたのだろうか？もちろん触れた！実は彼女の体のほのかな香りは猫に大人気で、もう彼女は猫たちの三々五々のまとわりつきを享受していた。\nこうして、猫に囲まれながら、私たちは楽しく午後いっぱいを過ごした。あやせのしつこい懇願に耐えかねて、店長はしぶしぶあやせが猫を二匹抱えて家に帰って一晩過ごすことを許可した。\n「ありがとうございます！ありがとうございま…」言い終わらないうちに、一人と二匹が電光石火のごとく帰っていくのが見えた。私は店長と顔を見合わせ、ぷっと吹き出した。"
 ayase_event.8.a: "この子はどの面も可愛いな"
 ayase_event.8.b: "ようやく、猫が彼女に驚かなくなった"
 ayase_event.8.c: "彼女はやり遂げたんだ"
 ayase_event.9.t: "誓い"
 ayase_event.9.d: "授業、生徒会室でスマホをいじる、授業、寝る準備、週末は二人でゲーム——ありふれた日々があっという間に過ぎていった。また退屈な土曜の午後、あやせは私の体に半分ぐったりと寄りかかり、『宇宙大ロボット』は世界で一番つまらないゲームだと宣言した。私はあやせのぷっくりした頬をつまみながら聞いた。「なあ、世界のすべてのゲームに飽きちゃったら、お前はまだ俺のこと好きでいてくれるか？」\nあやせは私の体の上でより快適な体勢を探した。「そんなわけないでしょ。こっちに来て、天に向かって誓いなさいよ。私たち、ずっとお互いを好きでいるって」「いや、お前の罠にはかからないぞ」\n「ふふん」あやせは跳ね起き、悪戯っぽく笑いながら逆に私を床に押し倒した。「私はあなたに私を好きにさせてみせるわ。死ぬほど好きにさせて、あなたがよぼよぼのおじいちゃんになっても、『ばあさん』って呼びながら目にハートを浮かべさせるんだから！」言い終えると猛攻のキスの嵐。あやせが疲れて私の上にうつ伏せになるまで続いた。"
 ayase_event.9.a: "正直言って、彼女ならこの小さな目標を達成するのは全然問題ないと思う"
 ayase_event.10.t: "これからも、ずっとこのままで"
 ayase_event.10.d: "その時、春の風がそっと吹き、遠くから愛と感謝を運び、優しく彼女の長い髪をなびかせた。まるで母親の手があなたを撫でるように、そっと。花が芳しく蝶が舞い踊っても、胸の中の迷いはいまだ解けない。あやせと手を繋ぎ、何度歩いたか分からない木陰の小道を散歩する。初めてではないのに、なぜか胸が熱い。\n甘酸っぱい初恋も、騒がしい日常も、すべてのすべての眩しい輝きは、決して歳月に蝕まれない。あのほのかな香りを辿って、私の視線は無意識に少女に縛られた。優しい仕草も、甘い微笑みも、私の心の最後の強がりを打ち砕く——私はこんなにもあやせが好きだ。\n「あ、急がないと授業に遅れちゃう！」耳元に春風が届く。慕う人の響きだ。私は必死に正気を保ち、その光に向かって駆け出した——「今行く！」「ねえ、あなた、今日はなんだか変よ。まさか夜に一人で部屋にこもってこっそり……」含み笑いとともに、あやせはこっそり私の肩に頭を寄せ、すでに火照った私の心にまた薪をくべた。「お前の頭の中には、まともなことしか入ってないのか——」私は手を挙げて、彼女の額をそっと弾き、必死に動揺を隠した。\n「あいたっ、痛いわよ！」そう言うと、あやせは仕返しとばかりに、私の胸に向かって（本人は）思い切り拳を振り下ろした——我々は敵の装甲を貫けなかった！「ねえ、どうして心臓の鼓動がこんなに速いの？まさかシュタイリンと心臓内務部で遊んでるの？」からかうあやせは不思議そうに、ぼんやりと私を見つめた——ドキン！今にも爆発しそうな火照りが再び燃え上がった。無意識に、私は口を突いて出た。「だってお前が可愛すぎるからだよ！」\nまず一瞬呆け、次に疑念。「え？何て言った？」「聞き間違いかしら？」彼女の頬に赤みが浮かび、瞳の焦点が次第に散っていく——肩に伝わる震えを感じ取れた。\n「だから言ったんだ、PERFECTな三司さんが最———可———愛———だって！」勇気を振り絞り、自分の心を大胆にさらけ出す。芝生で怠そうにエサを楽しむ猫先輩も驚いた。言い終わってから、私はようやく自分がどれほどすごいことを口にしたのかに気づいた。\n「え？うー↑ん↓——ひゃっ……」おそらく神経回路が焼き切れたのだろう。あやせは途切れ途切れに呟き、荒く息をしながら——手の中の温もりがはっきりと感じられる。いや、滾るほど熱いと言うべきか。「バ————カ————！こんな場所でそんなこと言うなんて恥ずかしいんだから！」口ではそう言いながらも、あやせの嬉しさがはっきりと伝わってきた。ちょっと不適切かもしれないが、まあ、これが私の本心だ。隠し通すことこそ、互いの「好き」という気持ちへの冒涜だろう。\n終始無言で、ただ手を繋いでとぼとぼと歩いた。「あやせ」「うん？」「俺は本当にお前が好きだ。お前の頑固さも、強情さも、わがままなところも、お前のすべてが好きだ。お前だから好きなんだ。それが、俺が一番大切にしたい気持ちだ。『大好き』の気持ちは、永遠にFor Youだけだ」\n彼女の顔に一抹の甘さと優しさが浮かんだ。黙って聞き、黙って心に刻み、少女は何も言わず、ただ私に寄り添った。\n「でも、一つ訂正させて」\n「私の方があなたを好きなの」\n「いや、俺の方がお前を好きだ」\n「あはは、また冗談言ってる。明らかに私の方が好きでしょ」\n「あやせもなかなかユーモアあるな。明らかに俺の方が好きだぞ」\n「私よ！」\n「俺だ！」\n………"
 ayase_event.10.a: "指切りげんまん、我が志を明らかにする。"
#小字
 ayase_yes: "え？あやせルートをやりたくないって？\n無———理———だ———よ———ニャ〜"
 ayase_2: "誰がおっぱい・テイラーだって！殺してやるわ！！！\n\n"
 ayase_miaomiao: "にゃ……にゃんにゃん？！\n\n"
 ayase_3: "こ、この店は解約を受け付けておりません！\n\n"
 ayase_end: "これからの 二人の未来\n\nきっとずっと 添い遂げていく"
#民族精神
 ayase_love_0: "振り返るたび、花びらの舞うように美しい"
 ayase_love_0_desc: "気づけば、みんなの視線が私に集まっていた"
 ayase_love_1: "ねこ……へへ……neko……"
 ayase_love_1_desc: "猫が世界を支配する！"
 ayase_love_2: "指切りげんまん"
