 #魔宴
 ningning_corps_desc: "将軍紹介：綾地寧々は高校二年生で、主人公や海道秀明、仮屋和奏らと同じクラス。外見が可愛く、性格が優しく、人当たりが良いため、通う姫松学園で高い人気を誇る。\n寧々は実は魔女であり、自分の願いを叶えるために心の欠片を集めている。この秘密のせいか、寧々は学園に気心の知れた友達がいない。心の欠片を集める時、寧々は魔女服に着替える。魔女服は露出度が非常に高く、とてもエッチで、寧々はとても恥ずかしく思っている。契約を結んで魔女になった代償は、突然制御不能な発情が起こることで、発情後はオナニーしないと回復しない。寧々本人はこれに非常に悩み、恥ずかしさを感じている。\n寧々は超自然研究部の部長だが、秘密がバレないように他の生徒からの入部申請をすべて断ってきたため、部は一時廃部の危機に瀕した。物語の中で柊史が入部するまで、超自然研究部は長い間、寧々一人だけだった。超自然研究部とはいえ、普段の部活動は超自然とはあまり関係なく、訪ねて来た生徒にタロットカードなどで占いをしたり、話を聞いてアドバイスをして問題解決を手伝ったりする程度で、寧々もこれを利用して心の欠片を集める機会を探している。"
 Meguru_corps_desc: "将軍紹介：因幡めぐるは外見の装いが華やかで、軽薄な印象を与えるが、実はこの印象をあえて作っているのは、彼女が初めて姫松学園に足を踏み入れたからで、流行を追うようなこの姿で集団に溶け込もうとしたのだが、効果は今ひとつのようだ。また、彼女は自作の「ciallo」を挨拶によく使い、イタリア語のciaoと英語のhelloを組み合わせたものだと自称している。\nめぐるは明るく率直な性格だが、入学後すぐに大病で一週間休んだため、集団に溶け込むのが難しかった（同時に心の中にずっと解けないわだかまりを抱えている）。この状況を克服するため、超自然研究会に助けを求めた。\n実はめぐるは一人でゲームを遊ぶのが好きなインドア派で、『モンスターハンター』や乙女ゲーム、『DRACU-RIOT!』（OP終わりのおまけ）など、一人でも楽しめるゲームが好きだ。\nめぐるは寧々のような親しい相手には無我夢中にすり寄っていきたくなり、紬を女の子らしくおしゃれにしようと熱心に試みる。また、小悪魔属性のある女の子でもある。ただし「ぷやや」という表情をする時もあり、間抜けさを全開にする。"
 chou_corps_desc: "将軍紹介：椎葉紬は高校二年の二学期という変な時期に主人公のクラスへ転入してきた転校生。しかし可愛い顔と「鶏胸ではない胸」に似合わず、男子高校生の制服を着ている。男装は趣味ではなく、寧々の発情のようなもので、魔女になった代償である。女性の服を一定のポイント以上着ると、激しい嘔吐を引き起こして体に影響が出る。この点から言えば、椎葉自身は女装が可能なのだが、代償としてポイント消費の高い女性用下着は着られない。\n子供の頃、家系に遺伝する虚弱体質の「呪い」から逃れるため、家族に長期間男装を強いられた。そのため、椎葉の女装への執着はほとんど狂信的と言えるほどになっている。性格は優しく、柔らかい。日常生活や部活動では他人との衝突を極力避け、衝突した後も逃げたりごまかしたりしてやり過ごす。友人を非常に大切にし、赤城が寧々や相馬七緒らに、再び他人の心の穴を掏り尽くした元凶だと誤解された時には、柔らかい性格をかなぐり捨てて立ち上がり、赤城の弁護を試みた。もちろん、誰も信じなかったが。"
 Toko_corps_desc: "将軍紹介：戸隠憧子は学院の生徒会長として人望も高く、外見と豊満な体つきが相まって学院の高人気者となっている。綾地寧々が2年生のアイドル的存在なら、彼女は3年生のアイドル的存在だ。\nいつも笑顔を絶やさず、誰にでも優しく、理想の先輩である彼女は多くの生徒に崇拝されているが、実は人をいじめるのが好き。生徒会長としての手腕は一流で、教師たちからの信頼も厚い。"
 wakana_corps_desc: "将軍紹介：仮屋和奏は保科柊史の同級生であり、彼の数少ない異性の友人の一人。金髪のショートヘアで、小柄で可愛らしい女の子。相手の性別を気にせず接する、活発な少女である。\n相馬七緒の喫茶店Schwarz Katzeでアルバイトしている、元気いっぱいの女の子。親しい人を気遣うが、少し毒舌な一面もある。それでも、とても恥ずかしがり屋な面もあり、人前で自分を表現するのが苦手。父親の影響で最近ギターに夢中だが、表現が苦手なため他人の前で演奏するのは拒否している。"
 #千恋万花
 Murasame_corps_desc: "将軍紹介：ムラサメちゃんは神刀「ムラサメ丸」の管理者。ムラサメは生贄として「ムラサメ丸」の管理者となり、「穂織」の土地を守り、刀を抜いた主人公を主と認めている。主人公はムラサメのことをムラサメちゃん、小雨と呼ぶ。穂織の現地民が口々に「ムラサメ様」と呼ぶ中で、彼女だけが浮いている。\n数百年の存在であり、幽霊のような姿をしているが、自分が幽霊であることは否定している。普通の人はムラサメを見ることも触れることもできない。朝武家の血筋の人（芳乃と茉子）はムラサメを見ることができ、レナは欠片に長く触れていたため見ることができる。子供らしい一面と大人らしい一面があるが、基本的には子供らしい一面が多く、普段は元気で明るい女の子である。\n数百年生きているが、実はとても臆病で、幽霊や妖怪がとても怖い。朝武芳乃や常陸茉子と合流する際、歌を歌って勇気を奮い起こしたこともある。体がなく、食事も入浴もできないが、霊力を感じ取ることはできるため、神に捧げる酒や霊力のある温泉には気持ちよさを感じる。\n話し方は前作『サノバウィッチ』の赤城に似た、濃い古風な口調。キャラクターソングアルバムの表紙では、ムラサメのそばの花は赤い彼岸花（マンジュシャゲ）で、花言葉は「限りない愛」——ムラサメの刀の魂としての身分を示唆しているのかもしれない。"
 Mako_corps_desc: "将軍紹介：常陸茉子の家系は代々朝武家に仕えてきた。（町の最西端に住み、両家の行き来は良い運動だと自負している）巫女姫の護衛として育てられた少女である。\n仕事は真面目だが、性格は正反対でそれほど落ち着いていない。冗談や悪戯が好きで、とてもやんちゃ。時には恥ずかしがり屋な一面もあり、一人の女の子として褒められると、どうしていいか分からなくなる。忍者だが、小さい頃から高所恐怖症。雛鳥を巣に戻すためには軽々と木に登れるのに、怖くて降りられなくなる。\nキャラクターソングアルバムの表紙では、茉子のそばの花は赤い椿で、花言葉は「理想の愛」。"
 yoshino_corps_desc: "将軍紹介：朝武芳乃は穂織・建実神社の巫女姫。主人公が神刀を折ってしまったため、父の要請で主人公と婚約を結ぶことになり、不満を感じている。奉納の舞が非常に得意で、その舞には土地の呪いや穢れを祓う力も宿っている。甘い物が大好きで、卵焼きにまで砂糖を入れるほどの甘党。田心屋の菓子がお気に入り。\n性格はやや落ち着いており、少し冷たい雰囲気もあるが、元々の性格はそれほど冷淡ではなく、子供っぽい一面がある。表面上は冷静沈着を装おうと努力しているが、よく小さな綻びを見せ、案外見抜かれやすい。（芳乃の消去法：芳乃が否定したものが真実）芳乃の感情は実は豊かで、喜怒哀楽がはっきりしており、元気な子供のようであることが多い。\nキャラクターソングアルバムの表紙では、芳乃のそばの花はピンクの桜（桃の花とも）で、花言葉は「愛情と希望」。"
 Lena_corps_desc: "将軍紹介：レナ・リヒテナウアーは外国から来た女性留学生（会話中の「moi」や、レナの自己紹介の「オーロラの国」「ラップランド」(1)、贈ってくれるsalmiakkiなどからフィンランド人と確定できる）。\n明るく正直で優しく、いつも元気。性格は率直で、挫折に遭っても落ち込まない。「挫折に遭うほど頑張らなきゃ！」が口癖で、とても強い。特別な暗い面はなく、子供の頃から純粋な子としてそのまま成長してきた。\nキャラクターソングアルバムの表紙では、レナのそばの花は黄色い春菊の花で、花言葉は「豊かさ、多芸多才」。"
 Roka_corps_desc: "将軍紹介：馬庭芦花は主人公、鞍馬小春、鞍馬廉太郎の三人の幼馴染。すでに卒業しており、実家の和菓子屋を経営している、甘味処の店主である。他の二人より少し年上なので、よくお姉さんの目線や口調で話す（そしてからかわれる）が、恋愛経験はない。"
 koharu_corps_desc: "将軍紹介：鞍馬小春は穂織の町で唯一の学校の高校一年生だが、よく将臣のクラスに遊びに行く。芦花姐さんの甘味処「田心屋」でアルバイトしており、主人公のいとこにあたる。性格は優しく、気配り上手で、家事も得意——万能の妹と言える。しかし実の兄である廉太郎にはかなり冷淡で、その理由は廉太郎が発情して女の子にちょっかいを出す愚行を繰り返すかららしい。主人公には特に熱心で、「お兄ちゃん」と呼び、何度も主人公に実の兄になってほしいと言っている。"
 #RJ
 Nanami_corps_desc: "将軍紹介：在原七海は主人公の妹。血は繋がっていない。人見知りで、初対面の人にはどもってしまうが、打ち解けると非常に親しくなり、しかも少し中二病。\n七海は秘密組織のメンバーで、情報局特勤班に所属し、コードネームはLevy9。プログラミングとハッキング技術に長け、主に情報支援と後方支援を担当している。本人曰く、星幽能力を使う前に呪文を唱えると集中力が高まるらしい（役には立たないが）。彼女の星幽能力は治癒で、その原理は傷ついた者の自己回復能力を強化し、傷を速やかに回復させるというもの。\nキャラクターソングアルバムの表紙では、七海が手にしているのは「ハートのキング」。ハートは四つのスートの中で「愛情」を表す。過場絵の「ハートのジョーカー」バージョンでは、カードが手にしているのは魔女の飛行箒。"
 Ayase_corps_desc: "将軍紹介：三司あやせは橘花学院の生徒会長。よく学校の宣伝映像に出演し、インタビューやテレビ出演も多く、非常に有名。最も有名な星幽使いとされている。\n対外的にはEカップと公言している。（実際の大きさはプレイした人なら分かる）星幽能力は、領域内の引力と斥力を操ること。（ただし、このMODの721研究所の星幽能力強化リストに彼女がいないことにお気づきの方もいるだろう）\n性格はツンデレ。対外的には自分の性格を飾り立て、完璧な女の子として振る舞っている。早起きが苦手。猫への執着は想像を絶するもので、画面の中で猫を見ただけで変態モードに入る。寮で一人の時は羽目を外し、RPGゲームが好きなインドア派になる。\nキャラクターソングアルバムの表紙では、あやせが手にしているのは「スペードのエース」。スペードは四つのスートの中で「権勢」を表す。過場絵の「スペードのジョーカー」バージョンでは、カードが手にしているのは黒猫の形をした王笏。"
 hazuki_corps_desc: "将軍紹介：二条院羽月は橘花学院の寮監。仕事は非常に真面目で、責任感が強く、性格は生真面目で厳格、とても規則正しい。そのため、少し怖い、堅苦しいと評されることもある。寮長という立場と性格もあり、生徒たちの日頃の素行を監督することが多い。しかし生徒たちは嫌がるどころか、むしろ彼女を頼りにしている。\nその星幽能力は水の精製、水流操作。本人曰く、傘を持っていると集中力が高まるらしい。能力は強力だが、正確に操ることに苦心している。家は警察一家で、父の影響で歴史劇が大好き。一人でこっそり全役を一人で演じる一人全役ロールプレイに没頭することもある。性格や考え方の多くも、これらの歴史劇や時代劇の内容に由来している。黒鯛之介が大好きで、忠義の象徴だと考えており、家には黒鯛之介のグッズが部屋中に溢れている。\n個人ルートのEDでは、傘立て、恋文の便箋、星幽エネルギーの水椅子、恋文の封筒などのイメージが登場し、スクロール画面には水滴、傘花、星幽エネルギーの水流などのイメージが登場する。"
 Mayu_corps_desc: "将軍紹介：式部茉優は学院の科学者（ある意味で）として、主人公の先輩にあたる。成績は優秀だが、ある理由からわざと単位を取らずに卒業せず、留年を2回繰り返している。学院はこの式部茉優の行動を黙認し、AIMSの情報入力業務を任せている。\nその星幽能力は、空気中の粒子を固定すること。無から障壁を作るようなものだ。中空の家具の殻や階段など、様々な形を作り出せる。直接触れずに空中で固定でき、物体に遮られても発動できる。\n表面上はお姉さんのような成熟した女性に見えるが、実際には子供のように甘える一面もある。専用のプライベートラボを持ち、普段はそこで様々な能力の研究実験を行っている。ただし学院の先輩として、酒量は極端に悪く、缶ビール一本で酔っ払う。\nキャラクターソングアルバムの表紙では、茉優が手にしているのは「ダイヤのクイーン」。ダイヤは四つのスートの中で「富」を表す。過場絵の「ダイヤのジョーカー」バージョンでは、カードが手にしているのは死神の鎌。"
 chisaki_corps_desc: "将軍紹介：壬生千咲は橘花学院の生徒で、在原七海の同級生であり、七海の親友。社交の達人で、目が眩むような社交の輝きを放つ。\n一人っ子で、能力のない普通の人だが、正義感はたっぷり。ファッショニスタで、人に服装のコーディネートをアドバイスするのが大好き。身の回りの女の子を可愛く着飾ることに大きなやりがいを感じている。橘花学院に入った理由は、自分が星幽使いについて無知だと気づき、星幽使いの友達をたくさん作りたかったから。\n個人ルートの過場絵は、在原七海と同じハートのスートを使用。過場絵の「ハートのジョーカー」バージョンでは、カードが手にしているのはハートの描かれた旗とラッパ。"
 gongping_corps_desc: "将軍紹介：先に言っておくが、周防恭平は男だ。ただし外見は女の子のように見える。能力なし。よく壬生千咲に女の子扱いされて胸の大きさなどを比べられたりする。食欲は旺盛で、一食で大盛りを二〜三人前食べられ、しかも空腹になるのが異常に速い。しかし彼は常に理事長の任務を背負っており、秘密の任務を遂行し続けている。"
 kotori_corps_desc: "将軍紹介：伊勢琴里は橘花学院の理事長・伊勢篤紀の娘。中学時代に式部茉優と知り合い、二人は友人となった。星幽連結値が超高く、247に達する——史上最高値である。人為的に星幽能力の暴走を引き起こされたため、睡眠ポッドに拘束されていた。しかし我々の努力により、今や彼女の問題は解決され、我々のために働いてくれる。"
 #咖啡馆
 kanna_corps_desc: "将軍紹介：明月栞那は百年以上生きている死神の女で、猫妖の御帝と行動を共にしている。21世紀のハイテク製品には無知で、スマート機器の扱いが苦手。たまにバブル経済時代の知識を口にすることもある。主な仕事は魂（蝶）の導きと、この世を彷徨う弱った魂の処理。長く生きてはいるが、年長者の威厳はない。会話の中でふとした拍子に人をからかい、「にひひ」という笑い声をあげる。しかし時には、経験豊富で世の辛酸を嘗め尽くした一面も見せる。\nオムライス作りを一生懸命練習し、作ったオムライスは主人公に「優しい味」と評され、淹れるコーヒーも常に高い評価を受ける。エッチなことに連想が飛びやすく、一人で過激なH妄想に陥ることがある。経験はないのだが。"
 zaozi_corps_desc: "将軍紹介：四季ナツメは大学のマドンナ。学校での人気は非常に高く、何度も告白を断ってきたため「無情なカード渡し姫」と呼ばれている。明るい笑顔を作るのが苦手で、コーヒーやピーマンなど苦い食べ物が嫌い。\n静かな正統派バーで軽く飲むのが好きで、甘めの低アルコールカクテルを好む。酔うと性格が少し外向的になり、冗談を言って人をからかうのが好き。後で思い出すと恥ずかしくなる。ナツメがメイド服を着るのは個人的な趣味で、カフェ・ステラと死神の蝶を経営することが最も大事なことだと考えており、必要とあらば退学も辞さないと言っている。日本語名のナツメが機械翻訳で「ナツメ」ではなく「大棗」と訳されたことがあるため、親しみを込めて棗子姐さんと呼ばれることもある。"
 Nozomi_corps_desc: "将軍紹介：墨染希は主人公の幼馴染で、性格は明るくおとなしい。家の赤磐神社で巫女のアルバイトをしており、「巫女コスプレ」と言われるのを恥ずかしく思っている。神社の継承は望んでいない。\n彼女は霊感能力を持ち、蝶を感じ取るとひんやりとした感覚を覚える。苦いコーヒーと甘いドーナツを一緒に食べればカロリーが相殺されるという間抜けな考えを持っていたが、食べ物の誘惑の前では降参するしかない。主人公の誘いでカフェ・ステラと死神の蝶でアルバイトしている。"
 Hiuchidani_corps_desc: "将軍紹介：火打谷愛衣は四季ナツメの後輩で、墨染希のかつての同級生。明るく、表裏のない元気な少女。時には子供のように振る舞い、ぬいぐるみなどの可愛いものが好き。時には甘えん坊な一面もあり、家事を両親に押し付けることが多い。カフェ・ステラと死神の蝶でアルバイトしている。\nかつて水泳部に所属していた。水泳で日焼けした肌がなかなか元に戻らず、少し悩んでいる。定期試験の成績はいつもぎりぎりで、試験前の追い込みが必要。恋愛関連の話題に慣れておらず、聞くだけで顔が赤くなったり興奮したりする。愛衣は普段コンタクトレンズで、家では赤フレームの眼鏡をかけている。"
 suzune_corps_desc: "将軍紹介：汐山涼音はプロ級のパティシエで、作るスイーツは常に高い評価を受ける。スイーツ作りに深い愛情を持ち、コストや価格がどんなに高くても一切妥協しない。製菓に対して自分の信念を持ち、決して安易に妥協しない——それが原因で、しばしば他人と意見の相違が生じるようだ。\n仕事中は非常に真面目だが、家では極めて怠惰。理想の彼氏像は、すべての家事を引き受けてくれる人。賃貸の部屋でもいつも家事を溜め込み、面倒くさがって片付けようとしない。"
 #Dr.
 Miu_corps_desc: "将軍紹介：矢来美羽は月長学院の学生で、特区事務管理局（陰陽局）風紀班所属の吸血鬼の少女。治安を維持する組織で働いている。責任感が強く、きちんと指導するタイプ。たまに気恥ずかしい言葉で人をからかうこともあるが、本人がすぐ照れやすく純粋なため、結局は顔を真っ赤にした言葉の攻撃になってしまい、思わず汗が出る性格。\n周囲にはSだと思われているが、本人はMだと主張している。恥ずかしい時は顔を赤くして「うーるーさーい」と一言ずつ区切って言う。その能力は念力場の生成で、銃弾など高速で飛来する物体を防げるほか、対象に直接作用して弾き飛ばすこともできる。"
 azusa_corps_desc: "将軍紹介：布良梓は美羽と同じ風紀班所属の人間の女の子で、月長学院第二寮の寮長。寮生たちの保護者としての責任を負う必要があると主張している。幼児体型のため周囲に子供扱いされることが多く、本人はそれをとても嫌がっている。興奮したり慌てたりすると、言葉の発音が不明瞭になる。ロリ体型に少しコンプレックスがあり、いつも自分は大人だと強調している。吸血鬼に対して偏見や差別、区別待遇が一切ないため、多くの吸血鬼に好かれている。\n話題がHなことに及ぶと、いつも真剣に制止する。動揺すると「にゃ」という口癖が出て、時には本音の自爆も伴う。風紀班のメンバーとして、梓の射撃技術は風紀班内でもNo.1で、現場では重要な役割を担っている。"
 Rio_corps_desc: "将軍紹介：稲叢莉音は「アレクサン」で働く吸血鬼の少女。性格は温和で純朴、人を癒すような雰囲気を持つが、一度決めたら絶対に変わらない強い一面もある。寮では様々な家事を担当し、寮生活の基盤を支える人物と言える。一般的な常識は持っているが、性に関する知識は著しく欠如しており、純粋というより無知に近い。そのため、Hな話題になるたびに、首を傾げて他人に質問する。\n吸血鬼の中では後天的覚醒型で、先天的な吸血鬼と比べて希少。莉音は自分の能力——怪力——に少し抵抗があり、使うと気恥ずかしくなる。合気道を学んだことがあり、自身の怪力も相まって、戦闘力は風紀班の吸血鬼たちと比べても遜色ない。"
 elina_corps_desc: "将軍紹介：エリナ・オレゴヴナ・アヴェーンは歓楽街のカジノで働くロシア人留学生で、吸血鬼。月長学院第二寮の寮生。時々ロシア語を話し、髪をシングル/ツインのポニーテールにするのが好き。弱点は耳と電磁波妨害。個性がはっきりしていて人と打ち解けやすく、普段の会話でよくHな話題に連想を飛ばし、周囲を呆然とさせることが多い。エリナはエッチなことに興味があるのを隠すつもりはなく、学術的な観点から興味があるのだと主張している。\n自称ドMで、実際に様々なプレイを好む。恋する乙女状態のエリナは興奮しすぎて落ち着いて眠れず、ベッドで転がり続ける。電磁系の能力を持ち、彼女には人に言えない秘密がある。"
 Nicola_corps_desc: "将軍紹介：ニコラ・ケフェウスはヨーロッパから来た吸血鬼で、中二病患者。普段は「ボク」と自称する。設定厨で、自分自身や周囲に様々な設定を付け加えるのが好きだが、実際の中二度はそれほど高くない。自分が想像する吸血鬼の姿に近づくため、普段はマント付きの改造制服を着て、カラーのコンタクトレンズを着用している。他人には理解しがたい言葉で話すが、周囲はもう慣れっこになっている。エリナと同じカジノで働き、努力の末にカジノのディーラーとしてデビューした。最初はほとんどの人が彼女を男だと思っていた。"
 sayo_corps_desc: "将軍紹介：荒神小夜は外見はロリで、性格も子供っぽい一面があるが、実は年齢200歳（実は400歳以上）を超えた吸血鬼。他の吸血鬼と比べても特別な存在であり、吸血鬼と人間の共存を提唱してアクア·エデンを築いた。都市に住む吸血鬼たちは、小夜の貢献に感謝し、尊敬している。\nアクア·エデンの市長として、しばしば人間政府の役人と都市の発展を話し合うが、その立場は中立を保ち、吸血鬼に不利な選択に直面しても、アクア·エデンが存続し続けることを最優先にする。その能力は超回復力。"
 #天使
 noa_corps_desc: "将軍紹介：白雪乃愛は天使の少女。魔王の生まれ変わりである主人公を守るため、彼のそばに降り立った。見た目は幼いが、言動は非常に成熟している。何事にも落ち着いているが、一部の話題を除く。天使の仕事に非常に熱心で、周囲の人にも誠実に接する。\n乃愛はずっと天使としての生活を送っており、人間の文明にはほとんど触れたことがない。漫画、アニメ、美食などに好奇心旺盛で、次第に楽しむようになる。聖なる天使であるため、下劣なことには強い拒否感を持つ。"
 Amane_corps_desc: "将軍紹介：谷風天音は主人公の実の妹。雌小鬼で、すぐに兄を皮肉る。\nオフラインの社交には興味が薄く、競技寄りのゲームの達人。競技ゲーム以外にも、以前はパソコンでエロゲーをプレイしており、PvPの味方による血圧上昇を抑えるためだと言っている。私蔵の漫画にはJKによくある少女漫画だけでなく、男性向けの「劉備」まで含まれており、天使の生理学の入門教材として使っている。だから彼女が寝起きが悪いのも納得がいく。\n天音の前世は異世界の魔族。"
 WeiZi_corps_desc: "将軍紹介：ヴィズは谷風天音の前世の姿。"
 Kurumi_corps_desc: "将軍紹介：小雲雀来海は瑞花学院2年C組の生徒。授業を真剣に聞いてノートを取り、試験前に詰め込み勉強をしなくても済む優等生で、物覚えが非常に良い。ギャルで、髪を染め、ネイルをし、上着を腰に巻いている。オタク文化に精通している。ただし、とても辛いものが苦手。皆が辛くないと言うラーメンで涙を流したことがある。\n来海の前世は、魔王アリオンの麾下にいたスレイという名の女性魔族。"
 Kaguya_corps_desc: "将軍紹介：星河輝耶は異世界から魔王の魔力を追って日本にやって来た魔族の女性で、異世界スネウ王国の第二王女。魔族の特徴として頭に獣耳がある。日本に来てからは、側近の高楯オーリエと一緒に駅前の高層マンションの高級アパートで暮らしている。側近であるオーリエは、異世界でも王女のイメージを保ってほしいと願っているが、輝耶本人はその必要はないと思っている。\n輝耶はハンバーガーが好き。認知妨害を発動できる仮面を持ち、本来の装いのまま外出しても目立たずに済む。獣耳は敏感で、触られるのが一番怖い。そして非常にノリがいい。"
 Fumika_corps_desc: "将軍紹介：百里風実花は高校生の頃から教師を志していた。現在は瑞花学院で最年少の教員で、現代国語を担当し、李空のいる2年C組の担任。普段は教師と生徒の距離感を大切にしているが、主人公だけは例外で、私事まで彼に相談しに来る。私生活では、かなり甘えん坊な性格。\n風実花の前世は「魔王に関係する者」ファリの生まれ変わり。ファリはある意味で魔王の僕。"
 Orie_corps_desc: "将軍紹介：高楯オーリエは星河輝耶と同じく異世界から来た少女で、輝耶の側近。性格は非常に几帳面。融通が利かず、時々不器用さを見せる。電化製品の扱いが苦手で、彼女にとってはそれらはすべて「異世界の道具」。"
 Sairi_corps_desc: "将軍紹介：三国彩里は谷風天音の同級生で、特に気が合う。ゲームが好きで、よく天音とオンラインで一緒に遊び、天音からはゲーム中は真剣だと評されている。かつて異世界の研究所に操られていたことがある。"
 #幻想岛
 shirley_corps_desc: "将軍紹介：シャーリー・ウォリックは浮遊島に生まれ育った先住民の人間で、エルフではない（実は主人公が慰められた後、シャーリーを自分を救いに来た妖精だと勘違いし、漢化後に誤解が広がったもの）。家族は浮遊島の議会の代表を務めており、そのため一般に「姫様」と呼ばれている。性格は明るく率直で、成績優秀、真面目な態度で、生活態度も問題なし。絵を描くのが得意で、コンクールで表彰されたこともある。\n妄想が非常に激しく、よく桃色の妄想に陥って抜け出せなくなり、妄想が一定のレベルに達すると、鼻血を噴き出す。"
 amagiri_corps_desc: "将軍紹介：天霧夕音は日本からレゼルグへ留学に来た学生で、礼儀正しい大和撫子系の少女。父の体調不良のため、幼い頃から母について家事をしてきたので、家事は非常に堪能。他人に尽くしたいという強い願望を持ち、誰かの使用人になりたいと強く願っている。\n夕音の作る料理は非常に好評で、透に褒められるととても照れることがある。時々非常に恐ろしく意味深な笑みを見せることがあり、その強気な性格は母譲りのようだ。夕音の体温は普通の人より低く、ある種のヤンデレ属性を持っている。"
 Masaki_corps_desc: "将軍紹介：真咲・ガイヤールは赤いショートヘアの少女で、獣耳と獣尾（犬に似た耳と尾）を持ち、耳と尾の毛色も髪と同じ赤。巨乳。混血の獣人。父の名はオーウェン・ガイヤールで、純血の獣人であり、酒場「牙と爪の獣亭」の店主。父と一緒に酒場を経営し、ウェイトレスとして働き、酒場の看板娘としても知られている。母は日本人で、真咲が小さい頃に家を出て行った。\n真咲は天真爛漫で活発、元気いっぱい。ただし朝は寝坊し、起きたばかりの時はぼんやりしている。美味しいものが好きで、特にドーナツが大好き。獣人として、嗅覚と聴覚は普通の人よりはるかに鋭い。話す時に「わふっ」と付ける癖がある。"
 Konoka_corps_desc: "将軍紹介：火宮木乃香はキャンプ中に、突然何も着けずに湖畔に現れた謎の少女。目覚めた後、自分の名前が火宮木乃香であることだけを覚えていた。彷徨人と認定されたため、レナードと議会の協議・決定により、木乃香はレゼルグの住民となり、店主オーウェン・ガイヤールが彼女の後見人（形式的な）となった。話す速度はゆっくりで、文末に自分の感情を添える癖がある。「木乃香はこう言ってる」「木乃香はこう思ってる」など。部屋の片付けが苦手で、透が気づく前は部屋が散らかり放題だった。時々、恥ずかしいことを意図的に率直に言うことがある。作る弁当は、見た目は非常に怖いが味は絶品か、見た目は美しいが味は普通かのどちらか。レゼルグに来る前の記憶がないため、現在のものに強い執着や感情はなく、様々な感情の感覚にも新鮮さを感じている。"
 Tia_corps_desc: "将軍紹介：ティア・ホーエンヴェルフェンはレゼルグ本島の古いエルフの家系、ホーエンヴェルフェン家の娘。ただしエルフ族の美的感覚からは「美人ではない」と評されている。普段は人柄が正しく、教えることも真剣だが、そそっかしい一面もあり、脳が処理しきれない情報に直面すると非常に緊張して慌てふためき、よく自分が悪いことをしたと思って猛烈に謝る。学校では度なしの眼鏡をかけ、頼れるお姉さんの雰囲気を出そうと努力しているが、完全に失敗している。"
 Airi_corps_desc: "将軍紹介：白鹿愛莉は頭に細いアホ毛のある女の子。主人公の母の妹の娘なので、主人公のいとこにあたり、今回島に留学してきた留学生の一人。語尾に「なのです」「そのなのです」という口癖があり、ほぼ毎文に付く。後に自爆系ツンデレの特性を発揮するようになる。\n愛莉は実はとても率直で可愛い子だが、緊張しやすいため、自分の気持ちを伝えるのが難しい。子供っぽい一面があり、本人もそれを改善したいと思っている。"
 #nw
 akari_corps_desc: "将軍紹介：兼元灯里は兼元グループのお嬢様。責任感が強く、普段は比較的端然としているが、人に褒められることに敏感で、褒められると極度に慌てふためく。\n灯里は実はツンデレで、早起きがとても苦手。"
 Shizuru_corps_desc: "将軍紹介：正宗静流は正宗家のお嬢様で、六麓学院の二年生。正宗家の評価を非常に重視しており、自身の立ち居振る舞いや礼儀に高い基準を課している。子供の頃に長刀を学び、教えられるほどの腕前を持つ。\n将棋の戦法名に興味があり、名前がかっこよく聞こえる戦法ほど対局で強いと思っている。ただし、自分がぺったんこであることを非常に気にしている。"
 Sena_corps_desc: "将軍紹介：月山瀬奈は兼元家の二人のメイドの一人で、灯里の専属メイド。六麓学院の従者科にも通い、校内のカフェで実習している。料理の腕前は高く、初めて作ったものでも上手くできる。匠は彼女の料理を「普通に美味しい」と評している。灯里と茅明は、瀬奈の料理を「どんな普通の材料でも良い味にできるが、逆にどんな高級な材料でもあの程度の味にしかならない」と評している。\nメイドとして優れた家事スキルを持つ他、車の運転、鍵開け、さらには爆弾処理までできる。ただし暗所が怖く、館内の突然の停電に泣かされたことがある。"
 Hinata_corps_desc: "将軍紹介：国広ひなたは明るく、率直な（元）後輩。元々は名門の出だが、家庭の事情で普通の家庭で育てられた、超庶民派の女の子。豪華な料理を食べて数日間下痢をしたことがあり、貴族の生活に体が馴染まない。\n一部の立ち絵では、後頭部のショートヘアが結ばれておらず、後ろアホ毛を形成している。ひなたは勉強が苦手なタイプで、すぐ燃え尽きる。お嬢様に変身したが、頭の中には常に「超お買い得」が刻み込まれている。"
 Maya_corps_desc: "将軍紹介：長光麻夜は家風が武を尊び、幼い頃から侠義の教育を受けてきたため、正義感の強い女の子に育った。腕前も確かで、強盗を蹴り飛ばせるほど。成績は学年一番。非常に格好いいため、様々な女の子に好かれている。元々は庶民の学校に通っていたが、しばらくして六麓学院に転入してきた。ただし、人付き合いが苦手なタイプで、人と話すと緊張する。あやせと同じく、猫や犬が大好きで、懐かれていると嬉しくなる。"
 #天神
 sana_corps_desc: "将軍紹介：千歳佐奈は主人公の妹で、家事万能、料理好き。一家の食事を担当し、主人公のお小遣いを管理している。誕生日は6月8日——佐奈が千歳家に来た日であり、本当の誕生日は誰も知らないため、皆がこの日を誕生日としている。\n佐奈は性格が温和でおとなしく、細やかでいつも人のことを考えているが、ツッコミの達人でもある。佐奈は怪談に弱い。しかし、彼女には人に知られていない身分がある。（ヒント：フル版では毎年§t6月8日§!に佐奈の誕生日を祝えます。）"
 sakuyahime_corps_desc: "将軍紹介：卯花之佐久夜姫の本職は真日羽市の土地を守り、土地を治めること。その土地を治める能力は非常に独創的で、この地の風調雨順を保証する——真日羽市を守るために存在する女神である。非常に長い年月を生きてきたと言われるが、それでもなおとても純真。華やかな外見と誇り高い気質から、同級生たちに「姫」と呼ばれている。\n現世では、お節介焼きが過ぎて、いつもトラブルを招く。また、人を試したりからかったりするのが好きで、相手が慌てふためく反応を楽しむ。実はとても一途な女の子で、気になる人が他の女の子に親しくされると嫉妬する。"
 Ruri_corps_desc: "将軍紹介：竜胆ルリは主人公・神卯花之佐久夜姫の従者で、本体は可愛い小さな狐の精。猫が好きで、猫を救うためなら命がけでダンプカーの前に飛び出す。本人もツンデレ。"
 Aoi_corps_desc: "将軍紹介：山吹葵は主人公の幼馴染。細かいことを気にせず、性格はさっぱりしており、立ち居振る舞いは端然とし、誰に対しても平等に接するため、男女問わず人気がある。ただし、恋愛にはかなり鈍感で、周囲の人間を驚かせている。そして、約束を非常に大切にする。"
 Mahiro_corps_desc: "将軍紹介：常盤真尋は水薙学園の生徒会長。人に優しく、学園内で人気がある。文学系の少女で、図書館で本を読むのが好き。好きな作品は繰り返し読む。よく一人で事務を処理し、周囲に頼ることが少ない——人に迷惑をかけるのが怖いようだ。引退が近づいた時、生徒会のメンバーや各ルートで生徒会の手伝いに来た人々と協力し、水薙学園の文化祭が従来の成果発表だけの形から、他の学園のように店を出したり芸を披露したりできる形へと変えた。"
 Yukari_corps_desc: "将軍紹介：烏羽紫は水薙学園の教師の一人で、物語が始まる新学期に主人公の担任を務めた。水薙学園ではかなり若い先生で、生徒との関係も良好。以前、服装について老竹に叱られたことがある。時々屋上でタバコを吸ってリラックスしている。教師の他に、非常にドSな一面もある。"
 #管乐
 Tae_corps_desc: "将軍紹介：中ノ島妙は主人公の幼馴染。子供の頃はとても人見知りで、今の場所に引っ越してきた後もしばらくあまり話さなかった。料理が非常に得意で、作る料理も美味しいが、他人の追随を許さない辛さ耐性を持っている。最初はトランペットを吹いていて、後にトロンボーンに転向した。性格は非常に純真で、冗談を真に受けることがあり、また自分でも気づかないうちに怖いことを言うことがある。"
 Noriko_corps_desc: "将軍紹介：今宮紀子は赤城山学院の吹奏楽部に所属。趣味は恋愛小説を読むこと。料理は非常に苦手で、いつも焦がしてしまい、イカスミ料理かと見紛うほどになる。強度の近視で、眼鏡を外すと目の前のものが人かどうかも判別できない。以前は体が弱かったが、体調改善のため吹奏楽を始め、今に至るまで続けている。"
 Sumi_corps_desc: "将軍紹介：御影須美は円山学院の一年生。当初は円山学院の吹奏楽部に入部したが、退部した後、誘われて赤城山学院の吹奏楽部に入部した。ドラマーとしてのリズム感は良く、これまでの性格のせいでクラスでいじめを受けることが多く、長年のいじめで非常に卑屈になり、必要以上に自分を責めることがしばしばある。肝試しに参加した時は怖がったと言うが、不思議なことに顔には何の表情の変化もなかった。"
 Yuki_corps_desc: "将軍紹介：雲雀丘由貴は円山学院の生徒で、円山学院吹奏楽部で指揮者を務める。音楽に造詣が深く、バイオリンやピアノなどの楽器に精通し、指揮者として合奏練習の細かな欠点も聞き分けられる。しかも教科書通りのツンデレ。常に円山吹奏楽部を率いて赤城山吹奏楽部と雌雄を決することを望んでおり、そのため試合を不公平にする行為を非常に嫌う。"
 minase_corps_desc: "将軍紹介：海老原みなせは円山学院の一年生で、赤城山学院吹奏楽部に所属。円山学院の一年生で、赤城山学院吹奏楽部に所属している。彼女の姓「海老原」の「海老（えび）」は日本語の「エビ」と同じ読みで、海老もエビの一種であるため、みなせは主人公から「エビちゃん」というあだ名を付けられた。"
 #夏空
 Chihaya_corps_desc: "将軍紹介：上坂茅羽耶は主人公が喫茶店で偶然出会った少女。性格は明るく、何の憂いもなさそうに見え、いつも微笑みを浮かべている。料理は苦手で、今まで一度も作ったことがない。体が弱く、両親の世話になっており、最近家族とともに島へ引っ越してきた。島の空気は清々しく、体調は回復した。夢は医者か看護師になること。"
 sasara_corps_desc: "将軍紹介：七条沙沙羅は主人公が祭りで出会った少女。塔弦神社の神主・七条克己の娘。甘いものが好き。天真爛漫で世事に疎く、自分でも何を考えているのか分からないことがある。完全に常識の外で、基本的な人付き合いの常識もあまりない。しかし、変わった雑学をたくさん言うことができ、それを利用してノリやツッコミをする。家事の経験もない。心も未熟で、完全に白紙の状態で、とても子供っぽい。母とは何年も会っていない。これまでは父の言いつけを守り、病院にいて外に出なかった。"
 Yuiko_corps_desc: "将軍紹介：三好由比子は主人公のいとこで、双葉の姉。見た目は幼いが、実は主人公と同い年。両親に甘やかされて育ったようで、とてもわがままで、負けず嫌い。身長が低く、双葉よりまだ低く、よく双葉にからかわれており、それに非常に納得がいっていない。子供の王様で、様々な遊びに精通しており、縁日ゲームの女王。ダーツ、金魚すくい、射的がすべて強い。三好美帆に教わったらしい。料理も上手で、数日練習しただけで母の美帆にほぼ追いつくレベルに達する。頭も良いが、勉強には努力を惜しむ。主人公が確認したところ、冬休みの宿題は全く手を付けていなかった。"
