###芳乃事件链
 yoshino_event.1.t: "春祭り"
 yoshino_event.1.d: "初春の陽射しが神社のそばの木々に落ち、また地面に落ちて、ひとつひとつの光の点に砕け、眩しいほどに明るい。軒先では雛鳥が細く鳴く。神社の門前には、幾重にも重なった人垣が、ひと言の物音も立てない。すべての人の視線は、あの白い衣の人を追って漂う。\n素衣をまとい影を弄び、袖を舞わせてひらひらと。鉾鈴を手に上下し、その音は金鉄のように澄み渡る。\n忽ち前に進み、忽ち後に引く。振り返れば媚びるがごとく、笑えば楚々として美しい。\n廻れば玉蓮の開くがごとく、歩めば金蓮の湧くがごとし。\n舞が終わると、人々は次第に散っていき、神社の門前に残ったのはあなただけになった。突然、誰かがあなたの背中をつついた。振り返ると、さっき踊っていた巫女がいた。「こちらのお客様、まだ何か御用でしょうか？」\n「ああ、いや、何でもない。さっき見惚れてしまって、反応が遅れただけだ。もう行くよ」\n「あの、この後、春祭りで石中の刀を抜く催しがありますが、ご覧になりませんか？」\nこれが、あなたが今ここで国際義勇軍に入っている理由だ。\n左にいるのは、この上なく上流な忍者、常陸茉子お嬢様。「ねえねえ、ムラサメ丸を抜いたら、アーサー王にはなれなくても、エロ王にはなれるわよ。なんで答えないの？照れてるの？もしかして後でまた差し込みに来るつもり？」上流だ、実に本場の上流だ。\n「茉子、からかわないで。もうすぐ山に入るわよ」右にいるのは、あの日の巫女、朝武芳乃お嬢様。茉子を抑えられるのは、彼女だけだ。"
 yoshino_event.1.a: "見に行ってみるか？"
 yoshino_event.1.b: "他に用事がある"
 yoshino_event.2.t: "祟神との初陣"
 yoshino_event.2.d: "山に入った理由は、祟神を討つためだ。芳乃お嬢様が先日説明してくれたところによると、祟神は殴るととても痛い黒い野良犬のようなもので、特定の武器でしか傷つけられない。その特定の武器というのが、このムラサメ丸と、芳乃お嬢様の手にある鉾鈴だ。祟神は出現の物音がしないので、祟神探しは目のいい茉子の仕事だ。しかし今日の祟神は、非常に積極的にこちらから訪ねてきた。山に入って間もなく、二つの黒い影が草むらから飛び出し、あなたと芳乃の顔面目がけて襲いかかってきた。\nよし、こいつらを市場に出してやろう！\n気を丹田に集め、刃を前に構える。祟神が顔に張り付くかというその瞬間、足を運び、体を横にずらし、手を上げて刀を振り下ろす——祟神は見事に真っ二つになり、二つの黒い水たまりと化して地面に消えた。振り返ると、芳乃は鉾鈴のリーチの短さが祟り、茉子と二人で必死に祟神の猛攻を防いでいた。迷わず振り返って斬りかかる——この祟神も相棒の後を追った。この山の機敏な犬どもも、大したことはないな。作業完了、下山だ。今日の分は二匹、帳面に付けておけ。\n格好つけはなかなか成功したようだが、後で芳乃が茉子の上着を借りて帰ってきたのは、なぜだろう？"
 yoshino_event.2.a: "祟神？ふん！必ずや生きて帰さん！"
 yoshino_event.4.t: "一緒に釣り"
 yoshino_event.4.d: "山暮らしは本当に悪くない～今日はランク上げに絶好の日だ～芳乃お嬢様があなたをゲームに招待します。その名も釣り。/n茉子もレナも小ムラサメも来ている。そして、あなたのじいちゃんも！彼も山で何をしてるのか分からないがいる。大勢がぞろぞろと山の小川のほとりにやって来た。芳乃はどこからか釣り竿を一本手に入れ、こっそりあなたのそばに滑り込んできた。「釣りって、どうやってやるの？」/nえ？この巫女お嬢様は釣り竿すら見たことがないのか？まあいい、この小さな問題は私に任せておけ。賀強大帝よ、釣り人の力をお授けください！\n最初はてんやわんやで、芳乃の針が何度もあなたの服に引っかかった。しかし挑戦を重ねるうちに、芳乃はついに最初の一匹を釣り上げた。\nあなたは芳乃の魚を針から外して、バケツに放り込んだ。芳乃は釣り竿をしばらく眺めてから、聞いた。「釣りって面白いと思う？」「そりゃあ面白いさ」賀強大帝の認証付きだ。釣りが面白くないわけがない。\n「じゃあ、次も私と釣りに来てね」芳乃は釣り竿を片付け始めた。「前にあなたが私の服を切り裂いて、振り返りもせずに逃げたでしょ。これはその賠償よ。断るなんて許さない！」"
 yoshino_event.4.a: "じゃあ芳乃を指導しよう"
 yoshino_event.4.b: "第二選択肢、テキスト未定"
 yoshino_event.5.t: "プリン、パフェアイス！"
 yoshino_event.5.d: "芦花姐さんのスイーツ店に新作プリンが入った。通りがかりに一つ買って、夜食にしようと机の上に置き、あなたは部屋に着替えに行った。\nあれ、さっき机に置いたプリンは？芳乃？芳乃、俺のプリン見なかったか？\n芳乃はプリンの小瓶を背中に隠しながら、あの食感が最高で甘酸っぱくてマンゴーの角切りとイチゴの粒がたっぷり入った美味しいプリンなんて見てないし、絶対に涎を我慢できずに食べたりしてないと言った。\nはぁ、芳乃は本当に嘘がつけないな。\n「好きか？好きなら次は何個か多く持ってきてやるぞ？」「好き好き好き！」芳乃の目から星が飛び出し、ぴょんと地面から飛び上がった。「このプリン、どこで手に入れたの？」\n「芦花姐さんのところだ。今度一緒に行くか？」\n「約束よ！騙したら許さないから！」\nそれからの日々は、そんな調子でのんびりと過ぎていった。昼は一緒に登校し、夜は時々山に登って山の機敏な犬を討ち、夕方に機会があれば、こっそり芦花姐さんのスイーツ店に寄ってあれこれ食べた。\n目の前の団子を三口で平らげ、芳乃を呼んで一緒に行こうと振り返ったその時、肩に重みが一つ乗った。「え、芳乃？おい！」\n揺さぶっても起きない……背負って帰るか。"
 yoshino_event.5.a: "プリン最高！"
 yoshino_event.8.d: "夜がようやく訪れたばかりで、通りにはもう行き交う人もほとんどいない。芳乃はぐっすり眠り、顔をあなたの首筋に埋め、何本かの髪が両側に垂れている。夜風はひんやりとして、ほのかな甘い香りを運び、ときめく心にほろ酔いの温かさを添える。いつから背中のこの子に心を動かされていたのだろう。あるいは、彼女と一緒に登校したある朝かもしれない。あるいは、彼女ががっついて食べる姿を見たある夕方かもしれない。あるいは、激しい戦いの後の疲れ果てたある夜かもしれない。肩の上の芳乃が、少し身じろぎした。\n「茉子？…」寝言だ。可愛いな。\n「茉子、なんで私があの外から来た人のことを好きになったんだと思う？」\n「彼、祟神と戦うときすごく格好いいの。普段も優しいし、私のちょっとわがままな小さな願いも、一つずつ叶えてくれるの。それにね、私がプリンを食べるのを見る目が、お父さんみたいなのよ。すごく馬鹿で、すごく可愛い」\n「でも、言い出せないの。怖いの。私の呪いが彼に害を及ぼすのが怖いの」\n「呪いのせいで、私の命はせいぜい二、三十年しかない。彼に、後で私のことで悲しんでほしくないの。そうしたら、一緒に遊びに行ったり、一緒にプリンを食べたりした日々の些細な思い出がみんな、彼を傷つける鈍い刃になる。彼に、残りの人生の孤独と引き換えに私の楽しさを買ってほしくない。そんなの、なんて自分勝手なんだろう」\nひんやりとしている。芳乃、泣いているのか？\nこれらのことは私も分かっている。なのに、なぜ私は迷わず彼女を好きでいるのか？彼女のどの後ろ姿も、どの表情も、どの小さな仕草も、好きになる理由になり得る。なぜなら、それは重要ではないからだ。大事なのはこの想い——彼女でなくてはならない、ということだ。\n「芳乃、寝たふりはやめろ。真面目な話があるんだ」\n「好きだ。お前の呪いを、全力で打ち破ってみせる。運命が俺たちに円満な結末を恵んでくれないのなら、俺たちの手で奪い取るまでだ。これからの俺たちの日々は、二、三十年なんかじゃない。七、八十年、人生の最期まで続くんだ」\n芳乃の家に着いた。背負っていた彼女を下ろそうとしたその時、背中が軽くなり——彼女が自分で滑り下りた。\n「本当に言ってるの？」\n「お前を騙すわけないだろ？」\n芳乃が背後から抱きついてきた。「そ、それじゃあ、これからの日々、よろしくお願いします」"
 yoshino_event.8.t: "告白"
 yoshino_event.8.b: "一緒にすべての困難に立ち向かおう！"
 yoshino_event.8.a: "一緒にすべての困難に立ち向かおう！"
 yoshino_event.9.t: "祟神と呪いとの最終決戦"
 yoshino_event.9.a: "最終決戦！"
 yoshino_event.9.d: "漆黒の刃が空気を裂き、あなたの急所に向かって突き下ろされた。これで終わりなのか？\n祟神の依り代は、あと数枚の破片を残すだけ。今日がこいつとの最後の戦いだ。毎回の戦いで皆が無傷で帰ってきたとはいえ、誰一人として警戒を緩めなかった。山に入った途端、不安な気持ちが皆にまとわりつき始め、山の奥へ進むほど、心は締め付けられた。芳乃がそっとあなたの服の裾を掴み、指がかすかに震えている。この心細さは、十数匹の小祟神が一塊に固まって、一頭の凶暴な黒狼になったのを皆が見た時、具現化した。\n芳乃はさらに強く裾を引いた。「こんな…大きいの、どうやって戦えば…」\n何はともあれ、まず抜刀だ。ムラサメ丸は薄い霊火を宿し、ためらいなく巨狼の頭に向かって斬り下ろされた。巨狼は即座に体を沈めた。その空中で、刃は忽然と軌道を変え、前傾したあなたの体とともに巨狼の脚へと斬り込んだ。こんなに大きいのなら、小さい奴らのような機動力はないはずだ。残念ながら、この常識は祟神には通じない。\n巨狼は素早く一爪を繰り出し、刀身を激しく叩いた。この爪がこれほど速く来るとは思っていなかったため、防御姿勢では力を殺ぎきれず、全身がバラバラになりそうだった……だがまだ立ち直らないうちに、狼の尾が鋼の鞭のように振るわれ、あなたの体に激しく叩きつけられた。吹き飛ばされるのはいい気分ではない。もがきながら振り返ると、狼の尾はすでに一振りの短剣と化し、残る二人の妨害を無視して、あなたに向かって突き刺さってきた。\n漆黒の刃が空気を裂き、あなたの急所に向かって突き下ろされた。しかし、これは終わりではない。まだ果たしていない約束がある。\nあの日、ムラサメが刀を修繕していた場面を思い出す。彼女は神力で刀を直接操り、空中に浮かせていた。ならば、刀が粉々に砕けても、すべての破片を神力で操れるはずだ。\n「ムラサメ、神通を少し抑えて。彼の手でムラサメ丸を砕かせる」\n祟神の攻撃がムラサメ丸を砕いた。それが、こいつの最後の攻撃だ。祟神が尾を引き戻す間もなく、すべての破片が天地を覆う勢いで祟神に激突した。祟神がどんなに機敏でも、この天羅地網の技は避けられない。\n今日落ちた依り代の破片は、特別大きいな。"
 yoshino_event.11.t: "子と人との新しい生活"
 yoshino_event.11.d: "その後、一同は依り代を昼夜かけてこねくり回し、ようやく呪いを処理しきった——きれいさっぱりと。\nなぜきれいに処理できたと確信できるのか？\nなぜなら今日、看護師が産室から出てきて、あなたが男の子の父親になったことを祝福してくれたからだ。\n芳乃は喜んでいるだろうか？今はまだ手術室に家族は入れない。真っ先に喜びを分かち合えないのは残念だ。しかし、この先には数十年の歳月と、数え切れない日夜の幸せが待っている。その時にゆっくり確かめればいい。だから……\n芳乃、あの挨拶をもう一度やってくれるか？\nえ？！……うん。旦那さま、Ciallo～(∠· ω< )⌒☆"
 yoshino_event.11.a: "これからの日々も……よろしくお願いします"
 yoshino_love1: "なんだこのモンスターは？！"
 yoshino_alone: "プリン！"
 yoshino_happy1: "芳乃ルートを遊んでくれてありがとう！"
