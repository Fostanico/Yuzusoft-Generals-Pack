# 凉音
 LY_event.101.t: "ポテトマインさんが食べて怒って爆発しに来た"
 LY_event.101.d: "「このパンケーキどうなってるの？この品質はどういうこと？」\n「火力が強すぎ。焼きすぎて気泡が全部消えてる。ちゃんと練習してないでしょ」\n「なんでこれ出すの？全部台無しじゃない！」\n「火加減が弱くてもダメ、強くてもダメ。あと、気泡が湧くのを待つって言うけど、待ちすぎると生地が焼けすぎて乾燥するの。だからあなたが作ると固くなるのよ」\n「それに焦げた匂いがする。この味が台無しよ」"
 LY_event.101.a: "はぁ…それで…キッチン借りてもいいですか？"
 LY_event.102.t: "ポテトマインさんが弟子を取りに来た"
 LY_event.102.d: "プロのパティシエの目から見れば、このパンケーキは絶対にテーブルに出せる代物じゃない。でも食べると、涼音にはどこか淡い懐かしさを感じさせた。涼音はテーブルにうつ伏せて長いこと考えて、ようやく思い出した。\n\nこれは自分が初めて作ったパンケーキと同じ味だ。"
 LY_event.102.a: "この子たちに教えてあげたら、私より美味しいお菓子を作れるかもしれないわね。"
 LY_event.103.t: "フルーツケーキ"
 LY_event.103.d: "ケーキは古い西洋菓子で、通常オーブンで焼く。ケーキは主に卵、砂糖、小麦粉を原料とし、牛乳、果汁、粉乳、香料、サラダ油、水、ショートニング、ベーキングパウダーを副材料とする。攪拌、調合、焼成を経て作られる、スポンジのような菓子である。\n\nケーキは麺類の一種で、通常は甘く、典型的なケーキは焼き上げて作る。ケーキの主な材料は、小麦粉、甘味料（通常は蔗糖）、結着剤（通常は卵。菜食主義者は麩とデンプンで代用可）、ショートニング（通常はバターまたはマーガリン。低脂肪ケーキは濃縮果汁で代用）、液体（牛乳、水または果汁）、香料、膨張剤（イーストやベーキングパウダーなど）である。"
 LY_event.103.a: "やったー"
 LY_event.104.t: "チョコレートドーナツ"
 LY_event.104.d: "ドーナツは、小麦粉、白砂糖、クリーム、卵を混ぜてから油で揚げた甘い食べ物である。最も一般的な二つの形は、中空のリング状と、生地の中にクリームやカスタード（卵液）などの甘い餡を包んだ閉鎖型である。\n\nアジアではドーナツは主におやつとして食べられるが、アメリカでは多くの人が朝食の主食としており、「ドーナツの日」まで設けられている。"
 LY_event.104.a: "やったー"
 LY_event.105.t: "クリームプリン"
 LY_event.105.d: "プリンはイギリスの伝統的な食品である。古代に血のソーセージを混ぜた「プダン」を指していた言葉が変化したもので、現在のように卵、小麦粉、牛乳で作られるプリンは、当時のサクソン人によって伝えられた。中世の修道院では、「果物とオートミールの混合物」を「プリン」と呼んでいた。このプリンが正式に登場したのは16世紀のエリザベス一世時代で、肉汁、果汁、ドライフルーツ、小麦粉とともに調合された。17世紀と18世紀のプリンは、卵、牛乳、小麦粉を材料として作られた。"
 LY_event.105.a: "やったー"
 LY_event.106.t: "バニラパンケーキ"
 LY_event.106.d: "小麦粉に水を加えて攪拌してできる物質は、良好な伸展性と弾性を持つ。パンケーキを作る際、小麦粉が主材料となり、小麦粉に水を加えて練った生地が形成する湿ったグルテンは、オーブンで加熱されると水蒸気を発生させる。焼成湿度が高いほど水蒸気圧力も大きくなり、湿ったグルテンが受ける膨張力も大きくなる。こうして層状の生地が次々と加熱されて膨張し、グルテン内の水分が完全に焼き切られるまで続く。これにより製品の体積は元の8倍から10倍に膨らむ。\n\n第二の膨張要因は、層を生み出す能力のある構造材料である。いわゆる層状構造材料とは、パンケーキ生地を作る際、攪拌した生地の中に規則正しい層状の油脂をたくさん入れ、層状の油脂と層状の生地が互いに隔てられ、規則正しい生地と油脂の層を形成することを指す。オーブンで加熱されると相乗効果が生じ、まず湿ったグルテン内の水分が加熱されて水蒸気の膨張力を生み、下の層の生地が生む水蒸気圧が上の層の生地を膨らませ、こうして一層ずつ成長していく。最後に層と層の間の油脂が熱で溶けてグルテン内に浸透し、元の水分を置き換え、各層の生地がサクサクと軽くなる——こうして美味しくふっくらとしたパンケーキができる。\n\nパンケーキは美味しい。"
 LY_event.106.a: "やったー"
 LY_event.107.t: "モンブランタルト"
 LY_event.107.d: "モンブランは栗のペーストを使ったフランス菓子である。繊細な口当たり、精巧な作りに上等な材料を合わせたフランス菓子。\n\nフランス語：Mont-Blanc\n\n名称の由来：ヨーロッパアルプスの秀麗な峰「モンブラン」にちなんで名付けられた。モンブランの外観はモンブラン山の形を模しており、山頂は一年中雪に覆われ、秋冬は木々が枯れて褐色になる。正統派フランスのモンブランは外側の栗クリームが褐色で、またモンブランは元々栗で作られていた。栗の収穫期は秋で、モンブラン山もちょうど秋に褐色になる。現在見られる他のフレーバーのモンブランは、後から派生したものである。フランスではmont-blancはそのまま「栗の」モンブランを意味し、mont-blancの前に栗を意味するフランス語を付けたりはしない。\n\n作り方：ジェノワーズ（クリームやジャムを挟んだ多層スポンジケーキ）を本体とし、周囲に帯状に栗のペーストを絞り、最上部に泡状のアイスクリームを飾る。"
 LY_event.107.a: "やったー"
 LY_event.108.t: "チョコレートティラミス"
 LY_event.108.d: "ティラミスは、コーヒーと酒の風味を持つイタリアのデザートである。マスカルポーネチーズを主材料とし、伝統的なデザートのスポンジケーキの代わりに指型ビスケットを使い、コーヒーやココアパウダーなどの材料を加える。口に入れると香ばしく、滑らかで、甘く、濃厚で、柔らかさの中に質感の変化があり、味は一方的な甘さではない。\n\nイタリア語でティラミス（Tiramisu）は「すぐに私を連れていって」という意味。伝説によれば、第二次世界大戦中、イタリアの兵士が戦場へ赴こうとしていたが、家にはもう何もなかった。彼を愛する妻は乾物を用意するため、家にある食べられるビスケットやパンをすべて一つの菓子に焼き込んだ——それがティラミスと呼ばれる菓子である。兵士は戦場でティラミスを食べるたびに、家と、家で愛する人を思い出した。"
 LY_event.108.a: "やったー"
 LY_event.109.t: "涼音お姉さん休暇"
 LY_event.109.d: "涼音お姉さんは休暇に行ってしまい、ケーキ店は一時休業ですorz"
 LY_event.109.a: "天命尽き、人事もまた奈何ともしがたし"
