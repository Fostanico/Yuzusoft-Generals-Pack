###乃爱事件链
 noa_event.1.t: "天使降臨？"
 noa_event.1.d: "……諦めかけたその瞬間、突然光が降りてきた。紅蓮の火のような光ではなく、太陽のような光。白い羽根が見える。雪の舞うように、純白の羽根が舞い落ちる。私が顔を上げた場所に——天使がいた。"
 noa_event.1.a: "本物の天使？"
 noa_event.1.b: "きっと夢だ"
 noa_event.2.t: "ポテチとコーラ！"
 noa_event.2.d: "天使はポテチを食べながらコーラを飲み、優雅に漫画に没頭している。しかも箸も使える。きっと天音に教わったのだろう。本当に楽しそうだ。昨日は神聖な感じがあったのに、本当に「天使」みたいだったのに……急に世俗的になった。"
 noa_event.2.a: "なんて食いしん坊な天使だ"

 noa_event.4.t: "乃愛に服を買う"
 noa_event.4.d: "異世界からはるばる来た皆さんが生活に馴染めるよう、普段着を買いにデパートへ行くことにした。"
 noa_event.4.a: "乃愛を見る"
 noa_event.4.b: "少し休む"
 noa_event.101.t: "風実花？"
 noa_event.101.d: "まさかここで風実花に会うとは。普段着姿は、普段の授業中の印象とはまったく違い、とても可愛い。"
 noa_event.101.a: "先生、いい匂いがします"
 noa_event.5.t: "cancanneednewnew"
 noa_event.5.d: "「でも、言っておくと……私は天使よ。人間の生活には詳しくないの」\n「正直に言うと、本物を見たことがないの」\n「だから……見てみたいの」\n「え？」\n「本物を、見てみたいの！」\n「な、何？！」\n「ちっ、誤解しないでよ！これは天使としての使命であって、不道徳な考えなんかじゃないの！絶対に！」\n「……」\n「なんで何も言わないのよ！」"
 noa_event.5.a: "同意する"
 noa_event.5.b: "愛ちゃん、やめてよ！"
 noa_event.8.t: "海辺！"
 noa_event.8.d: "……\n「そんなに考え込まないで。むしろ私こそあなたに迷惑をかけてる気がするわ。ごめんね、乃愛」\n「そんなことないよ。私も楽しい。海に来ただけじゃなくて、知らないことをたくさん学べてる」\n「私にとって……初めてなの。こんなふうに遊んだり……美味しいものを食べたり」\n「あなたと出会って、いろんなことを一緒に経験できて、嬉しい」\n「そうか、それなら良かった」\n「うんうん」\n乃愛が見せた笑顔は、いつもよりずっと子供らしかった。海に来て本当に良かった。"
 noa_event.8.a: "良かった"
 noa_event.9.t: "少し気になること"
 noa_event.9.d: "私たちは木陰で汗を拭き、買ったばかりのアイスを開けた。\n私はリングを引いて、先端を切り落とした。\n「んー、お、意外と簡単に切れた」\n私の動作を確認して、乃愛も先端を切り落とし、唇を先端に当てた。\n「ん？ん？思ったより食べにくいわね、これ」\n「揉んで、押し出しながら食べるんだよ。ちなみに私は噛みもするけどね」\n「揉んで……これでいいの？手がちょっと冷たい……ん……ん！」\n「出てきた！パリッとして爽やか！」\n乃愛は目を輝かせて、嬉しそうに報告した。\n······\n「乃愛が言う通り、気になることがあるんだ」\n「今朝話した夢の話は、話した通りなんだ。ただ……乃愛には言っていない」\n「夢の中で見た戦乙女が、乃愛の顔ととても似ているんだ」\n「親子でも姉妹でもない。同一人物としか考えられないほど、とても似ている」\n「うん」\n「これは偶然じゃないだろう？」\n「『最後に笑いながら終われたのは、驚きだったな』」\n「魔王は最後にそう言ったはずなの」\n······\n「私は、魔法技術で作られたの」\n「——違うわ。私の前世、戦乙女が」"
 noa_event.9.a: "乃愛……"
 noa_event.11.t: "デート"
 noa_event.11.d: "「見て、乃愛、こっちに向けて」\n乃愛の手の中の花火が、夜の海岸を照らした。\n乃愛はきらめく光を嬉しそうに見つめている。\n「これが花火なの？」\n「花火って綺麗ね。ただ見ているだけでも……うん、楽しい」\n「乃愛の方がもっと綺麗だよ」\n「ふふ……好きな人の言葉でも、それは嬉しくないわ」\n「どうして！」\n「だって、冗談にしか聞こえないもの」\n「ときめかないの？」\n「私でも、その言葉ではときめかないわ。むしろ面白いと思う」\n「なるほど」\n「ありがとう。今日のデート、花火も含めて楽しかったわ」\n「僕も嬉しいよ」\n「こうやって回すともっと綺麗よ」\n「俺もやる、見て見て～」\n「おー！すごいわね、その動き。私もやってみる」\n「こんな時間がずっと続けばいいのに」"
 noa_event.11.a: "「だから、これからも続けよう。一緒にもっと楽しい時間を作っていこう。二人だけで」"
 noa_event.12.t: "ちょっと変な乃愛"
 noa_event.12.d: "「お邪魔します」\n「来たね……えへへ」\nいつもと違う乃愛の微笑みを見て、思わず胸の鼓動が速まった。\n「一緒に寝ることなんだけど……」\n「今夜は一人だと寂しいから……いいかな？」\n「もちろんいいよ。確認するまでもない」\n「不思議だね、乃愛がこんなに甘えてくるなんて」\n「じゃあ……ダメ？」\n「もちろんいいよ」\n「よかった」\n微笑む乃愛が近づいてきた。\n一歩一歩、私に近づく。\n限界まで近づいた乃愛は、ぎゅっと私の体を抱きしめた。\n「する？」"
 noa_event.12.a: "乃愛、ちょっと変だぞ"
 noa_event.12.b: "思う存分、派手にやろうぜ！\n§R誰にもこの選択肢を選ぶことをお勧めしません§!"
 noa_event.10001.t: "おかしい！！！"
 noa_event.10001.d: "...\n「子よ、私の子よ」\n「魔王の子」\n「————！？」\nさっきまで高ぶっていた感情が、瞬時に冷めていった。\nこの雰囲気、どこかで……\n三国さん！？\n待って、つまり今の乃愛は——？\n私はすぐに乃愛から逃げ出そうとした。\nしかし、体は自由に動かなかった。\nそんな私を見て、乃愛はくすくすと笑った。\n「さあ、もう一度やりましょう」\n「えへへへ」"
 noa_event.10001.a: "§RBAD END§!"
 noa_event.13.t: "腑に落ちた"
 noa_event.13.d: "私は彼女の小さな体をぎゅっと抱きしめた。\nいつものように……いや、いつもよりずっと、ずっと強く。\n「え？力が強すぎて、ちょっと痛い……よ」\n「落ち着け。私は逃げたりしない」\n乃愛が痛がっても、私は腕の力を緩めなかった。\n「痛い……あっ！」\n私は目を閉じ、意識を自分の内側に集中させた。\n深く、広く、果てしない闇の中で、一点の紅蓮の光が揺らめいている。\nお願いだ！浄化よ、私に力を！乃愛を元に戻して！\n「何これ？！一体何なの？！」\n「元に戻ってくれ、乃愛……」\n「元に戻るって、どういう——」\n乃愛の答えを待たずに、私の内側の何かが炸裂した。\n目の前が白く染まり、奇妙な耳鳴りが脳を揺さぶった。\n「え？あ……私……どうして……？こんなこと……？」\n「どうして……！まさか自分から魔王を体に宿そうとするなんて……！！」\n「乃愛、戻ったのか？！」\n「戻ったと思う。私を縛っていた命令は、魔力で吹き飛ばされた……はずよ」\n「頭の中の声も……今は消えてる」\n......\n「私を操っていたのは……私を作った人」\n「そ、そんなはず——」\n「戦乙女を作った人たちだと思う」"
 noa_event.13.a: "くそ、もう少しで騙されるところだった"
 noa_event.14.t: "仇討ち"
 noa_event.14.d: "......\n「ええ、あなたたちを親と呼んでもいいかもしれない。あなたたちの研究があったからこそ、私は生まれたのだから」\n「残酷な実験の中で、体を無理やり成長させられ、魔族の敵になるよう洗脳され、多くの傷を与え、道具にされた」\n「最後には、死んだ後も道具として使われ続けた」\n「あなたたちの研究のせいで、私は魔族に怒りを抱いている。しかし……」\n「今、私は魔族よりもあなたたちに怒っている。これは当然でしょう？」\n「私は……この手で、あなたたちをこの死者の世界に連れて行く」\n「だから、これからすることはただの憂さ晴らしよ。ただの憂さ晴らしなんだから。だから、諦めなさい」\n「恨むなら、私を作り、非人道的な研究に加わった者たちの愚かさを恨みなさい」\n「ああああああああ！！」\n悲鳴とともに、稲妻が走り、空気が裂け、大地が震え、激しい雷鳴が轟いた。\nこの一撃を受けて、生きていられるはずがない。\nただ「この一撃を受けたならば」——それだけだ。"
 noa_event.14.a: "戦闘、最高！！！"
 noa_event.15.t: "新しい生活"
 noa_event.15.d: "「嬉しい」\n乃愛は嬉しそうに言いながら、くるっと振り返ってこちらを見た。\nあの声のように、乃愛は満面の笑顔を見せた。\n「本当に、嬉しい」\n「あなたに出会えて、人を好きになれて、幸せになれて」\n「だから、ありがとう」\n「私は今、とても幸せ。初めて手にした幸せは、絶対に手放さない」\n「だから、あなたも……絶対に私から離れないで」\n「好き……とても好き。全部が好き」\n「……不思議ね」\n「何度も好きって言われても、全然飽きないの。言われるたびに……胸がときめく」\n「ちょっと……あなたと過ごすほど、あなたのことが好きになっていく気がする」\n「これからもよろしくね」"
 noa_event.15.a: "よろしく！"
 noa_event.102.t: "事後"
 noa_event.102.d: "うわああ？！私……私、とんでもないことをしてしまった！"
 noa_event.102.a: "天使は恥ずかしがり屋"
 noa_event.103.t: "アイスクリーム"
 noa_event.103.d: "乃愛はアイスクリームが大好きらしい。買ってあげようか？"
 noa_event.103.a: "やったー"
 noa_event.103.b: "そんなお金はない"

