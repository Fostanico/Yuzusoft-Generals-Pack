#彩里事件链
 sairi_event.2.t: "可愛い女の子があなたを訪ねてきた"
 sairi_event.2.d: "せ、先輩！待ってください！あの！渡したいもの……があります！どうか、受け取ってください！じゃ、じゃあ、失礼します！とにかくお願いします、後で必ず開けて見てください！\n\n少女が立ち去るまで、あなたは状況を掴めなかった。それでも、あなたは少女がくれた手紙を受け取った。\n\nあなたは、この手紙の周りに何か未知の気配があることに気づいた。まるで、この世界には存在しないかのような。"
 sairi_event.2.a: "細かい問題は無視して、ちゃんと受け取る。"
 sairi_event.1.t: "一目惚れの告白？"
 sairi_event.1.d: "〖明日、私の放課後に、先輩は私の学校の1-A教室に来てください！先輩、前もってありがとうございます！〗\n\n手紙にはそう書かれていた。日理万機のあなたなら、本来なら絶対にこの少女を訪ねることはなかっただろう。しかし、あまりに誠実で初々しい態度が好奇心をそそったのか、それとも本当にこの少女を好きになったのか。あるいは、手紙に未知の魔法が仕掛けられていて、あなたの潜在意識を支配していたのかもしれない。いずれにせよ、休み時間から無理やり時間を捻出して、あなたはついにその可愛い少女と会った。\n\n〖先輩、私……あなたのことが好きです。付き合ってください！〗\n\nまるで普通の恋愛小説や漫画のように、彼女はあなたに告白した。違う点があるとすれば——あなたは、少女の力がJKのものとは思えないことに気づいた。反応する間もなく、あなたは彼女に押し倒されていた。あなたは想像し始めた——少女はきっと、自分を無理やり連れて帰って性奴隷にするつもりなのだと！"
 sairi_event.1.a: "逆に押し倒されたけど、可愛いからいいか！\n§Rこの選択肢は誰にもお勧めしません§!"
 sairi_event.1.b: "くそったれの脳みそ、なんで想像力だけはこんなに良いんだ？"
 sairi_event.1.c: "あなたは、この手紙の周りに何か未知の気配があることに気づいた。まるで、この世界には存在しないかのような。"
 sairi_event.3.t: "逆に押し倒される一秒前"
 sairi_event.3.d: "目の前の少女がこれほど恐ろしいとは、あなたは想像もできなかった。\n\nただ目の前の少女を見ているだけで、十億本のヤスリがあなたを削ろうと待ち構えているより、恐ろしく、悍ましい。\n\nあなたは自分の貞操を守るので精一杯で、他には何の手も打てない。\n\n「あ、あんた……こ、こ、こんなこと……し、しちゃダメ！ダメなんだ！」\n\n「先輩～なんでダメなんですか？さっきからちゃんと旗を掲げてるじゃないですか～先輩には好きな女の子とか男の子、いるんですか？私を考えてみませんか～これが私から先輩への告白です。しっかり味わってくださいね～先輩～」"
 sairi_event.3.a: "誰でもいい、ヒーロー、助けてくれ！"
 sairi_event.4.t: "美が英雄を救う"
 sairi_event.4.d: "門の外から一声の可憐な掛け声が響くと、鉄壁も何もかも、がらがらと瓦礫の山と化した。\n\nお見事、輝耶！見よ、あの姫君が飛び蹴りを心臓に叩き込む。三国に取り憑いた邪祟が辛うじてかわす。二人は教室の中で法を競い合い、がたがたと机が散らばり、ざあざあと紙と筆が舞う。\n\n見よ、姫君が印を結び、両手を虚空に巡らせれば、五行の術が尽く召される。邪祟は一時の造化を奪い得たとはいえ、姫君の秀麗なる才気に敵うはずもない。見るがいい、三国の身に黒気が立ち昇り、慌てふためいて四方へ逃げ散る。輝耶が手を招けば、一声の怪叫とともに、邪祟は牛頭馬面のもとへ往った！\n\nおお！誰が女子は男に劣ると言う？見事なまでに美が英雄を救う！"
 sairi_event.4.a: "ありがとう、輝耶。"
 sairi_event.5.t: "方策精詳、備えあれば憂いなし"
 sairi_event.5.d: "夜を徹して美少女たちを招集し、手紙の気配を一緒に鑑定してもらった。熟考の末、各自が持論を述べた。\n寧々＆紬：破片が集められると思う。\n芳乃＆ムラサメ＆茉子：祟神が斬れると思う。\n栞那：蝶が削れると思う。\n佐奈：あの大神の皮がまた痒いんじゃない？\n話す間もなかった乃愛：え？"
 sairi_event.5.a: "結局、わいわい騒いだ一同は、明日一緒に様子を見に行くことに決めた。"
 sairi_event.6.t: "絶地にもなお生機あり、死戦すれば或いは敵を破らん！"
 sairi_event.6.d: "教室の反対側から大きな音が響き、あなたは目の端で恐怖の光景を目にした——ドアが真っ二つに折れて、こちらに向かって飛んでくる。\n彩里はひらりと身をかわしたため、ドアの破片はあなたに100点の打撃ダメージを与えた。それ以外にも、人影の集団がこちらに突撃してくるのが見えたような？見間違いじゃないはずだ。\n見間違いじゃない、集団だ。彼女たちが巻き上げる土煙の中に、危険を告げるきらめきが見えた。\n「助太刀する！」\n無数の武器が彩里に向かって投げられるのが見えた——でも、あなたは彩里のすぐそばにいるんだ！\n頭が痛い。あれはどうやら紬のハンマーだ。なんでお尻も痛いんだ——芳乃、あちこちに突き刺すな！ばーんと片頬が腫れ上がる——佐奈、お前の拳はなんでこんなに硬いんだ……気絶は悪いことばかりじゃない。少なくとも今は。\n教室の前を通りかかった輝耶が物音を聞きつけ、ぐちゃぐちゃになった隅と、意識を失ったあなたを見た。彩里のそばを通るついでに、彼女に軽く祓いを施し、乃愛に聞いた。「これはどういうこと？この気絶してる人、何か悪いことしたの？」"
 sairi_event.6.a: "「乃愛：『知らない』」"
 sairi_event.7.t: "少女の本当の告白"
 sairi_event.7.d: "同じ便箋、同じ内容。ただし今回は、あの異様な気配はなかった。あなたはあの騒がしい連中に付いて来させず、一人で1-A教室へ向かった。\n夕陽が窓辺の少女にオレンジ色の夢を注ぐ。彼女は扉に背を向け、通りを二、三人連れで歩く人々を、ぼんやりと眺めていた。\n「彩里？今回は何も取り憑かれてないな？」\n少女は軽やかに振り返り、黒髪をふわりと揺らし、流れる光の中で輝いた。「先輩、来てくれたんですね？」秋波がひそかに揺れ、少女の笑みは心を奪うほど美しい。「今回は、私自身の気持ちです。先輩、聞いてください」\n夕陽はさらに鮮やかに燃えたが、彼女の頬に広がる赤みには敵わない。「先輩、私……あなたのことが好きです。今から、ずっとあなたのそばにいてもいいですか？」\n雰囲気はちょうど良く、あなたが答えようとしたその時、天井から異音が響き、がらがらと土埃が舞い散り——あなたは美少女の山の下に埋もれた。"
 sairi_event.7.a: "「芳乃、なにモジモジしてるんだよ…」#￥！%...."
 sairi_warning: "§R思いがけないことが起こります§!\n§R誰にもこのクリックをお勧めしません§!。試したい場合を除き、この決議は予測不能な結果をもたらします。その§R結果は極めて深刻で、以下を含みますがこれに限りません：セーブ破損、ゲームクラッシュ、国策ロック§!"
### 天音 ###
 sairi_event.8.t: "家の妹がちょっとおかしい"
 sairi_event.8.d: "私は本当に馬鹿だった。前世が天音の夢に現れて話しかけることだけは知っていたが、今日彼女の前世が乗っ取りをかけるとは知らなかった。早朝に起きてドアを開け、小さなお椀にご飯を盛り、私の天音を呼んでご飯を食べさせようとした。天音と呼んでも返事がない。出て見ると、机は空っぽで、私の天音がいない。彼女はいつも私より早く起きる。乃愛に聞いてみると、やはり起きていない。私は焦って、皆に呼びに行ってもらった。母が出かけるまで、待っても待っても七時になり、彼女が変な服を着て階段を下りてくるのが見えた。皆が言うには、どうやら乗っ取られたらしい。さらに聞いてみると……\n天音はあなたに頭突きをお見舞いした。「雑魚兄貴、そこで延々と呟くのやめてくれない？私は大丈夫だから！吸血鬼が一人家に増えただけじゃないか」\n「そうだ、昼は箸を一膳多く用意しといてね」\n……ますます賑やかになった"
 sairi_event.8.a: "私のバカで雑魚な兄貴を守りなさいよ、私の体を乗っ取った雑魚吸血鬼！"
 sairi_event.8.b: "ただの大きな夢だ"
 sairi_event.9.t: "吸血鬼の特別な準備"
 sairi_event.9.d: "ヴィズは自分の血で魔法陣の最後の部分を描き終えた。あとは起動式を待つだけだ。\nこの世界は彼女のものではないが、彼女はこの世界の安寧と平和を望んでいる。前世の経験が教えてくれた——屈辱に耐え忍んでも平和は得られない。敵の血を流し尽くしてこそ、平和の可能性が生まれる。一人の犠牲が平和の到来を早めるなら、彼女はすべてを捧げることを厭わない。\nこの世界には彼女の愛がある。たとえ彼が彼でなくても。\nヴィズは儀式を起動した。\n\n【既に一度下した覚悟】"
 sairi_event.9.a: "「頼むよ、代わりに彼とちゃんと生きてやってくれ。雌小鬼の妹よ」"
 sairi_event.10.t: "あなたと彼女の謎の覚悟"
 sairi_event.10.d: "天音は長いこと悲しんだ末、あなたのそばで力になることを決めた。\nもう、大切な人を失いたくないのだと、彼女は言った。"
 sairi_event.10.a: "「私が雑魚兄貴を守る方でしょ～」"
 sairi_event.101.t: "胎児の夢"
 sairi_event.101.d: "年下の女の子に逆に押し倒されるのは、あなたにとってこの上なく羞恥の極みだが、どうしようもないことだと分かっている。相手の力は牛の如く、周囲には人気がなく、抵抗に使えるものすら見当たらない。\n\n抵抗が不可能だと確定した以上、下の小脳が次第に上の大脳を占拠していく——この時、あなたの息子はもはやあなたの息子ではなく、あなたの大将である。\n\n暴行はなおも続き、あなたの意識は眼前の少女の圧迫の下で、徐々に、しかし確実に明晰になっていくのを感じた。あなたは少女の過去、少女の感情、少女の思考をはっきりと感じ取れる。止める術もなく、あなたは少女のすべてを味わう。やがてあなたは母体へ回帰するあの狂おしい喜悦を感じ始め、理解し得ぬこの狂おしい感情を理解していく。あなたの思考は一秒ごとに、今ここにいない自分を感じている——少女の「春心」の中にいるかのように。§R【胎児の夢】を見始めた§!"
 sairi_event.101.a: "§R「今この瞬間も、あなたはそこにいるんですか？先輩～」§!"
 get_weizi: "§Y決議§! £GFX_decision_icon_small §Y吸血鬼の特別な準備§!を解放 \n将軍§Yヴィズ§!を登用\n§Yレベル:5 §!\n £trait_attack:7 £trait_defense:5 \n £trait_planning:7 £trait_logistics:5"
 remove_amane_advisor: "顧問§Y谷風天音§!を獲得（効果：政治力：§G+49%§! 生産効率上限：§G+25%§! 工場生産力：§G+25%§!）\n\nこの顧問は、民族精神 §Y「薇之一腔骨血、可駆馳来北馬否？」§!が期限切れになるか、§Y戦争が終結§!した後に§t外されます！§!"
 get_amane: "天音を獲得！"
 amane_skill_more_than_four: "§Y谷風天音§!の将軍レベルが§Y4より大きい§!必要があります！"
 Amane_Special_Wedding: "あなたと彼女だけの結婚式"
 Amane_get_weizi_skill: "天音が前世のスキルを継承"

 #核心圈
 start_event.10.t: "中核団の結成を開始"
 start_event.10.d: "中核団が有効になります。ここで少女たちに大いに腕を振るってもらいましょう！\n\n従来の柚子コインシステムは「ゆず経済部」に統合されました。柚子コインの説明の下にあるボタンをクリックするとパネルが開きます。\n従来の好感度上昇決議は「ゆずスーパー」に移されました。余った柚子コインはスーパーで各種ポイントや小物を買って好感度を上げるのに使えます！"
 start_event.10.a: "分かりました"
### 来海 ###
 decision_cost_50_army_xp: "£army_experience §Y50§!"
 decision_cost_50_army_xp_blocked: "£army_experience §R50§!"
 krm_wake_up_to_past_lives_tt: "決議£GFX_decision_icon_small §Y前世の姿を目覚めさせる§!を§Y2回以上§!実行済みであること（現在[?krm_wake_up_to_past_lives|Y0]回実行）"
 wake_up_to_past_lives: "前世の姿を目覚めさせる"
 kurumi_learn_theory: "来海ちゃんに兵法を教える"
 kurumi_research_past_lives: "来海と異世界へ来海の前世の秘密を調査に行く"
 sairi_event.11.t: "魔法少女こひばり、変身！"
 sairi_event.11.d: "このところ奇抜な格好の連中が増えた。知らない人は司令部でコミケでもやってると思うだろう。でも私は思う——小雲雀、お前が流行りに乗る必要はないんじゃないか？\n本人は慌てふためいて騒いでいて、恥ずかしがっているように見えるが、どう見てもこの服は彼女に似合っている……え？頭の上に何か二つ生えてる？角？このコスプレ、結構凝ってるな。\n（なでなで、もにゅもにゅ）「あああああ痒い痒い、動かないでよ！！！！」来海の平手が正確に右頬を捉え、目の前が真っ暗になった。\n\nコスプレじゃないのか？.......\n「もう騒がないでよ！私、本気で怒るからね！道徳は？羞恥心は？！」"
 sairi_event.11.a: "一破、臥龍出山"
 sairi_event.11.b: "ただのコスプレだ"
 sairi_event.12.t: "心を伝える旅"
 sairi_event.12.d: "小雲雀は天才少女だ。誰もがそう思っているし、私もそう思う。でも一つだけ、彼女は間抜けなところがある——探検服の着方がてんでバラバラなのだ。\n来海は慌ててこっちを引っ張りあっちを引っ張り、どうやら私がそばにいることすら忘れているようだ。手を伸ばして、手際よく彼女の身支度を整えてやると、ようやく出発できるようになった。\nじゃあ、先行くぞ。\nあれ、誰が袖を引っ張ってる？\n小雲雀が後ろからぴょこんと飛び出してきた。「一緒に行くよ。私が不器用だって、そんな表し方しないでよ」彼女は体を伸ばして、大きく伸びをした。「異世界は危ないんだからね。あなたを守れるかどうか、分かんないけど」\n「じゃあ、はぐれるなよ。離れたら終わりだぞ」「うん」小雲雀の顔が少し赤くなったような気がする。気のせいだろう。\n「これからも、ずっと私と離れないでくれる？私はあなたを失いたくないの。離ればなれになったら、悲しくなるから」"
 sairi_event.12.a: "歩調を合わせて、一緒に歩いていこう！"

### 艾莉 ###
