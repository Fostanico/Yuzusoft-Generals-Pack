 sp_rocket_improve_desc: "カチューシャがバニラの数値ほど弱いわけがない。バニラのカチューシャの数値は本当に逆天なので、カチューシャが戦場で見せる真の制圧力を再現する\n何？なぜカチューシャに鹵獲率が付くのかって？ロケット砲が敵戦車の車頂に降り注げば、車組員はみんな衝撃で気絶する。鹵獲されるに決まってるだろ\n（ロバの考えが本当に分からない。カチューシャ大隊に俺のトラックが16台も必要なのに、なぜゴムまで取るんだ？トラックはタイヤが4つでゴム1つ。カチューシャ砲はトラックの後ろに載ってタイヤ2つなのに、ゴムがもう1つ必要だと？？？——huhu）"
