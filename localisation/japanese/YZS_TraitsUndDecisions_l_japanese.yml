 YZ_MIO_1_get: "ゆず歩兵武器製造局を設立"
 YZ_MIO_1_get_desc: "戦争は日々変化しているが、歩兵と火砲は依然として一席を占めている。したがって、強力な火力と頑丈な小銃が勝利の鍵だ。幸い、この少女たちがそのようなメーカーを設立するのを助けてくれる。\n\nゆず軍産組織を解放"
 YZ_MIO_3_get: "ゆず海軍防衛艦製造総局を設立"
 YZ_MIO_3_get_desc: "水中の小人たちの卑劣な奇襲を防ぎ、我々も敵を奇襲するために、これらの小型艦艇を無視することはできない。\n\nゆず海軍防衛艦組織を解放"
 YZ_MIO_5_get: "ゆず海軍主力艦製造総局を設立"
 YZ_MIO_5_get_desc: "強力な海軍と先進的な海軍メーカーを持つことでのみ、海洋大国たちと覇を競う自信を持てる。\n\nゆず海軍主力艦組織を解放"
 YZ_MIO_7_get: "ゆず空軍製造総局を設立"
 YZ_MIO_7_get_desc: "先進的な空軍で我々の青空を守らなければならない。戦争において全知全能たれ！\n\nゆず空軍組織を解放"
 YZ_MIO_9_get: "ゆず装甲生産設計センターを設立"
 YZ_MIO_9_get_desc: "様々な兆候から、未来の戦争は塹壕戦ではなく装甲力に依存する機動戦であり、鋼鉄の奔流が敵の防衛線を引き裂き、我が軍突破の剣となる。\n\nゆず戦車組織を解放"
