 get_Nanami_cheif: "\n§W七海陸軍司令を獲得します§!（効果：\n毎日の陸軍経験値成長：§G+0.09§!\n陸軍経験値成長：§G+10%§!\n動員速度：§G+15%§!\n偵察：§G+100%§!\n陸軍師の中核領土攻撃：§G+5%§!\n陸軍師の中核領土防御：§G+5%§!\n熟練兵の損失：§G-35%§!\n計画速度：§G+30%§!\n計画ボーナス上限：§G+15%§!\n戦闘中の負傷確率：§t+50%§!\n協調性：§G+5%§!)"
