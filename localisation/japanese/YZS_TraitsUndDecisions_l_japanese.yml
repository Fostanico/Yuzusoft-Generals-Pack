 yz_yuki_trait: "才色兼備の美少女"
 yz_yuki_trait_desc: "な、なに言ってるの！？ただ私のプライドが、あなたと互角の勝負ができないのを許さないだけ！だから音楽室を開放しただけで、他に意味なんてないんだから！"
 yz_yuki_trait_2: "もう孤独じゃない"
 yz_yuki_trait_2_desc: "あなたが私の孤独を溶かしてくれた……だから……だから…私のものになってよ！"
 yz_sumi_trait: "将来有望なドラマー"
 yz_sumi_trait_desc: "あのリズム感の才能は、音楽をやる上でとても有利。生まれ持った才能は本当に恐ろしい……"
 yz_sumi_trait_2: "杏子との約束"
 yz_sumi_trait_2_desc: "「うん、約束。私がここを離れても、ずっと須美を待ってる。須美が胸を張って『友達』という言葉を言えるようになるまで……そして……いつか二人で笑って再会する——そんな約束」\n「私…頑張るよ、ちゃんと笑顔を保てるように……そのために頑張ってみる……」"
 yz_noriko_trait: "料理苦手"
 yz_noriko_trait_desc: "弁当箱の中は、半分が白米で半分がおかず……そして、他の真っ黒な何かがぐるぐるしているのは……"
 yz_noriko_trait_2: "もう強がらなくていい"
 yz_noriko_trait_2_desc: "私はみんなが想像するような人間じゃない……学級委員にふさわしい人間なんかじゃない……心が強い？何を言われても気にしない？私だって傷つくんだよ！"
 yz_tae_trait: "心安らぐお守り"
 yz_tae_trait_desc: "ただの古びたお守りかもしれないけど、私にとっての意味はお守りだけじゃない……私にとって……とても…大切な…楽しい思い出……"
 yz_tae_trait_2: "二人だけの《絆》"
 yz_tae_trait_2_desc: "私も……ずっとあなたのそばにいたい。毎日あなたを起こしに行って、一緒に学校に行きたい。私の作ったご飯を食べてほしいし、一緒に部活もしたい"
