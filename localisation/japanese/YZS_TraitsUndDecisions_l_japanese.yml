 Nanami_advisor_get_desc: "§W七海は大規模なサイバー攻撃を仕掛ける能力を持つ。第二次世界大戦時代の情報機関を相手にするのはお手の物だ。彼女に我が国の情報網を建設させるのが最も適任だ。\n\n§t七海の見えざる手が届くところ、スパイと情報が氾濫する！§!\n\n§Y七海顧問を獲得します§!§!"
 get_Nanami_advisor: "\n§W七海顧問を獲得します§!（効果：\n生活必需品工場係数：§Y20%§!\n外国の転覆活動効率：§G-25%§!\n転覆活動コスト：§G-25%§!\n抵抗成長速度：§G-25%§!\n駐屯軍浸透確率：§G-10%§!\n民事情報：§G+30%§!\n陸軍情報：§G+30%§!\n海軍情報：§G+30%§!\n空軍情報：§G+30%§!\n防諜：§G+2§!\n抵抗組織強化効率：§G+100%§!\n工作員枠：§G+1§!\n解読能力：§G+4§!\n情報網強度成長率：§G+50%§!\n我方工作員発見確率係数：§G-50%§!\n我方工作員逮捕確率：§G-50%§!\n情報獲得率：§G-50%§!\n情報機関アップグレード時間：§G-15%§!\n解読能力修正：§G+150%§!)"
 Nanami_high_command_get: "星幽治療術を戦地医療に応用"
