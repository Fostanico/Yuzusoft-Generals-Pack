 industry_money_category_desc: "§W現在のゆずソフト建設資金： £GFX_yz_money [?yz_money|+1]\n毎月の純変化： £GFX_yz_money [?monly_YZ_money_visible|+1]  (§Y上限：£GFX_yz_money [?yz_money_max|.0+Y]§!)§!\n工場が多いほど、毎月獲得できる資金も多くなります！"
 yz_money_desc_tt: "§W§Yゆずソフト建設資金§Wは、本MODの追加コンテンツで消費する資源です。初期上限は§Y20,000§W（国債発行時は、ゆずコインを通常の上限を超えて発行できます）。\n建設資金は工業力に応じて増加し、§Yゆず経済部§!から追加で獲得することもできます。\n月次決算後の残高は§Y0§!未満になりません。§Y長期工業投資§!の支払いに足りない場合、進行中の長期投資は資金不足により停止します。"
