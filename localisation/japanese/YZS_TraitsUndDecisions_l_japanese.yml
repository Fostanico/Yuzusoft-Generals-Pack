 maid_cuodao_trait1_desc: "毎日多忙を極めているが、我らが偉大な三司さんは、それによって学校の様々な活動で確かな手腕を鍛え、品性を磨き、理想を固め、果敢に奮闘している……すみません、チャンネルが違いました。最近、三司さんは中国のある師長と楽しげに会話しているようだ……よく分からないが、まあ、どうでもいいか？とにかく、綾司令官、命令を下へ伝達せよ！"
 maid_cuodao_trait2: "どちらも本当の私だよ"
 maid_cuodao_trait2_desc: "一度だけ見せてあげる。私の本当の姿を受け入れてくれる？これは二人だけの秘密だよ（言いふらしたら承知しないからね）。これからもずっと守っていってね"
 maid_cuodao_trait3: "完璧へ一歩ずつ進む少女！"
 maid_cuodao_trait3_desc: "キラキラの魔法をまとい\n困っている人を見つけたら\nこの女神のような愛で（バレない限り）\nぎゅっと抱きしめてあげる～"
 maid_shirley_trait: "世界を温める計画"
 maid_shirley_trait_desc: "sensei、敵の持続的な攻撃と爆撃に悩んでいますか？私はいつだって仲間を連れて、一緒に難局を乗り越えますよ～"
 maid_kotori_trait: "長風を駆る"
 maid_kotori_trait_desc: "風属性の星幽使いとして、空気の力を操り、空地協同作戦を得意とする。"
 yz_kurumi_trait: "普通のギャルJK"
 yz_kurumi_trait_desc: "来海"
 yz_kurumi_trait0: "普通のギャルJK"
 yz_kurumi_trait0_desc: "角が生えてても、そんなに見なくてもいいでしょ……ね？そう思うでしょ？"
 yz_kurumi_trait01: "駆け出しの天才ギャルJK"
 yz_kurumi_trait01_desc: "この数億光年の物語を語るために、私はここへ来たのよ～"
 yz_kurumi_trait_1: "異世界のトップ参謀の一片の記憶（？"
 yz_kurumi_trait_1_desc: "「あなたのいない世界なんて…私にはどうでもいい…一片の興味もない\nこの言葉をあなたが聞けば、怒るだろうね…でも、もう十分だろう?\n次にどうするかは、私の自由だ。さようなら」"
 yz_kurumi_trait_2: "見守る者の見守る者"
 yz_kurumi_trait_2_desc: "言葉よりも、身体よりも\n\n奥底に秘めた想いには敵わない 互いに縁で結ばれているから\n\nまだ続く道の上で、何があっても\n\n二人だけでいれば、それでいい"
 yz_airi_trait: "小さな勇気！"
 yz_airi_trait_desc: "あなたがいるから\nあなたが見ていてくれるから\n私は前を向いて歩いていける"
 maid_lena_trait: "シスの血筋"
 maid_lena_trait_desc: "フィンランド人技術者の末裔であるレナは、いかなる寒さも恐れず、血に流れる血潮が冬季作戦への独自の理解を与えている"
