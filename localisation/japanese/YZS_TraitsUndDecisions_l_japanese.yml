 proud_army_must_be_defeat: "驕兵必ず敗れる"
 sky_mind_revise: "天意修正"
 sky_mind_revise_desc: "天意様は現在の戦局が歴史の流れに反していることを検知した。天意様は歴史を修正し、状況を歴史の軌道に戻そうとしている"
 sky_mind_revise_kr: "天意修正（KRサンディカリスト特供）"
 sky_mind_revise_kr_desc: "天意様は現在の戦局が歴史の流れに反していることを検知し、修正を実行する（この決議の検知はRUSタグに依存。バニラで見かけた場合、バニラの北米総監区域も同じタグらしい……逆天のロバ）"
 new_three_national_road_tp: "新三国国道"
 new_three_national_road_tp_desc: "新三国道は転送ゲートの役割を果たす。新三国道を使って大規模転送による軍事移動ができる（本決議CD30日）"
 star_night_action: "星夜作戦"
 star_night_action_desc: "周知の通り、星夜奇襲は奇襲の行軍速度を上げる。だから星夜奇襲をもっと活用して、高機動の戦術を達成できる（本決議CD30日）"
 two_man_conspire: "二人の密謀"
 two_man_conspire_desc: "周知の通り、二人の密謀は必ず盗聴を誘発する。我々が自ら密謀者となり、他国を密謀に招待すれば、二人密謀環境を作り出して盗聴キャラをリフレッシュできる。盗聴キャラが我々の人間であることを確保すれば、二人密謀環境を巧みに利用して他国の情報を窃取できる"
 waerhalajieshe_s_new_member: "ヴァルハラ結社の新メンバー"
 waerhalajieshe_s_new_member_desc: "結那も聖遺物を覚醒させた後、結那はソフィと一緒に聖遺物を探し、ヴァルハラ結社に加わることができる"
