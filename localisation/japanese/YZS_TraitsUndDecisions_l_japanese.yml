 youzu_md_military_reform_1: "新戦車を連ね、稲妻の如く出撃せよ"
 youzu_md_military_reform_1_desc: "主力戦車が正面を突破し、歩兵戦闘車が火力を浴びせながら追随し、装甲兵員輸送車が歩兵を安全に突破口へ送り込む。現代装甲集団とは車両の寄せ集めではなく、速度・情報・連携によって維持される突撃体系である。"
 yz_md_military_reform_1: "ゆず現代諸兵科連合装甲改革"
 yz_md_military_reform_1_desc: "主力戦車、歩兵戦闘車、装甲兵員輸送車を強化する"
 yz_md_military_reform_1_effect_tt: "§Y主力戦車§!：対人・対戦車攻撃§G+25%§!、防御§G+15%§!、突破§G+30%§!、速度§G+10%§!、指揮統制率§G+2§!、信頼性§G+20%§!\n§Y歩兵戦闘車§!：対人攻撃§G+30%§!、対戦車攻撃・防御・突破§G+25%§!、速度§G+12%§!、指揮統制率§G+3§!、信頼性§G+20%§!\n§Y装甲兵員輸送車§!：対人・対戦車攻撃と突破§G+15%§!、防御§G+35%§!、速度§G+12%§!、指揮統制率§G+4§!、信頼性§G+20%§!"
 youzu_md_military_reform_2: "武装ヘリは雷火を放ち、点を穿つ"
 youzu_md_military_reform_2_desc: "武装ヘリコプターは地形障害を越え、装甲目標と火力拠点を迅速に攻撃する。輸送ヘリコプターは突撃部隊、補給、救援戦力を必要な地点へ送り届ける。回転翼航空は地上軍が敵縦深へ伸ばす刃となる。"
 yz_md_military_reform_2: "ゆず陸軍航空改革"
 yz_md_military_reform_2_desc: "武装ヘリコプターとヘリボーン部隊を大幅に強化する"
 yz_md_military_reform_2_effect_tt: "§Y攻撃ヘリコプター§!：対人・対戦車攻撃と突破§G+50%§!、対空攻撃§G+25%§!、防御§G+35%§!、速度§G+20%§!、指揮統制率§G+5§!、信頼性§G+30%§!\n§Yヘリボーン部隊§!：対人攻撃・防御・突破§G+35%§!、対戦車攻撃§G+25%§!、速度§G+20%§!、指揮統制率§G+6§!、補給消費§G-15%§!；輸送ヘリコプターの信頼性§G+30%§!"
 youzu_md_military_reform_3: "無人機データリンク、鍵盤から硝煙を"
 youzu_md_military_reform_3_desc: "空中の偵察攻撃プラットフォームから歩兵随伴の戦術無人機まで、センサー、指揮ノード、兵器プラットフォームを一つのデータリンクへ接続する。敵の配置は隠しにくくなり、我がネットワークへの浸透を試みる工作員には厳重な対抗措置が待つ。"
 yz_md_military_reform_3: "ゆず無人化・データリンク改革"
 yz_md_military_reform_3_desc: "無人機、情報網、偵察、防諜能力を強化する"
 yz_md_military_reform_3_effect_tt: "§Y情報体系§!：情報網構築§G+30%§!、情報機関防御§G+30%§!、敵工作員探知§G+25%§!、暗号解読§G+20%§!、偵察§G+25%§!\n§Y航空無人機§!：対空攻撃・防御・対地攻撃§G+40%§!、機動性§G+30%§!、航続距離§G+25%§!、生産コスト§G-20%§!、信頼性§G+35%§!\n§Y戦術無人機中隊§!：偵察・対人攻撃・対戦車攻撃・防御・突破§G+1§!、指揮統制率§G+3§!；地上無人機の信頼性§G+35%§!"
 youzu_md_military_reform_4: "手榴弾、狙撃、遠距離火力、陸海空天電！"
 youzu_md_military_reform_4_desc: "個人火器、精密射撃、長距離火力から陸海空戦力の連携まで、現代戦の全領域を統一指揮系統へ組み込まなければならない。すべての兵士を体系のノードとし、すべての軍種を同じ戦場状況図の下で行動させる。"
 yz_md_military_reform_4: "ゆず全領域統合作戦改革"
 yz_md_military_reform_4_desc: "歩兵を大幅に強化し、陸海空の統合作戦能力を全面的に高める"
 yz_md_military_reform_4_effect_tt: "§Y歩兵§!：対人・対戦車攻撃、防御、突破§G+35%§!、速度§G+10%§!、指揮統制率§G+5§!\n§Y陸軍§!：対人・対戦車攻撃、防御、突破§G+15%§!、主導権§G+10%§!、補給消費§G-10%§!\n§Y空軍§!：作戦効率・攻撃・防御§G+20%§!、機動性§G+15%§!\n§Y海軍§!：攻撃・防御§G+20%§!、速度§G+10%§!、指揮統制率§G+15%§!\n歩兵装備、火砲、対戦車、対空、汎用車両、固定翼機、Millennium Dawn艦体の信頼性§G+20%§!"
 huhu_s_help: "huhuの助け"
 huhu_s_help_desc: "一つの系統の非共通の全軍改分岐を完了し、新軍改の作者本人も持っていることを考慮して、少し助けをあげよう。もう一方の系統の軍改ラインをクリックできるようになった"
