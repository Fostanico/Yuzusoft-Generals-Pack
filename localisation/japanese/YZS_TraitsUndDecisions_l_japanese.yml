 YzOpreative_anti_enemy_operative_desc: "我々の情報局長・在原七海は、様々な情報を通じて敵が我が国に送り込んだスパイを特定した。七海は彼らを一網打尽にする除奸作戦を決行することにした。しかし、これらのスパイの多くは政府部門や軍部の要人であり、この作戦は国内に一時期の動揺を招くだろう。しかし、それに見合う価値があることは間違いない"
