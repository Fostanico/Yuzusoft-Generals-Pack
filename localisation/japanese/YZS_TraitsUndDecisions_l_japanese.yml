 start_event.23.t: "ゆず将軍MOD基本ガイド1"
 start_event.23.d: "Ciallo、ゆずソフトMODへようこそ！\n本MODはアドオン式の多機能将軍パックで、指導者、将軍、顧問、MIO（軍産組織）および一連の独自決議と個人メカニズムを提供します！\n単なる将軍パックとして使いたい場合は、決議欄で「将軍パック青春版」を選択できます（完全版はすべてを含む）\n☆交代可能な指導者：芳乃、ゼロバスト、恭平、寧々、ムラサメ、羽月、美羽、小夜、ゆず集団指導者（メイド議会のようなもの）\n☆将軍はほとんど実装済み！提督には：佐奈、寧々、栞那、七海、羽月、茉子\n現在、exe以外の作品キャラは揃っています（ただし多くはまだ白紙の将軍。やる気のある方は参加して、好きなキャラの設計案を提供してください）\n☆現在の顧問＆その他の内閣：\n 顧問：寧々、めぐる、ムラサメ、芳乃、七海、ゼロバスト、恭平、莉音、愛莉など\n大臣：百里風実花、戸隠憧子、羽月（決議で解放）\n総司令官：あやせ、ナツメ、ムラサメ、めぐる、涼音、茉子など\n☆ゆずMIO：かなり強力なボーナスで、ゲームの難易度を下げるかもしれません。設立決議の表示には対応する経験が15ポイント必要\n陸軍-ゆず歩兵武器製造局＆ゆず装甲生産設計センター\n海軍：ゆず近海ギョーザ局＆ゆず遠洋タンユエン局\n 空軍：ゆず空軍製造総局\n☆独自のメカニズム＆追加コンテンツ！\n本MODは多くの追加コンテンツを導入：キャラ専用（イベントチェーン、任務チェーンなど）；新しいポイントシステム—柚子コイン（金円券）；中核団；721研究所；ゆず文化局；工業化決議；ゆずソフト士官学校；好感度（結婚）"
 start_event.23.a: "次のページ"
 start_event.24.t: "ゆず将軍MOD基本ガイド2"
 start_event.24.d: "*キャラ専用コンテンツ：これらの多くは「将軍成長決議」に統合されています。独自のイベントチェーンや任務チェーンを持つキャラは、完了後に結婚決議が解放されます\n -イベントチェーン：芳乃、あやせ、乃愛\n -独自コンテンツ：\n天使☆騒々：天音、来海-任務チェーン；輝耶-隠し決議「可愛い女の子があなたを訪ねてきた」（彩里正史/if/be線）で三国彩里を追加登用可能\nカフェ・ステラと死神の蝶：「パンケーキを作る」決議で汐山涼音を登用可能；汐山涼音-スイーツ作り決議で期間限定ボーナス\nRIDDLE JOKER：七海-七海情報局＆星幽戦地病院を解放（七海を総司令官と政治顧問の両方にしたい場合は、先に総司令官を任命してから顧問を任命してください）；茉優-721研究所＆「星幽術の研究を開始」決議、繰り返し実行で伊勢琴里を解放\n千恋＊万花：ムラサメ-小さなムラサメにパフェを食べさせる、顧問解放；芳乃-芳乃の穂織振興計画\nサノバウィッチ：魔宴タロット、15日ごとに再抽選でき、永続修正を得られる；寧々-721研究所；めぐる（巡）-めぐるの装備製造業アップグレード計画；寧々と紬は独自の将軍スキルを持つ\n天色＊アイルノーツ：真咲-真咲のチェーン店で補給所を素早く建設；愛莉：任務チェーンで独自の水晶支援中隊を解放\nDRACU-RIOT!：吸血鬼戦術小隊、莉音-「運命に打ち勝つ」決議で将軍を強化し、顧問を獲得\n天神乱漫：佐奈-「佐奈の誕生日を祝う」決議。毎年忘れずに祝えば、非常に強力な佐奈を得られます\n夏空カナタ：茅羽耶-独自決議（原作再現？）\nぶらばん！～The bonds of melody～：海老原みなせ-独自の将軍スキル"
 start_event.24.a: "決議の下段をクリックして他のコンテンツを閲覧"
 start_event.25.t: "ゆず将軍MOD基本ガイド3"
 start_event.25.d: "*柚子コイン  政治力を少し使うだけで大量に発行できる。これが金円券だ（取り消し線）\nゆずシステムの核心。721研究所、ゆず軍改、二つの工業化などはすべて柚子コインを消費する\n決議欄の「中核団」で、「ゆず経済部」から政治力を消費して柚子コインを獲得できます。同じく「中核団」の「ゆず商店」ボタンで、柚子コインを政治力、指揮力、陸海空軍の経験値、そして面白い小物に交換できます\n*ゆず債券\n一契約を月次で自動返済する。安定型・開発型・戦時動員型を選択でき、延滞は債務と信用を悪化させ、満期には返済・延長・整理が必要となる\n*中核団\n120ppを消費して中核団を再編成し、特定のキャラ（最大三人）を中核団に入れて、特定のボーナスを獲得できます\n他の機能決議もここに統合されています。指導者の任命、羽月海軍部の設立、七海の専用決議、芳乃＆めぐる工業化など\n*ゆず文化局\n従属国向けの決議グループ。「ゆず金」（欧金金ではない）（中核団-ゆず商店で購入）を消費して、従属国を特化型従属国に転換したり、その国の全コアを獲得したりできます。「ゆずクラウド・スーパー会員」（クラウド会員への怨念から着想）で従属国の転換・統合を加速できます\n*721研究所\n寧々を登用した後、「中核団」欄で721研究所を設立。'721研究所'が出現したら正式な研究所設立を選択し、茉優を研究班長に任命すると全機能が解放されます。\n 研究所の機能には、研究施設の建設、突破ポイントの獲得、ボーナスカードの獲得、研究速度の向上などがあります。\n 「星幽術の研究を開始」と「星幽術研究への予算配分」は、研究速度を向上させ、星幽使いキャラ（七海、羽月、茉優、あやせ、琴里）を強化します。「星幽術研究への予算配分」を繰り返すと伊勢琴里を登用できます\n 琴里は空軍部を建設し、空軍にボーナスを提供できます\n 独自の特別プロジェクト：起爆器（支援中隊装備、戦車モジュール） 何だって？これは**じゃない。ボタンを押せば敵を空の彼方に吹き飛ばす起爆器だ！\n本MODは茉優、羽月、めぐる、寧々を登用すると、対応する科学者を生成します\n無料の装甲テンプレート：対応技術を研究後、決議で追加ボーナス付きの装甲テンプレートを生成できます。最良ではありませんが、ほとんどの場面で十分です\n *二つの工業化————芳乃の穂織振興計画とめぐるの装備製造業アップグレード計画\n国家工業躍進の核心。小国も大国もこれなしではやっていけません！柚子コインを工場に交換するのが好きですか？\n芳乃計画は民需工業の拡張に注力し、めぐる計画は軍需工業の拡張に特化します。両方を同時に動かすと柚子コインが不足するかもしれません。\n自動化工業アップグレードは実装済み。柚子コインを十分に確保し、初期決議を選択すれば、工業化は自動的に進行します。母はもう、工業化決議をクリックし忘れる心配をしなくて済みます\n 工業化完了後は強力な工業ボーナスを獲得。バニラに換算すれば、経済の奇跡です！\n*ゆずソフト士官学校 -将軍厳選、軍改、近衛軍\n将軍厳選：経験値と柚子コインを消費して将軍に指定特性を付与。戦争がなくても心配いりません\n軍改：五段階で、各段階の解放には対応キャラの登用が必要。軍改の最後には歩兵か装甲部隊のどちらかに偏る選択ができます。軍改完了後、部隊に強力な修正が付与されます\n近衛軍：柚子厨近衛軍を募集できます。ただし数は限られています（\n☆本MODには隠しキャラも含まれます：八六、和泉妃愛、アトリ、伊翩諺；\n八六のイベントチェーンは721研究所設立時に発生。妃愛は小雲雀来海（天使☆騒々）を登用すると解放される「卓辺談話を行う」決議で登用できます（天使☆騒々での妃愛の熱演に感謝、hiyohiyo~☆）。妃愛は将軍スキルで立ち絵を変更可能。アトリは721研究所で解放。伊翩諺（巨費を投じてコレクションをガチャったためにMODに組み込まれた制作者）は「ゆず商店」の千恋＊万花コレクションで抽選（小ガチャは心を癒し、大ガチャは財布を痛める）\nアトリは721研究所で解放され、独自の編制と支援中隊を持ちます。より先進的な技術を研究すると、より安価な改良型を開発できます。高難易度MODに挑戦するなら、生産能力が十分な場合にぜひアトリ支援中隊の装備を検討してください！"
 start_event.25.a: "次のページ"
 start_event.26.t: "ゆず将軍MOD基本ガイド4"
 start_event.26.d: "- ゆず宣伝部を追加。ポスター掲示、ゆず歌舞団の設立、ツアーなどで各種バフを獲得できます。ゆず歌舞団のツアーは一回につきランダムで8州に地域一時修正を追加します。従来のあやせライブ決議は、中核団内の「宣伝部の設立」と宣伝部内の「あやせライブの開催」に分割され、前者で顧問を獲得できます。\n- 柚子厨メカニズムをリセット。宣伝部の決議で国家の柚子厨数を増やせるようになり、柚子厨関連の各種決議には新規の「ゆずソフトゲーム」装備が必要になりました。この装備は宣伝部獲得後に生産できます。柚子厨は現在、柚子近衛軍編成用の人的資源として比例計算され、国家人口の増加に伴って増加します。\n- 現在、各段階の軍改決議は、国の非ゆず将軍一人にランダムで「柚子厨」特性を付与できます。一部の軍改決議は、特定の強力な宣伝部宣伝決議を解放します。\n- 情報機関に「国外柚子厨浸透」を追加。決議をクリックするたびに「柚子厨浸透レベル」が上昇し、レベルが高いほど従来の破壊工作の収益が増加します！同時に情報機関に国家選択決議を追加。主要国、国境国、非主要国をそれぞれ選択でき、一度に複数の国を選択してスパイ工作を行えます。「選択解除」をクリックすると選択を一括でクリアできます。従来の情報機関決議が戦時中しかクリックできなかった制限を撤廃しました。\n新たに操作パネルを追加。中核団を結成したら、上部にぶら下がっている七海をクリックしてパネルを開けます。パネルで各種決議グループのオン・オフを切り替えられ、従来の各種スイッチ決議は削除されました。\n備考：\n本MODはミレニアムドーン、TNOなどのMODとの互換性は限定的です。青春版でのプレイをお勧めします。TFRはほとんどの機能が使えますが、0721研究所はTFRに研究施設が無いため使用不可（クラッシュ警告！）\n本MODの完全版のパワーはインフレの道をひた走りです（笑）。より良い体験のためには、日共リメイク、IAR EXAI、各種EXAIなどのMODを選んで、ちょっとした天国戦争を楽しめます。あるいは青春版だけを使うこともできます——嫁たちがいれば十分ですから。\n本MODはgithubで最新版をダウンロードできます。githubアドレス:https://github.com/Fostanico/yuzumod 今後、過去のリリース版が記録されるかもしれません\n☆ゆずラジオ局の作者の同意を得て、ゆずラジオ局を本MODに統合しました。本MODはややバランスを崩す強さかもしれませんので、ゆずソフトのBGMを聴きたいけどそこまでの強さは要らないという方は、彼らのMODを単体で入れてください。アドレスはhttps://steamcommunity.com/sharedfiles/filedetails/?id=3143387438&searchtext=%E6%9F%9A%E5%AD%90\n☆グループメンバーによるゆずソフトと日共の小さなコンポーネント。本MODはそれに大きく啓発されています（設計からコードまで）。同時有効化はお勧めしませんhttps://steamcommunity.com/sharedfiles/filedetails/?id=3334303111&searchtext=%E6%9F%9A%E5%AD%90%E7%A4%BE\n☆意見やバグ報告は下のリンクにコメントするか、QQグループ（グループ番号967395223）にご参加ください。ドキュメント https://docs.qq.com/doc/DZVpkdWRBQ2hITFV2 "
 start_event.26.a: "おお、もうゆずMODを遊ぶのが待ちきれない！"
 start_event.27.t: "オンライン弱体版ゆず"
 start_event.27.d: "日共希望やiar煉獄などのMODで鍛え上げたベテランプレイヤーで、青春版では物足りず、完全版は強すぎて相手を一発で蹴り殺してしまうと感じるなら、これを試してみてください——マルチプレイ向け弱体版ゆず\n 弱体版ゆずは工業化を使えず、大部分のストーリーとメカニズム、そしてパワーを失います（芳乃と乃愛を除く）。アトリ、柚子近衛軍、ゆず経済部・文化部とゆず指導者の交代、起爆器などの機能も失います。ただし、ほとんどの顧問、721研究所の大部分の機能、七海の情報局は引き続き使用可能で、完全版よりマルチプレイ向きです——van 2025.5.24\n 注：このモードには文化局がありません。ゆず金は何の役にも立たないので購入しないでください。コレクションも抽選できません。コレクション関連の内容はすべて完全版でのみ抽選できます！ "
 start_event.27.a: "了解！"
