 Megulu_industry_10: "§Y高水準建設§!"
 Megulu_industry_10_desc: "§W建設水準と建物の安全基準を引き上げ、工場が爆撃後も最速で操業を再開できるようにし、敵の砲弾を叩き返せ！ §!"
