 Megulu_industry_14: "§Y砲兵は陸軍の魂§!"
 Megulu_industry_14_desc: "§Wより多くのクロムでより多くの良質な火砲を造り、敵を砲声の轟きの中で震えさせ、恐れさせ、潰走させよ。\n任意の五州にクロム15を追加します。§! "
