 regression_star2_attack: "如月は我が国が戦場で劣勢にある事実を否定し、我が方中核領土上の敵軍部隊を直接消滅させる（この大技は一度しか発動できない）\n§R注意：この大技が消滅させるのは、我々が支配していない中核領土上の部隊。つまり、敵軍と同じ州にいる部隊は誤爆を受ける！§!"
