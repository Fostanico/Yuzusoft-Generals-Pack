 YzOpreative_nanami_1: "イデオロギー宣伝：共産主義"
 YzOpreative_nanami_1_desc: "七海はフリーマーケットで二冊の本を掘り出した。一冊は『資本論』、もう一冊は『共産党宣言』。もしかすると、これがあの未踏の道かもしれない！七海は止まらなくなり、マルクス・レーニン主義研究グループを次々と立ち上げた。我が国に赤旗をはためかせよう！"
 YzOpreative_nanami_2: "イデオロギー宣伝：民主主義"
 YzOpreative_nanami_2_desc: "七海は親父に命じられてアメリカを一周してきた。帰国後、七海は空気中にもう少し自由の香りがあってもいいと感じた。そして街の新聞はデモクラシー氏を大々的に宣伝し始め、毎回の紙面の多くは民主と自由の香りに占められた。あの記事を書いたのは誰か？もちろん七海が半分書き、半分パクったものだ。誰のをパクったのか？どうやら島主が強制労働に連れて行かれたらしい..."
 YzOpreative_nanami_3: "イデオロギー宣伝：ファシズム？"
 YzOpreative_nanami_3_desc: "七海はどこからか大量の演説原稿を仕入れてきて、暇さえあれば抱えて読んでいた。そして運命は彼女にビヤホールのあの男を見せた。ヤバい！七海も奮闘する！人生うまくいかない？百日間努力して、ダメなら第二次世界大戦だ！"
 YzOpreative_nanami_4: "イデオロギー宣伝：中立思想？"
 YzOpreative_nanami_4_desc: "ええ、どこから来たのこの老いぼれたち。なんで私、在原七海が彼らの宣伝をしなきゃいけないの…………"
