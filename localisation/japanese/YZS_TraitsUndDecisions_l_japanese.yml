 youzu_military_finished_dynamic_modifier_tt: "§Y$youzu_military_dynamic_modifier$§!追加効果："
 youzu_army_1: "ゆず将校団を編成（軍改計画開始）"
 youzu_army_1_desc: "士官学校を設立し、将校団を編成するのが第一歩。三司あやせは、ゆずソフト士官学校を利用して将校団を育成し、軍隊に新しい血を供給し、軍内に我々に忠実な人材集団を形成することを提案した。古参たちが納得しようがしまいが、彼らは遅かれ早かれ妥協する。"
 youzu_army_2: "下級将校の骨幹を育成（一階段軍改）"
 youzu_army_2_desc: "我々に理解を示す古参将校を教師にし、下級将校を育成するのが第二歩。我々の士官学校の校長として、風実花は国内の多くの古参将校と良好な関係を持つ。彼女は一部の者を説得しつつ、自分の教育案を推進して骨幹将校を育成できる。これは大儒に弁経してもらう機会であると同時に、新理論を普及させる好機でもある。"
 youzu_army_3: "指揮系統改革（二階段軍改）"
 youzu_army_3_desc: "指揮系統全体の根本的・体系的な改革が第三歩。飛行機を鉄の鳥、戦車を銅の馬として指揮するわけにはいかないだろう？戸隠憧子は軍の改革は指揮系統から着手すべきだと考えている。そして彼女の社交性により、我々の抵抗はかなり減っている。"
 youzu_army_4: "兵士の主体性を訓練（三階段軍改）"
 youzu_army_4_desc: "兵士の主体性を高めるのが第四歩。歩兵学院を卒業した椎葉紬が、はるか東方の神秘的な力のところへの留学から帰ってきた。彼女が持ち帰ったものは我々に大きな衝撃を与え、我々の歩兵カリキュラムは完全に刷新された。"
 youzu_army_5: "後方システム強化（四階段軍改）"
 youzu_army_5_desc: "後方システムを再編し、戦闘後方を保障するのが第五歩。兵馬動かんより糧秣先ず——兵士に毎食草を食べさせて敵と銃剣突撃させるわけにはいかないだろう。汐山涼音は我々の後方総長であり、彼女の案はかつて混乱していた後方システムを徐々に改善できる。"
 youzu_army_6: "忍者訓練案（五階段軍改）"
 youzu_army_6_desc: "精鋭兵士を訓練して新しい特殊部隊を編成するのが第六歩。局所的優位が戦局全体を動かすことがしばしばある——すべては我々の尖刀にかかっている。忍者である常陸茉子は特殊作戦に長けており、彼女の特殊作戦案は全軍の戦術レベルを効果的に引き上げられる。"
 youzu_army_7: "栄光を継承（最終案選択）"
 youzu_army_7_desc: "口径こそ正義、射程こそ真理。我々の兵士は砲火が大地を耕した後の焦土の上で、銃弾と銃剣で敵の無意味な抵抗を粉砕する。現代軍隊とはいえ、かつての伝統と栄光を無視することはできない。鉄血と銃剣で敵を震え上がらせ、アヤに我々を率いさせよう！"
 youzu_army_8: "未来を抱擁（最終案選択）"
 youzu_army_8_desc: "兵は神速を尊ぶ。未来の戦場は時速数十キロの鋼鉄の猛獣の天下となる——速度こそ側面に対する最良の防御だ。死神を我々の鋼鉄の奔流に乗せて敵の中に降臨させよう。未来の戦争はきっと運動の戦争だ。めぐると一緒にドライブしよう！"
 change_general_to_yzc: "バニラ将軍を柚子厨にする"

