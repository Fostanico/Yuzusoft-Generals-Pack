 YZ_start_ui_content_text: "[YZ_start_ui_content]"
 YZ_start_ui_update_content: "§Yゆずソフト指揮官パック 更新履歴 2026.8.11§!\n\n1、式部茉優を科学者として生成する際に発生していたエラーを修正\n2、ゆずソフトキャラクターの捕虜化防止機能が全将軍に適用されていた問題を修正\n3、MODのディスク使用量を削減\n4、日本語・英語ローカライズを追加。翻訳にはDeepSeekとChatGPTを使用しているため、不正確な箇所が残っている可能性があります。ご了承ください\n5、コードを大幅に最適化\n6、herobrineを削除\n\n§Yつぶやき§!\n令和6年（2024年）8月にこのMODを立ち上げてから、二年が経ちました。さまざまな努力を重ね、ようやく現在の形まで育てることができました。本MODを応援してくださる皆さんに、心より感謝します。皆さんの関心と応援があったからこそ、ここまで続けてこられました。これからもより良いゲーム体験をお届けできるよう、更新を続けていきます！\n\n現在、Steamワークショップに、バグ報告や提案を書き込めるドキュメントへのリンクを掲載しています。面白いアイデアがあれば、ぜひ追加してください！\n- 追伸：古参の柚子厨の皆さん、旧キャラの特性や固有メカニクス作りをぜひ手伝ってください。お願いします！\n\n作者より：本MODには未来技術に関わる機能（および他社作品のキャラクター）が含まれるため、性能がやや高すぎる場合があります（別のギャルゲーの某先輩：「へへへ」）。難易度や好みに応じて有効にする機能を選び、ちょうどよいバランスでお楽しみください。現在も調整を続けていますので、ご意見をお待ちしています！\n\nQQを利用していない方は、GitHubのIssueから不具合報告や提案をお送りください：\nhttps://github.com/Fostanico/yuzumod\n\nQQグループでの交流も歓迎：967395223\n下に本MODのチャットグループ用QRコードを掲載しています！\n\n\n\n\n\n\n\n\n\n\n£start_ui_qun_code\n\n\n\n\n\n\n\n\n\n\n\nゲーム中に遭遇した問題の報告でも、気軽な雑談でも、どなたでも歓迎します。"
 YZ_start_ui_guide_content: "§Yプレイガイド§!\n\nゆず将軍パックはアドオン式の多機能将軍パックです。単なる将軍拡張として使うこともできますし、全機能を有効にして、指導者、将軍、顧問、軍産組織、研究所、経済、宣伝、士官学校、好感度、キャラ専用イベントを体験することもできます。\n\n§Yゲーム開始時の選択§!\n青春版は単純な将軍パックに近く、軽量に遊びたいプレイヤー向けです。完全版はほとんどのメカニズムとストーリーコンテンツを有効化し、パワーも高く、内容も最多です。マルチプレイ弱体版は一部の過剰な機能を削り、マルチプレイや高難易度環境に適しています。\n\n§Y主なコンテンツ§!\n交代可能な指導者には芳乃、寧々、ムラサメ、羽月、美羽、小夜、恭平、ゆず集団指導者などがあります。MODはまた、多数の陸軍将軍、提督、政治顧問、総司令官、大臣、軍産組織を提供します。ゆず軍産組織のボーナスは強めで、設立関連決議の表示には通常、対応する陸海空軍の経験値が必要です。\n\n§Yキャラ専用の遊び方§!\nキャラクターコンテンツの多くは、将軍成長決議とキャライベントに統合されています。芳乃、あやせ、乃愛などのキャラにはイベントチェーンがあります。千恋＊万花、サノバウィッチ、RIDDLE JOKER、カフェ・ステラと死神の蝶、天使☆騒々、天色＊アイルノーツ、天神乱漫、ぶらばん！～The bonds of melody～などの作品には、対応するキャラメカニズム、任務、決議があります。一部のキャラは専用コンテンツを完了しないと結婚関連決議が解放されません。\n\n§Y資源とシステム§!\n柚子コインは多くのシステムの中核資源であり、721研究所、軍改、工業化、商店交換などに使われます。中核団は指導者、キャラボーナス、商店、工業化、一部の専用決議の管理に使われます。ゆず文化局は主に従属国の転換と統合を担当し、関連資源で従属国の特化と統合を進められます。\n\n§Y721研究所§!\n寧々を登用して研究所を設立すると、研究施設の建設、突破ポイントの獲得、研究ボーナスの獲得、星幽使いキャラの強化ができます。茉優、羽月、めぐる、寧々などのキャラは科学者や研究機能に関連します。研究所には起爆器、アトリ関連装備、特別プロジェクト、追加ボーナス付きの装甲テンプレートも含まれます。\n\n§Y工業化と士官学校§!\n芳乃計画は民需工業寄り、めぐる計画は軍需拡張寄りです。どちらの工業化も柚子コインが必要で、同時進行すると資金不足になる可能性があります。自動化工業アップグレードは実装済みで、資源が十分なら初期決議を選択するだけで自動的に進行します。\n\nゆずソフト士官学校では将軍に指定特性を追加でき、段階的な軍改を進め、近衛軍などを解放できます。軍改の最後は歩兵か装甲部隊のどちらかに偏らせることができ、完了後は部隊に強力な修正が与えられます。\n\n§Y隠し要素と宣伝部§!\nMODには八六、和泉妃愛、アトリ、9nineの四人のヒロイン、NOeSISの数人のヒロインなどの隠しキャラが含まれます。八六とアトリは主に721研究所関連で、妃愛は天使☆騒々のキャラコンテンツ関連です。9nineのヒロインは高森奈津美が声を当てた全キャラを登用して雪色雪花雪之痕を起動し、その後ヴァルハラ結社を起動する必要があります。NOeSISのヒロインは先に登用して獲得する必要があります。\n\n宣伝部はポスター、歌舞団、ツアーなどでボーナスを提供できます。柚子厨メカニズムはリセットされ、宣伝部で国の柚子厨数を増やし、柚子厨装備、近衛軍、軍改、情報機関を巡るより多くの操作ができます。\n\n§Y操作パネルと互換性の注意§!\n中核団を結成したら、上部にぶら下がっている七海をクリックして操作パネルを開き、各種決議グループをオン・オフできます。大型改変MODとの互換性は限定的で、旧世ブルース、TNOなどの環境では青春版を優先してお試しください。TFRはほとんどの機能が使えますが、721研究所は研究施設の設定が異なるため使えない可能性があります。§0本MODはミレニアムドーンとの互換性が良いですが、指導者は三人しか使用できません（いずれも作者の隠し要素）§!完全版はパワーが高いので、より安定した体験を求めるなら青春版かマルチプレイ弱体版を選んでください。"
 YZ_start_ui_credits_content: "§Y制作スタッフと謝辞§!\n\n§Y貢献者リスト（順不同かもしれない）：§!\n牢八、井向真琴、伊翩諺、VAN、島主、在原七海(古参)、huhu、o5j、暮風昔雲初(芳乃)、Verniy、彩雲赤霞、夏目不是棗子姐（LLLJのUI等の作者）、柚子、从凌、ナポレオン六世、小楓(ゆず音楽台作者)、統計計画管理；\n\n§Y特別謝辞：§!\nOpenAI Codex（GPT-5.5、GPT-5.6sol、reasoning effort: medium/high/xhigh）、Anysphere Cursor（Anthropic Claude Opus 5 Thinking、xAI Grok 4.6、reasoning effort: high）、OpenAI ChatGPT（GPT-5.5 Thinking/GPT-5.6 Thinking）、Google Gemini（Gemini 3.1 Pro Preview）、DeepSeek Chat（DeepSeek V3.2 Pro、DeepSeek V4 Flash、DeepSeek V4 Pro）、半山煙雨半山晴（伊翩諺への精神的支え）、SeaLandX（完全なる私物）、Alice☆(メイド団作者)、紫琳(日共ゆずコンポーネント作者)；\n\n§Y意見・フィードバック（意見フィードバックドキュメントに基づくID。漏れがあれば補完してください）：§!\n缄黙、LF_Eternity、星鹿(絵文字)、沙子、洛易十四、椿、無星之夜および各グループメンバー、bilibiliユーザーの創意と、ゆずMODの発展を支えてくれるすべての方々。"
