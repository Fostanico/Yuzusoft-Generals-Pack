 # ロボコップの隠し要素
 YZ_character_name_robocop: "ロボコップ（アレックス・マーフィ）"
 serve_the_public_trust: "公共の信頼に奉仕せよ"
 serve_the_public_trust_desc: "§Y基本指令1§!：公共の信頼に奉仕せよ。安定したプログラムと兵站規律が部隊の継戦能力を支える。"
 protect_the_innocent: "無辜の市民を守れ"
 protect_the_innocent_desc: "§Y基本指令2§!：無辜の市民を守れ。ロボコップは不必要な損失を抑え、防線と人員を守る。"
 uphold_the_law: "法を遵守せよ"
 uphold_the_law_desc: "§Y基本指令3§!：法を遵守せよ。目標識別、偵察、秩序ある前進は戦闘プロトコルに組み込まれている。"
 yz_robocop_public_security_advisor: "デトロイト治安モデル"
 yz_robocop_public_security_advisor_desc: "デトロイト市警のアレックス・マーフィは殉職後、OCPによってロボコップへ再建された。彼は治安機構であると同時に、なお自ら判断する一人の人間でもある。"
 yz_robocop_corps_desc: "OCP犯罪予防ユニット001。装甲の下に何が残っていようとも、アレックス・マーフィは三つの基本指令に従う。"
 yz_recruit_robocop: "ロボコップを採用するか？"
 yz_recruit_robocop_desc: "伊爾諾と井向真琴は、デトロイト発の治安近代化計画を提案した。殉職した警官アレックス・マーフィをOCP犯罪予防ユニット001として再建するのである。\n\nロボコップは§Y陸軍将軍§!兼§Y政治顧問§!として加わり、公共の信頼に奉仕し、無辜の市民を守り、法を遵守する三つの基本指令を携える。"
 yz_recruit_robocop_effect_tt: "§Yロボコップ§!を陸軍将軍として採用し、政治顧問として解禁する"
 have_yz_robocop: "ロボコップを採用済み"
 YZ_noa_event_103_consumer_goods_modifier: "乃愛のやりくり上手"
 YZ_noa_event_103_consumer_goods_modifier_desc: "生活の中の小さな節約も、やがて立派な成果となる。"
