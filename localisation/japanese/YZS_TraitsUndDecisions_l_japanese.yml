 maid_Weiss_trait: "巧計を好む指揮官"
 maid_Weiss_trait_desc: "この指揮官は小さな工夫で戦場の形勢を変えるのが好き。正面戦場の指揮は彼にとって面倒だが、経験豊富で、一定の学習能力を持つ"
 maid_Ukisov_trait: "天基螺旋砲"
