 military_reform_info_decision: "ゆず新軍事改革の紹介"
 military_reform_info_decision_desc: "この決議は新しい軍事改革のメカニズムを紹介する。クリックして新変更を確認してもいいし、自分で手探りしてもいい\n（私の筆が多いのが嫌ならクリックしなくてもいいよT_T）"
 military_reform_event.3.d: "Millennium Dawnの開始を検出すると、バニラ向けの八つの軍改分岐は非表示となり、四段階の現代軍事改革へ切り替わる。旧軍改の終点「栄光を継承」または「未来を抱擁」のいずれかを完了すると第一段階を開始できる。四段階は順番に完了する必要があり、同時に進行できる改革は一つだけである。\n各改革は§Y30日§!を要し、§Y政治力100§!、§Y指揮力40§!、§Y陸軍経験値50§!、§Yゆずコイン1,000§!を消費する。完了時に隠し技術を獲得し、そのボーナスはMillennium Dawnの現代兵科と装備へ恒久的に適用される。\n対象カテゴリーと装備アーキタイプは現在対応中のMillennium Dawn Betaで検証済みである。更新によって内部tokenが変わった場合は再確認が必要となる。各決議の効果欄には実際の補正値が表示される。"
 military_reform_event.4.d: "第一段階「新戦車を連ね、稲妻の如く出撃せよ」は主力戦車、歩兵戦闘車、装甲兵員輸送車の火力、防護、機動、指揮統制、信頼性を強化する。\n第二段階「武装ヘリは雷火を放ち、点を穿つ」は攻撃ヘリコプターとヘリボーン部隊を大幅に強化し、空中強襲部隊の補給消費を軽減する。\n第三段階「無人機データリンク、鍵盤から硝煙を」は情報網、防諜、暗号解読、偵察を強化し、航空・戦術無人機の戦闘力と信頼性を高め、航空無人機の生産コストを削減する。\n第四段階「手榴弾、狙撃、遠距離火力、陸海空天電！」は歩兵と陸軍全体を強化し、空軍作戦と海軍戦闘を改善し、歩兵装備、長距離火力、車両、固定翼機、艦体の信頼性を高める。\n正確な割合は四つの改革決議の効果欄を参照すること。"
 military_reform_event.1.d: "バニラの非常に多くのバランス問題（装甲車やロケット砲など、誰も見向きもしない装備）に対応し、かつP社が最近またしても無能なバランス能力を見せつけてくれたため、このような理由から、私（たち？）はバニラの大多数の装備を再バランスすることを試みる。では、バランス方法とは何か？皆を全員逆天にすることだ。それで逆天のバランスが達成される（どうせ皆のPVE楽しむ用だし、数値は確かに高いが、代償も確かに必要で、起動も遅い）。全部で八つの分岐：歩兵分岐、砲兵分岐、騎兵分岐、軽装甲分岐、火力支援分岐、機械化分岐、電撃戦分岐、空地一体化分岐。\n新軍改は旧軍改に基づいて行われる。旧軍改の最後の分岐である「栄光を継承」と「未来を抱擁」が、その後の軍改分岐を決定する：§G栄光継承線（ムラサメ線）は歩兵分岐、砲兵分岐、騎兵分岐を獲得；§!§O未来抱擁線（めぐる線）は機械化分岐、電撃戦分岐、空地一体化分岐を獲得；§!§B火力支援分岐と軽装甲分岐は共通分岐。§!\n§R注意：一つの分岐を突き切るまで、他の分岐は選択できません。各分岐は五段階で、各段階に一ヶ月かかります。§!\n次に八つの分岐の属性を簡単に紹介する：\n歩兵分岐：この分岐では、歩兵に多くのボーナスが与えられるだけでなく、砲兵に-1幅が与えられる。そして歩兵にとって最も重要なのは、歩兵改革の最終段階を完了すると、6速歩兵が解放されることだ\n砲兵分岐：この分岐では、誰も相手にしないロケット砲が重点的に強化され、火砲、対戦車砲、対空砲も大幅に強化される。この分岐では砲兵-2幅のボーナスが得られる。つまり歩兵分岐と組み合わせれば、0幅の火砲が実現する（P社はなぜ火砲にあんなに高い幅を与えたのか。誰が火砲を前線に出すんだ）。もちろん、歩兵の速度に追いつくため、火砲も6速に強化される\n騎兵分岐：この分岐では、騎兵がたくさんたくさんボーナスを得る。もちろん、こう聞けば「騎兵なんてクズに、なぜ分岐を作るんだ？」と聞く人もいるだろう。おい、前々回のアップデートでルリの動物友達決議が追加されただろう。どの国でも象CCBが遊べるようになったんだ。つまり、象と騎兵分岐のボーナスを組み合わせれば、非常に逆天なCCBボーナスが達成できる"
 military_reform_event.2.d: "軽装甲分岐：この分岐では、誰も使わない軽装三兄弟——軽戦車、モータリゼーション、装甲車——が大幅に強化される。軽装改革三階段完了後、装甲車改良が解放される。強化後、この三兄弟は単独で一つの部隊として十分機能する。軽戦車は突破、モータリゼーションは防御、装甲車は火力担当。この三つの組み合わせはかなり良い数値の部隊を形成できる（最低12速、軽戦車の速度次第）。また、この系統の最終段階では、民族精神が非常に強力な補給バフを与える。この三つを使わなくても、補給ボーナスだけでも選ぶ価値がある\n火力支援分岐：この分岐では、三軍の火力支援面のボーナスが強化される。もちろん、皆が最も注目すべきは自走砲と駆逐戦車がこの系統でボーナスを得ることだ。他はおまけ程度のボーナスだが、自走砲と駆逐戦車のボーナス（-0.5幅）は本物だ\n機械化分岐：この分岐では、機械化の生産コストが下がり、機械化と装甲関連のボーナスが多数追加される。こいつは元々強いので、あまり強化する必要はない（つまり、機械化-0.5幅）\n電撃戦分岐：この分岐では、装甲の生産コストが下がり（駆逐戦車と自走砲も恩恵を受ける）、装甲強化に多くのバフが追加される。次のバージョンで駆逐戦車と自走砲が弱体化された後、装甲が強化を受けて駆逐戦車と自走砲に張り合えるかどうかは分からない（もちろん、この二つは火力支援ドクトリンでボーナスを得るので、戦車が張り合うのはまだ難しいかもしれない）。装甲攻撃と装甲防御が多く与えられる（結局これも自走砲と駆逐戦車にも恩恵があるだけだと思うが）\n空地一体化分岐：この分岐では、飛行機の生産コストが下がり、非常に恐ろしい空軍バフを獲得する。非常に非常に恐ろしい\n全体的に言えば、各分岐の大まかな状況は以上の通りだ。めぐる線は非常に多くの値引きとボーナスを提供し、小国でも大量に戦車・飛行機・機械化を生産できる。ムラサメ線は歩兵と砲兵に破格の強さのボーナスを与える。両者の強さはほぼ同じで、楽しめる方向が違うだけだ。好きなものを遊べばいい\n最後に、皆が楽しくプレイできることを願う\n\n\n（小声で言うと、このコンテンツには隠し要素がある。各自で探索してほしい。隠し要素の内容は私とは絶対に関係ない。まったく関係ない！）"
get_married_ATRI: "アトリとの誓い"
hazuki_ability: "羽月が星幽能力を発動"
hazuki_ability_desc: "羽月の星幽能力は水の操作です。そのため、上陸作戦や渡河作戦において大きな効果を発揮します。"
nanami_ability: "七海が星幽能力を発動"
nanami_ability_desc: "七海の星幽能力は人体の回復能力を強化するものであり、部隊が受けるダメージを軽減します。"
mayu_ability: "茉優が星幽能力を発動"
mayu_ability_desc: "茉優の星幽能力は空気の壁を生成します。彼女のアイデアと応用次第で、戦闘において予想外の効果を発揮するでしょう。"
ayase_ability: "綾瀬が星幽能力を発動"
ayase_ability_desc: "綾瀬自身は星幽能力を持ち合わせていませんが、特殊な薬を服用することで一時的に能力を使用できます。彼女の能力は引力と斥力です。そのため戦闘中には……地爆天星？（ペイン「？」）"
#国家名
 YUZ: "柚子国"
 YUZ_DEF: "柚子国"
 YUZ_ADJ: "柚子国"
 YUZ_democratic: "柚子共和国"
 YUZ_neutrality: "柚子国"
 YUZ_communism: "柚子公社"
 YUZ_fascism: "柚子国"
#国策
 yuzu_independence: "独立の柚子の国"
 yuzu_independence_desc: "柚子の国は、穂織、鷲逗、御一夜の少女たちの蜂起によって最初の領土を獲得した。それと同時に、日本政府との関係は氷点にまで落ち込んだ。しかし、これも一時的なものだ。すぐに……すぐに……我々はもう日本政府の態度に影響されなくなる……"
 yuzu_infiltrate_japan: "日本領土への浸透"
 yuzu_infiltrate_japan_desc: "日本が長年にわたって続けてきた軍国主義は我々の人民を毒してきた。ゆずソフトのゲームで人民を団結させ、日本の軍国主義に対抗する必要がある"
 yuzu_liberate_sea_city: "アクア·エデンを解放"
 yuzu_liberate_sea_city_desc: "邪悪な日本政府は吸血鬼の力を恐れ、彼らを孤島に監禁した。我々は吸血鬼たちの力を十分に活用し、日本の軍国主義への反抗に備えるべきだ"
 yuzu_use_demon_power: "魔王の力を利用"
 yuzu_use_demon_power_desc: "輝耶と乃愛はどちらも魔王の力に詳しい。我々は魔王の力を適切に利用して実力を強化できる"
 yuzu_unite_astral: "星幽使を団結させる"
 yuzu_unite_astral_desc: "鷲逗には多くの星幽使がいる。彼らは超能力を持ち、我々にとって強力な助力だ"
 yuzu_borrow_divine_power: "神力の借用"
 yuzu_borrow_divine_power_desc: "我々の将軍の中には非常に多くの神々がいる。卯花、乃愛、佐奈、栞那、ルリ……彼女たちは多くの神力（しんりょく）を集め、神々の支持を得るのを助けてくれる。真の神の力で、神の名を騙って暴政を行う天皇の支配を根絶し、神がどちらの味方かを知らしめよう"
 yuzu_cross_tsushima: "対馬海峡を渡る"
 yuzu_cross_tsushima_desc: "中国人民と日本人民には共通の敵がいる——それは日本軍国主義だ。朝鮮と中国東北地区の人民は依然として軍国主義とファシズムの圧迫に苦しんでいる。我々は圧迫された朝鮮人民と中国人民も解放すべきだ"
 yuzu_stand_in_world: "柚子の国、世界に屹立"
 yuzu_stand_in_world_desc: "我々は軍国主義を解決し、全アジアのファシストの残党を殲滅した。次は国内で一連の安定化措置を実施すべきだ"
 yuzu_overthrow_japan: "日本軍国主義を打倒"
 yuzu_overthrow_japan_desc: "我々は日本軍国主義への最後の戦いの準備を整えた。全国民を鼓舞し、全国総蜂起を宣言して、日本人民を軍国主義から救い出す"
 yuzu_national_congress: "全柚代表大会"
 yuzu_national_congress_desc: "軍国主義を殲滅した後、我々は国体を決定し、方向性を定める必要がある。すべてのゆず少女たちを招集して投票を行うべきだ"
 Yuzu_land_reform: "土地改革"
 Yuzu_land_reform_desc: "日本人民は長年の封建的圧迫に苦しんできた。明治維新は下層農民の搾取者を取り替えただけだ。生産力を解放し、農業発展を推進するには、地主階級にメスを入れる必要がある"
 Yuzu_agriclutural_collectivization: "農業集団化"
 Yuzu_agriclutural_collectivization_desc: "農民が土地を得た後も、多くの農民は生産手段を持っていない。我々は集団農場を設立し、共有の生産手段で生産を行うことで、農村部の生産手段不足の問題を解決し、農村の生産力を高めるべきだ"
 Yuzu_land_contract: "土地請負制"
 Yuzu_land_contract_desc: "農民が土地を獲得した。我々は農民の生産意欲を引き出すべきだ。土地請負方式を採用し、農民が最大限の利益を得られるようにすれば、農民は自発的により多くの食料を生産するだろう"
 Yuzu_water_conservancy: "水利工事の拡大"
 Yuzu_water_conservancy_desc: "国家の農業発展は農民だけでなく、客観的な地理的要因にも依存する。水利工事の建設を通じて、農業生産環境を効果的に改善し、農業生産量を高めることができる"
 Yuzu_split_financial_conglomerates: "財閥の解体"
 Yuzu_split_financial_conglomerates_desc: "三井、三菱、住友、安田……日本の財閥は日本の発展を毒してきた。財閥は工業を独占し、日本経済は長期的に不健康な状態にある。工業を発展させるためには、財閥を解体し、独占禁止法を制定しなければならない"
 Yuzu_encourage_enterprises: "中小企業の振興"
 Yuzu_encourage_enterprises_desc: "財閥が市場からの退出を命じられた後、中小企業が雨後の筍のように生えてきた。我々は中小企業の発展を導き、全国経済の長期的な安定発展に資するようにすべきだ"
 Yuzu_strengthen_industry_unions: "業界労働組合の強化"
 Yuzu_strengthen_industry_unions_desc: "我々の政策の下で多くの企業が急速に発展した。我々は企業主だけでなく、労働者の権利にも注目すべきだ。各業界の労働組合を設立し、労働者の権利を保障する"
 Yuzu_restore_production_order: "生産秩序の回復"
 Yuzu_restore_production_order_desc: "国内戦争の動乱により、国内経済は崩壊の瀬戸際に瀕している。我々は迅速に生産を回復し、国内経済を安定させる必要がある"
 Yuzu_eliminate_remnants: "国内の軍国主義残党を排除"
 Yuzu_eliminate_remnants_desc: "この戦争を起こした犯罪者たちはまだ刑務所に収監されている。彼らに犯した暴行の責任を取らせる必要がある！人民の声で彼らを裁かせよう！"
 Yuzu_unity: "人民の団結"
 Yuzu_unity_desc: "ファシストと軍国主義者が排除された後、我々は動揺する国内環境を終わらせるべきだ。国内を安定させるため、粛清の基準を少し緩めることができる。真の敵は軍国主義者とファシストだけであり、彼らに従うことを余儀なくされた一部の穏健派は改造して団結させることができる"
 Yuzu_secend_congress: "第二回全柚大会"
 Yuzu_secend_congress_desc: "戦後の一連の政策は国内環境の安定に貢献し、柚子国は現在、安定した発展の道に乗っている。そのため、国家の将来の方向性を決めるために、再度会議を開く必要がある\n§R指導者を選択した後、決議で指導者を交代させないことをお勧めします。指導者線は既存の指導者特性に基づいて特性を変更します。決議による指導者交代の結果には以下が含まれますが、これに限りません：国策の詰み、バフの消失、さらにはバグによるゲームクラッシュ\nまた、指導者線の指導者特性と決議の指導者特性は異なります！！！交代してから戻そうとしないでください。同じキャラクターが国策コードと決議コードでは別人です！§!"
 Yuzu_ayase: "三司あやせ"
 Yuzu_ayase_desc: "ヤスリ（取り消し線）あやせは豊富な指導経験を持つ。あやせに国家を率いさせるべきだ"
 Yuzu_noa: "白雪乃愛"
 Yuzu_noa_desc: "乃愛はあまり頼りになる指導者ではないかもしれないが、彼女なら空軍を大幅に発展させられる。空軍発展のため……乃愛を信じてみるのもいいかもしれない？"
 Yuzu_miu: "矢来美羽"
 Yuzu_miu_desc: "美羽は豊富な管理経験を持つ。美羽の統治の下で、我々は長期的な安定発展を達成できる"
 Yuzu_sana: "千歳佐奈"
 Yuzu_sana_desc: "佐奈自身には指導経験がないかもしれないが、佐奈の運は必ず役に立つはずだ"
 Yuzu_ling: "ムラサメ"
 Yuzu_ling_desc: "あの緑髪の刀霊は頼りなさそうに見えるかもしれないが、少なくとも彼女は本当に神々の支持を受けている。ムラサメを指導者にすれば、神々がより我々を支援してくれるかもしれない"
 Yuzu_luli: "竜胆ルリ"
 Yuzu_luli_desc: "ルリは明らかに国を治められないが、マスコットとして……部下たちがより力を発揮できるのではないか？"
 Yuzu_tallest_congress: "柚子最高委員会"
 Yuzu_tallest_congress_desc: "個人の指導には最終的に見落としがあるかもしれないが、指導団体ならその可能性を減らせる。ゆずソフトの全ヒロインで最高委員会を構成し、共同で指導すべきだ"
 yuzu_zaozi: "四季ナツメ"
 yuzu_zaozi_desc: "棗子姐さんは喫茶店経営の経験がある。彼女に率いられれば、新たな発展局面が開けるかもしれない"
 yuzu_nene: "綾地寧々"
 yuzu_nene_desc: "いつどこででも0721しそうな……（寧々が顔を黒くする）あ、違う。豊富な隠密経験を持つ寧々なら、必ず我々の情報を守ってくれる"
 yuzu_eco: "経済再建"
 yuzu_eco_desc: "明治維新以来、日本の経済発展は深刻に不均衡だった。我々はこの不均衡な経済発展モデルを打ち破り、新しい健全な経済発展モデルを構築する"
 yuzu_civil_industry: "民需工業の発展"
 yuzu_civil_industry_desc: "国家建設の準備のため、民需工業を発展させる必要がある"
 yuzu_technology: "研究投入の拡大"
 yuzu_technology_desc: "研究への投入を拡大し、柚子国の研究力を強化する必要がある"
 yuzu_army_industry: "軍用工業の発展"
 yuzu_army_industry_desc: "将来の戦争に備え、軍用工業を発展させる必要がある"
 yuzu_fast_road: "高速道路"
 yuzu_fast_road_desc: "旧日本の国内道路建設は深刻に歪んでいた。全国経済の発展のため、全国的な高速道路建設を実施しなければならない"
 yuzu_electric_company: "国家電力会社の拡大"
 yuzu_electric_company_desc: "旧日本の電力網により、我が国の多くの地域は安定した電力供給を得られていない。この状況は全国的な工業発展を深刻に制限している。国家電力会社への投資を拡大し、全国の電力供給をより安定させよう"
 yuzu_rural_electrification: "農村電化"
 yuzu_rural_electrification_desc: "電力供給が安定したら、電力を農村にも届けるべきだ。我が国の隅々まで明かりが灯るようにしよう"
 yuzu_reconstrct: "国家再建計画"
 yuzu_reconstrct_desc: "国家は正軌に戻り、経済建設は活発に発展している。国家の発展を計画するため、一連の計画を策定すべきだ"
 yuzu_anti_bobo: "大規模都市化"
 yuzu_anti_bobo_desc: "全国的な送電と道路建設の後、我々の建設計画も追いつくべきだ。全国の都市化建設を拡大しよう"
 yuzu_literacy_campaign: "識字運動"
 yuzu_literacy_campaign_desc: "都市化の後、我が国の人民の知識不足が顕在化した。農村には夜間学校を、都市には多くの成人大学や技術学校を設立し、我が国の労働者の知識不足問題を解決する"
#民族精神
 yuzu_penetration_debuff: "柚子勢力の浸透"
 yuzu_vampire_army: "吸血鬼軍隊"
 yuzu_demon_power: "魔王の力"
 yuzu_divine_power: "神の力"
