 Miyako_steal_mechanized_equipment_desc: "目標国家から機械化装備をちょっと盗んで我々の用に供する（何？AIが機械化を作らないのにどこから盗んだのかって？そりゃ天意様が下してくれたんだよ）"
 Miyako_steal_fuel: "燃料をちょっと盗む"
 Miyako_steal_fuel_desc: "目標国家から燃料をちょっと盗んで我々の用に供する（我々の石油がカビる心配はないはずだ）"
 Miyako_steal_tank_equipment: "戦車をちょっと盗む"
 Miyako_steal_tank_equipment_desc: "目標国家から戦車をちょっと盗んで我々の用に供する（AIの戦車設計がそんなに下手なのに、なんでこんな良い戦車を盗めるのかって？天意、すべて天意だ）"
 Miyako_steal_fighter_equipment: "戦闘機をちょっと盗む"
 Miyako_steal_fighter_equipment_desc: "目標国家から戦闘機をちょっと盗んで我々の用に供する（盗めるのは戦闘機だけ。対地攻撃機とかは自分で設計しろ。もちろん戦闘機も設計は必要だが、生産はしなくていいだけだ）"
 huhu_s_revenge: "huhuの復讐"
 huhu_s_revenge_desc: "よくも喵都を傷つけたな？これはもはやただの敵軍ではない。重拳を出すしかない！私の戦車でお前たちを一人残らず空の彼方に送ってやる！\n他はどうでもいい。喵都を傷つけた以上、お前たちは飛ぶ準備をしろ、飛べ！（神鷹兄の声で）"
 ruri_s_animal_friends: "ルリの動物友達"
 ruri_s_animal_friends_desc: "山の中では、いろんな声が聞こえるんだ。これわ……象？！おじいちゃん、背中を踏んであげるよ！\n象騎兵テンプレートを解放"
 anuo_s_revenge: "§R神罰§!"
 anuo_s_revenge_desc: "ルリを傷つけた？大丈夫、アヌは何もしないよ。ただ、許しを請うのはお前たち、許すのは神様。そしてアヌの仕事は、お前たちを神様に会わせてやることだ"
 revenge: "嫁の仇を討つ"
 revenge_desc: "もうそんなことは言ってられない。敵が嫁を傷つけた。これは小さな問題ではない。敵に回！答！させる必要がある！"
 Miyako_steal_military_factory: "軍需工場を三つ盗む"
 Miyako_steal_dockyard: "造船所を三つ盗む"
 Miyako_steal_civilian_factory: "民需工場を二つ盗む"
 Miyako_steal_civilian_factory_desc: "民需工場とか……敵に置いても使えないだろうし、我々に使わせてもらおう"
 Miyako_steal_military_factory_desc: "軍需工場？AIに持たせても良いものを作らない。お前は使えないから俺が使う"
 Miyako_steal_dockyard_desc: "お前の造船所が俺の輸送船を攻撃する船を作ってるのか？よこせ！"
 Haruka_sky_mind_decision: "春風先輩が「天意」を理解"
 Haruka_sky_mind_decision_desc: "春風先輩の能力はエデンで、望んだことを起こせる。ならば、これは無形のうちに我々の天意様と通信していることになるのではないか。春風に天意様の考えを理解させよう。「天意の至るところ、勝たずにはいられない」——諸葛奶龍"
 sky_mind_advent: "天意降臨"
 defeat_army_must_be_sad: "敗兵必ず哀し"
