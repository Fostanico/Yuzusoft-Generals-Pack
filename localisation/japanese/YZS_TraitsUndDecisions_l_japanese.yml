 youzu_air_dynamic_modifier: "ゆず空天軍"
 youzu_air_dynamic_modifier_desc: "現代の軍事大国にとって、空軍の発展は不可欠だが、現在の我々の新米空軍は依然として非常に脆弱だ。しかし、度重なる戦闘で鍛えられ、科学者の努力で成長するゆず空軍は、いつか来犯する敵をすべて撃滅し、空を支配し、我々の空の守護神となるだろう。"
 mayu_and_nene_advanced_atri: "アトリを深く開発"
 yz_arsenal_bird_justice_plan: "ジャスティス計画"
 yz_arsenal_bird_justice_plan_desc: "制空権の維持、ドローン群の管制、要地防衛を最優先目標に、七二一所は軍械巨鳥に高密度の制空ドローン群、汎用ミサイルベイ、多層生存システムを装備する。完了後、§Yジャスティス号§!軍械巨鳥の設計を獲得。\n\n§7『エースコンバット7』の設定では、二機のアーセナルバードが国際軌道エレベーター周辺に配備され、半径約1200kmの防衛圏を形成している。ジャスティスは強化型の量産空中無人空母で、MQ-101ドローン群を統率し、先進防護システム、長距離ミサイル、指向性エネルギー兵器で広大な空域を封鎖できる。§!"
 yz_arsenal_bird_liberty_plan: "リバティ計画"
 yz_arsenal_bird_liberty_plan_desc: "長距離全域攻撃を核心に、七二一所は爆撃、対艦、制空ドローン、ミサイル火力を単一の空中プラットフォームに統合する。完了後、§Yリバティ号§!軍械巨鳥の設計を獲得。\n\n§7『エースコンバット7』の設定では、リバティはアーセナルバードの原型機。国際軌道エレベーターが供給するマイクロ波エネルギーで長時間飛行を維持し、巨大な無人空中空母として戦闘ドローンを展開し、長距離兵器で敵航空戦力が重要戦略施設に接近するのを防ぐ。§!"
 yz_arsenal_bird_integrated_plan: "軍械巨鳥統合計画"
 yz_arsenal_bird_integrated_plan_desc: "制空、対地、対艦、持続戦闘能力のバランスを取り、単独で多種の空中任務を担える統合型軍械巨鳥を形成する。完了後、§Y軍械巨鳥統合型§!の設計を獲得。\n\n§7本計画は『エースコンバット7』のリバティ原型機とジャスティス強化型の設計思想を吸収し、超長航時、ドローン群指揮、区域防空、長距離攻撃、多層生存システムを単一の任務環境に依存しない空中戦略プラットフォームに統合する。§!"
 yz_arsenal_bird_requires_modern_air_mio_tt: "§Yゆず空軍航空宇宙局§!の現代軍産組織を取得済み"
 yz_arsenal_bird_justice_design_bonus: "ジャスティス号設計パラメータ"
 yz_arsenal_bird_justice_design_bonus_desc: "ジャスティス号のブループリント生成のみに使う一時的な設計パラメータ。"
 yz_arsenal_bird_liberty_design_bonus: "リバティ号設計パラメータ"
 yz_arsenal_bird_liberty_design_bonus_desc: "リバティ号のブループリント生成のみに使う一時的な設計パラメータ。"
 yz_arsenal_bird_integrated_design_bonus: "軍械巨鳥統合型設計パラメータ"
 yz_arsenal_bird_integrated_design_bonus_desc: "軍械巨鳥統合型のブループリント生成のみに使う一時的な設計パラメータ。"
 yz_arsenal_bird_justice_design_bonus_tt: "§Yジャスティス号§!軍械巨鳥の設計を獲得。\nこの設計は追加で：\n空中防御：§G+500%§!\n信頼性：§G+100%§!\nレーダー優位：§G+300%§!\n空中優位：§G+400%§!"
 yz_arsenal_bird_liberty_design_bonus_tt: "§Yリバティ号§!軍械巨鳥の設計を獲得。\nこの設計は追加で：\n対空攻撃：§G+500%§!\n対地攻撃：§G+500%§!\n戦略爆撃：§G+400%§!\n対艦攻撃：§G+500%§!\n作戦航続距離：§G+250%§!"
 yz_arsenal_bird_integrated_design_bonus_tt: "§Y軍械巨鳥統合型§!の設計を獲得。\nこの設計は追加で：\n最大速度：§G+150%§!\nレーダー優位：§G+250%§!\n対空攻撃：§G+350%§!\n対地攻撃：§G+350%§!\n空中防御：§G+350%§!\n信頼性：§G+100%§!\n作戦航続距離：§G+200%§!\n対艦攻撃：§G+350%§!"
 yz_ac7_legendary_aces_program: "長距離戦略打撃群を編成"
 yz_ac7_legendary_aces_program_desc: "三種類の軍械巨鳥ブループリントがすべて完成した。七二一所は、灯台戦争で戦局を書き換えた三人の伝説的パイロットを空軍に招き、それぞれジャスティス号、リバティ号、軍械巨鳥統合型の作戦運用を担当させる。"
 yz_ac7_legendary_aces_program_tt: "独自能力を持つ三人のエースパイロットを獲得：\n\n§YTrigger§!（ジャスティス号、伝説のエース）\n対空攻撃/空中防御：§G+10000%§!\n最大速度/作戦航続距離：§G+1000%§!\n機動/レーダー優位：§G+5000%§!\n対地/対艦/戦略爆撃：§G+5000%§!\n海軍攻撃命中：§G+2500%§!\n\n§YCount§!（リバティ号、オーシア第二のエース）\n対空攻撃：§G+1000%§!  空中防御：§G+800%§!\n最大速度/作戦航続距離：§G+200%§!\n機動/レーダー優位：§G+500%§!\n対地/対艦攻撃：§G+500%§!\n戦略爆撃/海軍攻撃命中：§G+300%§!\n\n§YWiseman§!（軍械巨鳥統合型、ベテラン中隊長）\n対空攻撃/空中防御：§G+500%§!\n最大速度：§G+100%§!  作戦航続距離：§G+150%§!\n機動/レーダー優位：§G+250%§!\n対地/対艦攻撃：§G+300%§!\n戦略爆撃/海軍攻撃命中：§G+200%§!\n\n作成後、対応する軍械巨鳥戦隊にエースを手動で割り当ててください。"
