 start_event.8.t: "ゆず更新ログ"
 start_event.8.d: "ゆず将軍パック 更新ログ 2026.6.14\n\n-千恋＊万花の旧キャラ特性をリセットし、現在のバージョンに対応させました\n-ムラサメと芳乃の顧問数値を調整\n-茉子とムラサメの軍事顧問数値を調整\n-二つのゆず陸軍精神の数値を調整\n-芳乃とムラサメの指導者数値を調整\n-ムラサメがパフェを食べる決議の数値を調整\n-一部のテキストを補充\n-千恋＊万花のオープニングBGMと冒頭画像を変更\n-一部の隠し要素を調整\n-嫁の仇を討つ機能を追加。結婚したキャラが負傷すると、嫁の仇を討つための新決議が解放されます\n-キャラクターを二人追加：虎太郎と赤城\n-ぶらばん！～The bonds of melody～のキャラ特性効果を補充し、エビの軍事顧問を追加\n-アトリの数値を修正し、アトリが本来の実力を発揮できるようにしました\n-ゆずソフト士官学校に熟練度獲得決議を追加し、皆が簡単にレベルMAXのドクトリンを磨けるようにしました\n-芳乃工業化の資源採掘決議に少量の資源を追加\n-喵都の徴収決議を追加\n-春風の「天意」決議を追加\n-ルリの動物友達決議を追加し、インドをプレイしなくても象騎兵テンプレートを獲得可能に\n-一部のバグを修正。新しいバグが生まれたかは不明\n-herobrineを削除"
 start_event.8.a: "はい、分かりました"
 start_event.8.b: "前のページへ"
 start_event.2.t: "あるソ連労働者の日記"
 start_event.2.d: "「私はイワン。ソ連のOKMOで働いている。友人のピョートルはキーロフ工場の生産ラインで戦車を組み立てている」\n\n「ある日、ソ連に突然一団の日本人がやって来た。彼らは『ゆずソフトこそ世界一』と叫びながら、NKVDの護衛の下でクレムリンに入っていった。翌日、スターリン同志が突然、国内のすべての軍産組織を廃止すると宣言した。私とピョートルがいるOKMOやキーロフ工場も含めて。しかし私たちは失業せず、逆に民需工場に配属され、奇妙な工場の建設を始めた」\n\n「工場長によると、これはスターリン同志が自ら急ぎ建設を指示した近現代の軍産コンビナートらしい。軍産コンビナートが何かは分からなかったが、真新しい工作機械が搬入されるのを見て、思わず心から感嘆した——なんて綺麗なんだ」\n\n「25日間にわたる過酷な建設の後、モスクワ北西郊外に巨大な建造物がそびえ立った。中には見たこともない先進的な機械設備が揃い、奇抜な服装をした日本人女性数人が工場長と何かを交渉していた」\n\n「しかし私とピョートルはそんなことを気にしている余裕はなかった。生産ラインに上がった瞬間、新設備の驚異的な効率に衝撃を受けた——122mm榴弾砲が、わずか数分で様々な半自動機械により最少人数の人手で組み上がる。BT-7軽戦車も、作業員が操縦桿をちょっと弄るだけで生産ラインを下りてくる」\n\n「私は工場の門を出て、高く掲げられた『ゆず陸軍製造総局』の看板を見上げ、敬服の念が湧き上がった——あの柚子厨たちは本当にすごい」"
 start_event.2.a: "柚子厨は偉大だ"
 start_event.3.t: "将軍たちの離別"
 start_event.3.d: "ゆずの将軍たちの私たちへの好感度が低すぎるため、一部が去ることを選びました。"
 start_event.3.a: "危機一髪"
 start_event.4.t: "ゆずソフトのヒロインたちはもうあなたを信じない"
 start_event.4.d: "ゆずの将軍たちの私たちへの好感度が低すぎるため、彼女たちは去ることを選びました。"
 start_event.4.a: "天が崩れ落ちた。"

