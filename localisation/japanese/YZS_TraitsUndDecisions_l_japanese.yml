 type90_tank_chassis: "ゆずYIWG-90式主力戦車シャーシ"
 type90_tank_chassis_short: "YIWG-90式"
 type90_tank_chassis_desc: "90式戦車は防衛庁技術研究本部が1977年に開発へ着手し、1989年に採用が決定、1990年8月6日に制式化された。製作は三菱重工業と日本製鋼所が担当する。公開諸元は全備重量約50トン、乗員3名、最高速度70km/h、主武装120mm滑腔砲。YIWG 90式は、これらの技術的基準を維持した本MOD独自の量産型である。"
 type90_tank_chassis_1: "ゆずYIWG-90式主力戦車シャーシ"
 type90_tank_chassis_1_short: "YIWG-90式"
 type90_tank_chassis_1_desc: "90式戦車は防衛庁技術研究本部が1977年に開発へ着手し、1989年に採用が決定、1990年8月6日に制式化された。製作は三菱重工業と日本製鋼所が担当する。公開諸元は全備重量約50トン、乗員3名、最高速度70km/h、主武装120mm滑腔砲。YIWG 90式は、これらの技術的基準を維持した本MOD独自の量産型である。"
 type90_Rh_120_120mm_gun: "ラインメタルRh-120 120mm L/44滑腔砲"
 type90_Rh_120_120mm_gun_desc: "90式はラインメタル系120mm L/44滑腔砲を搭載する。自動装填装置、砲安定装置、デジタル射撃統制装置と連動して夜間および走行間射撃を可能とし、砲身の歪みも弾道計算の入力に用いられる。"
 type90_tank_turret: "自動装填式2名用砲塔"
 type90_tank_turret_desc: "砲塔には車長と砲手が配置され、自動装填装置が装填手を代替することで乗員は3名となる。陸上自衛隊の公開資料では、砲塔・車体の複合装甲、弾薬・燃料系統と乗員の隔離、消火装置、レーザー検知装置、個人給気式防護装置が確認されている。"
 type90_hydropneumatic_suspension: "油気圧・トーションバー併用懸架装置"
 type90_hydropneumatic_suspension_desc: "90式は油気圧式とトーションバー式を併用するハイブリッド懸架方式を採用する。約50トンの車体に、路外での安定性、車体姿勢制御、高速機動を両立させ、公開最高速度70km/hを実現する。"
 type90_composite_armor: "複合装甲・乗員区画防護"
 type90_composite_armor_desc: "陸上自衛隊の公開資料では、砲塔と車体の複合装甲または新素材複合材、サイドスカート、レーザー検知、消火装置、弾薬・燃料系統と乗員の隔離が確認できる。装甲の具体的な積層材、厚さ、換算防護力は公表されていないため、未確認のセラミック構造や防護数値は事実として扱わない。"
 type90_Mitsubishi_10ZG32WT_engine: "三菱10ZG32WT 1,500馬力ディーゼル"
 type90_modern_electronic_equipment: "レーザー測距・熱映像照準装置"
 type90_machine_guns: "M2HB 12.7mm重機関銃・74式7.62mm車載機関銃"
 type90_fire_control_system: "センサー統合デジタル射撃統制装置"
 type90_auto_loader: "砲塔後部自動装填装置"
 type90_Mitsubishi_10ZG32WT_engine_desc: "90式は、水冷2サイクル10気筒ディーゼル機関を搭載し、2,400rpmで1,500馬力を発揮する。油圧制御式の自動変速・操向装置と組み合わされ、超信地旋回に対応し、50トン級の車体を最高70km/hで走行させる。"
 type90_modern_electronic_equipment_desc: "照準装置はレーザー測距器、自動追尾機能付き熱映像装置、安定化照準器を統合する。夜間でも目標の捜索・追尾・測距を可能とし、デジタル射撃統制計算機へ継続的に目標情報を供給する。"
 type90_machine_guns_desc: "副武装は12.7mm重機関銃1挺と74式7.62mm車載機関銃1挺で構成され、低空・軽装甲目標および近距離の歩兵に対する制圧火力を担う。"
 type90_fire_control_system_desc: "デジタル射撃統制装置はレーザー測距、熱映像、砲安定、自動追尾を統合する。陸上自衛隊の公開資料では、風向・風速、装薬温度、砲耳軸傾斜、砲身の歪みがセンサー入力として示され、夜間および走行間での精密射撃を可能としている。"
 type90_auto_loader_desc: "自動装填装置が120mm弾薬を選択・装填するため、90式は車長・砲手・操縦手の3名で運用できる。貯蔵弾薬は乗員区画から隔離され、消火装置も備えることで、省人化と被弾時の生存性向上を両立する。"

