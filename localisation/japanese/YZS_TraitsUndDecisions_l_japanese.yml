 yz_Ukisov_trait_desc: "該当者なし"
 maid_Ling_trait: "「六大原則」戦略の宗師"
 maid_Ling_trait_desc: "綾総の戦術スタイルは、電光石火の機動と外科手術のような正確さを融合している。部隊の進軍は風の如く、切り込みは鬼の如し。「一点両面」「三三制」などの戦術原則により、部隊は並外れた戦場機動力と作戦の奇襲性を持つ。綾総の指揮芸術は、敵を常に最も間違った時間に、最も間違った場所で、最も猛烈な攻撃に直面させる。ゆず野戦軍には「綾司令官の命令が下へ伝われば、星幽一たび展開すれば大軍が前進する」という言葉がある"
 yz_Ling_trait: "（偽）癒しの風"
 yz_Ling_trait_desc: "「聖輝の加護あらん大地の手よ、恩恵を司る偉大なる后土よ、我が呼びかけに応えよ：慈母の如き息吹を擁護し、慈悲と救済の光を与え、我に奇跡を授けたまえ——癒しの福音を召喚せよ！」"
