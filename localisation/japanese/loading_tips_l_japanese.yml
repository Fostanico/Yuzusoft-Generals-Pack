l_japanese:
 LOADING_TIP_0: "あんたとなんか絶対に結婚しないんだから！\n——朝武芳乃"
 LOADING_TIP_1: "私の0721を見てください！\n——綾地寧々"
 LOADING_TIP_2: "ボーっと風に吹かれ　しっぽの手入れして あなたの帰り　待つの　プレゼント　探しながら"
 LOADING_TIP_3: "あっ、先輩！Ciallo～(∠・ω< )⌒★\n——因幡めぐる"
 LOADING_TIP_4: "ざーこざーこ〜お兄ちゃんは基本的な防御すらできないの？\n——谷風天音"
 LOADING_TIP_5: "明日も明後日もまた逢いたいのは君だけだよ\n君の笑颜见ただけで元気になれる"
 LOADING_TIP_6: "柚子厨は無情な生き物である。"
 LOADING_TIP_7: "麺硬め 塩多め 野菜ダブル ニンニク アブラマシマシ\n——綾地寧々"
 LOADING_TIP_8: "ああ、痛い痛い、削られちゃう！\n——在原暁、あやせにリドルジョーカーされている最中"
 LOADING_TIP_9: "貧乳は希少資源です！\n——三司あやせ"
 LOADING_TIP_10: "在原七海？彼女、起爆器いくつ持ってるんだ！\n——綾地寧々"
 LOADING_TIP_11: "萌えゲーこそがゆずソフト最大の特徴である。"
 LOADING_TIP_12: "唯一の真の力は起爆器から生まれる。\n——綾地寧々"
 LOADING_TIP_13: "ご主人様〜\n——ムラサメ"
 LOADING_TIP_14: "この命の運命 君と結びて 彼方の郷愁の果てに"
 LOADING_TIP_15: "魔法で変えられた『過去』より\n私は今の『現在』のほうが好き"
 LOADING_TIP_16: "赤らむ頬は 恋心隠せず\n気づかれたくなくて視線を逸らした"
 LOADING_TIP_17: "裸足で駆け出したあの瞬間 偽りも欺きも空の彼方へ\n目を赤くして涙ながらに夢の湖畔へ——初めて恋の甘さを知った"
 LOADING_TIP_18: "呪いが解けて 小さな願いが芽生えた\nでもそれは少女の秘密——言えない秘密"
 LOADING_TIP_19: "願いこそが 運命を創り 無限の未来を切り拓く"
 LOADING_TIP_20: "喧嘩したこともあったけれど 思い出すのは素敵なことばかり"
 LOADING_TIP_21: "ああ、綾地寧々はかくも若々しく——\n若き0721人は前進する！\n——『柚子頌』"
 LOADING_TIP_22: "え？なんて言った？"
 LOADING_TIP_23: "柚子厨は退群せよ。"
 LOADING_TIP_24: "柚子厨、匂いを抑えろ。"
 LOADING_TIP_25: "ワン、ツー——一歩ずつ完璧な少女を仕上げていく！"
 LOADING_TIP_26: "誰も私のおっぱいの本当のサイズを知ることはできない。もし知ったなら——私の名前はあやせじゃない、零乳と呼びなさい。\n——三司零乳"
 LOADING_TIP_27: "人の小さな悩みを解決し 使命を背負いて運命の中を往く"
 LOADING_TIP_28: "ずっと秘密を隠して 人と距離を置いてきた\nそんな毎日が輝き出した\nあなたがくれた景色は SWEET TREASURE"
 LOADING_TIP_29: "私の修就（しゅうじ）を受け取ってください！\n——朝武芳乃"
 LOADING_TIP_30: "ドロップ言うな。ぶっ飛ばすぞ\n——三司あやせ平野"
 LOADING_TIP_31: "......男に言われてもなあ......僕、その気は毛頭ないからね？\n——周防恭平"
 LOADING_TIP_32: "ワシを相手にすると、変態になるのかのう？\n——荒神小夜"
 LOADING_TIP_33: "バナナと牛乳は朝食に丁度いいもんね。健康にもいいもんね。\n——墨染希"
 LOADING_TIP_34: "それより公務員試験の準備した方がいいよ、絶対\n——墨染希"
 LOADING_TIP_35: "一対一の決闘では、勝者は起爆器の電池が一メモリ多い方だ。\n——綾地寧々"
 LOADING_TIP_36: "私は起爆器よりシャワーヘッドのほうがいい。\n——エルウィン・栞那"

 LOADING_TIP_37: "癒しの風〜\n——在原七海"
 LOADING_TIP_38: "私はイルノを平衡設計の最悪と考えています\n——GPT-5.6sol、イルノがモッドの平衡性設計の問題について尋ねた時"
 LOADING_TIP_39: "誰も私のおっぱいの本当のサイズを知ることはできない。もし知ったなら——私の名前はあやせじゃない、零乳と呼びなさい。\n——三司零乳"
 LOADING_TIP_40: "第三次世界大戦で何が使われるかは知らないが、第四次では人類はきっと柚子と柚子で攻撃し合っているだろう。"
 LOADING_TIP_41: "我が大臣たちは皆『千恋＊万花』を遊び、我が妃は『魔女の夜宴』を遊び、我が臣民は『リドルジョーカー』を遊ぶ。\n——ボリス三世"
 LOADING_TIP_42: "世の中には三種類の嘘がある。嘘、ひどい嘘、そして「私はゆずソフトのゲームを遊ばない」だ。\n——マーク・トウェイン"
 LOADING_TIP_43: "我々は浜辺でギャルゲーを遊び、野原や街路でもギャルゲーを遊ぶ。我々は決してギャルゲーを遊ぶことをやめない。\n——ウィンストン・チャーチル"
 LOADING_TIP_44: "柚子厨がギャルゲーを遊ぶ事業は、いかなる暗殺者の銃弾によっても止められることはない。\n——ロバート・F・ケネディ"
 LOADING_TIP_45: "革命が起これば、どう収まるかは神のみぞ知る。立憲政体はロシアの終焉を意味すると思う。我々には柚子厨が必要だ！\n——ミハイル・トゥハチェフスキー"
 LOADING_TIP_46: "五十元くれ。今日がクレイジーサーズデーかどうかはどうでもいい。\n——蒋介石（『千恋＊万花』サマーセール時）"
 LOADING_TIP_47: "制作陣の生産力が競い咲き、柚子元帥が帳に昇る——\n——柚子参謀本部宣伝スローガン"
 LOADING_TIP_48: "柚子MODは天国、群主の牢八は架け橋——\n——柚子総参謀部宣伝スローガン"
 LOADING_TIP_49: "朝武芳乃は穂織大祓の心臓となれるか"
 LOADING_TIP_50: "——『これが穂織だ』芳乃が語る"
 LOADING_TIP_51: "鷲逗のあの方式を取り入れれば、必ずより発展し、より安定し、より自由になったのか？多くの過疎地域が鷲逗方式を模倣したが、結果はどうだったか。政治は混乱し、社会は不安定になり、柚子厨は流浪した。"
 LOADING_TIP_52: "なに、君の認識を超えたか？\n——三司あやせ、自分のおっぱいについて評価する際"
 LOADING_TIP_53: "にに〜"
 LOADING_TIP_54: "May the Force be with you."
 LOADING_TIP_55: "みんな、おしゃべりしようぜ。"
 LOADING_TIP_56: "今や私は死神となり、Steamワークショップの破壊者となった——綾地寧々、起爆器発明後"
 LOADING_TIP_57: "May the Force be with you."
 LOADING_TIP_58: "気にしないで、愛に性別は関係ないわ。応援してるよ〜（悪い笑み）\n——卯花之佐久夜姫"
 LOADING_TIP_59: "手順通りにするか、それとも直接グーパンチ二発くらわせようか？"
