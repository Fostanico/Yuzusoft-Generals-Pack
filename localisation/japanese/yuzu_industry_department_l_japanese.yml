 yz_bond_help_title_text: "ゆず経済局 債券運用手引"
 yz_bond_help_left_text: "§Y1. 債券は無料のゆずコインではない§!\n債券は明日の収入を今日使う仕組みだ。資金は直ちに入るが、債務は毎月の決算で返していく。同時に維持できる契約は一件だけ。発行前に§Y受取額、元本、最低返済、予想月額§!を確認しよう。今日の豊かな残高が来月の財政難を隠すこともある。\n\n§Y2. いくら調達するか§!\n§Y発行目標§!は売りたい規模、§Y約定年利§!は市場が買う量を決める。引受率は40%に年利の十倍を加え、60%-190%。2%/6%/10%/15%なら目標の60%/100%/140%/190%が売れる。実引受額は受取額と新規元本の双方だ。低金利は安いが小規模、高金利はすぐ資金を集める代わりに元本と利息も大きい。\n\n§Y3. 毎月の返済§!\n契約の§Y最低月次元本§!は下げられない。§Y予定月次元本§!は自ら返したい額で、支払後も現金留保を守れる時だけ全額を返し、無理なら最低額へ戻る。約定年利は契約時に固定。実績年利が約定未満なら差額が債務化して信用を傷つけ、上回れば余分な利息で信用を買う。"
 yz_bond_help_middle_text: "§Y4. 三つの債券、三つの役割§!\n安定債券は安定度§G+8%§!、生活消費財工場§G-5%§!。開発債券は建設速度§G+12%§!、民需工場出力§G+8%§!。戦時債券は戦争協力度§G+10%§!、軍需工場・造船所出力§G+12%§!を与える。契約と臨時政策の補正は§Y「ゆず経済局」§!国民精神へ集約される。\n\n§Y5. [YZ_bond_management_institution]にどこまで任せるか§!\n§Y手動§!は全設定を操作し、§G自動返済§!は元本、実績利率、現金留保、猶予、追加販売、満期処理を[YZ_bond_management_institution]へ委ねるが、新規契約は発行しない。§C全自動§!は発行の時期と規模、約定利率、券種まで委任する。同機関は毎月、基礎資金収支、運転資金、債務圧力、信用、工場成長、長期投資、戦争を確認する。現金が逼迫すれば運転資金を守り、債務が重ければ削減を急ぎ、満期が近ければ余裕の範囲で返済を加速する。新規発行は全自動かつ真の資金不足がある時に限る。\n\n§Y6. 委任方針は盲目的な命令ではない§!\n適応は同機関へ判断を任せ、保守は流動性と債務削減、均衡は成長と返済、拡張は健全な経済で開発資金を重視する。流動性危機と戦争は常に通常方針より優先される。自動返済と全自動は返済操作を接管し、発行量・約定利率・券種は全自動でのみ機関が決める。手動へ戻せば再び全ての設定を調整できる。"
 yz_bond_help_right_text: "§Y7. 資金が苦しい時§!\n§Y返済猶予§!は次回元本を止めるが、利息を債務化し信用-2。§Y追加販売§!は予想引受額の20%を直ちに得る一方、受取額110%の元本を作る。各政体にも非常手段がある。民主主義は市場抽選、共産主義は消費負担下の産業返済、中立主義は信用と政治力を犠牲に強制転換、ファシズムは120日の勝利公債に戦果を賭ける。正確な確率と費用はボタン表示で確認できる。\n\n§Y8. 満期を見過ごさない§!\n満期には完済、一度の延長、整理を選ぶ。延長は債務+15%、月次元本+50%、信用-15で、二度目はない。整理はゆずコインを失い一年の危機を招く。点グラフは48か月前から今月までの残債を毎月1点で示し、右端が常に今月である。点の上昇が続くなら次回発行を減らし、返済を増やすか、新規投資を延期しよう。\n\n§Y9. 最初の発行例§!\n計算を省きたいなら、まず§Y目標5000、約定年利6%、現金留保1000§!で自動返済を使うとよい。信用50以上で拡張を始める時は開発債券が有力だ。二回の月次決算を見て、ゆずコインが減り続け、債務点も上がるなら、全自動へ任せる前に返済を増やすか次回発行を小さくしよう。"
