l_japanese:
#芳乃工业决议决议部分：
 yz_economy_department_category_close: "経済決議グループを閉じる（中核団決議グループから再度開けます）"
 show_yuzu_economy_department: "ゆず経済局を表示"
 Yoshino_industry_five_year_yes_by_loan: "開発債券で芳乃穂織振興計画を開始"
 Yoshino_industry_five_year_yes_by_loan_desc: "工業基盤が不足する場合、開発型ゆず債券で芳乃の穂織振興計画を調達できる。発行目標£GFX_yz_money §Y[?yz_bond_next_issue_amount|0]§!を設定し、約定年利§Y[?yz_bond_next_promised_rate|.1]%§!で市場が£GFX_yz_money §G[?yz_bond_next_issue_proceeds|0]§!を実際に引き受ける。この金額が受取額と新規元本の双方となる。経済局から建設・工場出力の効果を得て、残債は300日後に精算される。\n§R債務は返済が必要§!で、工業化後は従来の長期投資も解禁される。"
 bond_we_issuing_tooltip: "開発型ゆず債券を発行"
 Yoshino_industry_540days_by_loan: "芳乃の穂織振興計画"
 Yoshino_industry_540days_by_loan_desc: "芳乃の穂織振興計画は我が国の工業化発展に明るい展望を描いてくれたが、債券の発行も芳乃自身の国内支持率も高くない。芳乃お嬢様が2年以内に成果を出さなければ、建設部門に留まり続けるのは難しくなるだろう。\n§R同時に、我々が発行した債券も無視できない§!"
 yuzu_auto_industrialization: "自動化工業投資"
 yuzu_auto_industrialization_desc: "芳乃同志は工業分野での投資計画を決定した。（柚子コインが不足すると投資計画は自動的に停止します）"
 Yoshino_industry_five_year_industrial_complex_by_bonds_1: "第一段階 工業投資"
 Yoshino_industry_five_year_industrial_complex_by_bonds_1_desc: "我が国の工業基盤は脆弱だ。芳乃同志はいくつかの重点分野に投資することを決定した。"
 Yoshino_industry_five_year_industrial_complex_by_bonds_2: "第二段階 工業投資"
 Yoshino_industry_five_year_industrial_complex_by_bonds_2_desc: "一つの重点分野への投資後、芳乃同志はより長期的な視点に目を向けることにした。"
 Yoshino_industry_five_year_industrial_complex_by_bonds_3: "第三段階 工業投資"
 Yoshino_industry_five_year_industrial_complex_by_bonds_3_desc: "我々はすでに十分な工業基盤を築いた。芳乃同志は資源を我が国工業のあらゆる側面に投入する。"
 yuzu_auto_infrastructurlization: "自動基礎建設投資"
 Yoshino_industry_five_year_infrastructure_by_bonds_1: "第一段階 基礎建設投資"
 Yoshino_industry_five_year_infrastructure_by_bonds_1_desc: "我が国の基礎建設はあやせの胸と同じくらい貧しい。芳乃同志はいくつかの重点地域でインフラ投資を行うことを決定した。"
 Yoshino_industry_five_year_infrastructure_by_bonds_2: "第二段階 基礎建設投資"
 Yoshino_industry_five_year_infrastructure_by_bonds_2_desc: "重点地域への投資後、我々はより広い地域に目を向けなければならない。"
 Yoshino_industry_five_year_infrastructure_by_bonds_3: "第三段階 基礎建設投資"
 Yoshino_industry_five_year_infrastructure_by_bonds_3_desc: "我々の視野は現在の地域に留まるべきではない。より多くの地域に投資するのだ。"
 yuzu_auto_state_category: "自動地域建設投資"
 yuzu_auto_state_category_desc: "現在、我が国の多くの地域は依然として遅れている。いくつかの地域に投資して発展を助け、模範地域とすることができる"
 Yoshino_industry_five_year_state_category_by_bonds_1: "第一段階 地域建設投資"
 Yoshino_industry_five_year_state_category_by_bonds_1_desc: "芳乃同志は第一段階の投資地域を選定した。ここを芳乃モデル地区に建設する。"
 Yoshino_industry_five_year_state_category_by_bonds_2: "第二段階 地域建設投資"
 Yoshino_industry_five_year_state_category_by_bonds_2_desc: "第一段階の投資後、全国人民が芳乃投資の正しさを認識し、より多くの地域で投資を推進できるようになった。"
 Yoshino_industry_five_year_state_category_by_bonds_3: "第三段階 地域建設投資"
 Yoshino_industry_five_year_state_category_by_bonds_3_desc: "二回の投資を経て、我々の多くの地域の人民生活は大きく向上した。他の人民にも生活の大きな進歩をもたらさなければならない。"
 yuzu_auto_others: "自動その他投資"
 yuzu_auto_others_desc: "我が国の他の分野の基礎も総じて弱い。芳乃は他の分野にも投資が必要だと考えている"
 Yoshino_industry_five_year_3_by_bonds: "鉄鋼産業への投資"
 Yoshino_industry_five_year_3_by_bonds_desc: "他の大国と比べると、我が国の鉄鋼産業は完全に無視できるレベルだ。芳乃はすでに調査済みの豊富な鉱区の採掘を決定し、最終的に我々自身の「英国に追いつき米国を超える」を実現する。"
 Yoshino_industry_five_year_4_by_bonds: "産業発展投資"
 Yoshino_industry_five_year_4_by_bonds_desc: "我が国の生産ライン技術はまだ十分に発達していない。これらの分野に投資し、我が国工業の協調的発展を実現しなければならない。"
 Yoshino_industry_five_year_5_by_bonds: "工業・農業協調発展への投資"
 Yoshino_industry_five_year_5_by_bonds_desc: "我が国の工業と農業の間には依然として不均衡が存在する。人民の日増しに高まる美好な生活への需要と、不均衡・不十分な発展との矛盾が徐々に激化し始めている。芳乃は工業・農業の重点産業に投資することを決定した。"
 Yoshino_industry_five_year_20_by_bonds: "農業機械化への投資"
 Yoshino_industry_five_year_20_by_bonds_desc: "我が国の農業の急速な発展を実現した後、農業機械化のプロセスに投資し、農業の質の高い発展を実現する必要がある。"
 #经济决议：
 yuzu_economy_department_category: "ゆず経済部"
 yuzu_economy_department_category_desc: " "
 we_dont_start_yz_invest: "我々は債券投資による工業化プロジェクトの開始を選び、現在は国家の債券を運用している。うまく運用すれば債券は必ず我々に有利に働く。§Rただし、うまく運用することが前提だ§! \n\n現在の週利子は[?yz_interest_rate_we_can_see|.3+Y]§G%§!、返済が必要な柚子コインは£GFX_yz_money：[?bond_we_need_to_repay|.0+Y]"
 we_now_start_yoshino_industry_long_term_invest: "我々は債券投資による工業化プロジェクトの開始を選び、現在は芳乃チャロ券を運用している。うまく運用すれば債券は必ず我々に有利に働き、芳乃同志の投資計画も必ず国と民の利益になる。§Rただし、うまく運用することが前提だ§! \n\n現在の週利子は[?yz_interest_rate_we_can_see|.3+Y]§G%§!、返済が必要な柚子コインは£GFX_yz_money：[?bond_we_need_to_repay|.0+Y] \n\n現在、芳乃の投資計画を実施中だ。毎月の追加柚子コイン消費は£GFX_yz_money [?basic_additional_yz_money_spend|.0+Y]"
 Yoshino_industry_debt_cycle: "債務サイクル"
 Yoshino_industry_debt_cycle_desc: "我々は芳乃穂織券を発行している。毎週、債務と週利子が増加する。"
 we_need_to_make_choice_about_yz_bonds: "§R我々は債務について選択をする必要がある§!"
 Expanding_debt_issuance_first_time: "債券発行の初期拡大"
 Expanding_debt_issuance_first_time_desc: "柚子コインが投資を支えきれない場合、債券発行を拡大できる。ただし、これは必ず債券利子率の上昇を招く。"
 expend_debt_issuance_first: "£GFX_yz_money §Y3500§!の債券を獲得"
 bond_we_need_to_repay_add_tooltip: "返済が必要な金額が£GFX_yz_money §R$RIGHT|R0$§!増加"
 add_interest_rate_tooltip: "週利子が$RIGHT|R3$%増加"
 yz_debt_collapse: "債務崩壊"
 Expanding_debt_issuance_second_time: "債券発行の第二回拡大"
 Expanding_debt_issuance_second_time_desc: "柚子コインがまだ投資を支えきれない場合、債券発行をさらに拡大できる。ただし、利子率はより大幅に上昇する。"
 expend_debt_issuance_second: "£GFX_yz_money §Y3000§!の債券を獲得"
 Expanding_debt_issuance_third_time: "債券発行の第三回拡大"
 Expanding_debt_issuance_third_time_desc: "二回の債券発行でも需要を満たせないようだ。再度債券を発行できるが、利子率は顕著に上昇する。"
 expend_debt_issuance_third: "£GFX_yz_money §Y3000§!の債券を獲得"
 Expanding_debt_issuance_after_third_time: "追加債券発行"
 Expanding_debt_issuance_after_third_time_desc: "三回の債券発行後も、債券発行の拡大を続けられる。ただし、そのたびに利子率が拡大する"
 repay_the_bonds_when_have_no_yzmoney: "他の方法で債券を返済"
 repay_the_bonds_when_have_no_yzmoney_desc: "柚子コインが債券を支払えないため、他の方法で債券を支払うことを選べる。このプロセスは苦しいかもしれないが、§R強制返済よりはるかにコストが低い§!。\n§C債券の返済完了後は、これ以上債券を発行できなくなります。§!"
 now_we_repay_the_bonds_without_yzmoney_tooltip: "他のもので債券を返済しようと試みる。"
 repay_the_bonds_by_yzmoney: "柚子コインで債券を返済"
 repay_the_bonds_by_yzmoney_desc: "柚子コインに十分な余裕ができたので、債券を返済できる。何しろあの債権者たちも、我々の工業発展に一定の貢献をしたのだから。\n§C債券の返済完了後は、これ以上債券を発行できなくなります。§!"
 YM_can_repay: "£GFX_yz_money [?bond_we_need_to_repay|.0+Y]"
 partly_repay_the_bonds_by_yzmoney: "債券を一部返済"
 partly_repay_the_bonds_by_yzmoney_desc: "柚子コインが全債券を返済できるほどではないが、一部を先に返済することはできる"
 YM_can_partly_repay: "£GFX_yz_money [?yz_money|.0+Y]"
 now_we_partly_repay_the_bonds_with_yzmoney_tooltip: "債務を一部返済した。債務の約定を守ったため、週利子は部分的に低下する。"
 now_we_repay_the_bonds_with_yzmoney_tooltip: "柚子コインで債務を返済した"
 start_rob_the_yz_gold_of_the_land: "占領地域の人民にゆずソフトのギャルゲーを購入・プレイさせることを開始"
 start_rob_the_yz_gold_of_the_land_desc: "占領地域の人民は大きな富を持っている。我々は文明的な柚子厨であり、公然と奪うことはできない。彼らにゆずソフトのギャルゲーを買わせよう。彼らも喜んで応じるはずだ"
 close_rob_the_yz_gold: "占領地域の人民へのゆずソフトのギャルゲー購入・プレイ強制を停止"
 rob_the_yz_gold_of_the_land_we_occupied: "[FROM.GetName]の人民にゆずソフトのギャルゲーを購入・プレイさせる"
 rob_the_yz_gold_of_the_land_we_occupied_desc: "占領地域の人民にゆずソフトのギャルゲーを買わせ、その金で債券を返済できる。§Cただし、占領地域の人民がゆずソフトのギャルゲーに夢中になるかもしれません。§!"
 we_force_people_to_buy_yuzu_game_tt: "現地人民にゆずソフトのギャルゲーを購入させることで、£GFX_yz_money [FROM.GetAdjective]  / [?yuzu_rob_cont|.0+Y] / [?yuzu_rob_cont_to_show|.0+Y] / [?FROM.yuzu_rob_cont|.0+Y] / [?FROM.yuzu_rob_cont_to_show|.0+Y] / [?yuzu_rob_cont_to_show_out|.0+Y] / [?yuzu_rob_cont_to_show_out_1|.0+Y] / $LEFT$ / $RIGHT|R0$ を返済した"
 we_force_people_to_buy_yuzu_game_1_tt: "現地人民にゆずソフトのギャルゲーを購入させることで、総額£GFX_yz_money §G$RIGHT|R0$§!の債券を返済した。§C得た債券が返済すべき債券総額を上回る場合、債務は直接ゼロになり、残りはそのまま柚子コイン口座に加算されます。§Cまた、信用を守ったため、債券利子率はリセットされます。§!"
 #2025.3.21,21:46,伊尔诺——这里我搞不定，我也不知道为什么两个本地化会重合
 we_force_people_to_buy_yuzu_game_2_tt: "現地人民にゆずソフトのギャルゲーを購入させることで、総額£GFX_yz_money §G$RIGHT|R0$§!の債券を返済した。我々の債務は£GFX_yz_money [?bond_we_need_to_repay|.0+Y]で、総債券枠を超えている。超過分はそのまま柚子コイン口座に入る"
 we_get_the_rest: "合計£GFX_yz_money §R$RIGHT|R0$§!の剰余を獲得"
 obsessed_in_yuzu_galgame: "ゆずソフトのギャルゲーに夢中"
 obsessed_in_yuzu_galgame_desc: "現地人民にゆずソフトのギャルゲーをプレイさせるよう強制した後、彼らはみなこれらのゲームを好きになった。今や現地人民の日常の挨拶はこうだ：Ciallo～(∠・ω< )⌒☆"
 #test_yz_tooltip_1_tt: "[FROM.GetAdjective]  / [?yuzu_rob_cont|.0+Y] / [?yuzu_rob_cont_to_decti|.0+Y] / [?FROM.yuzu_rob_cont|.0+Y] / [?FROM.yuzu_rob_cont_to_decti|.0+Y] / [?yuzu_rob_cont_to_decti|.0+Y] / [?yuzu_rob_cont_to_decti|.0+Y]"
 #rob_the_yz_gold_description_1: "我们通过强迫当地人民购买柚子社gal为我们偿还了总额为£GFX_yz_money §G$RIGHT|R0$§!的债券"
 Yoshino_long_term_invest_start: "芳乃の中長期投資を開始"
 Yoshino_long_term_invest_start_desc: "芳乃の投資計画を完了した後、我々は芳乃がこの分野で滅多にいない人材であることを認識した。ちょうど芳乃からも新しい投資計画が提出された。これらの投資計画は必ず国と民の利益になる。"
 Yoshino_long_term_invest_in_construction: "芳乃の建設投資"
 Yoshino_long_term_invest_in_construction_desc: "芳乃の工業計画が完了した後、我々の建設はまだ不十分であることを認識した。ちょうどいいことに、芳乃同志が建設分野で偉大な投資計画を打ち出した。これは必ず我が国の建設を促進する。"
 Yoshino_long_term_invest_resource_extraction: "芳乃の資源採掘投資"
 Yoshino_long_term_invest_resource_extraction_desc: "我が国の資源は次第に工業生産の需要を満たせなくなっている。芳乃同志は工業・鉱業分野を支援する偉大な投資計画を開始することを決定した。"
 Yoshino_long_term_invest_in_research: "芳乃の研究投資"
 Yoshino_long_term_invest_in_research_desc: "他の大国と比べ、我が国の研究力は取るに足らない——毎年のハイレベル論文発表数を専門学校と清華・北大が比べるようなものだ。芳乃は国内のいくつかの重点大学と研究所に投資し、研究力を高めることを決定した。"
 Yoshino_long_term_invest_in_industrialization: "芳乃の工業化投資"
 Yoshino_long_term_invest_in_industrialization_desc: "我が国の工業化レベルは依然として不十分だ。芳乃はこの問題に対処するための投資を決定した。芳乃の正しい指導の下では、文灾飛が我々と生産能力を競うにはまだ青すぎる。"
 Yoshino_long_term_invest_in_political_field: "芳乃の恩情投資"
 Yoshino_long_term_invest_in_political_field_desc: "我々は芳乃総書記の指導を堅持し、芳乃が穂織中央全会で下した指示を貫徹実行し、芳乃同志が指し示した穂織民族の偉大な復興の道を揺るぎなく歩む。我々は認識している：芳乃同志の意志は我々の意志であり、芳乃同志が指し示す方向は我々の前進方向である。そのために、我々は一つの投資を実施し、皆に芳乃の§R恩情§!を認識させる必要がある。"
 Yoshino_midterm_boost_construction: "芳乃の建設計画"
 Yoshino_midterm_boost_construction_desc: "芳乃の工業計画はすでに成果を出したが、各地の工事現場はまだ人手不足だと騒いでいる。芳乃同志は余った柚子コインを帳簿に寝かせておくつもりはなく、足場の上へ直接投じて、建設をいま一度押し進めようとしている。"
 Yoshino_midterm_boost_output: "芳乃の増産計画"
 Yoshino_midterm_boost_output_desc: "工場はかなり建ったが、現場はまだシフトを埋めきれない。芳乃は余剰を生産ラインの整理に回し、残業すべきところは残業し、金型を換えるべきところは換え、まずは本当の生産能力を走らせることを決めた。"
 Yoshino_midterm_boost_resources: "芳乃の鉱区開発計画"
 Yoshino_midterm_boost_resources_desc: "工場を開けば開くほど、鉱石はますます逼迫する。芳乃はすでにいくつかの鉱区に目をつけており、金をそこへ投じて鉱車をもう数往復させ、地の下にはまだ良い日々が残っていることを皆に見せようとしている。"
 Yoshino_midterm_build_civilian_factory: "芳乃の民需工場拡張"
 Yoshino_midterm_build_civilian_factory_desc: "工場はまだ足りない。芳乃はすでに五つの重点地区を選定した。柚子コインが下りれば、各地に民需工場を四つずつ立てられる。\n（冷却15日、再度実行可能）"
 Yoshino_midterm_civ_batch_tt: "五つの重点地区に民需工場を各§Y4§!建設する。"
 Yoshino_midterm_build_infrastructure: "芳乃の基盤整備"
 Yoshino_midterm_build_infrastructure_desc: "工事を良くするには、まず道具を良くせよ。芳乃は四本の幹線をいま少し広げ、資材を運び入れ、製品を運び出せるようにしたい。\n（冷却10日、再度実行可能）"
 Yoshino_midterm_infra_batch_tt: "四つの地区のインフラを各§Y2§!段階引き上げる。"
 Yoshino_midterm_build_industrial_park: "芳乃の工業区建設"
 Yoshino_midterm_build_industrial_park_desc: "工場をあちこちに散らすより、五つの地区に工業区を集中して開いた方がよい。民需も軍需も一緒に上げ、この先何を建てるにも空き地が残る。\n（冷却20日、再度実行可能）"
 Yoshino_midterm_park_batch_tt: "五つの地区に民需工場§Y2§!と軍需工場§Y1§!をそれぞれ建設する。"
 #yz_money_monly_tooltip_subtain: "我们每月额外消耗的柚子币增加了"
 decide_on_choice_about_long_effert_or_stop_it_tt: "中期投資を長期投資に転換するかどうかを選択する必要がある"
 additional_yz_money_spend_raise: "毎月の追加柚子コイン消費が£GFX_yz_money §R$RIGHT|R0$§!増加 \n§R柚子コインが不足すると、これらの投資はすべて中止されます§!"


#事件
