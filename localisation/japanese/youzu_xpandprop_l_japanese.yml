 yidian_modifier: "エデン"
 atri_edan: "この計画により、我が国が領有・支配し、中核州としている地域のうち最大2州を§Yエデン§!として整備します。\n§Y州効果：§!\n現地の建造速度：§G+30%§!\n現地の資源量：§G+50%§!\n現地の建築スロット：§G+4§!\n現地の建築スロット係数：§G+25%§!\n我が国による当該中核州での攻撃・防御：§G+15%§!\n現地のエネルギー消費：§G-20%§!\nインフラレベルごとのエネルギー消費：§G-15%§!"
 atri_s_yidian: "アトリのエデン"
 atri_s_yidian_desc: "エデンから帰還したアトリは、その運用原理を理解した。条件を満たす州が残っている限り、その知識を我が国の建設事業へ繰り返し導入できる。"

 start_event.201.t: "ゆず歌舞団・戦時生活誌"
 start_event.201.d: "[YuzuSongUndDanceTroupe_event_text]"
 start_event.201.a: "[YuzuSongUndDanceTroupe_event_option_text]"
 YuzuSongUndDanceTroupe_event_text_1: "NO.1 夜明けの先唱者\n\n毎朝夜明けとともに、三司あやせは歌舞団員を連れて工場の屋上に上がる。鉄板の煙突を天然のメガホンに見立て、澄んだ声で眠る街並みを目覚めさせる。主婦たちは彼女の「朝霧の小唄」に合わせて火を起こし粥を炊き、生徒たちは旋律に合わせて教科書を暗唱する。防空警報が鳴ると、彼女は歌詞のない旋律をそっと口ずさみ、錆びた手すりに指で拍子を刻む——唸る爆撃機さえも和声の一部になったかのようだ。\n\n「音楽は何かに勝つ必要はないわ。ただ、明日は何のために目覚めるのかを思い出させてくれればいいの」彼女はよくそう言い、拾った薬莢に小さな穴を開けて風鈴にし、街角のパン屋に配る。"
 YuzuSongUndDanceTroupe_event_text_2: "NO.2 ギターと星空の教室\n\n防空壕の奥にある予備電源室には、いつも途切れ途切れのギターの音が漂っている。仮屋和奏は医療ガーゼで弦を包み、子供たちに缶詰の蓋をピックにして使うよう教える。彼女が夜勤の労働者のために編曲した「星軌の子守唄」は驚くほど優しい——金属の弦は薄暗い油灯の下で暖かく輝き、防空壕に染み込む水滴の音さえ天然のメトロノームになる。\n\nある時、空襲が長引いて、彼女は七時間ぶっ通しで弾き続け、指先から血が滲むまで止めなかった。翌日、人々は彼女がこっそりギターケースを本棚に改造し、古い地図を貼り合わせた音楽理論のノートを詰め込んでいるのを見つけた。"
 YuzuSongUndDanceTroupe_event_text_3: "NO.3 トロンボーンと縫製教室\n\nコミュニティセンターのミシンのそばには、いつも彼女のトロンボーンが立っている。中ノ島妙は「編み物ビート法」を考案した。十針ごとに一音伸ばし、継ぎ当ての模様を目に見える五線譜にするのだ。主婦たちは「毛糸のワルツ」のリズムに合わせて手袋を編み、いつの間にか針目まで鍵盤のように整っていく。\n\n彼女の一番人気の授業は「お化け退散刺繍」——実はハンカチに音符の模様を刺繍するだけのものだ。「音楽は怖いものを全部追い払えるんだよ！」と真剣に言うが、耳はこっそり赤くなっている。ある時、稲妻が窓枠を走り、彼女は驚いてトロンボーンを毛糸かごに突っ込んでしまい、史上最も震えまくる「雨の情景」を吹き上げた。"
 YuzuSongUndDanceTroupe_event_text_4: "NO.4 トランペットと屋上郵便局\n\n病院の屋上の物干し竿の間を、いつも活発なトランペットの音が跳ね回る。海老原みなせはカルテを紙飛行機に折り、負傷兵たちの家書を遠くへ運ぶ。彼女は一通ごとに専用の旋律を作る。新生児への祝福は軽やかな「雲雀の歌」、戦死した戦友への追悼は沈む「霧鐘の挽歌」。\n\n看護師長におやつを没収された夜、彼女はふくれながら一晩中「空腹マーチ」を吹き鳴らし、結果的に病棟中の患者が一緒にハミングすることになった。翌朝の朝食時、皆は黙って配給のジャムを彼女の楽譜の裏に塗った——そこには「エビと呼ぶな」と書かれた抗議の落書きで埋め尽くされていたのに。"
 YuzuSongUndDanceTroupe_event_text_5: "NO.5 クラリネットと貸出ステーション\n\n図書館の廃墟に、彼女の「規律の要塞」が立っている。今宮紀子は薬莢を並べて図書分類法を作り、戦前の小説はすべて血液銀行の書式を改造した貸出帳に登録しなければならないと定めた。彼女が『戦争と平和』に付けた読書用BGMは「変ホ長調の瞑想曲」で、『若草物語』には厳格な三拍子のページめくりリズムを指定している。\n\n誰かが深夜、書架の間に丸まって、鉛筆の先で壁の割れ目に「月光ソナタ」を黙写している彼女を目撃した。その音符たちは『歩兵操典』の背表紙の陰に隠れ、優しい秘密の連なりとなっている。"
 YuzuSongUndDanceTroupe_event_text_6: "NO.6 月光コンサート\n\n爆撃で壊れた教会の残骸が、彼女の念入りに計画された舞台になった。雲雀丘由貴は砕けた色ガラスを貼り合わせて星空の投影を作り、聴衆全員に自作の楽器——スプーンとブリキ缶、櫛とセロファン——を持参するよう要求する。彼女が作った「瓦礫の協奏曲」は風の音との正確な合奏を要し、廃墟の上を飛ぶ夜梟まで特別出演者に指定されている。\n\n幕が下りるたびに彼女は慌てる。「べ、別にあなたたちのために用意したんじゃないんだから！たまたま月光があっただけよ！」焼け焦げたベルベットの幕を掴み、頬は不発弾の警告塗料より赤い。"
 YuzuSongUndDanceTroupe_event_text_7: "NO.7 タンポポ合唱団\n\n孤児院の古いピアノのそばで、御影須美は子供たちに薬莢で音叉を作るよう教える。彼女は箒の柄を削って指揮棒にし、野花の群れの中で天然の和音を探す——舞い散るタンポポの綿毛の音はソプラノ、甲虫の羽音は低音の伴奏だ。\n\nある兵士が鹵獲した敵軍のアコーディオンを持ち帰った。彼女は黙って鍵盤を外し、文字学習盤に改造した。最初の子供が「歓喜の歌」の旋律で「平和」という言葉を読み上げたとき、彼女はうつむいて眼鏡を拭き、雨が目に沁みただけだと言った。"
 YuzuSongUndDanceTroupe_event_text_8: "NO.8 神楽とブリキの神社\n\n爆破された建実神社の跡地で、朝武芳乃は落下傘の布で注連縄を結う。彼女はドイツ軍の鉄兜を逆さにして仮の神棚とし、薬莢を彫って作ったミニチュアのムラサメ丸を祀る。毎週金曜の夜明け、彼女は崩れた壁の陰で簡略版の神楽舞を舞う——錆びた缶切りの蓋を神楽鈴に、包帯を緋袴の色に染め、雲を裂いて飛ぶ爆撃機の轟音までも太鼓の代わりとする。\n\n防空壕の最深部には、弾薬箱を組み合わせた「臨時神社」があり、芳乃の手描きによる二十四節気表が掛かっている。祭りの日には、彼女は子供たちに薬莢で白い鳩を折る方法や、信管を燭台にする方法を教える。ある兵士が彼女の作ったブリキの御守りに恋人の写真を忍ばせた。戦後、その写真の裏に小さな文字が書き足されているのが見つかった。「すべての待つ時間が、朝の光に値しますように」。\n\n三司あやせの朝の歌が三番に差し掛かるとき、芳乃はいつも工場の煙突の影で黙って舞っている。二人が言葉を交わしたことはない。しかしある日、あやせの楽譜フォルダに柚子の葉が一枚挟まっていた。そして神社跡の瓦礫の上には、銅線で曲げて作ったミニチュアのマイクが置かれていた。"
 YuzuSongUndDanceTroupe_event_text_9: "朝霧が晴れないうちに、三司あやせはもう工場の冷却塔の上で声出しをしていた。彼女はサーチライトの反射板を反響板に見立て、口ずさむコーラスは蒸気管に沿って厨房へ流れ込む——そこで仮屋和奏が銃剣でギターブリッジを削り、圧縮ビスケットの袋を防音材に改造していた。中ノ島妙のトロンボーンの音が縫製教室から漂い、主婦たちがボタンを紐で繋いで作った風鈴の音と混ざり合い、図書館の崩れた柱の陰に丸まっていた今宮紀子を驚かせた。彼女は慌てて音符の書き込まれた包帯を『歩兵操典』の中に隠した。\n\n雲雀丘由貴は子供たちを指揮して砕けた磁器をモザイクの幕壁に貼り付け、御影須美はその隙に半缶のペンキをくすねて、孤児たちに防空壕で五線譜を描くよう教えた。海老原みなせのトランペットが突然病院の屋上から響き渡り、二十三の窓から同時にカルテの紙鳩が飛び立った。どの翼にも、朝武芳乃が柚子の皮の汁で描いた御守りの紋様が滲んでいた。\n\n暮色が迫る頃、皆は鉄道橋の廃墟に集まった。三司あやせが線路を改造した音叉を打ち鳴らすと、月光は仮屋和奏のギターの弦を伝って廃車両の中へ流れ込んだ。芳乃が信号弾の薬莢を繋いで作った神楽鈴を振ると、八百の缶燭台が同時に灯った——今宮紀子が音階順に並べたもので、炎の高さはすべてミリ単位で正確だった。"
 YuzuSongUndDanceTroupe_event_option_text_1: "弾殻は朝の歌を孕み、鉄の喉は星霜を醸す"
 YuzuSongUndDanceTroupe_event_option_text_2: "断たれし弦は星の光に枕し、余温は長夜を孵す"
 YuzuSongUndDanceTroupe_event_option_text_3: "針目は幽霊を鎮め、毛糸は月の潮を縛る"
 YuzuSongUndDanceTroupe_event_option_text_4: "紙鳶は暮色を背負い、休符は鳩の群れを養う"
 YuzuSongUndDanceTroupe_event_option_text_5: "弾殻は月光を閉じ込め、血庫は潮騒を飼う"
 YuzuSongUndDanceTroupe_event_option_text_6: "砕けし硝子の鼓動、焦げた絹は月の軌道を縛る"
 YuzuSongUndDanceTroupe_event_option_text_7: "蒲公英は文字を覚え、鍵盤は春雷を蒔く"
 YuzuSongUndDanceTroupe_event_option_text_8: "琴線は時を繕い、神楽は黎明を揺り起こす"
 YuzuSongUndDanceTroupe_event_option_text_9: "鋼盔の弱音は焦土を鎮め、神楽の残鈴は春の川を繍う"
