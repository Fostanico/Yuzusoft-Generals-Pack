 tarot_the_chariot_name: "§Y戦車（正位置）§W\n\n正位置の意味：努力による成功、勝利、障害の克服、行動力、自立、挑戦、自己主張、若い男性、乗り物、旅行運は大吉。§!"
 tarot_the_chariot_down_name: "§Y戦車（逆位置）§W\n\n逆位置の意味：議論の敗北、紛糾、停滞、規則違反、暴力への訴え、頑固な男性、突然の失敗、不良少年、挫折と自己中心。§!"
 tarot_the_sun_name: "§Y太陽（正位置）§W\n\n正位置の意味：活気、豊かな生命力、生気に満ちる、精力旺盛、仕事が順調、助けてくれる人、幸福な結婚、健全な交際。§!"
 tarot_the_sun_down_name: "§Y太陽（逆位置）§W\n\n逆位置の意味：落ち込み、体調不良、持続性の欠如、意気消沈、生活の不安、人間関係の悪化、感情の揺れ、離婚。§!"
 tarot_death_name: "§Y死神（正位置）§W\n\n正位置の意味：失敗、破滅に近い状態、病気、失業、停滞状態の維持、継続的な損害、取引の停止、退屈な生活、別離、再出発、双方の深い溝、恋愛の終焉。§!"
 tarot_death_down_name: "§Y死神（逆位置）§W\n\n逆位置の意味：一縷の望み、起死回生、心変わり、停滞からの脱出、名誉挽回、健康回復、突然の計画変更、現実逃避、恋の断ち切り、昔の恋人との再会。§!"
 tarot_judgement_name: "§Y審判（正位置）§W\n\n正位置の意味：復活の喜び、回復、告白、良い知らせ、幸運、頭角を現す、よみがえる愛、再会、愛の奇跡。§!"
 tarot_judgement_down_name: "§Y審判（逆位置）§W\n\n逆位置の意味：一蹴不振、幻滅、隠し事、悪い知らせ、決断不能、目標の欠如、進展なし、解消、未練。§!"
 tarot_justice_name: "§Y正義（正位置）§W\n\n正位置の意味：公正、中立、誠実、胸襟を開く、表裏がない、兼務、合理化の追求、調停者、法律に関わる、公明正大な交際、感情の和睦。§!"
 tarot_justice_down_name: "§Y正義（逆位置）§W\n\n逆位置の意味：不均衡、偏見、紛擾、訴訟、独断専行、後ろめたさ、両立不能、表裏不一、男女の相性不合、感情の波乱、社会道徳を無視した恋。§!"
 tarot_strength_name: "§Y力（正位置）§W\n\n正位置の意味：大胆な行動、勇気ある決断、新展開、大きな転機、異動、意志の力で困難を乗り越える、逞しい女性。§!"
 tarot_strength_down_name: "§Y力（逆位置）§W\n\n逆位置の意味：小心、強者に負ける、誘惑に負ける、権威と常識に屈服、実行せずに放棄、虚栄、臆病、忍耐不足。§!"
 tarot_temperrance_name: "§Y節制（正位置）§W\n\n正位置の意味：単純、調整、平穏、互恵互利、好感が愛に変わる、純愛、深い愛。§!"
 tarot_temperrance_down_name: "§Y節制（逆位置）§W\n\n逆位置の意味：消耗、低下、疲労、損失、不安、不調和、恋愛の相性が良くない。§!"
 tarot_the_devil_name: "§Y悪魔（正位置）§W\n\n正位置の意味：束縛、堕落、病気、悪意、屈服、欲望の虜、抗えない誘惑、退廃的な生活、借金暮らし、人に言えない秘密、秘密の恋。§!"
 tarot_the_devil_down_name: "§Y悪魔（逆位置）§W\n\n逆位置の意味：束縛からの脱出、悩みの解消、病の治癒、過去との決別、一時停止、別離、誘惑の拒絶、私欲の放棄、別れの時、愛憎入り混じる恋。§!"
 tarot_the_emperor_name: "§Y皇帝（正位置）§W\n\n正位置の意味：栄光、権力、勝利、指導権を握る、強い意志、目標達成、父としての責任、精神的な孤独。§!"
 tarot_the_emperor_down_name: "§Y皇帝（逆位置）\n\n逆位置の意味：幼稚、無力、独裁、わがまま、平凡、自信なし、行動力不足、意志薄弱、支配される。§!"
 tarot_the_empress_name: "§Y女帝（正位置）§W\n\n正位置の意味：幸福、成功、収穫、無憂無慮、円満な家庭生活、良い環境、美貌、芸術、自然との触れ合い、楽しい旅行、休息。§!"
 tarot_the_empress_down_name: "§Y女帝（逆位置）§W\n\n逆位置の意味：活気がない、向上心の欠如、だらしない生活習慣、解決できない問題、成果が見えない、享楽に耽る、環境が険しい、家族との紛争。§!"
 tarot_the_fool_name: "§Y愚者（正位置）§W\n\n正位置の意味：自然な場所への憧憬、目的もなく前進、新しいことに挑戦するのが好き、各地を放浪。§!"
 tarot_the_fool_down_name: "§Y愚者（逆位置）§W\n\n逆位置の意味：冒険的な行動、可能性の追求、夢を重視、物質的損失を無視、家を離れる、他人を信じすぎる、旅行の計画に悩む、安心して旅ができない、決断できない、奇癖、非現実的。§!"
 tarot_the_hanged_man_name: "§Y吊るされた男（正位置）§W\n\n正位置の意味：試練を受ける、行動の制限、犠牲、艱難を恐れない、利益に動じない、失うものあれば得るものあり、教訓を得る、不死鳥の如く蘇る、広く学ぶ、献身的な愛。§!"
 tarot_the_hanged_man_down_name: "§Y吊るされた男（逆位置）§W\n\n逆位置の意味：無駄な犠牲、骨折、厄運、努力不足、劣勢、わがまま、利己主義者、忍耐不足、罰を受ける、恋愛からの逃避、実らない恋。§!"
 tarot_the_hermit_name: "§Y隠者（正位置）§W\n\n正位置の意味：隠された事実、個別の行動、他人の意見を聞く、孤独を楽しむ、自分自身の計画、有益な警戒、年長者、危険を避ける、祖父、田舎暮らし。§!"
 tarot_the_hermit_down_name: "§Y隠者（逆位置）§W\n\n逆位置の意味：警告を無視、孤独を憎む、劣等感、心配、幼稚な考え、過度の慎重による失敗、偏り、旅行は不宜。§!"
 tarot_the_hierophant_name: "§Y教皇（正位置）§W\n\n正位置の意味：援助、同情、寛大さ、信頼できる人からの助言、良い相談相手、精神的満足、規則を守る、ボランティア。§!"
 tarot_the_hierophant_down_name: "§Y教皇（逆位置）§W\n\n逆位置の意味：誤った情報、悪意ある勧告、騙される、援助が途絶える、願望が叶わない、利用される、見捨てられる。§!"
 tarot_the_high_priestess_name: "§Y女教皇（正位置）§W\n\n正位置の意味：内なる神秘的な潜在力の開発、前途に変化を予告するもの、深い思考、鋭い洞察力、正確な直感。§!"
 tarot_the_high_priestess_down_name: "§Y女教皇（逆位置）§W\n\n逆位置の意味：潔癖すぎる、無知、貪欲、目先が浅い、自尊心が高すぎる、偏った判断、蛮勇、自惚れ。§!"
 tarot_the_lovers_name: "§Y恋人（正位置）§W\n\n正位置の意味：取り持ち、愛情、流行、興味、希望に満ちた未来、魅力、友人の増加。§!"
 tarot_the_lovers_down_name: "§Y恋人（逆位置）§W\n\n逆位置の意味：誘惑に負ける、欲望に溺れる、気まぐれ、友情が薄れる、倦怠、喧嘩、派手な装い、優柔不断。§!"
 tarot_the_magician_name: "§Y魔術師（正位置）§W\n\n正位置の意味：物事の始まり、行動の変化、熟練した技術と技巧、我が意志の貫徹、自然の力を用いて野心を達成する。§!"
 tarot_the_magician_down_name: "§Y魔術師（逆位置）§W\n\n逆位置の意味：意志薄弱、着手が難しい、誤った方向へ進む、知識不足、騙されて失敗する。§!"
 tarot_the_moon_name: "§Y月（正位置）§W\n\n正位置の意味：不安、惑い、動揺、嘘、欺瞞、迷妄、揺れる愛、三角関係。§!"
 tarot_the_moon_down_name: "§Y月（逆位置）§W\n\n逆位置の意味：騙しの脱出、誤解の解消、状況の好転、危険の予知、待つこと、愛の亀裂と向き合う。§!"
 tarot_the_star_name: "§Y星（正位置）§W\n\n正位置の意味：前途は明るい、希望に満ちる、想像力、創造力、幻想、願いが叶う、水準の向上、理想の相手、素晴らしい恋。§!"
 tarot_the_star_down_name: "§Y星（逆位置）§W\n\n逆位置の意味：挫折、失望、高望み、夢物語、慌てふためく、思い通りにならない、仕事がうまくいかない、悲観的な状況、秘密の恋、愛のない生活。§!"
 tarot_the_tower_name: "§Y塔（正位置）§W\n\n正位置の意味：破産、逆境、解雇、急病、致命的な打撃、大きな変動、巻き添え、信念の崩壊、火遊びの自滅、紛擾が絶えない、突然の別れ、破滅した愛。§!"
 tarot_the_tower_down_name: "§Y塔（逆位置）§W\n\n逆位置の意味：苦境、内輪もめ、逼迫した状態、状況が良くない、安定に向かう、傲慢は代償を払う、背水の陣、別離の予感、恋愛の危機。§!"
 tarot_the_world_name: "§Y世界（正位置）§W\n\n正位置の意味：完成、成功、完璧無欠、連綿と続く、精神的高揚、生涯の目標を持つ、使命を果たす、幸運が訪れる、喜ばしい結末、模範カップル。§!"
 tarot_the_world_down_name: "§Y世界（逆位置）§W\n\n逆位置の意味：未完成、失敗、準備不足、盲目的受容、一時的な不調、中途半端、精神の退廃、飽和状態、共謀、態度が不融洽、感情の挫折。§!"
 tarot_wheel_of_fortune_name: "§Y運命の輪（正位置）§W\n\n正位置の意味：決定的な出来事、新たな機会、因縁の潮流、環境の変化、幸運の始まり、状況の好転、問題の解決、幸運の神が降り立つ。§!"
 tarot_wheel_of_fortune_down_name: "§Y運命の輪（逆位置）§W\n\n逆位置の意味：度重なる不運、挫折、計画の頓挫、障害、方向修正ができない、悪い方へ進む、悪循環、中断。§!"


 #塔罗牌描述
 tarot_the_chariot_name_desc: "§9このカードは、障害を乗り越えて勝利を掴む王者の戦車を描いている。勝者は力強い姿勢で戦車の上に立ち、この世での偉業を示している。戦車を牽く黒と白の二頭の獅子は、常に前進を続ける準備ができている。\n\nこのカードは強者の象徴であり、力と深く結びつき、忍耐によって成功を得ることを意味する。「決して諦めない」がこのカードのテーマである。前途にどれほど艱難があろうとも歩み続けなければならず、そうすることで自分と周囲の運命を掌握できるようになる。戦車の上の勝者は人間の魂を象徴し、二頭の獅子を操ることは人間の意志と本能を象徴し、時を超えて進んでいく。§!"
 tarot_the_chariot_down_name_desc: "§9このカードは、障害を乗り越えて勝利を掴む王者の戦車を描いている。勝者は力強い姿勢で戦車の上に立ち、この世での偉業を示している。戦車を牽く黒と白の二頭の獅子は、常に前進を続ける準備ができている。\n\nこのカードは強者の象徴であり、力と深く結びつき、忍耐によって成功を得ることを意味する。「決して諦めない」がこのカードのテーマである。前途にどれほど艱難があろうとも歩み続けなければならず、そうすることで自分と周囲の運命を掌握できるようになる。戦車の上の勝者は人間の魂を象徴し、二頭の獅子を操ることは人間の意志と本能を象徴し、時を超えて進んでいく。§!"
 tarot_the_sun_name_desc: "§9これは大アルカナの中でも最も吉兆なカードであり、知識と活力を象徴する。カードには子供が馬に乗り、太陽がもたらす生命力を称え、太陽から与えられるエネルギーを受け取っている。太陽の力はあまりに強く、万物に生命を与え、その光はあまりに暖かく、すべての生命が感動する。その力は完全に肯定的で、希望と理想に満ちており、いかなる闇もその光に耐えられない。\n\nこのカードを読む鍵は「生命力」にある。それは希望と理想の力であり、外的な干渉にも内的な対抗にも揺るがない。心の闇が邪魔しようとしても、太陽の光の下ではたちまち消え去る。だから些細な悩みに惑わされる必要はない。§!"
 tarot_the_sun_down_name_desc: "§9これは大アルカナの中でも最も吉兆なカードであり、知識と活力を象徴する。カードには子供が馬に乗り、太陽がもたらす生命力を称え、太陽から与えられるエネルギーを受け取っている。太陽の力はあまりに強く、万物に生命を与え、その光はあまりに暖かく、すべての生命が感動する。その力は完全に肯定的で、希望と理想に満ちており、いかなる闇もその光に耐えられない。\n\nこのカードを読む鍵は「生命力」にある。それは希望と理想の力であり、外的な干渉にも内的な対抗にも揺るがない。心の闇が邪魔しようとしても、太陽の光の下ではたちまち消え去る。だから些細な悩みに惑わされる必要はない。§!"
 tarot_death_name_desc: "§9これは大アルカナの中で最も誤解されやすいカードである。西洋の宗教思想では、十三という数字は常に死と結びつけられてきた——このカードの場合も同様だ。死神は白馬に乗り、鎧をまとい、抗いがたい力を示している。すでに倒れた者、この残酷な現実を受け入れる者、目をそらそうとする者、無駄な抵抗を続ける者がいる。\n\n古い暦では十三番目の月は死と再生の月である。だから牌面を文字通りに捉えず、積極的な意味で解釈すべきだ。目の前の事実を受け入れ、手にした利益の一部を手放せば、より厚い報いを得られるだろう。「窮地に立ってこそ生き残る」という言葉の通り、試練を経た成功はより偉大なものとなる。§!"
 tarot_death_down_name_desc: "§9これは大アルカナの中で最も誤解されやすいカードである。西洋の宗教思想では、十三という数字は常に死と結びつけられてきた——このカードの場合も同様だ。死神は白馬に乗り、鎧をまとい、抗いがたい力を示している。すでに倒れた者、この残酷な現実を受け入れる者、目をそらそうとする者、無駄な抵抗を続ける者がいる。\n\n古い暦では十三番目の月は死と再生の月である。だから牌面を文字通りに捉えず、積極的な意味で解釈すべきだ。目の前の事実を受け入れ、手にした利益の一部を手放せば、より厚い報いを得られるだろう。「窮地に立ってこそ生き残る」という言葉の通り、試練を経た成功はより偉大なものとなる。§!"
 tarot_judgement_name_desc: "§9カードには、天使がラッパを吹き鳴らし、その音楽を聞いた死者が救済される様子が描かれている。天使のラッパはすべての人の感情を呼び覚ますことができ、悔い改めた罪人にも天に至る希望がある。天使のラッパの音は、古い観念が死に、人々が音楽の呼びかけに応じて新しい世界を受け入れようとしていることを象徴する。このカードを読むときは、決断と回復に注意せよ。\n\nあなたもまた、過去の経験を総括し整理し、誤りを捨てて貴重な知識を残している。新しい世界の始まりに、あなたは孤独ではないと気づくだろう——多くの友人が共に学んでいる。顔見知りでなくても、聖堂の天使が互いに助け合わせてくれる。それによって人生はより楽しいものになる。§!"
 tarot_judgement_down_name_desc: "§9カードには、天使がラッパを吹き鳴らし、その音楽を聞いた死者が救済される様子が描かれている。天使のラッパはすべての人の感情を呼び覚ますことができ、悔い改めた罪人にも天に至る希望がある。天使のラッパの音は、古い観念が死に、人々が音楽の呼びかけに応じて新しい世界を受け入れようとしていることを象徴する。このカードを読むときは、決断と回復に注意せよ。\n\nあなたもまた、過去の経験を総括し整理し、誤りを捨てて貴重な知識を残している。新しい世界の始まりに、あなたは孤独ではないと気づくだろう——多くの友人が共に学んでいる。顔見知りでなくても、聖堂の天使が互いに助け合わせてくれる。それによって人生はより楽しいものになる。§!"
 tarot_justice_name_desc: "§9カードには、冷徹で公正な正義の女神が石の椅子に座し、右手に正義の剣、左手に善悪を見分ける天秤を掲げている姿が描かれている。この二つの聖器により、女神は物事の経緯と将来の発展を容易に見通し、眼前のすべてに泰然と向き合える。また世人に因果応報の理を知らしめ、寛容な心を持ち、道徳を守り、正義を貫くよう警告している。§!"
 tarot_justice_down_name_desc: "§9カードには、冷徹で公正な正義の女神が石の椅子に座し、右手に正義の剣、左手に善悪を見分ける天秤を掲げている姿が描かれている。この二つの聖器により、女神は物事の経緯と将来の発展を容易に見通し、眼前のすべてに泰然と向き合える。また世人に因果応報の理を知らしめ、寛容な心を持ち、道徳を守り、正義を貫くよう警告している。§!"
 tarot_strength_name_desc: "§9このカードでは、勝利の女神が身をかがめて猛々しい獅子を撫で、その優しさと愛で、腕の中の恐怖を象徴する獅子をなだめている。これは愛と強い意志の象徴である。愛と意志があるからこそ、人間は困難を乗り越え、歴史の長河を前進し続けられるのだ。獅子は人間の本能を表し、美女は愛情と服従を象徴する。両者が調和を保ち、互いに支え合ってこそ、世界を征服する力となり得る。またこのカードは、目前の困難な状況を解決する力があり、自身の内なる力に自信を持てることも意味する。\n\n読む際には「剛柔併せ持つ」ことに注意せよ。人間の本能は恐怖を感じるものであり、理性による制御となだめが必要だ。しかし本能の推進力を失ってもならず、理性は励ましも与えねばならない。ここから、タロットの解釈において「バランス」が最も重要であることが分かる。§!"
 tarot_strength_down_name_desc: "§9このカードでは、勝利の女神が身をかがめて猛々しい獅子を撫で、その優しさと愛で、腕の中の恐怖を象徴する獅子をなだめている。これは愛と強い意志の象徴である。愛と意志があるからこそ、人間は困難を乗り越え、歴史の長河を前進し続けられるのだ。獅子は人間の本能を表し、美女は愛情と服従を象徴する。両者が調和を保ち、互いに支え合ってこそ、世界を征服する力となり得る。またこのカードは、目前の困難な状況を解決する力があり、自身の内なる力に自信を持てることも意味する。\n\n読む際には「剛柔併せ持つ」ことに注意せよ。人間の本能は恐怖を感じるものであり、理性による制御となだめが必要だ。しかし本能の推進力を失ってもならず、理性は励ましも与えねばならない。ここから、タロットの解釈において「バランス」が最も重要であることが分かる。§!"
 tarot_temperrance_name_desc: "§9カードには、両手に聖杯を一つずつ持った天使が描かれている。二つの聖杯は「物質」と「精神」を表し、天使は聖杯の水を互いに注ぎ合い、二つの杯の水を平衡に保とうとしている。様々な誘惑に直面したとき、自分の欲望を制御することが最も重要だと戒めている。他のカードのような喜びや成功はなく、淡々とした美しさを感じさせる——平穏な生活こそ本当の幸福だからだ。\nまた、人の能力は習得した知識と、その知識への理解の両方から成り立つことを表している。何事も目的を持って行うべきであり、そうした経験を通じて人は成熟し、事業が発展する。§!"
 tarot_temperrance_down_name_desc: "§9カードには、両手に聖杯を一つずつ持った天使が描かれている。二つの聖杯は「物質」と「精神」を表し、天使は聖杯の水を互いに注ぎ合い、二つの杯の水を平衡に保とうとしている。様々な誘惑に直面したとき、自分の欲望を制御することが最も重要だと戒めている。他のカードのような喜びや成功はなく、淡々とした美しさを感じさせる——平穏な生活こそ本当の幸福だからだ。\nまた、人の能力は習得した知識と、その知識への理解の両方から成り立つことを表している。何事も目的を持って行うべきであり、そうした経験を通じて人は成熟し、事業が発展する。§!"
 tarot_the_devil_name_desc: "§9悪魔は鉄鎖に縛られた奴隷たちを見て、得意げな嘲笑を浮かべている。奴隷たちは鎖に繋がれているが、互いに助け合えば悪魔から逃れられる。しかし彼らは悪魔の誘惑に目を眩ませ、喜んでその命令に従っている。よく見ると、彼らは悪魔と同じ角と尾を生やしている。\n恐ろしい悪魔がこれほど美しい声を持っているのは、金銭と所謂「安全」で人々を奴隷に誘うからだ。彼の支配下で人々は互いに意思疎通する能力を失い、心を占めるのは赤裸々な原始欲求だけになる。金銭を追い求めるあまり人生の他の目標をすべて否定し、人々は利己的で貪欲になる。しかし命が終われば、これらの物質はもはや何の意味も持たない。\n悪魔は誤った観念を表す——物質的富を持てばすべてを持ったことになる、という観念だ。外的な干渉によって衝動が理性を支配し、精神的欲求は消え失せ、自分の行動に責任を持とうとしなくなる。すべての過ちを悪魔のせいにできるからだ。これは事業の成功と見ることもできる。なぜなら最終目標が金銭だからだ。§!"
 tarot_the_devil_down_name_desc: "§9悪魔は鉄鎖に縛られた奴隷たちを見て、得意げな嘲笑を浮かべている。奴隷たちは鎖に繋がれているが、互いに助け合えば悪魔から逃れられる。しかし彼らは悪魔の誘惑に目を眩ませ、喜んでその命令に従っている。よく見ると、彼らは悪魔と同じ角と尾を生やしている。\n恐ろしい悪魔がこれほど美しい声を持っているのは、金銭と所謂「安全」で人々を奴隷に誘うからだ。彼の支配下で人々は互いに意思疎通する能力を失い、心を占めるのは赤裸々な原始欲求だけになる。金銭を追い求めるあまり人生の他の目標をすべて否定し、人々は利己的で貪欲になる。しかし命が終われば、これらの物質はもはや何の意味も持たない。\n悪魔は誤った観念を表す——物質的富を持てばすべてを持ったことになる、という観念だ。外的な干渉によって衝動が理性を支配し、精神的欲求は消え失せ、自分の行動に責任を持とうとしなくなる。すべての過ちを悪魔のせいにできるからだ。これは事業の成功と見ることもできる。なぜなら最終目標が金銭だからだ。§!"
 tarot_the_emperor_name_desc: "§9玉座には至高の皇帝が座し、宝石を鏤めた王冠を戴き、権力と地位を象徴する笏を手にしている。経験豊かな彼の顔は厳しい。一国の君主でありながらもなお鎧を身にまとい、常に国家のために挑戦に立ち向かう準備をしている。\n彼は国全体を統治し、疑いを許さぬ威厳を持つ。人民の指導者であり、男性の威厳の象徴である。しかしその威厳ある外見の背後には親しみ深い心がある。彼は情熱的で、教えを乞う者に成功の秘訣を惜しみなく分かち合う。その秘訣とは、頭脳と、過去の奮闘で積み重ねた経験に依拠することだ。彼の助言もまた貴重な経験に基づいており、彼の誠実な人格と同じく信頼に値する。\nしかし国を支配できる皇帝は、果たして幸せなのだろうか。読む際にこの点を見落としてならない。多くの問い手が望むのは心の歓びだからだ——本人が気づいていなくても。威厳ある表向きの背後にどんな内面があるのか、それがしばしば鍵となる。\n一国の君主として、彼は父親の模範でもある。でなければ、どうして臣民を教化できようか。§!"
 tarot_the_emperor_down_name_desc: "§9玉座には至高の皇帝が座し、宝石を鏤めた王冠を戴き、権力と地位を象徴する笏を手にしている。経験豊かな彼の顔は厳しい。一国の君主でありながらもなお鎧を身にまとい、常に国家のために挑戦に立ち向かう準備をしている。\n彼は国全体を統治し、疑いを許さぬ威厳を持つ。人民の指導者であり、男性の威厳の象徴である。しかしその威厳ある外見の背後には親しみ深い心がある。彼は情熱的で、教えを乞う者に成功の秘訣を惜しみなく分かち合う。その秘訣とは、頭脳と、過去の奮闘で積み重ねた経験に依拠することだ。彼の助言もまた貴重な経験に基づいており、彼の誠実な人格と同じく信頼に値する。\nしかし国を支配できる皇帝は、果たして幸せなのだろうか。読む際にこの点を見落としてならない。多くの問い手が望むのは心の歓びだからだ——本人が気づいていなくても。威厳ある表向きの背後にどんな内面があるのか、それがしばしば鍵となる。\n一国の君主として、彼は父親の模範でもある。でなければ、どうして臣民を教化できようか。§!"
 tarot_the_empress_name_desc: "§9美しい女帝が優雅で居心地の良い椅子に座り、周囲は鬱蒼とした森で、無憂無慮で悠然とした気分にさせる。椅子のそばには心臓が一つ置かれており、彼女がこの豊かな土地と果実、円満な愛をあなたに授けようとしているかのようだ。心から感謝すべきだろう。§!"
 tarot_the_empress_down_name_desc: "§9美しい女帝が優雅で居心地の良い椅子に座り、周囲は鬱蒼とした森で、無憂無慮で悠然とした気分にさせる。椅子のそばには心臓が一つ置かれており、彼女がこの豊かな土地と果実、円満な愛をあなたに授けようとしているかのようだ。心から感謝すべきだろう。§!"
 tarot_the_fool_name_desc: "§9大アルカナの最初のカードは愚者である。「0」は無を表し、何も知らないかのようでありながら、他のどの位置よりも大きな潜在力を秘めているかのようでもある。このカードには特別な順序上の位置がなく、1から21の順序には含まれない、特殊な地位のカードだ。0であるのは、すべての始まりまたは終わりを意味するとも言える。後にトランプのジョーカー（大ジョーカー・小ジョーカー）の原型になったという説もある。\n①軽やかな足取りで、地上の障害物は彼を縛れない。華やかな服を着た青年が崖の縁を歩き、その目には理想が映っている。左手に薔薇を持ち、右手に全財産（荷物）を担いで、各地を放浪する。彼の表情は機知と夢に満ちている。そばの犬は、ひたすら前進せず立ち止まって考えろと彼に注意を促している。荷物を支える杖は意志の力を象徴し、小犬は危機の暗示である。\n②桂冠は勝利を表す。薔薇は新しいものを追い求める願望を表す。色とりどりの衣服は、簡単に手放せない世俗のものを表す。赤い羽根は純粋な心を表す。荷物は心の衝撃を表す。杖は愚者が力と活力に満ちて新たな旅に臨むことを表す。\n③頭に華麗な飾りをつけ、肩に杖を担ぎ、目に映るのは彼の理想郷。現実主義者は彼を尊大だと言い、理想主義者は彼に冒険の精神があると見る。§!"
 tarot_the_fool_down_name_desc: "§9大アルカナの最初のカードは愚者である。「0」は無を表し、何も知らないかのようでありながら、他のどの位置よりも大きな潜在力を秘めているかのようでもある。このカードには特別な順序上の位置がなく、1から21の順序には含まれない、特殊な地位のカードだ。0であるのは、すべての始まりまたは終わりを意味するとも言える。後にトランプのジョーカー（大ジョーカー・小ジョーカー）の原型になったという説もある。\n①軽やかな足取りで、地上の障害物は彼を縛れない。華やかな服を着た青年が崖の縁を歩き、その目には理想が映っている。左手に薔薇を持ち、右手に全財産（荷物）を担いで、各地を放浪する。彼の表情は機知と夢に満ちている。そばの犬は、ひたすら前進せず立ち止まって考えろと彼に注意を促している。荷物を支える杖は意志の力を象徴し、小犬は危機の暗示である。\n②桂冠は勝利を表す。薔薇は新しいものを追い求める願望を表す。色とりどりの衣服は、簡単に手放せない世俗のものを表す。赤い羽根は純粋な心を表す。荷物は心の衝撃を表す。杖は愚者が力と活力に満ちて新たな旅に臨むことを表す。\n③頭に華麗な飾りをつけ、肩に杖を担ぎ、目に映るのは彼の理想郷。現実主義者は彼を尊大だと言い、理想主義者は彼に冒険の精神があると見る。§!"
 tarot_the_hanged_man_name_desc: "§9このカードは自己犠牲を象徴する。両手を背後で縛られ、逆さに吊るされた勇士が描かれ、その頭上にはかすかな天使の光輪が現れている。周囲はこれをこの上なく苦しいと見るが、彼の顔は安らかだ。自分が誰かのために犠牲になっていると知っているからだ——たとえ肉体が滅んでも、精神は永遠に残る。\nこのカードは、どれほど悪い境遇も我々への試練に過ぎず、厄運は必ず過ぎ去ると教えている。伝説の鳳凰の涅槃のように、北欧神話のオーディンが絞首台に身を捧げて魔法・文字・呪文・詩を会得したように。眼前の厄運に耐え、運命の配剤を受け入れ、過去の損得を反省し、将来の再起のために力を蓄えることが最も重要だ。§!"
 tarot_the_hanged_man_down_name_desc: "§9このカードは自己犠牲を象徴する。両手を背後で縛られ、逆さに吊るされた勇士が描かれ、その頭上にはかすかな天使の光輪が現れている。周囲はこれをこの上なく苦しいと見るが、彼の顔は安らかだ。自分が誰かのために犠牲になっていると知っているからだ——たとえ肉体が滅んでも、精神は永遠に残る。\nこのカードは、どれほど悪い境遇も我々への試練に過ぎず、厄運は必ず過ぎ去ると教えている。伝説の鳳凰の涅槃のように、北欧神話のオーディンが絞首台に身を捧げて魔法・文字・呪文・詩を会得したように。眼前の厄運に耐え、運命の配剤を受け入れ、過去の損得を反省し、将来の再起のために力を蓄えることが最も重要だ。§!"
 tarot_the_hermit_name_desc: "§9隠者は長衣をまとい、灯りを手に、杖をつきながら、暗闇の中で孤独に道を探して進む。このカードは独居を表す。隠者は外的な誘惑を捨てて内面の平静に達しようとし、寂静の中で瞑想を通じて真理を得ようとする。静けさの中では自分自身の心の声だけが聞こえる。だからこそ自分の考えをよりよく理解し、真に自分自身のものとなる最終目標を見つけられるのだ。§!"
 tarot_the_hermit_down_name_desc: "§9隠者は長衣をまとい、灯りを手に、杖をつきながら、暗闇の中で孤独に道を探して進む。このカードは独居を表す。隠者は外的な誘惑を捨てて内面の平静に達しようとし、寂静の中で瞑想を通じて真理を得ようとする。静けさの中では自分自身の心の声だけが聞こえる。だからこそ自分の考えをよりよく理解し、真に自分自身のものとなる最終目標を見つけられるのだ。§!"
 tarot_the_hierophant_name_desc: "§9彼は宗教と精神信仰における至高の権威であり、常に我々の心の出口を見つけてくれる。彼の慈悲と徳は、必ずや我々を誤った道に導かず、良心を自覚し、今日の正しさと昨日の誤りを悟る道へと導いてくれる。特に心に負い目を感じるとき、彼は喜んであなたの懺悔を静かに聞いてくれるだろう。\nこれは良心と善良の目覚めを表すカードであり、宗教的信仰と伝統に関するカードでもある。皇帝が表す物質的な支配と比べ、彼はより精神的な次元に傾いている。彼は精神面の権威であり、未知の世界の解釈者である。教皇は神と直接通じ合えるため、慈悲と洞察力で世人の魂を救おうとし、自らの言葉で人々を正しい道へ導く。\nカードの中の教皇は両手を高く掲げて教義を世に説き、信徒たちは敬虔に地に跪いてその教えを聞く。しかし注意すべきは、彼が同時に伝統的な知識と保守的な道徳の代表であり、人々の思考を支配し、視野を狭くするということだ。古いものを徹底的に捨て、新しい解決法を模索して初めて、希望があり得る。§!"
 tarot_the_hierophant_down_name_desc: "§9彼は宗教と精神信仰における至高の権威であり、常に我々の心の出口を見つけてくれる。彼の慈悲と徳は、必ずや我々を誤った道に導かず、良心を自覚し、今日の正しさと昨日の誤りを悟る道へと導いてくれる。特に心に負い目を感じるとき、彼は喜んであなたの懺悔を静かに聞いてくれるだろう。\nこれは良心と善良の目覚めを表すカードであり、宗教的信仰と伝統に関するカードでもある。皇帝が表す物質的な支配と比べ、彼はより精神的な次元に傾いている。彼は精神面の権威であり、未知の世界の解釈者である。教皇は神と直接通じ合えるため、慈悲と洞察力で世人の魂を救おうとし、自らの言葉で人々を正しい道へ導く。\nカードの中の教皇は両手を高く掲げて教義を世に説き、信徒たちは敬虔に地に跪いてその教えを聞く。しかし注意すべきは、彼が同時に伝統的な知識と保守的な道徳の代表であり、人々の思考を支配し、視野を狭くするということだ。古いものを徹底的に捨て、新しい解決法を模索して初めて、希望があり得る。§!"
 tarot_the_high_priestess_name_desc: "§9聡明な人物または女性が、良い決断を下すかもしれない。この聖なる女教皇は端正に座し、手に一巻の書物を携えている。彼女が知恵に満ちている証であり、安心して彼女に決断を任せてよい。§!"
 tarot_the_high_priestess_down_name_desc: "§9聡明な人物または女性が、良い決断を下すかもしれない。この聖なる女教皇は端正に座し、手に一巻の書物を携えている。彼女が知恵に満ちている証であり、安心して彼女に決断を任せてよい。§!"
 tarot_the_lovers_name_desc: "§9これはタロットの中でも恋愛を解釈するのに最も適したカードであり、人生の青春時代を表す。カードには、天使の呼びかけで男女が結ばれ、恋人となる様子が描かれている。陽光が降り注ぎ幸福に満ちているが、恋人の背後には多くの試練が待ち構えている——希望の樹と、毒蛇が棲む禁断の果実の樹だ。\n恋愛中のカップルは互いに助け合い支え合うことができ、ロマンスがこの美しい時間のテーマとなる。しかし恋愛中の人は感情の選択に直面しなければならない——多くの異性の中から一人を伴侶として選ぶこと。だから愛は美しくもあり残酷でもある。読む際には「結合」の背後にある「選択」、すなわち取捨選択に必ず注意せよ。§!"
 tarot_the_lovers_down_name_desc: "§9これはタロットの中でも恋愛を解釈するのに最も適したカードであり、人生の青春時代を表す。カードには、天使の呼びかけで男女が結ばれ、恋人となる様子が描かれている。陽光が降り注ぎ幸福に満ちているが、恋人の背後には多くの試練が待ち構えている——希望の樹と、毒蛇が棲む禁断の果実の樹だ。\n恋愛中のカップルは互いに助け合い支え合うことができ、ロマンスがこの美しい時間のテーマとなる。しかし恋愛中の人は感情の選択に直面しなければならない——多くの異性の中から一人を伴侶として選ぶこと。だから愛は美しくもあり残酷でもある。読む際には「結合」の背後にある「選択」、すなわち取捨選択に必ず注意せよ。§!"
 tarot_the_magician_name_desc: "§9①カードに描かれているのはローマ神話の神々の伝令使メルクリウスで、自信に満ちた笑みと炯々たる眼差しを持つ。机の上には宇宙の四要素が並ぶ：杖（火）、剣（風）、星貨（土）、聖杯（水）。魔術師の頭上には無限の記号があり、帯は頭尾が繋がった蛇で、精神の永遠の象徴である。魔術師は右手で杖を空に向け、左手で地面を指す。これは権力の交流と精神の贈与を表す。魔術師の足元には薔薇と百合があり、人間の動機を表し、神の意志を映して天地を指揮する。薔薇は生を表し、百合は死を表す。魔術師は最初のカードであり、あなた自身も魔術師であり、宇宙の力を操れることを暗示する。\n②白い長衣は純粋な心を表し、深紅のマントは魔術師の活動の意義の深遠さを表す。§!"
 tarot_the_magician_down_name_desc: "§9①カードに描かれているのはローマ神話の神々の伝令使メルクリウスで、自信に満ちた笑みと炯々たる眼差しを持つ。机の上には宇宙の四要素が並ぶ：杖（火）、剣（風）、星貨（土）、聖杯（水）。魔術師の頭上には無限の記号があり、帯は頭尾が繋がった蛇で、精神の永遠の象徴である。魔術師は右手で杖を空に向け、左手で地面を指す。これは権力の交流と精神の贈与を表す。魔術師の足元には薔薇と百合があり、人間の動機を表し、神の意志を映して天地を指揮する。薔薇は生を表し、百合は死を表す。魔術師は最初のカードであり、あなた自身も魔術師であり、宇宙の力を操れることを暗示する。\n②白い長衣は純粋な心を表し、深紅のマントは魔術師の活動の意義の深遠さを表す。§!"
 tarot_the_moon_name_desc: "§9これは惑い、困窮、不安を表すカードである。月光の下、ザリガニが水から這い出て月の女神のもとへ向かう。彼は遠くの二つの高塔のうち正しい方を選ばねばならない。その塔こそ月の女神に謁見する唯一の道だからだ。岸の狼と猟犬は同じく月の女神に引き寄せられ、至近のザリガニにまだ気づいていない。犬はザリガニの旧世界への依存を表し、狼はザリガニの恐怖を表す。\n月は精神世界への橋であり、月の盈虧は変化を象徴する。満月が現れると、人々はそれがすぐ欠け始めると知り、不安が湧き上がる。月が大きいほど小さくなるのが近いことを意味し、幸福なときに不幸の到来を心配し、少しの油断も許されない気分にさせる。\n月はまた女性と感情の象徴であり、事業においては芸術的・創造的な事業を指し、欺瞞も暗示する。このカードを読む鍵は「惑い」にある。§!"
 tarot_the_moon_down_name_desc: "§9これは惑い、困窮、不安を表すカードである。月光の下、ザリガニが水から這い出て月の女神のもとへ向かう。彼は遠くの二つの高塔のうち正しい方を選ばねばならない。その塔こそ月の女神に謁見する唯一の道だからだ。岸の狼と猟犬は同じく月の女神に引き寄せられ、至近のザリガニにまだ気づいていない。犬はザリガニの旧世界への依存を表し、狼はザリガニの恐怖を表す。\n月は精神世界への橋であり、月の盈虧は変化を象徴する。満月が現れると、人々はそれがすぐ欠け始めると知り、不安が湧き上がる。月が大きいほど小さくなるのが近いことを意味し、幸福なときに不幸の到来を心配し、少しの油断も許されない気分にさせる。\n月はまた女性と感情の象徴であり、事業においては芸術的・創造的な事業を指し、欺瞞も暗示する。このカードを読む鍵は「惑い」にある。§!"
 tarot_the_star_name_desc: "§9これは奥底に希望を秘めたカードである。希望の星——シリウスの光の下、希望の女神は聖水瓶の聖水を、潜在意識を象徴する池に注ぐ。人々がどれほど希望を必要としているか知っているから、一瓶の聖水を注ぎ終えると、また別の瓶を注ぐ。希望があってこそ人は多くのことを成し遂げる十分な原動力を得られる。つまり希望こそ人間の活力の源である。\nすべての愛を捧げよう。夜であっても満天の星が我々に道を示し、星明かりに導かれて明るい未来へ歩んでいく。星の意味にはもう一つ、見落とされがちな点がある。それは「妊娠」である。§!"
 tarot_the_star_down_name_desc: "§9これは奥底に希望を秘めたカードである。希望の星——シリウスの光の下、希望の女神は聖水瓶の聖水を、潜在意識を象徴する池に注ぐ。人々がどれほど希望を必要としているか知っているから、一瓶の聖水を注ぎ終えると、また別の瓶を注ぐ。希望があってこそ人は多くのことを成し遂げる十分な原動力を得られる。つまり希望こそ人間の活力の源である。\nすべての愛を捧げよう。夜であっても満天の星が我々に道を示し、星明かりに導かれて明るい未来へ歩んでいく。星の意味にはもう一つ、見落とされがちな点がある。それは「妊娠」である。§!"
 tarot_the_tower_name_desc: "§9これは正逆どちらの位置でも良い意味を持たない、唯一の大アルカナである。雲を衝く高塔が稲妻に撃ち砕かれ、二人の人間が崩れ落ちる塔から地上へ落ちていく。突然かつ予測不能な激変は受け入れがたく、どれほど傲慢な人間でも自然の強さには及ばない。自然に挑めば神の怒りを招くだけだ。\nこの大きな変化に適応できなくても、それはあなたに成長を教えている。受け入れてみよう——それによって今後はより軽やかに歩めるようになる。敵の強さを受け入れるのは確かに困難だが、現実的に向き合い、理性的に解決することも大きな進歩である。§!"
 tarot_the_tower_down_name_desc: "§9これは正逆どちらの位置でも良い意味を持たない、唯一の大アルカナである。雲を衝く高塔が稲妻に撃ち砕かれ、二人の人間が崩れ落ちる塔から地上へ落ちていく。突然かつ予測不能な激変は受け入れがたく、どれほど傲慢な人間でも自然の強さには及ばない。自然に挑めば神の怒りを招くだけだ。\nこの大きな変化に適応できなくても、それはあなたに成長を教えている。受け入れてみよう——それによって今後はより軽やかに歩めるようになる。敵の強さを受け入れるのは確かに困難だが、現実的に向き合い、理性的に解決することも大きな進歩である。§!"
 tarot_the_world_name_desc: "§9これは永遠かつ持続的な成功を象徴するカードである。あなたはすでに成功の門の前に到達した。成功の女神は辛抱強く待つよう求める——彼女はあなたを成功の門へ入れてくれる。ただ時間の問題だ。成功の門の周りには、あなたが経験してきた幸福と哀しみ、成功と失敗がある。楽土に到達する前に、過ぎ去った時を顧みることは非常に有意義だ。このカードは、感謝の心を持ち続ければ、自分で築いた美しい世界の中で必ず幸福と喜びを見つけられると示唆している。\nこのカードの本来の意味は「達成」である。すべてのことは達成でき、すべての夢は現実になり得る。得られないものはない。耕せば、それ相応の収穫がある。§!"
 tarot_the_world_down_name_desc: "§9これは永遠かつ持続的な成功を象徴するカードである。あなたはすでに成功の門の前に到達した。成功の女神は辛抱強く待つよう求める——彼女はあなたを成功の門へ入れてくれる。ただ時間の問題だ。成功の門の周りには、あなたが経験してきた幸福と哀しみ、成功と失敗がある。楽土に到達する前に、過ぎ去った時を顧みることは非常に有意義だ。このカードは、感謝の心を持ち続ければ、自分で築いた美しい世界の中で必ず幸福と喜びを見つけられると示唆している。\nこのカードの本来の意味は「達成」である。すべてのことは達成でき、すべての夢は現実になり得る。得られないものはない。耕せば、それ相応の収穫がある。§!"
 tarot_wheel_of_fortune_name_desc: "§9カードには、運命の輪の上に天使を象徴するスフィンクス、下に悪魔、周囲に運命の様々な境遇を象徴する女神、白鳥、毒蛇などが描かれている。あなたの運命は、タロットの中で絶えず回転する運命の輪のようなもの。良くなったり悪くなったりする。これは公平な循環である。運命の輪はあなたの好きな角度で止まるかもしれない。それは不思議な幸運をもたらす。逆に、嫌な角度で止まれば、不運に見舞われる。望むと望まざるとにかかわらず、運命はこれほど無情であり、人生そのものが絶え間ない変化の中にある。だからこそ、あなたの人生は挑戦と刺激に満ちているのだ。§!"
 tarot_wheel_of_fortune_down_name_desc: "§9カードには、運命の輪の上に天使を象徴するスフィンクス、下に悪魔、周囲に運命の様々な境遇を象徴する女神、白鳥、毒蛇などが描かれている。あなたの運命は、タロットの中で絶えず回転する運命の輪のようなもの。良くなったり悪くなったりする。これは公平な循環である。運命の輪はあなたの好きな角度で止まるかもしれない。それは不思議な幸運をもたらす。逆に、嫌な角度で止まれば、不運に見舞われる。望むと望まざるとにかかわらず、運命はこれほど無情であり、人生そのものが絶え間ない変化の中にある。だからこそ、あなたの人生は挑戦と刺激に満ちているのだ。§!"
