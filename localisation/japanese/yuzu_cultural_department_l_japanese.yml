#开始决议
 yuzu_cultural_department_category: "Y.U.Z.U.S.O.F.T."
 yuzu_cultural_department_category_desc: " "
 yuzu_cultural_department_category_gui_desc: "§CYouth United Zone for Universal Synergy of Original Folklore & Traditions§!、\nすなわち世界青年ゆず文化革新共同体は、元気な若者たちが集まり、ゆずソフトの素晴らしさを新たな形で楽しむための組織である！\n我々の先進文化は、§R従属国§!を柚子厨で満ちた§C柚子厨の国§!へと変えられる。ゆず文化を広めるための出費を抑えるべく、クラウドドライブから「ゆずソフト四大名作」をダウンロードできる。ただし某クラウドの速度では少々時間がかかり、§Rゆずクラウド・スーパー会員なら大幅に短縮できる§!。\nまた、ゆず文化の普及にはゆず金が必要だ。現在の残高は[?Yuzu_fund|.0+Y]ゆず金である。\nさらに文化局は、植民地に適切な占領法を適用できる。職員にゆず金さえ支払えば、あとは自動で処理してくれる。"
 form_yuzu_fans_land: "[FROM.GetName]でゆずソフト作品を無料配布"
 form_yuzu_fans_land_desc: "言っていることは正しい。だが、『千恋＊万花』はゆずソフトが発売した美少女アドベンチャーゲームだ。舞台は「穂織」と呼ばれる桃源郷。石中の刀に選ばれし者はムラサメ丸を授かり、古の神の力を導くという。君は里帰りした「有地将臣」となり、町で個性も能力も異なる少女たちと出会い、共に祟り神を倒して散らばった水晶の欠片を取り戻す——そして「朝武家の呪い」に隠された真相を徐々に解き明かしていく。"
 yuzu_fans_land_ide: "最高品質の柚子厨"
 yuzu_fans_land_ide_desc: "長年ゆずソフト作品を遊び続けた者は、目が爛々と輝き、自信に満ち、知能も年々上昇し、最後には完全な天才となる。ゆずソフト作品は身体構造を改造し、あらゆる不治の病を予防する。ゆずソフト作品を遊び始めた時点で、その者の知恵も品性も容姿もすべて一級品であり、生涯どこへ行っても颯爽と振る舞えることが証明される。柚子厨は非常に強い社会正義感を備え、治安と安定に大きく貢献し、一般市民の命を守る。"
 autonomy_yuzu_fans_land: "柚子厨の国"
 #autonomy_yuzu_fans_land_desc: ""
 unite_yuzu_fans_together: "[FROM.GetName]の人民に最高品質の柚子厨となるよう呼びかける"
 unite_yuzu_fans_together_desc: "我らの偉大な国家は、国を挙げて喜びを分かち合う！ゆずソフトへの共通の愛が、我々をさらに固く団結させる！諸外国の友人たちよ、栄光あるゆずソフト作品のプレイをもって応えよ！"
 show_yuzu_culture_department: "ゆず文化局を表示"
 hide_yuzu_culture_department: "ゆず文化局を非表示（中核団決議から再表示可能）"
 hide_yuzu_culture_department_desc: "中核団から再表示できる"
