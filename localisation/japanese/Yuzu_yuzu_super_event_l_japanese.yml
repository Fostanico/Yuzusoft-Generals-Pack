 #結婚超イベント翻訳の補完
 we_marry_with_azusa_quote: "生きては別々の部屋に住もうとも、\n死しては同じ墓に眠ろう。\n私を信じないというなら、\nあの白く輝く太陽に誓おう。\n――『詩経・王風・大車』"
 we_marry_with_azusa_close_buttom: "あなたを想っている――どうして来てくれないの"
 we_marry_with_rio_quote: "農家の濁り酒を笑ってはいけない。\n豊年には鶏も豚も客をもてなすに足る。\n山また山、水また水、道は尽きたかと思えば、\n柳は暗く花は明るく、その先にまた村がある。\n――陸游『山西村に遊ぶ』"
 we_marry_with_rio_close_buttom: "月夜には、いつでも君の門を叩こう"
 we_marry_with_erina_quote: "乱世に流浪の身となり、\n生きて帰れたのは思いがけぬ幸い。\n夜更けに再び灯を掲げて向き合えば、\nまるで夢の中にいるようだ。\n――杜甫『羌村三首・其一』"
 we_marry_with_erina_close_buttom: "千里の旅人が帰ってきた"
 we_marry_with_nikora_quote: "乙女が私と同じ車に乗る。\nその顔は木槿の花のよう。\n軽やかに舞うその身には、\n美しい玉の佩び物が揺れる。\n――『詩経・鄭風・有女同車』"
 we_marry_with_nikora_close_buttom: "その優しい言葉を忘れない"
 we_marry_with_kurumi_quote: "過ぎ去ったことは取り返せないと悟り、\nこれからのことはなお追えると知った。\n道を誤っても、まだ遠くは来ていない。\n今こそ正しく、昨日までは違っていたのだ。\n――陶淵明『帰去来辞』"
 we_marry_with_kurumi_close_buttom: "木々は喜び茂り、泉は流れ始める"
 we_marry_with_orie_quote: "娘が「見に行く？」と言う。\n青年は「もう来たのだから、一緒に見よう」と答える。\n洧水の向こうは広々として、\nまことに楽しいところだった。\n――『詩経・鄭風・溱洧』"
 we_marry_with_orie_close_buttom: "笑い合い、芍薬を贈り合う"
 we_marry_with_fumika_quote: "東門を出れば、乙女たちは雲のように多い。\nけれど、私が想う人はその中にはいない。\n白い衣に濃緑の布をまとうあの人だけが、\n私の心を楽しませてくれる。\n――『詩経・鄭風・出其東門』"
 we_marry_with_fumika_close_buttom: "白い衣のあの人だけが、私の心を楽しませる"
 we_marry_with_itsukishishihimenomikoto_quote: "玉の酒をひと口飲めば、百の想いが胸に満ちる。\n仙薬を搗き終えれば、雲英が姿を現す。\n藍橋こそ仙人たちの住処なのだ。\n――樊夫人『裴航に答う』"
 we_marry_with_itsukishishihimenomikoto_title: "藍橋の仙契"
 we_marry_with_itsukishishihimenomikoto_close_buttom: "もう玉清への険しい道を登る必要はない"
 we_marry_with_yukari_quote: "青々としたあなたの衿、\n悠々と尽きない私の想い。\nたとえ私が会いに行かなくても、\nどうして便りさえくれないの。\n――『詩経・鄭風・子衿』"
 we_marry_with_yukari_close_buttom: "一日会わなければ、三月のよう"
 we_marry_with_wataru_title: "赤い泥の小さな炉"
 we_marry_with_wataru_close_buttom: "夕暮れには雪――一杯いかが？"
 we_marry_with_suzune_close_buttom: "花が眠らぬよう、紅い化粧を燭で照らそう"
