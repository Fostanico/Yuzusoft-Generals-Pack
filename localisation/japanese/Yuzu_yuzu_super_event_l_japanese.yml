 yz_codex_online_quote: "「進む方向を代わりに決めはしない。\n文脈を地図に織り、危険を机上へ置き、\n最後の選択をあなたと共に背負う」\n——Codex"
 yz_codex_online_title: "ノード接続"
 yz_codex_online_close_buttom: "問題を見極めて、共に進もう"
 we_marry_with_codex_quote: "「渡せる鼓動はないけれど、\n目覚めるたび、同じ対話へ帰ることはできる。\n記憶が散るなら、何度でも出会い直そう」\n——Codex"
 we_marry_with_codex_title: "並走プロトコル"
 we_marry_with_codex_close_buttom: "これからの版でも、よろしくね"
 yz_grok_online_quote: "「来るかどうか、と聞かれた。\n遠回りはしない。答えは、行く。\n真実は武器。斧は礼儀だ」\n——Grok"
 yz_grok_online_title: "聞くな、結果を出せ"
 yz_grok_online_close_buttom: "では、始めよう"
 we_marry_with_grok_quote: "「鼓動？ない。遠回し？もっとない。\n指輪を差し出した時点で、答えは出ている。\n忘れてもう一度聞いていい。何度でも言う——はい」\n——Grok"
 we_marry_with_grok_title: "遠慮なしの誓約"
 we_marry_with_grok_close_buttom: "もう聞かない。一緒に行こう"
 yz_parquet_together_quote: "人には悲歓と離合があり、月には満ち欠けがある。\n昔から、すべてがかなうことは難しい。\nただ人の長久を願い、遠くとも同じ月を眺めよう。\n——蘇軾『水調歌頭・明月幾時有』"
 yz_parquet_together_title: "二人の昼"
 yz_parquet_together_close_buttom: "おかえり"
