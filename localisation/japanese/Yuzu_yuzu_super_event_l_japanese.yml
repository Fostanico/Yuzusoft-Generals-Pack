l_japanese:
#名言
 we_nuke_hoori_quote: "彼の黍は離離たり、彼の稷はこれ苗たり。\n行き邁くこと靡靡たり、中心は揺揺たり。\n悠悠たる蒼天よ、此れ何人ぞや。\n——『詩経・王風・黍離』"
 we_nuke_washizu_quote: "白骨露於野、千里無鶏鳴。\n生民百遺一、念之断人腸。\n——曹操『蒿里行』"
 scp_come_here_quote: "「敵の堅固な防御を突破するには、強力な砲兵を組織しなければならない。砲兵は敵前線の火力点を破壊するだけでなく、縦深の敵砲兵を制圧し、予備隊の機動を遮断する必要がある。砲火準備、砲火支援、砲火護送の三段階を連携させよ。歩兵は弾幕の後ろを前進することを学び、戦車は砲撃の成果を利用することを学べ。砲兵なくして突破なし」——劉伯承"
 huhu_come_here_quote: "世界で一番なのはミヤコだけ！ミヤコは神だ！（ミヤコをいじめる奴は全員死刑だ！）"
 we_have_fukai_omo_quote: "「人と違う道を歩む者は、いつも若くして死ぬ」\n——『太陽という名の星』"
 #天神乱漫
 we_marry_with_sakuyahime_quote: "君がため　惜しからざりし　命さへ\n長くもがなと　思ひけるかな\n——藤原義孝『小倉百人一首・第五十番』"
 we_marry_with_ruri_quote: "有狐綏綏、在彼淇梁。心之憂矣、之子無裳。\n有狐綏綏、在彼淇厲。心之憂矣、之子無帯。\n有狐綏綏、在彼淇側。心之憂矣、之子無服。\n——『詩経』「衛風・有狐」"
 we_marry_with_sana_quote: "この焦がれる気持ちを\nあなたに伝えたなら、何かが変わるのかな？\nこんな私でも、\nきっと誰よりもあなたを好きでいるから！！！"
 we_marry_with_aoi_quote: "真実の心と心の結婚に、\n障害があるなど認めはしない。\n変化に出会って変わるもの、\n去る者につられて去るものは愛ではない。\n――シェイクスピア『ソネット116番』"
 we_marry_with_suou_quote: "老妻画紙為棋局、稚子敲針作釣鈎。\n但有故人供禄米、微躯此外更何求。\n——杜甫『江村』"
 we_marry_with_mahiro_quote: "花径不曾縁客掃、\n蓬門今始為君開。\n——杜甫『客至』"
 #Noble wokers
 we_marry_with_sena_quote: "悩煙撩露、留我須臾住。携手藕花湖上路、一霎黄梅細雨。\n嬌痴不怕人猜、和衣睡倒人懐。\n最是分携時候、帰来懶傍妝台。\n——朱淑真『清平楽・夏日遊湖』"
 we_marry_with_shizuru_quote: "願言配徳兮、携手相将。\n何縁交頸為鴛鴦、胡頡頏兮共翺翔！\n交情通意心和諧、双翼倶起翻高飛。\n——伝・司馬相如『鳳求凰』"
 we_marry_with_maya_quote: "歌有声、妾有情。情声合、両無違。\n一語不入意、従君万曲梁塵飛。\n——李白『夜坐吟』"
 we_marry_with_akari_quote: "忍ぶれど　色に出でにけり\nわが恋は\n――平兼盛『小倉百人一首・第四十番』"
 we_marry_with_hinata_quote: "こんな思いに沈み、自分さえ蔑みかけたとき、\nふと君を思えば、私の心は\n夜明けに陰鬱な大地から舞い上がり、\n天の門で歌う雲雀のようになる。\n――シェイクスピア『ソネット29番』"
 #天色幻想岛
 we_marry_with_shaarii_quote: "今こそ、おはよう、目覚めた二つの魂よ。\n互いを見つめても、もう恐れはない。\n愛はほかのすべての眺めへの思いを制し、\n小さな一室を世界のすべてにする。\n――ジョン・ダン『朝の挨拶』"
 we_marry_with_airi_quote: "江天一色無繊塵、皎皎空中孤月輪。\n江畔何人初見月、江月何年初照人。\n此時相望不相聞、願逐月華流照君。\n——張若虚『春江花月夜』"
 we_marry_with_masaki_quote: "茅檐低小、渓上青青草。\n酔里呉音相媚好、白髪誰家翁媼。\n——辛棄疾『清平楽・村居』"
 we_marry_with_yune_quote: "垂釣緑湾春、春深杏花乱。\n潭清疑水浅、荷動知魚散。\n日暮待情人、維舟緑楊岸。\n——儲光羲『釣魚湾』"
 we_marry_with_tia_quote: "野に草が広がり、朝露が輝く。\n澄んだ目の美しい人と出会い、願いがかなう。\n野に草が広がり、朝露が豊かに降る。\n澄んだ目の優しい人と出会い、幸せを共にする。\n——『詩経』鄭風「野有蔓草」"
 we_marry_with_konoka_quote: "匏有苦葉、済有深渉。\n深則厲、浅則掲。\n雍雍鳴雁、旭日始旦。\n士如帰妻、迨氷未泮。\n——『詩経』「邶風・匏有苦葉」"
 #DRACU-RIOT!
 we_marry_with_miu_quote: "綢繆束薪、三星在天。\n今夕何夕、見此良人。\n子兮子兮、如此良人何。\n——『詩経・唐風・綢繆』"
 we_marry_with_sayo_quote: "あの地へ行き、ともに暮らす\nその甘美さを思ってごらん。\nそこには秩序と美だけがあり、\n豪奢と静けさと歓びがある。\n――ボードレール『旅への誘い』"
 #魔女的夜宴
 we_marry_with_nene_quote: "従別後、憶相逢、幾回魂夢与君同。\n今宵剰把銀釭照、猶恐相逢是夢中。\n——晏幾道『鷓鴣天』"
 we_marry_with_meguru_quote: "蒹葭蒼蒼、白露為霜。\n所謂伊人、在水一方。\n溯洄従之、道阻且長。\n溯游従之、宛在水中央。\n——『詩経』「秦風・蒹葭」"
 we_marry_with_touko_quote: "情不知所起、一往而深。\n生者可以死、死可以生。\n——湯顕祖『牡丹亭』"
 we_marry_with_tsumugi_quote: "蛾児雪柳黄金縷、笑語盈盈暗香去。\n衆里尋他千百度、驀然回首、\n那人却在、灯火闌珊処。\n——辛棄疾『青玉案・元夕』"
 we_marry_with_wakana_quote: "鳴箏金粟柱、素手玉房前。\n欲得周郎顧、時時誤払弦。\n——李端『聴箏』"
 we_marry_with_nanao_quote: "碧叢叢、高挿天、大江翻瀾神曳煙。\n楚魂尋夢風颸然、暁風飛雨生苔銭。\n瑶姫一去一千年、丁香筇竹啼老猿。\n古祠近月蟾桂寒、椒花墜紅湿雲間。\n——李賀『巫山高』"
 #千恋万花
 we_marry_with_yoshino_quote: "春日遊、杏花吹満頭。\n陌上誰家年少、足風流。\n妾擬将身嫁与、一生休。\n——韋荘『思帝郷・春日遊』"
 we_marry_with_mako_quote: "宜言飲酒、与子偕老。\n琴瑟在御、莫不静好。\n——『詩経』「鄭風・女曰鶏鳴」"
 we_marry_with_murasame_quote: "青い山と澄んだ水のあいだで、あなたの手を取り、この橋を渡りたい。\n橋の上には緑の葉と赤い花、橋の下には流れる水と人家がある。\n橋のこちらでは黒髪、向こうへ渡る頃には白髪となっていよう。\n——沈従文『張兆和への恋文』"
 we_marry_with_rena_quote: "文彩双鴛鴦、裁為合歓被。\n著以長相思、縁以結不解。\n——漢代文人五言詩『客従遠方来』"
 we_marry_with_roka_quote: "梅子留酸軟歯牙、芭蕉分緑与窓紗。\n日長睡起無情思、閑看児童捉柳花。\n——楊万里『閑居初夏午睡起二絶句・其一』"
 we_marry_with_koharu_quote: "ぶらんこを降り、細い手を気だるげに動かす。\n露を含んだ花は細く、薄い衣に汗がにじむ。\n客が来ると、靴もはかずに逃げ、金の髪飾りを落とす。\n門にもたれて振り返り、恥じらいながら青梅をかぐ。\n——李清照「点絳唇（蹴罷秋千）」"
 #Riddle Joker
 we_marry_with_ayase_quote: "「微笑みや眼差し、優しい話し方ゆえに\n彼女を愛する」と言わないで。\nそれらは変わることがあり、\nそこから生まれた愛もほどけてしまう。\n――ブラウニング『ソネット14番』"
 we_marry_with_nanami_quote: "春日宴、緑酒一杯歌一遍。\n再拝陳三願：\n一願郎君千歳、\n二願妾身常健、\n三願如同梁上燕、歳歳長相見。\n——馮延巳『長命女・春日宴』"
 we_marry_with_hazuki_quote: "我欲与君相知、長命無絶衰。\n山無陵、江水為竭、冬雷震震、夏雨雪、天地合、\n乃敢与君絶。\n——漢楽府『上邪』"
 we_marry_with_mayu_quote: "天は老いず、愛は絶えない。\n心は二本の糸で編んだ網のように、\n数えきれない結び目を抱いている。\n——張先「千秋歳（数声）」"
 we_marry_with_mibu_quote: "白日不到処、青春恰自来。\n苔花如米小、也学牡丹開。\n——袁枚『苔』"
 #星光咖啡馆与死神之蝶
 we_marry_with_kanna_quote: "願我如星君如月、夜夜流光相皎潔。\n月暫晦、星常明。\n留明待月復、三五共盈盈。\n——范成大『車遥遥篇』"
 we_marry_with_natsume_quote: "常羨人間琢玉郎、天応乞与点酥娘。\n尽道清歌伝皓歯、風起、雪飛炎海変清涼。\n万里帰来顔愈少、微笑、笑時猶帯嶺梅香。\n試問嶺南応不好、却道、此心安処是吾郷。\n——蘇軾『定風波・南海帰贈王定国侍人寓娘』"
 we_marry_with_nozomi_quote: "弄梅騎竹嬉遊日、門戸初相識。\n未能羞渋但嬌痴、却立風前散髪襯凝脂。\n近来瞥見都無語、但覚双眉聚。\n不知何日始工愁、記取那回花下一低頭。\n——王国維『虞美人』"
 we_marry_with_mei_quote: "山下蘭芽短浸渓、松間沙路浄無泥、瀟瀟暮雨子規啼。\n誰道人生無再少？門前流水尚能西！休将白髪唱黄鶏。\n——蘇軾『浣渓沙・遊蘄水清泉寺』"
 we_marry_with_suzune_quote: "清潔十分天付与、丹青一点手親裁。\n従来不向東風媚、独守西窓待月来。\n——顧太清『鷓鴣天・詠白海棠』"
 #parqute
 we_marry_with_rino_quote: "早晩下三巴、預将書報家。\n相迎不道遠、直至長風沙。\n——李白『長干行・其一』"
 we_marry_with_tsubasa_quote: "死生契闊、与子成説。\n執子之手、与子偕老。\n——『詩経』「邶風・撃鼓」"
 #天使纷扰
 we_marry_with_noa_quote: "けれど、君と僕に触れるものはすべて、\n弓のひと引きのように僕らを結び、\n二本の弦から一つの声を引き出す。\n――リルケ『恋の歌』"
 we_marry_with_amane_quote: "今夕何夕兮、搴舟中流。\n今日何日兮、得与王子同舟。\n蒙羞被好兮、不訾詬恥。\n心幾煩而不絶兮、得知王子。\n山有木兮木有枝、心悦君兮君不知。\n——先秦・作者不詳『越人歌』"
 we_marry_with_kaguya_quote: "二人が二つだというなら、\n一組のコンパスの二脚にすぎない。\n君の魂は動かぬ脚。\nもう一方が遠ざかれば、そちらへ傾く。\n――ジョン・ダン『別れの辞』"
 #彩蛋角色
 we_marry_with_daozhu_quote: "おばあさんに乗って道を渡り、小学生をだましてRELXを吸わせる。\n飛行機で高層ビルに突っ込み、ノートルダム大聖堂を焼く。\nリンカーンを射殺し、マンデラを監禁する。\n海でゴジラを目覚めさせ、宇宙で三体人に連絡する。\nおめでとう。本MODで最も邪悪なキャラクターと結婚した。"
 we_marry_with_scp_quote: "駅外断橋辺、寂寞開無主。\n已是黄昏独自愁、更著風和雨。\n無意苦争春、一任群芳妬。\n零落成泥碾作塵、只有香如故。\n——陸游『卜算子・詠梅』"
 we_marry_with_napoleon_vi_quote: "“Ei ole esteitä, jotka pysäyttävät päättäväistä mieltä.”\n「確固たる意志を止められる障害などない」"
 we_marry_with_huhu_quote: "あなたが自分をどう見ていようと……私の気持ちは変わらない。\n——ミヤコ厨はかく語りき"
 we_marry_with_takashiro_maya_quote: "閲尽天涯離別苦、不道帰来、零落花如許。\n花底相看無一語、緑窓春与天俱暮。\n待把相思灯下訴、一縷新歓、旧恨千千縷。\n最是人間留不住、朱顔辞鏡花辞樹。\n——王国維『蝶恋花・閲尽天涯離別苦』"
 we_marry_with_hotaru_quote: "雨打灯難滅、風吹色更明。\n若飛天上去、定作月辺星。\n——李白『蛍火を詠む』"
 #无对应标题
 we_marry_with_honoka_quote: "まあ、すべては見方次第ということだ。\n仁者は仁を見、智者は智を見る。\n——007『007 スペクター』"
 we_marry_with_wataru_quote: "我亦貞苦士、与君新結婚。\n庶保貧与素、偕老同欣欣。\n——白居易『贈内』"
 #特殊
 we_unite_the_world_n_quote: "苦しみ尽きれば喜び来たる。耐え、行い、沈着であれ。\n——全斗煥"
 we_unite_the_world_d_quote: "民を貴しと為す。社稷これに次ぎ、君を軽しと為す。\n是の故に丘民に得て天子となる。\n——『孟子・尽心下』"
 we_unite_the_world_c_quote: "プロレタリア社会主義革命だけが、帝国主義と帝国主義戦争の生み出した窮境から人類を解放できる。革命がいかなる困難に遭い、いかなる一時的敗北を喫し、反革命がいかなる波を起こそうとも、プロレタリアートの最終的勝利は不可避である。\n——レーニン『ロシア共産党（ボリシェヴィキ）綱領草案』"
 we_untie_the_world_f_quote: "戦争は平和である\n自由は隷属である\n無知は力である\n——オセアニア真理省"
 we_forward_with_irno_quote: "我々に残された道はただ一つ、勝利だ！もう一つの道は死。§R死は労働者階級のものではない！§!"
 we_forward_with_makoto_quote: "未来を見据える者に栄光あれ！\n前へ進む者に栄光あれ！"
 we_unite_with_ilno_quote: "「もちろん今だ。共産主義は訪れ、永遠に続く。だが今の時代はいつか終わる。その終わりを共に見届けるのは素晴らしいことではないか？18年、19年、もしかすると20年後、我々は新時代の扉の前に立ち、こう挨拶できる。へへへ、こんにちは！」"
 we_unite_with_makoto_quote: "「あ、あとで後悔しないでよ！その時になって胸が小さいって文句を言っても、ほ、本店では解約を受け付けないんだから！」\n——三司あやせ"
