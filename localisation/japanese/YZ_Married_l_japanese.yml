###结婚事件
 get_married: "僕たち、結婚しました！"
 tongyong_event.1.t: "好感度システム"
 tongyong_event.1.d: "全体的な好感度システムが導入されます。好感度がMAXになると将軍との結婚決議が解放され、結婚後はその将軍が全面的に強化されます。また、好感度に応じて異なる国家修正（民族精神）が付与され、柚子厨の人数も修正効果に影響を与えます。計画中の個人イベントチェーンも追加の修正をもたらす予定です。"
 tongyong_event.1.a: "やったー！"
 tongyong_event.2.t: "結婚式の準備"
 tongyong_event.2.d: "結婚式の準備は、まるで美しい夢のようだ。指輪を選んだその瞬間から、この幸せはしっかりと手の中にあった。ダイヤの輝きは、まるで私たちの愛のように、煌めいて永遠に続く。\n\n式のプランを練る中で、私たちはお互いの想いに心を込めて耳を傾けた。一人は温かい式を望み、もう一人はロマンチックな宴を夢見た。だから、その両方を完璧に溶け合わせて、私たちだけの特別な結婚式を作り上げた。\n\n結婚用品を買い揃えた日々は楽しかった。美しい食器や柔らかいクッションを選びながら、新しい家に温もりを添えていった。どの品にも、これからの暮らしへの期待が込められている。\n\n慌ただしくも素敵な準備の日々の中で、私たちはより一層お互いを大切に思うようになった。この結婚式は、人生で一番忘れられない瞬間になるだろう。幸せを迎える準備は、もうできている。"
 tongyong_event.2.a: "やったー！"
 tongyong_event.3.t: "寧々との結婚式"
 tongyong_event.3.d: "今日は特別な日だ。隣に立つ寧々は真っ白なウェディングドレスをまとい、微笑みを浮かべている。「寧々、準備はいい？」「行こう。」あなたは寧々の手を引いて、壇の前まで歩いていく。\n\n壇の下にはゆず総参謀部と近衛砲兵連隊の面々がいる。寧々の参謀は笑いをこらえながら寧々にプレゼントを渡した。寧々が開けると、顔が真っ赤になった——新品の起爆装置だ。あなたは慌ててプレゼントを閉じ、箱を舞台裏に運ばせた。\n\n結婚式が始まり、あなたは改めて寧々に愛を伝える。壇の下の人々も祝福を送る。寧々が泣き出しそうになっているのに気づいたが、次の瞬間には嬉しそうな笑顔を浮かべた「みんな、ありがとう！」\n\n祝砲が7発、2発、1発と轟く中、寧々は笑顔であなたに寄りかかる：「これからよろしくね」「じゃあ、これから俺に0721を見せてくれる？」\n\nその言葉を聞いて、寧々は口を尖らせた"
 tongyong_event.3.a: "「結婚初日からそんなこと考えてるの……悪い人」"
 tongyong_event.4.t: "乃愛との結婚式"
 tongyong_event.4.d: "入場まであと十数分なのに、乃愛がまだ出てこない？\n\nドアを押し開けると、乃愛はまだ試着鏡の前でポテトチップスを食べながら少女漫画を読んでいる。「おい、入場するよ。読むのやめなって。」\n\n「焦らない焦らない」乃愛はあなたの伸ばした手をひらりとかわす。「次のページでヒーローがヒロインに告白するんだから！読み終わったら行くから、ねっ」\n\n花嫁が結婚式の前に少女漫画に夢中になるなんて！？もう、いたずらしちゃおう～\n\n乃愛が次のページをめくった瞬間、あなたは彼女の軽やかな体を抱き寄せ、無防備な耳元に顔を寄せる：「乃愛、愛してる。僕の人生のヒロインになってくれないか？」\n\n結果、乃愛はレッドカーペットで二度もよろめき、顔が赤いまま式が終わるまで続いた。\n\n本当にバカだな、自分こそがヒロインなのに、どうしてわからないんだろう。\n\nまあ、仕方ない。だって彼女は僕の天使だからね～"
 tongyong_event.4.a: "この黒き翼は、私が選んだ証"
 tongyong_event.5.t: "めぐるとの結婚式"
 tongyong_event.5.d: "今日は特別な日。かつてのいたずら好きで可愛いあの娘が、真っ白なウェディングドレスをまとってあなたの前に立っている。あなたは彼女の小さな手を握りしめて想いを伝える。すると、魔法の心のクリスタルが愛瑠の手に現れた。愛瑠は涙を浮かべて、これは生まれてこの方もらった中で一番のプレゼントだと言った。\n\n因幡愛瑠装甲兵団の兵士たちは、戦車を連ねて隊列を組みながら進み、リーダーである彼女に熱く祝福を送る。ゆず参謀部の他のメンバーは、カメラでこの素晴らしい瞬間を記録している。\n\n今、国中が結婚式の喜びに包まれている。"
 tongyong_event.5.a: "「私たちの魔法は愛のためにある」"
 tongyong_event.6.t: "アヤとの結婚式"
 tongyong_event.6.d: "式台の幕の裏で、人間に戻りウェディングドレスを着たムラサメは、それでも涙を浮かべてあなたに問いかける：「吾輩の過去の過ちは、本当に許されるのか？」彼女はあなたの胸に顔を埋めて泣く。あなたは慰める：「みんな外で待ってるよ。泣きはらしたら綺麗じゃないぞ」ムラサメは涙を拭い、泣き顔を笑顔に変えて、あなたの手を引いて壇上へ上がった。\n\n壇上で彼女は昔と同じように明るく、あなたの誓いを大らかに受け入れた。あなたは自らの手で指輪を彼女の指にはめ、壇の下からは歓声が湧き上がった。\n\n式が終わり、人々が散っていき、残ったのはあなたとムラサメだけ。「不死の身から人間に戻って、アヤちゃんは後悔してる？」\n\n「いいえ、吾輩は信じている——この五百年の見守りは、主人と出会うためにあったのだと」"
 tongyong_event.6.a: "「500年の時空を越えて出会ってくれてありがとう」"
 tongyong_event.7.t: "紬との結婚式"
 tongyong_event.7.d: "ドアがきしみ、そこにはあなたが待ちわびた姿があった。何度も見てきたはずなのに、白い姿に心臓がひとつ跳ねる。「ドレスもろくに着たことがないのに、もうウェディングドレスか。」\n\n紬は幸せそうに、そして恥ずかしそうに笑う。彼女のあの笑ってしまう魔女の契約を思い出し、思わず笑みがこぼれて頭を撫でた。彼女は満面の笑顔で、ベールを少し整えながら言う：「ねえ、あとで私を抱いて入場してね。」\n\n「いいよ」紬はとても軽く、華奢な体が腕のくぼみにぴたりと収まり、羽のように胸に寄り添う。「どうしてそんなお願いを？」「あのクマみたいな姿の時、私が何度もあなたを抱いたでしょ。今度はあなたが抱き返す番よ。」紬は首を傾げて考え込む。「これは私たちの不平等条約よ。式が終わるまで抱いていて。拒否は認めない！」\n\nついさっき交わしたばかりの条約だが、私は勝手に修正させてもらう。補償内容はこうだ——私の腕は、この一生、一番可愛くて、一番優しくて、一番心を揺さぶる椎葉紬お嬢様だけのもの。今回は最終版だ。"
 tongyong_event.7.a: "「私のお姫様、これからもずっと守り続けるよ」"
 tongyong_event.8.t: "茉子との結婚式"
 tongyong_event.8.d: "ドアの向こうでしばらくひそひそ話が続いた後、茉子は芳乃に押されながら、もじもじとスカートをたくし上げて出てきた。「ほら、茉子、こっちを見て」そっと茉子の頬を包み込む。「今日は君が主役だよ。」\n\n普段の茉子とはまるで別人だ。ウェディングドレスをまとった彼女には、神聖さと可愛らしさが増していた。周りからはラベンダーの香りがほのかに漂い、ハイヒールの上で足が落ち着かなげにすり足になる——毎日家事に追われるあのエロ忍者とは、どうしても結びつかない。\n\n「うん」茉子は細い声で応える。「すごく緊張して……私、大勢の注目を浴びるのに慣れてなくて……」慰めの言葉は喉元で飲み込んだ。言えば言うほど、彼女は最初の一歩を踏み出せなくなる。いつもいたずらするのは彼女の方だから、今日は私が悪者になろう。彼女、高所恐怖症だったよな？「緊張を一瞬で解消する方法があるんだけど」口元が緩むのを抑えきれない。「きゃっ！」茉子が悲鳴を上げ、足がふわりと地面から離れた。白いドレスを肩に担ぎ、あなたはレッドカーペットを駆け出した。\n\n緊張しないで、茉子さん。緊張はよくないよ。今日だけじゃない——これからもずっと、君は僕の人生のヒロインなんだ。"
 tongyong_event.8.a: "「これからも、君は僕の人生のヒロインだ」"
 tongyong_event.9.t: "芳乃との結婚式"
 tongyong_event.9.d: "今日は雲一つない晴天だ。私にとって、この日はただくつろげる日というだけではなく……\n\n「準備はいい？しっかりしてね？私の（）を受け取ったんだから、昨日約束したこと忘れないでね…」\n\n芳乃はすでに白いドレスに着替えていた。その目には恥じらいが、声には照れが混じっている。\n\n「うん、忘れてないよ」指輪を交わした瞬間、私は出会った頃のことを思い出さずにはいられなかった。少し距離があったし、喧嘩もしたけれど、お互いを理解し合い、冗談を言い合った……例えば、卵焼きに砂糖を入れるかどうかで一度喧嘩したっけ。でも今思えば……あれはむしろじゃれ合いだったのかな？\n\n芳乃は私の手をぎゅっと握りしめ、愛おしそうな目で優しく言う：「これからも……よろしくね…」どんな困難に遭っても、私たちは乗り越えていく。そして、その場にいる全員が私たちの証人になる。"
 tongyong_event.9.a: "「何があっても、私たちはずっと歩き続ける、永遠に」"
 tongyong_event.10.t: "あやせとの結婚式"
 tongyong_event.10.d: "今日、不完全な完璧少女は七百二十一回目の「自分は完璧じゃない」という愚痴をこぼした。「じろじろ見ないで！見続けたら頭をねじ切るわよ！」あやせは両手で胸を隠し、顔を真っ黒にしている。\n\nあなたは首をかしげる。「それがそんなに大事なの？」正直、見た目に違いはまるでない。しかしあやせはあらゆる不完全さを気にする。とても気にする。「大事よ！」あやせは歯ぎしりをやめてため息をつく。「みんなに、あなたには完璧な妻がいるって見せたいの…」「今も相変わらずバカだな。」\n\nあやせが顔を上げた瞬間、あなたの腕の中に引き寄せられた。「俺の心の中で、君はいつだって最高の参謀であり、完璧な女の子だ。あやせ、昔も、今も、これから先もずっと。これは俺たちの結婚式だ。他人の目なんて気にするな。」「もう、そうやって慰めてばかり。」\n\nそう言いながら、あやせは顔を目の前の温かい胸にすっぽり埋めた。でもね、あなたがいる毎日はみんな完璧なんだよ。ずっとあなたがいてくれてよかった。これからもあなたなしの生活なんて考えられない——完璧少女は心の中でそう思った。今日は、不完全な完璧少女が自分は完璧じゃないと愚痴る最後の日だった。"
 tongyong_event.10.a: "「これからは喧嘩や亀裂もあるかもしれない、でも二人の愛がすべてを癒す」"
 tongyong_event.11.t: "七海との結婚式"
 tongyong_event.11.d: "結婚式が始まったが、花嫁の七海は幕の裏に隠れて出てこようとしない。ゆず参謀部の他のメンバーとあなたの励ましを受け、あなたは七海の手を取ってゆっくりと壇上へ上がった。誓いの言葉を述べた後、七海は言葉に詰まり、顔を赤らめて言った：「どうやら私は、お兄ちゃんのことを一生面倒を見るしかなさそうですね……」\n\n壇の下には、かつて七海の星幽能力に癒やされた人々が大勢いる。戦士も、労働者も、農民も、幼い子供も、さらには敵国の兵士も。彼らの心の中で七海は英雄であり、今日はその英雄の結婚式の日を祝っている。今、国中が結婚式の喜びに包まれている。\n\n夜、あなたは一日の仕事を終えて家に帰る。七海はそれを見ると、走ってきてあなたに抱きつき、そっとささやいた：「"
 tongyong_event.11.a: "「おかえりなさい、お兄ちゃん！」"
 tongyong_event.12.t: "栞那との結婚式"
 tongyong_event.12.d: "新しいウェディングドレスに着替えた栞那が、とんとんと階段を駆け下り、午後の柔らかな日差しの中へ飛び込んでくる。「ねえねえ、これどう？さっきより綺麗でしょ？」言いながら軽やかにくるりと回り、白いドレスをふわりと咲かせる。公爵が窓辺の日光浴から半目を開ける。「このスケベ死神娘が珍しく真面目になるなんてな。走り回っても疲れないのか。」午後の間、あなたと公爵はそれを見ていた。「失礼ね、私はとっくに真面目よ」栞那は笑い目をあなたに向ける。「どう思う？ダーリン？」あなたは伸びをしながら、視線を公爵に残す：「僕は猫になりたいな。」\n\n「どうして？」栞那は怒ったふりをする。「結婚生活が始まる前から退屈だって言うの？」視線を栞那に戻す。「猫は九つの命があるんだ。そうすれば、死神の君と九回も出会えるだろ。」\n\n栞那のスカートがあなたの腕の中で咲く。「私は一回でいいの。この一度があれば、この一生は十分。」死神も笑う。死神も泣く。人生の旅人よ、死神を恐れるな。死神のお姉さんは、時にとても優しいのだ。本当に。"
 tongyong_event.12.a: "「死神も、人なんだよ」"
 tongyong_event.13.t: "このバカ、早く起きなさい！"
 tongyong_event.13.d: "自分の予定表の予定よりまだ少し時間はあるが、卯の花の猛攻の前には、早めに準備を始めるしかなかった。\n目の前の妹は初めて見る姿だった：頬に薄い桃色の花びらが乗ったように——紅ではなく、肌の奥から滲み出る隠しきれない色が、眉尻の喜びと溶け合っている。唇には新しく引いた口紅、ざくろのように赤く、微かに結ばれている。私の姿を見ると、またさっとうつむく。自分の目の輝きに耐えられないかのように、しかし少女の恥じらいをうっかり漏らしてしまう。\n「恥ずかしがらないで、今日の佐奈ちゃんは一番綺麗だよ！」「あなたもね。こんな可愛い妻が目の前にいるのに、何もしないで見てるだけなの？」みんなの励まし（脅し）の下で、ようやく佐奈の小さな手を握ることができた。まず微かな震えを感じる——彼女はようやく顔を上げた。私と同じ不安を宿しながら、しかしそれ以上の何かが加わっている。この一瞬の触れ合いを約束に変えたいかのように。佐奈の目が急に温かくなり、慌ててまたうつむいたが、手は離さなかった。\n本当に、叶ったんだ。だから言ったでしょ、お兄ちゃんは誰にももらわれない独身犬で、どうせお兄ちゃんみたいな役立たずと結婚したい人なんていないから、千歳家の長男としては困っちゃうし、だから妹としては仕方なく、ただのお兄ちゃんなんだから調子に乗らないでほしいって……\n何度目だろう？まあいいか。兄としては、妹に少し譲ってやらないとな。\n「おい小僧、これから佐奈をしっかり大切にするんだぞ。私の一番愛しい孫娘を任せたからな！」答えず、あなたはそっと佐奈の頬を包み、昔から何度もしてきたように、そっと唇を重ねた。少しためらいながらも、佐奈もすぐにその気持ちに応えた。\n「これからもよろしくね、お兄…」\n「あ、違う——ダーリン！」"
 tongyong_event.13.a: "恋は乱れ咲き☆ 二人の愛を舞い降りさせよう"
 tongyong_event.14.t: "ナツメ姐さんとの結婚式"
 tongyong_event.14.d: "大きな赤い提灯、八人担ぎの花嫁籠、空を劈く銅鑼と太鼓。遠くから花嫁籠が爆竹の音とともに目の前で止まる。希ちゃんのママが赤い蓋頭を被った花嫁を支えて下ろす。一瞬、薄い紅紗越しに四つの目が合った。ぱたぱたと軽やかな足音があなたの前に落ちる。\n\n「このチャイナドレス、似合ってる？」夏目はすっかり中国風の伝統的な装いで、布靴のつま先で地面に小さな輪を描いている。「もちろん綺麗だよ。今度はこの格好で喫茶店に出勤してみる？客足も伸びるかもね」夏目はあなたをぎろりと睨み、すぐに慌てて視線をそらす。「あなたと結婚式を挙げるためじゃなきゃ、こんな恥ずかしい服、絶対着ないわ」あなたは悪戯っぽく笑って蓋頭を上げ、夏目に逃げ場を与えない。\n\n「さあ、入ろう。お父さんとお母さんが待ってるよ」「きゃっ！そんなに急に引っ張らないで！」夫婦の見合いの礼をするとき、夏目がそっとあなたを呼び止めた。「好きよ。」少し照れくさそうに顔を上げる。「ずっと好きだったの。だから、心変わりは許さないから。」その目つきが急に鋭くなる——絶好のチャンス、ちょっとからかってみよう～「まだ『好き』なだけなの？何年も経ってまだ味気ない『好き』なんだ、悲しいなあ。」\n\n夏目は一瞬固まり、鋭さと気まずさの間で表情を行き来させ、最後は決心したようにあなたをじっと見つめ、飛びかかってきた。\n\n耳元を風が掠める：「愛してる。」\n\n愛は山の如く——千年の安定など求めない。一生添い遂げられれば、それで十分だ。\n\n「夏目、僕も愛してる。」"
 tongyong_event.14.a: "「その手を取り、共に老いるまで」"
 tongyong_event.15.t: "恭平との結婚式"
 tongyong_event.15.d: "祝砲と花の幕が開く中、恭平とあなたは結婚式の会場に立つ。戦火の洗礼を経て、この絆はより一層強固になっていた。\n\n喧嘩もあったが、甘い瞬間もあった。出会ったあの瞬間から運命の歯車は回り始め、愛の輝きがあなたたちを照らし、幸せな新郎新婦にした。白いドレスをまとった恭平の手を握ると、時間が止まったかのようだ。守るべき人がもう一人増えたことを知っているから。\n\n式を終え、手を繋いで教会を出る。太陽の光はまぶしいほどだ。ほんのり赤くなった恭平の顔に見惚れながら、「これからよろしくね」——二人はそう応え合った。"
 tongyong_event.15.a: "「もう独りじゃない」"
 tongyong_event.16.t: "茅羽耶との結婚式"
 tongyong_event.16.d: "人は一生で約2920万人と出会う。二人が愛し合う確率は0.000049。\n\n恋の始まりは偶然かもしれない。しかし、その花が咲き実を結ぶのは、この世に一つだけのものだ。\n\n思い返せば、心にこの想いが芽生えたあの日から、二人はどれほどの試練を乗り越えてきただろう？だが今日、すべてが実を結ぶ——私たちは正式に、互いを相手に、残りの人生を共に歩むことを決めた。結婚式の準備もすでに始まっている。まだ不器用な二人は、突然慌ただしい日々に巻き込まれていく。招待状、会場、日取り、料理、式次第……ある日は疲れ果てて、頭も洗わずに眠り込んでしまうほどだ。ただ、それは以前のような孤独な苦しみとは違う。私たちは微笑みながら、あの日を夢から現実へと呼び寄せ、少し早く迎えようとしている——そして、これからの一瞬一瞬も——"
 tongyong_event.16.a: "もう独りじゃない"
 tongyong_event.17.t: "羽月との結婚式"
 tongyong_event.17.d: "羽月との結婚式が予定通りにやってきた。羽月はウェディングドレスをまとい、あなたと肩を並べて壇上に上がる。\n\n「羽月、これからもずっと…」言い終わらないうちに、羽月は待ちきれずに頷き、古文体で自分の愛を伝えた。壇の下からは歓声が湧き上がる。\n\n式が終わり、皆が宴の席にいる頃、羽月に一本の電話が入った。彼女はすぐに更衣室で軍服に着替えて飛び出していく。あなたは慌てて後を追う。\n\n「どうしたの、こんな日に、もう少し一緒にいてくれないの？」羽月は気まずそうな顔をする。「私には使命があるの。皆の幸せを守るのが私の務めよ」\n\nあなたは彼女の手を掴む。「これからは、君の務めは僕の務めでもある。これは僕たち共通の使命だ」\n\n夕日が二人の上に降り注ぐ——それはそれは美しい光景だった。"
 tongyong_event.17.a: "「もっとたくさんの人の幸せを守りに行こう」"
 tongyong_event.18.t: "彼を私にください！"
 tongyong_event.18.d: "風実花があなたの手をぎゅっと握る。こんなに可愛い風実花を見るのは初めてだ。あなたは風実花の頭を撫でた。\n「もう……私は子供じゃないんだから、そんな慰め方しなくていいわよ。」風実花は負け惜しみを言うが、やっぱり緊張している。\n「顔合わせくらい、前にもしてるだろ。何を緊張することがあるの？」あなたは笑いながら尋ねる。\n「それは違うわ……前は担任で……お姉さんで……今は違うのよ……」風実花は顔を赤らめ、続きの言葉は言いたくても言えない。\n「今は何なの？」あなたはわざと尋ねる。\n「この意地悪……聞かなくてもわかるでしょ……」風実花はこんな時にからかわれるのが少し不満そうだが、それでも言った：「婚約者よ！これでいいでしょ！意地悪！」言い終わるとすぐに口を尖らせ、あなたの手を振りほどこうとさえする。\n「風実花姉さん、いつまでぐずぐずしてるのよ、待ちきれないわ……手伝ってあげる！」天音がどこからともなく現れ、風実花をドアの中へ押し込んだ。\n「えええ！小天音、ゆっくりで！」風実花は天音に家の中へ押し込まれ、ソファに座る由月を気まずそうに見つめる。「あの……あ、あの……おばさん、こんにちは……」風実花の頭を一瞬よぎったのは、「おばさん」と呼ぶべきか「お母さん」と呼ぶべきか——しかし恥ずかしさで、風実花は「おばさん」としか言えなかった。\n「あらあら？まだ『おばさん』なの？」天音が悪戯っぽい笑みを浮かべて風実花を見る。あなたも外から入ってきて、この気まずい空気に何か一言挟もうとする。「あらあら、風実花ちゃんが来るなんて珍しいわね。どうしたの？天音が遊びに誘ったの？」由月が風実花に話しかける。\n「お母さん～今日風実花姉さんを呼んだのは私じゃないよ、お兄ちゃんだよ。」天音はまだ火に油を注ぐ。あなたが振り返って天音を睨むと、天音は知らん顔で自分の部屋へ戻っていった。\n「お母さん、とても大事な話があるんだ。」風実花の様子を見る限り、彼女からは言い出せそうにないので、あなたが代わりに話すことにした。\n風実花があなたの手を引く。振り返ると、風実花は固い決意の表情をしていた。自分で言うつもりだ。\n「あの……おばさん、私、あなたの息子さんと結婚することに決めました……だから……彼を私にください！」風実花は力強く言った。\n婚約者を連れて帰ってきたのに、なぜ風実花はそんな言い方をするのか。あなたは少し不思議に思ったが、その場では尋ねなかった。\n「本当なの？風実花なの？前に天音からこの子が誰かと付き合ってるって聞いてたけど、まさか風実花ちゃんだったなんてね。それなら安心だわ。」由月は笑った。\n「風実花ちゃん、座って座って。お嫁さんが来たなら、夕飯をちゃんと用意しなくちゃね。ついでに子供の父ちゃんにもこの良い知らせを伝えるわ。」そう言って由月は台所へ向かう。\n「おばさん、私も手伝います……」風実花が慌てて言う。「初めて来たお嫁さんに働かせるわけにはいかないでしょ？天音！出てきて手伝いなさい！」\n「さっき、なんで『私にください』なんて言ったんだ？君は女の子だろ。」誰もいなくなったのを見計らって、あなたは小声で風実花に尋ねる。\n「決まってるでしょ！私の方が大人なんだから、あなたに責任を取らなきゃいけないのよ。」風実花は当然のように言う。\n「そうなの？でも君は普段、全然大人っぽくないけどね。」あなたは笑って言う。\n風実花も誰もいないのをいいことに、あなたの胸にすり寄り、口を尖らせて言う：「あなたの前でだけ、大人っぽくないのよ。意地悪。」\n「最近、人の前でもちょっと甘えてくるね。」あなたは優しく風実花の頭を撫でる。\n「決まってるでしょ。やっとあなたが卒業したんだから、隠す必要もなくなったの。あなたを見ると甘えたくなるの……誰が見てようが関係ないわ。」風実花がつぶやく。\nあなたはふと、風実花がいつもより可愛いと感じた。風実花が突然また顔を上げる：「だから、大人として、この小さな子をしっかり面倒見なくちゃね。」何か言おうとしたその時、風実花は立ち上がって台所へ向かった。「お母さん、私も手伝うわ！」風実花は由月に言った。\nあなたは一人ソファに座り、風実花の去っていく後ろ姿を見て笑った。風実花は二人の関係に新しい一歩を踏み出した。あなたも立ち止まってはいられない——せめて、風実花の歩みに追いつかなくては。"
 tongyong_event.18.a: "「大人だって誰かに頼りたい時がある。これからは私があなたを支えるから」"
 tongyong_event.19.t: "墨染希との結婚式"
 tongyong_event.19.d: "しゃっ、と音がして、私の布団が消えた。眠気がまぶたを重く押さえつけ、半分だけ開いた目に映る世界はひどく暗い。エプロン姿の人影がベッドのそばに門神のごとく立ち、片手にはついさっきまで私に掛かっていた布団、もう一方の手のフライ返しは冷たい光を放っている。主婦の装いなのに、主君の貫禄がある。\n\nおお、希ちゃんか。あと5分だけ寝かせてくれないか……\n\n「お兄ちゃん、起きないと仕事に遅刻するよ！布団に丸まって二度寝しようとするんじゃない！起きなさい、もう…」\n\n結局、フライ返しの威光の前に、頭部の再生能力を正しく見積もった私は、命を守るために起床を選んだ。\n\n希ちゃん——本名、墨染希——は私の幼なじみで、かつては私の彼女を務め、一ヶ月前に妻に昇格した。今は食卓の前で日々の油塩醬醋を小言のように並べている。その優しい口調は、さっきまでのフライ返し門神とはまるで別人だ。まあ、彼女のどの顔も好きだけどね。\n\n朝日はちょうどよく、陽光がさんさんと降り注ぎ、小さな家は温もりに満ちている。机の上の写真が今日の日の光に染まる——写真の中の希ちゃんは、無邪気で甘い笑顔を浮かべている。これからの平穏で何気ない日々も、二人だけの掛け替えのない思い出になると知っているからだ。\n\n手を伸ばして希ちゃんの頭を揉むと、彼女の顔はあっという間に赤くなる。寄り添うことは、ローズマリーのようなもの——数十年にわたって漂うロマンスであり、私が彼女に送り続ける、決して止まらない告白でもある。"
 tongyong_event.19.a: "「愛してるよ、希。また夜にね」"
 tongyong_event.21.t: "和奏との結婚式"
 tongyong_event.21.d: "部屋の隅に、薄く埃をかぶったギターが一本ある。このギターは彼女も私もよく知っている——ある意味、それは私たちの縁の鍵だ。この数日みんな忙しくて手入れする暇がなく、今朝になってようやく和奏が取り出して隅に置いた。\n\n私はベールを整える和奏の背中を見ながら言う：「ウェディングドレスでこれを弾いても大丈夫だよな？」\n\n和奏は振り返らず、鏡の中の自分をじっと見つめ、ドレスのどこかおかしいところを見逃すまいとしている：「私のギターの心配はいいから、自分のベースの腕前を確認したら？何でも私に聞かないで、自分で問題を解決するクセをつけなさい。」\n\n私は和奏の後ろに行き、ドレスを整えるのを手伝う：「じゃあ、演奏の途中で告白するやつ、もう一回やる？」\n\n和奏は衣装のことは放り出して振り返り、とんとんと私を叩き始めた。もともと可愛い顔に、さらに愛らしい赤みが加わる：「半年のbrave manが足りないっての？！心臓に悪い展開はやめてくれ！」\n\nもう、君の方こそ笑いが止まってないじゃないか。それに、これから演奏する曲は『非你不可（君じゃなきゃダメ）』っていうんだ。式では君の小さな心臓には我慢してもらうしかないね～"
 tongyong_event.21.a: "「これからもサプライズがいっぱいだよ、僕の和奏クイーン」"
 tongyong_event.22.t: "憧子との結婚式"
 tongyong_event.22.d: "「どう？」憧子は真っ白なウェディングドレスをまとい、正装のあなたの前に立っている。憧子の顔は幸せに満ち、顔を上げてあなたを見つめて尋ねる。\n「綺麗だよ、よく似合ってる。」あなたは憧子の両手を握った。\n「それしか言わないのね。」憧子は他に言葉を知らないあなたを少し残念に思っているようだ。\n「でも……ドレスは試着したでしょ……今さらまた聞くって、どういうこと……」あなたは本当にツッコミたい——今さら似合わないと言ったら、着替える余裕でもあるのか？\n「だって……一番いい私を見てほしかったんだもの。」\n憧子が突然放った言葉があなたの思考を遮る。思わず視線は憧子の顔に戻る。その言葉はあなたの心のど真ん中を射抜いた。\n「あなたと一生に一度の大切な日なんだから……最高の私を見せないわけにはいかないでしょ？」憧子は美しく笑う。あなたはそんな憧子を独り占めしたくなり、ぎゅっと抱きしめた。\n「あら……もう……もうすぐ結婚するのに、まだお姉さんに甘えてるの～」憧子はあなたの腕の中で笑いながらも、抱擁に応え、両手をあなたの腰に回して抱き返した。\n二人の抱擁はしばらく続いた。どれだけ経ったかわからないうちに、突然式場の扉が開いた。\n「もう……式が始まるわよ。新郎新婦はどこ？」めぐるが式場から走り出てきてきょろきょろし、そしてあなたと憧子が抱き合っているのを見つけた。\n「もう、こんな時にイチャイチャして！早く式場に入りなさい！」紬ママがめぐるに続いて出てきて、二人はどうにかあなたたちを引き剥がし、式場へ押し込んだ。\n「では、新郎新婦の入場です。」\n司会の声が聞こえる。めぐると紬ママも姿を消し、これからの主役はあなたたち二人だけだ。\nあなたと憧子は目を合わせ、腕を組んで式台へ歩いていく。\n「新郎、あなたは一生憧子さんを守ることを誓いますか？」\nあなたは片膝をつき、憧子の右手を捧げ持つ。憧子の右手の薬指の指輪がひときわ輝いている。\n「ずっとあなたと一緒にいたい。夜は一緒に眠り、朝は一緒に起きて、毎瞬一緒にいたい。あなたを私の生活の当たり前の一部にしたいし、私もあなたの生活の当たり前の一部になりたい。もうあなたを孤独にさせたくない。だから、結婚しよう。」\n憧子の頬がほんのり赤らみ、自然に答える。\n「ええ、そうしましょう。」"
 tongyong_event.22.a: "「愛する人とずっと一緒に生きて、永遠に離れない。そして今、その待ち望んだ未来が訪れる瞬間」"
 tongyong_event.23.t: "真咲との結婚式"
 tongyong_event.23.d: "牙と爪の獣亭は、今日新しい業務に挑戦してみた。\n\nオルさんの狼の尻尾は天にも届きそうにピンと立っている。彼は片手で椅子を何脚も重ねて持ち、店内のあちこちに配置していく。手伝いに来た人々は完成予想図を見ながらああだこうだ言い合い、同時にオルさんの繰り返し自慢を聞かされる：「うちの娘が結婚するんだ！」\n\n白い紗はこう掛けて、テーブルはこう配置して、テーブルクロスの柄にもこだわる。寧々が大きな磁器の花瓶のカスミソウを整えていると、鼻歌を歌う狼の尻尾が背後から近づいてくる：「ちぇっちぇっ、うちの真咲が結婚するんだ！」狼の尻尾はぷるぷると揺れながら遠ざかっていく。\n\n入り口の受付係がまだ来客の登記をしていると、突然人混みの後方から騒ぎが起こった。その中心は一本の狼の尻尾だ。あやせが書類の山から顔を上げると、大きな狼の顔が目の前に突き出ている：「ちぇっちぇっ、うちの真咲が結婚するんだ！」あやせは最高に明るい営業スマイルを浮かべ、狼の尻尾が祝いの声の波に乗って遠ざかるのを見送った。エリナがあやせの胸元を見て言う：「三司さん、やっぱりグラマーな子の方がいい人を見つけやすいのかな？」あやせは表情管理を失いかけた。\n\n厨房では鍋や皿を片付けている。あなたと真咲はカウンターにうつ伏せて、ぐつぐつ煮える料理を見守っている。真咲は眠ってしまったようだ。ふわふわの耳が呼吸に合わせて微かに上下している。一つのたくましい手があなたの肩を掴んだ：「わ・た・し・の・娘・の・真咲・が・結・婚・す・る！」その手はあなたの肩をぽんぽんと叩き、去っていった。\n\n一つの島に、一軒の店、一つの家、一生。これからもこんな日が何千日も続くのだろう。目覚めれば彼女がいて、眠る前も彼女がいる。寄り添う日々は、平凡だけど幸せだ。「一緒にいてくれてありがとう。」ふわふわの耳がぴくりと動く：「わふ？寝てる間にこっそり告白しちゃうの？」真咲はあなたの胸をとんとんと突く。「もうこんなの許さないからね。私への愛を隠しちゃダメよ。」\n\n牙と爪の獣亭は、今日から結婚式の承办も始めることになった。"
 tongyong_event.23.a: "「バカで、可愛い」"
 tongyong_event.24.t: "美羽との結婚式"
 tongyong_event.24.d: "ねえ、聞いてよ。\n\n昔々、山奥に一匹のコウモリがいた。このコウモリは天地の霊気を吸収し、修練を積んで精霊になった。このコウモリの精は生き物を傷つけず、人も食べず、ただ酢漬けの山菜が大好物だった。山麓のいくつかの村の猟師たちは、上等な酢を一瓶供えさえすれば、必ず大漁だった。\n\nその後、コウモリの精は悟りを開き、正果を修めて天に昇り、仙人になった。しかしその仙人の座も温まる暇もなく、玉帝に捧げる酢を盗み食いした罰で、下界に落とされて転生することになった。転生したその人は、吸血鬼体質になり、しかもやたらとお酢が好きになった。今日私がここででたらめを言っていなければ、みんな彼女をやきもち焼きの化身だと思うだろう。\n\n美羽、この話、どう？\n\n美羽は言った。今日はとりあえず結婚式を優先して、夜になったら裁縫セットで私のこの減らず口を縫い合わせるって。"
 tongyong_event.24.a: "「でも、一番嬉しそうに笑ってるのは彼女なんだけどね」"
 tongyong_event.25.t: "茉優との結婚式"
 tongyong_event.25.d: "今日は日よりで、結婚式にぴったりの日だ。\n\n大物に私事はない。結婚式の意味はもはや単に幸福の宣言だけではないが、長いレンズとフラッシュの隙間で、あなたたちは束の間の静けさを楽しむ。この瞬間、式場の外の銃弾の雨を心配する必要はない。\n\n出会ったあの瞬間から、運命の歯車は静かに回り始めていた。私たちは数えきれない昼夜を共に歩んできた。笑いも、涙も、喧嘩も、そして深い愛もあった。\n\n誰もが心の底からあなたたちの貢献を認めている。この結婚は兵営と民家の間に前代未聞の熱気を巻き起こし、あなたたちは紛れもない精神的リーダーとなった。\n\n結婚式の壇上に立ち、白い紗をまとった彼女がこちらへ歩いてくるのを見ると、その瞬間、時間が止まったかのようだった。私は知っている。これから私の人生には、一生手を携えて歩む人が一人増えたのだと。\n\n今日は日よりだ。式場を出たあなたは微かに目を細める。すべてが日の光に浴し、すべてが明るい。彼女はあなたの手をぎゅっと握る。「明日も同じよ」——彼女は少し首を傾げ、国を傾けるような笑顔を見せる。"
 tongyong_event.25.a: "「愛してる」"
 tongyong_event.26.t: "天音との“結婚式”"
 tongyong_event.26.d: "湿った潮風、のんびりとした波の音。小さな船には陽光が満ちている。船のこちら側にはスーツ姿のあなた、あちら側には白いドレス姿の彼女。一葉の小舟が、海の真ん中を目的もなく漂っている。\n天音は例のトレードマークの悪戯笑みを浮かべる：「雑魚兄ちゃん～太ったね～見てよ、船がそっちに傾いてるよ。世界一可愛い妹と結婚するって思ったら、運動するの忘れちゃったんじゃない？～」「してないよ！」「じゃあ早くこっちに来てよ。船が水平になったら教えてあげる。」\nあなたは知っている。船が数十キロで沈むはずがないことを。これが天音の小さな悪戯だということも。そして天音は、雑魚兄ちゃんが絶対に引っかかることを知っている。\n天音の目の前まで来て、あなたは苦笑いする：「これ以上歩いたら海に飛び込むことになるよ。」\n「じゃあ、その雑魚をもう一度釣り上げてあげる。」小さな天音が飛びついてあなたの首に抱きつく。華奢な体からは、日差しとは違う香りが漂う。ぎゅっと抱きしめる。彼女は海のように温かく、離したくない。\n熱い潮風、楽しげな波の音。小さな船には、愛が満ちている。"
 tongyong_event.26.a: "「お兄ちゃん、大好き！」"
 tongyong_event.27.t: "涼音との結婚式"
 tongyong_event.27.d: "透明で、香り豊かで、心に沁みわたる——そのケーキが、気品ある式場全体を幸福と祝いの空気で満たしている。\nこれが涼音姉さんが手作りしたケーキだ。芸術品のように精巧で、展示台の上に安らかに横たわり、ガラスの覆いの下で眠り、照明の下で輝いている。ひと目見れば、遠くから眺めるべくして、けがれなく愛でるべからざるものだとわかる。\n皆がどんなに説得しても、彼女は自分の手で、この世に一つだけのケーキを作り上げると譲らなかった。どんな手間と費用がかかろうとも。何しろ、これは涼音姉さん——勤勉な涼音姉さん、真面目な涼音姉さん、ケーキに極めて厳しく、完璧を追求する涼音姉さん——特に……これほど意義深いケーキに、なのだから。目の前の人の……彼女の心の中で私がどれほど大切な存在かは、言葉にするまでもなく、答えはとうに明らかだ。\nきっとそう思ったからこそ、彼女は思わず誇らしげに微笑んだのだろう。長年お菓子と向き合ってきたその手のように、今の彼女の笑顔もまた、クリームと果物の甘さに染まっている。あまりに甘く、あまりに温かい。世の中のすべての悩みをクリームのように溶かし、心の温もりとともに流れ去り、二度と戻らないかのようだ。\n私はこの甘く温かい余韻を噛み締めながら、気づけば指輪を載せた手を長いこと宙に浮かせていた。\n「ああ～もったいぶらないで。よこしなさい！」\n涼音姉さんは苛立たしげに文句を言いながら、私の手を掴んだ。柔らかく温かい感触が手に広がり、体の奥へ流れ込み、五臓六腑を満たしていく。\n彼女はまず自分の薬指に指輪をはめ、そして手際よくもう一つの指輪を私の手にはめた。そのままの姿勢で、何かの返事を待つように、不満そうに私の顔を見つめる。\nこの光景は実に可愛らしい。彼女の小さく可憐な唇をじっくり味わわずにいられようか？\n歓声の中、私たちは目を閉じ、固く抱き合い、一つのキスでお互いのすべてを受け入れ、「愛」という名の誓いを立てた。長く離れず、この世に他の何ものも存在せず、ただ互いの体温と必死に抑えた息遣いだけが熱く交わり合うかのようだった。\n唇の感触はあまりに重く、頭の中は真っ白になり、天国がすぐそこにあるかのようだ。ただ一つの考えだけが浮かぶ：彼女の華奢な体を抱き上げて、もっと激しくキスしたい——しかし本当にそんなことをしたら、彼女は絶対に怒るだろう。\nこみ上げる笑いがこの馬鹿げた考えを遮り、二人は名残惜しげに重ねた唇を離し、優しく見つめ合う。彼女の瞳はあまりに魅力的で、宇宙すべてを内包するかのように心を奪う。\n「さあ、ぼんやり立ってないで、ケーキを切りましょう。」\n結婚式の最後、大トリはやはりこのケーキだ。この盛大な宴を飾る最後の真珠となることは間違いない。\n私たちの大小二つの手が重なり、固く結ばれた二人の心を乗せて、洋菓子用のナイフを柔らかいケーキに深く沈め、慎重に切り分けていく。\nこれからも、私たちはこうして一緒にたくさんのケーキを作っていく。この幸せは私たちだけのものだから。だがこの甘さは——"
 tongyong_event.27.a: "この甘さを、世界のすべてに届けると誓う"
 tongyong_event.28.t: "シャーリーとの結婚式"
 tongyong_event.28.d: "人は一生で約2920万人と出会う。二人が愛し合う確率は0.000049。\n\n恋の始まりは偶然かもしれない。しかし、その花が咲き実を結ぶのは、この世に一つだけのものだ。\n\n思い返せば、心にこの想いが芽生えたあの日から、二人はどれほどの試練を乗り越えてきただろう？だが今日、すべてが実を結ぶ——私たちは正式に、互いを相手に、残りの人生を共に歩むことを決めた。結婚式の準備もすでに始まっている。まだ不器用な二人は、突然慌ただしい日々に巻き込まれていく。招待状、会場、日取り、料理、式次第……ある日は疲れ果てて、頭も洗わずに眠り込んでしまうほどだ。ただ、それは以前のような孤独な苦しみとは違う。私たちは微笑みながら、あの日を夢から現実へと呼び寄せ、少し早く迎えようとしている——そして、これからの一瞬一瞬も——"
 tongyong_event.28.a: "もう独りじゃない"
 tongyong_event.29.t: "来海との結婚式"
 tongyong_event.29.d: "夕日が来海の繊細な頬に降り注ぎ、来海のトレードマークの笑顔があなたの目に輝く。\n「この砂浜……この夕日……あの時と一緒ね。あなたがわざわざ選んでくれた場所。」あなたは来海を見ながら言う——ただ今回は、来海はウェディングドレスを着ている。\n「ここが綺麗だから、わざわざウェディングフォトを撮る場所に選んだの」来海は笑って言う。\n「君はもともと綺麗だよ。こんな背景が加われば、天使みたいだ。」あなたは来海を褒める。\n「天使はここにいるわよ……天使の目の前で他の人を天使って呼ぶなんて」乃愛があなたの頭の上から降りてきてツッコミを入れる。\n「だって、俺の心の中の天使は来海だけだから」あなたの乃愛への返答に、来海はとてもご機嫌だ。\n「ちゅっ」来海はあなたの腕に抱きつき、そっと頬にキスをした。\n「そんなに上手いこと言われたら……ご褒美をあげたくなっちゃうな」来海は髪を撫でながら、頬をほんのり赤らめて言う。\n「おっ！このカットいい感じ！これ撮ろう！」木下が突然あなたたちを呼び止める。\n「そうそう、来海、さっきの姿勢のままね。そっとキスしたあの瞬間」白石も言う。\n来海はまたあなたの腕に抱きつく——もちろん、来海の双峰もあなたの腕に押し当たる。今度は来海だけじゃなく、あなたも顔が赤くなった。\n白石がカメラマンのところで出来上がりを確認して笑い出す。木下は白石が笑っているのを見て、覗き込んで、やはり笑い出した。\n「なになに！何笑ってるの！」あなたは何がおかしいのかわからず、カメラを手に取って自分で見た。\nそして気づく——来海が急に寄ってきたせいで、あなたの表情は明らかに照れていて、顔は真っ赤で、目線は来海の方に逸れている——その瞬間が見事に写っていたのだ。\n来海はあなたの腕を組んで一緒に写真を見に来て、二人の親友と同じ表情を浮かべた。\n「この写真いいね！私がもらう！ちょうだいちょうだい！」来海はカメラマンに言う。\n「どこがいいんだよ……」あなたは小声でツッコむ。\n「この写真……私はずーっとずっと大事に保存するわ。うちの旦那さんにも照れる時があるんだって、これは保存する価値があるわね」来海は笑って言う。ただ、なぜだかその笑顔を見ると、あなたは来海の要求を断りづらくなる。もともとこの写真を消そうと思っていたのに、今となっては、彼女が喜ぶなら、文句も言えない。\n「もともと……私はあなたの格好いいところが好きだった。命を賭けて私を守ってくれて、穏やかな性格も、誰にでも優しく接するところも好き……そして今は、あなたが私の言動で照れて顔を赤くすることも知った。それで十分よ。あなたの気持ちが伝わるから」来海はあなたと見つめ合い、抱きしめた。\n「わおわお、目の前でイチャイチャしちゃって」白石が言う。\n「これからこんな時がいっぱいあるんだから、慣れておいてね」来海はあけすけに言い返す。\n「はいはい……小来海は旦那ができたら親友もいらないってわけね」木下が不満そうなふりをする。\n「はいはい、もう一度ポーズを決めて、あと二枚撮るわよ」カメラマンが来海と親友たちのじゃれ合いを遮った。\nあなたは来海を抱き、他のポーズでウェディングフォトを撮る。夕日が二人に等しく降り注ぐ——ちょうど二人が付き合い始めたあの時のように。同じ夕日の中で、あなたたちは結ばれた。そして今、また夕日の中で、共に歩むこれからの一歩一歩を見届ける。\nあなたたちは肩を並べて歩く。どんな困難に遭っても、一緒に乗り越えていく。手を携えて——穏やかで平凡な毎日を。"
 tongyong_event.29.a: "心で通じ合う"
 tongyong_event.30.t: "愛莉との結婚式"
 tongyong_event.30.d: "人は一生で約2920万人と出会う。二人が愛し合う確率は0.000049。\n\n恋の始まりは偶然かもしれない。しかし、その花が咲き実を結ぶのは、この世に一つだけのものだ。\n\n思い返せば、心にこの想いが芽生えたあの日から、二人はどれほどの試練を乗り越えてきただろう？だが今日、すべてが実を結ぶ——私たちは正式に、互いを相手に、残りの人生を共に歩むことを決めた。結婚式の準備もすでに始まっている。まだ不器用な二人は、突然慌ただしい日々に巻き込まれていく。招待状、会場、日取り、料理、式次第……ある日は疲れ果てて、頭も洗わずに眠り込んでしまうほどだ。ただ、それは以前のような孤独な苦しみとは違う。私たちは微笑みながら、あの日を夢から現実へと呼び寄せ、少し早く迎えようとしている——そして、これからの一瞬一瞬も——"
 tongyong_event.30.a: "もう独りじゃない"
 tongyong_event.31.t: "芦花との結婚後の日常"
 tongyong_event.31.d: "「田心屋が市街地に支店を出す件……もちろんいいですよ。田心屋のスイーツもドリンクも素晴らしい。支店開設に投資しましょう……その後、改めて食事でもしながら協力の詳細を確認して、契約書にサインしましょう。」大口の投資家があなたたちに言う。\nあなたは芦花と一緒に食事の席へ行った。しかし、席上で投資家がまた酒を勧めてきた。あなたはすぐに事の重大さに気づいたが、芦花は酒を飲んでしまった。投資家を見送った後、芦花は突然あなたの腕の中に倒れ込んだ。\n「芦花姉さん？大丈夫？」あなたは芦花を抱きかかえ、焦って尋ねる。\n「大丈夫～大丈夫～えへへ……まだ歩けるよ！」芦花はあなたの腕から起き上がり、よろよろと歩き出す。これはもう明らかだ——芦花姉さん、また酔っ払った！\nあなたは慌てて芦花の手を掴む。転ぶのが怖くて、芦花をぎゅっと抱きしめた。\n「どうしたのよ、ちょっと飲んだだけじゃない……酔ってないし……大げさにしないでよ～」芦花は顔を真っ赤にして言う。酒気が溢れ出しそうなほどなのに、あなたはそれでも芦花をしっかり抱きしめている。「はいはい……酔ってない酔ってない……歩く時は私の手を離さないでね」あなたは口では芦花姉さんに合わせる。芦花はあなたの手を引いて、田心屋へ帰る道を歩く。\n「ねえねえねえ、支店ができたらさ、私のこと置いていったりしない？」芦花は酔っぱらいながらも、真剣にあなたを見つめる。\n「まさか……前に芦花姉さんのことを離れないって言ったでしょ」あなたは慌てて言う。\n「え？あなた支店に行かないの……私と一緒にいるの……じゃあ支店は誰が見るの？」芦花は少し困惑した様子で言う。\n「えええ？？？」あなたも呆然とする——そしてようやく気づく。芦花が聞いているのは支店のことだと。\n「えへへ……あなたって本当に可愛いね……」芦花は笑い出す。その笑顔を見てあなたは悟る——彼女はわざと言ったのだ。\n「芦花姉さんの方がよっぽど可愛いでしょ……」あなたは負けじと言い返す。\n芦花は歩きながら突然あなたの手を引っ張り、振り返ってあなたの顔を見る：「ねえ、これってさ……夫婦店が支店を出したってことにならない？」\n「うん……それは芦花姉さんの経営が上手いからだよ。」\n「バカ、そんなこと聞いてないでしょ。」芦花はあなたの頭をこつんと叩いた。\nあなたはわざわざ芦花を褒めたのに、それでも叩かれた。さっぱりわけがわからない。\n「私が言いたいのは夫婦店ってことよ、バカ。」芦花は顔を赤らめて言う。酒を飲んだ後の赤い顔だが、今はもっと赤い。\nあなたは笑い出した。芦花はやっぱり可愛い。思わず芦花を抱きしめる。「もちろんさ、君は家の取り仕切り役で、君の言うことが全てだよ。君がいなければ、田心屋がここまで来ることはなかったし、俺がこんなに夢中になることもなかった。」あなたは芦花の耳元でそっとささやく。\n「後半の言葉は前半と何の関係があるのよ……」芦花は照れてしまう。道中ずっと顔が赤かったが、あなたは知っている——夜で暗くて見えないだけで、芦花の顔は真っ赤に染まっているに違いない。\n「芦花姉さんがずっと頑張ってきたからだよ。俺が夢中なのは、頑張り続ける芦花姉さんだからだ。」あなたは笑って言う。\n田心屋が穂織の片田舎のスイーツ店から、市街地に支店を出すまでになったのは、どれほどの芦花の心血が注がれたか、あなたが一番よく知っている。\n「ねえ、芦花姉さん」あなたは突然声をかける。\n「どうしたの？」芦花はあなたの腕の中で困惑しながら、振り返ってあなたを見ようとする——しかし振り返ろうとしたその瞬間、あなたはそっと芦花の頬にキスをした。\n「俺はいつだって芦花姉さんのそばにいるよ。君を支える……だから、この小さな家族のために頑張ってくれてありがとう。」あなたは芦花をぎゅっと抱きしめる。芦花の表情は見えないが、きっと笑っているに違いないとわかる。\n「もう……そんなこと言われたら……私ももっと頑張らなくちゃ。あなたの笑顔をもっと見るために……もっと頑張るから。」\n芦花姉さんと一緒にいると、気分は晴れやかでリラックスできる。芦花姉さんがそばにいてくれさえすれば……どんな障害も乗り越えられると信じている。芦花はそうやってあなたに自信を与えてくれるのだ。"
 tongyong_event.31.a: "「僕にとって、あなたは大切な人。あなたの嬉しそうな顔を見るために、頑張るから」"
 tongyong_event.32.t: "小春との結婚式"
 tongyong_event.32.d: "人は一生で約2920万人と出会う。二人が愛し合う確率は0.000049。\n\n恋の始まりは偶然かもしれない。しかし、その花が咲き実を結ぶのは、この世に一つだけのものだ。\n\n思い返せば、心にこの想いが芽生えたあの日から、二人はどれほどの試練を乗り越えてきただろう？だが今日、すべてが実を結ぶ——私たちは正式に、互いを相手に、残りの人生を共に歩むことを決めた。結婚式の準備もすでに始まっている。まだ不器用な二人は、突然慌ただしい日々に巻き込まれていく。招待状、会場、日取り、料理、式次第……ある日は疲れ果てて、頭も洗わずに眠り込んでしまうほどだ。ただ、それは以前のような孤独な苦しみとは違う。私たちは微笑みながら、あの日を夢から現実へと呼び寄せ、少し早く迎えようとしている——そして、これからの一瞬一瞬も——"
 tongyong_event.32.a: "もう独りじゃない"
 tongyong_event.33.t: "レーナとの結婚式"
 tongyong_event.33.d: "金髪の少女は純白の白無垢をまとい、黒い紋付き羽織袴のあなたの前に立っている。レーナがこんな衣装を着るのは初めてで、あなたは強い衝撃を受けた。なぜか、ウェディングドレスのレーナよりも美しく見える気がした。\n芳乃が、レーナをじっと見つめるあなたの背中を叩いて、我に返らせた。\n芳乃はあなたたち新夫婦を先導して入場させ、祓串を頭上で振ってお祓いをした。\nあなたはレーナの手を引き、結婚式のレッドカーペットを一緒に歩き、神主の前へ向かう。\n「不思議……日本人の結婚式って、なぜ教会で神父を呼ばないの？」レーナがごく小さな声で言う。\n神主は芳乃の父、朝武安晴だった。安晴が二人のために祝詞を読み上げる。\n芳乃は祝詞を読み終えると、清酒を満たした三つの杯を運んできた。\n「三口で飲み干して、全部で九口よ」芳乃がレーナに教える。\nレーナは一番小さな杯を手に取り、最初の一口で早くも苦い顔をする——レーナは清酒を飲んだことがなかった。清酒の衝撃は、かつて初めてわさび寿司を食べた時と変わらない。幸い、清酒はまだ飲みやすい方で、レーナはこらえながら三杯を飲み干した。\n「お二人、誓いの言葉を読み上げてください。」安晴が二人に言う。\n「これから先、何があろうとも、病めるときも健やかなるときも、貧しくとも富めるときも、いかなる苦難を経ようとも、私たちは離れず、支え合います」あなたとレーナは用意した結婚の誓いを読み上げる。\nレーナにとって、日本の結婚式の流れはあまりに理解しがたい。幸い、もう終わりに近い。正式な式の後、あなたたちは披露宴の会場へ向かう。\n「複雑すぎる……変すぎる……なんで日本の結婚式はこんなに変なの？」レーナは不思議そうにあなたを見る。この時、彼女は本当に文化の違いを実感していた——フィンランド人は新郎新婦に酒を強制したりしない！\n「でも……これも私が日本文化を好きな理由の一つよ。本当に新鮮だもの」レーナは笑顔であなたに言う。\n「だから今……あなたも日本人になったのよ。私たちの伝統に従えば……あなたはもうリヒテナウアー姓を名乗らないの」\n「うーん……それは知ってる。日本の伝統では、女性は結婚したら夫の姓を名乗るんでしょ。」レーナが言う。\n「でもでも！まだ終わってないよ！家の人と話をつけたんだ！フィンランドでもう一度結婚式をやるの！」レーナは真剣な顔であなたを見つめる。\n「でも、もう来てくれてるじゃないか……」あなたは宴席のレーナの家族を見る。みんな金髪碧眼で、レーナの両親以外は誰も見分けがつかない。\n「それでも一度は帰国して挙げるの。ちょうどいいから……あなたを私の故郷で一緒に遊べるしね」レーナは笑う。\n「オーロラが見えるあの飴、もう食べさせないでくれないか……君の故郷にはちょっと……不安があるんだ。」あなたは前にレーナの故郷から届いた飴を一口食べた時のことを思い出す。あなたも芳乃もオーロラを見た。フィンランド人は普段こうやってオーロラを見ているのか？\n「もう……私がそんなに悪い人に見える？あの時は事故だったの。本物のオーロラにはちゃんと連れて行ってあげるから。」レーナは口を尖らせて言う。\n「もちろんさ。レーナは僕のためにこんなに日本のことを勉強してくれたんだ。夫として、僕がレーナの故郷のことを対等に学ばなければ、筋が通らないだろ？」あなたは笑って言う。\nレーナはあなたが自分の夫だと自称するのを聞いて、心がふと動かされた：「そうね……じゃあ妻として、夫の面倒をしっかり見る務めを果たさなくちゃね。」\n「これから……君の故郷のことをもっともっと見せて、全部教えてくれ。」あなたは両手でレーナの手を握る。レーナの顔に笑顔が浮かんだ。\n「もちろんよ……これは……妻の務めだからね……」"
 tongyong_event.33.a: "「千年の恋が、いつか万花を咲かせますように」"
 tongyong_event.34.t: "ここに誓う、君と共に生きることを"
 tongyong_event.34.d: "「では、先輩、また明日ね。」千咲の声がパソコンのスピーカーから聞こえる。画面の中で千咲はずっと手を振って別れを告げている。\n「また明日ね、千咲。」自分の表情が自然かどうかはわからないが、それでも声の調子を穏やかにして、千咲としっかり別れの挨拶を交わした。\n「ねえ、お兄ちゃん、電話デート終わった？」\n七海がドアの外から顔を出す。\n「悪いな七海、千咲の電話が急だったから、場所の選定と準備は君に任せるしかなかったんだ。」\nなぜだか七海の笑顔は少し無理をしているように見える。一人でそんなにたくさんのことをするのは疲れるのだろう。\n「とにかく……ありがとう七海。君がいなければ本当にどうすればいいかわからなかった。」\n「はいはい、社交辞令はいいから。場所の選定と準備を送るわね。意見があったら自分で直して。私はもう寝るから。」\n七海はそう言ってあくびをした。\n「おやすみ。」\n「おやすみなさい、お兄ちゃん。」\n……\n「なんだか……今日会った瞬間から先輩、すごく元気いっぱいって感じだったよ。」\n千咲はタピオカミルクティーを手に持ち、じっと私を見つめる。\n「まあ……それは……気のせいだよ……」その口調は自分でも説得力がないと感じる……\n案の定、千咲の目に浮かぶ疑念はますます濃くなっていく。\n幸い、店員がちょうど料理を運んできて、その場を取り繕ってくれた。\n料理が次々と並ぶ中、私は用意しておいた指輪の箱を取り出す。\n千咲に向かい、片膝をつく。\n千咲の驚いた視線の中で、私はゆっくりと指輪の箱を開ける。中には、前に彼女が何気なく「デザインが素敵」と言ったダイヤの指輪が入っている。\n「千咲、君に出会った最初の瞬間から、どうしようもなく深く君に恋をしたんだ。」\n「先輩……」\n「君の明るい性格に惹かれた。誰に対しても平等に接する君に惹かれた。普通の人とは違う人を理解しようとする君の姿に惹かれた。」\n「千咲、僕と結婚してくれる？これは正式なプロポーズだ。」\n私は指輪を取り出し、千咲の方へ差し出す。\n「受けるわ、先輩。」\nその言葉とともに、指輪が千咲の指先で微かに輝いた。\nたちまち、周囲から激しい拍手が湧き上がる。通行人も、店員も、そして私のために知恵を絞ってくれた友人や家族も。\n「千咲、これからお兄ちゃんがひどいことをしたら、私に言ってね。」\n七海は千咲の両手を取った。\n「お兄ちゃんの幸せも、よろしくね。」その表情はとても真剣だ。\n「うん。」千咲の表情もとても真剣だ。\n「さて、それじゃ……」\n「キス！キス！」七海も恭平も、みんなで囃し立てる。\n私は真っ赤になった千咲を見て、千咲も茹でダコのような私を見ている。\n二人はゆっくりと……ゆっくりと……近づいていく。\n……\n「愛してるよ、千咲。」\n「先輩、私も愛してる。」"
 tongyong_event.34.a: "「君子を見て、何をか喜ばざらん」"
