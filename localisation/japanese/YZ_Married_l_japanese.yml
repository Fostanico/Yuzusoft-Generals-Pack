 tongyong_event.50183671.a: "ロリコン！！！電圧上昇！！！！"
 tongyong_event.50183671.t: "布良梓との結婚式"
 tongyong_event.50183671.d: "「ねえ……あんた、ロリコンでしょ。」直太があなたの結婚相手を見て言う。\n「私は子供なんかじゃないわ！私は大人よ！」梓は怒って跳び上がり、直太の頭を叩いた。\n「いいこいいこ～あいつは無視して。せっかくの良い日なんだから、気分を壊さないで。」あなたは梓の頭を揉みながら、微笑んで言う。\n「うーむ……あんたに子供扱いされるのは嫌なんだから……」梓は負けじと口を尖らせるが、口を尖らせることしかできない。\n「はいはい、君も子供じゃないよ、わかってる。」あなたは優しく言う。\n「あんたロリコンでしょ！私が子供じゃなかったら……私のこと好きじゃなくなるんじゃないの！」梓はさっきと正反対のことを突然言い出した。\n「え？」あなたは梓が何を言っているのかさっぱりわからない。さっきまで大人だと言っていたのに、どうして急に自分は子供だと言い出したんだ？\n「あんた……あんたが言ったんだよ……女の子は12歳を超えたらみんな老女だって……それに自分がロリコンだって認めてたじゃん……」梓は緊張しながら言う。\n「あの、あの……ずっと考えてたんだ……私がロリじゃなかったら……あんたは私のこと好きじゃなくなるんじゃないかって……」梓は取り乱して、思いつくままに話す。\n「バカだな、君は子供じゃないよ。」あなたは笑い出した。梓は結婚式の直前になってもこんなに可愛い。\n「じゃあ、私のこと好きじゃないってこと！？」梓は逆上する。\n「違うよ、バカ。俺はロリコンじゃないし、君もロリじゃない。君は成熟した大人だ。俺が好きなのは、大人になった布良梓という人間だよ。」あなたは梓をお姫様抱っこで抱き上げ、結婚式場へ向かう。\n「じゃあ……それってつまり……合法ロリってこと？」梓は小声で口を尖らせて言う。\n「合法ロリ……それも合法だろ。」\n梓は怒って小さな拳であなたの胸をどんと叩き、むくれた顔で言った："
