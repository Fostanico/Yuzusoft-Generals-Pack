 tongyong_event.73719911.t: "アトリとの誓い"
 tongyong_event.73719911.d: "「うわぁ……ご主人様、本当に私なんかアンドロイドとこういうことをするんですか……水菜萌に笑われたりしませんか？」ウェディングドレスを着たアトリが見上げて言う。\n「ここには君と僕、二人きりだよ。水菜萌にバレるわけないだろ？」君はそう返す。\n君とアトリがここに来てから、もう随分と長い時間が経った。この世界には君とアトリだけがいる。\n「でも……私、アンドロイドですよ？ご主人様、もうロボットにまで手を出すんですか！」「ボンッ！」君はアトリの頭を軽く叩く。\n「うわぁ！アンドロイドに暴力は違法ですよ！ダメです！」アトリがぷんぷん怒っている。\n「ロボット三原則じゃ、ロボットに感情を持たせることも禁止されてるぞ。君はどうなんだ？君はもうとっくに違反してるよ。」君はアトリの頬をつまみながら言う。\n「うぅ……ご主人様は意地悪です……」アトリはついに降参した。「はいはい、バカなロボ子ちゃん。今日は特別な日だから、記念に残る日にしよう。悪い印象ばかり残しちゃダメだよ」君はアトリの頭を撫でる。\n「でもでも……人間の結婚って、自分の余生を相手に捧げることだって聞いたんです……私、私……アンドロイドで、寿命がご主人様と一緒にいられるほど長くないし……」\n「バカだな、何言ってるんだ。僕たちはこの空間で一緒に一生を共にするんだろう？君の寿命が来る頃には、僕ももう老けてるさ」\n「あ……じゃあ、それは……『白頭偕老』ってやつですか？」アトリはようやく納得した。\n「そうだよ。」\n「ダメですダメです！私の機体設定には老化なんてありませんから！髪の毛も白くなりません！」アトリがまた雰囲気をぶち壊す。\n「君は本当にバカだな！」たとえ心を得たとしても、この子はやっぱりバカなロボ子だ。どうしてそこまでバカなのか、君はひどく不満に思った。\n「でもそれなら……ずっとご主人様のお世話ができますね。ご主人様の身体機能が落ちても……ずっとそばにいられます。」アトリが笑顔で言う。\n君は言葉を失った。さっきの言葉を聞いて、君の不満は一瞬で消え去った。\n「ご主人様が歩けなくなって、車椅子に乗っても、私が押して外に連れて行きますよ。あの、初めて出会った崖まで行って、一緒に夕日を見ましょうね。」アトリがとても優しい声で言う。\n「そんなこと……覚えてるのか？」君は思わずアトリの頬にそっと手を触れる。\n「ご主人様と過ごした毎瞬、ぜんぶ覚えてますよ。たとえ六十年経っても、私の記憶ハードは壊れてませんからね。高性能ですから！」アトリはそう言って笑った。\n君は目の前のアトリの笑顔を見つめた。その笑顔は何度も見てきたものだ。だが今、アトリはウェディングドレスを着て、その笑顔を見せている。一瞬で、君の意識は何十年も前に飛び、アトリと過ごした日々の一つ一つが脳裏に浮かんだ。\n「ご主人様……」アトリの声が君の思考を遮った。「ずっとずっと、そばにいますよ。ご主人様の足になって、どこにでも連れて行きますからね。」アトリはそう言った。\n「このバカ……君は結婚が何かも知らないくせに……そんなこと言うなんて……ずるいよ。」君は涙をこらえた。このバカなロボ子の前で泣くなんて、格好悪すぎる。\n「確かに、結婚が何かなんて私にはわかりません……でも、私には心があります。ご主人様の気持ちを感じ取れます。だから……心でご主人様の気持ちに応えればいいんですよね。」アトリは少し困惑した表情を見せた。彼女にとってはそれが当然のことだったのだ。\n君はアトリをぎゅっと抱きしめた。アトリの表情は最初驚いたものの、すぐに笑顔に変わり、君の背中に腕を回した。\n「アトリ、愛してるよ。」君は腕の中のアトリにそう言った。\n「知ってますよ、ご主人様。六十年前から知ってました。今、この六十年分の借りを全部返しますね。私も愛してますよ。」アトリは笑顔で言った。\nこの、君とアトリだけの世界で、君とアトリは強く抱き合った。別れを考える必要も、未来を憂う必要もない。今はただ、君とアトリが、永遠に一緒にいる。"
 tongyong_event.73719911.a: "「この海が、再び僕たちを繋ぐその日まで」"

#神秘标记点@@
 tongyong_event.11304845.a: "海老原みなせ、あなたは私にとって一番大切な人"
 tongyong_event.11304845.t: "海老原みなせとの結婚式"
 tongyong_event.11304845.d: "今日はあなたとエビちゃんの結婚式だ。当時の同級生たちが全員集まり、特別な結婚式を開いてくれた。雲雀丘由貴が優雅に指揮棒を振ると、クラリネット、トロンボーン、ティンパニが正確に『結婚行進曲』を奏で始める。あなたは、ウェディングドレスをまとった小柄で見慣れた姿が歩いてくるのを見る。皆の注目の中、あなたたちは固い誓いを立て、ダイヤの指輪を贈る。その時、音律に敏感なあなたは、トロンボーンの息遣いが少し乱れていることに気づく。だが、それでもこれはあなたが聴いた中で最高の『結婚行進曲』だ——なぜなら、今、目の前の愛しい人と唇を重ねているから。"


 tongyong_event.78375704.a: "エリナ・オーウェン、あなたは私にとって一番大切な人"
